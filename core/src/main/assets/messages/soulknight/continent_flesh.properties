soulknight.continent.flesh.fauna.fleshfauna.name=flesh
soulknight.continent.flesh.fauna.forestheart.name=heart of the forest
soulknight.continent.flesh.fauna.forestheart.epithet=guardian of the flesh forest
soulknight.continent.flesh.fauna.forestheart.desc=A heart the size of a hill that grew into a tree: wet ventricles under plates of bark, arteries branching up like a crown, and eight twisted roots it walks on. _It beats_: every beat shakes the ground _four cells around its body_, marked three turns ahead. Its crown _lets spores fall_ on whoever it hears, and _its roots burst out of the ground_ in a marked line towards the ones who keep away. The knot of veins at the base of the aorta beats harder than the rest: _that is its weak spot_.
soulknight.continent.flesh.fauna.forestheart.beat=The ground under your feet beats like a heart.
soulknight.continent.flesh.fauna.infectedgiraffe.name=infected giraffe
soulknight.continent.flesh.fauna.infectedgiraffe.epithet=the one that keeps the canopy
soulknight.continent.flesh.fauna.infectedgiraffe.desc=From afar it is still a giraffe. Up close the spots are open sores, the ribs show through the flank and halfway up the neck _it opens into a flower of flesh with teeth_. It keeps a patch of the forest: whoever walks in is _hunted down wherever they hide, until they are out of it_. Its neck comes down _like a whip_ over a long marked strip, and now and then it blooms and the spores fall all around it. The flower on its back is _its weak spot_.
soulknight.continent.flesh.fauna.infectedgiraffe.zone=You've walked into the giraffe's patch. It's coming.
soulknight.continent.flesh.fauna.rootelk.name=root elk
soulknight.continent.flesh.fauna.rootelk.epithet=the eyes of the forest
soulknight.continent.flesh.fauna.rootelk.desc=An elk gone bad: mangy hide, raw flesh and roots over its back. Its antlers are roots too, and what hangs from them like fruit _are eyes_, shut while it grazes. When it sees you _it screams, every eye opens and the whole forest around learns where you are_. Then it lowers its antlers and _charges down a marked lane_, or gores what's in front. It can be _tamed if it never saw you coming_: walk up to it in the dark while it grazes.
soulknight.continent.flesh.fauna.rootelk.scream=The elk screams and every eye on its antlers opens. The forest knows where you are!
soulknight.continent.flesh.fauna.rootelk.seen=It has seen you: it won't let you near.
soulknight.continent.flesh.fauna.rootelk.light=Your light opens its eyes. Put it out first.
soulknight.continent.flesh.fauna.fleshchimera.name=flesh chimera
soulknight.continent.flesh.fauna.fleshchimera.desc=Several animals sewn together with black thread: bare muscle between scraps of hide that don't match, each leg off a different beast (the short one makes it _limp_). The dog's head _bites what's in front_ and the three heads _roar together_ all around it, both marked first. The snake it has for a tail _bites whoever stands behind it_ without warning. The bruised scrap on its back is where the stitches gave.
soulknight.continent.flesh.fauna.fleshchimera.tail=The tail bites!
soulknight.continent.flesh.fauna.hiveboar.name=hive boar
soulknight.continent.flesh.fauna.hiveboar.desc=A boar with bone tusks carrying _a hive of flesh_ on its back. It _charges down a marked lane_, and when it shakes itself _the swarm comes out_ and falls on everyone around, each spot marked first. The stings poison. _The hive is its weak spot._
soulknight.continent.flesh.fauna.hollowbear.name=hollow bear
soulknight.continent.flesh.fauna.hollowbear.desc=A grey bear with empty sockets and _nothing inside_: its chest is a black hole crossed by ribs, with eyes looking out of the dark. It _swipes at what's in front_ (marked), and when it opens up, _what lives in there crawls out_. The hole is its weak spot, if you dare.
soulknight.continent.flesh.fauna.hollowbear.open=The bear's chest opens and something crawls out!
soulknight.continent.flesh.fauna.stiltstag.name=stilt stag
soulknight.continent.flesh.fauna.stiltstag.desc=A starved stag on legs like stilts, with a bare skull and bone antlers. _It only moves when no one is looking_: while you have it in sight it stands mid-step with its face turned to you. Look away, or let the dark take it, and it's somewhere else, closer. Its kick comes without warning, but it never finishes anyone off.
soulknight.continent.flesh.fauna.pustuletoad.name=pustule toad
soulknight.continent.flesh.fauna.pustuletoad.desc=A squat bile-green toad covered in yellow pustules. It swells up and _spits a gob of spores_ where you stand (marked), and if you get in close _it bursts its pustules_ all around itself. The spores poison and make your head spin.
soulknight.continent.flesh.fauna.boneraptor.name=bone raptor
soulknight.continent.flesh.fauna.boneraptor.desc=Raw red muscle under plates of bone, a skull full of teeth and a sickle claw. _They hunt in threes_: the one that spots you calls the others, and from a few cells off _they leap onto you_. Where they will land is marked.
soulknight.continent.flesh.fauna.watcherfawn.name=watcher fawn
soulknight.continent.flesh.fauna.watcherfawn.desc=Pale fawns with half a dozen eyes down the neck and flank, half shut while they graze. They go in herds, and _when one sees you, the whole herd turns at once to stare_: every big thing of the forest hears it. Then they run. Cornered, they kick.
soulknight.continent.flesh.fauna.watcherfawn.stare=The whole herd turns to stare at you, every eye wide open.
soulknight.continent.flesh.fauna.barklouse.name=bark louse
soulknight.continent.flesh.fauna.barklouse.desc=A flat thing of bark plates, six legs and bone jaws, living on the flesh trees. _It jumps from a few cells away_ straight onto whoever walks by and _sticks there_: the bite is small, but it slows you down.
soulknight.continent.flesh.fauna.barklouse.stuck=stuck
soulknight.continent.flesh.fauna.flayedfox.name=flayed fox
soulknight.continent.flesh.fauna.flayedfox.desc=A fox with no skin, all red muscle and white tendons. _They hunt in packs_: the first to see you howls and the rest come, closing in from every side. Their bites _open wounds_, and they follow blood from far away.
soulknight.continent.flesh.fauna.pustulemoth.name=pustule moth
soulknight.continent.flesh.fauna.pustulemoth.desc=A moth with yellowish wings dotted with glowing pustules. It flutters over whoever it finds and shakes its wings: _the spores fall on a small marked patch_ and poison.
