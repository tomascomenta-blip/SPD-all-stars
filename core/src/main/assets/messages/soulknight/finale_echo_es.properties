#Ecos de los jefes de los mundos (es)

soulknight.finale.echo.echoboss.arrives=¡%s sale de un portal del tiempo!
soulknight.finale.echo.echoboss.breaks=%s se deshace en arena y luz.

soulknight.finale.echo.priestecho.name=eco del sumo sacerdote
soulknight.finale.echo.priestecho.desc=El sumo sacerdote de los trasgos, arrancado de su propio tiempo por Thal-Vekhorr: una copia translúcida que todavía recuerda sus conjuros.\n\nGuarda las distancias y alterna _estrellas_ que estallan en balas con _meteoros_ sobre casillas marcadas. De vez en cuando levita e invoca la _estrella gigante_ sobre un héroe: sal del cuadro marcado, o hazle bastante daño antes de que caiga y el conjuro se romperá y lo dejará _aturdido_.
soulknight.finale.echo.priestecho.stars=¡El eco lanza estrellas que estallan!
soulknight.finale.echo.priestecho.meteors=¡El eco invoca meteoros!
soulknight.finale.echo.priestecho.star_call=¡Cae, estrella de las eras!
soulknight.finale.echo.priestecho.star_hint=¡Viene la estrella gigante! Sal del cuadro, o hazle %d de daño al eco antes de que caiga.
soulknight.finale.echo.priestecho.star_broken=¡La estrella gigante se rompe! El eco queda aturdido.
soulknight.finale.echo.priestecho.star_fell=¡La estrella gigante se estrella contra el suelo!
soulknight.finale.echo.priestecho.dazed=¡aturdido!

soulknight.finale.echo.knightecho.name=eco del gran caballero oscuro
soulknight.finale.echo.knightecho.desc=El gran caballero oscuro tal como era en su primera batalla, traído por Thal-Vekhorr como una sombra translúcida.\n\nSu _escudo_ para la mitad de cada golpe que le llega _de frente_ (donde acaba de moverse o de atacar). Lanza una _estocada_ por una línea marcada, cae sobre un héroe con el _salto del juicio_ (un cuadro de 3x3 marcado y un anillo de hojas) y lanza _abanicos de hojas_. Justo después de una estocada o de un salto tiene la espalda al descubierto.
soulknight.finale.echo.knightecho.blocked=bloqueado
soulknight.finale.echo.knightecho.thrust=¡El eco prepara una estocada!
soulknight.finale.echo.knightecho.leap=¡El eco va a saltar sobre %s!
soulknight.finale.echo.knightecho.leap_solo=¡El eco va a saltar sobre ti!
soulknight.finale.echo.knightecho.fan=¡El eco lanza un abanico de hojas!

soulknight.finale.echo.queenecho.name=eco de la reina varkolyn
soulknight.finale.echo.queenecho.desc=La reina varkolyn, o lo que queda de ella en los pliegues del tiempo: translúcida y con la coraza todavía entera.\n\nEscupe _ácido_ alrededor de cada héroe que ve (casillas marcadas; sigue quemando unos turnos si no te metes en el agua), dispara un _anillo de púas_ y pone _crías del eco_. Las crías desaparecen con ella.
soulknight.finale.echo.queenecho.acid=¡El eco escupe ácido!
soulknight.finale.echo.queenecho.spikes=¡Al eco le salen púas!
soulknight.finale.echo.queenecho.brood=¡El eco pone sus crías!
soulknight.finale.echo.queenecho$whelp.name=cría del eco
soulknight.finale.echo.queenecho$whelp.desc=Un varkolyn pequeño y translúcido, salido del eco de la reina. Solo muerde. Desaparece con su madre.

soulknight.finale.echo.krakenecho.name=eco del Kraken
soulknight.finale.echo.krakenecho.desc=Solo la cabeza del Kraken, asomando por un remolino pequeño que no debería estar aquí.\n\nCasi siempre tiene el _ojo_ cerrado y los golpes apenas le hacen nada. Cada pocos turnos lo _abre_: entonces recibe mucho más daño y fulmina a un héroe con la mirada por una línea marcada. Mientras tanto, un _tentáculo gigante_ sale de un charco y golpea una fila marcada, o escupe _tinta_ que ciega. No anda: se hunde y asoma en otro sitio.
soulknight.finale.echo.krakenecho.eye=¡Se abre el ojo del eco!
soulknight.finale.echo.krakenecho.shut=se cierra el ojo
soulknight.finale.echo.krakenecho.closed=¡ojo cerrado!
soulknight.finale.echo.krakenecho.dive=El eco del Kraken se hunde...
soulknight.finale.echo.krakenecho.glare=¡El ojo te fulmina con la mirada!
soulknight.finale.echo.krakenecho.slam=¡Un tentáculo gigante sale de un charco!
soulknight.finale.echo.krakenecho.ink=¡El eco escupe tinta!

soulknight.finale.echo.tharogecho.name=eco de Tharog
soulknight.finale.echo.tharogecho.desc=Tharog, Corazón del Valle, tal como era antes del hielo: una copia translúcida, más pequeña que la bestia de verdad.\n\nDa un _coletazo_ en arco por delante y te echa hacia atrás, _escupe hielo_ en un cono y _ruge_ para que caigan carámbanos alrededor de cada héroe. Todo lo marca un turno antes.
soulknight.finale.echo.tharogecho.sweep=¡El eco da un coletazo!
soulknight.finale.echo.tharogecho.breath=¡El eco escupe hielo!
soulknight.finale.echo.tharogecho.roar=¡¡GRROOOOAAARRR!!
