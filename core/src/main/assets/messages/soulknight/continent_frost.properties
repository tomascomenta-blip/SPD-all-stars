soulknight.continent.frost.fauna.frostfauna.name=frost

soulknight.continent.frost.fauna.frosthare.name=frost hare
soulknight.continent.frost.fauna.frosthare.desc=Matted grey fur stiff with frost, long ears, a red eye. Harmless: it runs. But the first one to see you _stands up and shrieks_, and everything that hunts around here hears it.
soulknight.continent.frost.fauna.frosthare.shriek=A hare stands up and shrieks. The whole moor heard that.

soulknight.continent.frost.fauna.icecrow.name=ice crow
soulknight.continent.frost.fauna.icecrow.desc=Black feathers with frosted tips, a beak of pale ice and a red eye. It flies over everything and _caws at whoever it finds_ (the moor listens). The beak opens wounds.

soulknight.continent.frost.fauna.blindwolf.name=blind wolf
soulknight.continent.frost.fauna.blindwolf.desc=Lean, dark frosted fur, a ridge of spine and _milky eyes that see nothing_: a torch is no use against them, and no use to them. They hunt _in packs, by ear alone_. Whatever one of them hears the whole pack goes to; stand still and quiet and they may walk right past you.

soulknight.continent.frost.fauna.icelarva.name=ice larva
soulknight.continent.frost.fauna.icelarva.desc=Pale blue rings you can see the dark gut through, and black pincers. It lies _buried in the snow_ and comes up under whoever steps next to it (that first bite chills, but never kills). Left alone a while, it digs back in.

soulknight.continent.frost.fauna.blackicemantis.name=black ice mantis
soulknight.continent.frost.fauna.blackicemantis.desc=Facets of black ice with white edges, four glass legs and two toothed scythes. It doesn't wander: it _waits still with the scythes up_, and whoever comes close gets them brought down across a marked band in front of it. Its head is the weak spot.

soulknight.continent.frost.fauna.sealwolf.name=seal-wolf
soulknight.continent.frost.fauna.sealwolf.desc=A seal's body under frosted fur with raw bald patches, and a wolf's head. It waits _under the black water of a hole in the ice_ and comes out at whoever walks by the edge: that bite hurts but never kills. Then it fights on land, and with nobody about it goes back under.

soulknight.continent.frost.fauna.iceelk.name=elk of the ice antlers
soulknight.continent.frost.fauna.iceelk.desc=Dark frosted hide, antlers of clear ice, a muzzle stained with blood. It grazes and leaves you be, until it's hurt or you walk right up to it: then it _bellows_ (the herd comes) and _charges down a marked lane_, going right through it. Its weak spot is the withers. _Knocked down, it lets the collar on._
soulknight.continent.frost.fauna.iceelk.standing=It has to be knocked down before it lets the collar on.

soulknight.continent.frost.fauna.flayedmammoth.name=flayed mammoth
soulknight.continent.frost.fauna.flayedmammoth.desc=No hide left: frozen muscle, tusks of bone, a skinned trunk and a blind eye. It goes by ear. It _sweeps the tusks_ across a marked band in front and throws whoever it caught, or lifts the trunk and _trumpets_: the cold air hits everything around it (marked) and leaves your head spinning.

soulknight.continent.frost.fauna.frostraptor.name=frost raptor
soulknight.continent.frost.fauna.frostraptor.desc=A big biped of frosted grey down with a crest of ice shards and a sickle claw. They hunt _in packs of two or three_: when one sees you they all come, and each one _leaps onto a marked patch_ where you stand and tears at whatever is still there.

soulknight.continent.frost.fauna.corruptwyvern.name=corrupt wyvern
soulknight.continent.frost.fauna.corruptwyvern.epithet=the shadow over the snow
soulknight.continent.frost.fauna.corruptwyvern.desc=Slate scales crusted with frost and open wounds, wings of torn membrane. It _flies in circles_ over its prey, out of reach of any sword, while _its shadow runs over the snow_. Then it hangs over a spot (the ground there is marked) and _comes down on it headfirst_. Once down it stays on the ground a few turns, breathing frost: that's when it can be hurt.
soulknight.continent.frost.fauna.corruptwyvern.dives=The wyvern's shadow stops over you. It's coming down!
soulknight.continent.frost.fauna.corruptwyvern.takes_off=The wyvern beats its torn wings and takes off again.

soulknight.continent.frost.fauna.walkingmountain.name=walking mountain
soulknight.continent.frost.fauna.walkingmountain.epithet=the glacier that walks
soulknight.continent.frost.fauna.walkingmountain.desc=A glacier on legs: three snowed peaks, tongues of blue ice and _a frozen village_ on a ledge of its back. It pays no mind to anyone _until it's hurt_. Then it stamps down a marked band in front of it, or shakes itself and _an avalanche_ comes down its flanks all around. The village can be climbed: up there its blows can't reach you, but it shakes.
soulknight.continent.frost.fauna.walkingmountain.angry=The mountain stops. Snow pours off its peaks as it turns towards you.

soulknight.continent.frost.fauna.frostshepherd.name=the Shepherd of the Frost
soulknight.continent.frost.fauna.frostshepherd.epithet=guardian of the frozen moor
soulknight.continent.frost.fauna.frostshepherd.desc=A tall giant of blue grey skin under a hooded hide cloak, with a _hooked staff of bone_ and his flock frozen in blocks of ice at his feet. The beasts of the moor that walk with him _come when he calls_. He plants the staff and _a fan of ice spikes_ comes out of the ground, or raises it and _brings the blizzard_: patches of it fall on everyone he sees. All of it is marked. Hit the hand that holds the staff.
soulknight.continent.frost.fauna.frostshepherd.calls=The Shepherd raises his staff. His flock turns towards you.
soulknight.continent.frost.fauna.frostshepherd.sees=The Shepherd of the Frost raises his head under the hood.
