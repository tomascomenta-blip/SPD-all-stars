soulknight.continent.isles.fauna.islesfauna.name=islas

soulknight.continent.wild.wildcolossus.ambush=¡%s se te echa encima de la nada!

soulknight.continent.wild.greatworm.name=gusano ciego
soulknight.continent.wild.greatworm.epithet=el que oye bajo todo
soulknight.continent.wild.greatworm.desc=Vive bajo todo el continente: una columna de carne pálida con boca de lamprea y _ni un ojo_. Solo oye. _Haz ruido_ (una pelea, un rugido, un estruendo) y viene por la roca hasta allí. El suelo _se agrieta sobre una zona marcada durante tres turnos_, sale y muerde lo que haya dentro. Se queda fuera unos turnos, _lo único en que se le puede herir_ (la garganta, en lo alto de la columna), y se vuelve a hundir.
soulknight.continent.wild.greatworm.cracks=El suelo se agrieta y tiembla. ¡Algo sube desde abajo!

soulknight.continent.isles.fauna.castaway.name=náufrago
soulknight.continent.isles.fauna.castaway.desc=Lo que queda de las expediciones de antes: un ahogado que todavía anda, con percebes de carne yog en un abrigo hecho jirones. Va arrastrándose hacia el ruido y _escupe agua negra_ por una línea marcada a quien esté a unos pasos.

soulknight.continent.isles.fauna.yogjellyfish.name=medusa yog
soulknight.continent.isles.fauna.yogjellyfish.desc=Una campana de gelatina violeta con un ojo yog flotando dentro, a un palmo del suelo y del agua. Abre los tentáculos (se marca) y _suelta una descarga_ a su alrededor que entumece un momento y corrompe.

soulknight.continent.isles.fauna.lighthousecrab.name=cangrejo-faro
soulknight.continent.isles.fauna.lighthousecrab.desc=Un cangrejo enorme que lleva un faro en ruinas por caparazón, con la linterna aún encendida en su jaula de hierro. _Su haz barre una franja marcada_, ciega y _te arrastra hacia las pinzas_. Su punto débil es donde la torre se clava en el caparazón.
soulknight.continent.isles.fauna.lighthousecrab.lamp=Su linterna titila: quiere una antorcha sagrada para ella antes de dejarse poner el collar.

soulknight.continent.isles.fauna.inkeel.name=anguila de tinta
soulknight.continent.isles.fauna.inkeel.desc=Una anguila negra larga como un barco que repta por la orilla. Se alza y _se lanza por una franja corta marcada_, o _escupe una bola de tinta_ que revienta sobre una zona marcada: quema y ciega. Pégale en las agallas.

soulknight.continent.isles.fauna.tideoctopus.name=pulpo de marea
soulknight.continent.isles.fauna.tideoctopus.epithet=los brazos de la marea
soulknight.continent.isles.fauna.tideoctopus.desc=Un manto alto y mojado color tinta con placas de carne yog que brillan, y ocho brazos tendidos por el suelo. _Da latigazos con dos brazos por una franja marcada_ y, si lo aprietas, _echa una nube de tinta_ sobre una zona grande que te deja ciego. Tiene los ojos bajo el manto: trépalo.

soulknight.continent.isles.fauna.islandlizard.name=lagarto-isla
soulknight.continent.isles.fauna.islandlizard.epithet=la isla que respira
soulknight.continent.isles.fauna.islandlizard.desc=Dormido _es una isla_: un montículo de tierra yog con árboles retorcidos, rocas y un anillo de espuma. Solo lo delatan la punta de la cola y un párpado cerrado en la orilla. _Písalo y despierta_, se sacude a todos del lomo y se le abren los ojos de la espalda. Despierto muerde por una franja marcada delante y se revuelve a su alrededor.
soulknight.continent.isles.fauna.islandlizard.wakes=La isla se estremece bajo tus pies... ¡y abre los ojos!

soulknight.continent.isles.fauna.yogtrueform.name=YOG, forma verdadera
soulknight.continent.isles.fauna.yogtrueform.epithet=lo que siempre estuvo bajo las islas
soulknight.continent.isles.fauna.yogtrueform.desc=Una montaña de carne yog con tres humores. _Cerrada_, va acorazada de placas de hueso, golpea el suelo y llama a su prole. A dos tercios las placas se rompen y _se abre el gran ojo_: te mira con un haz marcado, y al ojo se le puede pegar. A un tercio _se raja bajo el ojo y florece_: la luz cae sobre todos a la vez y ya no descansa. Cada golpe suyo corrompe.
soulknight.continent.isles.fauna.yogtrueform.phase2=Las placas de hueso se rompen. El gran ojo se abre... y te mira.
soulknight.continent.isles.fauna.yogtrueform.phase3=Yog se raja bajo el ojo. ¡Florece una boca llena de luz!
soulknight.continent.isles.fauna.yogtrueform.brood=Su carne se abomba y sale la prole.
soulknight.continent.isles.fauna.yogtrueform.true_end=Yog cae, y las %d gotas de esencia sagrada que lleváis arden con fuerza. El portal puede cerrarse para siempre.
soulknight.continent.isles.fauna.yogtrueform.not_enough=Yog cae, pero solo lleváis %1$d de las %2$d gotas de esencia. Su carne ya se está moviendo otra vez...
