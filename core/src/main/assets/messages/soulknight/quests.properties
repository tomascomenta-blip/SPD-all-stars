soulknight.quests.tourneyquest.easy_1=champion swordsman
soulknight.quests.tourneyquest.easy_2=black knight of the lists
soulknight.quests.tourneyquest.hard_0=Sir Bastion
soulknight.quests.tourneyquest.hard_1=the Slime King
