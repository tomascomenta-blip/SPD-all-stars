soulknight.quests.greytusk.status_wait=Licking its wounds...
soulknight.quests.greytusk.status_snared=Caught in the snare!
soulknight.quests.greytusk.status_dazed=Dazed
soulknight.quests.greytusk.notice=GRRRUOOOH!
soulknight.quests.greytusk.notice_2=*snorts and paws the ground*
soulknight.quests.greytusk.notice_3=GRRRAAAH!
soulknight.quests.greytusk.notice_4=*squeals, cornered in its den*
soulknight.quests.greytusk.back=Grey Tusk charges again!
soulknight.quests.greytusk.flee=*squeals and runs*
soulknight.quests.greytusk.den=Grey Tusk takes shelter in its den
soulknight.quests.greytusk.phase_2=Grey Tusk runs off smashing walls
soulknight.quests.greytusk.phase_3=Grey Tusk is enraged and runs again!
soulknight.quests.greytusk.phase_4=Grey Tusk runs to its den!
soulknight.quests.greytusk.snared=Caught!
soulknight.quests.greytusk.snared_log=Grey Tusk is caught in the snare! (%d)
soulknight.quests.greytusk.call=*calls its young*
soulknight.quests.greytusk.charge=Charge!
soulknight.quests.greytusk.dazed=Dazed!
soulknight.quests.greytusk.slain=Grey Tusk has fallen. Bring its tusk to the old hunter.
soulknight.quests.greytusk.slain_bonus=Grey Tusk has fallen in a clean hunt! Bring its tusk to the old hunter.
soulknight.quests.greytusk$boarlet.name=young boar
soulknight.quests.greytusk$boarlet.desc=A striped boar piglet. Small, but it bites hard.

###the caiman of the sewers
soulknight.quests.caimanquest.dry=The sewer worker closed the drains: Goo's room is dry and it can't heal in the water.
soulknight.quests.caimanquest.followed=The caiman of the sewers has found its way to Goo's room!
soulknight.quests.caimanquest$sewerman.name=old sewer worker
soulknight.quests.caimanquest$sewerman.desc=A sewer worker of the old days, with blue overalls, rubber boots, a lantern and a hooked pole. He knows every pipe of these sewers.
soulknight.quests.caimanquest$sewerman.intro=The young ones say it's a legend. Ha! I've seen it with these eyes: a caiman the size of a boat, living in the big channel of this floor.\n\nIt hides under the water and nobody can scratch it in there. But on dry floor it's slow and soft. Get it out of the water and finish it.\n\nKill it on dry ground, not a drop of water in between, and you'll get my best. And I'll close the drains down below: something big and slimy is splashing around there.
soulknight.quests.caimanquest$sewerman.intro_hint=QUEST: kill the CAIMAN OF THE SEWERS in the channel of this floor and bring its tooth to the old sewer worker. Under water it barely takes damage; on DRY floor it takes more. Finish it on dry ground for a better reward.
soulknight.quests.caimanquest$sewerman.hint_0=In the big channel. If you see two eyes over the water, stay off the edge.
soulknight.quests.caimanquest$sewerman.hint_1=Back off to dry floor: it'll come after you, and that's when it's weak.
soulknight.quests.caimanquest$sewerman.hint_2=If it grabs you, it'll drag you into the water. Don't stay next to it too long.
soulknight.quests.caimanquest$sewerman.bring=You killed it! Bring me the tooth, I can't believe it.
soulknight.quests.caimanquest$sewerman.thanks=It's true! The caiman of the sewers! Take what you want.
soulknight.quests.caimanquest$sewerman.thanks_bonus=And on dry ground, as I said! You've earned the best.
soulknight.quests.caimanquest$sewerman.after=I closed the drains down below. Good luck with what lives there.
soulknight.quests.caimanquest$sewerman.reward=Pick your reward:\n\n_Caiman hide_: light armor; while you stand in water you take a quarter less damage.\n_Sewer hook_: a long pole (reach 2) that sometimes pulls the enemy closer.\n_Sewer lantern_: an artifact; lit, it lights up the surroundings and shows their traps and secret doors.
soulknight.quests.caimanquest$sewerman.reward_bonus=Well done on dry ground! Your reward is worth more (+1):\n\n_Caiman hide_: light armor; while you stand in water you take a quarter less damage.\n_Sewer hook_: a long pole (reach 2) that sometimes pulls the enemy closer.\n_Sewer lantern_: an artifact; lit, it lights up the surroundings and shows their traps and secret doors.
soulknight.quests.caimanquest$sewerman.got=You get: %s.
soulknight.quests.caimanquest$caimantooth.name=caiman tooth
soulknight.quests.caimanquest$caimantooth.desc=A conical tooth as long as your finger. The old sewer worker will want to see it.
soulknight.quests.caimanquest$caimanhide.name=caiman hide
soulknight.quests.caimanquest$caimanhide.desc=Green scales tanned into light armor. While you stand in water, you take a quarter less damage.
soulknight.quests.caimanquest$sewerhook.name=sewer hook
soulknight.quests.caimanquest$sewerhook.desc=The old pole of the sewer worker, with an iron hook at the end. It reaches two cells and sometimes hooks the enemy and pulls it closer.
soulknight.quests.caimanquest$sewerlantern.name=sewer lantern
soulknight.quests.caimanquest$sewerlantern.desc=An iron lantern with yellow glass. Lit, it gives you light and maps %d cells around, showing traps and secret doors. It fills back slowly.
soulknight.quests.caimanquest$sewerlantern.desc_ready=The lantern is ready.
soulknight.quests.caimanquest$sewerlantern.desc_charging=The lantern is filling.
soulknight.quests.caimanquest$sewerlantern.ac_light=LIGHT
soulknight.quests.caimanquest$sewerlantern.no_charge=The lantern needs more oil.
soulknight.quests.caimanquest$sewerlantern.lit=The lantern lights up the surroundings.
soulknight.quests.caimanquest$sewerlantern.lit_found=The lantern shows something hidden!
soulknight.quests.caimanquest$sewerlantern.ready=Your lantern is ready again.
soulknight.quests.caimanquest$sewerlantern.levelup=Your lantern shines brighter.

soulknight.quests.caiman.name=caiman of the sewers
soulknight.quests.caiman.desc=A huge caiman living in the channels of the sewers. Under water it can barely be hurt; out of it, it is slow and weak.
soulknight.quests.caiman.subtitle=the legend of the channel
soulknight.quests.caiman.defeated=The caiman of the sewers has fallen!
soulknight.quests.caiman.status_1=Phase I
soulknight.quests.caiman.status_2=Phase II · The death roll
soulknight.quests.caiman.status_3=Phase III · Fury
soulknight.quests.caiman.status_under=Under water: barely takes damage
soulknight.quests.caiman.status_land=On dry floor! Takes more damage
soulknight.quests.caiman.notice=*two yellow eyes rise over the water*
soulknight.quests.caiman.phase_2=The caiman grabs and drags into the water
soulknight.quests.caiman.phase_3=The caiman is enraged!
soulknight.quests.caiman.rats=*the rats of the channel come at the smell of blood*
soulknight.quests.caiman.roll=It grabs you!
soulknight.quests.caiman.dragged=The caiman drags you into the water!
soulknight.quests.caiman.slain=The caiman has fallen. Bring its tooth to the old sewer worker.
soulknight.quests.caiman.slain_dry=Finished on dry floor! Bring its tooth to the old sewer worker.

###the tournament of the herald (Kingdom, floor 8)
