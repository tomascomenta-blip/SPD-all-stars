###the rock worm (Caves)
soulknight.quests.wormquest.cover=The old tunnels of the worm give cover: whoever stands in one takes half the damage.
soulknight.quests.wormquest.followed=The rock worm has dug its way to the room of DM-300!
soulknight.quests.wormquest$dwarfminer.name=old dwarf miner
soulknight.quests.wormquest$dwarfminer.desc=A white-bearded dwarf with a brass helmet and a candle on top. He smells of rock dust and dark ale.
soulknight.quests.wormquest$dwarfminer.intro=Stop right there! This mine is coming down. There's a rock worm the size of a tunnel digging under our feet, and every time it pokes its head out half a gallery caves in.\n\nYou can't touch it underground. Wait for it to come up, the floor shakes first, and then give it everything.\n\nKill it before it comes up too many times and the mine is saved... and you'll get the best of my workshop.
soulknight.quests.wormquest$dwarfminer.intro_hint=QUEST: kill the ROCK WORM and bring its tooth to the dwarf miner. Underground it can't be hurt; it comes up under your feet (the marked floor shakes). Kill it before it comes up 7 times for a better reward.
soulknight.quests.wormquest$dwarfminer.hint_0=When the floor shakes, get off the marked cells.
soulknight.quests.wormquest$dwarfminer.hint_1=When it comes up it stays out a few turns. That's your chance!
soulknight.quests.wormquest$dwarfminer.hint_2=The ceiling falls where it comes up. Don't stand under it.
soulknight.quests.wormquest$dwarfminer.bring=You killed it! Bring me that tooth, I'll hang it on the door.
soulknight.quests.wormquest$dwarfminer.thanks=By the beards of my grandfathers! The mine is safe. Pick.
soulknight.quests.wormquest$dwarfminer.thanks_bonus=And almost no cave-ins! You've earned the best of the workshop.
soulknight.quests.wormquest$dwarfminer.after=Its tunnels are still down there. Maybe they'll help you some day.
soulknight.quests.wormquest$dwarfminer.reward=Pick your reward:\n\n_Worm tooth drill_: a heavy mace; one in five blows goes through armor.\n_Stone scale mail_: mail armor; blows that don't come from up close (rocks, bullets, blasts) deal 20 % less.\n_Sack of dwarven powder_: an artifact that now and then fills up enough to make a bomb.
soulknight.quests.wormquest$dwarfminer.reward_bonus=The mine is saved! Your reward is worth more (+1):\n\n_Worm tooth drill_: a heavy mace; one in five blows goes through armor.\n_Stone scale mail_: mail armor; blows that don't come from up close (rocks, bullets, blasts) deal 20 % less.\n_Sack of dwarven powder_: an artifact that now and then fills up enough to make a bomb.
soulknight.quests.wormquest$dwarfminer.got=You get: %s.
soulknight.quests.wormquest$wormtooth.name=tooth of the rock worm
soulknight.quests.wormquest$wormtooth.desc=A curved tooth as hard as granite. The dwarf miner is waiting for it.
soulknight.quests.wormquest$wormdrill.name=worm tooth drill
soulknight.quests.wormquest$wormdrill.desc=A dwarven mace with a tooth of the rock worm as its head. One in five blows finds a crack and goes through armor.
soulknight.quests.wormquest$stonescalemail.name=stone scale mail
soulknight.quests.wormquest$stonescalemail.desc=Mail covered in plates from the hide of the worm. Blows that don't come from up close (rocks, bullets, blasts) deal 20 % less.
soulknight.quests.wormquest$powdersack.name=sack of dwarven powder
soulknight.quests.wormquest$powdersack.desc=A leather sack that gathers powder by itself. When it's full, you can take a bomb out of it.
soulknight.quests.wormquest$powdersack.desc_ready=The sack is full.
soulknight.quests.wormquest$powdersack.desc_charging=The sack is filling.
soulknight.quests.wormquest$powdersack.ac_make=TAKE BOMB
soulknight.quests.wormquest$powdersack.no_charge=The sack needs more powder.
soulknight.quests.wormquest$powdersack.made=You take a bomb out of the sack.
soulknight.quests.wormquest$powdersack.ready=Your sack of powder is full.
soulknight.quests.wormquest$powdersack.levelup=Your sack of powder fills faster.
soulknight.quests.wormquest$wormtunnels.desc=An old tunnel of the rock worm. Whoever is inside takes half the damage.
soulknight.quests.rockworm.name=rock worm
soulknight.quests.rockworm.desc=A huge worm of stone that digs under the floor. Underground it can't be hurt; when it comes up, the cave caves in around it.
soulknight.quests.rockworm.subtitle=the devourer of the mine
soulknight.quests.rockworm.defeated=The rock worm has fallen!
soulknight.quests.rockworm.status_1=Phase I
soulknight.quests.rockworm.status_2=Phase II · Larvae
soulknight.quests.rockworm.status_3=Phase III · Fury
soulknight.quests.rockworm.status_under=Underground: it can't be hurt
soulknight.quests.rockworm.status_up=Out! Attack it now!
soulknight.quests.rockworm.notice=*the rock creaks and the floor shakes*
soulknight.quests.rockworm.rumble=The floor shakes under your feet!
soulknight.quests.rockworm.phase_2=The rock worm brings its larvae
soulknight.quests.rockworm.phase_3=The rock worm is enraged!
soulknight.quests.rockworm.slain=The rock worm has fallen. Bring its tooth to the dwarf miner.
soulknight.quests.rockworm.slain_bonus=The worm fell before it could bring the mine down! Bring its tooth to the dwarf miner.
soulknight.quests.rockworm$larva.name=worm larva
soulknight.quests.rockworm$larva.desc=A pale larva of the rock worm. It bites hard.

###the maintenance android (Starship)
soulknight.quests.androidquest.shutdown=The core of M-4 shuts down! The ship shows you where every creature of the floor is.
soulknight.quests.androidquest.banner_shutdown=M-4 disconnected
soulknight.quests.androidquest.awake=M-4 is online! The stairs lock down: find the emergency hatch.
soulknight.quests.androidquest.banner_awake=M-4 ONLINE! RUN!
soulknight.quests.androidquest.boot_start=The creatures start the boot of M-4! The more of them stand, the faster it goes.
soulknight.quests.androidquest.boot_sub=boot sequence in progress
soulknight.quests.androidquest.hatch_found=The radar marks the emergency hatch.
soulknight.quests.androidquest.ship_helps=The ship tracks the queen with its radar: you'll see her without noise and the airlock will recharge sooner.
soulknight.quests.androidquest.hive_grown=The hive grew on the energy of M-4: it starts bigger.
soulknight.quests.androidquest$terminal.name=ship terminal
soulknight.quests.androidquest$terminal.desc=A console that still works. The voice of the ship crackles through its speaker.
soulknight.quests.androidquest$terminal.desc_boot=Boot of M-4: %d %%.
soulknight.quests.androidquest$terminal.intro=*bzzt* ...ALERT. The creatures are trying to reactivate maintenance unit M-4 for hostile purposes. Once online, M-4 is indestructible.\n\nRecommended protocol: enter the maintenance bay, eliminate the intruders and destroy the power core before the boot sequence completes.\n\nThe more intruders remain active, the faster it progresses. *bzzt*
soulknight.quests.androidquest$terminal.intro_hint=QUEST: break the CORE of M-4 before the creatures turn it on (it starts when you enter its bay; the more of them live, the faster). If it turns on: it can't be hurt and you must flee through the emergency hatch. Shut it down before 50 % for a better reward.
soulknight.quests.androidquest$terminal.hint=*bzzt* The maintenance bay is near. Get ready before going in.
soulknight.quests.androidquest$terminal.hurry=*bzzt* The boot is progressing! The core, quick!
soulknight.quests.androidquest$terminal.run=*BZZT* RUN! Find the emergency hatch!
soulknight.quests.androidquest$terminal.after=*bzzt* Thank you for your cooperation. The ship will be with you.
soulknight.quests.androidquest$terminal.reward=*bzzt* In gratitude, the ship offers you equipment of M-4:\n\n_Hydraulic fist_: a heavy weapon that sometimes throws the enemy back.\n_Spare cell_: an artifact; plugged in, it recharges your wands and guns.\n_Plasma projector_: an artifact; it wraps you in a plasma shield.
soulknight.quests.androidquest$terminal.reward_bonus=*bzzt* Clean shutdown. The ship offers you its best equipment (+1):\n\n_Hydraulic fist_: a heavy weapon that sometimes throws the enemy back.\n_Spare cell_: an artifact; plugged in, it recharges your wands and guns.\n_Plasma projector_: an artifact; it wraps you in a plasma shield.
soulknight.quests.androidquest$terminal.got=You get: %s.
soulknight.quests.androidquest$core.name=core of M-4
soulknight.quests.androidquest$core.desc=The power core of the android. If it breaks, M-4 will never turn on again.
soulknight.quests.androidquest$androidm4.name=M-4
soulknight.quests.androidquest$androidm4.desc=A huge maintenance unit, shut down on its charging dock.
soulknight.quests.androidquest$androidm4.desc_awake=M-4 is online and indestructible. Each of its blows takes a quarter of your life. Run!
soulknight.quests.androidquest$androidm4.subtitle=maintenance unit
soulknight.quests.androidquest$androidm4.defeated=M-4 shuts down.
soulknight.quests.androidquest$androidm4.status_boot=Boot: %d %%
soulknight.quests.androidquest$androidm4.status_awake=INDESTRUCTIBLE · run to the hatch
soulknight.quests.androidquest$androidm4.notice=TARGETS LOCATED. STARTING MAINTENANCE.
soulknight.quests.androidquest$androidm4.immune=No effect!
soulknight.quests.androidquest$hydraulicfist.name=hydraulic fist
soulknight.quests.androidquest$hydraulicfist.desc=The hydraulic arm of M-4, fitted for a hand. Three in ten blows throw the enemy two cells back.
soulknight.quests.androidquest$sparecell.name=spare cell
soulknight.quests.androidquest$sparecell.desc=The spare power cell of M-4. It charges by itself; plugged in, it gives %d charge(s) to every wand and gun you carry.
soulknight.quests.androidquest$sparecell.desc_ready=The cell is charged.
soulknight.quests.androidquest$sparecell.desc_charging=The cell is charging.
soulknight.quests.androidquest$sparecell.ac_plug=PLUG IN
soulknight.quests.androidquest$sparecell.no_charge=The cell isn't charged yet.
soulknight.quests.androidquest$sparecell.plugged=Your weapons get %d charge(s)!
soulknight.quests.androidquest$sparecell.ready=Your spare cell is charged.
soulknight.quests.androidquest$sparecell.levelup=Your spare cell holds more energy.
soulknight.quests.androidquest$plasmashield.name=plasma projector
soulknight.quests.androidquest$plasmashield.desc=A shield projector of the ship. It charges while you fight; turned on, it gives you %d plasma shielding.
soulknight.quests.androidquest$plasmashield.desc_ready=The projector is ready.
soulknight.quests.androidquest$plasmashield.desc_charging=The projector is charging.
soulknight.quests.androidquest$plasmashield.ac_raise=TURN ON
soulknight.quests.androidquest$plasmashield.no_charge=The projector isn't ready yet.
soulknight.quests.androidquest$plasmashield.raised=A plasma shield wraps around you!
soulknight.quests.androidquest$plasmashield.ready=Your plasma projector is ready.
soulknight.quests.androidquest$plasmashield.levelup=Your plasma projector is stronger.

###the flooded lab (Undersea)
soulknight.quests.labquest.sealed=Bulkhead sealed (%d/3).
soulknight.quests.labquest.all_sealed=All three bulkheads are sealed! Go back to the scientist.
soulknight.quests.labquest.banner_done=Lab sealed
soulknight.quests.labquest.burst=The bulkheads burst! Something huge comes out of the lab...
soulknight.quests.labquest.banner_burst=The bulkheads have burst!
soulknight.quests.labquest.hurry=The pressure rises! %d turns left.
soulknight.quests.labquest.hud=Bulkheads %d/3 · pressure: %d
soulknight.quests.labquest.bolt=A lightning bolt strikes the tentacle of the Kraken!
soulknight.quests.labquest$scientist.name=sorry scientist
soulknight.quests.labquest$scientist.desc=A scientist with a lab coat stained with algae and fogged glasses. He looks like he hasn't slept in weeks.
soulknight.quests.labquest$scientist.intro=Finally someone alive! I... I helped create subjects 001, 002 and 004. They escaped from the lab and now the pressure of the sea is bursting the bulkheads.\n\nIf they burst, what we kept in the big tank will come out: a young of the Kraken. Please, seal the three bulkheads before it's too late. One is here; the other two are in the rooms farthest from here. I've marked them on your map.\n\nEach one needs three turns of the wheel. Hurry!
soulknight.quests.labquest$scientist.intro_hint=QUEST: seal the 3 BULKHEADS within %d turns (one in the lab and two far from it, in the rooms marked on your map; 3 turns at each wheel). In time, the lightning of the Kraken will fall on its tentacles. If not, an ammonite comes out. With half the time to spare, the reward will be better.
soulknight.quests.labquest$scientist.hint_0=%d bulkheads left! Don't stop!
soulknight.quests.labquest$scientist.hint_1=The other bulkheads are far from here. %d left!
soulknight.quests.labquest$scientist.hint_2=Three turns of each wheel. %d left!
soulknight.quests.labquest$scientist.failed=I'm sorry... I'm so sorry...
soulknight.quests.labquest$scientist.thanks=You did it! The sea won't get in anymore. Please, take something from the lab.
soulknight.quests.labquest$scientist.thanks_bonus=And with time to spare! You've earned the best I have.
soulknight.quests.labquest$scientist.after=I changed the numbers of the lightning rod up on the surface. When the storm comes, it'll strike the Kraken... more or less.
soulknight.quests.labquest$scientist.reward=Pick what you want from the lab:\n\n_Diving suit_: scale armor; under the sea you use half the air.\n_Harpoon glaive_: a long glaive (reach 2) that sometimes tears and makes bleed.\n_Stabilised sample_: an artifact; drunk, it heals and cleanses poisons and ailments, and the vial fills back.
soulknight.quests.labquest$scientist.reward_bonus=With time to spare! The best of the lab (+1):\n\n_Diving suit_: scale armor; under the sea you use half the air.\n_Harpoon glaive_: a long glaive (reach 2) that sometimes tears and makes bleed.\n_Stabilised sample_: an artifact; drunk, it heals and cleanses poisons and ailments, and the vial fills back.
soulknight.quests.labquest$scientist.got=You get: %s.
soulknight.quests.labquest$bulkhead.name=lab bulkhead
soulknight.quests.labquest$bulkhead.desc=A leaking watertight bulkhead. Three turns of the wheel will seal it.
soulknight.quests.labquest$bulkhead.desc_sealed=Sealed.
soulknight.quests.labquest$bulkhead.turning=You turn the wheel (%d/3).
soulknight.quests.labquest$bulkhead.stuck=The wheel is stuck. Maybe someone from the lab knows how to move it.
soulknight.quests.labquest$bulkhead.too_late=Too late: the bulkhead has burst already.
soulknight.quests.labquest$divesuit.name=diving suit
soulknight.quests.labquest$divesuit.desc=The reinforced diving suit of the lab. It protects like scale armor and, under the sea, you use half the air.
soulknight.quests.labquest$harpoonglaive.name=harpoon glaive
soulknight.quests.labquest$harpoonglaive.desc=A glaive with a barbed harpoon head. It reaches two cells and one in four blows tears and makes bleed.
soulknight.quests.labquest$stablesample.name=stabilised sample
soulknight.quests.labquest$stablesample.desc=A vial of the stabilised serum of the lab. Drunk, it heals %d life and cleanses poisons and ailments; then it fills back slowly.
soulknight.quests.labquest$stablesample.desc_ready=The vial is full.
soulknight.quests.labquest$stablesample.desc_charging=The vial is filling.
soulknight.quests.labquest$stablesample.ac_drink=DRINK
soulknight.quests.labquest$stablesample.no_charge=The vial isn't full yet.
soulknight.quests.labquest$stablesample.drunk=The serum runs through your body and you feel much better.
soulknight.quests.labquest$stablesample.ready=Your stabilised sample is ready.
soulknight.quests.labquest$stablesample.levelup=Your stabilised sample is stronger.
soulknight.quests.ammonite.name=ammonite
soulknight.quests.ammonite.desc=A young of the Kraken in a spiral shell. From the front, the shell stops half the damage until it cracks.
soulknight.quests.ammonite.subtitle=the young of the Kraken
soulknight.quests.ammonite.defeated=The ammonite has fallen!
soulknight.quests.ammonite.status_1=Phase I · The shell
soulknight.quests.ammonite.status_2=Phase II · Broken shell
soulknight.quests.ammonite.status_3=Phase III · The servants
soulknight.quests.ammonite.status_roll=Rolling in its shell: it can't be hurt
soulknight.quests.ammonite.notice=*the shell turns and the tentacles unfold*
soulknight.quests.ammonite.phase_2=The shell of the ammonite cracks!
soulknight.quests.ammonite.phase_3=The ammonite calls the servants of its father
soulknight.quests.ammonite.call=*a screech heard all over the floor*

###the great golem (City)
soulknight.quests.golemquest.rune_out=You put out a rune! %d still lit.
soulknight.quests.golemquest.core_ready=The core of the golem hums in your hands: it's ready for the king.
soulknight.quests.golemquest.core_stuns=The core of the golem bursts into light and stuns the Dwarf King!
soulknight.quests.golemquest.guards=The great golem has come to guard the throne!
soulknight.quests.golemquest$treasurer.name=old dwarf treasurer
soulknight.quests.golemquest$treasurer.desc=A tiny dwarf with a monocle, a huge ledger and a bunch of keys. The only one in this city who hasn't gone mad.
soulknight.quests.golemquest$treasurer.intro=Psst. Over here! I'm the last treasurer of the royal vault. The treasure of the kingdom is inside, guarded by a golem that never sleeps.\n\nFour runes on the floor give it strength: while they glow, it mends and barely feels the blows. Step on one and it goes out.\n\nBring me its core and the treasure is yours. Well, part of it. Put them all out and you get the best part.
soulknight.quests.golemquest$treasurer.intro_hint=QUEST: defeat the GREAT GOLEM of the royal vault and bring its core to the treasurer. Every lit RUNE heals and protects it: step on it to put it out. If it falls with the 4 runes out, the reward will be better.
soulknight.quests.golemquest$treasurer.hint_0=The runes are at the four corners of the vault.
soulknight.quests.golemquest$treasurer.hint_1=When it gets angry, it lights some of them again. Watch them!
soulknight.quests.golemquest$treasurer.hint_2=Don't stand in line with a lit rune: it shoots from them.
soulknight.quests.golemquest$treasurer.bring=Already? Bring me the core, I'll write it down in the ledger!
soulknight.quests.golemquest$treasurer.thanks=Splendid! The treasure belongs to the kingdom again. Pick.
soulknight.quests.golemquest$treasurer.thanks_bonus=And with every rune out! This deserves the best of the vault.
soulknight.quests.golemquest$treasurer.after=Keep that core safe. The king won't like it one bit.
soulknight.quests.golemquest$treasurer.reward=Pick your share of the treasure:\n\n_Rune hammer_: a war hammer; one in five blows stuns.\n_Golem plate_: plate armor; it shaves some damage off every blow.\n_Rune stone_: an artifact; struck, it stuns the enemies around you.
soulknight.quests.golemquest$treasurer.reward_bonus=Every rune out! The best share of the treasure (+1):\n\n_Rune hammer_: a war hammer; one in five blows stuns.\n_Golem plate_: plate armor; it shaves some damage off every blow.\n_Rune stone_: an artifact; struck, it stuns the enemies around you.
soulknight.quests.golemquest$treasurer.got=You get: %s.
soulknight.quests.golemquest$golemcore.name=core of the great golem
soulknight.quests.golemquest$golemcore.desc=A rune stone that still throbs. The dwarf treasurer is waiting for it.
soulknight.quests.golemquest$golemcore.desc_done=A rune stone that still throbs. The treasurer wrote it down in his ledger and let you keep it: in front of the Dwarf King it will burst into light.
soulknight.quests.golemquest$runehammer.name=rune hammer
soulknight.quests.golemquest$runehammer.desc=A war hammer carved with dwarven runes. One in five blows leaves the enemy stunned.
soulknight.quests.golemquest$golemplate.name=golem plate
soulknight.quests.golemquest$golemplate.desc=Stone plates of the great golem fitted as plate armor. They shave a bit more damage off every blow.
soulknight.quests.golemquest$runestone.name=rune stone
soulknight.quests.golemquest$runestone.desc=A stone with a dwarven rune. It charges while you fight; struck, it stuns the enemies within %d cell(s).
soulknight.quests.golemquest$runestone.desc_ready=The stone glows.
soulknight.quests.golemquest$runestone.desc_charging=The stone is charging.
soulknight.quests.golemquest$runestone.ac_set=STRIKE
soulknight.quests.golemquest$runestone.no_charge=The stone doesn't glow yet.
soulknight.quests.golemquest$runestone.pulse=A runic wave stuns the enemies!
soulknight.quests.golemquest$runestone.ready=Your rune stone glows.
soulknight.quests.golemquest$runestone.levelup=Your rune stone is stronger.
soulknight.quests.greatgolem.name=great golem
soulknight.quests.greatgolem.desc=The stone guardian of the royal vault. Every lit rune heals and protects it.
soulknight.quests.greatgolem.subtitle=the guardian of the royal vault
soulknight.quests.greatgolem.subtitle_guard=the guardian of the throne
soulknight.quests.greatgolem.defeated=The great golem crumbles!
soulknight.quests.greatgolem.status_1=Phase I
soulknight.quests.greatgolem.status_2=Phase II · Rune beams
soulknight.quests.greatgolem.status_3=Phase III · Fury
soulknight.quests.greatgolem.status_runes=Lit runes: %d
soulknight.quests.greatgolem.notice=INTRUDERS. THE VAULT IS CLOSED.
soulknight.quests.greatgolem.notice_guard=NO ONE REACHES THE KING.
soulknight.quests.greatgolem.phase_2=The runes fire beams
soulknight.quests.greatgolem.phase_3=The great golem is enraged!
soulknight.quests.greatgolem.rekindle=The golem lights a rune again!
soulknight.quests.greatgolem.slain=The great golem has fallen. Bring its core to the treasurer.
soulknight.quests.greatgolem.slain_bonus=The great golem fell with every rune out! Bring its core to the treasurer.

###the yeti king (Forgotten Land)
soulknight.quests.yetiquest.followed=The yeti king comes roaring down into the glaciation of Tharog!
soulknight.quests.yetiquest.cracks=The son of the shaman told you where the plates of Tharog crack: they protect it less, and enough blows break them.
soulknight.quests.yetiquest$huntress.name=huntress of the tribe
soulknight.quests.yetiquest$huntress.desc=A huntress of the tribe, with war paint and a flint spear. Her eyes are red from crying.
soulknight.quests.yetiquest$huntress.intro=Strangers! The yeti king came down from the mountain and took the son of the shaman to his ice cave, on this very floor.\n\nI can't take him alone. His roar brings down the icicles of the ceiling... sometimes on himself. Use that.\n\nKill him, free the boy and bring him back. The tribe will pay you.
soulknight.quests.yetiquest$huntress.intro_hint=QUEST: kill the YETI KING in his ice cave, FREE the son of the shaman and go back to the huntress. His icicles hurt him too: if 2 of them fall on him, the reward will be better.
soulknight.quests.yetiquest$huntress.hint_0=His cave is at the far end of the floor. Follow the cold.
soulknight.quests.yetiquest$huntress.hint_1=When he roars, the ceiling falls. Make him stand under it.
soulknight.quests.yetiquest$huntress.hint_2=In the blizzard you'll only see him up close. Stay together.
soulknight.quests.yetiquest$huntress.free_him=You killed him! And the boy? Untie him, please!
soulknight.quests.yetiquest$huntress.thanks=He's alive! The tribe will never forget it. Pick.
soulknight.quests.yetiquest$huntress.thanks_bonus=And crushed by his own ice! The elders will tell this story. The best for you.
soulknight.quests.yetiquest$huntress.after=The boy saw the cracks in the plates of Tharog in the paintings of the cave. He'll tell you where to strike.
soulknight.quests.yetiquest$huntress.reward=Pick your reward:\n\n_Claws of the yeti king_: a quick gauntlet that sometimes chills the enemy a little.\n_Yeti mantle_: plate armor of white fur; the cold of this land doesn't bite.\n_Fang of ice_: an artifact; struck, it sends a wave of cold that hurts and slows nearby enemies.
soulknight.quests.yetiquest$huntress.reward_bonus=Crushed by his own ice! The best of the tribe (+1):\n\n_Claws of the yeti king_: a quick gauntlet that sometimes chills the enemy a little.\n_Yeti mantle_: plate armor of white fur; the cold of this land doesn't bite.\n_Fang of ice_: an artifact; struck, it sends a wave of cold that hurts and slows nearby enemies.
soulknight.quests.yetiquest$huntress.got=You get: %s.
soulknight.quests.yetiquest$captive.name=son of the shaman
soulknight.quests.yetiquest$captive.desc=A boy of the tribe tied up with leather cords. He's cold, but he hasn't shed a single tear.
soulknight.quests.yetiquest$captive.king_alive=No time: the yeti king is still alive.
soulknight.quests.yetiquest$captive.freed=Thank you! I knew someone would come!
soulknight.quests.yetiquest$captive.freed_hint=The boy runs back to the huntress. Go and talk to her.
soulknight.quests.yetiquest$yeticlaws.name=claws of the yeti king
soulknight.quests.yetiquest$yeticlaws.desc=The claws of the yeti king set on a gauntlet. Quick blows; one in four leaves the enemy chilled for a moment.
soulknight.quests.yetiquest$yetimantle.name=yeti mantle
soulknight.quests.yetiquest$yetimantle.desc=The white hide of the yeti king over plate armor. The cold of the Forgotten Land doesn't bite you.
soulknight.quests.yetiquest$frostfang.name=fang of ice
soulknight.quests.yetiquest$frostfang.desc=A fang of ice that never melts. It charges while you fight; struck, it hurts and chills the enemies within %d cells.
soulknight.quests.yetiquest$frostfang.desc_ready=The fang is ready.
soulknight.quests.yetiquest$frostfang.desc_charging=The fang is charging.
soulknight.quests.yetiquest$frostfang.ac_freeze=STRIKE
soulknight.quests.yetiquest$frostfang.no_charge=The fang isn't ready yet.
soulknight.quests.yetiquest$frostfang.freeze=A wave of cold sweeps over the enemies!
soulknight.quests.yetiquest$frostfang.ready=Your fang of ice is ready.
soulknight.quests.yetiquest$frostfang.levelup=Your fang of ice is colder.
soulknight.quests.yetiking.name=yeti king
soulknight.quests.yetiking.desc=The biggest yeti of the mountain, with a crown of ice and bone. His roar brings down the icicles... on him too.
soulknight.quests.yetiking.subtitle=the lord of the frozen mountain
soulknight.quests.yetiking.defeated=The yeti king has fallen!
soulknight.quests.yetiking.status_1=Phase I
soulknight.quests.yetiking.status_2=Phase II · Avalanches
soulknight.quests.yetiking.status_3=Phase III · Fury
soulknight.quests.yetiking.status_blizzard=Blizzard: he can only be seen up close
soulknight.quests.yetiking.notice=GRRAAAAOOOH!
soulknight.quests.yetiking.roar=GRAAAH!
soulknight.quests.yetiking.avalanche=An avalanche is coming down!
soulknight.quests.yetiking.icicles=The icicles of the ceiling creak! Lure him under them.
soulknight.quests.yetiking.phase_2=The yeti king calls the blizzard
soulknight.quests.yetiking.phase_3=The yeti king is enraged!
soulknight.quests.yetiking.hit=Crushed!
soulknight.quests.yetiking.hit_log=The icicles fall on the yeti king! (%d)
soulknight.quests.yetiking.slain=The yeti king has fallen. Free the son of the shaman.
soulknight.quests.yetiking.slain_bonus=The yeti king fell under his own ice! Free the son of the shaman.

###the demonic seals (Halls)
soulknight.quests.sealsquest.broken=You broke a demonic seal! (%d/3)
soulknight.quests.sealsquest.banner=Seal %d of 3 broken
soulknight.quests.sealsquest.hud=Demonic seals broken: %d/3
soulknight.quests.sealsquest.fist_less=Without its seals, Yog-Dzewa will have one fist less.
soulknight.quests.sealsquest.fist_more=The seals still standing feed Yog-Dzewa: it will have one more fist.
soulknight.quests.sealsquest$lostsoul.name=soul of a paladin
soulknight.quests.sealsquest$lostsoul.desc=The soul of a paladin who came down here before you. His armor still glows a little.
soulknight.quests.sealsquest$lostsoul.intro=Don't be afraid. I too came down for the Amulet... and never went back up.\n\nYog-Dzewa draws strength from three demonic seals: one on this floor and one on each of the next two. While they stand, its fists will be more.\n\nBreak them. Every broken seal will let out its guardians, so be ready. Do it quickly and you'll have my arms.
soulknight.quests.sealsquest$lostsoul.intro_hint=QUEST: break the 3 DEMONIC SEALS (one on each of floors 21, 22 and 23, in the farthest room). Every broken seal lets out a wave of demons. With the 3 broken, Yog-Dzewa will have one fist less; if not, one more. Break each one within 150 turns for a better reward.
soulknight.quests.sealsquest$lostsoul.hint=%d seals left. They are in the farthest room of each floor.
soulknight.quests.sealsquest$lostsoul.came=You did it! Talk to me, I have something for you.
soulknight.quests.sealsquest$lostsoul.after=Now I can rest. Finish what I started.
soulknight.quests.sealsquest$lostsoul.reward=Pick what was mine:\n\n_Sword of the paladin_: a greatsword that deals half again the damage to demons and the undead.\n_Blessed plate_: plate armor; demons deal 20 % less to you.\n_Relic of the paladin_: an artifact; raised, it heals you and burns the demons in sight.
soulknight.quests.sealsquest$lostsoul.reward_bonus=How quick! My arms are yours (+1):\n\n_Sword of the paladin_: a greatsword that deals half again the damage to demons and the undead.\n_Blessed plate_: plate armor; demons deal 20 % less to you.\n_Relic of the paladin_: an artifact; raised, it heals you and burns the demons in sight.
soulknight.quests.sealsquest$lostsoul.got=You get: %s.
soulknight.quests.sealsquest$demonseal.name=demonic seal
soulknight.quests.sealsquest$demonseal.desc=A black obelisk with a throbbing glyph. It feeds the fists of Yog-Dzewa. Break it and its guardians will come out.
soulknight.quests.sealsquest$demonseal.desc_unknown=A black obelisk with a throbbing glyph. Something protects it: your blows do nothing to it.
soulknight.quests.sealsquest$demonseal.unbroken=No effect
soulknight.quests.sealsquest$paladinblade.name=sword of the paladin
soulknight.quests.sealsquest$paladinblade.desc=A blessed greatsword. It deals half again the damage to demons and the undead.
soulknight.quests.sealsquest$blessedplate.name=blessed plate
soulknight.quests.sealsquest$blessedplate.desc=The plate armor of the paladin, blessed. Demons deal 20 % less damage to you.
soulknight.quests.sealsquest$paladinrelic.name=relic of the paladin
soulknight.quests.sealsquest$paladinrelic.desc=A silver reliquary with a light inside. It charges while you fight; raised, it heals you and burns the demons and undead in sight.
soulknight.quests.sealsquest$paladinrelic.desc_ready=The relic glows.
soulknight.quests.sealsquest$paladinrelic.desc_charging=The relic is charging.
soulknight.quests.sealsquest$paladinrelic.ac_raise=RAISE
soulknight.quests.sealsquest$paladinrelic.no_charge=The relic doesn't glow yet.
soulknight.quests.sealsquest$paladinrelic.raised=The light of the relic heals you and burns the demons!
soulknight.quests.sealsquest$paladinrelic.ready=Your relic glows.
soulknight.quests.sealsquest$paladinrelic.levelup=Your relic glows brighter.
