###side quests: mini bosses
soulknight.quests.miniboss.phase=Phase %d

###the hunt of Grey Tusk (Forest)
soulknight.quests.huntquest.followed=Grey Tusk followed your trail to the clearing!
soulknight.quests.huntquest$hunter.name=old hunter
soulknight.quests.huntquest$hunter.desc=A weathered hunter with a grey beard and a fur hood, carrying a longbow that has seen many winters. He has been camping by the stairs for days, waiting for someone with guts.
soulknight.quests.huntquest$hunter.desc_helper=The old hunter came along. He keeps an arrow ready for the star of the priest.
soulknight.quests.huntquest$hunter.intro=Hear that? That's Grey Tusk, the oldest boar of this forest. It wrecked every goblin camp on this floor and now it rules these tunnels.\n\nI've been after that tusk half my life. My legs can't follow it anymore, but yours can. Careful: when it hurts, it runs off smashing through walls. Follow its tracks and use whatever it leaves on the way.\n\nGet it into my snares and it'll be a clean hunt... and I'll pay for that.
soulknight.quests.huntquest$hunter.intro_hint=QUEST: hunt GREY TUSK and bring its tusk to the old hunter. It runs away three times smashing walls: follow its TRACKS. Get it into two SNARES for a better reward.
soulknight.quests.huntquest$hunter.hint_0=Look for the big tracks. Where they end, it waits.
soulknight.quests.huntquest$hunter.hint_1=Set a snare in its way and step aside. It charges without looking.
soulknight.quests.huntquest$hunter.hint_2=While it runs you can't hurt it. Wait until it stops to lick its wounds.
soulknight.quests.huntquest$hunter.bring=You got it! Bring me the tusk.
soulknight.quests.huntquest$hunter.thanks=At last! This tusk is worth a whole life. Pick your share.
soulknight.quests.huntquest$hunter.thanks_bonus=And it fell into my snares! A hunt like the old days. You get my best.
soulknight.quests.huntquest$hunter.after=May the forest go easy on you. See you down there.
soulknight.quests.huntquest$hunter.reward=Pick your share of the hunt:\n\n_Tusk spear_: a long spear (reach 2) that sometimes makes enemies bleed.\n_Boar hide cloak_: light armor; sometimes throws back and dazes whoever hits you up close.\n_Hunting horn_: an artifact that charges while you fight; blown, a young boar fights by your side for a while.
soulknight.quests.huntquest$hunter.reward_bonus=A clean hunt! Your share is worth more (+1):\n\n_Tusk spear_: a long spear (reach 2) that sometimes makes enemies bleed.\n_Boar hide cloak_: light armor; sometimes throws back and dazes whoever hits you up close.\n_Hunting horn_: an artifact that charges while you fight; blown, a young boar fights by your side for a while.
soulknight.quests.huntquest$hunter.got=You get: %s.
soulknight.quests.huntquest$hunter.helper_start=I've got your backs! When that wizard calls his star, I'll have an arrow for it.
soulknight.quests.huntquest$hunter.helper_star=Now! My arrows are cracking it! Finish it off!
soulknight.quests.huntquest$hunter.helper_talk=Deal with the priest. I'll watch the sky.
soulknight.quests.huntquest$huntercamp.name=hunter's camp
soulknight.quests.huntquest$huntercamp.desc=A patched canvas, hides drying and a small fire. It smells of smoke and resin.
soulknight.quests.huntquest$den.name=den of Grey Tusk
soulknight.quests.huntquest$den.desc=A mound of earth and roots full of gnawed bones. The lord of the forest sleeps here.
soulknight.quests.huntquest$wreckedcamp.name=wrecked camp
soulknight.quests.huntquest$wreckedcamp.desc=What is left of a goblin camp after Grey Tusk went through: splinters, a burst drum and something of value lying around.
soulknight.quests.huntquest$berrybush.name=berry bush
soulknight.quests.huntquest$berrybush.desc=A bush full of red berries. Eating them will do you good.
soulknight.quests.huntquest$berrybush.desc_eaten=There are no berries left.
soulknight.quests.huntquest$berrybush.eat=The berries are sweet and give you strength.
soulknight.quests.huntquest$huntertrap.name=hunter's snare
soulknight.quests.huntquest$huntertrap.desc=An iron snare with teeth. Set it on the floor and the first boar to step on it gets caught: it can't move and takes more damage for a few turns.
soulknight.quests.huntquest$huntertrap.ac_set=SET
soulknight.quests.huntquest$huntertrap.set=You leave the snare open on the floor.
soulknight.quests.huntquest$huntertrap.no_room=You can't set the snare here.
soulknight.quests.huntquest$greytuskfang.name=tusk of Grey Tusk
soulknight.quests.huntquest$greytuskfang.desc=A huge curved tusk, yellow with age. The old hunter is waiting for it.
soulknight.quests.huntquest$tuskspear.name=tusk spear
soulknight.quests.huntquest$tuskspear.desc=A long ash spear with the tusk of Grey Tusk tied to its tip. It reaches two cells and one in four blows makes the enemy bleed.
soulknight.quests.huntquest$boarcloak.name=boar hide cloak
soulknight.quests.huntquest$boarcloak.desc=The tough grey hide of the alpha boar, tanned into light armor. One in five blows you take up close throws the attacker back and dazes them.
soulknight.quests.huntquest$huntinghorn.name=hunting horn
soulknight.quests.huntquest$huntinghorn.desc=A boar horn with a bone mouthpiece. It charges while you fight; blown, %d young boar(s) of the forest come to fight by your side for a while.
soulknight.quests.huntquest$huntinghorn.desc_ready=The horn is ready.
soulknight.quests.huntquest$huntinghorn.desc_charging=The horn is not ready yet.
soulknight.quests.huntquest$huntinghorn.ac_blow=BLOW
soulknight.quests.huntquest$huntinghorn.no_charge=The horn is not ready yet.
soulknight.quests.huntquest$huntinghorn.no_room=There is no room for them to come.
soulknight.quests.huntquest$huntinghorn.blown=You blow the horn and the young boars come running!
soulknight.quests.huntquest$huntinghorn.ready=Your hunting horn is ready.
soulknight.quests.huntquest$huntinghorn.levelup=Your hunting horn sounds louder.

soulknight.quests.greytusk.name=Grey Tusk
soulknight.quests.greytusk.desc=The alpha boar of the forest: old, huge, its back covered in scars and tusks that have split trees. When it hurts, it runs off smashing through walls.
soulknight.quests.greytusk.subtitle=the alpha boar of the forest
soulknight.quests.greytusk.defeated=Grey Tusk has fallen!
soulknight.quests.greytusk.status_1=Phase I · Charges
soulknight.quests.greytusk.status_2=Phase II · Stomps and walls
soulknight.quests.greytusk.status_3=Phase III · Fury
soulknight.quests.greytusk.status_4=Phase IV · The den
