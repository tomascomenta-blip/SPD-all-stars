soulknight.quests.tourneyquest.knight_knows=You... I saw you in the lists. A worthy rival at last.
soulknight.quests.tourneyquest.knight_skip=I need no horse against a champion of the tournament! On foot, as in the lists!
soulknight.quests.tourneyquest.guards=The champions who beat you in the tournament stand guard by the knight!
soulknight.quests.tourneyquest$herald.name=herald of the tournament
soulknight.quests.tourneyquest$herald.desc=A herald with a chequered tabard, a golden trumpet and a voice like thunder. He announces the fights of the coliseum for his lord, who watches from the royal box.
soulknight.quests.tourneyquest$herald.intro=Welcome to the coliseum of the Kingdom! My lord, the grand knight, watches every fight of these lists from his box.\n\nThree rounds. In each one I'll offer you two rivals: a fair one and a true champion. The harder the rival, the better the prize. Let everyone see what you're made of!\n\nIf you're about to fall, I'll stop the fight... but that champion won't forget your defeat.
soulknight.quests.tourneyquest$herald.intro_hint=QUEST: win the 3 rounds of the tournament of the herald. In each round you pick a rival: EASY (smaller prize) or a CHAMPION (bigger prize). Lose, and that champion joins the guard of the grand knight. Win the 3 against champions for the best final prize.
soulknight.quests.tourneyquest$herald.round_title=Round %d of 3
soulknight.quests.tourneyquest$herald.round_text=Pick your rival:\n\n_Easy_: %s. Prize: %s.\n_Champion_: %s. Prize: %s.\n\nThe gate stays shut until the fight is over.
soulknight.quests.tourneyquest$herald.pick_easy=Easy: %s
soulknight.quests.tourneyquest$herald.pick_hard=Champion: %s
soulknight.quests.tourneyquest$herald.pick_later=Not yet
soulknight.quests.tourneyquest$herald.subtitle_easy=Round %d · easy rival
soulknight.quests.tourneyquest$herald.fight_0=First round! Open the lists!
soulknight.quests.tourneyquest$herald.fight_1=Second round! The crowd wants blood!
soulknight.quests.tourneyquest$herald.fight_2=Final round! My lord has risen to his feet!
soulknight.quests.tourneyquest$herald.fighting=Fight! Everyone is watching!
soulknight.quests.tourneyquest$herald.win=Victory! The crowd cheers for you!
soulknight.quests.tourneyquest$herald.win_hard=Incredible! They beat a champion! Even my lord strikes his shield!
soulknight.quests.tourneyquest$herald.stop=ENOUGH! The fight is over! Take your defeat with you... and don't forget that face.
soulknight.quests.tourneyquest$herald.banner_win=Round %d won!
soulknight.quests.tourneyquest$herald.banner_last=Tournament completed! Talk to the herald
soulknight.quests.tourneyquest$herald.banner_lost=Round %d lost
soulknight.quests.tourneyquest$herald.after=My lord will remember you. And that, believe me, is not always good.
soulknight.quests.tourneyquest$herald.reward=The tournament is over! Pick your trophy:\n\n_Jousting lance_: a heavy lance (reach 2) that sometimes knocks the rival back.\n_Champion's armor_: mail that weighs less than it looks (needs 1 less strength).\n_Banner of the herald_: an artifact; planted, nearby allies hit harder and take less damage for a few turns.
soulknight.quests.tourneyquest$herald.reward_best=Three champions beaten! Nobody had ever done it! Your trophy is worth more (+1):\n\n_Jousting lance_: a heavy lance (reach 2) that sometimes knocks the rival back.\n_Champion's armor_: mail that weighs less than it looks (needs 1 less strength).\n_Banner of the herald_: an artifact; planted, nearby allies hit harder and take less damage for a few turns.
soulknight.quests.tourneyquest$herald.got=You get: %s.

