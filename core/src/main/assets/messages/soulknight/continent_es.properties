###el Continente oscuro
soulknight.continent.continent.essence=¡Esencia sagrada! Tenéis %d de %d.

soulknight.continent.sacredessence.name=esencia sagrada
soulknight.continent.sacredessence.desc=Una gota de luz que no se apaga. Es de todo el grupo: hacen falta siete para cerrar el portal al infierno de los yogs.

Tenéis %d de %d.

soulknight.continent.darktaint.name=Corrupción
soulknight.continent.darktaint.desc=El Continente oscuro se te mete dentro: sube poco a poco con el tiempo y con cada golpe de un yog. Los santuarios de luz la limpian.

Corrupción: %d de 100.
soulknight.continent.darktaint.effect_1=_25:_ tus heridas se cierran más despacio.
soulknight.continent.darktaint.effect_2=_50:_ ves menos y te entra hambre antes.
soulknight.continent.darktaint.effect_3=_75:_ tu vida máxima baja.
soulknight.continent.darktaint.effect_4=_100:_ eres una presa: todos los yogs saben dónde estás y la corrupción te come la vida hasta que llegues a un santuario.
soulknight.continent.darktaint.step_1=corrupción 25
soulknight.continent.darktaint.step_2=corrupción 50
soulknight.continent.darktaint.step_3=corrupción 75
soulknight.continent.darktaint.step_4=¡presa!
soulknight.continent.darktaint.warn_1=La corrupción te pesa: tus heridas se cierran más despacio.
soulknight.continent.darktaint.warn_2=La corrupción te nubla la vista y te da hambre.
soulknight.continent.darktaint.warn_3=La corrupción te roba fuerzas: tu vida máxima baja.
soulknight.continent.darktaint.warn_4=¡Eres una presa! Busca un santuario de luz antes de que te consuma.

soulknight.continent.continent.fell=Habéis caído en %s, en el Continente oscuro. Llegasteis más lejos que nadie.
soulknight.continent.continent.floor=el piso %d

soulknight.continent.ashlevel.lava_name=Lava negra
soulknight.continent.ashlevel.lava_desc=Un río espeso y casi negro que brilla por las grietas. Quema a quien lo pisa y se pega a los pies.
soulknight.continent.ashlevel.grass_name=Matojos calcinados
soulknight.continent.ashlevel.grass_desc=Lo que fue hierba, quemado hasta la raíz. Cruje al pisarlo.
soulknight.continent.ashlevel.basalt_name=Columnas de basalto
soulknight.continent.ashlevel.basalt_desc=Columnas negras de piedra que se partió al enfriarse. Por las grietas aún respira el calor de abajo.
soulknight.continent.ashlevel.high_grass_name=Matorral de ceniza
soulknight.continent.ashlevel.floor_name=Ceniza
soulknight.continent.ashlevel.floor_desc=Ceniza gris hasta donde alcanza la vista, que es poco. Bajo ella, aquí y allá, brasas que no se apagan nunca.

soulknight.continent.shrine.name=santuario de luz
soulknight.continent.shrine.wakes=¡La luz del santuario despierta! Quedaos cerca y que ningún yog lo toque hasta que se llene.
soulknight.continent.shrine.progress=El santuario se llena de luz: %d de %d.
soulknight.continent.shrine.pure=El santuario brilla limpio. Aquí la corrupción se va sola.
soulknight.continent.shrine.purified=¡El santuario se purifica! Una gota de esencia sagrada cae a sus pies.
soulknight.continent.shrine.desc_sieged=Una piedra antigua que aún guarda algo de luz, ahogada por zarcillos de corrupción. Los yogs la rodean como moscas.

Tócala para despertarla: tendréis que defenderla mientras se llena.
soulknight.continent.shrine.desc_charging=La luz crece: %d de %d. Si un yog la toca, retrocede; si nadie se queda cerca, se para.
soulknight.continent.shrine.desc_pure=Luz limpia en medio de la ceniza. Estar a su lado borra la corrupción.

soulknight.continent.taintedfood$taintedration.name=ración corrupta
soulknight.continent.taintedfood$taintedration.desc=Comida de verdad... o lo fue. Tiene manchas violetas que no se van. Quita el hambre, pero la corrupción entra con ella.
soulknight.continent.taintedfood$taintedmeat.name=carne corrupta
soulknight.continent.taintedfood$taintedmeat.desc=Un trozo de algo que vivía aquí. Mejor no preguntar qué. Alimenta poco y corrompe.

soulknight.continent.continenthud.essence=Esencia
###el mundo abierto
soulknight.continent.continent.place_0=las Llanuras de ceniza
soulknight.continent.continent.place_1=las Profundidades
soulknight.continent.continent.place_2=el Abismo
soulknight.continent.continent.arrive_0=Las Llanuras de ceniza. El viejo camino de losas cruza la ceniza hacia el norte; lejos de él, el terreno baja.
soulknight.continent.continent.arrive_1=Los túneles bajo la ceniza. Estrechos, y parece que no se acaban nunca.
soulknight.continent.continent.arrive_2=El abismo de la ceniza. Aquí abajo caminan cosas de un tamaño que mejor no imaginar.

soulknight.continent.shrine.purified_dry=¡El santuario se purifica! Pero su esencia se la llevaron hace mucho: solo queda la luz.
soulknight.continent.continenthud.map=Mapa

soulknight.continent.world.wndworldmap.title=Mapa
soulknight.continent.world.wndworldmap.nothing=Todavía nada que marcar. Lo que encontréis saldrá aquí.

soulknight.continent.ash.land.landmark.name_0=Cráneo de coloso
soulknight.continent.ash.land.landmark.desc_0=El cráneo de un coloso, medio enterrado en la ceniza. Sus fauces son la boca de una cueva: entre los colmillos bajan unos escalones a lo negro, y en una de las cuencas brilla algo.
soulknight.continent.ash.land.landmark.name_1=La sima
soulknight.continent.ash.land.landmark.desc_1=Una grieta tan honda que el fondo es solo un resplandor rojo. Alguien clavó una estaca en el borde y ató una cuerda: baja al abismo.
soulknight.continent.ash.land.landmark.name_2=La sima
soulknight.continent.ash.land.landmark.desc_2=Una grieta tan honda que el fondo es solo un resplandor rojo. Alguien clavó una estaca en el borde y ató una cuerda: baja al abismo.
soulknight.continent.ash.land.landmark.name_3=Acantilado
soulknight.continent.ash.land.landmark.desc_3=Una pared de columnas de basalto que cae a la ceniza honda. De dos estacas cuelga una escala de cuerda: el camino corto hacia abajo, si te fías de ella.
soulknight.continent.ash.land.landmark.name_4=Costillar de coloso
soulknight.continent.ash.land.landmark.desc_4=Aquí yace un coloso boca abajo, y sus costillas forman arcos tan altos que se pasa por debajo. Una expedición colgó un farol de su espinazo.
soulknight.continent.ash.land.landmark.name_5=Torre ardiente
soulknight.continent.ash.land.landmark.desc_5=Una torre de vigía ennegrecida por el hollín, con un fuego arriba que no se apaga nunca. Se ve desde muy lejos: buena para volver al camino.
soulknight.continent.ash.land.landmark.name_6=Árbol de obsidiana
soulknight.continent.ash.land.landmark.desc_6=Un árbol retorcido de vidrio negro. Una veta de lava le sube por el tronco hasta un hueco donde algo late como un corazón.
soulknight.continent.ash.land.landmark.name_7=Campamento abandonado
soulknight.continent.ash.land.landmark.desc_7=Otros llegaron hasta aquí: tiendas rotas, un carro partido y un esqueleto todavía sentado junto a la hoguera fría. Dejaron algunas cosas.

soulknight.continent.ash.land.ashsurface.portal_name=Portal de Thal-Vekhorr
soulknight.continent.ash.land.ashsurface.portal_desc=El portal por el que llegasteis, todavía abierto. Lleva de vuelta a la grieta.
soulknight.continent.ash.land.ashsurface.storm_name=Tormenta de ceniza
soulknight.continent.ash.land.ashsurface.storm_desc=El viento arrastra la ceniza tan espesa que no se ve la propia mano. Solo por donde entra el camino hay un paso, hacia el norte.
soulknight.continent.ash.land.ashsurface.fog_name=Niebla de ceniza
soulknight.continent.ash.land.ashsurface.fog_desc=A partir de aquí la ceniza flota en el aire como un muro. Nadie que entró ha vuelto.
soulknight.continent.ash.land.ashsurface.steps_name=Escalones tallados
soulknight.continent.ash.land.ashsurface.steps_desc=Escalones de losa tallados en la cara de la terraza. El camino baja por ellos.
soulknight.continent.ash.land.ashsurface.slide_name=Talud de ceniza
soulknight.continent.ash.land.ashsurface.slide_desc=La ceniza se derramó por el borde y tapó la cara: por aquí se puede bajar, y volver a subir.
soulknight.continent.ash.land.ashsurface.face_name=Cara de basalto
soulknight.continent.ash.land.ashsurface.face_desc=La cara de una terraza: columnas de basalto bajo una costra de ceniza prensada. Demasiado empinada; busca un talud o unos escalones.
soulknight.continent.ash.land.ashsurface.rim_name=Borde de la terraza
soulknight.continent.ash.land.ashsurface.rim_desc=Aquí se acaba el suelo y cae a una terraza más baja. Se desmorona si lo pisas.
soulknight.continent.ash.land.ashsurface.road_name=Camino de losas
soulknight.continent.ash.land.ashsurface.road_desc=Losas viejas medio enterradas en la ceniza. Quien las puso se fue hace mucho, pero el camino sigue hacia el norte.
soulknight.continent.ash.land.ashsurface.high_name=Ceniza
soulknight.continent.ash.land.ashsurface.high_desc=Ceniza gris hasta donde alcanza la vista, que es poco. El viento dibuja ondas en ella.
soulknight.continent.ash.land.ashsurface.low_name=Ceniza oscura
soulknight.continent.ash.land.ashsurface.low_desc=Más abajo la ceniza es más oscura y está llena de guijarros y huesos. Por aquí rondan cosas que no suben al camino.
soulknight.continent.ash.land.ashsurface.deep_name=Ceniza honda
soulknight.continent.ash.land.ashsurface.deep_desc=Casi negra, y tibia: debajo hay brasas. Aquí abajo no viene nadie a ayudar.

soulknight.continent.ash.land.ashunder.floor_name=Suelo de roca
soulknight.continent.ash.land.ashunder.floor_desc=Roca negra, pulida por cosas que se arrastran. El aire huele a azufre.
soulknight.continent.ash.land.ashunder.skull_name=Subida al cráneo
soulknight.continent.ash.land.ashunder.skull_desc=Los escalones que suben de vuelta, entre los colmillos del cráneo, a la superficie.
soulknight.continent.ash.land.ashunder.rope_name=La cuerda
soulknight.continent.ash.land.ashunder.rope_desc=La escala de cuerda por la que bajasteis, colgando de lo negro. Sube de vuelta a la sima.
soulknight.continent.ash.land.ashabyss.heart=Fondo del abismo

###los otros biomas del mundo abierto
soulknight.continent.continent.place_flesh_0=el Bosque de carne
soulknight.continent.continent.place_flesh_1=las Entrañas
soulknight.continent.continent.place_flesh_2=la Cavidad que late
soulknight.continent.continent.arrive_flesh_0=El Bosque de carne. Los árboles sangran cuando los mueve el viento, y el suelo está tibio bajo las botas.
soulknight.continent.continent.arrive_flesh_1=Las entrañas bajo el bosque. Las paredes son blandas, y se mueven cuando no miras.
soulknight.continent.continent.arrive_flesh_2=La cavidad que late bajo el bosque. Aquí abajo respira la cueva entera.
soulknight.continent.continent.place_city_0=la Ciudad devorada
soulknight.continent.continent.place_city_1=las Catacumbas
soulknight.continent.continent.place_city_2=la Ciudad de abajo
soulknight.continent.continent.arrive_city_0=La Ciudad devorada. Calles de adoquines y canales negros; algo se ha ido comiendo las casas por dentro.
soulknight.continent.continent.arrive_city_1=Las catacumbas bajo la ciudad. Huesos en las paredes, huesos en el suelo.
soulknight.continent.continent.arrive_city_2=La ciudad de debajo de la ciudad. Lo que se comió la de arriba vive aquí.
soulknight.continent.continent.place_frost_0=el Páramo helado
soulknight.continent.continent.place_frost_1=las Cuevas de hielo
soulknight.continent.continent.place_frost_2=el Abismo helado
soulknight.continent.continent.arrive_frost_0=El Páramo helado. La nieve se traga cualquier ruido, y el frío muerde a través de cualquier abrigo.
soulknight.continent.continent.arrive_frost_1=Las cuevas bajo el hielo. El aliento se congela antes de salir de la boca.
soulknight.continent.continent.arrive_frost_2=El abismo helado. Aquí abajo duermen cosas en el hielo, y no todas duermen.
soulknight.continent.continent.place_bones_0=el Cementerio de colosos
soulknight.continent.continent.place_bones_1=el Osario
soulknight.continent.continent.place_bones_2=la Fosa común
soulknight.continent.continent.arrive_bones_0=El Cementerio de colosos. Los colosos vienen aquí a morir, y sus huesos se quedan donde caen.
soulknight.continent.continent.arrive_bones_1=El osario bajo el cementerio. Túneles excavados en hueso en vez de roca.
soulknight.continent.continent.arrive_bones_2=La fosa común de los colosos. Demasiados huesos para contarlos, y algunos todavía se mueven.
soulknight.continent.continent.place_isles_0=las Islas negras
soulknight.continent.continent.place_isles_2=el Abismo sumergido
soulknight.continent.continent.arrive_isles_0=Las Islas negras. Un mar oscuro, rocas unidas por tendones y un ojo que no se cierra nunca vigilando desde el trono.
soulknight.continent.continent.arrive_isles_2=El abismo bajo el mar. El agua aprieta las paredes por todos lados.

soulknight.continent.ash.land.landmark.name_8=Boca de raíces
soulknight.continent.ash.land.landmark.desc_8=Raíces de carne enormes salen del suelo y se arquean sobre un agujero. Bajan escalones de raíz hacia un brillo verde, y tres ojos vigilan.
soulknight.continent.ash.land.landmark.name_9=Sima de carne
soulknight.continent.ash.land.landmark.desc_9=Una grieta con paredes de carne y dientes por todo el borde. Al fondo brilla la bilis; baja una cuerda que ataron otros.
soulknight.continent.ash.land.landmark.name_10=Árbol de costillas
soulknight.continent.ash.land.landmark.desc_10=Un espinazo por tronco y costillas por ramas, que se cierran sobre tu cabeza. En las puntas brillan frutos de bilis.
soulknight.continent.ash.land.landmark.name_11=Nido de ojos
soulknight.continent.ash.land.landmark.desc_11=Un nido de raíces y huesos lleno de ojos-huevo, cada uno mirando a un lado.
soulknight.continent.ash.land.landmark.name_12=Coloso muerto
soulknight.continent.ash.land.landmark.desc_12=Un coloso tumbado de lado bajo un musgo de carne. En la cuenca del cráneo brillan hongos de bilis.
soulknight.continent.ash.land.landmark.name_13=Campamento perdido
soulknight.continent.ash.land.landmark.desc_13=Una expedición que no volvió. El musgo de carne lo cubre todo, pero el farol del mástil aún arde.
soulknight.continent.ash.land.landmark.name_14=Alcantarilla mayor
soulknight.continent.ash.land.landmark.desc_14=La boca de una alcantarilla en un muro de ladrillo, con la reja doblada hacia fuera. Unos escalones bajan a un canal con luz violeta.
soulknight.continent.ash.land.landmark.name_15=Socavón
soulknight.continent.ash.land.landmark.desc_15=Aquí se hundió la calle. Muy abajo hay una luz violeta, y una cuerda que alguien ató antes que tú.
soulknight.continent.ash.land.landmark.name_16=Torre del reloj
soulknight.continent.ash.land.landmark.desc_16=El reloj de la ciudad se paró hace mucho. Ahora mira un ojo desde su esfera, y se ve desde todas partes.
soulknight.continent.ash.land.landmark.name_17=Plaza del trono
soulknight.continent.ash.land.landmark.desc_17=La plaza de un trono vacío, partida por una grieta que brilla violeta.
soulknight.continent.ash.land.landmark.name_18=Muralla
soulknight.continent.ash.land.landmark.desc_18=Un tramo de la vieja muralla, todavía en pie. No sirvió para nada.
soulknight.continent.ash.land.landmark.name_19=Campamento abandonado
soulknight.continent.ash.land.landmark.desc_19=Otros acamparon entre las ruinas. Se fueron con prisa, y dejaron algunas cosas.
soulknight.continent.ash.land.landmark.name_20=Cueva de hielo
soulknight.continent.ash.land.landmark.desc_20=Una boca en el hielo, con una luz fría muy dentro. Por aquí se baja a las cuevas bajo el páramo.
soulknight.continent.ash.land.landmark.name_21=Grieta del glaciar
soulknight.continent.ash.land.landmark.desc_21=Una grieta en el glaciar, azul y luego negra. Baja una cuerda.
soulknight.continent.ash.land.landmark.name_22=Barco atrapado
soulknight.continent.ash.land.landmark.desc_22=Un barco preso en el hielo, lejos de cualquier mar. El farol de popa aún arde.
soulknight.continent.ash.land.landmark.name_23=Estatuas de hielo
soulknight.continent.ash.land.landmark.desc_23=Gente congelada donde estaba. Todas miran al norte.
soulknight.continent.ash.land.landmark.name_24=Aldea enterrada
soulknight.continent.ash.land.landmark.desc_24=Tejados que asoman de la nieve. En una ventana todavía brilla una brasa.
soulknight.continent.ash.land.landmark.name_25=Campamento abandonado
soulknight.continent.ash.land.landmark.desc_25=Tiendas heladas y una hoguera fría. Quien acampó aquí dejó algunas cosas.
soulknight.continent.ash.land.landmark.name_26=Garganta del cráneo
soulknight.continent.ash.land.landmark.desc_26=El cráneo de un coloso con las fauces abiertas. Su garganta baja al osario.
soulknight.continent.ash.land.landmark.name_27=Fosa común
soulknight.continent.ash.land.landmark.desc_27=Un pozo lleno de huesos, más hondo de lo que debería ser ninguna tumba. Cuelga una cuerda.
soulknight.continent.ash.land.landmark.name_28=Gran esqueleto
soulknight.continent.ash.land.landmark.desc_28=El más grande de todos. Se camina entre sus huesos como entre las columnas de una sala.
soulknight.continent.ash.land.landmark.name_29=Altar de dientes
soulknight.continent.ash.land.landmark.desc_29=Un altar hecho de dientes, con velas que alguien mantiene encendidas.
soulknight.continent.ash.land.landmark.name_30=Campamento abandonado
soulknight.continent.ash.land.landmark.desc_30=Un campamento entre los huesos. Se fueron con prisa, y dejaron algunas cosas.
soulknight.continent.ash.land.landmark.name_31=Sima marina
soulknight.continent.ash.land.landmark.desc_31=Una grieta en la roca por la que entra el mar sin llenarla nunca. Baja una cuerda.
soulknight.continent.ash.land.landmark.name_32=Portal de Yog
soulknight.continent.ash.land.landmark.desc_32=Un anillo de carne y piedra alrededor de la nada. La nada te devuelve la mirada.
soulknight.continent.ash.land.landmark.name_33=Faro muerto
soulknight.continent.ash.land.landmark.desc_33=Un faro sobre una roca. Su linterna da un brillo violeta que no alumbra nada.
soulknight.continent.ash.land.landmark.name_34=Barco hundido
soulknight.continent.ash.land.landmark.desc_34=Un pecio medio bajo el agua negra. Su farol aún arde.
soulknight.continent.ash.land.landmark.name_35=Trono de Yog
soulknight.continent.ash.land.landmark.desc_35=Un trono de carne con un gran ojo encima. Te estaba esperando.
soulknight.continent.ash.land.landmark.name_36=Árbol de carne
soulknight.continent.ash.land.landmark.desc_36=Un árbol de piel y venas, tibio al tacto. De sus ramas cuelgan membranas, y algunas tienen ojos.
soulknight.continent.ash.land.landmark.name_48=Casa en ruinas
soulknight.continent.ash.land.landmark.desc_48=Una casa de la ciudad, todavía en pie. Algo se la ha comido por dentro; mejor no entrar.

soulknight.continent.ash.land.ashsurface.pass_name=Hacia %s
soulknight.continent.ash.land.ashsurface.pass_desc=La tierra sigue más allá del borde. Si sigues andando, estarás en otro sitio.
soulknight.continent.ash.land.ashsurface.land_steps_name=Escalones tallados
soulknight.continent.ash.land.ashsurface.land_steps_desc=Escalones tallados en la ladera. El camino baja por ellos.
soulknight.continent.ash.land.ashsurface.land_slide_name=Talud
soulknight.continent.ash.land.ashsurface.land_slide_desc=El suelo se derramó por el borde: por aquí se puede bajar, y volver a subir.
soulknight.continent.ash.land.ashsurface.land_face_name=Ladera empinada
soulknight.continent.ash.land.ashsurface.land_face_desc=Demasiado empinada para trepar. Busca un talud o unos escalones.
soulknight.continent.ash.land.ashsurface.land_rim_name=Borde
soulknight.continent.ash.land.ashsurface.land_rim_desc=Aquí se acaba el suelo y cae a un nivel más bajo.
soulknight.continent.ash.land.ashsurface.flesh_high_name=Musgo de carne
soulknight.continent.ash.land.ashsurface.flesh_high_desc=Una alfombra de musgo tibio que cede bajo los pies. Lo atraviesan raíces de carne.
soulknight.continent.ash.land.ashsurface.flesh_low_name=Mantillo
soulknight.continent.ash.land.ashsurface.flesh_low_desc=Mantillo oscuro lleno de huesos y raíces. Algo mira desde el suelo.
soulknight.continent.ash.land.ashsurface.flesh_deep_name=Charca de bilis
soulknight.continent.ash.land.ashsurface.flesh_deep_desc=Charcas de bilis verde y pústulas. Nadie baja aquí a propósito.
soulknight.continent.ash.land.ashsurface.flesh_road_name=Sendero de hueso
soulknight.continent.ash.land.ashsurface.flesh_road_desc=Huesos planos puestos como losas. El bosque todavía no se los ha tragado.
soulknight.continent.ash.land.ashsurface.flesh_fog_name=Nube de esporas
soulknight.continent.ash.land.ashsurface.flesh_fog_desc=Una nube espesa de esporas. Quien entra no sale.
soulknight.continent.ash.land.ashsurface.city_high_name=Calzada
soulknight.continent.ash.land.ashsurface.city_high_desc=La calzada de la vieja ciudad, agrietada y llena de cascotes.
soulknight.continent.ash.land.ashsurface.city_low_name=Calle baja
soulknight.continent.ash.land.ashsurface.city_low_desc=Una calle más baja, donde la carne de yog ha empezado a crecer entre las piedras.
soulknight.continent.ash.land.ashsurface.city_deep_name=Canal negro
soulknight.continent.ash.land.ashsurface.city_deep_desc=Agua negra que no refleja nada. Mejor no tocarla.
soulknight.continent.ash.land.ashsurface.city_road_name=Calle mayor
soulknight.continent.ash.land.ashsurface.city_road_desc=Los adoquines de la calle mayor. Todavía lleva a alguna parte.
soulknight.continent.ash.land.ashsurface.city_fog_name=Ruinas
soulknight.continent.ash.land.ashsurface.city_fog_desc=Casas hundidas hasta donde alcanza la vista. Por ahí no se pasa.
soulknight.continent.ash.land.ashsurface.frost_high_name=Nieve
soulknight.continent.ash.land.ashsurface.frost_high_desc=Nieve dura, barrida por el viento en ondas largas.
soulknight.continent.ash.land.ashsurface.frost_low_name=Tierra helada
soulknight.continent.ash.land.ashsurface.frost_low_desc=Más abajo la nieve es gris y está llena de piedras.
soulknight.continent.ash.land.ashsurface.frost_deep_name=Hielo negro
soulknight.continent.ash.land.ashsurface.frost_deep_desc=Hielo tan claro que parece negro. Hay cosas atrapadas dentro.
soulknight.continent.ash.land.ashsurface.frost_road_name=Senda vieja
soulknight.continent.ash.land.ashsurface.frost_road_desc=Piedras puestas sobre la nieve. Alguien mantuvo abierta esta senda hace tiempo.
soulknight.continent.ash.land.ashsurface.frost_fog_name=Ventisca
soulknight.continent.ash.land.ashsurface.frost_fog_desc=La nieve cae tan espesa que es un muro. Nadie que entró ha vuelto.
soulknight.continent.ash.land.ashsurface.bones_high_name=Tierra gris
soulknight.continent.ash.land.ashsurface.bones_high_desc=Tierra seca cubierta de astillas de hueso.
soulknight.continent.ash.land.ashsurface.bones_low_name=Campo de huesos
soulknight.continent.ash.land.ashsurface.bones_low_desc=Más hueso que tierra. Cruje a cada paso.
soulknight.continent.ash.land.ashsurface.bones_deep_name=Hoyo de huesos
soulknight.continent.ash.land.ashsurface.bones_deep_desc=Lo más bajo, donde acabaron los huesos más viejos.
soulknight.continent.ash.land.ashsurface.bones_road_name=Senda de vértebras
soulknight.continent.ash.land.ashsurface.bones_road_desc=Un sendero empedrado con vértebras de coloso.
soulknight.continent.ash.land.ashsurface.bones_fog_name=Polvo
soulknight.continent.ash.land.ashsurface.bones_fog_desc=Una nube de polvo de hueso. Nadie que entró ha vuelto.
soulknight.continent.ash.land.ashsurface.isles_high_name=Roca negra
soulknight.continent.ash.land.ashsurface.isles_high_desc=Roca negra y mojada, resbaladiza de algas.
soulknight.continent.ash.land.ashsurface.isles_low_name=Orilla
soulknight.continent.ash.land.ashsurface.isles_low_desc=Guijarros y cosas muertas que escupió el mar.
soulknight.continent.ash.land.ashsurface.isles_deep_name=Mar negro
soulknight.continent.ash.land.ashsurface.isles_deep_desc=Agua oscura. Algo grande se mueve debajo.
soulknight.continent.ash.land.ashsurface.isles_road_name=Calzada de tendón
soulknight.continent.ash.land.ashsurface.isles_road_desc=Un paso de piedras y tendones que une las rocas.
soulknight.continent.ash.land.ashsurface.isles_fog_name=Bruma
soulknight.continent.ash.land.ashsurface.isles_fog_desc=Bruma sobre el agua, espesa como un muro. Nadie que entró ha vuelto.

soulknight.continent.ash.land.ashunder.cave_name=Subida
soulknight.continent.ash.land.ashunder.cave_desc=El camino de vuelta a la superficie.
soulknight.continent.world.wndworldmap.lands=Las tierras que habéis pisado
