#Gunslinger
###class
actors.hero.heroclass.gunslinger=gunslinger
actors.hero.heroclass.gunslinger_desc_short=The _Gunslinger_ is a quick-trigger sheriff: he empties his cylinder on the enemies, puts prices on their heads and calls for bombings from the sky.
actors.hero.heroclass.gunslinger_desc=The city's sheriff went down into the dungeon after a gang of outlaws and never came back up. The Gunslinger starts with a _sheriff's star_, which grants him _Gun Spin_, _Bounty Tag_ (level 2), _Air Strike_ (level 4) and _High Noon_ (level 6).\n\nHis passive, the _streak_: if he kills 3 enemies in a row, each soon after the last, he enters a _duel_: for some turns his cooldowns run twice as fast and his shots deal 25% more damage.\n\nHe also starts with a _knife_, a _justice revolver_ (a weapon used like a wand), cloth armor, a waterskin and a velvet pouch.\n\nAutomatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Recharging\n\nWhen he fires a gun, _the next gun with charges in his backpack fires too_. An empty gun can be _reloaded_ to half its charges (every 15 turns).
actors.hero.heroclass.gunslinger_unlock=The champions are unlocked from the start.
###subclasses
actors.hero.herosubclass.quickdraw=quickdraw
actors.hero.herosubclass.quickdraw_short_desc=The _Quickdraw_ fires 2 more bullets with Gun Spin.
actors.hero.herosubclass.quickdraw_desc=Gun Spin fires _2 more bullets_. His talents make his shots hit harder, let the duel reload his revolver and make duels last longer.
actors.hero.herosubclass.bounty_hunter=bounty hunter
actors.hero.herosubclass.bounty_hunter_short_desc=The _Bounty Hunter_ sets higher bounties, and his marks take much more damage.
actors.hero.herosubclass.bounty_hunter_desc=Enemies with his Bounty Tag take _40% more damage_ instead of 25%, and drop _twice the gold_. His talents raise the damage further, lengthen the hunt and heal him when he collects.
###Gunslinger talents
actors.hero.talent.gs_gun_oil.title=gun oil
actors.hero.talent.gs_gun_oil.desc=_+1:_ Eating food gives the revolver _1 charge_ (it may go over its maximum).\n\n_+2:_ It gives _2 charges_.
actors.hero.talent.gs_appraisal.title=appraisal
actors.hero.talent.gs_appraisal.desc=_+1:_ The Gunslinger identifies weapons and armor _1.75x faster_.\n\n_+2:_ He identifies them _2.5x faster_.
actors.hero.talent.gs_steady_aim.title=steady aim
actors.hero.talent.gs_steady_aim.desc=_+1:_ The revolver deals _1 more damage_.\n\n_+2:_ _2 more_.
actors.hero.talent.gs_thick_coat.title=thick coat
actors.hero.talent.gs_thick_coat.desc=_+1:_ He gains up to _1 armor_.\n\n_+2:_ Up to _2_.
actors.hero.talent.gs_fast_reload.title=fast reload
actors.hero.talent.gs_fast_reload.desc=_+1:_ Gun Spin cools down _2 turns sooner_.\n\n_+2:_ _4 turns sooner_.
actors.hero.talent.gs_deadeye.title=deadeye
actors.hero.talent.gs_deadeye.desc=_+1:_ Gun Spin fires _1 more bullet_.\n\n_+2:_ _2 more bullets_.
actors.hero.talent.gs_big_bounty.title=big bounty
actors.hero.talent.gs_big_bounty.desc=_+1:_ Bounties give _50% more gold_.\n\n_+2:_ _Twice_ the gold.
actors.hero.talent.gs_carpet_bomb.title=carpet bombing
actors.hero.talent.gs_carpet_bomb.desc=_+1:_ Air Strike drops _1 more bomb_.\n\n_+2:_ _2 more bombs_.
actors.hero.talent.gs_hot_streak.title=hot streak
actors.hero.talent.gs_hot_streak.desc=_+1:_ The duel lasts _3 more turns_.\n\n_+2:_ _6 more turns_.
actors.hero.talent.gs_execution.title=execution
actors.hero.talent.gs_execution.desc=_+1:_ High Noon finishes off enemies below _25%_ health (instead of 20%).\n\n_+2:_ Below _30%_.\n\n_+3:_ Below _35%_.
actors.hero.talent.gs_ricochet.title=ricochet
actors.hero.talent.gs_ricochet.desc=_+1:_ Each bullet of Gun Spin has a _15%_ chance to bounce into another enemy.\n\n_+2:_ _30%_.\n\n_+3:_ _45%_.
actors.hero.talent.qd_hair_trigger.title=hair trigger
actors.hero.talent.qd_hair_trigger.desc=_+1:_ His ability shots deal _10% more damage_.\n\n_+2:_ _20% more_.\n\n_+3:_ _30% more_.
actors.hero.talent.qd_speedloader.title=speedloader
actors.hero.talent.qd_speedloader.desc=_+1:_ Entering a duel gives the revolver _1 charge_.\n\n_+2:_ _2 charges_.\n\n_+3:_ _3 charges_.
actors.hero.talent.qd_duelist.title=duelist
actors.hero.talent.qd_duelist.desc=_+1:_ The duel lasts _2 more turns_.\n\n_+2:_ _4 more_.\n\n_+3:_ _6 more_.
actors.hero.talent.bh_marked.title=marked for death
actors.hero.talent.bh_marked.desc=_+1:_ Marked enemies take _10% more damage_.\n\n_+2:_ _20% more_.\n\n_+3:_ _30% more_.
actors.hero.talent.bh_long_hunt.title=long hunt
actors.hero.talent.bh_long_hunt.desc=_+1:_ The bounty lasts _10 more turns_.\n\n_+2:_ _20 more_.\n\n_+3:_ _30 more_.
actors.hero.talent.bh_collector.title=collector
actors.hero.talent.bh_collector.desc=_+1:_ Collecting a bounty heals him _3 HP_.\n\n_+2:_ _6 HP_.\n\n_+3:_ _9 HP_.
###Lead Rain talents
actors.hero.talent.lr_wide.title=wide rain
actors.hero.talent.lr_wide.desc=_+2:_ Lead Rain covers _1 more cell_ around.\n\n_+4:_ _2 more cells_.
actors.hero.talent.lr_heavy.title=heavy lead
actors.hero.talent.lr_heavy.desc=_+1:_ Lead Rain deals _15% more damage_.\n\n_+2:_ _30% more_.\n\n_+3:_ _45% more_.\n\n_+4:_ _60% more_.
actors.hero.talent.lr_stunning.title=stunning
actors.hero.talent.lr_stunning.desc=_+1:_ Each enemy hit has a _25%_ chance to be paralysed for 1 turn.\n\n_+2:_ _50%_.\n\n_+3:_ _75%_.\n\n_+4:_ Always.
###items
soulknight.gunslinger.gunslingerkit.name=sheriff's star
soulknight.gunslinger.gunslingerkit.desc=A golden, dented star. While you carry it you can use the abilities of the Gunslinger.
soulknight.gunslinger.justicerevolver.name=justice revolver
soulknight.gunslinger.justicerevolver.desc=A silver revolver with a worn wooden grip.\n\nIt works like a wand: its charges come back over time and it is fired from the quickslot. Its bullets are physical: the target's armor stops part of the damage.
soulknight.gunslinger.justicerevolver.stats_desc=Fires a bullet at the first creature in its way: _%1$d-%2$d damage_ (more in a duel).
soulknight.gunslinger.gunslingerarmor.name=gunslinger armor
soulknight.gunslinger.gunslingerarmor.desc=While wearing this armor, the Gunslinger can perform a special ability.
###abilities
soulknight.gunslinger.gunspin.name=gun spin
soulknight.gunslinger.gunspin.desc=Spins the cylinder and fires _%1$d bullets_ spread among the enemies in sight within _%2$d cells_ (the bounty first, then the closest). Each bullet deals _%3$d-%4$d damage_.
soulknight.gunslinger.gunspin.desc_short=fires several bullets at the enemies in sight.
soulknight.gunslinger.gunspin.no_target=There is no enemy within reach.
soulknight.gunslinger.bountytag.name=bounty tag
soulknight.gunslinger.bountytag.desc=Puts a price on an enemy in sight within _%1$d cells_ for _%2$d turns_: it takes _%3$d%% more damage_ from everyone and is the first target of his shots. When it dies it drops _%4$d gold_ and the bounty moves to the closest enemy in sight.
soulknight.gunslinger.bountytag.desc_short=puts a price on an enemy: it takes more damage and drops gold when it dies.
soulknight.gunslinger.bountytag.prompt=Choose who is wanted
soulknight.gunslinger.bountytag.no_target=There is no enemy in sight there.
soulknight.gunslinger.bountytag.wanted=Wanted!
soulknight.gunslinger.bountytag.moved=The bounty moves to another enemy.
soulknight.gunslinger.bountytag$mark.name=wanted
soulknight.gunslinger.bountytag$mark.desc=There is a price on this creature's head: it takes %1$d%% more damage and will drop gold when it dies.\n\nTurns left: %2$s.
soulknight.gunslinger.airstrike.name=air strike
soulknight.gunslinger.airstrike.desc=Calls a bombing on a spot in sight within _%1$d cells_: _%2$d bombs_ are marked around it and fall next turn, dealing _%3$d-%4$d damage_ to the enemies on the marked cells. They don't hurt the heroes nor their allies.
soulknight.gunslinger.airstrike.desc_short=bombs fall a turn later on the marked cells.
soulknight.gunslinger.airstrike.prompt=Choose where to bomb
soulknight.gunslinger.highnoon.name=high noon
soulknight.gunslinger.highnoon.desc=It's high noon: shoots _every enemy in sight_ within _%1$d cells_ (_%2$d-%3$d damage_) and finishes off those left below _%4$d%% health_ (never bosses). Then he is in a duel for 5 turns.
soulknight.gunslinger.highnoon.desc_short=shoots every enemy in sight and finishes off the wounded.
soulknight.gunslinger.highnoon.executed=Executed!
soulknight.gunslinger.gunslingerhooks.duel=Duel!
soulknight.gunslinger.gunslingerhooks$duel.name=duel
soulknight.gunslinger.gunslingerhooks$duel.desc=The Gunslinger is on a streak: his cooldowns run twice as fast and his shots deal %1$d%% more damage.\n\nTurns left: %2$d.
###armor ability
soulknight.gunslinger.leadrain.name=lead rain
soulknight.gunslinger.leadrain.short_desc=A rain of bullets falls on an area and hits every enemy in it.
soulknight.gunslinger.leadrain.desc=The Gunslinger covers an area in sight within %d cells with bullets. It only hits enemies.
soulknight.gunslinger.leadrain.desc_numbers=It covers _%1$d cells_ around and deals _%2$d-%3$d damage_ to each enemy.
soulknight.gunslinger.leadrain.prompt=Choose where to shoot
