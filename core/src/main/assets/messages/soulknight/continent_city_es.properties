soulknight.continent.city.fauna.cityfauna.name=city
soulknight.continent.city.fauna.lastking.name=el Último Rey
soulknight.continent.city.fauna.lastking.epithet=guardián de la ciudad devorada
soulknight.continent.city.fauna.lastking.desc=Un rey gigante que nunca se levantó del trono: el basalto, la corona y un trozo de su ciudad crecieron dentro de él, y lo arrastra todo sobre cuatro patas de carne. _Alza el cetro_ y lo deja caer: el golpe y _un anillo de piedras_ alrededor se marcan tres turnos antes. Cuando _llama a su ciudad_, se encienden todas las ventanas, las piedras de las casas caen sobre quien esté cerca (marcado) y las cosas de la ciudad acuden a él.
soulknight.continent.city.fauna.lastking.calls=El Último Rey llama a su ciudad. ¡Se encienden todas las ventanas!
soulknight.continent.city.fauna.furnacecathedral.name=horno-catedral
soulknight.continent.city.fauna.furnacecathedral.epithet=la iglesia que anda
soulknight.continent.city.fauna.furnacecathedral.desc=Una catedral entera que anda sobre seis patas de carne yog, con un horno ardiendo donde estaba la nave. Su fachada siempre mira calle abajo: cuando _suenan las campanas_ está a punto de _vomitar fuego por el pórtico_, en un cono marcado. Por detrás, _las chimeneas escupen brasas_ sobre quien esté cerca (también marcado). De vez en cuando _se abren sus puertas_ y salen las cosas de la ciudad. Quien se planta en sus puertas está golpeando el horno.
soulknight.continent.city.fauna.furnacecathedral.doors=Las puertas de la catedral se abren chirriando...
soulknight.continent.city.fauna.chainedone.name=el encadenado
soulknight.continent.city.fauna.chainedone.epithet=el preso al que nadie soltó
soulknight.continent.city.fauna.chainedone.desc=Un preso enorme y consumido con la boca cosida, atado con _cadenas de carne yog_ a tres estacas que tiene detrás: _no puede alejarse mucho de ellas_. _Azota las cadenas en arco_ por delante, o _lanza una_ a quien se mantiene lejos y lo arrastra hacia él. Las dos cosas se marcan. Si lo hieres bastante _rompe una cadena_ y llega más lejos.
soulknight.continent.city.fauna.chainedone.snaps=¡Se rompe una cadena! Ahora el encadenado llega más lejos.
soulknight.continent.city.fauna.smeltermother.name=madre fundidora
soulknight.continent.city.fauna.smeltermother.epithet=la reina de las fundiciones
soulknight.continent.city.fauna.smeltermother.desc=Una reina de latón remachado con un vientre enorme de _metal fundido que brilla_ y un crisol por boca. Abre el crisol y _escupe un chorro de metal fundido_ en un arco marcado por delante. Cada pocos turnos _pone un huevo de metal fundido_ detrás de ella: se enfría, se agrieta y _sale lo que creció dentro_. Rompe antes los huevos.
soulknight.continent.city.fauna.smeltermother.lays=La madre fundidora pone un huevo de metal fundido.
soulknight.continent.city.fauna.smeltermother$moltenegg.name=huevo fundido
soulknight.continent.city.fauna.smeltermother$moltenegg.desc=Un huevo de metal fundido, todavía al rojo. Algo se mueve dentro. Cuando _se agrieta_ salpica las casillas de alrededor (marcadas un turno antes) y salen _dos ratas de hollín_. Si lo rompes antes, no sale nada.
soulknight.continent.city.fauna.bronzeguard.name=guardia de bronce
soulknight.continent.city.fauna.bronzeguard.desc=Una armadura vacía gigante que sigue guardando una puerta que ya nadie usa. _Barre con la alabarda_ por delante y, de vez en cuando, _alza el yelmo_: dentro hay un solo ojo yog cuya _mirada quema una línea recta_. Las dos cosas se marcan. Cuando su armadura está _bastante rota_, se arrodilla ante quien le pone el collar.
soulknight.continent.city.fauna.bronzeguard.whole=Su armadura aún está entera: rómpela antes (que le quede un tercio o menos).
soulknight.continent.city.fauna.livingcarriage.name=carroza viva
soulknight.continent.city.fauna.livingcarriage.desc=Un carruaje de carne con los caballos fundidos a las varas. Rueda arriba y abajo por las calles y, cuando ve a alguien, se alinea y _lo atropella_ por un _carril marcado_.
soulknight.continent.city.fauna.bloatedbeggar.name=pordiosero hinchado
soulknight.continent.city.fauna.bloatedbeggar.desc=Un pordiosero hinchado hasta el tamaño de una casa con el gas de todo lo que comió. Lento, abofetea a quien tiene cerca. Cuando está muy herido, o tiene gente alrededor, _se hincha_ (marcado tres turnos) y _revienta_, envenenando todo lo que le rodea. Reventar lo mata.
soulknight.continent.city.fauna.bloatedbeggar.swells=¡El pordiosero se está hinchando!
soulknight.continent.city.fauna.furnacemole.name=topo-horno
soulknight.continent.city.fauna.furnacemole.desc=Excava bajo las calles con una estufa ardiendo en el lomo y _sale por las alcantarillas justo debajo de quien pasa por encima_: primero se levantan los adoquines (marcado) y luego revienta hacia fuera. Ya en la calle te lanza adoquines y, si lo dejan en paz un rato, vuelve a excavar.
soulknight.continent.city.fauna.furnacemole.rumble=¡Los adoquines empiezan a levantarse bajo tus pies!
soulknight.continent.city.fauna.bellringer.name=campanero
soulknight.continent.city.fauna.bellringer.desc=Un ser encorvado cuya cabeza es una campana de bronce. En cuanto ve a alguien _tañe_, y acuden todas las cosas grandes de la ciudad que lo oyen; sigue tañendo mientras dura la pelea. Justo a su lado, el tañido _ensordece_ (marcado).
soulknight.continent.city.fauna.bellringer.tolls=¡Una campana tañe por las calles!
soulknight.continent.city.fauna.brassraptor.name=raptor de latón
soulknight.continent.city.fauna.brassraptor.desc=Un corredor de placas de latón y carne yog que caza en manadas de dos o tres. Cuando uno encuentra a alguien _viene la manada_, y _saltan sobre la presa_ desde unas casillas: el aterrizaje se marca.
soulknight.continent.city.fauna.lamplighter.name=farolero
soulknight.continent.city.fauna.lamplighter.desc=Una piel vacía que anda con un farol encendido. Guarda las distancias y, cuando encuentra a alguien, _alza el farol sobre él_: a quien ilumina _lo ven desde lejos_ todas las cosas grandes de la ciudad, y las que están cerca acuden.
soulknight.continent.city.fauna.lamplighter.lit=El farolero alza el farol sobre ti. ¡Ahora todo puede verte!
soulknight.continent.city.fauna.fleshgargoyle.name=gárgola de carne
soulknight.continent.city.fauna.fleshgargoyle.desc=Se queda en las cornisas, tan quieta como las de piedra, y _se deja caer sobre quien pasa debajo_. El salto no se marca, pero nunca tumba a nadie de un golpe.
soulknight.continent.city.fauna.fleshgargoyle.drops=¡desde arriba!
soulknight.continent.city.fauna.sootrats.name=ratas de hollín
soulknight.continent.city.fauna.sootrats.desc=Nunca una sola: una marea negra de ellas sale de las chimeneas y las alcantarillas. Cada una no es nada, pero _con tres o más encima de alguien_ cada mordisco puede abrir una herida, y _huelen la sangre_.
soulknight.continent.city.fauna.chaindog.name=perro de cadena
soulknight.continent.city.fauna.chaindog.desc=Sigue encadenado al poste donde lo dejaron sus amos: _no llega más allá de la cadena_ y le ladra a todo. Si _tira tres veces_ intentando alcanzar a alguien, la cadena cede.
soulknight.continent.city.fauna.chaindog.loose=¡suelto!
soulknight.continent.city.fauna.chaindog.breaks=¡Cede la cadena del perro!
