###yogs
soulknight.continent.yog.yogeye.name=ojo menor
soulknight.continent.yog.yogeye.desc=Un ojo de yog que flota arrastrando sus venas. Se mantiene lejos y _abrasa con la mirada una línea recta_: la línea brilla un turno antes. Su contacto corrompe.

soulknight.continent.yog.yoglarva.name=larva de yog
soulknight.continent.yog.yoglarva.desc=Una cosita blanda y ciega. Salen _de cuatro en cuatro_, y si tres se quedan juntas unos turnos _se funden en un ojo menor_.
soulknight.continent.yog.yoglarva.pulse=late
soulknight.continent.yog.yoglarva.fused=¡Las larvas se funden en un ojo menor!

soulknight.continent.yog.burningfist.name=puño ardiente
soulknight.continent.yog.burningfist.desc=Un puño de yog que no deja de arder. Sus golpes _te prenden fuego_ y cada pocos turnos lanza una _bola de fuego_ sobre las casillas marcadas. Basta un paso al lado para esquivarla.

soulknight.continent.yog.yogtongue.name=lengua de yog
soulknight.continent.yog.yogtongue.desc=Una lengua que espera en un charco de corrupción. A quien pase _a 2 casillas_ lo arrastra a su lado y lo sujeta, y la corrupción sube cada turno que lo tiene. No puede moverse: _córtala_ para soltarte. Cuesta acertarle, pero muere enseguida.
soulknight.continent.yog.yogtongue.grabbed=¡Una lengua te agarra y te arrastra hasta su charco!
soulknight.continent.yog.yogtongue$grip.name=Atrapado por una lengua
soulknight.continent.yog.yogtongue$grip.desc=Una lengua de yog te sujeta y su corrupción te empapa cada turno. Mátala para soltarte.

###llanuras de ceniza
soulknight.continent.ash.ashwalker.name=caminante de ceniza
soulknight.continent.ash.ashwalker.desc=Ceniza que camina. Al caer deja una _nube que ciega_ a quien tenga al lado y un _montón de ceniza_ que se vuelve a levantar con media vida si nadie lo pisa a tiempo.
soulknight.continent.ash.ashwalker$heap.name=montón de ceniza
soulknight.continent.ash.ashwalker$heap.desc=Lo que queda de un caminante de ceniza. Empieza a moverse... _Písalo_ (vale cualquier golpe) antes de que se levante otra vez.
soulknight.continent.ash.ashwalker$heap.stir=se mueve
soulknight.continent.ash.ashwalker$heap.reformed=¡El montón de ceniza se vuelve a levantar!
soulknight.continent.ash.ashwalker$cloud.desc=Aquí flota una nube de ceniza caliente. Ciega a quien se queda dentro.

soulknight.continent.ash.salamander.name=salamandra de lava negra
soulknight.continent.ash.salamander.desc=Nada en la lava negra, donde _no se la ve ni se la puede herir_. Sale para _escupir brasas_ sobre las casillas marcadas y se vuelve a hundir. Fuera de la lava pelea como cualquier bestia.

soulknight.continent.ash.smokevulture.name=buitre de humo
soulknight.continent.ash.smokevulture.desc=Vuela en círculos fuera de tu alcance y _baja en picado por una línea marcada_ contra quien más se aleja de los demás. Su golpe _apaga las antorchas_. Es carroñero: _sigue a los colosos_ y huele la sangre, así que _los heridos son los primeros_.
soulknight.continent.ash.smokevulture.dive=¡El buitre de humo te ha elegido!
soulknight.continent.ash.smokevulture.marked=presa
soulknight.continent.ash.smokevulture.snuffed=¡Las alas del buitre te apagan la antorcha!
soulknight.continent.ash.smokevulture.dark=sin luz

soulknight.continent.ash.obsidiancolossus.name=coloso de obsidiana
soulknight.continent.ash.obsidiancolossus.desc=Una colina de cristal negro que camina despacio. Su caparazón _se agrieta_ con los golpes y pierde armadura cada vez; cuando se rompe, _se derrama la lava de dentro_ y el coloso se vuelve rápido. Golpea el suelo a su alrededor, marcado un turno antes.
soulknight.continent.ash.obsidiancolossus.crack=¡crac!
soulknight.continent.ash.obsidiancolossus.molten=¡El caparazón de obsidiana estalla y sale la lava!

###bestias de las llanuras de ceniza (mundo abierto)
soulknight.continent.ash.fauna.ashcolossus.essence=Del pecho de %s cae una gota de esencia sagrada.

soulknight.continent.ash.fauna.scoriajackal.name=chacal de escoria
soulknight.continent.ash.fauna.scoriajackal.desc=Perros flacos de ceniza con costillas de escoria. Cazan _en jaurías de cuatro a seis_: el primero que te ve aúlla y vienen todos. Se reparten a tu alrededor y, cuando muerden dos a la vez, _te empujan un paso_, a poder ser hacia la lava. _Huelen la sangre_ desde muy lejos.
soulknight.continent.ash.fauna.scoriajackal.shoved=¡empujón!

soulknight.continent.ash.fauna.emberflea.name=pulga de brasa
soulknight.continent.ash.fauna.emberflea.desc=Un parásito del tamaño de una uña con el abdomen encendido. Vive _en el lomo de las bestias de fuego_ (bisontes, el gigante, la tortuga, la Pira) y _salta sobre quien se acerca_. Cuesta acertarle, muere de un golpe y su picadura _prende fuego_.
soulknight.continent.ash.fauna.emberflea.leap=¡Unas pulgas de brasa te saltan encima!

soulknight.continent.ash.fauna.mimicbird.name=ave que imita
soulknight.continent.ash.fauna.mimicbird.desc=Parece un pájaro carroñero, pero tiene tres ojos humanos y unos labios en la garganta. Se queda cerca de las peores bestias y, desde la oscuridad, _imita la voz de tus compañeros_ para que vayas. Si vas solo, imita otras cosas. _No te fíes de una voz que no ves._
soulknight.continent.ash.fauna.mimicbird.call_0=¡ayuda, estoy aquí!
soulknight.continent.ash.fauna.mimicbird.call_1=¡venid, he encontrado algo!
soulknight.continent.ash.fauna.mimicbird.call_2=estoy herido... por aquí...
soulknight.continent.ash.fauna.mimicbird.call_3=¿dónde estáis? no veo nada
soulknight.continent.ash.fauna.mimicbird.solo_0=Alguien te llama por tu nombre, no muy lejos, en la oscuridad.
soulknight.continent.ash.fauna.mimicbird.solo_1=Oyes el tintineo de unas monedas que caen, por allí.
soulknight.continent.ash.fauna.mimicbird.solo_2=Un niño llora entre la ceniza. Luego se calla.
soulknight.continent.ash.fauna.mimicbird.solo_3=Oyes tus propios pasos... pero estás quieto.
soulknight.continent.ash.fauna.mimicbird.solo_4=Una voz débil pide ayuda y se apaga.

soulknight.continent.ash.fauna.lavasalamander.name=salamandra de lava negra
soulknight.continent.ash.fauna.lavasalamander.desc=Una salamandra del tamaño de una carreta. _Nada bajo la lava_, donde no se la ve ni se la puede herir, y _sale de golpe a morder_ a quien camina por la orilla, sin aviso. Después se queda fuera un momento: ese es el momento de golpearla.
soulknight.continent.ash.fauna.lavasalamander.ambush=¡emboscada!

soulknight.continent.ash.fauna.smelterbeetle.name=escarabajo fundidor
soulknight.continent.ash.fauna.smelterbeetle.desc=Un escarabajo con caparazón de escoria y el vientre fundido. Baja el cuerno, _se marca el carril de delante_ y embiste en línea recta hasta chocar, dejando _un surco de escoria fundida_ que quema. Si choca contra algo se queda aturdido y con el caparazón abierto.

soulknight.continent.ash.fauna.obsidianbrute.name=coloso de obsidiana
soulknight.continent.ash.fauna.obsidianbrute.desc=Una colina de cristal negro que anda sobre los nudillos. Es _lento y no se aleja de su territorio_. Cuando alza un puño, _las casillas marcadas_ reciben un golpe que mata; con los dos puños arriba golpea _todo el suelo a su alrededor_. Su piel de espejo _devuelve la magia_ a quien la lanza.
soulknight.continent.ash.fauna.obsidianbrute.reflected=reflejado

soulknight.continent.ash.fauna.basaltbison.name=bisonte de basalto
soulknight.continent.ash.fauna.basaltbison.desc=Bisontes enormes con columnas de basalto en la joroba. Pastan _en manada_ y son _pacíficos_. Pero un ruido cerca, una antorcha que se acerca o un golpe, y la manada _sale en estampida_: un turno de susto, se marca el camino y arrasan lo que haya, dos casillas por turno. Si vuelves a herir a uno cuando aún está nervioso, se defiende. Algunos llevan _pulgas de brasa_ en la lana.
soulknight.continent.ash.fauna.basaltbison.spooked=¡La manada de bisontes se espanta!

soulknight.continent.ash.fauna.beakrex.name=rex picudo
soulknight.continent.ash.fauna.beakrex.desc=Un cazador de las llanuras: plumón de carbón, cuello pelado y un pico ganchudo de hueso. _Te encuentra por la luz y el ruido_ y ruge al verte. Luego, o _baja la cabeza y carga_ por un carril marcado, o _coge aire_ (le brilla la garganta) y escupe _un cono de fuego_. Las dos cosas dan tiempo a apartarse.
soulknight.continent.ash.fauna.beakrex.roar=¡Un rugido rasga la oscuridad!

soulknight.continent.ash.fauna.volcanoturtle.name=tortuga volcán
soulknight.continent.ash.fauna.volcanoturtle.epithet=la montaña que anda
soulknight.continent.ash.fauna.volcanoturtle.desc=Antigua y _pacífica_: una montaña que pasta ceniza, tan despacio que alguien construyó sobre su caparazón hace mucho. _Si la hieres, el volcán despierta_: cada pocos turnos lanza bombas de lava alrededor de quien la ataca, con el sitio _marcado dos turnos antes_. Si la dejas en paz, se calma.
soulknight.continent.ash.fauna.volcanoturtle.wakes=¡El volcán de la tortuga ruge y empieza a escupir lava!
soulknight.continent.ash.fauna.volcanoturtle.calm=La tortuga volcán se calma. El volcán vuelve a humear en silencio.

soulknight.continent.ash.fauna.slaggiant.name=gigante de escoria
soulknight.continent.ash.fauna.slaggiant.epithet=el que duerme bajo la ceniza
soulknight.continent.ash.fauna.slaggiant.desc=Un gigante de escoria negra que _duerme medio enterrado_: parece una loma con espinazo. _El ruido, una luz cerca, un golpe o pisarlo_ lo despiertan, y tarda dos turnos en ponerse en pie. Entonces _arranca columnas de basalto y las lanza_: donde caen se marca dos turnos antes. Si nadie lo molesta, vuelve a enterrarse.
soulknight.continent.ash.fauna.slaggiant.wakes=¡La loma de ceniza se levanta! Es un gigante.

soulknight.continent.ash.fauna.walkingpyre.name=la Pira Andante
soulknight.continent.ash.fauna.walkingpyre.epithet=guardiana de las llanuras de ceniza
soulknight.continent.ash.fauna.walkingpyre.desc=La guardiana de la Ceniza ya no espera al final de las llanuras: _recorre la superficie_ sobre los nudillos, una colina de troncos ardiendo y placas de escoria con _un corazón de esencia sagrada_ que asoma por una grieta del pecho. _Ve una antorcha desde muy lejos._ Su puño cae sobre _un cuadro de 5x5_ marcado tres turnos antes, y quien se queda dentro muere; a quien se pega a su cuerpo lo pisotea.

soulknight.continent.ash.fauna.ashwhale.name=ballena de ceniza
soulknight.continent.ash.fauna.ashwhale.epithet=la que nada bajo la ceniza
soulknight.continent.ash.fauna.ashwhale.desc=Nada _bajo la ceniza honda_: solo se ve una aleta, una estela de humo y un surco. _Siente a quien camina por la ceniza_ (el camino y la roca son seguros) y viene. Cuando la tienes debajo, el suelo _se agrieta durante tres turnos_ en un cuadro de 5x5, y luego sale con las cuatro mandíbulas abiertas y _se traga lo que haya_. Se queda fuera unos turnos, lo único en que se la puede herir, y se hunde otra vez.
soulknight.continent.ash.fauna.ashwhale.cracks=¡El suelo se agrieta y se abomba bajo tus pies!
soulknight.continent.ash.fauna.ashwhale.spat=La ballena te escupe, medio digerido.

soulknight.continent.ash.fauna.slagtrail.desc=Un surco de escoria fundida. Quema a quien lo pisa, pero se enfría en unos turnos.
soulknight.continent.ash.fauna.ashcolossus.weak_hit=¡punto débil!
soulknight.continent.ash.fauna.ashcolossus.down=¡%s cae derribado! Su punto débil queda al descubierto.
soulknight.continent.ash.fauna.ashcolossus.rise=%s se levanta.
soulknight.continent.ash.fauna.ashcolossus.untamable=Esa bestia no se deja domar.
soulknight.continent.ash.fauna.ashcolossus.tamed=%s acepta el collar de luz. Ahora es del grupo.
soulknight.continent.ash.fauna.ashcolossus.ride_small=%1$s es demasiado pequeño para subirse encima: solo se trepa a los de %2$dx%2$d o más.
soulknight.continent.ash.fauna.ashcolossus.ride_full=No queda sitio en el lomo de %s.
soulknight.continent.ash.fauna.ashtarantula.name=tarántula de ceniza
soulknight.continent.ash.fauna.ashtarantula.desc=Una araña del tamaño de una casa: quitina negra, pelos con puntas de brasa y un saco de huevos que brilla bajo el abdomen (_su punto débil_). Espera en lo bajo y _lanza redes de ceniza endurecida_ que te dejan clavado, o se alza y _salta encima_ de quien está cerca. Las dos cosas se marcan antes. Se deja domar _pagándole una esencia_.
soulknight.continent.ash.fauna.ashtarantula.epithet=la que teje la ceniza
soulknight.continent.ash.fauna.ashtarantula.price=Te pide una gota de esencia sagrada, y el grupo no tiene ninguna.
soulknight.continent.ash.fauna.beakrex.standing=Tiene que estar derribado para dejarse poner el collar.
soulknight.continent.ash.fauna.basaltbison.fleas=Las pulgas lo vuelven loco: líbralo de ellas primero.
soulknight.continent.ash.fauna.basaltbison.wild=Está demasiado asustado.
soulknight.continent.ash.fauna.volcanoturtle.angry=Está demasiado enfadada.
soulknight.continent.ash.fauna.volcanoturtle.hungry=Tiene hambre: necesitas 2 asados de coloso para ella.
