#Pistolero (es)
###clase
actors.hero.heroclass.gunslinger=pistolero
actors.hero.heroclass.gunslinger_desc_short=El _Pistolero_ es un sheriff de gatillo rápido: vacía el tambor sobre los enemigos, pone precio a sus cabezas y pide bombardeos desde el cielo.
actors.hero.heroclass.gunslinger_desc=El sheriff de la ciudad bajó a la mazmorra persiguiendo a una banda de forajidos y nunca volvió a subir. El Pistolero empieza con una _estrella de sheriff_, que le da _Giro del tambor_, _Cartel de recompensa_ (nivel 2), _Apoyo aéreo_ (nivel 4) y la _Hora del duelo_ (nivel 6).\n\nSu pasiva, la _racha_: si mata a 3 enemigos seguidos, cada uno poco después del anterior, entra en _duelo_: durante unos turnos sus enfriamientos van el doble de rápido y sus disparos hacen un 25% más de daño.\n\nTambién empieza con un _cuchillo_, un _revólver justiciero_ (un arma que se usa como una varita), armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de curación\n_-_ Pergaminos de recarga\n\nCuando dispara un arma de fuego, _la siguiente arma con cargas de su mochila dispara también_. Un arma vacía se puede _recargar_ hasta la mitad (cada 15 turnos).
actors.hero.heroclass.gunslinger_unlock=Los campeones están desbloqueados desde el principio.
###subclases
actors.hero.herosubclass.quickdraw=desenfundador
actors.hero.herosubclass.quickdraw_short_desc=El _Desenfundador_ dispara 2 balas más con el Giro del tambor.
actors.hero.herosubclass.quickdraw_desc=El Giro del tambor dispara _2 balas más_. Sus talentos hacen que sus disparos peguen más, que el duelo recargue su revólver y que los duelos duren más.
actors.hero.herosubclass.bounty_hunter=cazarrecompensas
actors.hero.herosubclass.bounty_hunter_short_desc=El _Cazarrecompensas_ pone recompensas más altas, y sus marcados reciben mucho más daño.
actors.hero.herosubclass.bounty_hunter_desc=Sus marcados con el Cartel de recompensa reciben un _40% más de daño_ en vez de un 25%, y sueltan _el doble de oro_. Sus talentos aumentan aún más el daño, alargan la caza y lo curan al cobrar.
###talentos del Pistolero
actors.hero.talent.gs_gun_oil.title=aceite de armas
actors.hero.talent.gs_gun_oil.desc=_+1:_ Al comer, el revólver recupera _1 carga_ (puede pasar de su máximo).\n\n_+2:_ Recupera _2 cargas_.
actors.hero.talent.gs_appraisal.title=tasación
actors.hero.talent.gs_appraisal.desc=_+1:_ El Pistolero identifica armas y armaduras _1,75 veces más rápido_.\n\n_+2:_ Las identifica _2,5 veces más rápido_.
actors.hero.talent.gs_steady_aim.title=pulso firme
actors.hero.talent.gs_steady_aim.desc=_+1:_ El revólver hace _1 de daño más_.\n\n_+2:_ _2 más_.
actors.hero.talent.gs_thick_coat.title=guardapolvo grueso
actors.hero.talent.gs_thick_coat.desc=_+1:_ Gana hasta _1 de armadura_.\n\n_+2:_ Hasta _2_.
actors.hero.talent.gs_fast_reload.title=recarga rápida
actors.hero.talent.gs_fast_reload.desc=_+1:_ El Giro del tambor se enfría _2 turnos antes_.\n\n_+2:_ _4 turnos antes_.
actors.hero.talent.gs_deadeye.title=ojo certero
actors.hero.talent.gs_deadeye.desc=_+1:_ El Giro del tambor dispara _1 bala más_.\n\n_+2:_ _2 balas más_.
actors.hero.talent.gs_big_bounty.title=gran recompensa
actors.hero.talent.gs_big_bounty.desc=_+1:_ Las recompensas dan un _50% más de oro_.\n\n_+2:_ El _doble_.
actors.hero.talent.gs_carpet_bomb.title=bombardeo en alfombra
actors.hero.talent.gs_carpet_bomb.desc=_+1:_ El Apoyo aéreo suelta _1 bomba más_.\n\n_+2:_ _2 bombas más_.
actors.hero.talent.gs_hot_streak.title=racha caliente
actors.hero.talent.gs_hot_streak.desc=_+1:_ El duelo dura _3 turnos más_.\n\n_+2:_ _6 turnos más_.
actors.hero.talent.gs_execution.title=ejecución
actors.hero.talent.gs_execution.desc=_+1:_ La Hora del duelo remata a los enemigos con menos del _25%_ de vida (en vez del 20%).\n\n_+2:_ Del _30%_.\n\n_+3:_ Del _35%_.
actors.hero.talent.gs_ricochet.title=rebote
actors.hero.talent.gs_ricochet.desc=_+1:_ Cada bala del Giro del tambor tiene un _15%_ de rebotar y dar a otro enemigo.\n\n_+2:_ Un _30%_.\n\n_+3:_ Un _45%_.
actors.hero.talent.qd_hair_trigger.title=gatillo sensible
actors.hero.talent.qd_hair_trigger.desc=_+1:_ Sus disparos de habilidad hacen un _10% más de daño_.\n\n_+2:_ Un _20% más_.\n\n_+3:_ Un _30% más_.
actors.hero.talent.qd_speedloader.title=cargador rápido
actors.hero.talent.qd_speedloader.desc=_+1:_ Al entrar en duelo, el revólver recupera _1 carga_.\n\n_+2:_ _2 cargas_.\n\n_+3:_ _3 cargas_.
actors.hero.talent.qd_duelist.title=duelista
actors.hero.talent.qd_duelist.desc=_+1:_ El duelo dura _2 turnos más_.\n\n_+2:_ _4 más_.\n\n_+3:_ _6 más_.
actors.hero.talent.bh_marked.title=sentenciado
actors.hero.talent.bh_marked.desc=_+1:_ Los marcados reciben un _10% más de daño_.\n\n_+2:_ Un _20% más_.\n\n_+3:_ Un _30% más_.
actors.hero.talent.bh_long_hunt.title=caza larga
actors.hero.talent.bh_long_hunt.desc=_+1:_ La recompensa dura _10 turnos más_.\n\n_+2:_ _20 más_.\n\n_+3:_ _30 más_.
actors.hero.talent.bh_collector.title=cobrador
actors.hero.talent.bh_collector.desc=_+1:_ Cobrar una recompensa lo cura _3 PS_.\n\n_+2:_ _6 PS_.\n\n_+3:_ _9 PS_.
###talentos de la Lluvia de plomo
actors.hero.talent.lr_wide.title=lluvia ancha
actors.hero.talent.lr_wide.desc=_+2:_ La Lluvia de plomo cubre _1 casilla más_ alrededor.\n\n_+4:_ _2 casillas más_.
actors.hero.talent.lr_heavy.title=plomo pesado
actors.hero.talent.lr_heavy.desc=_+1:_ La Lluvia de plomo hace un _15% más de daño_.\n\n_+2:_ Un _30% más_.\n\n_+3:_ Un _45% más_.\n\n_+4:_ Un _60% más_.
actors.hero.talent.lr_stunning.title=aturdidora
actors.hero.talent.lr_stunning.desc=_+1:_ Cada enemigo alcanzado tiene un _25%_ de quedar paralizado 1 turno.\n\n_+2:_ Un _50%_.\n\n_+3:_ Un _75%_.\n\n_+4:_ Siempre.
###objetos
soulknight.gunslinger.gunslingerkit.name=estrella de sheriff
soulknight.gunslinger.gunslingerkit.desc=Una estrella dorada y abollada. Mientras la lleves encima podrás usar las habilidades del Pistolero.
soulknight.gunslinger.justicerevolver.name=revólver justiciero
soulknight.gunslinger.justicerevolver.desc=Un revólver plateado con la culata de madera gastada.\n\nFunciona como una varita: tiene cargas que se recuperan con el tiempo y se dispara desde la barra rápida. Sus balas son físicas: la armadura del objetivo para una parte del daño.
soulknight.gunslinger.justicerevolver.stats_desc=Dispara una bala al primero que encuentra: _%1$d-%2$d de daño_ (más en duelo).
soulknight.gunslinger.gunslingerarmor.name=armadura del pistolero
soulknight.gunslinger.gunslingerarmor.desc=Mientras lleve esta armadura, el Pistolero puede realizar una habilidad especial.
###habilidades
soulknight.gunslinger.gunspin.name=giro del tambor
soulknight.gunslinger.gunspin.desc=Gira el tambor y dispara _%1$d balas_ repartidas entre los enemigos a la vista a _%2$d casillas_ o menos (primero al de la recompensa, luego a los más cercanos). Cada bala hace _%3$d-%4$d de daño_.
soulknight.gunslinger.gunspin.desc_short=dispara varias balas a los enemigos a la vista.
soulknight.gunslinger.gunspin.no_target=No hay ningún enemigo a tiro.
soulknight.gunslinger.bountytag.name=cartel de recompensa
soulknight.gunslinger.bountytag.desc=Pone precio a un enemigo a la vista, a _%1$d casillas_ o menos, durante _%2$d turnos_: recibe un _%3$d%% más de daño_ de todos y es el primer blanco de sus disparos. Al morir suelta _%4$d de oro_ y la recompensa pasa al enemigo más cercano a la vista.
soulknight.gunslinger.bountytag.desc_short=pone precio a un enemigo: recibe más daño y suelta oro al morir.
soulknight.gunslinger.bountytag.prompt=Elige a quién buscar
soulknight.gunslinger.bountytag.no_target=Ahí no hay ningún enemigo a la vista.
soulknight.gunslinger.bountytag.wanted=¡Se busca!
soulknight.gunslinger.bountytag.moved=La recompensa pasa a otro enemigo.
soulknight.gunslinger.bountytag$mark.name=se busca
soulknight.gunslinger.bountytag$mark.desc=Hay precio por la cabeza de esta criatura: recibe un %1$d%% más de daño y soltará oro al morir.\n\nTurnos restantes: %2$s.
soulknight.gunslinger.airstrike.name=apoyo aéreo
soulknight.gunslinger.airstrike.desc=Pide un bombardeo sobre un punto a la vista a _%1$d casillas_ o menos: se marcan _%2$d bombas_ alrededor y caen al turno siguiente, haciendo _%3$d-%4$d de daño_ a los enemigos de las casillas marcadas. No hacen daño a los héroes ni a sus aliados.
soulknight.gunslinger.airstrike.desc_short=caen bombas un turno después sobre las casillas marcadas.
soulknight.gunslinger.airstrike.prompt=Elige dónde bombardear
soulknight.gunslinger.highnoon.name=hora del duelo
soulknight.gunslinger.highnoon.desc=Es mediodía: dispara a _todos los enemigos a la vista_ a _%1$d casillas_ o menos (_%2$d-%3$d de daño_) y remata a los que se queden por debajo del _%4$d%% de vida_ (nunca a los jefes). Después entra en duelo 5 turnos.
soulknight.gunslinger.highnoon.desc_short=dispara a todos los enemigos a la vista y remata a los heridos.
soulknight.gunslinger.highnoon.executed=¡Ejecutado!
soulknight.gunslinger.gunslingerhooks.duel=¡Duelo!
soulknight.gunslinger.gunslingerhooks$duel.name=duelo
soulknight.gunslinger.gunslingerhooks$duel.desc=El Pistolero está en racha: sus enfriamientos van el doble de rápido y sus disparos hacen un %1$d%% más de daño.\n\nTurnos restantes: %2$d.
###habilidad de armadura
soulknight.gunslinger.leadrain.name=lluvia de plomo
soulknight.gunslinger.leadrain.short_desc=Una lluvia de balas cae sobre una zona y alcanza a todos los enemigos que hay en ella.
soulknight.gunslinger.leadrain.desc=El Pistolero cubre de balas una zona a la vista a %d casillas o menos. Solo alcanza a los enemigos.
soulknight.gunslinger.leadrain.desc_numbers=Cubre _%1$d casillas_ alrededor y hace _%2$d-%3$d de daño_ a cada enemigo.
soulknight.gunslinger.leadrain.prompt=Elige dónde disparar
