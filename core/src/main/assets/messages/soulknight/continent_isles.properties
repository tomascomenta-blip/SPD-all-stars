soulknight.continent.isles.fauna.islesfauna.name=isles

soulknight.continent.wild.wildcolossus.ambush=%s comes at you out of nowhere!

soulknight.continent.wild.greatworm.name=blind worm
soulknight.continent.wild.greatworm.epithet=the one that hears under everything
soulknight.continent.wild.greatworm.desc=It lives under the whole continent: a column of pale flesh with a lamprey mouth and _no eyes at all_. It only hears. _Make a racket_ (a fight, a roar, a crash) and it comes through the rock to there. The ground _cracks over a marked patch for three turns_, then it comes up and bites whatever is in it. It stays out a few turns, _the only time it can be hurt_ (the throat, at the top of the column), and goes back down.
soulknight.continent.wild.greatworm.cracks=The ground cracks and trembles. Something is coming up from below!

soulknight.continent.isles.fauna.castaway.name=castaway
soulknight.continent.isles.fauna.castaway.desc=What's left of the expeditions that came before: a drowned man that still walks, barnacles of yog flesh on a coat in rags. It shambles after noise and _spits black water_ down a marked line at whoever is a few steps off.

soulknight.continent.isles.fauna.yogjellyfish.name=yog jellyfish
soulknight.continent.isles.fauna.yogjellyfish.desc=A bell of violet jelly with a yog eye floating inside, drifting a little over the ground and the water. It spreads its tentacles (marked) and _lets out a discharge_ all around itself that numbs for a moment and corrupts.

soulknight.continent.isles.fauna.lighthousecrab.name=lighthouse crab
soulknight.continent.isles.fauna.lighthousecrab.desc=A huge crab wearing a ruined lighthouse for a shell, the lamp still lit inside a cage of iron. _Its beam sweeps a marked strip_, blinds and _drags you towards the pincers_. Its weak spot is where the tower sinks into the shell.
soulknight.continent.isles.fauna.lighthousecrab.lamp=Its lamp flickers: it wants a sacred torch for it before it takes the collar.

soulknight.continent.isles.fauna.inkeel.name=ink eel
soulknight.continent.isles.fauna.inkeel.desc=A black eel as long as a ship, crawling along the shore. It rears up and _throws itself down a short marked strip_, or _spits a ball of ink_ that bursts over a marked patch: it burns and blinds. Hit it in the gills.

soulknight.continent.isles.fauna.tideoctopus.name=tide octopus
soulknight.continent.isles.fauna.tideoctopus.epithet=the arms of the tide
soulknight.continent.isles.fauna.tideoctopus.desc=A tall wet mantle the colour of ink with plates of yog flesh that glow, and eight arms spread over the ground. It _lashes two arms down a marked strip_ and, pressed, _throws a cloud of ink_ over a wide patch that leaves you blind. Its eyes are under the mantle: climb it.

soulknight.continent.isles.fauna.islandlizard.name=island lizard
soulknight.continent.isles.fauna.islandlizard.epithet=the island that breathes
soulknight.continent.isles.fauna.islandlizard.desc=Asleep it _is an island_: a mound of yog earth with twisted trees, rocks and a ring of foam. Only the tip of a tail and a shut eyelid at the shore give it away. _Step on it and it wakes_, shakes everyone off its back and the eyes on its back open. Awake it bites down a marked strip in front and thrashes around itself.
soulknight.continent.isles.fauna.islandlizard.wakes=The island shudders under your feet... and opens its eyes!

soulknight.continent.isles.fauna.yogtrueform.name=yog, true form
soulknight.continent.isles.fauna.yogtrueform.epithet=what was always under the isles
soulknight.continent.isles.fauna.yogtrueform.desc=A mountain of yog flesh in three moods. _Shut_, it is plated in bone, slams the ground and calls its brood. At two thirds the plates crack and _the great eye opens_: it looks at you down a marked beam, and the eye can be hit. At one third it _splits under the eye and blooms_: light comes down on everyone at once and it never rests. Every blow it lands corrupts.
soulknight.continent.isles.fauna.yogtrueform.phase2=The bone plates crack. The great eye opens... and looks at you.
soulknight.continent.isles.fauna.yogtrueform.phase3=Yog splits open under the eye. A mouth blooms, full of light!
soulknight.continent.isles.fauna.yogtrueform.brood=Its flesh bulges and the brood comes out of it.
soulknight.continent.isles.fauna.yogtrueform.true_end=Yog falls, and the %d drops of sacred essence you carry burn bright. The portal can be closed for good.
soulknight.continent.isles.fauna.yogtrueform.not_enough=Yog falls, but you carry only %1$d of the %2$d drops of essence. Its flesh is already stirring again...
