###el Continente oscuro: lo que le pasa a la tierra
soulknight.continent.events.worldevents.dir_0=norte
soulknight.continent.events.worldevents.dir_1=noreste
soulknight.continent.events.worldevents.dir_2=este
soulknight.continent.events.worldevents.dir_3=sureste
soulknight.continent.events.worldevents.dir_4=sur
soulknight.continent.events.worldevents.dir_5=suroeste
soulknight.continent.events.worldevents.dir_6=oeste
soulknight.continent.events.worldevents.dir_7=noroeste

soulknight.continent.events.giantsteps.name=Pasos del gigante
soulknight.continent.events.giantsteps.far=El suelo se estremece, y otra vez, y otra: algo enorme viene caminando hacia aquí, todavía lejos.
soulknight.continent.events.giantsteps.far_under=Cae polvo del techo con cada golpe lejano: algo enorme camina ahí arriba.
soulknight.continent.events.giantsteps.near=¡Sus pies van a caer aquí mismo! Sal del suelo marcado.
soulknight.continent.events.giantsteps.near_under=¡El techo cede bajo sus pasos! Sal del suelo marcado.
soulknight.continent.events.giantsteps.gone=Los pasos se pierden a lo lejos. Fuera lo que fuese, no llegaste a verlo.
soulknight.continent.events.giantsteps.turns=Los pasos se desvían y se pierden.
soulknight.continent.events.giantsteps.card_far=Algo enorme viene caminando hacia aquí
soulknight.continent.events.giantsteps.card_near=Donde caerán sus pies está marcado: apártate
soulknight.continent.events.giantsteps.card_near_under=El techo se viene abajo donde pisa: apártate
soulknight.continent.events.giantsteps$foot.name=el pie de algo que nadie vio
soulknight.continent.events.giantsteps$foot.rankings_desc=Pisoteado por algo que nadie vio

soulknight.continent.events.yogtide.name=Marea yog
soulknight.continent.events.yogtide.warn_edge=Un resplandor violeta se extiende por la tierra al %s: llega la marea yog.
soulknight.continent.events.yogtide.warn_well=Algo violeta brota del suelo al %s: sube una marea yog.
soulknight.continent.events.yogtide.warn_deep=Algo violeta brota de lo hondo al %s: sube una marea yog.
soulknight.continent.events.yogtide.rise=La marea se derrama por el suelo. Dentro, la corrupción sube deprisa: no te metas, o crúzala rápido.
soulknight.continent.events.yogtide.brood=Con la marea llegan criaturas de yog. Fuera de ella no duran mucho.
soulknight.continent.events.yogtide.soaked=La marea te empapa: notas cómo sube la corrupción a cada paso.
soulknight.continent.events.yogtide.ebb=La marea deja de avanzar y empieza a retirarse.
soulknight.continent.events.yogtide.gone=La marea se ha ido. Lo que trajo se deshace fuera de ella.
soulknight.continent.events.yogtide.card_warn=Se acerca una ola de corrupción
soulknight.continent.events.yogtide.card_rise=Dentro la corrupción sube deprisa, y con ella llega la prole de yog

soulknight.continent.events.storm.name_ash=Tormenta de ceniza
soulknight.continent.events.storm.name_flesh=Lluvia de sangre
soulknight.continent.events.storm.name_city=Tormenta de hollín
soulknight.continent.events.storm.name_frost=Ventisca
soulknight.continent.events.storm.name_bones=Polvo de hueso
soulknight.continent.events.storm.name_isles=Niebla de mar
soulknight.continent.events.storm.warn_ash=Se levanta el viento y un muro oscuro de ceniza avanza por la llanura.
soulknight.continent.events.storm.warn_flesh=El aire se vuelve cálido y pesado, y empiezan a caer las primeras gotas rojas.
soulknight.continent.events.storm.warn_city=Las chimeneas de la ciudad muerta tosen negro: baja por las calles una tormenta de hollín.
soulknight.continent.events.storm.warn_frost=El cielo se pone blanco al norte y el frío aprieta: viene una ventisca.
soulknight.continent.events.storm.warn_bones=El viento levanta el polvo pálido del cementerio en una nube que lo tapa todo.
soulknight.continent.events.storm.warn_isles=Una niebla gris sube del mar y se arrastra sobre las islas.
soulknight.continent.events.storm.start_ash=La tormenta de ceniza se te echa encima. Apenas ves, pero tampoco te ven bien, y el viento se traga el ruido.
soulknight.continent.events.storm.start_flesh=Llueve sangre. Ves menos y te ven menos, y la lluvia borra cualquier rastro de sangre: nada puede seguir su olor.
soulknight.continent.events.storm.start_city=El hollín lo cubre todo. Ves menos y te ven menos, y tapa cualquier brillo: los ojos de yog y los fuegos no se distinguen de lejos.
soulknight.continent.events.storm.start_frost=Golpea la ventisca. Ves menos y te ven menos, el viento tapa el ruido, y el frío te frena si no te quedas junto a un fuego.
soulknight.continent.events.storm.start_bones=El polvo de hueso es tan espeso que apenas te ves las manos. Pero ahí fuera nada te ve a ti tampoco.
soulknight.continent.events.storm.start_isles=La niebla se cierra. Ves menos y te ven menos, pero sobre el agua cualquier ruido llega mucho más lejos: no hagas ruido.
soulknight.continent.events.storm.end_ash=El viento amaina y la ceniza se posa. La tormenta ha pasado.
soulknight.continent.events.storm.end_flesh=La lluvia roja se aclara y para.
soulknight.continent.events.storm.end_city=El hollín se posa sobre todo. El aire se aclara.
soulknight.continent.events.storm.end_frost=La ventisca se agota.
soulknight.continent.events.storm.end_bones=El polvo vuelve al suelo y los huesos asoman de nuevo.
soulknight.continent.events.storm.end_isles=La niebla se levanta de las islas.
soulknight.continent.events.storm.card_warn_ash=Viene una tormenta de ceniza
soulknight.continent.events.storm.card_warn_flesh=Viene una lluvia de sangre
soulknight.continent.events.storm.card_warn_city=Viene una tormenta de hollín
soulknight.continent.events.storm.card_warn_frost=Viene una ventisca
soulknight.continent.events.storm.card_warn_bones=Viene una nube de polvo de hueso
soulknight.continent.events.storm.card_warn_isles=Viene una niebla de mar
soulknight.continent.events.storm.card_ash=Ves menos y te ven menos. El viento tapa tu ruido
soulknight.continent.events.storm.card_flesh=Ves menos y te ven menos. No queda rastro de sangre que seguir
soulknight.continent.events.storm.card_city=Ves menos y te ven menos. Ningún brillo se ve de lejos
soulknight.continent.events.storm.card_frost=Ves menos y te ven menos. Lejos del fuego, el frío te frena
soulknight.continent.events.storm.card_bones=Apenas ves, y apenas te ven
soulknight.continent.events.storm.card_isles=Ves menos y te ven menos. El ruido llega más lejos
soulknight.continent.events.storm.cold=El frío de la ventisca te cala y te frena. Un fuego, una bestia domada o la luz sagrada lo mantendrían a raya.

soulknight.continent.events.migration.name=Migración
soulknight.continent.events.migration.warn=Se levanta polvo en el horizonte, al %1$s: viene hacia aquí %2$s.
soulknight.continent.events.migration.herd_ash=una manada de bisontes de basalto
soulknight.continent.events.migration.herd_flesh=una manada de ciervillos vigía
soulknight.continent.events.migration.herd_city=una riada negra de ratas de hollín
soulknight.continent.events.migration.herd_frost=una manada de alces de cuernos de hielo
soulknight.continent.events.migration.herd_bones=una fila de colosos sin piel jóvenes
soulknight.continent.events.migration.herd_isles=una marcha de cangrejos-faro
soulknight.continent.events.migration.cross_ash=Llegan los bisontes, y se espantan con nada: si salen en estampida, no te pongas delante. Se pueden cazar... o domar.
soulknight.continent.events.migration.cross_flesh=Cruzan los ciervillos. Todos esos ojos te verán, y las bestias grandes del bosque los escuchan.
soulknight.continent.events.migration.cross_city=Las ratas pasan a chorro. Una no es nada; docenas son otra cosa.
soulknight.continent.events.migration.cross_frost=Cruzan los alces. No te acerques demasiado, salvo que quieras cazarlos.
soulknight.continent.events.migration.cross_bones=Los colosos jóvenes pasan a rastras, siempre hambrientos. No te metas debajo. Con carne cruda podrías ganarte a uno.
soulknight.continent.events.migration.cross_isles=Los cangrejos desfilan con los faroles encendidos. Apártate de su camino... y de su luz.
soulknight.continent.events.migration.gone=La manada ha pasado y el suelo se calma.
