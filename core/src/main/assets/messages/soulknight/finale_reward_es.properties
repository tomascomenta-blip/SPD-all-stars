#Botín de Thal-Vekhorr (es)

###el botín
soulknight.finale.reward.thalrewards.loot=Thal-Vekhorr deja su botín: %1$d pergaminos de mejora, %2$d pociones de fuerza, %3$d pociones de curación, comida para el viaje, el Reloj derretido, el Cofre del relojero y el Corazón de Thal-Vekhorr.
soulknight.finale.reward.thalrewards.unbound=Ya no quedan horas que te frenen: tu nivel máximo sube a %d.
ui.talentspane.unlock_tier5=Usa el Corazón de Thal-Vekhorr para elegir un camino, y sube del nivel 30 para desbloquear más talentos.

###reloj derretido
soulknight.finale.reward.meltedclock.name=reloj derretido
soulknight.finale.reward.meltedclock.ac_use=USAR
soulknight.finale.reward.meltedclock.desc=Un reloj de bolsillo que goteó del pecho de Thal-Vekhorr cuando su corazón dejó de latir a destiempo. Las agujas se escurren hacia abajo, pero siguen andando.\n\nSolo se le da cuerda _luchando_: se carga mientras tienes enemigos a la vista.\n\n_Rebobinar_ (%2$d %%): vuelves a la casilla y a la vida que tenías hace _%1$d turnos_. La vida nunca baja, y si ya no puedes llegar andando a ese sitio solo recuperas la vida.\n\n_Parar el tiempo_ (%3$d %%): durante _%4$d turnos_ solo actúas tú. Al contrario que con el reloj de arena, puedes atacar sin que se rompa.
soulknight.finale.reward.meltedclock.desc_hint=El reloj mejora con el uso: un nivel cada 3 usos. Con más nivel se carga más rápido y para el tiempo más turnos.
soulknight.finale.reward.meltedclock.desc_cursed=El reloj maldito marca una hora que no existe.
soulknight.finale.reward.meltedclock.prompt=Las agujas tiemblan. ¿Hacia dónde las mueves?
soulknight.finale.reward.meltedclock.opt_rewind=Rebobinar (%d %%)
soulknight.finale.reward.meltedclock.opt_halt=Parar el tiempo (%1$d %%, %2$d turnos)
soulknight.finale.reward.meltedclock.no_charge=Al reloj le falta cuerda.
soulknight.finale.reward.meltedclock.cursed=El reloj maldito no te obedece.
soulknight.finale.reward.meltedclock.levelup=Las agujas del reloj derretido se mueven con más soltura.
soulknight.finale.reward.meltedclock.ready=El reloj derretido tiene cuerda suficiente.
soulknight.finale.reward.meltedclock.rewound=El tiempo se rebobina a tu alrededor.
soulknight.finale.reward.meltedclock.halted=Todo se queda quieto. Menos tú.
soulknight.finale.reward.meltedclock$halt.name=Tiempo detenido
soulknight.finale.reward.meltedclock$halt.desc=El tiempo se ha detenido para todos menos para ti. Puedes moverte, atacar y usar objetos sin que nadie más actúe.\n\nTurnos que te quedan: %s.

###cofre del relojero
soulknight.finale.reward.clockmakerchest.name=cofre del relojero
soulknight.finale.reward.clockmakerchest.ac_open=ABRIR
soulknight.finale.reward.clockmakerchest.desc=Un cofrecillo de latón con una esfera de reloj por cerradura. Dentro hay tres piezas forjadas con los restos de Thal-Vekhorr, pero el cofre solo dejará que te quedes con una.
soulknight.finale.reward.clockmakerchest.got=Te quedas con: %s.
soulknight.finale.reward.wndchoosegear.message=Tres piezas de _tier 6_, por encima de todo lo que se forja en la mazmorra. Solo puedes quedarte con una.\n\nLa pieza nace con las mejoras de lo que llevas equipado en ese hueco (como mínimo _+%d_).
soulknight.finale.reward.wndchoosegear.weapon_line=+%1$d, %2$d-%3$d de daño, fuerza %4$d
soulknight.finale.reward.wndchoosegear.armor_line=+%1$d, %2$d-%3$d de defensa, fuerza %4$d
soulknight.finale.reward.wndchoosegear.are_you_sure=¿Te quedas con esta pieza? Las otras dos se perderán.
soulknight.finale.reward.wndchoosegear.yes=Sí, esta
soulknight.finale.reward.wndchoosegear.no=Mejor no
soulknight.finale.reward.wndchoosegear.cancel=Decidir más tarde

soulknight.finale.reward.minutehand.name=aguja del minutero
soulknight.finale.reward.minutehand.desc=El minutero de Thal-Vekhorr, afilado hasta convertirlo en una espada. Pesa como un mandoble pero corta mejor.
soulknight.finale.reward.minutehand.ticks=Cada _4.º golpe_ que acierta da la hora y hace _+50 %%_ de daño. Golpes hasta la próxima hora: _%d_.
soulknight.finale.reward.minutehand.hour=¡la hora!
soulknight.finale.reward.minutehand.prompt=Elige a quién rajar
soulknight.finale.reward.minutehand.ability_name=rajar
soulknight.finale.reward.minutehand.typical_ability_desc=La Duelista puede _rajar_ a un enemigo con el minutero. Esto normalmente causaría _%1$d-%2$d de daño_ y está garantizado a golpear. Si rajar mata a un enemigo dicha acción es instantánea y la Duelista puede usar rajar nuevamente en los próximos 5 turnos sin ningún coste.
soulknight.finale.reward.minutehand.ability_desc=La Duelista puede _rajar_ a un enemigo con el minutero. Esto causa _%1$d-%2$d de daño_ y está garantizado a golpear. Si rajar mata a un enemigo dicha acción es instantánea y la Duelista puede usar rajar nuevamente en los próximos 5 turnos sin ningún coste.

soulknight.finale.reward.pendulum.name=péndulo
soulknight.finale.reward.pendulum.desc=El péndulo de Thal-Vekhorr, colgado de un trozo de su cadena. Cuesta moverlo, pero cuando oscila no hay quien lo pare.
soulknight.finale.reward.pendulum.swing=Uno de cada tres golpes _ralentiza_ al enemigo %d turnos. Pide un punto más de fuerza que las otras piezas de tier 6.
soulknight.finale.reward.pendulum.prompt=Elige a quién golpear
soulknight.finale.reward.pendulum.ability_name=golpe fuerte
soulknight.finale.reward.pendulum.typical_ability_desc=La Duelista puede realizar un _golpe fuerte_ con el péndulo. Este concentrado ataque normalmente infligiría _%1$d-%2$d de daño_ si sorprende al enemigo y lo marea por 5 turnos, lo que reduce la evasión en 50%%. Golpe fuerte siempre acierta pero causa daño regular si no sorprende al enemigo.
soulknight.finale.reward.pendulum.ability_desc=La Duelista puede realizar un _golpe fuerte_ con el péndulo. Este concentrado ataque inflige _%1$d-%2$d de daño_ si sorprende al enemigo y lo marea por 5 turnos, lo que reduce la evasión en 50%%. Golpe fuerte siempre acierta pero causa daño regular si no sorprende al enemigo.

soulknight.finale.reward.gearplate.name=coraza de engranajes
soulknight.finale.reward.gearplate.desc=Placas y ruedas dentadas arrancadas del pecho de Thal-Vekhorr. Todavía giran, y con ellas el tiempo de quien la lleva va un poco a destiempo.
soulknight.finale.reward.gearplate.phase_desc=El _%d %%_ de los golpes que te alcanzan llegan un instante tarde y te atraviesan sin hacerte nada.
soulknight.finale.reward.gearplate.phase=¡desfase!

###corazón y caminos
soulknight.finale.reward.thalheart.name=corazón de Thal-Vekhorr
soulknight.finale.reward.thalheart.ac_listen=ESCUCHAR
soulknight.finale.reward.thalheart.desc=El corazón de engranajes del coloso. Sigue latiendo, siempre un poco a destiempo.\n\nSi lo escuchas te enseñará uno de los tres caminos que siguen más allá del fin de las horas. El camino que elijas abre una _quinta fila de talentos_, de los niveles 31 a 40.
soulknight.finale.reward.thalheart.already=Ya has elegido tu camino. Este corazón es para otro.
soulknight.finale.reward.thalheart.used=Has elegido el camino: %s.
soulknight.finale.reward.wndchoosespecialization.message=Más allá del fin de las horas esperan los yogs, la oscuridad y el hambre. ¿Cómo piensas sobrevivir?
soulknight.finale.reward.wndchoosespecialization.are_you_sure=¿Seguro que quieres seguir este camino? No podrás cambiarlo.
soulknight.finale.reward.wndchoosespecialization.yes=Sí, lo seguiré
soulknight.finale.reward.wndchoosespecialization.no=Mejor no
soulknight.finale.reward.wndchoosespecialization.cancel=Decidir más tarde
soulknight.finale.reward.wndchoosespecialization.talents=Talentos (niveles 31-40)

soulknight.finale.reward.specialization.yog_hunter=cazador de yogs
soulknight.finale.reward.specialization.yog_hunter_short_desc=El _Cazador de yogs_ persigue a los demonios y a la prole de Yog: les hace más daño y los nota a través de las paredes.
soulknight.finale.reward.specialization.yog_hunter_desc=Tus presas son las _criaturas demoníacas_: los demonios de las profundidades, Yog-Dzewa y su prole, y los yogs que esperan al otro lado.\n\nHaces _+20 %_ de daño a las presas y las _notas a 6 casillas_, aunque haya paredes en medio.\n\nSus talentos aumentan el daño y el rastro, te protegen de las presas y te curan al cazarlas.
soulknight.finale.reward.specialization.lightbearer=portador de luz
soulknight.finale.reward.specialization.lightbearer_short_desc=El _Portador de luz_ lleva su propia luz y una esencia sagrada que le protege de los males de la oscuridad.
soulknight.finale.reward.specialization.lightbearer_desc=_Siempre ves al menos a 6 casillas_, aunque el piso esté a oscuras. En cooperativo, todo el grupo ve lo que tú iluminas.\n\nLlevas _2 cargas de esencia sagrada_ y recuperas una cada 40 turnos. Cuando te iba a caer un _mal de la oscuridad_ (ceguera, debilidad, vulnerabilidad, maleficio, degradación, terror, hechizo, vértigo, aturdimiento o condena), gastas una carga y no te afecta.\n\nSus talentos amplían la luz, llevan más esencia, la recuperan antes y curan al usarla.
soulknight.finale.reward.specialization.time_wanderer=errante del tiempo
soulknight.finale.reward.specialization.time_wanderer_short_desc=El _Errante del tiempo_ pasa menos hambre y, cuando está a punto de caer, frena el tiempo a su alrededor.
soulknight.finale.reward.specialization.time_wanderer_desc=El _hambre_ te avanza un _30 %_ más despacio.\n\nCuando un golpe te deja _por debajo del 30 %_ de tu vida, el tiempo se frena: los enemigos que ves quedan _ralentizados 3 turnos_. Vuelve a estar listo a los 60 turnos.\n\nSus talentos te quitan aún más hambre, alargan el frenazo, cargan antes el Reloj derretido y te hacen andar más rápido.

soulknight.finale.reward.specpowers.warded=¡esencia!
soulknight.finale.reward.specpowers.slip=¡el tiempo se frena!
soulknight.finale.reward.specpowers.slip_log=El tiempo se frena a tu alrededor: %d enemigos quedan ralentizados.
soulknight.finale.reward.specpowers$holyessence.name=Esencia sagrada
soulknight.finale.reward.specpowers$holyessence.desc=Llevas _%1$d de %2$d_ cargas de esencia sagrada.\n\nCada carga te protege de un mal de la oscuridad: ceguera, debilidad, vulnerabilidad, maleficio, degradación, terror, hechizo, vértigo, aturdimiento o condena.\n\nRecuperas una carga cada %3$d turnos.
soulknight.finale.reward.specpowers$slipcooldown.name=Tiempo agotado
soulknight.finale.reward.specpowers$slipcooldown.desc=El tiempo no puede volver a frenarse por ti todavía.\n\nTurnos que faltan: %s.

###talentos de la quinta fila
actors.hero.talent.yh_bane.title=perdición
actors.hero.talent.yh_bane.desc=_+1:_ Haces un _10 %_ más de daño a las presas.\n\n_+2:_ Un _20 %_ más.\n\n_+3:_ Un _30 %_ más.
actors.hero.talent.yh_scent.title=olfato
actors.hero.talent.yh_scent.desc=_+1:_ Notas a las presas a _8 casillas_.\n\n_+2:_ A _10 casillas_.\n\n_+3:_ A _12 casillas_.
actors.hero.talent.yh_hide.title=piel de cazador
actors.hero.talent.yh_hide.desc=_+1:_ Las presas te hacen un _10 %_ menos de daño.\n\n_+2:_ Un _20 %_ menos.\n\n_+3:_ Un _30 %_ menos.
actors.hero.talent.yh_trophy.title=trofeo
actors.hero.talent.yh_trophy.desc=_+1:_ Matar una presa te cura un _4 %_ de tu vida máxima.\n\n_+2:_ Un _8 %_.\n\n_+3:_ Un _12 %_.
actors.hero.talent.lb_beacon.title=faro
actors.hero.talent.lb_beacon.desc=_+1:_ Ves _1 casilla_ más lejos.\n\n_+2:_ _2 casillas_ más.\n\n_+3:_ _3 casillas_ más.
actors.hero.talent.lb_vessel.title=vasija sagrada
actors.hero.talent.lb_vessel.desc=_+1:_ Puedes llevar _1 carga_ más de esencia sagrada.\n\n_+2:_ _2 cargas_ más.\n\n_+3:_ _3 cargas_ más.
actors.hero.talent.lb_dawn.title=alba
actors.hero.talent.lb_dawn.desc=_+1:_ Recuperas una carga de esencia cada _32 turnos_.\n\n_+2:_ Cada _26 turnos_.\n\n_+3:_ Cada _20 turnos_.
actors.hero.talent.lb_radiance.title=resplandor
actors.hero.talent.lb_radiance.desc=_+1:_ Al gastar esencia te curas un _5 %_ de tu vida máxima.\n\n_+2:_ Un _10 %_.\n\n_+3:_ Un _15 %_.
actors.hero.talent.tw_stomach.title=estómago dormido
actors.hero.talent.tw_stomach.desc=_+1:_ El hambre te avanza un _40 %_ más despacio.\n\n_+2:_ Un _50 %_.\n\n_+3:_ Un _60 %_.
actors.hero.talent.tw_long_pause.title=pausa larga
actors.hero.talent.tw_long_pause.desc=_+1:_ El tiempo se frena _4 turnos_ y vuelve a estar listo a los _50 turnos_.\n\n_+2:_ _5 turnos_, listo a los _40_.\n\n_+3:_ _6 turnos_, listo a los _30_.
actors.hero.talent.tw_clockwork.title=cuerda
actors.hero.talent.tw_clockwork.desc=_+1:_ El Reloj derretido se carga un _20 %_ más rápido.\n\n_+2:_ Un _40 %_.\n\n_+3:_ Un _60 %_.
actors.hero.talent.tw_quickstep.title=paso ligero
actors.hero.talent.tw_quickstep.desc=_+1:_ Andas un _10 %_ más rápido.\n\n_+2:_ Un _20 %_.\n\n_+3:_ Un _30 %_.
