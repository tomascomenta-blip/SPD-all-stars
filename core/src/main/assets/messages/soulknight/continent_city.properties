soulknight.continent.city.fauna.cityfauna.name=city
soulknight.continent.city.fauna.lastking.name=the Last King
soulknight.continent.city.fauna.lastking.epithet=guardian of the devoured city
soulknight.continent.city.fauna.lastking.desc=A giant king who never rose from his throne: the basalt, his crown and a piece of his city grew into him, and he drags it all along on four legs of flesh. He _raises his sceptre_ and brings it down: the blow and _a ring of flying stones_ round it are marked three turns ahead. When he _calls his city_, every window lights up, the stones of the houses fall on whoever is near (marked) and the things of the city come to him.
soulknight.continent.city.fauna.lastking.calls=The Last King calls his city. Every window lights up!
soulknight.continent.city.fauna.furnacecathedral.name=furnace cathedral
soulknight.continent.city.fauna.furnacecathedral.epithet=the church that walks
soulknight.continent.city.fauna.furnacecathedral.desc=A whole cathedral walking on six legs of yog flesh, with a furnace burning where the nave used to be. Its front always looks down the street: when _the bells ring_ it is about to _vomit fire through the portal_, in a marked cone. Behind it, _the chimneys rain embers_ on whoever is near (marked too). Now and then its _doors open_ and the things of the city pour out. Whoever stands at its doors is hitting the furnace.
soulknight.continent.city.fauna.furnacecathedral.doors=The doors of the cathedral creak open...
soulknight.continent.city.fauna.chainedone.name=the chained one
soulknight.continent.city.fauna.chainedone.epithet=the prisoner nobody freed
soulknight.continent.city.fauna.chainedone.desc=A huge wasted prisoner with his mouth sewn shut, bound by _chains of living yog flesh_ to three stakes behind him: _he can't stray far from them_. He _whips his chains in an arc_ in front of him, or _throws one_ at whoever keeps away and drags them in. Both are marked. Hurt him enough and he _snaps a chain_, and his reach grows.
soulknight.continent.city.fauna.chainedone.snaps=A chain snaps! The chained one can reach further now.
soulknight.continent.city.fauna.smeltermother.name=smelter mother
soulknight.continent.city.fauna.smeltermother.epithet=the queen of the foundries
soulknight.continent.city.fauna.smeltermother.desc=A riveted brass queen with a huge belly of _glowing molten metal_ and a crucible for a mouth. She opens the crucible and _spits a jet of molten metal_ in a marked arc ahead of her. Every few turns she _lays an egg of molten metal_ behind her: it cools, cracks, and _what grew in it comes out_. Break the eggs first.
soulknight.continent.city.fauna.smeltermother.lays=The smelter mother lays an egg of molten metal.
soulknight.continent.city.fauna.smeltermother$moltenegg.name=molten egg
soulknight.continent.city.fauna.smeltermother$moltenegg.desc=An egg of molten metal, still red hot. Something moves inside. When it _cracks_ it splashes the cells around it (marked a turn before) and _two soot rats_ come out. Broken first, nothing hatches.
soulknight.continent.city.fauna.bronzeguard.name=bronze guard
soulknight.continent.city.fauna.bronzeguard.desc=A giant empty suit of armour still keeping a gate nobody uses. It _sweeps its halberd_ in front of it, and now and then _lifts its visor_: inside there's a single yog eye whose _gaze burns a straight line_. Both are marked. Once its armour is _broken enough_, it kneels to whoever puts the collar on.
soulknight.continent.city.fauna.bronzeguard.whole=Its armour is still whole: break it first (a third of it or less).
soulknight.continent.city.fauna.livingcarriage.name=living carriage
soulknight.continent.city.fauna.livingcarriage.desc=A coach of flesh with the horses grown into the shafts. It rolls up and down the streets and, when it sees someone, lines up and _runs them over_ down a _marked lane_.
soulknight.continent.city.fauna.bloatedbeggar.name=bloated beggar
soulknight.continent.city.fauna.bloatedbeggar.desc=A beggar swollen to the size of a house with the gas of everything he ate. Slow, he slaps whoever is near. When he's badly hurt, or has people around him, he _swells up_ (marked for three turns) and _bursts_, poisoning everything around. Bursting kills him.
soulknight.continent.city.fauna.bloatedbeggar.swells=The beggar is swelling up!
soulknight.continent.city.fauna.furnacemole.name=furnace mole
soulknight.continent.city.fauna.furnacemole.desc=It digs under the streets with a stove burning in its back, and _comes up through the drains right under whoever walks above_: the cobbles rise first (marked), then it bursts out. Up on the street it throws cobbles at you, and when left alone for a while it digs back down.
soulknight.continent.city.fauna.furnacemole.rumble=The cobbles under your feet start to rise!
soulknight.continent.city.fauna.bellringer.name=bell ringer
soulknight.continent.city.fauna.bellringer.desc=A hunched thing whose head is a bronze bell. As soon as it sees someone _it tolls_, and every big thing of the city that hears it comes; it keeps tolling while the fight goes on. Right next to it, the toll is _deafening_ (marked).
soulknight.continent.city.fauna.bellringer.tolls=A bell tolls through the streets!
soulknight.continent.city.fauna.brassraptor.name=brass raptor
soulknight.continent.city.fauna.brassraptor.desc=A runner of brass plates and yog flesh that hunts in packs of two or three. When one finds someone _the pack comes_, and they _leap on the prey_ from a few cells away: the landing is marked.
soulknight.continent.city.fauna.lamplighter.name=lamplighter
soulknight.continent.city.fauna.lamplighter.desc=An empty skin walking about with a lit lantern. It keeps its distance and, when it finds someone, _lifts the lantern over them_: whoever it lights up is _seen from far away_ by every big thing of the city, and the ones close by come.
soulknight.continent.city.fauna.lamplighter.lit=The lamplighter holds its lantern over you. Everything can see you now!
soulknight.continent.city.fauna.fleshgargoyle.name=flesh gargoyle
soulknight.continent.city.fauna.fleshgargoyle.desc=It sits up on the ledges as still as the stone ones and _drops on whoever walks under it_. The leap isn't marked, but it never takes anyone down in one go.
soulknight.continent.city.fauna.fleshgargoyle.drops=from above!
soulknight.continent.city.fauna.sootrats.name=soot rats
soulknight.continent.city.fauna.sootrats.desc=Never just one: a black tide of them pours out of the chimneys and the sewers. Each of them is nothing, but _with three or more on someone_ every bite can open a wound, and _they smell blood_.
soulknight.continent.city.fauna.chaindog.name=chain dog
soulknight.continent.city.fauna.chaindog.desc=Still chained to the post its masters left it on: _it can't go further than the chain_ and it barks at everything. If it _pulls three times_ trying to get at someone, the chain gives way.
soulknight.continent.city.fauna.chaindog.loose=loose!
soulknight.continent.city.fauna.chaindog.breaks=The dog's chain gives way!
