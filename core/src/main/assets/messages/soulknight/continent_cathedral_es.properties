soulknight.continent.city.cathedral.cathedral.place=dentro del horno-catedral
soulknight.continent.city.cathedral.cathedral.arrive=Dentro del horno-catedral. Los bancos están llenos y nadie se levanta; al fondo, sobre el altar, algo late. Las puertas siguen abiertas a vuestra espalda, de momento.
soulknight.continent.city.cathedral.cathedral.open=El horno-catedral cae de lado y sus puertas quedan abiertas. Quien se plante en el umbral puede entrar.
soulknight.continent.city.cathedral.cathedral.threshold=Estás en el umbral del pórtico abierto. Tócalo otra vez para entrar, con todo el grupo.
soulknight.continent.city.cathedral.cathedral.shut=Las puertas se han vuelto a cerrar.
soulknight.continent.city.cathedral.cathedral.shut_awake=Las puertas de la catedral no se abren: con el Continente despierto, el horno no deja entrar a nadie.
soulknight.continent.city.cathedral.cathedral.hotter_1=El horno arde más fuerte. El suelo de la nave empieza a brillar.
soulknight.continent.city.cathedral.cathedral.hotter_2=El horno ruge. Las brasas se extienden por el suelo y los fieles se remueven en los bancos.
soulknight.continent.city.cathedral.cathedral.hotter_3=El aire tiembla de calor. Las vidrieras se derriten en sus marcos.
soulknight.continent.city.cathedral.cathedral.hotter_4=El calor es insoportable. Todo lo que no es piedra está ardiendo.
soulknight.continent.city.cathedral.cathedral.hotter_5=La catedral entera es ya un horno. ¡Salid o romped el corazón!
soulknight.continent.city.cathedral.cathedral.risen=¡La catedral se levanta ahí fuera! Las paredes tiemblan y la bóveda empieza a caerse.
soulknight.continent.city.cathedral.cathedral.dies=El horno-catedral se desmorona, y todo lo que guardaba dentro se derrama por sus puertas.
soulknight.continent.city.cathedral.cathedral.gauge_rise=se levanta en %d
soulknight.continent.city.cathedral.cathedral.gauge_up=¡EN PIE!

soulknight.continent.city.cathedral.cathedrallevel.molten_name=metal fundido
soulknight.continent.city.cathedral.cathedrallevel.molten_desc=Metal fundido del horno, que corre por los canales del suelo. Pisarlo quema hasta el hueso.
soulknight.continent.city.cathedral.cathedrallevel.embers_name=brasas vivas
soulknight.continent.city.cathedral.cathedrallevel.embers_desc=El suelo ha prendido. Pisarlo quema, y cuanto más caliente está el horno, más.
soulknight.continent.city.cathedral.cathedrallevel.pew_name=banco
soulknight.continent.city.cathedral.cathedrallevel.pew_desc=Un banco largo de madera ennegrecida. En la veta se han fundido trozos de quienes se sentaban en él.
soulknight.continent.city.cathedral.cathedrallevel.broken_pew_name=banco roto
soulknight.continent.city.cathedral.cathedrallevel.broken_pew_desc=Astillas y tablones quemados. Algo se arrancó de aquí.
soulknight.continent.city.cathedral.cathedrallevel.saint_name=santo derretido
soulknight.continent.city.cathedral.cathedrallevel.saint_desc=La estatua de un santo, vencida como una vela que se dejó demasiado cerca del fuego.
soulknight.continent.city.cathedral.cathedrallevel.window_name=vidriera
soulknight.continent.city.cathedral.cathedrallevel.window_desc=Una vidriera iluminada por detrás, por el horno en vez de por el sol.
soulknight.continent.city.cathedral.cathedrallevel.portal_name=el pórtico
soulknight.continent.city.cathedral.cathedrallevel.portal_desc=Las puertas por las que entrasteis, todavía abiertas a la calle. Saliendo por aquí volvéis al lado de la catedral.
soulknight.continent.city.cathedral.cathedrallevel.runner_name=alfombra roja
soulknight.continent.city.cathedral.cathedrallevel.runner_desc=Lo que queda de una alfombra roja, pegada a las losas por el calor. Lleva derecha al altar.
soulknight.continent.city.cathedral.cathedrallevel.grate_name=rejilla del horno
soulknight.continent.city.cathedral.cathedrallevel.grate_desc=Una reja de hierro sobre el fuego que hay bajo el suelo. Por ella sube humo, y a veces algo trepa hacia fuera.
soulknight.continent.city.cathedral.cathedrallevel.sarcophagus_name=sarcófago
soulknight.continent.city.cathedral.cathedrallevel.sarcophagus_desc=Un ataúd de piedra con alguien tallado en la tapa. El calor ha agrietado el sello.
soulknight.continent.city.cathedral.cathedrallevel.altar_name=altar lateral
soulknight.continent.city.cathedral.cathedrallevel.altar_desc=Un altar pequeño; el mantel se quemó hace tiempo. Las velas se han corrido por toda la piedra.
soulknight.continent.city.cathedral.cathedrallevel.bones_name=huesos
soulknight.continent.city.cathedral.cathedrallevel.bones_desc=Huesos viejos, apilados con cuidado hace mucho y desperdigados sin ninguno desde entonces.
soulknight.continent.city.cathedral.cathedrallevel.steps_name=escalones de la cripta
soulknight.continent.city.cathedral.cathedrallevel.steps_desc=Escalones gastados que bajan a la cripta. Allí abajo hace menos calor, un poco.
soulknight.continent.city.cathedral.cathedrallevel.rubble_name=cascotes
soulknight.continent.city.cathedral.cathedrallevel.rubble_desc=Trozos de la bóveda, caídos la última vez que la catedral se movió.

soulknight.continent.city.cathedral.furnaceheart.name=corazón-horno
soulknight.continent.city.cathedral.furnaceheart.desc=Un amasijo de hierro y carne yog sobre el altar mayor, enjaulado en sus propias costillas, latiendo. Con cada latido arde la catedral entera. No se mueve nunca: _late un anillo de fuego_ a su alrededor y _escupe chorros de llamas_ nave abajo a quien se mantiene lejos (las dos cosas, marcadas). Cuando su fuego baja, sus rejillas sueltan _atizadores_ que se arrojan dentro para alimentarlo: páralos. A mitad de pelea _se le agrieta la jaula_ y el estrado prende. Rómpelo y la catedral muere.
soulknight.continent.city.cathedral.furnaceheart.untamable=Eso no es una bestia a la que poner un collar.
soulknight.continent.city.cathedral.furnaceheart.wakes=Sobre el altar, el corazón-horno late más deprisa. ¡Toda la catedral le responde!
soulknight.continent.city.cathedral.furnaceheart.cracks=Se agrieta la jaula del corazón: ¡el estrado empieza a arder!
soulknight.continent.city.cathedral.furnaceheart.fed=Un atizador se arroja dentro del corazón. ¡El fuego se aviva!
soulknight.continent.city.cathedral.furnaceheart.bellows=Las rejillas se abren y salen atizadores trepando del fuego.
soulknight.continent.city.cathedral.furnaceheart.broken=¡El corazón-horno revienta! La catedral se estremece de punta a punta y os escupe fuera...

soulknight.continent.city.cathedral.meltedfaithful.name=fiel fundido
soulknight.continent.city.cathedral.meltedfaithful.desc=Alguien que estaba en misa cuando se encendió el horno. Se fundió con la madera de su banco y la madera con él. Lento, te persigue arrastrando los pies y goteando cera hirviendo; cuando te alcanza _abre los brazos_ (tu casilla se marca): quien sigue ahí se queda _pegado a él_ un turno, ardiendo.
soulknight.continent.city.cathedral.meltedfaithful.desc_seated=Alguien fundido con el banco, todavía sentado, goteando. Parece que reza. No pases demasiado cerca.
soulknight.continent.city.cathedral.meltedfaithful.stuck=¡La cera hirviendo te deja pegado al fiel!

soulknight.continent.city.cathedral.deafbell.name=campana sorda
soulknight.continent.city.cathedral.deafbell.desc=Una campana de bronce que creció alrededor de una lengua de carne yog, colgada de la bóveda. No se mueve ni muerde. Cuando te ve se balancea y _tañe_: el tañido se marca desde dos casillas hasta seis, y a quien alcanza lo deja _aturdido_, acertando y esquivando la mitad. Los fieles también lo oyen. Justo debajo de la campana es el único sitio donde no se oye.
soulknight.continent.city.cathedral.deafbell.deaf=El tañido te atraviesa la cabeza. Apenas te oyes pensar.

soulknight.continent.city.cathedral.stoker.name=atizador
soulknight.continent.city.cathedral.stoker.desc=Una cosita negra de hollín con una pala llena de carbones encendidos, salida de las rejillas. _Lanza sus carbones_ a quien tiene cerca (la casilla se marca), pero lo que quiere es el corazón: en cuanto el corazón despierta corre hacia él y _se arroja dentro_, avivando el fuego. Páralo por el camino.
