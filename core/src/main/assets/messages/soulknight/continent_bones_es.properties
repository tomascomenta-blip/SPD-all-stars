soulknight.continent.bones.fauna.bonesfauna.name=cementerio

soulknight.continent.bones.fauna.charredphoenix.name=fénix carbonizado
soulknight.continent.bones.fauna.charredphoenix.desc=Un pájaro de carbón con grietas de brasa por venas. Su picotazo puede prenderte fuego. La primera vez que muere se deshace en ceniza y _se levanta de ella al momento_, entero; la segunda se queda en el suelo.
soulknight.continent.bones.fauna.charredphoenix.reborn=El fénix se deshace en ceniza... y renace de ella, ardiendo.

soulknight.continent.bones.fauna.marrowworm.name=gusano de médula
soulknight.continent.bones.fauna.marrowworm.desc=Un gusano de anillos rojos de médula con una boca redonda llena de dientes. Viven en los huesos viejos _de tres en tres o de cuatro en cuatro_, medio asomados de uno roto mientras no pasa nada. El mordisco sangra.

soulknight.continent.bones.fauna.ossuaryhyena.name=hiena osaria
soulknight.continent.bones.fauna.ossuaryhyena.desc=Sarnosa, de lomo caído, con una careta de hueso en el morro y un ojo amarillo de niebla. Van _en grupo_ y _se ríen cuando te encuentran_ (las demás vienen corriendo). Siguen la sangre desde lejos.

soulknight.continent.bones.fauna.bonebeetle.name=escarabajo de hueso
soulknight.continent.bones.fauna.bonebeetle.desc=Un caparazón abombado de hueso viejo y poroso, patas de tendón oscuro y un ojo amarillo. Muy herido, _recoge las patas y se cierra_ unos turnos: entonces casi nada atraviesa el caparazón.

soulknight.continent.bones.fauna.marrowcentipede.name=ciempiés de tuétano
soulknight.continent.bones.fauna.marrowcentipede.desc=Once anillos de médula roja, cada uno con su placa de hueso, y una cabeza de hueso con pinzas. _Se alza_ (se marca) y golpea por una franja estrecha. Las pinzas abren heridas. La cabeza es su punto débil.

soulknight.continent.bones.fauna.ossuaryvulture.name=buitre osario
soulknight.continent.bones.fauna.ossuaryvulture.desc=Plumón carbonizado, alas de plumas de hueso, cuello pelado de tendón y pico ganchudo de hueso. Vuela por encima de todo y _huele la sangre desde muy lejos_: al que va muy herido pronto lo tiene encima. _Cae sobre una zona marcada_ y desgarra.

soulknight.continent.bones.fauna.ribdigger.name=excavador de costillas
soulknight.continent.bones.fauna.ribdigger.desc=Un topo enorme y ciego que vive dentro de los esqueletos y _lleva un costillar de coloso por caparazón_. Araña con zarpas de pala de hueso (se marca, delante) y _excava_: salen volando huesos viejos que caen en unas zonas marcadas alrededor de quien oyó. Pégale en el hueco bajo las costillas.

soulknight.continent.bones.fauna.skinlesscolossus.name=coloso sin piel
soulknight.continent.bones.fauna.skinlesscolossus.desc=Un coloso joven, todo músculo y sin piel, con el espinazo al aire, que se arrastra a cuatro patas con un brazo corto y uno largo. Alza el largo (se marca) y lo deja caer en la franja de delante. _Siempre tiene hambre: dale carne cruda de coloso y se deja poner el collar._
soulknight.continent.bones.fauna.skinlesscolossus.hungry=Te olisquea y se aparta. Quiere carne cruda de coloso.

soulknight.continent.bones.fauna.bonechimera.name=quimera de huesos
soulknight.continent.bones.fauna.bonechimera.desc=Esqueletos de bestias distintas unidos con tendón seco: una calavera con cuernos y una sola luz en la cuenca, otra menor sobre un cuello de vértebras y cada pata de un animal. La calavera grande _muerde una franja marcada_ delante; cuando _rugen las dos_, el aire a su alrededor tiembla (se marca) y la cabeza te da vueltas.

soulknight.continent.bones.fauna.mourner.name=el plañidero
soulknight.continent.bones.fauna.mourner.epithet=el que llora por los muertos
soulknight.continent.bones.fauna.mourner.desc=Una figura altísima y flaca envuelta en sudarios, con una máscara de hueso bajo un velo y lágrimas de niebla amarilla que le caen de las cuencas vacías. Llora por los muertos y _los levanta_: lo pequeño que muere cerca de él se vuelve a levantar al rato, una vez. Sus largos dedos de hueso arañan una zona marcada. Sus manos son sus puntos débiles.
soulknight.continent.bones.fauna.mourner.raises=El plañidero gime. Los muertos de alrededor se vuelven a levantar.

soulknight.continent.bones.fauna.laststanding.name=el Último en Pie
soulknight.continent.bones.fauna.laststanding.epithet=guardián del cementerio de colosos
soulknight.continent.bones.fauna.laststanding.desc=El esqueleto del coloso más antiguo. Yace _como un montón de huesos_ con el cráneo encima hasta que alguien se acerca, y entonces se levanta (mientras lo hace nada le hiere). _Pisotea una zona marcada_ delante, _barre todo a su alrededor_ y llama a los huesos pequeños del cementerio para que salgan del polvo. Su alma brilla dentro del costillar: trepa hasta ella o pégale en el cráneo.
soulknight.continent.bones.fauna.laststanding.rises=El montón de huesos se mueve. El cráneo se alza... y el coloso más antiguo se pone en pie otra vez.
soulknight.continent.bones.fauna.laststanding.calls=El polvo a su alrededor se agita y salen huesos pequeños de él.
