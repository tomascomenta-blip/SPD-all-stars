###el continente oscuro: el final verdadero
soulknight.continent.awake.awakening.woke=¡El Continente despierta! Todo lo que vive aquí viene a por vosotros. Volved al portal de las Llanuras de ceniza.
soulknight.continent.awake.awakening.still_awake=El Continente sigue despierto: todo lo que hay aquí os ha olido.
soulknight.continent.awake.awakening.held=El Continente te sujeta: no te deja saltar tan lejos.
soulknight.continent.awake.awakening.too_few=Con solo %1$d de las %2$d gotas de esencia el portal no se cierra. Lo cruzáis sin más, y el Continente sigue despierto al otro lado.
soulknight.continent.awake.awakening.caved=El paso se ha derrumbado: el Continente cierra el camino directo a las llanuras. Hay que volver dando la vuelta.
soulknight.continent.awake.awakening.sealing=Las gotas de esencia sagrada se os escapan de las manos...
soulknight.continent.awake.awakening.torch=Cuidado: el Continente está despierto y hacen falta %d gotas para cerrar el portal.
soulknight.continent.awake.awakening.wake_title=EL CONTINENTE DESPIERTA
soulknight.continent.awake.awakening.wake_sub=Todo lo que vive aquí os ha olido. Volved al portal antes de que os alcance.
soulknight.continent.awake.awakening.seal_1=Las gotas de esencia sagrada se os escapan de las manos y vuelan hacia el portal.
soulknight.continent.awake.awakening.seal_2=La luz cose el desgarro por los bordes, puntada a puntada.
soulknight.continent.awake.awakening.seal_3=Al otro lado, todo el Continente se lanza contra el umbral... y choca con la nada.
soulknight.continent.awake.awakening.seal_4=El portal se ha cerrado. La oscuridad se queda allí, y vosotros, aquí.
soulknight.continent.awake.awakening.map_portal=El portal está marcado: entrad en él con la esencia para cerrarlo.
soulknight.continent.awake.awakening.map_pass=Hacia el portal: el paso hacia %s.
soulknight.continent.awake.awakening.map_up=Hacia el portal: subid a la superficie.
soulknight.continent.awake.awakening$sealed.rankings_desc=Cerró el portal del Continente oscuro
soulknight.continent.awake.awakening$fallen.rankings_desc=Cayó en el Continente oscuro

soulknight.continent.awake.hunted.name=Cazados
soulknight.continent.awake.hunted.desc=El Continente oscuro ha despertado y todo lo que vive en él viene a por vosotros, también lo que antes pastaba o guardaba su terreno. Salen más criaturas, y más deprisa, y la corrupción entra antes. Nadie puede saltar lejos ni volver por atajos.\n\nVolved al portal de las Llanuras de ceniza: con las gotas de esencia (%1$d de %2$d) se cierra para siempre.
