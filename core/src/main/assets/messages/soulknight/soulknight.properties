soulknight.forest.portabletotem.name=portable totem
soulknight.forest.portabletotem.desc=A small totem carved by the high priest for his guard. It charges while you fight.\n\n_Planted_ next to you, for a few turns it shields you and the companions standing close.
soulknight.forest.portabletotem.desc_ready=It is charged: planted, it gives %1$d shield for %2$d turns to those within 2 cells.
soulknight.forest.portabletotem.desc_charging=It is charging. When ready it will give %1$d shield for %2$d turns.
