#New worlds (en)

###bullets
soulknight.skbulletfield.name=bullets
soulknight.skbulletfield.rankings_desc=Riddled with bullets
soulknight.skbulletfield.kill=You were riddled with bullets...
soulknight.skbulletfield.kill_by=The bullets of %s killed you...

###Forest
soulknight.skworlds.intro_forest=Below the first halls of the dungeon there are no sewers, but a jungle. The dark magic rising from the depths has grown trees between the stones, and in their shade live the goblins: a tribe of hunters with spears and stolen guns, who worship the stars and obey their high priest.

You can see their bullets coming. Keep moving, and don't get caught standing still.
soulknight.forest.forestlevel.water_name=Jungle pond
soulknight.forest.forestlevel.region_deco_name=Tree stump
soulknight.forest.forestlevel.region_deco_desc=What is left of a tree felled by the goblins. It burns easily.
soulknight.forest.forestlevel.statue_name=Totem
soulknight.forest.forestlevel.statue_desc=A wooden totem carved by the goblins, with painted faces that seem to follow you.
soulknight.forest.forestlevel.empty_deco_desc=Dry leaves and roots cover the ground.
soulknight.forest.forestlevel.wall_deco_desc=Vines climb up the mossy stone.
soulknight.forest.forestlevel.bookshelf_desc=A shelf of damp wood, full of scrolls the goblins can't read.

soulknight.forest.boar.name=wild boar
soulknight.forest.boar.desc=A jungle boar with long tusks and a very bad temper.\n\nWhen its prey is a few cells away in a straight line, it _lowers its head for a turn_ and then _charges_ hard along that line. Step out of the marked cells.\n\nThey often go _in pairs_: when one charges, the other one charges too from its own side if it can.
soulknight.forest.boar.charge=charge!

soulknight.forest.goblinspearman.name=goblin spearman
soulknight.forest.goblinspearman.desc=A green-skinned, pointy-eared goblin guard with a long spear.\n\nIts spear _reaches two cells away_ when the way is clear. From 3 to 5 cells away it _throws its spear_ along a line marked a turn before; then it fights with its fists until it picks it up again. If you take the spear first, it stays unarmed.

soulknight.forest.goblingunner.name=goblin gunner
soulknight.forest.goblingunner.desc=A goblin guard with a crude pistol.\n\nIt _shoots from a distance_ when it has a clear shot, like an archer. Sometimes it drops its pistol.\n\nThe first time it sees you it _raises the alarm_: the goblins and boars within 6 cells come.

soulknight.forest.goblinelite.name=elite goblin
soulknight.forest.goblinelite.desc=A veteran goblin with a helmet and red armor, carrying a short shotgun.\n\nIts pellets spread out: when it shoots from afar, it _also hits, more weakly, whoever stands next to its target_. Now and then it fires a _cone of five pellets_ you can see coming. Sometimes it drops its shotgun.\n\nIt carries a _metal plate_: what hits it from afar and from the front does half. Go around it, or hit it up close.

soulknight.forest.goblinshaman.name=goblin hexer
soulknight.forest.goblinshaman.desc=A goblin with a skull mask and a feather headdress.\n\nIt throws a _magic star that bursts_ where it lands, splashing whoever stands around its target.\n\nEvery few turns of a fight it _shields_ the goblins near it. Take it down first.

soulknight.forest.trumpetflower.name=trumpet flower
soulknight.forest.trumpetflower.desc=A trumpet-shaped carnivorous plant that never moves.\n\nWhen someone comes close it _swells for a turn_ and then _bursts into bubbles all around it_, up to two cells away. Then it _closes for two turns_ and no blow can hurt it: hit it while it swells.\n\nIf you leave it alive for long, it _sows_ another flower nearby.

soulknight.forest.goblingiant.name=goblin giant
soulknight.forest.goblingiant.desc=A huge, slow goblin wearing a ram skull mask and carrying a stone hammer. It is rarely seen.\n\nEvery few turns it _raises its hammer_ and then _slams the ground_, hurting and slowing everything within two cells.\n\nIt gets angry: _every third hit it takes_ it answers with a smaller slam, _without warning_.
soulknight.forest.goblingiant.raise=raises its hammer!


###Guns
soulknight.guns.skgun.ac_zap=SHOOT
soulknight.guns.skgun.fizzles=The gun is empty: wait for it to recharge.
soulknight.guns.skgun.no_magic=You can't use it while you are immune to magic.
soulknight.guns.skgun.bmage_desc=Guns can't be imbued into a battlemage's staff.
soulknight.guns.skgun.upgrade_stat_name_1=Damage

soulknight.guns.goblinpistol.name=goblin pistol
soulknight.guns.goblinpistol.desc=A crude pistol with a wooden grip, the kind goblin guards carry.\n\nIt works like a wand: its charges come back over time and it is fired from the quickslot. Its bullets are physical: the target's armor stops part of the damage.
soulknight.guns.goblinpistol.stats_desc=Fires a bullet that deals _%1$d-%2$d damage_ to the first creature in its way. It has many charges.

soulknight.guns.goblinshotgun.name=goblin shotgun
soulknight.guns.goblinshotgun.desc=A short double-barrelled shotgun, the weapon of the elite goblins.\n\nIt works like a wand: its charges come back over time and it is fired from the quickslot. Its pellets are physical: the target's armor stops part of the damage.
soulknight.guns.goblinshotgun.stats_desc=Fires a burst of pellets in a short cone: every enemy inside takes _%1$d-%2$d damage_.

soulknight.guns.meteorstaff.name=meteor staff
soulknight.guns.meteorstaff.desc=The staff of the goblin high priest, crowned by a star that never goes out.\n\nIt works like a wand: its charges come back over time and it is used from the quickslot. The meteors fall from the sky, so they pass over creatures, but not through walls.
soulknight.guns.meteorstaff.stats_desc=Calls down _three meteors_ on the chosen spot and near it. Each one explodes and deals _%1$d-%2$d damage_ to the enemies within one cell.

###cooperativo: AFK y recompensas para todos
coop.coophud.afk=AFK
coop.coophud.afk_on=is away (AFK): their hero will rest nonstop.
coop.coophud.afk_off=is back.
items.tengusmask.already=You already chose your subclass: this mask is for another teammate.
items.kingscrown.already=You already have an armor ability: this crown is for another teammate.

###world intros
soulknight.skworlds.intro_kingdom=The prison cells are gone: a castle of violet stone stands in their place. It is guarded by the knights of the kingdom, their tame slimes and the court wizards, serving a grand knight who lost his light long ago.\n\nThe knights shoot in bursts and charge in straight lines. Watch the marked cells.
soulknight.skworlds.intro_starship=Among the caves lies the hull of a ship that fell from the sky centuries ago. The Varkolyns have made it their nest: metal corridors, cold lights and tentacles sprouting from the floor.\n\nTheir lasers go through everything in their line. Step aside.
soulknight.skworlds.intro_undersea=The dwarven city sank long ago, and the abyss claimed it. Now it is an undersea base where an infected crew watches over experiments floating in bubbles, under the orders of a submarine that should not be alive.\n\nTheir bullets bounce off the walls. No corner is truly safe.

###Knight Kingdom
soulknight.kingdom.kingdomlevel.water_name=Castle moat
soulknight.kingdom.kingdomlevel.region_deco_name=Weapon barrel
soulknight.kingdom.kingdomlevel.region_deco_desc=A barrel full of old spears and shields.
soulknight.kingdom.kingdomlevel.statue_name=Suit of armor
soulknight.kingdom.kingdomlevel.statue_desc=An empty knight's armor, standing as if still on guard.
soulknight.kingdom.kingdomlevel.empty_deco_desc=A worn red carpet covers the flagstones.
soulknight.kingdom.kingdomlevel.wall_deco_desc=A banner of the kingdom hangs on the wall.
soulknight.kingdom.kingdomlevel.bookshelf_desc=Chronicles of old battles on a dusty shelf.
soulknight.kingdom.kingdommobs$soldier.name=kingdom soldier
soulknight.kingdom.kingdommobs$soldier.desc=A lightly armored soldier with a pistol.\n\nIt _shoots from a distance_ when it has a clear shot. When it loses half its health it _calls for help_ with a whistle: another soldier comes.
soulknight.kingdom.kingdommobs$swordsman.name=knight swordsman
soulknight.kingdom.kingdommobs$swordsman.desc=A knight with a sword and full armor.\n\nIt takes a lot of punishment and hits hard up close. Now and then it _raises its shield_: the next blow you deal from next to it is _parried_ and answered with a counterattack. Wait until it lowers it, or hit it from afar.
soulknight.kingdom.kingdommobs$gunner.name=royal musketeer
soulknight.kingdom.kingdommobs$gunner.desc=A shooter with a long gun.\n\nNow and then it stands still and lets loose a _long burst_: three volleys of bullets over three turns, each one aimed where you are at that moment. It doesn't move while it fires.
soulknight.kingdom.kingdommobs$rifleman.name=elite marksman
soulknight.kingdom.kingdommobs$rifleman.desc=An elite knight with a rifle.\n\nIt follows you with a _laser sight_ for two turns (the marked cells move with you), then fires a shot that _goes through everyone_ on the last line marked. If it loses sight of you, the shot is spoiled.
soulknight.kingdom.kingdommobs$royalslime.name=royal slime
soulknight.kingdom.kingdommobs$royalslime.desc=A blue slime with a little crown, the pet of the court.\n\nWhen it dies it _bursts into a ring of bubbles_ that fly in every direction, and _splits into two small slimes_.
soulknight.kingdom.kingdommobs$wizard.name=court wizard
soulknight.kingdom.kingdommobs$wizard.desc=A wizard in a blue robe.\n\nIt alternates _rings of orbs_ with _four bullets that slowly chase you_. If you corner it, it _teleports_ a few cells away and leaves an _illusion_ of itself where it stood.
soulknight.kingdom.kingdommobs$darkknight.name=dark knight
soulknight.kingdom.kingdommobs$darkknight.desc=A knight in black armor riding a black horse with a purple mane, very tough. It is rarely seen.\n\nIt lowers its lance for a turn and then _charges in a straight line_. When it loses half its health it _falls from its horse_: the horse goes on charging alone and the knight fights on foot.
soulknight.kingdom.darkgrandknight.name=dark grand knight
soulknight.kingdom.darkgrandknight.desc=The champion who swore to guard the throne of the kingdom. When the king fell, the shadow filled his armor, and since then he lets no one come near.\n\nHis _shield_ stops a good part of the blows that come _from in front_ of him (where he last moved or struck): hit his back after a thrust, a charge or a leap, or while he is _stunned_. If he charges or lunges into a _column_ or a _barrel of powder_, he is stunned. Cutting the rope of a _chandelier_ while he is under it crushes him.
soulknight.kingdom.darkgrandknight.notice=No one comes near this throne! I swore it... and I will keep my oath!
soulknight.kingdom.darkgrandknight.enraged=My steed...! Let the banner of the kingdom hold me up!
soulknight.kingdom.darkgrandknight.defeated=At last... I can... rest...
soulknight.kingdom.darkgrandknight.fan=The grand knight throws a fan of blades!
soulknight.kingdom.darkgrandknight.ring=A ring of bullets bursts from the grand knight!
soulknight.kingdom.darkgrandknight.trail=The grand knight's blades leave a trail!
soulknight.kingdom.darkgrandknight.orbs=Huge orbs roll through the hall!
soulknight.kingdom.darkgrandknight.charge=The grand knight spurs his horse!
soulknight.kingdom.shadowblade.name=shadow blade
soulknight.kingdom.shadowblade.desc=The dark grand knight's sword, with a purple edge.
soulknight.kingdom.shadowblade.blades=One blow out of three releases a _fan of three shadow blades_ that keep flying and hurt the enemies behind.

###Starship
soulknight.starship.starshiplevel.water_name=Coolant
soulknight.starship.starshiplevel.region_deco_name=Capsule
soulknight.starship.starshiplevel.region_deco_desc=A sealed cargo capsule.
soulknight.starship.starshiplevel.statue_name=Stasis pod
soulknight.starship.starshiplevel.statue_desc=Something sleeps inside, floating in a murky liquid.
soulknight.starship.starshiplevel.empty_deco_desc=Loose cables and dented plates.
soulknight.starship.starshiplevel.wall_deco_desc=A panel with blinking lights.
soulknight.starship.starshiplevel.bookshelf_desc=Memory banks full of alien symbols.
soulknight.starship.starshipmobs$varkolyn.name=varkolyn
soulknight.starship.starshipmobs$varkolyn.desc=A small purple alien with horns, all mouth and green eyes.\n\nIt bites viciously and, when it dies, _leaves a pool of poison_ and _an egg_: if you don't break it within 10 turns, another varkolyn comes out.
soulknight.starship.starshipmobs$alienlaser.name=laser alien
soulknight.starship.starshipmobs$alienlaser.desc=An alien with a laser gun.\n\nIt _aims for a turn_ and then fires a laser that _goes through the whole line_. Right after, it aims again where you moved and _fires a second laser_.
soulknight.starship.starshipmobs$aliensword.name=alien swordsman
soulknight.starship.starshipmobs$aliensword.desc=An alien with an energy sword.\n\nTough and very dangerous up close. It is _camouflaged_: you can't see it until it attacks or is hit, and a few turns later it vanishes again.
soulknight.starship.starshipmobs$ufo.name=saucer
soulknight.starship.starshipmobs$ufo.desc=A small, fast flying saucer.\n\nIt is hard to hit, shoots from afar and now and then fires _a fan of lasers_. It flies over water and chasms and _backs away_ if you come close.
soulknight.starship.starshipmobs$tentacle.name=tentacle
soulknight.starship.starshipmobs$tentacle.desc=A purple tentacle that bursts out of the floor of the ship.\n\nIt doesn't walk, but now and then it _sinks and comes out near you_ (the crack is marked a turn before). It throws _spikes in every direction_ and leaves poison when it dies.
soulknight.starship.starshipmobs$battery.name=alien battery
soulknight.starship.starshipmobs$battery.desc=A fixed alien turret.\n\nIt throws an _orb that bursts into many spikes_ or a _laser_ marked a turn before. When destroyed it _bursts into a ring of spikes_.

It fills the hall with _poison in a line_, makes _tentacles_ burst from the floor, throws _rings of spikes_, sweeps the hall with _lasers_ on marked cells and releases a _spinning core_ that spits spikes. Its own poison does nothing to it: _in its pool it can't be hurt_ for a few turns, and then it is _exposed_. Hatchlings come out of the pools.

At half health it _flees_: over a few turns it fades away (the closer you are, the better you see it) and while it flees it _can't be hurt and runs very fast_. It leaves _one nest for each hero_ somewhere on the floor. When they all fall, it brings you to its lair with all its brood to end the fight.
soulknight.starship.voidrifle.name=void rifle
soulknight.starship.voidrifle.desc=The varkolyn queen's rifle, made of purple metal, warm to the touch.\n\nIt works like a wand: its charges come back over time and it is fired from the quickslot. Its bullets are physical: the target's armor stops part of the damage.
soulknight.starship.voidrifle.stats_desc=Fires a _burst of 3 bullets_ at the first creature in its way; each one deals _%1$d-%2$d damage_.

###Undersea
soulknight.undersea.undersealevel.water_name=Abyssal water
soulknight.undersea.undersealevel.region_deco_name=Coral
soulknight.undersea.undersealevel.region_deco_desc=Coral that has grown over the ruins of the city.
soulknight.undersea.undersealevel.statue_name=Coral-covered statue
soulknight.undersea.undersealevel.statue_desc=A dwarven statue half swallowed by coral.
soulknight.undersea.undersealevel.empty_deco_desc=Seaweed and wet sand.
soulknight.undersea.undersealevel.wall_deco_desc=A porthole looking out into the abyss.
soulknight.undersea.undersealevel.bookshelf_desc=Books swollen with water; they can't be read anymore.
soulknight.undersea.underseamobs$infectedcrew.name=infected crewman
soulknight.undersea.underseamobs$infectedcrew.desc=A crew diver in a brass helmet: behind the porthole glows a red eye and tentacles stick out.\n\nIt shoots a _fast blade that bounces_ once and leaves a _trail of bubbles_. When it dies, _a kraken tentacle grows_ out of it and stays for a few turns.
soulknight.undersea.underseamobs$krakenminion.name=kraken minion
soulknight.undersea.underseamobs$krakenminion.desc=A being in a dark robe with an octopus head and a staff crowned by an eye.\n\nIt throws _three bubbles that bounce_ off the walls or _calls a kraken tentacle_ next to you (out of the water if there is any). When it loses half its health it _takes over the mind_ of the nearest hero for a few turns: in a cooperative run the hero fights its companions; alone, it walks towards the monsters.
soulknight.undersea.underseamobs$subject001.name=subject 001
soulknight.undersea.underseamobs$subject001.desc=An escaped experiment, a pink spiky puffer fish floating inside a bubble.\n\nInside its bubble it throws bullets around; _the first blow only pops the bubble_. Then it vanishes, _comes out behind you_ and sticks out its spikes a turn later. If you don't finish it within 4 turns, _it makes a new bubble_.
soulknight.undersea.underseamobs$subject001.pop=pop!
soulknight.undersea.underseamobs$subject002.name=subject 002
soulknight.undersea.underseamobs$subject002.desc=A huge, slow experiment, a blue-shelled jellyfish inside a bubble.\n\nWhen it loses half its health, the bubble _bursts into clusters of bullets_. Every few turns it _electrifies the water_ around it: don't fight it standing in the water.
soulknight.undersea.underseamobs$subject004.name=subject 004
soulknight.undersea.underseamobs$subject004.desc=A giant lobster with a huge claw. It is rare.\n\nIt hits very hard and _spits fans of red bullets_. Its _shell_ stops most of what comes from the front; _from behind it takes double_. In a cooperative run, let one hero distract it while another goes around.
soulknight.undersea.abyssalsubmariner.name=abyssal submarine
soulknight.undersea.abyssalsubmariner.desc=A submarine the abyss turned into something alive, with a red searchlight that stares like an eye and a mouth full of teeth.\n\nIt fires _sonar pulses_ that mark whoever they touch, _torpedoes that chase you_, _mines_ on marked cells (more around the marked heroes) and _shots with a trail_. Enraged, it also _lets its crew out_ and _rams_ in a line. While the crew it let out is alive, _it takes half the damage_.
soulknight.undersea.abyssalsubmariner.notice=*beep... beep... beep* TARGET DETECTED!
soulknight.undersea.abyssalsubmariner.enraged=*BEEEEEEP* OPEN THE HATCHES!
soulknight.undersea.abyssalsubmariner.defeated=I was only... trying... to pro-tect... you... He... is... waking up...
soulknight.undersea.abyssalsubmariner.sonar=The submarine sends a sonar pulse!
soulknight.undersea.abyssalsubmariner.torpedoes=Torpedoes away!
soulknight.undersea.abyssalsubmariner.mines=Sea mines fall!
soulknight.undersea.abyssalsubmariner.trail=The submarine fires in every direction!
soulknight.undersea.abyssalsubmariner.crew=The rear hatch opens!
soulknight.undersea.abyssalsubmariner.ram=The submarine is about to ram!
soulknight.undersea.abyssalsubmariner$sonarmark.name=marked by sonar
soulknight.undersea.abyssalsubmariner$sonarmark.desc=The submarine's sonar has marked you: its mines will fall around you.\n\nTurns left: %s.
soulknight.undersea.abysssonar.name=abyssal sonar
soulknight.undersea.abysssonar.desc=The abyssal submarine's sonar, with a green screen that still blinks.\n\nIt works like a wand: its charges come back over time and it is used from the quickslot.
soulknight.undersea.abysssonar.stats_desc=Sends a pulse to a spot: deals _%1$d-%2$d damage_ to the enemies within 2 cells and, for 3 turns, shows you where every enemy on the floor is.

###armory
soulknight.armory.armorygun.wand_like=It works like a wand: its charges come back over time and it is fired from the quickslot. Its bullets are physical: the target's armor stops part of the damage.
soulknight.armory.armorygun.stats_single=Fires a bullet at the first creature in its way: _%1$d-%2$d damage_.
soulknight.armory.armorygun.stats_burst=Fires a _burst of %3$d bullets_ at the first creature in its way; each deals _%1$d-%2$d damage_.
soulknight.armory.armorygun.stats_cone=Fires a _spread of pellets_ that hits every enemy in a cone of %4$d cells: _%1$d-%2$d damage_ to each.
soulknight.armory.armorygun.stats_pierce=Its shot _goes through every enemy_ in the line, up to %4$d cells or the first wall: _%1$d-%2$d damage_ to each.
soulknight.armory.armorygun.stats_blast=Its projectile _explodes_ on impact and deals _%1$d-%2$d damage_ to the enemies within %3$d cell(s). It doesn't hurt the heroes.
soulknight.armory.armorygun.stats_chain=Casts a bolt that _jumps_ to up to %3$d nearby enemies: _%1$d-%2$d damage_ to each.
soulknight.armory.armorygun.stats_volley=Launches _%3$d rockets_ spread among the enemies in sight within %4$d cells: _%1$d-%2$d damage_ each.
soulknight.armory.armorygun.effect_burn=It also _sets on fire_ whoever it hits.
soulknight.armory.armorygun.effect_chill=It also _chills_ and slows whoever it hits.
soulknight.armory.armorygun.effect_poison=It also _poisons_ whoever it hits.
soulknight.armory.armorygun.effect_stun=Each hit has a _1 in 3_ chance to paralyse for 1 turn.
soulknight.armory.armorygun.effect_root=It also _traps_ whoever it hits in a bubble for 2 turns (they can't move).
soulknight.armory.armorygun.effect_slow=It also _slows_ whoever it hits.
soulknight.armory.armoryguns$oldpistol.name=old pistol
soulknight.armory.armoryguns$oldpistol.desc=A grey, scratched, reliable pistol. It doesn't hit hard, but it has many charges.
soulknight.armory.armoryguns$smg.name=submachine gun
soulknight.armory.armoryguns$smg.desc=A compact black submachine gun.
soulknight.armory.armoryguns$bow.name=hunting bow
soulknight.armory.armoryguns$bow.desc=A flexible wooden bow with a quiver that never quite runs empty.
soulknight.armory.armoryguns$bubblegun.name=bubble gun
soulknight.armory.armoryguns$bubblegun.desc=A pink toy that shoots sticky bubbles.
soulknight.armory.armoryguns$stunpistol.name=stun pistol
soulknight.armory.armoryguns$stunpistol.desc=A yellow and black pistol that shoots electric darts.
soulknight.armory.armoryguns$deserteagle.name=desert eagle
soulknight.armory.armoryguns$deserteagle.desc=A huge silver pistol. Few bullets, but each one counts.
soulknight.armory.armoryguns$shotgun.name=shotgun
soulknight.armory.armoryguns$shotgun.desc=A shotgun with a wooden stock. Merciless up close.
soulknight.armory.armoryguns$crossbow.name=heavy crossbow
soulknight.armory.armoryguns$crossbow.desc=A crossbow so tense its bolts go through several enemies.
soulknight.armory.armoryguns$toxicblaster.name=toxic blaster
soulknight.armory.armoryguns$toxicblaster.desc=A green weapon with a bubbling gas tank.
soulknight.armory.armoryguns$frostgun.name=frost gun
soulknight.armory.armoryguns$frostgun.desc=A light blue pistol covered in frost.
soulknight.armory.armoryguns$assaultrifle.name=assault rifle
soulknight.armory.armoryguns$assaultrifle.desc=A rifle with a curved magazine and a wooden stock.
soulknight.armory.armoryguns$flamethrower.name=flamethrower
soulknight.armory.armoryguns$flamethrower.desc=A red tank and a nozzle that spits fire.
soulknight.armory.armoryguns$thunderstaff.name=thunder staff
soulknight.armory.armoryguns$thunderstaff.desc=A staff with a tip full of electricity.
soulknight.armory.armoryguns$grenadelauncher.name=grenade launcher
soulknight.armory.armoryguns$grenadelauncher.desc=A wide barrel with a drum of grenades.
soulknight.armory.armoryguns$fireworklauncher.name=firework launcher
soulknight.armory.armoryguns$fireworklauncher.desc=A cardboard tube full of colorful rockets.
soulknight.armory.armoryguns$sniperrifle.name=sniper rifle
soulknight.armory.armoryguns$sniperrifle.desc=A very long rifle with a scope.
soulknight.armory.armoryguns$gatling.name=gatling gun
soulknight.armory.armoryguns$gatling.desc=Six barrels spinning at full speed.
soulknight.armory.armoryguns$bazooka.name=bazooka
soulknight.armory.armoryguns$bazooka.desc=A green tube that fires a huge rocket. Only one charge, but what a charge.
soulknight.armory.armoryguns$laserrifle.name=laser rifle
soulknight.armory.armoryguns$laserrifle.desc=A white and blue rifle that fires a ray of light.
soulknight.armory.armoryguns$plasmacannon.name=plasma cannon
soulknight.armory.armoryguns$plasmacannon.desc=A heavy cannon with a humming purple core.
soulknight.armory.skmerchant.name=weapons merchant
soulknight.armory.skmerchant.desc=A merchant with goggles on his forehead and a backpack full of guns. He sells guns and, like any shopkeeper, buys what you bring him.

#champions, crates and barrels, ambushes, trap chests and statues
soulknight.skchampion.name=champion
soulknight.skchampion.desc=A champion of its world, wrapped in a purple aura. It has _twice the health_, hits harder and its special attacks bring _more bullets_ and come sooner. It leaves _gold_ and sometimes a _gun_ when it falls.
soulknight.skevents.ambush=The doors shut! Enemies are coming.
soulknight.skevents.ambush_done=The doors open. A chest has appeared.
soulknight.skevents.trap_chest=It was a trap! The walls of the room are shooting.
soulknight.props.skprops$crate.name=wooden crate
soulknight.props.skprops$crate.desc=A crate of reinforced planks. It _stops bullets_, both the monsters' and yours, so it makes good cover. It takes a few hits before breaking and sometimes holds some gold.
soulknight.props.skprops$explosivebarrel.name=explosive barrel
soulknight.props.skprops$explosivebarrel.desc=A red barrel with a fuse. A hit or a bullet makes it _explode_, hurting everything next to it, monsters included. It also burns the grass.
soulknight.props.skprops$sapbarrel.name=sap barrel
soulknight.props.skprops$sapbarrel.desc=A jungle barrel overflowing with sticky amber sap. When it breaks it _splashes_ and _roots_ whoever stands next to it for a few turns.
soulknight.props.skprops$icebarrel.name=frozen barrel
soulknight.props.skprops$icebarrel.desc=A barrel covered in frost. When it breaks it releases a cold that _freezes the monsters_ next to it and _slows heroes_.
soulknight.props.skprops$toxicbarrel.name=toxic drum
soulknight.props.skprops$toxicbarrel.desc=A drum of the ship with a hazard sign. When it breaks it releases a _cloud of toxic gas_.
soulknight.props.skprops$inkbarrel.name=ink barrel
soulknight.props.skprops$inkbarrel.desc=A barrel soaked in kraken ink. When it breaks it releases a _cloud of ink_ that nobody can see through.
soulknight.props.skstatue.name=world statue
soulknight.props.skstatue.desc=A stone statue of a knight with a pulsing gem. For some gold it _blesses a hero_ until they leave this world. Each hero can get one blessing per world.
soulknight.props.skstatue.offer=The gem of the statue glows. For _%d gold_ it will bless you until you leave this world:\n\n- _Knight:_ 20%% more maximum health.\n- _Priestess:_ when a monster falls within 5 cells, you get some health back.\n- _Wizard:_ your guns and wands recharge 30%% faster.
soulknight.props.skstatue.knight=Knight
soulknight.props.skstatue.priestess=Priestess
soulknight.props.skstatue.wizard=Wizard
soulknight.props.skstatue.leave=Not now
soulknight.props.skstatue.no_gold=Not enough gold: it takes %d.
soulknight.props.skstatue.already=The statue already blessed you in this world.
soulknight.props.skstatue.blessed_0=The statue blesses you: you feel stronger.
soulknight.props.skstatue.blessed_1=The statue blesses you: every monster that falls nearby heals you.
soulknight.props.skstatue.blessed_2=The statue blesses you: your weapons recharge faster.
soulknight.props.skstatue.blessing_0=Blessing of the knight
soulknight.props.skstatue.blessing_1=Blessing of the priestess
soulknight.props.skstatue.blessing_2=Blessing of the wizard
soulknight.props.skstatue.blessing_desc_0=The world statue blessed you: you have 20% more maximum health.\n\nIt lasts until you leave this world.
soulknight.props.skstatue.blessing_desc_1=The world statue blessed you: when a monster falls within 5 cells of you, you get some health back.\n\nIt lasts until you leave this world.
soulknight.props.skstatue.blessing_desc_2=The world statue blessed you: your guns and wands recharge 30% faster.\n\nIt lasts until you leave this world.

#Forest and Knight Kingdom
soulknight.forest.goblinspearman.aim=aims!
soulknight.forest.goblinspearman.unarmed=It has thrown its spear: it is fighting with its fists.
soulknight.forest.goblinspearman$goblinspearitem.name=goblin spear
soulknight.forest.goblinspearman$goblinspearitem.desc=The crude spear of a goblin guard, with a stone tip. It can be thrown, though it doesn't hit very hard. If you keep it, the goblin who threw it will have to fight with its fists.
soulknight.forest.goblingunner.alarm=alarm!
soulknight.forest.goblinelite.plate=plate!
soulknight.forest.goblingiant.fury=fury!
soulknight.forest.forestfeatures$campfire.name=goblin campfire
soulknight.forest.forestfeatures$campfire.desc=A log fire ringed with stones. Where there is one, there is a camp of goblins sleeping nearby.
soulknight.forest.forestfeatures$goblindrum.name=war drum
soulknight.forest.forestfeatures$goblindrum.desc=A drum of stretched hide with turquoise paint. If a goblin fighting next to it beats it, _every goblin within 8 cells comes_. Break it before it sounds.
soulknight.forest.forestfeatures$goblindrum.beat=boom, boom!
soulknight.forest.forestfeatures$goblindrum.heard=A war drum booms. The goblins are coming.
soulknight.forest.forestfeatures$goblintotem.name=goblin totem
soulknight.forest.forestfeatures$goblintotem.desc=A carved wooden post with a goblin face and a green crystal. Every few turns it _shields the goblins_ within 3 cells. Break it and the shields are gone.
soulknight.skfloor.name=brambles and spikes
soulknight.skfloor.rankings_desc=Bled out on brambles and spikes
soulknight.skfloor.kill=You died on brambles and spikes...
soulknight.kingdom.kingdommobs$soldier.whistle=help!
soulknight.kingdom.kingdommobs$swordsman.guard=on guard!
soulknight.kingdom.kingdommobs$swordsman.parry=parried!
soulknight.kingdom.kingdommobs$rifleman.aim=aiming!
soulknight.kingdom.kingdommobs$smallslime.name=small slime
soulknight.kingdom.kingdommobs$smallslime.desc=Half of a royal slime, without its crown. It releases a few bubbles when it dies. It doesn't split again.
soulknight.kingdom.kingdommobs$wizardillusion.name=wizard's illusion
soulknight.kingdom.kingdommobs$wizardillusion.desc=A slightly see-through copy of the court wizard. It casts rings of bullets that _do no harm_, and it vanishes with a single blow or after a few turns.
soulknight.kingdom.kingdommobs$darkknight.dismounted=The dark knight falls from its horse!
soulknight.kingdom.kingdommobs$darkhorse.name=dark horse
soulknight.kingdom.kingdommobs$darkhorse.desc=The dark knight's black horse, without its rider. It is fast and keeps _charging in a straight line_ after lowering its head for a turn.
soulknight.kingdom.kingdommobs$darkknightfoot.name=dark knight on foot
soulknight.kingdom.kingdommobs$darkknightfoot.desc=The dark knight, without its horse, with its sword. It is still very tough and hits very hard.
soulknight.kingdom.kingdomfeatures$bannerbearer.name=kingdom banner bearer
soulknight.kingdom.kingdomfeatures$bannerbearer.desc=A soldier carrying the red banner of the kingdom, with its patrol behind it. While the banner stands, the knights near it _take 25% less damage_. If it falls, they _flee_ for a few turns.
soulknight.kingdom.kingdomfeatures$bannerbearer.fall=The banner falls! The knights flee.
soulknight.kingdom.kingdomfeatures$rallied.name=under the banner
soulknight.kingdom.kingdomfeatures$rallied.desc=It is near the banner of the kingdom: it takes 25% less damage.
soulknight.kingdom.kingdomfeatures$weaponrack.name=castle weapon rack
soulknight.kingdom.kingdomfeatures$weaponrack.desc=A wooden rack with swords, a spear and a shield. You can _take a weapon_, but _the alarm will sound_ and guards will come.
soulknight.kingdom.kingdomfeatures$weaponrack.empty=The rack is empty now.
soulknight.kingdom.kingdomfeatures$weaponrack.alarm=The alarm rings! Guards are coming.

#Starship and Undersea
soulknight.starship.starshipfeatures.blackout=Blackout! The lights of the ship go out.
soulknight.starship.starshipfeatures$teleporter.name=alien teleporter
soulknight.starship.starshipfeatures$teleporter.desc=A purple platform with antennas and a green light. While a hero is near it _brings an alien every 5 turns_ (3 at a time at most). Break it to stop it.
soulknight.starship.starshipfeatures$varkolynnest.name=varkolyn nest
soulknight.starship.starshipfeatures$varkolynnest.desc=A throbbing mound of purple flesh full of green eggs. While a hero is near it _releases a varkolyn every 6 turns_ (4 at a time at most) until you destroy it.
soulknight.starship.starshipfeatures$varkolynegg.name=varkolyn egg
soulknight.starship.starshipfeatures$varkolynegg.desc=A see-through egg with a wriggling hatchling inside. _It hatches in a few turns_ unless someone breaks it.
soulknight.starship.starshipfeatures$laserpost.name=laser post
soulknight.starship.starshipfeatures$laserpost.desc=One of the two posts of a laser fence. The fence _is on for two turns and off for two_; it burns whoever stands in it while on. A _console_ on this floor turns them all off.
soulknight.starship.starshipfeatures$console.name=ship console
soulknight.starship.starshipfeatures$console.desc=A console with a green screen and many buttons. Use it to _turn off every laser fence_ on the floor.
soulknight.starship.starshipfeatures$console.already=The laser fences are already off.
soulknight.starship.starshipfeatures$console.off=You turn off every laser fence on the floor.
soulknight.starship.starshipfeatures$blackout.name=blackout
soulknight.starship.starshipfeatures$blackout.desc=The lights of the ship are out: you only see 2 cells away.\n\nTurns left: %s.
soulknight.undersea.underseamobs$krakenminion.control=The kraken minion takes over the mind of %s!
soulknight.undersea.underseamobs$subject001.rebubble=new bubble!
soulknight.undersea.underseamobs$subject004.shell=shell!
soulknight.undersea.underseamobs$subject004.back=from behind!
soulknight.undersea.underseafeatures$oxygen.name=oxygen
soulknight.undersea.underseafeatures$oxygen.desc=Under the sea the air slowly runs out. Stand in a _bubble column_ to get it back; it is full again when you reach a new floor. Without oxygen you lose health every turn.\n\nOxygen: %1$d of %2$d.
soulknight.undersea.underseafeatures$oxygen.low=You are running out of oxygen: find a bubble column.
soulknight.undersea.underseafeatures$oxygen.out=You are out of oxygen!
soulknight.undersea.underseafeatures$oxygen.drowned=You drowned...
soulknight.undersea.underseafeatures$oxygen.rankings_desc=Drowned at the bottom of the sea
soulknight.undersea.underseafeatures$inkcloud.desc=A cloud of kraken ink: the heroes can't see through it, but the sea creatures can.
soulknight.undersea.underseafeatures$giantclam.name=giant clam
soulknight.undersea.underseafeatures$giantclam.desc=A huge clam that opens now and then. It keeps a _pearl_ inside: use it while it is open to take it. If you are next to it when it shuts, _it bites_.
soulknight.undersea.underseafeatures$giantclam.empty=The clam is empty now.
soulknight.undersea.underseafeatures$giantclam.closed=The clam is shut. Wait until it opens.
soulknight.undersea.underseafeatures$giantclam.pearl=You take the pearl from the clam.
soulknight.undersea.underseafeatures$krakententacle.name=kraken tentacle
soulknight.undersea.underseafeatures$krakententacle.desc=A red and purple tentacle with suckers that comes out of the floor or the water. It doesn't move and _lashes_ whoever stands next to it. It sinks back after a few turns.
soulknight.undersea.underseafeatures$mindcontrol.name=mind controlled
soulknight.undersea.underseafeatures$mindcontrol.desc=A kraken minion controls your mind: your hero acts on its own.\n\nTurns left: %s.
soulknight.undersea.underseafeatures$mindcontrol.status=controlled!

#bosses
soulknight.kingdom.darkgrandknight.shadows=Shadows of the kingdom, to me!
soulknight.kingdom.darkgrandknight$shadowknight.name=knight of shadow
soulknight.kingdom.darkgrandknight$shadowknight.desc=A warrior of black and violet smoke shaped like a knight of the guard. It throws the _fan of blades_ of its lord and _can't be hurt_. Hit the true grand knight three times and the shadows fade.
soulknight.undersea.abyssalsubmariner.covered=covered!
soulknight.undersea.abyssalsubmariner.covered_by_crew=The crew protects the submarine: take it down first.

#heroes
soulknight.beastmaster.taming.button=Tame
soulknight.beastmaster.taming.info=Choose an animal (boar, varkolyn, rat, crab, bat, spider, slime, subject 001 or subject 004) within %d cells that has _less than a quarter of its health_. It becomes your _pet_: it heals up to half its health, follows you, fights at your side and goes down the stairs with you. You can only have one; the old one goes away.
soulknight.beastmaster.taming.prompt=Choose the animal you want to tame
soulknight.beastmaster.taming.no_target=There is no enemy to tame there.
soulknight.beastmaster.taming.not_animal=That is not an animal you can tame.
soulknight.beastmaster.taming.too_healthy=It is still too strong: bring it below a quarter of its health.
soulknight.beastmaster.taming.too_far=It is too far away.
soulknight.beastmaster.taming.tamed=You tamed the %s! It is your pet now.
soulknight.beastmaster.taming$tamed.name=pet
soulknight.beastmaster.taming$tamed.desc=The Beastmaster tamed it: it fights at his side and follows him.
soulknight.spiritist.souls.name=souls
soulknight.spiritist.souls.desc=Every enemy that falls near you gives you a soul.\n\nSouls: %1$d of %2$d.\n\nWith %3$d souls, the next ability you use spends them and _recharges in half the time_. With %4$d you can send a _ghost scout_ from the button of the kit.
soulknight.spiritist.souls.empower=The souls empower %s: it will recharge in half the time.
soulknight.spiritist.souls.not_enough=It takes %d souls.
soulknight.spiritist.souls.scouted=Your ghost goes through the walls and shows you what lies around.
soulknight.spiritist.souls.scout_button=Ghost scout  (%1$d/%2$d souls)
soulknight.spiritist.souls.scout_info=Spend %1$d souls: your ghost goes through the walls and reveals the map within %2$d cells around you.\n\nYou get souls when an enemy falls near you. With %3$d, the next ability you use recharges in half the time.
soulknight.guns.skgun.ac_reload=RELOAD
soulknight.guns.skgun.reloaded=You reload the %s in a hurry.

