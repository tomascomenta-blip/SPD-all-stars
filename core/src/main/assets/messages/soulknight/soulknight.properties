soulknight.starship.varkolynleader.hint_lair=Strike the console to open the airlock to space, and hold on to a handhold when it opens.
soulknight.starship.varkolynleader.molt=KRRRIIIIH!
soulknight.starship.varkolynleader.banner_molt=THE QUEEN MOLTS!
soulknight.starship.varkolynleader.hint_molt=The queen breaks her shell: she is faster, has no defense and spits acid. More brood comes.
soulknight.starship.varkolynleader.banner_airlock=AIRLOCK TO SPACE!
soulknight.starship.varkolynleader.airlock_armed=The airlock is about to open! Hold on to a handhold.
soulknight.starship.varkolynleader.airlock_open=The airlock opens and the void pulls everything!
soulknight.starship.varkolynleader.airlock_closed=The airlock closes.
soulknight.starship.varkolynleader.airlock_ready=The console of the airlock is ready again.
soulknight.starship.varkolynleader.vacuum_hurt=The cold of the void burns you!
soulknight.starship.varkolynleader.banner_won=BIOLOGICAL THREAT ELIMINATED
soulknight.starship.varkolynleader.won=The hive withers and the lights of the ship come back.
soulknight.starship.varkolynleader$lairnest.name=nest of the varkolyn queen
soulknight.starship.varkolynleader$lairnest.desc=A nest the varkolyn queen laid while fleeing. It releases varkolyns while it stands. _Break every nest_ and you will fight her again.
soulknight.starship.varkolynleader$hivedark.name=Blackout
soulknight.starship.varkolynleader$hivedark.desc=The lights of the ship went out while the queen hides: you only see what is very close.
soulknight.starship.hive.name=hive
soulknight.starship.hive.desc=Biomass of the hive: it slows whoever walks on it and heals the varkolyn queen. Fire and bombs burn it.
soulknight.starship.hiveprops$airlockconsole.name=airlock console
soulknight.starship.hiveprops$airlockconsole.desc=The console that opens the airlock of the lair to space. Strike it to arm it: a turn later the airlock opens and the void pulls everything that doesn't hold on to a _handhold_. The brood is sucked out and the queen clings to the floor, unable to move and taking double damage.
