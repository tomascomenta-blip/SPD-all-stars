soulknight.skdifficulty.level_0=Easy
soulknight.skdifficulty.level_1=Normal
soulknight.skdifficulty.level_2=Hard
soulknight.skdifficulty.level_3=Very hard
soulknight.skdifficulty.level_4=Nightmare
