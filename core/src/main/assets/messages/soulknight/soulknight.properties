soulknight.wndskoptions.never=Never
soulknight.wndskoptions.always=Always
soulknight.wndskoptions.worlds_now=Each region is its alternate world with a %d%% chance.
soulknight.wndskoptions.antiop=Anti-OP
soulknight.wndskoptions.note=Anti-OP: no hit takes more than that number from a monster (bosses too). It all applies when a new run starts; in a cooperative run, the host's choice counts.

###### the Kraken
soulknight.kraken.krakenlevel.sea_name=raging sea
soulknight.kraken.krakenlevel.sea_desc=Black waves the size of houses. Falling in there means ceasing to exist... unless someone throws you a rope.
soulknight.kraken.krakenlevel.deck_name=deck
soulknight.kraken.krakenlevel.deck_desc=Soaked planks that creak with every wave. If the ship sinks, you all sink with it.
soulknight.kraken.kraken.name=Kraken
soulknight.kraken.kraken.desc=The true lord of the abyss: a beast as old as the sea, so huge its head alone is an island. The submarine was keeping it asleep.\n\nIt can only be hurt in _the eye_, when the ship reaches the whirlpool: any hit on the open eye takes _200 health_ and pushes the ship away. Meanwhile its _tentacles_ smash the ship: kill them so the ship can sail on, and _patch the holes_ with the hammer or the ship will sink with everyone on board.
soulknight.kraken.kraken.closed=eye closed!
soulknight.kraken.kraken.guarded=guarded!
soulknight.kraken.kraken.notice=NO ONE... LEAVES... MY SEA.
soulknight.kraken.kraken.hurt_1=GRRRAAAAOOOOHHH!!
soulknight.kraken.kraken.hurt_2=MY EYE!! I WILL DRAG YOU TO THE DEPTHS!
soulknight.kraken.kraken.hurt_3=NOOOO!! THE WHOLE SEA WILL SWALLOW YOU!
soulknight.kraken.kraken.arrive_1=WHAT ARE YOU... LAND WORMS?
soulknight.kraken.kraken.arrive_2=COME... COME CLOSER...
soulknight.kraken.kraken.arrive_3=MY CHILDREN... GUARD... MY EYE.
soulknight.kraken.kraken.arrive_4=NO!! LET GO... OF MY... SHIP!!
soulknight.kraken.kraken.jet=The Kraken is about to spit a jet of water!
soulknight.kraken.kraken.ink=The Kraken spits ink over the deck!
soulknight.kraken.kraken.mast_fire=Lightning set the mast on fire! It will fall in a few turns.
soulknight.kraken.kraken.boarders=Monsters of the abyss climb over the rail!
soulknight.kraken.kraken.crushed=The Kraken crushes the ship in its arms. No one survives.
soulknight.kraken.kraken.sunk=The ship breaks in two and sinks into the whirlpool with everyone on board.
soulknight.kraken.kraken.defeated=glub... glub... ...
soulknight.kraken.kraken.hint_hammer=HINT: every hole sinks the ship little by little. Stand next to it and use the HAMMER (1 turn per hole).
soulknight.kraken.kraken.hint_helm=HINT: if someone stands behind the HELM (at the stern), the ship reaches the whirlpool sooner.
soulknight.kraken.kraken.hint_cannon=HINT: the sea washes HARPOONS onto the deck. Pick them up and walk into the CANNON at the bow to fire.
soulknight.kraken.kraken.hint_leave=It is over. Gather the loot and walk to the tip of the bowsprit to go ashore.
soulknight.kraken.kraken.hint_tentacle_1=HINT: while the tentacle lies on the deck the ship cannot move. Destroy it!
soulknight.kraken.kraken.hint_tentacle_2=HINT: this tentacle grabs a hero. The others must hurt the tentacle to make it let go.
soulknight.kraken.kraken.hint_tentacle_3=HINT: the armour stops most damage. Hit the GLOWING SUCKER (it moves).
soulknight.kraken.kraken.hint_tentacle_4=HINT: the Kraken drags the ship into the whirlpool. Kill the mother tentacle before the countdown ends.
soulknight.kraken.kraken.banner_intro=You wake up on the deck of a ship in the middle of the storm... and the whirlpool is dragging you towards IT.
soulknight.kraken.kraken.banner_tentacle_1=A GIANT TENTACLE RISES FROM THE SEA!
soulknight.kraken.kraken.banner_tentacle_2=THE HOOKED TENTACLE! Careful, it grabs whoever it reaches!
soulknight.kraken.kraken.banner_tentacle_3=THE ARMOURED TENTACLE! Hit the glowing sucker.
soulknight.kraken.kraken.banner_tentacle_4=THE MOTHER TENTACLE! The Kraken hugs the ship and drags it down!
soulknight.kraken.kraken.banner_grab=%s was grabbed! Hurt the tentacle to free them!
soulknight.kraken.kraken.banner_sail=The tentacle sinks! Full sail to the whirlpool!
soulknight.kraken.kraken.banner_spiral=The ship spirals down towards the eye! This is the final blow!
soulknight.kraken.kraken.banner_eye=THE EYE IS OPEN! HIT IT!
soulknight.kraken.kraken.banner_guards=Two tentacles guard the eye! Kill them first!
soulknight.kraken.kraken.banner_regrow=The guards of the eye grow back!
soulknight.kraken.kraken.banner_mast=THE MAST IS FALLING! Get out of the way!
soulknight.kraken.kraken.banner_countdown=%d turns before the Kraken crushes the ship!
soulknight.kraken.kraken.banner_pushed=A hit on the eye! The Kraken pushes the ship away. %d lives left.
soulknight.kraken.kraken.banner_won=THE KRAKEN HAS FALLEN! The storm breaks...
soulknight.kraken.gianttentacle.name_1=tentacle of the Kraken
soulknight.kraken.gianttentacle.name_2=hooked tentacle
soulknight.kraken.gianttentacle.name_3=armoured tentacle
soulknight.kraken.gianttentacle.name_4=mother tentacle
soulknight.kraken.gianttentacle.desc_1=An arm of the Kraken as thick as a tree trunk, lying from rail to rail. While it is here the ship cannot move.
soulknight.kraken.gianttentacle.desc_2=Long and thin, with a hooked tip. It grabs a hero and lifts them over the sea: hurt the tentacle to make it let go.
soulknight.kraken.gianttentacle.desc_3=Covered in shell plates that stop almost all damage. Only _the glowing sucker_ really takes hits, and it moves.
soulknight.kraken.gianttentacle.desc_4=The oldest arm of the Kraken, full of scars and barnacles. It smashes, grabs and is armoured. While it lives, the Kraken drags the ship to the bottom.
soulknight.kraken.gianttentacle.weak=sucker!
soulknight.kraken.gianttentacle.dies=*the tentacle writhes and sinks into the sea*
soulknight.kraken.guardtentacle.name=guard of the eye
soulknight.kraken.guardtentacle.desc=A smaller tentacle that keeps the eye of the Kraken shut while it lives. It spits bubbles at whoever comes to the bow.
soulknight.kraken.krakenhold.overboard=%s fell into the sea!
soulknight.kraken.krakenhold.freed=%s broke free of the tentacle!
soulknight.kraken.krakenhold.back=%s climbs back up the stern ladder, soaking wet.
soulknight.kraken.krakenhold.name_overboard=man overboard
soulknight.kraken.krakenhold.name_grabbed=grabbed
soulknight.kraken.krakenhold.desc_overboard=You fell into the sea. You will climb back up the stern ladder in a few turns, a little hurt.\n\nTurns left: %s.
soulknight.kraken.krakenhold.desc_grabbed=A tentacle holds you and squeezes every turn. Enough damage to it makes it let go; if not, it will drop you.\n\nTurns left: %s.
soulknight.kraken.shiphammer.name=carpenter's hammer
soulknight.kraken.shiphammer.desc=A hammer and a handful of nails. Use it next to a hole (or on it) to patch it: it takes a turn and gives the ship some health back.\n\nIt is gone when the fight ends.
soulknight.kraken.shiphammer.ac_repair=REPAIR
soulknight.kraken.shiphammer.no_ship=There is nothing to repair here.
soulknight.kraken.shiphammer.no_hole=No hole within reach: stand next to one.
soulknight.kraken.krakenharpoon.name=harpoon
soulknight.kraken.krakenharpoon.desc=A whaler's harpoon the sea washed onto the deck. Take it to the cannon at the bow and walk into the cannon to fire it.
soulknight.kraken.krakenharpoon.hint=Take the harpoon to the cannon at the bow.
soulknight.kraken.krakeneyegun.name=Eye of the Kraken
soulknight.kraken.krakeneyegun.desc=The eye of the Kraken, hardened like amber and set in coral. It still calls the lightning of the storm, jumping from enemy to enemy.
soulknight.kraken.harpooncannon.name=harpoon cannon
soulknight.kraken.harpooncannon.desc=A heavy ballista nailed to the bow. Walk into it carrying a harpoon to fire: at the open eye, at the guards of the eye or at the giant tentacle (a big wound, and it stops thrashing for a while).
soulknight.kraken.harpooncannon.empty=The cannon is empty: it needs a harpoon.
soulknight.kraken.harpooncannon.nothing=There is nothing to shoot at now.
soulknight.kraken.harpooncannon.hit_tentacle=%s drives a harpoon into the tentacle!
soulknight.kraken.grumete.name=deckhand
soulknight.kraken.grumete.desc=The ship's deckhand. Can't fight, but patches holes like nobody else (slowly).
soulknight.kraken.grumete.talk_0=I'll patch the holes, you hit the beast!
soulknight.kraken.grumete.talk_1=My grandpa said the Kraken was just a story!
soulknight.kraken.grumete.talk_2=More nails! I need more nails!
soulknight.kraken.krakencall.rumble=The water trembles. Something huge moves under your feet...
soulknight.kraken.krakencall.water=The sea floods in from everywhere! The floor gives way!
soulknight.kraken.krakencall.eye=In the dark of the abyss, an enormous eye opens.
soulknight.kraken.krakenhud.ship=Ship %1$d/%2$d   Holes: %3$d
soulknight.kraken.krakenhud.held=The tentacle holds the ship
soulknight.kraken.krakenhud.sailing=Distance to the whirlpool: %d
soulknight.kraken.krakenhud.helm=(helm: x2)
soulknight.kraken.krakenhud.arrived=Facing the Kraken!
soulknight.kraken.krakenhud.pushed=The Kraken pushes the ship away
soulknight.kraken.krakenhud.won=The storm calms down
soulknight.kraken.krakenhud.countdown=CRUSHED IN %d!
soulknight.undersea.abyssalsubmariner.potions=Every hero receives two potions of healing.

###### the Forgotten Land
soulknight.skworlds.intro_forgotten=Under the Dwarven City there is no hell, whatever the legends say, but a glacier. And under the glacier, something beats: a lost world that time forgot.
soulknight.forgotten.forgottenlevel.water_name_ice=icy water
soulknight.forgotten.forgottenlevel.water_name_thaw=meltwater
soulknight.forgotten.forgottenlevel.water_name_jungle=swamp water
soulknight.forgotten.forgottenlevel.grass_name_ice=frozen shrubs
soulknight.forgotten.forgottenlevel.grass_name_thaw=wet moss
soulknight.forgotten.forgottenlevel.grass_name_jungle=giant ferns
soulknight.forgotten.forgottenlevel.water_desc_ice=Water so cold it burns. Wading in it freezes you much faster.
soulknight.forgotten.forgottenlevel.water_desc_thaw=Water of the melting glacier, still full of ice.
soulknight.forgotten.forgottenlevel.water_desc_jungle=Green, lukewarm water. Something big could be hiding under it.
soulknight.forgotten.forgottenlevel.wall_desc_ice=Blue ice of an ancient glacier. Shadows of things that died ages ago can be made out inside.
soulknight.forgotten.forgottenlevel.wall_desc_thaw=Wet rock with dripping ice. The glacier is melting.
soulknight.forgotten.forgottenlevel.wall_desc_jungle=Rock covered in moss and vines. The air is hot and damp, as if the stone breathed.
soulknight.forgotten.forgottenlevel.empty_deco_desc_ice=Packed snow with huge footprints.
soulknight.forgotten.forgottenlevel.empty_deco_desc_thaw=Mud and patches of dirty snow.
soulknight.forgotten.forgottenlevel.empty_deco_desc_jungle=Gigantic bones half buried in the earth.
soulknight.forgotten.forgottenfloor.crack=The ice creaks under your feet...
soulknight.forgotten.forgottenfloor.break=The ice breaks under %s! The icy water takes the breath away.
soulknight.forgotten.forgottenfloor.tar=You stepped into a tar pit!
soulknight.forgotten.forgottenfloor.blizzard=A blizzard rises! You can hardly see anything in the frozen rooms.
soulknight.forgotten.forgottenfloor.blizzard_end=The blizzard dies down.
soulknight.forgotten.forgottenfloor.icicles=The icicles of the ceiling creak!
soulknight.forgotten.forgottenfloor$forgottencold.name=Frost
soulknight.forgotten.forgottenfloor$forgottencold.desc=The cold gets into your bones. Standing still or wading in a frozen room makes it worse; moving eases it and a nearby brazier takes it away.\n\nAt 12 you will be numb; at 24 you will freeze.\n\nFrost: %d.
soulknight.forgotten.forgottenfloor$forgottencold.frozen=%s is frozen solid!
soulknight.forgotten.forgottenfloor$whiteout.name=Blizzard
soulknight.forgotten.forgottenfloor$whiteout.desc=The snow does not let you see past your nose.
soulknight.forgotten.forgottenfeatures$brazier.name=brazier of the tribe
soulknight.forgotten.forgottenfeatures$brazier.desc=A stone brazier lit by the tribe. Next to it (2 cells) nobody is cold, and it revives the sacred flame.
soulknight.forgotten.forgottenfeatures$brazier.desc_out=A brazier put out by the ice. Walk into it to light it again.
soulknight.forgotten.forgottenfeatures$brazier.relit=You light the brazier again.
soulknight.forgotten.forgottenfeatures$brazier.warm=The warmth of the brazier brings you back to life.
soulknight.forgotten.forgottenfeatures$icewall.name=wall of ice
soulknight.forgotten.forgottenfeatures$icewall.desc=A block of ice in the way. Fire melts it at once; blows take much longer.
soulknight.forgotten.forgottenfeatures$frozenblock.name=frozen beast
soulknight.forgotten.forgottenfeatures$frozenblock.desc=Something huge has slept in this block of ice for millennia. Fire, blows or a fight next to it could wake it up.
soulknight.forgotten.forgottenfeatures$frozenblock.wakes=The ice bursts and the beast wakes up!
soulknight.forgotten.forgottenfeatures$frozenchest.name=frozen chest
soulknight.forgotten.forgottenfeatures$frozenchest.desc=A chest caught in the ice. Fire or blows can free it... but blows make a lot of noise.
soulknight.forgotten.forgottenfeatures$nest.name=nest
soulknight.forgotten.forgottenfeatures$nest.desc=A nest of branches with three speckled eggs. Their mother is not far.
soulknight.forgotten.forgottenfeatures$nest.desc_empty=An empty, trampled nest.
soulknight.forgotten.forgottenfeatures$nest.mother=A furious roar! The mother is coming for you!
soulknight.forgotten.forgottenfeatures$dinoegg.name=dinosaur egg
soulknight.forgotten.forgottenfeatures$dinoegg.desc=A huge, heavy egg. A good meal.
soulknight.forgotten.forgottenfeatures$amber.name=amber with a mosquito
soulknight.forgotten.forgottenfeatures$amber.desc=A piece of amber with a mosquito trapped inside for millions of years. A merchant would pay well for it.
soulknight.forgotten.forgottenmobs$mammoth.name=woolly mammoth
soulknight.forgotten.forgottenmobs$mammoth.desc=A mountain of fur and tusks. Slow, but when it _charges in a line_ it knocks down whatever it hits. Cold does not affect it.
soulknight.forgotten.forgottenmobs$sabertooth.name=sabertooth
soulknight.forgotten.forgottenmobs$sabertooth.desc=A cat with fangs like daggers. It stalks and _leaps on whoever walks alone_, leaving bleeding wounds.
soulknight.forgotten.forgottenmobs$sabertooth.crouch=The sabertooth crouches...
soulknight.forgotten.forgottenmobs$frostwolf.name=frost wolf
soulknight.forgotten.forgottenmobs$frostwolf.desc=They hunt in packs. When one _howls_, every wolf of the floor comes. Its bite chills.
soulknight.forgotten.forgottenmobs$frostwolf.howl=An icy howl echoes through the caves!
soulknight.forgotten.forgottenmobs$yeti.name=yeti
soulknight.forgotten.forgottenmobs$yeti.desc=A furry beast with very long arms. It throws _snowballs_ that slow and chill.
soulknight.forgotten.forgottenmobs$sloth.name=giant sloth
soulknight.forgotten.forgottenmobs$sloth.desc=Peaceful and calm... _until someone attacks it_. Then it crushes everything around it.
soulknight.forgotten.forgottenmobs$sloth.angry=The giant sloth gets angry!
soulknight.forgotten.forgottenmobs$woollyrhino.name=woolly rhino
soulknight.forgotten.forgottenmobs$woollyrhino.desc=Low, massive, two horns. It _charges in a straight line_ and breaks the thin ice it crosses.
soulknight.forgotten.forgottenmobs$raptor.name=velociraptor
soulknight.forgotten.forgottenmobs$raptor.desc=Fast and clever. It _leaps on the wounded_ and hunts in groups; alone and hurt, it runs.
soulknight.forgotten.forgottenmobs$triceratops.name=triceratops
soulknight.forgotten.forgottenmobs$triceratops.desc=Its frill and three horns _stop most damage from the front_: hit it from the sides. It charges and pushes.
soulknight.forgotten.forgottenmobs$triceratops.frill=frill!
soulknight.forgotten.forgottenmobs$pterodactyl.name=pterodactyl
soulknight.forgotten.forgottenmobs$pterodactyl.desc=It flies over everything. It _grabs you and drops you_ a few cells away.
soulknight.forgotten.forgottenmobs$pterodactyl.dropped=The pterodactyl lifts you and drops you!
soulknight.forgotten.forgottenmobs$dilophosaurus.name=dilophosaurus
soulknight.forgotten.forgottenmobs$dilophosaurus.desc=It spreads the frill of its neck and _spits venom that blinds_.
soulknight.forgotten.forgottenmobs$ankylosaurus.name=ankylosaurus
soulknight.forgotten.forgottenmobs$ankylosaurus.desc=A living tank: its shell stops a lot of damage and its _club tail stuns_.
soulknight.forgotten.forgottenmobs$compy.name=compsognathus
soulknight.forgotten.forgottenmobs$compy.desc=Tiny and very fast, always in groups. They _steal your food_ and run.
soulknight.forgotten.forgottenmobs$compy.stole=A compsognathus steals from you: %s!
soulknight.forgotten.forgottenmobs$spinosaurus.name=spinosaurus
soulknight.forgotten.forgottenmobs$spinosaurus.desc=A giant with a sail on its back. It _waits under the water_ and only comes out to bite whoever comes to the shore.
soulknight.forgotten.forgottenmobs$carnivoreplant.name=carnivorous plant
soulknight.forgotten.forgottenmobs$carnivoreplant.desc=A huge flower with teeth. It does not move, but it _bites and holds_ whoever walks by.
soulknight.forgotten.forgottenmobs$carnivoreplant.swallow=The plant catches you in its jaws!
soulknight.forgotten.tribe$shaman.name=shaman of the tribe
soulknight.forgotten.tribe$shaman.desc=The shaman of the tribe that lives in the Forgotten Land, with a deer skull mask and a feathered staff.
soulknight.forgotten.tribe$shaman.quest=Strangers! The cold is coming: the Heart of the Valley is fading. Take this flame of the sacred fire to the altar of the jungle, below. Do not let it go out!
soulknight.forgotten.tribe$shaman.quest_hint=QUEST: take the SACRED FLAME to the ALTAR of the jungle (floor 24). The cold and the blizzard weaken it; the BRAZIERS on the way and the warm lands revive it. If it goes out, bring the embers to a lit brazier or to the sacred fire.
soulknight.forgotten.tribe$shaman.thanks=The tribe will not forget it. When the Heart of the Valley roars, we will be at your side.
soulknight.forgotten.tribe$shaman.relight=The flame went out... Bring the embers to a lit brazier or to the sacred fire.
soulknight.forgotten.tribe$shaman.talk_0=Under our feet sleeps Tharog, the Heart of the Valley. Its warmth is all that keeps this land alive.
soulknight.forgotten.tribe$shaman.talk_1=Keep moving in the cold. Whoever stands still, stays forever.
soulknight.forgotten.tribe$shaman.talk_2=The braziers are your friends. The ice does not forgive.
soulknight.forgotten.tribe$shaman.legend_0=Hear the legend: Tharog is as old as the stone. Its heart warms the valley... and the ice holds it prisoner.
soulknight.forgotten.tribe$shaman.legend_1=While trapped, only its head and claw come out. Its breath freezes. Strike, but do not stand in front of it.
soulknight.forgotten.tribe$shaman.legend_2=When it breaks free it will charge at its prey. If it hits a PILLAR OF ICE it will be stunned and lose one of its PLATES: strike it then!
soulknight.forgotten.tribe$shaman.legend_3=When its heart cools, the ice will come back from the walls. Stay by the BRAZIERS. If its breath puts them out, light them again.
soulknight.forgotten.tribe$shaman.legend_4=And at the end... the sky will burn. The stones of fire fall where the earth glows red. Lure it there: they hurt it too.
soulknight.forgotten.tribe$sacredfire.name=sacred fire
soulknight.forgotten.tribe$sacredfire.desc=The sacred fire of the tribe, which never goes out. It lights the sacred flame.
soulknight.forgotten.tribe$sacredfire.lit=The sacred flame burns strongly again.
soulknight.forgotten.tribe$sacredfire.burns=The sacred fire burns, untouched by the cold.
soulknight.forgotten.tribe$sacredfire.ask=Talk to the shaman.
soulknight.forgotten.tribe$altar.name=altar of the tribe
soulknight.forgotten.tribe$altar.desc=A stone altar covered in ancient paintings. The tribe waits here for the sacred flame.
soulknight.forgotten.tribe$altar.desc_done=The sacred flame burns on the altar. The tribe is with you.
soulknight.forgotten.tribe$altar.done=The sacred flame burns on the altar.
soulknight.forgotten.tribe$altar.nothing=The altar waits for the sacred flame.
soulknight.forgotten.tribe$altar.out=The flame is out. A lit brazier or the sacred fire will light it again.
soulknight.forgotten.tribe$altar.complete=The sacred flame burns on the altar! The tribe will fight at your side against Tharog.
soulknight.forgotten.tribe$altar.reward=The warriors of the tribe offer you a gift. Choose one:
soulknight.forgotten.tribe$altar.got=You receive: %s.
soulknight.forgotten.tribe$hut.name=hut
soulknight.forgotten.tribe$hut.desc=A hut of furs and bones of the tribe.
soulknight.forgotten.tribe$totem.name=totem
soulknight.forgotten.tribe$totem.desc=A totem carved with the beasts of the Forgotten Land.
soulknight.forgotten.tribe$warrior.name=warrior of the tribe
soulknight.forgotten.tribe$warrior.desc=A warrior of the tribe with a flint spear and a leather shield.
soulknight.forgotten.tribe$warrior.cheer=HOO-HOO-HOO!!
soulknight.forgotten.tribe$warrior.relit=A warrior of the tribe lights a brazier again.
soulknight.forgotten.tribe$warrior.talk=The altar waits for the flame of the shaman.
soulknight.forgotten.tribe$sacredflame.name=sacred flame
soulknight.forgotten.tribe$sacredflame.desc=The eternal fire of the tribe, in a torch of bone. Take it to the altar of the jungle. The cold and the blizzard weaken it; the braziers revive it, and in the warm lands it slowly comes back.\n\nFlame: %d%%.
soulknight.forgotten.tribe$sacredflame.desc_out=Only embers are left. Bring them next to a lit brazier or to the sacred fire of the camp and they will catch again.
soulknight.forgotten.tribe$sacredflame.revived=The brazier revives the sacred flame.
soulknight.forgotten.tribe$sacredflame.weak=The sacred flame is dying! Find a brazier.
soulknight.forgotten.tribe$sacredflame.out=The sacred flame went out... The embers will catch again at a lit brazier.
soulknight.forgotten.tribe$sacredflame.relit=The embers catch in the brazier: the sacred flame burns again.
soulknight.forgotten.tribe$flintspear.name=flint spear
soulknight.forgotten.tribe$flintspear.desc=A long spear with a head of flint carved by the tribe. It reaches two cells and its wounds bleed.
soulknight.forgotten.tribe$hidearmor.name=hide armour
soulknight.forgotten.tribe$hidearmor.desc=Thick mammoth furs sewn by the tribe. Whoever wears it does not feel the cold of the Forgotten Land.
soulknight.forgotten.tribe$raptoregg.name=raptor egg
soulknight.forgotten.tribe$raptoregg.desc=A speckled, warm egg. If you hatch it, a velociraptor will come out and follow you everywhere.
soulknight.forgotten.tribe$raptoregg.ac_hatch=HATCH
soulknight.forgotten.tribe$raptoregg.no_space=There is no room for it to come out.
soulknight.forgotten.tribe$raptoregg.hatched=The egg cracks open and a velociraptor comes out, looking at you like its mother!
soulknight.forgotten.tharog.name=Tharog, Heart of the Valley
soulknight.forgotten.tharog.desc=A primeval beast of stone and moss, as old as the mountain. Its heart is the warmth that keeps the Forgotten Land alive.\n\nWhen it runs into a _pillar of ice_ it is stunned and loses one of the _plates_ of its back (each one takes damage away). It has %d plates left.
soulknight.forgotten.tharog.notice=GRRROOOOOOAAAAAAR!!
soulknight.forgotten.tharog.enraged=MY... HEART...!!
soulknight.forgotten.tharog.defeated=...the heart... goes out...
soulknight.forgotten.tharog.banner_wake=THE ICE CRACKS... THAROG WAKES UP!
soulknight.forgotten.tharog.hint_1=HINT: it is trapped in the ice: only its head and claw can reach you. Its breath freezes in a cone: step out of the marked cells!
soulknight.forgotten.tharog.free=FREE!!
soulknight.forgotten.tharog.banner_2=THAROG BREAKS THE ICE! The hall turns green around it.
soulknight.forgotten.tharog.hint_2=HINT: when it charges, get behind a PILLAR OF ICE: if it hits one, it is stunned, loses a plate and takes more damage.
soulknight.forgotten.tharog.cold=My heart... cools... let the ice come back!
soulknight.forgotten.tharog.banner_3=GLACIATION! The ice comes back from the walls. Stay by the braziers!
soulknight.forgotten.tharog.hint_3=HINT: on the frozen cells the frost rises very fast. The braziers warm; if its breath puts them out, walk into them to light them.
soulknight.forgotten.tharog.banner_tribe=THE TRIBE COMES TO HELP! HOO-HOO-HOO!
soulknight.forgotten.tharog.sky=LET THE SKY BURN!!
soulknight.forgotten.tharog.banner_4=EXTINCTION! The sky turns red and meteors fall.
soulknight.forgotten.tharog.hint_4=HINT: the meteors fall on the marked cells... and they hurt it too. Lure it onto them!
soulknight.forgotten.tharog.breath=Tharog breathes in... icy breath!
soulknight.forgotten.tharog.steam=Tharog is about to blow burning steam!
soulknight.forgotten.tharog.roar=ROOOOAAAR!!
soulknight.forgotten.tharog.sweep=Tharog is about to sweep with its tail!
soulknight.forgotten.tharog.stomp=Tharog stomps the ground!
soulknight.forgotten.tharog.charge=OUT OF MY WAY!!
soulknight.forgotten.tharog.plate=A plate of the back of Tharog breaks! %d left.
soulknight.forgotten.tharog.banner_plate=PLATE BROKEN! %d left.
soulknight.forgotten.tharog.stunned=Tharog crashes into the pillar and is stunned!
soulknight.forgotten.tharog.meteor_hit=meteor!
soulknight.forgotten.tharog.prey=Tharog has chosen %s as its prey!
soulknight.forgotten.tharog.prey_yell=YOU... ARE... MINE.
soulknight.forgotten.tharog.summon=The beasts of the valley answer its call!
soulknight.forgotten.tharog.banner_dead=THE HEART GOES OUT... The rain of fire stops and the ice begins to melt.
soulknight.forgotten.tharog$preymark.name=Prey of Tharog
soulknight.forgotten.tharog$preymark.desc=Tharog has chosen you. It will come for you and charge at you. Take cover behind the pillars of ice.\n\nTurns left: %s.
soulknight.forgotten.tharog$icepillar.name=pillar of ice
soulknight.forgotten.tharog$icepillar.desc=A solid pillar of ice. If Tharog runs into it while charging, it will be stunned.
soulknight.forgotten.tharog$tharogheart.name=Heart of Tharog
soulknight.forgotten.tharog$tharogheart.desc=The heart of the beast, a stone that still keeps a warm glow. If you absorb it, its warmth will be yours for good (+20 max health).
soulknight.forgotten.tharog$tharogheart.ac_absorb=ABSORB
soulknight.forgotten.tharog$tharogheart.absorbed=The warmth of the Heart of the Valley fills you.
soulknight.forgotten.tharoghud.phase_1=Trapped in the ice
soulknight.forgotten.tharoghud.phase_2=Free
soulknight.forgotten.tharoghud.phase_3=Glaciation
soulknight.forgotten.tharoghud.phase_4=Extinction
soulknight.forgotten.tharoghud.stunned=STUNNED!
soulknight.forgotten.tharoghud.plates=Plates: %d
soulknight.kraken.kraken.banner_grab_solo=The tentacle grabbed you! Hit it to break free!
soulknight.kraken.krakenhold.overboard_solo=You fell into the sea!
soulknight.kraken.krakenhold.freed_solo=You broke free of the tentacle!
soulknight.kraken.krakenhold.back_solo=You climb back up the stern ladder, soaking wet.
soulknight.kraken.harpooncannon.hit_tentacle_solo=You drive a harpoon into the tentacle!
soulknight.forgotten.forgottenfloor.break_solo=The ice breaks under your feet! The icy water takes your breath away.
soulknight.forgotten.forgottenfloor$forgottencold.frozen_solo=You are frozen solid!
soulknight.forgotten.tharog.prey_solo=Tharog has chosen you as its prey!

# the throne hall of the dark grand knight
soulknight.kingdom.darkgrandknight.statue_name=armor on the throne
soulknight.kingdom.darkgrandknight.desc_statue=A huge suit of armor sitting still on the black throne, with its shield and the banner of the kingdom on its back. It looks like one more statue of the hall... but something glows, very faintly, behind the slit of the helmet.
soulknight.kingdom.darkgrandknight.desc_act1=_Act I: the guardian._ He fights on foot: fans and rings of blades, bursting orbs, a _thrust_ along a line and the _leap of judgement_, which falls on the marked cells.
soulknight.kingdom.darkgrandknight.desc_act2=_Act II: the charge._ On his war horse he is faster and _charges_ along lines marked a turn before.
soulknight.kingdom.darkgrandknight.desc_act3=_Act III: the banner._ He has planted the banner of the kingdom: while it stands he takes _30% less damage_ and never strays more than three cells from it. Bring it down!
soulknight.kingdom.darkgrandknight.desc_act4=_Act IV: the shadow._ His shield is broken and the shadow pours out of the cracks. _Knights of shadow_ that can't be hurt fight by his side: hit the true one three times and they fade.
soulknight.kingdom.darkgrandknight.freed=The shadow leaves the armor with a wail. The knight, free at last, kneels before the empty throne.
soulknight.kingdom.darkgrandknight.title_name=DARK GRAND KNIGHT
soulknight.kingdom.darkgrandknight.title_sub=Champion of the Fallen Throne
soulknight.kingdom.darkgrandknight.thrust=The grand knight gets ready to thrust!
soulknight.kingdom.darkgrandknight.leap=The grand knight leaps at %s!
soulknight.kingdom.darkgrandknight.leap_solo=The grand knight leaps at you!
soulknight.kingdom.darkgrandknight.mount=To me, war horse!
soulknight.kingdom.darkgrandknight.hint_2=His horse gallops into the hall. Use the columns: if he charges into one, he will crash.
soulknight.kingdom.darkgrandknight.hint_3=He has planted the banner of the kingdom: while it stands, he takes less damage. Bring it down!
soulknight.kingdom.darkgrandknight.hint_4=His shield breaks and the torches go out. The shadow pours out of his armor.
soulknight.kingdom.darkgrandknight.banner_fell=No! The banner of the kingdom...!
soulknight.kingdom.darkgrandknight.banner_down=The banner falls! The grand knight can be hurt again.
soulknight.kingdom.darkgrandknight.shadow=My king... forgive me... The shadow is mine!
soulknight.kingdom.darkgrandknight.stunned=The grand knight is stunned!
soulknight.kingdom.darkgrandknight.stunned_short=stunned
soulknight.kingdom.darkgrandknight.blocked=blocked
soulknight.kingdom.throneprops$column.name=column
soulknight.kingdom.throneprops$column.desc=A stone column of the throne hall. It stops bullets, and if the grand knight charges or lunges into it, he crashes and is stunned.
soulknight.kingdom.throneprops$column.desc_cracked=A cracked column: it will take one more crash before it comes down.
soulknight.kingdom.throneprops$shieldwall.name=wall of shields
soulknight.kingdom.throneprops$shieldwall.desc=Shields driven into the floor side by side. They stop bullets until they break.
soulknight.kingdom.throneprops$ropecleat.name=rope of the chandelier
soulknight.kingdom.throneprops$ropecleat.desc=The rope that holds a chandelier over the carpet. Cut it while the grand knight is under it and the chandelier will fall on him.
soulknight.kingdom.throneprops$ropecleat.desc_cut=The cut rope hangs from its ring.
soulknight.kingdom.throneprops$brazier.name=brazier
soulknight.kingdom.throneprops$brazier.desc=An iron brazier of the throne hall.
soulknight.kingdom.throneprops$banner.name=banner of the kingdom
soulknight.kingdom.throneprops$banner.desc=The banner of the kingdom, planted by the grand knight. While it stands, he takes 30% less damage and doesn't stray from it.
soulknight.kingdom.knighthud.act_1=Act I: the guardian
soulknight.kingdom.knighthud.act_2=Act II: the charge
soulknight.kingdom.knighthud.act_3=Act III: the banner
soulknight.kingdom.knighthud.act_4=Act IV: the shadow
soulknight.kingdom.knighthud.stunned=STUNNED!
soulknight.kingdom.knighthud.banner=Banner standing: -30% damage
