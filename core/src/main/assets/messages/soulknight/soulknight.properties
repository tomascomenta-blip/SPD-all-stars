soulknight.wndskoptions.lobby_button_antiop=Difficulty: %1$s · Worlds: %2$d%% · Anti-OP %3$d
soulknight.wndskoptions.difficulty=Health of the monsters
soulknight.wndskoptions.easy=Easy
soulknight.wndskoptions.hardest=x4
soulknight.wndskoptions.difficulty_now=%s. In a cooperative run it is multiplied by the bonus of each player as well.
