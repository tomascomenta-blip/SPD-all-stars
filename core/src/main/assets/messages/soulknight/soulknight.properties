# the clearing of the goblin high priest
soulknight.forest.goblinpriest.name=goblin high priest
soulknight.forest.goblinpriest.name_brute=colossal high priest
soulknight.forest.goblinpriest.desc=The high priest of the jungle goblins, with a great feather headdress and a staff crowned by a star. He reads fate in the sky and guards the sacred clearing of the Forest.\n\nHe keeps his distance and casts: _stars_ that burst into bullets, _seeds_ that leave turrets behind, _orbs_ that circle around him and _meteors_ on marked cells. Every few turns he calls his _guard of honor_.
soulknight.forest.goblinpriest.desc_brute=The high priest, swollen with the power of the ritual totems left standing. He has twice the life and no longer keeps his distance: he _charges_ in straight lines, _slams the ground_ with his staff and _grabs and throws_ whoever stands next to him. He still casts a star now and then, but less.
soulknight.forest.goblinpriest.desc_rite=The high priest leads a ritual by the great bonfire, his back to you, while his goblins dance and beat the drums. He hasn't seen you yet.
soulknight.forest.goblinpriest.desc_act1=_Act I · The sermon._ When he loses a third of his life the ritual begins.
soulknight.forest.goblinpriest.desc_act2=_Act II · The ritual._ While any totem stands, no blow can hurt him. When the last one falls he is stunned and _exposed_: he takes more damage for a few turns.
soulknight.forest.goblinpriest.desc_act3=_Act III · The rain of stars._ Meteors keep falling on marked cells. When he calls the _giant star_ he floats and doesn't move: hurt him enough before the count ends, or stand _next to a sacred stone_.
soulknight.forest.goblinpriest.notice=Intruders in the sacred clearing! The stars will judge you!
soulknight.forest.goblinpriest.notice_brute=The totems gave me their strength! I'll crush you with my own hands!
soulknight.forest.goblinpriest.title_name=GOBLIN HIGH PRIEST
soulknight.forest.goblinpriest.title_sub=Voice of the stars
soulknight.forest.goblinpriest.title_brute=COLOSSAL HIGH PRIEST
soulknight.forest.goblinpriest.title_sub_brute=Swollen with the power of the totems
soulknight.forest.goblinpriest.roots=Roots close the clearing!
soulknight.forest.goblinpriest.absorb=The priest drinks the power of the ritual totems still standing (%d)!
soulknight.forest.goblinpriest.enraged=Enough! Let the whole sky fall!
soulknight.forest.goblinpriest.defeated=The stars... abandon me...
soulknight.forest.goblinpriest.defeated_brute=My strength... was... borrowed...
soulknight.forest.goblinpriest.freed=The great bonfire dies out and the clearing falls silent.
soulknight.forest.goblinpriest.stars=The high priest casts a wave of stars!
soulknight.forest.goblinpriest.seeds=The high priest sows a turret seed!
soulknight.forest.goblinpriest.orbs=Orbs start circling around the high priest!
soulknight.forest.goblinpriest.meteors=The high priest calls down meteors!
soulknight.forest.goblinpriest.charge=The high priest is about to charge!
soulknight.forest.goblinpriest.slam=The high priest raises his staff to strike the ground!
soulknight.forest.goblinpriest.grab=The high priest reaches for %s!
soulknight.forest.goblinpriest.grab_solo=The high priest reaches for you! Get away!
soulknight.forest.goblinpriest.crashed=He crashes into the stone and is stunned!
soulknight.forest.goblinpriest.guards=The high priest calls its guard of honor.
soulknight.forest.goblinpriest.ritual=Spirits of the jungle, protect me!
soulknight.forest.goblinpriest.ritual_broken=No! My totems!
soulknight.forest.goblinpriest.exposed=The ritual breaks! The priest is stunned and exposed.
soulknight.forest.goblinpriest.banner_ritual=ACT II · THE RITUAL
soulknight.forest.goblinpriest.banner_exposed=RITUAL BROKEN! NOW!
soulknight.forest.goblinpriest.banner_night=ACT III · THE RAIN OF STARS
soulknight.forest.goblinpriest.banner_star_broken=SPELL BROKEN!
soulknight.forest.goblinpriest.hint_2=Three totems protect him: fire, ivy and spirit. While the spirit totem stands, the other two take half damage.
soulknight.forest.goblinpriest.hint_3=Night falls. Meteors fall on the marked cells.
soulknight.forest.goblinpriest.stunned_short=stunned!
soulknight.forest.goblinpriest.star_call=Star of the ancients, come down!
soulknight.forest.goblinpriest.star_hint=A GIANT STAR is coming! Take %d life from him before the count ends to break the spell, or stand next to a sacred stone.
soulknight.forest.goblinpriest.star_broken=Nooo! My star!
soulknight.forest.goblinpriest.star_broken_hint=The spell breaks and the priest falls stunned!
soulknight.forest.goblinpriest.star_fell=Kneel before the sky!
soulknight.forest.goblinpriest.spirit_guard=shielded
soulknight.forest.goblinpriest.totem_name_0=fire totem
soulknight.forest.goblinpriest.totem_name_1=ivy totem
soulknight.forest.goblinpriest.totem_name_2=spirit totem
soulknight.forest.goblinpriest.totem_desc_0=A ritual totem crowned by a flame. Every few turns it marks the cells around a hero and fills them with fire.\n\nWhile any totem stands, _no blow can hurt the priest_.
soulknight.forest.goblinpriest.totem_desc_1=A ritual totem covered in leaves and roots. Every few turns it marks a hero's cell: if the hero is still there, the roots catch them.\n\nWhile any totem stands, _no blow can hurt the priest_.
soulknight.forest.goblinpriest.totem_desc_2=A ritual totem with a spirit mask. It doesn't attack, but while it stands _the other totems take only half damage_: break it first.\n\nWhile any totem stands, _no blow can hurt the priest_.
soulknight.forest.goblinpriest.totem_fell_0=The fire totem falls!
soulknight.forest.goblinpriest.totem_fell_1=The ivy totem falls!
soulknight.forest.goblinpriest.totem_fell_2=The spirit totem falls! The others are no longer shielded.
soulknight.forest.ritualtotems.name=ritual totem
soulknight.forest.ritualtotems.desc=A carved wooden post that throbs with a red light. It carries the power of this floor to the high priest of the Forest: if any ritual totem still stands when you reach his clearing, _he will drink its power and be much stronger_.\n\nIt doesn't attack, but the goblins nearby come as soon as you strike it.
soulknight.forest.ritualtotems.sensed=You feel a beat under your feet: there is a ritual totem on this floor.
soulknight.forest.ritualtotems.struck=The blow on the totem echoes through the jungle! The goblins nearby are coming.
soulknight.forest.ritualtotems.broken=Ritual totem destroyed! (%1$d/%2$d)
soulknight.forest.ritualtotems.all_broken=You broke every ritual totem: the high priest won't have their power.
soulknight.forest.priestprops$bonfire.name=great bonfire of the ritual
soulknight.forest.priestprops$bonfire.desc=A huge bonfire ringed with stones in the middle of the clearing. The flames rise high and throw sparks like stars. Nothing can go through it.
soulknight.forest.priestprops$bonfire.desc_out=The embers of the great bonfire. The ritual is over.
soulknight.forest.priestprops$sacredstone.name=sacred stone
soulknight.forest.priestprops$sacredstone.desc=An old standing stone covered in runes. It stops bullets, and when the giant star falls whoever stands _next to a sacred stone_ is safe.
soulknight.forest.priesthud.act_1=Act I · The sermon
soulknight.forest.priesthud.act_2=Act II · The ritual
soulknight.forest.priesthud.act_3=Act III · The rain of stars
