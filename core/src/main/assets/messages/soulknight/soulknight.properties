soulknight.forest.portabletotem.planted_name=portable totem
soulknight.forest.portabletotem.planted_desc=A planted totem that gives %1$d shield to the allies nearby. %2$d turns left.
soulknight.forest.priestbracers.name=bracers of the high priest
soulknight.forest.priestbracers.desc=The leather and bone bracers of the colossal priest, still warm with the power of the totems. While you wear them, your blows up close hit harder.\n\nCharged, they throw you at the nearest enemy in a straight line (up to 4 cells): a brutal blow that knocks it back and stuns it for a moment.
soulknight.forest.priestbracers.desc_ready=They are charged. Your blows up close deal %d%% more damage.
soulknight.forest.priestbracers.desc_charging=They are charging. Your blows up close deal %d%% more damage.
soulknight.forest.priestbracers.no_charge=The bracers are not charged yet.
soulknight.forest.priestbracers.no_enemy=You see no enemy in a straight line within 4 cells.
soulknight.forest.priestbracers.levelup=The bracers fit your arms better.
soulknight.forest.priestbracers.ready=The bracers of the high priest are ready.
soulknight.forest.priestbracers.ac_charge=CHARGE

# the hive of the varkolyn queen
soulknight.starship.varkolynleader.name=varkolyn queen
soulknight.starship.varkolynleader.desc=The queen of the hive that took the bridge of the ship: a huge purple beast with a shell, horns and spirals on her skin, insect legs, a mouth full of teeth and a swollen belly full of glowing eggs.
soulknight.starship.varkolynleader.desc_molted=The varkolyn queen without her shell: raw flesh with glowing green veins. She is faster, has no defense and spits acid.
soulknight.starship.varkolynleader.desc_cocoon=A huge cocoon stuck to the wall of the bridge. It beats slowly. Something very big sleeps inside.
soulknight.starship.varkolynleader.desc_phase1=_The bridge._ In a pool of her poison no blow can hurt her for a few turns; then she is exposed. Her brood hatches from the pools and the biomass. The _biomass_ spreads, slows whoever walks on it and heals her: fire and bombs burn it.
soulknight.starship.varkolynleader.desc_phase2=_The flight._ The lights go out. She fades away, no blow can hurt her and she runs very fast. Every few turns she stops and lays a _nest_ where she is (one for each hero) and leaves a _trail of slime_. The motion radar shows roughly where she is.
soulknight.starship.varkolynleader.desc_phase3=_The lair._ At a quarter of her life she sheds her shell. The _console_ opens the _airlock_ to space: whatever doesn't hold on to a _handhold_ is pulled, her brood is sucked out, and she clings to the floor and takes double damage.
soulknight.starship.varkolynleader.title_name=QUEEN OF THE HIVE
soulknight.starship.varkolynleader.title_sub=Mother of the varkolyns
soulknight.starship.varkolynleader.notice=Krrrah! Fresh meat for the hive!
soulknight.starship.varkolynleader.enraged=KRRRAAAH!
soulknight.starship.varkolynleader.defeated=The hive... will fall... with me...
soulknight.starship.varkolynleader.alarm=The alarm of the ship goes off! Something moves inside the cocoon on the wall...
soulknight.starship.varkolynleader.banner_alert=BIOLOGICAL ALERT
