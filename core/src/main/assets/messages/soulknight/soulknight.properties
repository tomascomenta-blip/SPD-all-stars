soulknight.starship.varkolynleader.tentacles=Tentacles sprout from the floor!
soulknight.starship.varkolynleader.ring=A rain of spikes flies everywhere!
soulknight.starship.varkolynleader.lasers=The eyes of the varkolyn queen charge with energy!
soulknight.starship.varkolynleader.core=A purple core starts spinning!
soulknight.starship.varkolynleader.acid=The varkolyn queen spits acid!
