soulknight.starship.hiveheart.name=heart of the hive
soulknight.starship.hiveheart.desc=The heart of the hive left by the varkolyn queen. It beats while you fight.\n\n_Awakened_, a varkolyn whelp hatches next to you; it fights for you and follows you. When it dies, the heart has to charge again.
soulknight.starship.hiveheart.desc_ready=It is charged: awaken it and the whelp will hatch.
