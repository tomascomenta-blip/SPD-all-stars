soulknight.forest.portabletotem.name=tótem portátil
soulknight.forest.portabletotem.desc=Un tótem pequeño tallado por el sumo sacerdote para su guardia. Se carga mientras luchas.\n\n_Plantado_ a tu lado, durante unos turnos da un escudo a ti y a los compañeros que estén cerca.
soulknight.forest.portabletotem.desc_ready=Está cargado: plantado, da %1$d de escudo durante %2$d turnos a los que estén a 2 casillas o menos.
soulknight.forest.portabletotem.desc_charging=Se está cargando. Cuando esté listo dará %1$d de escudo durante %2$d turnos.
soulknight.forest.portabletotem.no_charge=El tótem todavía no está cargado.
soulknight.forest.portabletotem.no_room=No hay sitio libre a tu lado para plantarlo.
soulknight.forest.portabletotem.levelup=El tótem portátil brilla con más fuerza.
soulknight.forest.portabletotem.ready=El tótem portátil está listo.
soulknight.forest.portabletotem.ac_plant=PLANTAR
soulknight.forest.portabletotem.planted_name=tótem portátil
soulknight.forest.portabletotem.planted_desc=Un tótem plantado que da %1$d de escudo a los aliados cercanos. Le quedan %2$d turnos.
soulknight.forest.priestbracers.name=brazales del sumo sacerdote
soulknight.forest.priestbracers.desc=Los brazales de cuero y hueso del sacerdote colosal, todavía calientes por el poder de los tótems. Mientras los llevas, tus golpes cuerpo a cuerpo pegan más fuerte.\n\nCargados, te lanzan contra el enemigo más cercano que tengas en línea recta (hasta 4 casillas): un golpe brutal que lo empuja y lo aturde un momento.
soulknight.forest.priestbracers.desc_ready=Están cargados. Tus golpes cuerpo a cuerpo hacen un %d %% más de daño.
soulknight.forest.priestbracers.desc_charging=Se están cargando. Tus golpes cuerpo a cuerpo hacen un %d %% más de daño.
soulknight.forest.priestbracers.no_charge=Los brazales todavía no están cargados.
soulknight.forest.priestbracers.no_enemy=No ves ningún enemigo en línea recta a 4 casillas o menos.
soulknight.forest.priestbracers.levelup=Los brazales se ajustan mejor a tus brazos.
soulknight.forest.priestbracers.ready=Los brazales del sumo sacerdote están listos.
soulknight.forest.priestbracers.ac_charge=EMBESTIR

# the hive of the varkolyn queen
soulknight.starship.varkolynleader.name=reina varkolyn
soulknight.starship.varkolynleader.desc=La reina de la colmena que tomó el puente de la nave: una bestia morada enorme con coraza, cuernos y espirales en la piel, patas de insecto, una boca llena de dientes y un abdomen hinchado lleno de huevos que brillan.
soulknight.starship.varkolynleader.desc_molted=La reina varkolyn sin su coraza: carne viva surcada de venas verdes. Es más rápida, no tiene defensas y escupe ácido.
soulknight.starship.varkolynleader.desc_cocoon=Un capullo enorme pegado a la pared del puente. Late despacio. Algo muy grande duerme dentro.
soulknight.starship.varkolynleader.desc_phase1=_El puente._ En un charco de su veneno no le hace nada ningún golpe durante unos turnos; luego queda expuesta. De los charcos y de la biomasa nacen crías. La _biomasa_ crece, frena a quien la pisa y la cura a ella: el fuego y las bombas la queman.
soulknight.starship.varkolynleader.desc_phase2=_La huida._ Se apagan las luces. Se desvanece, no le hace nada ningún golpe y corre muy deprisa. Cada pocos turnos se para y pone un _nido_ donde está (uno por héroe) y deja un _rastro de baba_. El radar de movimiento dice más o menos dónde está.
soulknight.starship.varkolynleader.desc_phase3=_La guarida._ Al 25 % rompe su coraza. La _consola_ abre la _esclusa_ al espacio: lo que no esté agarrado a un _asidero_ es arrastrado, las crías salen despedidas y ella se aferra al suelo y recibe el doble de daño.
soulknight.starship.varkolynleader.title_name=REINA DE LA COLMENA
soulknight.starship.varkolynleader.title_sub=Madre de los varkolyns
soulknight.starship.varkolynleader.notice=¡Krrrah! ¡Carne fresca para la colmena!
soulknight.starship.varkolynleader.enraged=¡KRRRAAAH!
soulknight.starship.varkolynleader.defeated=La colmena... caerá... conmigo...
soulknight.starship.varkolynleader.alarm=¡Salta la alarma de la nave! Algo se mueve dentro del capullo de la pared...
soulknight.starship.varkolynleader.banner_alert=ALERTA BIOLÓGICA
soulknight.starship.varkolynleader.poison=¡La reina varkolyn escupe veneno!
soulknight.starship.varkolynleader.tentacles=¡Brotan tentáculos del suelo!
soulknight.starship.varkolynleader.ring=¡Una lluvia de púas sale en todas direcciones!
soulknight.starship.varkolynleader.lasers=¡Los ojos de la reina varkolyn se cargan de energía!
soulknight.starship.varkolynleader.core=¡Un núcleo morado empieza a girar!
soulknight.starship.varkolynleader.acid=¡La reina varkolyn escupe ácido!
soulknight.starship.varkolynleader.pool=¡a salvo!
soulknight.starship.varkolynleader.exposed=¡expuesta!
soulknight.starship.varkolynleader.hide=¡Mis crías os devorarán!
soulknight.starship.varkolynleader.egg=Algo invisible ha puesto un huevo cerca.
soulknight.starship.varkolynleader.nests=Se apagan las luces y la reina huye. Pondrá %d nidos: seguid su rastro y rompedlos todos.
soulknight.starship.varkolynleader.banner_flight=APAGÓN · ¡LA REINA HUYE!
soulknight.starship.varkolynleader.nest_laid=Algo pone un nido en la oscuridad. Le quedan %d por poner.
soulknight.starship.varkolynleader.last_stand=¡Venid a mi guarida!
soulknight.starship.varkolynleader.banner_lair=LA GUARIDA
soulknight.starship.varkolynleader.hint_lair=Golpead la consola para abrir la esclusa al espacio, y agarraos a un asidero cuando se abra.
soulknight.starship.varkolynleader.molt=¡KRRRIIIIH!
soulknight.starship.varkolynleader.banner_molt=¡LA REINA MUDA!
soulknight.starship.varkolynleader.hint_molt=La reina rompe su coraza: es más rápida, no tiene defensas y escupe ácido. Salen más crías.
soulknight.starship.varkolynleader.banner_airlock=¡ESCLUSA AL VACÍO!
soulknight.starship.varkolynleader.airlock_armed=¡La esclusa se va a abrir! Agarraos a un asidero.
soulknight.starship.varkolynleader.airlock_open=¡La esclusa se abre y el vacío lo arrastra todo!
soulknight.starship.varkolynleader.airlock_closed=La esclusa se cierra.
soulknight.starship.varkolynleader.airlock_ready=La consola de la esclusa vuelve a estar lista.
soulknight.starship.varkolynleader.vacuum_hurt=¡El frío del vacío te quema!
soulknight.starship.varkolynleader.banner_won=AMENAZA BIOLÓGICA ELIMINADA
soulknight.starship.varkolynleader.won=La colmena se marchita y vuelven las luces de la nave.
soulknight.starship.varkolynleader$lairnest.name=nido de la reina varkolyn
soulknight.starship.varkolynleader$lairnest.desc=Un nido que la reina varkolyn ha puesto al huir. Suelta varkolyns mientras siga en pie. _Rompe todos los nidos_ y volveréis a pelear con ella.
soulknight.starship.varkolynleader$hivedark.name=Apagón
soulknight.starship.varkolynleader$hivedark.desc=Las luces de la nave se han apagado mientras la reina se esconde: solo ves lo que tienes muy cerca.
soulknight.starship.hive.name=colmena
soulknight.starship.hive.desc=Biomasa de la colmena: frena a quien la pisa y cura a la reina varkolyn. El fuego y las bombas la queman.
soulknight.starship.hiveprops$airlockconsole.name=consola de la esclusa
soulknight.starship.hiveprops$airlockconsole.desc=La consola que abre la esclusa de la guarida al espacio. Golpéala para armarla: un turno después la esclusa se abre y el vacío arrastra todo lo que no esté agarrado a un _asidero_. Las crías salen despedidas y la reina se aferra al suelo, sin poder moverse y recibiendo el doble de daño.
