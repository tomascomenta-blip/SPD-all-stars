soulknight.starship.hiveheart.name=corazón de la colmena
soulknight.starship.hiveheart.desc=El corazón de la colmena que dejó la reina varkolyn. Late mientras luchas.\n\n_Despertado_, hace nacer a tu lado una cría varkolyn que pelea por ti y te sigue. Cuando muere, el corazón tiene que volver a cargarse.
