soulknight.wndskoptions.title=Dificultad y mundos
soulknight.wndskoptions.button=Dificultad y mundos
soulknight.wndskoptions.lobby_button=Dificultad: %1$s · Mundos: %2$d%%
soulknight.wndskoptions.lobby_button_antiop=Dificultad: %1$s · Mundos: %2$d%% · Anti-OP %3$d
soulknight.wndskoptions.difficulty=Vida de los monstruos
soulknight.wndskoptions.easy=Fácil
soulknight.wndskoptions.hardest=×4
soulknight.wndskoptions.difficulty_now=%s. En el cooperativo se multiplica además por el extra de cada jugador.
soulknight.wndskoptions.worlds=Mundos alternativos
soulknight.wndskoptions.never=Nunca
soulknight.wndskoptions.always=Siempre
soulknight.wndskoptions.worlds_now=Cada región sale como su mundo alternativo con un %d%% de probabilidad.
soulknight.wndskoptions.antiop=Anti-OP
soulknight.wndskoptions.note=Anti-OP: ningún golpe quita a un monstruo (ni a un jefe) más que ese número. Todo se aplica al empezar una partida nueva; en el cooperativo cuenta lo que elija el anfitrión.

###### the Kraken
soulknight.kraken.krakenlevel.sea_name=mar embravecido
soulknight.kraken.krakenlevel.sea_desc=Olas negras del tamaño de casas. Caer ahí es dejar de existir... salvo que alguien te eche una cuerda.
soulknight.kraken.krakenlevel.deck_name=cubierta
soulknight.kraken.krakenlevel.deck_desc=Tablones empapados que crujen con cada ola. Si el barco se hunde, os hundís todos con él.
soulknight.kraken.kraken.name=Kraken
soulknight.kraken.kraken.desc=El verdadero señor del abismo: una bestia tan antigua como el mar, tan grande que su cabeza sola es una isla. El submarino lo mantenía dormido.\n\nSolo se le puede herir en _el ojo_, cuando el barco llega hasta el remolino: cualquier golpe en el ojo abierto le quita _200 de vida_ y aleja el barco. Mientras tanto, sus _tentáculos_ golpean el barco: matadlos para que el barco avance, y _tapad los boquetes_ con el martillo o el barco se hundirá con todos dentro.
soulknight.kraken.kraken.closed=¡ojo cerrado!
soulknight.kraken.kraken.guarded=¡protegido!
soulknight.kraken.kraken.notice=NADIE... SALE... DE MI MAR.
soulknight.kraken.kraken.hurt_1=¡¡GRRRAAAAOOOOHHH!!
soulknight.kraken.kraken.hurt_2=¡¡MI OJO!! ¡OS ARRASTRARÉ AL FONDO!
soulknight.kraken.kraken.hurt_3=¡¡NOOOO!! ¡EL MAR ENTERO OS TRAGARÁ!
soulknight.kraken.kraken.arrive_1=¿QUÉ SOIS... VOSOTROS... GUSANOS DE TIERRA?
soulknight.kraken.kraken.arrive_2=VENID... ACERCAOS... MÁS...
soulknight.kraken.kraken.arrive_3=MIS HIJOS... PROTEGEN... MI OJO.
soulknight.kraken.kraken.arrive_4=¡¡NO!! ¡¡SOLTAD... MI... BARCO!!
soulknight.kraken.kraken.jet=¡El Kraken va a escupir un chorro de agua!
soulknight.kraken.kraken.ink=¡El Kraken escupe tinta sobre la cubierta!
soulknight.kraken.kraken.mast_fire=¡Un rayo ha prendido el mástil! Caerá en pocos turnos.
soulknight.kraken.kraken.boarders=¡Monstruos del abismo trepan por la borda!
soulknight.kraken.kraken.crushed=El Kraken aplasta el barco entre sus brazos. Nadie sobrevive.
soulknight.kraken.kraken.sunk=El barco se parte en dos y se hunde en el remolino con todos a bordo.
soulknight.kraken.kraken.defeated=glub... glub... ...
soulknight.kraken.kraken.hint_hammer=PISTA: cada boquete hunde el barco poco a poco. Ponte al lado y usa el MARTILLO (1 turno por boquete).
soulknight.kraken.kraken.hint_helm=PISTA: si alguien se pone detrás del TIMÓN (en la popa), el barco llega antes al remolino.
soulknight.kraken.kraken.hint_cannon=PISTA: el mar arrastra ARPONES a la cubierta. Cógelos y camina hacia el CAÑÓN de la proa para disparar.
soulknight.kraken.kraken.hint_leave=Se acabó. Recoged el botín y caminad hasta la punta del bauprés para desembarcar.
soulknight.kraken.kraken.hint_tentacle_1=PISTA: mientras el tentáculo siga sobre la cubierta, el barco no avanza. ¡Destruidlo!
soulknight.kraken.kraken.hint_tentacle_2=PISTA: este tentáculo atrapa a un héroe. Los demás deben herir al tentáculo para que lo suelte.
soulknight.kraken.kraken.hint_tentacle_3=PISTA: la coraza para casi todo el daño. Golpead la VENTOSA QUE BRILLA (cambia de sitio).
soulknight.kraken.kraken.hint_tentacle_4=PISTA: el Kraken arrastra el barco al remolino. Matad al tentáculo madre antes de que acabe la cuenta atrás.
soulknight.kraken.kraken.banner_intro=Despertáis en la cubierta de un barco, en mitad de la tormenta... y el remolino os arrastra hacia ÉL.
soulknight.kraken.kraken.banner_tentacle_1=¡UN TENTÁCULO GIGANTE SALE DEL MAR!
soulknight.kraken.kraken.banner_tentacle_2=¡EL TENTÁCULO DEL GANCHO! ¡Cuidado, atrapa a quien alcanza!
soulknight.kraken.kraken.banner_tentacle_3=¡EL TENTÁCULO ACORAZADO! Golpead la ventosa que brilla.
soulknight.kraken.kraken.banner_tentacle_4=¡EL TENTÁCULO MADRE! ¡El Kraken abraza el barco y lo arrastra al fondo!
soulknight.kraken.kraken.banner_grab=¡%s ha sido atrapado! ¡Herid al tentáculo para liberarlo!
soulknight.kraken.kraken.banner_sail=¡El tentáculo se hunde! ¡A toda vela hacia el remolino!
soulknight.kraken.kraken.banner_spiral=¡El barco cae en espiral hacia el ojo! ¡Este es el golpe final!
soulknight.kraken.kraken.banner_eye=¡EL OJO ESTÁ ABIERTO! ¡GOLPEADLO!
soulknight.kraken.kraken.banner_guards=¡Dos tentáculos protegen el ojo! ¡Matadlos primero!
soulknight.kraken.kraken.banner_regrow=¡Los tentáculos del ojo vuelven a crecer!
soulknight.kraken.kraken.banner_mast=¡EL MÁSTIL SE VIENE ABAJO! ¡Apartaos!
soulknight.kraken.kraken.banner_countdown=¡%d turnos para que el Kraken aplaste el barco!
soulknight.kraken.kraken.banner_pushed=¡Golpe en el ojo! El Kraken aleja el barco. Le quedan %d vidas.
soulknight.kraken.kraken.banner_won=¡EL KRAKEN HA CAÍDO! La tormenta se abre...
soulknight.kraken.gianttentacle.name_1=tentáculo del Kraken
soulknight.kraken.gianttentacle.name_2=tentáculo del gancho
soulknight.kraken.gianttentacle.name_3=tentáculo acorazado
soulknight.kraken.gianttentacle.name_4=tentáculo madre
soulknight.kraken.gianttentacle.desc_1=Un brazo del Kraken tan grueso como un tronco, tendido de borda a borda. Mientras siga aquí, el barco no avanza.
soulknight.kraken.gianttentacle.desc_2=Largo y fino, con la punta en gancho. Atrapa a un héroe y lo levanta sobre el mar: herid al tentáculo para que lo suelte.
soulknight.kraken.gianttentacle.desc_3=Cubierto de placas de caparazón que paran casi todo el daño. Solo _la ventosa que brilla_ recibe golpes de verdad, y cambia de sitio.
soulknight.kraken.gianttentacle.desc_4=El brazo más viejo del Kraken, lleno de cicatrices y percebes. Golpea, atrapa y tiene coraza. Mientras viva, el Kraken arrastra el barco hacia el fondo.
soulknight.kraken.gianttentacle.weak=¡ventosa!
soulknight.kraken.gianttentacle.dies=*el tentáculo se retuerce y se hunde en el mar*
soulknight.kraken.guardtentacle.name=guardián del ojo
soulknight.kraken.guardtentacle.desc=Un tentáculo más pequeño que mantiene cerrado el ojo del Kraken mientras viva. Escupe burbujas a quien se acerca a la proa.
soulknight.kraken.krakenhold.overboard=¡%s ha caído al mar!
soulknight.kraken.krakenhold.freed=¡%s se ha liberado del tentáculo!
soulknight.kraken.krakenhold.back=%s vuelve a subir por la escalerilla de popa, empapado.
soulknight.kraken.krakenhold.name_overboard=hombre al agua
soulknight.kraken.krakenhold.name_grabbed=atrapado
soulknight.kraken.krakenhold.desc_overboard=Has caído al mar. Vuelves a subir por la escalerilla de popa dentro de unos turnos, con algo de daño.\n\nTurnos restantes: %s.
soulknight.kraken.krakenhold.desc_grabbed=Un tentáculo te tiene atrapado y te aprieta cada turno. Si se le hace suficiente daño, te suelta; si no, te dejará caer.\n\nTurnos restantes: %s.
soulknight.kraken.shiphammer.name=martillo de carpintero
soulknight.kraken.shiphammer.desc=Un martillo y un puñado de clavos. Úsalo junto a un boquete (o encima) para taparlo: tarda un turno y devuelve algo de vida al barco.\n\nDesaparece al acabar la pelea.
soulknight.kraken.shiphammer.ac_repair=REPARAR
soulknight.kraken.shiphammer.no_ship=Aquí no hay nada que reparar.
soulknight.kraken.shiphammer.no_hole=No hay ningún boquete a tu alcance: ponte al lado.
soulknight.kraken.krakenharpoon.name=arpón
soulknight.kraken.krakenharpoon.desc=Un arpón de ballenero que el mar ha arrastrado a la cubierta. Llévalo al cañón de la proa y camina hacia el cañón para dispararlo.
soulknight.kraken.krakenharpoon.hint=Lleva el arpón al cañón de la proa.
soulknight.kraken.krakeneyegun.name=Ojo del Kraken
soulknight.kraken.krakeneyegun.desc=El ojo del Kraken, endurecido como el ámbar y engarzado en coral. Aún llama a los rayos de la tormenta, que saltan de enemigo en enemigo.
soulknight.kraken.harpooncannon.name=cañón arpón
soulknight.kraken.harpooncannon.desc=Una ballesta pesada clavada en la proa. Camina hacia ella con un arpón para dispararlo: al ojo abierto, a los guardianes del ojo o al tentáculo gigante (le hace una gran herida y deja de agitarse un rato).
soulknight.kraken.harpooncannon.empty=El cañón está vacío: hace falta un arpón.
soulknight.kraken.harpooncannon.nothing=No hay nada a lo que disparar ahora.
soulknight.kraken.harpooncannon.hit_tentacle=¡%s clava un arpón en el tentáculo!
soulknight.kraken.grumete.name=grumete
soulknight.kraken.grumete.desc=El grumete del barco. No sabe pelear, pero tapa boquetes como nadie (despacio).
soulknight.kraken.grumete.talk_0=¡Yo tapo los agujeros, usted dele al bicho!
soulknight.kraken.grumete.talk_1=¡Mi abuelo decía que el Kraken era un cuento!
soulknight.kraken.grumete.talk_2=¡Más clavos! ¡Necesito más clavos!
soulknight.kraken.krakencall.rumble=El agua tiembla. Algo enorme se mueve bajo vuestros pies...
soulknight.kraken.krakencall.water=¡El mar entra por todas partes! ¡El suelo se abre!
soulknight.kraken.krakencall.eye=En la oscuridad del abismo, un ojo enorme se abre.
soulknight.kraken.krakenhud.ship=Barco %1$d/%2$d   Boquetes: %3$d
soulknight.kraken.krakenhud.held=El tentáculo retiene el barco
soulknight.kraken.krakenhud.sailing=Distancia al remolino: %d
soulknight.kraken.krakenhud.helm=(timón: x2)
soulknight.kraken.krakenhud.arrived=¡Frente al Kraken!
soulknight.kraken.krakenhud.pushed=El Kraken aleja el barco
soulknight.kraken.krakenhud.won=La tormenta se calma
soulknight.kraken.krakenhud.countdown=¡APLASTAMIENTO EN %d!
soulknight.undersea.abyssalsubmariner.potions=Cada héroe recibe dos pociones de curación.

###### the Forgotten Land
soulknight.skworlds.intro_forgotten=Bajo la Ciudad enana no está el infierno que cuentan las leyendas, sino un glaciar. Y bajo el glaciar, algo late: un mundo perdido que el tiempo olvidó.
soulknight.forgotten.forgottenlevel.water_name_ice=agua helada
soulknight.forgotten.forgottenlevel.water_name_thaw=agua de deshielo
soulknight.forgotten.forgottenlevel.water_name_jungle=agua de pantano
soulknight.forgotten.forgottenlevel.grass_name_ice=matojos helados
soulknight.forgotten.forgottenlevel.grass_name_thaw=musgo húmedo
soulknight.forgotten.forgottenlevel.grass_name_jungle=helechos gigantes
soulknight.forgotten.forgottenlevel.water_desc_ice=Agua tan fría que quema. Meterse en ella te hiela mucho más deprisa.
soulknight.forgotten.forgottenlevel.water_desc_thaw=Agua del glaciar que se derrite, todavía con trozos de hielo.
soulknight.forgotten.forgottenlevel.water_desc_jungle=Agua verde y tibia. Algo grande podría estar escondido debajo.
soulknight.forgotten.forgottenlevel.wall_desc_ice=Hielo azul de un glaciar antiquísimo. Dentro se adivinan sombras de cosas que murieron hace eras.
soulknight.forgotten.forgottenlevel.wall_desc_thaw=Roca mojada con hielo que gotea. El glaciar se está derritiendo.
soulknight.forgotten.forgottenlevel.wall_desc_jungle=Roca cubierta de musgo y lianas. El aire es caliente y húmedo, como si la piedra respirara.
soulknight.forgotten.forgottenlevel.empty_deco_desc_ice=Nieve apisonada con huellas enormes.
soulknight.forgotten.forgottenlevel.empty_deco_desc_thaw=Barro y restos de nieve sucia.
soulknight.forgotten.forgottenlevel.empty_deco_desc_jungle=Huesos gigantescos medio enterrados en la tierra.
soulknight.forgotten.forgottenfloor.crack=El hielo cruje bajo tus pies...
soulknight.forgotten.forgottenfloor.break=¡El hielo se rompe bajo %s! El agua helada corta la respiración.
soulknight.forgotten.forgottenfloor.tar=¡Te has metido en un pozo de brea!
soulknight.forgotten.forgottenfloor.blizzard=¡Se levanta una ventisca! Apenas se ve nada en las salas heladas.
soulknight.forgotten.forgottenfloor.blizzard_end=La ventisca amaina.
soulknight.forgotten.forgottenfloor.icicles=¡Crujen los carámbanos del techo!
soulknight.forgotten.forgottenfloor$forgottencold.name=Escarcha
soulknight.forgotten.forgottenfloor$forgottencold.desc=El frío se te mete en los huesos. Quedarte quieto o meterte en el agua en una sala helada lo empeora; moverte lo alivia y un brasero cercano lo quita del todo.\n\nA 12, estarás entumecido; a 24, te congelarás.\n\nEscarcha: %d.
soulknight.forgotten.forgottenfloor$forgottencold.frozen=¡%s se ha quedado congelado!
soulknight.forgotten.forgottenfloor$whiteout.name=Ventisca
soulknight.forgotten.forgottenfloor$whiteout.desc=La nieve no te deja ver más allá de tu nariz.
soulknight.forgotten.forgottenfeatures$brazier.name=brasero de la tribu
soulknight.forgotten.forgottenfeatures$brazier.desc=Un brasero de piedra encendido por la tribu. Junto a él (a 2 casillas) no se pasa frío, y aviva la llama sagrada.
soulknight.forgotten.forgottenfeatures$brazier.desc_out=Un brasero apagado por el hielo. Camina hacia él para volver a encenderlo.
soulknight.forgotten.forgottenfeatures$brazier.relit=Vuelves a encender el brasero.
soulknight.forgotten.forgottenfeatures$brazier.warm=El calor del brasero te devuelve a la vida.
soulknight.forgotten.forgottenfeatures$icewall.name=muro de hielo
soulknight.forgotten.forgottenfeatures$icewall.desc=Un bloque de hielo que tapa el paso. El fuego lo derrite al instante; a golpes cuesta mucho más.
soulknight.forgotten.forgottenfeatures$frozenblock.name=bestia congelada
soulknight.forgotten.forgottenfeatures$frozenblock.desc=Algo enorme duerme dentro de este bloque de hielo desde hace milenios. El fuego, los golpes o una pelea a su lado podrían despertarlo.
soulknight.forgotten.forgottenfeatures$frozenblock.wakes=¡El hielo estalla y la bestia despierta!
soulknight.forgotten.forgottenfeatures$frozenchest.name=cofre helado
soulknight.forgotten.forgottenfeatures$frozenchest.desc=Un cofre atrapado en el hielo. Se puede liberar con fuego o a golpes... pero los golpes hacen mucho ruido.
soulknight.forgotten.forgottenfeatures$nest.name=nido
soulknight.forgotten.forgottenfeatures$nest.desc=Un nido de ramas con tres huevos moteados. Su madre no andará lejos.
soulknight.forgotten.forgottenfeatures$nest.desc_empty=Un nido vacío y pisoteado.
soulknight.forgotten.forgottenfeatures$nest.mother=¡Un rugido furioso! ¡La madre viene a por ti!
soulknight.forgotten.forgottenfeatures$dinoegg.name=huevo de dinosaurio
soulknight.forgotten.forgottenfeatures$dinoegg.desc=Un huevo enorme y pesado. Da para una buena comida.
soulknight.forgotten.forgottenfeatures$amber.name=ámbar con mosquito
soulknight.forgotten.forgottenfeatures$amber.desc=Un trozo de ámbar con un mosquito atrapado dentro desde hace millones de años. Un mercader pagaría bien por él.
soulknight.forgotten.forgottenmobs$mammoth.name=mamut lanudo
soulknight.forgotten.forgottenmobs$mammoth.desc=Una montaña de pelo y colmillos. Lento, pero cuando _embiste en línea_ derriba lo que encuentra. El frío no le afecta.
soulknight.forgotten.forgottenmobs$sabertooth.name=dientes de sable
soulknight.forgotten.forgottenmobs$sabertooth.desc=Un felino de colmillos como dagas. Acecha y _salta sobre quien va solo_, abriendo heridas que sangran.
soulknight.forgotten.forgottenmobs$sabertooth.crouch=El dientes de sable se agazapa...
soulknight.forgotten.forgottenmobs$frostwolf.name=lobo de escarcha
soulknight.forgotten.forgottenmobs$frostwolf.desc=Cazan en manada. Cuando uno _aúlla_, todos los lobos del piso acuden. Su mordisco hiela.
soulknight.forgotten.forgottenmobs$frostwolf.howl=¡Un aullido helado recorre las cuevas!
soulknight.forgotten.forgottenmobs$yeti.name=yeti
soulknight.forgotten.forgottenmobs$yeti.desc=Una bestia peluda de brazos larguísimos. Lanza _bolas de nieve_ que frenan y hielan.
soulknight.forgotten.forgottenmobs$sloth.name=perezoso gigante
soulknight.forgotten.forgottenmobs$sloth.desc=Pacífico y tranquilo... _hasta que alguien lo ataca_. Entonces aplasta todo lo que tiene alrededor.
soulknight.forgotten.forgottenmobs$sloth.angry=¡El perezoso gigante se enfada!
soulknight.forgotten.forgottenmobs$woollyrhino.name=rinoceronte lanudo
soulknight.forgotten.forgottenmobs$woollyrhino.desc=Bajo, macizo y con dos cuernos. _Embiste en línea recta_ y rompe el hielo fino a su paso.
soulknight.forgotten.forgottenmobs$raptor.name=velocirraptor
soulknight.forgotten.forgottenmobs$raptor.desc=Rápido y listo. _Salta sobre los heridos_ y caza en grupo; solo y malherido, huye.
soulknight.forgotten.forgottenmobs$triceratops.name=triceratops
soulknight.forgotten.forgottenmobs$triceratops.desc=Su gorguera y sus tres cuernos _paran casi todo el daño de frente_: atácalo por los lados. Embiste y empuja.
soulknight.forgotten.forgottenmobs$triceratops.frill=¡gorguera!
soulknight.forgotten.forgottenmobs$pterodactyl.name=pterodáctilo
soulknight.forgotten.forgottenmobs$pterodactyl.desc=Vuela por encima de todo. _Te agarra y te suelta_ unas casillas más allá.
soulknight.forgotten.forgottenmobs$pterodactyl.dropped=¡El pterodáctilo te levanta y te deja caer!
soulknight.forgotten.forgottenmobs$dilophosaurus.name=dilofosaurio
soulknight.forgotten.forgottenmobs$dilophosaurus.desc=Despliega la gorguera del cuello y _escupe veneno que ciega_.
soulknight.forgotten.forgottenmobs$ankylosaurus.name=anquilosaurio
soulknight.forgotten.forgottenmobs$ankylosaurus.desc=Un tanque viviente: su caparazón para mucho daño y su _cola maza aturde_.
soulknight.forgotten.forgottenmobs$compy.name=compsognathus
soulknight.forgotten.forgottenmobs$compy.desc=Diminutos y rapidísimos, siempre en grupo. _Te roban la comida_ y salen corriendo.
soulknight.forgotten.forgottenmobs$compy.stole=¡Un compsognathus te roba: %s!
soulknight.forgotten.forgottenmobs$spinosaurus.name=espinosaurio
soulknight.forgotten.forgottenmobs$spinosaurus.desc=Un gigante con una vela en el lomo. _Espera sumergido_ y solo asoma para morder a quien se acerca a la orilla.
soulknight.forgotten.forgottenmobs$carnivoreplant.name=planta carnívora
soulknight.forgotten.forgottenmobs$carnivoreplant.desc=Una flor enorme con dientes. No se mueve, pero _muerde y atrapa_ a quien pasa a su lado.
soulknight.forgotten.forgottenmobs$carnivoreplant.swallow=¡La planta te atrapa con sus fauces!
soulknight.forgotten.tribe$shaman.name=chamán de la tribu
soulknight.forgotten.tribe$shaman.desc=El chamán de la tribu que vive en la Tierra Olvidada. Lleva una máscara de calavera de ciervo y un bastón con plumas.
soulknight.forgotten.tribe$shaman.quest=¡Extranjeros! El frío avanza: el Corazón del Valle se apaga. Llevad esta llama del fuego sagrado hasta el altar de la selva, abajo. ¡Que no se apague!
soulknight.forgotten.tribe$shaman.quest_hint=MISIÓN: lleva la LLAMA SAGRADA hasta el ALTAR de la jungla (piso 24). El frío y la ventisca la debilitan; los BRASEROS del camino y las tierras templadas la avivan. Si se apaga, lleva las brasas a un brasero encendido o al fuego sagrado.
soulknight.forgotten.tribe$shaman.thanks=La tribu no olvidará lo que hicisteis. Cuando ruja el Corazón del Valle, estaremos a vuestro lado.
soulknight.forgotten.tribe$shaman.relight=La llama se ha apagado... Lleva las brasas a un brasero encendido o al fuego sagrado.
soulknight.forgotten.tribe$shaman.talk_0=Bajo nuestros pies duerme Tharog, el Corazón del Valle. Su calor es lo único que mantiene viva esta tierra.
soulknight.forgotten.tribe$shaman.talk_1=Moveos en el frío. El que se queda quieto, se queda para siempre.
soulknight.forgotten.tribe$shaman.talk_2=Los braseros son vuestros amigos. El hielo no perdona.
soulknight.forgotten.tribe$shaman.legend_0=Escuchad la leyenda: Tharog es tan viejo como la piedra. Su corazón calienta el valle... y el hielo lo tiene atrapado.
soulknight.forgotten.tribe$shaman.legend_1=Mientras esté preso, solo asoman su cabeza y su garra. Su aliento hiela. Atacad, pero no os quedéis delante.
soulknight.forgotten.tribe$shaman.legend_2=Cuando se libere, cargará contra su presa. Si choca contra un PILAR DE HIELO, quedará aturdido y perderá una de sus PLACAS: ¡golpeadlo entonces!
soulknight.forgotten.tribe$shaman.legend_3=Cuando su corazón se enfríe, el hielo volverá desde las paredes. Quedaos junto a los BRASEROS. Si su aliento los apaga, volved a encenderlos.
soulknight.forgotten.tribe$shaman.legend_4=Y al final... el cielo arderá. Las piedras de fuego caen donde la tierra brilla en rojo. Atraedlo hacia ellas: a él también le hieren.
soulknight.forgotten.tribe$sacredfire.name=fuego sagrado
soulknight.forgotten.tribe$sacredfire.desc=El fuego sagrado de la tribu, que nunca se apaga. Enciende la llama sagrada.
soulknight.forgotten.tribe$sacredfire.lit=La llama sagrada arde de nuevo con fuerza.
soulknight.forgotten.tribe$sacredfire.burns=El fuego sagrado arde, ajeno al frío.
soulknight.forgotten.tribe$sacredfire.ask=Habla con el chamán.
soulknight.forgotten.tribe$altar.name=altar de la tribu
soulknight.forgotten.tribe$altar.desc=Un altar de piedra cubierto de pinturas antiguas. La tribu espera aquí la llama sagrada.
soulknight.forgotten.tribe$altar.desc_done=La llama sagrada arde en el altar. La tribu está con vosotros.
soulknight.forgotten.tribe$altar.done=La llama sagrada arde en el altar.
soulknight.forgotten.tribe$altar.nothing=El altar espera la llama sagrada.
soulknight.forgotten.tribe$altar.out=La llama está apagada. Un brasero encendido o el fuego sagrado la volverán a prender.
soulknight.forgotten.tribe$altar.complete=¡La llama sagrada arde en el altar! La tribu luchará a vuestro lado contra Tharog.
soulknight.forgotten.tribe$altar.reward=Los guerreros de la tribu os ofrecen un regalo. Elige uno:
soulknight.forgotten.tribe$altar.got=Recibes: %s.
soulknight.forgotten.tribe$hut.name=choza
soulknight.forgotten.tribe$hut.desc=Una choza de pieles y huesos de la tribu.
soulknight.forgotten.tribe$totem.name=tótem
soulknight.forgotten.tribe$totem.desc=Un tótem tallado con las bestias de la Tierra Olvidada.
soulknight.forgotten.tribe$warrior.name=guerrero de la tribu
soulknight.forgotten.tribe$warrior.desc=Un guerrero de la tribu con lanza de sílex y escudo de cuero.
soulknight.forgotten.tribe$warrior.cheer=¡¡UH-UH-UH!!
soulknight.forgotten.tribe$warrior.relit=Un guerrero de la tribu vuelve a encender un brasero.
soulknight.forgotten.tribe$warrior.talk=El altar espera la llama del chamán.
soulknight.forgotten.tribe$sacredflame.name=llama sagrada
soulknight.forgotten.tribe$sacredflame.desc=El fuego eterno de la tribu, en una antorcha de hueso. Llévalo al altar de la jungla. El frío y la ventisca lo debilitan; los braseros lo avivan y en las tierras templadas se recupera poco a poco.\n\nLlama: %d%%.
soulknight.forgotten.tribe$sacredflame.desc_out=Solo quedan brasas. Acércalas a un brasero encendido o al fuego sagrado del campamento y volverán a prender.
soulknight.forgotten.tribe$sacredflame.revived=El brasero aviva la llama sagrada.
soulknight.forgotten.tribe$sacredflame.weak=¡La llama sagrada se está apagando! Busca un brasero.
soulknight.forgotten.tribe$sacredflame.out=La llama sagrada se ha apagado... Las brasas volverán a prender en un brasero encendido.
soulknight.forgotten.tribe$sacredflame.relit=Las brasas prenden en el brasero: la llama sagrada vuelve a arder.
soulknight.forgotten.tribe$flintspear.name=lanza de sílex
soulknight.forgotten.tribe$flintspear.desc=Una lanza larga con punta de sílex tallado por la tribu. Llega a dos casillas y sus heridas sangran.
soulknight.forgotten.tribe$hidearmor.name=armadura de pieles
soulknight.forgotten.tribe$hidearmor.desc=Gruesas pieles de mamut cosidas por la tribu. Quien la lleva no siente el frío de la Tierra Olvidada.
soulknight.forgotten.tribe$raptoregg.name=huevo de raptor
soulknight.forgotten.tribe$raptoregg.desc=Un huevo moteado y caliente. Si lo incubas, saldrá un velocirraptor que te seguirá a todas partes.
soulknight.forgotten.tribe$raptoregg.ac_hatch=INCUBAR
soulknight.forgotten.tribe$raptoregg.no_space=No hay sitio para que salga.
soulknight.forgotten.tribe$raptoregg.hatched=¡El huevo se abre y sale un velocirraptor que te mira como a su madre!
soulknight.forgotten.tharog.name=Tharog, Corazón del Valle
soulknight.forgotten.tharog.desc=Una bestia primigenia de piedra y musgo, tan antigua como la montaña. Su corazón es el calor que mantiene viva la Tierra Olvidada.\n\nCuando choca contra un _pilar de hielo_ queda aturdido y pierde una de sus _placas_ del lomo (cada una le quita daño). Le quedan %d placas.
soulknight.forgotten.tharog.notice=¡¡GRRROOOOOOAAAAAAR!!
soulknight.forgotten.tharog.enraged=¡¡MI... CORAZÓN...!!
soulknight.forgotten.tharog.defeated=...el corazón... se apaga...
soulknight.forgotten.tharog.banner_wake=¡EL HIELO CRUJE... THAROG DESPIERTA!
soulknight.forgotten.tharog.hint_1=PISTA: está atrapado en el hielo: solo su cabeza y su garra pueden alcanzarte. Su aliento hiela en cono: ¡apártate de las casillas marcadas!
soulknight.forgotten.tharog.free=¡¡LIBRE!!
soulknight.forgotten.tharog.banner_2=¡THAROG ROMPE EL HIELO! La sala se vuelve verde a su alrededor.
soulknight.forgotten.tharog.hint_2=PISTA: cuando cargue, ponte detrás de un PILAR DE HIELO: si choca, queda aturdido, pierde una placa y recibe más daño.
soulknight.forgotten.tharog.cold=Mi corazón... se enfría... ¡que el hielo vuelva!
soulknight.forgotten.tharog.banner_3=¡GLACIACIÓN! El hielo vuelve desde las paredes. ¡Quedaos junto a los braseros!
soulknight.forgotten.tharog.hint_3=PISTA: en las casillas heladas la escarcha sube muy deprisa. Los braseros calientan; si su aliento los apaga, camina hacia ellos para encenderlos.
soulknight.forgotten.tharog.banner_tribe=¡LA TRIBU LLEGA A AYUDAR! ¡UH-UH-UH!
soulknight.forgotten.tharog.sky=¡¡QUE ARDA EL CIELO!!
soulknight.forgotten.tharog.banner_4=¡EXTINCIÓN! El cielo se vuelve rojo y caen meteoritos.
soulknight.forgotten.tharog.hint_4=PISTA: los meteoritos caen en las casillas marcadas... y también le hieren a él. ¡Atráelo hacia ellas!
soulknight.forgotten.tharog.breath=¡Tharog toma aire... aliento helado!
soulknight.forgotten.tharog.steam=¡Tharog va a soltar vapor ardiente!
soulknight.forgotten.tharog.roar=¡¡ROOOOAAAR!!
soulknight.forgotten.tharog.sweep=¡Tharog va a barrer con la cola!
soulknight.forgotten.tharog.stomp=¡Tharog pisotea el suelo!
soulknight.forgotten.tharog.charge=¡¡APARTAOS!!
soulknight.forgotten.tharog.plate=¡Se rompe una placa del lomo de Tharog! Quedan %d.
soulknight.forgotten.tharog.banner_plate=¡PLACA ROTA! Le quedan %d.
soulknight.forgotten.tharog.stunned=¡Tharog se estrella contra el pilar y queda aturdido!
soulknight.forgotten.tharog.meteor_hit=¡meteorito!
soulknight.forgotten.tharog.prey=¡Tharog ha elegido a %s como presa!
soulknight.forgotten.tharog.prey_yell=TÚ... ERES... MÍO.
soulknight.forgotten.tharog.summon=¡Las bestias del valle acuden a su llamada!
soulknight.forgotten.tharog.banner_dead=EL CORAZÓN SE APAGA... La lluvia de fuego cesa y el hielo empieza a derretirse.
soulknight.forgotten.tharog$preymark.name=Presa de Tharog
soulknight.forgotten.tharog$preymark.desc=Tharog te ha elegido. Irá a por ti y cargará contra ti. Protégete detrás de los pilares de hielo.\n\nTurnos restantes: %s.
soulknight.forgotten.tharog$icepillar.name=pilar de hielo
soulknight.forgotten.tharog$icepillar.desc=Un pilar de hielo macizo. Si Tharog choca contra él al cargar, quedará aturdido.
soulknight.forgotten.tharog$tharogheart.name=Corazón de Tharog
soulknight.forgotten.tharog$tharogheart.desc=El corazón de la bestia, una piedra que todavía guarda un brillo cálido. Si lo absorbes, su calor será tuyo para siempre (+20 de vida máxima).
soulknight.forgotten.tharog$tharogheart.ac_absorb=ABSORBER
soulknight.forgotten.tharog$tharogheart.absorbed=El calor del Corazón del Valle te llena por dentro.
soulknight.forgotten.tharoghud.phase_1=Atrapado en el hielo
soulknight.forgotten.tharoghud.phase_2=Libre
soulknight.forgotten.tharoghud.phase_3=Glaciación
soulknight.forgotten.tharoghud.phase_4=Extinción
soulknight.forgotten.tharoghud.stunned=¡ATURDIDO!
soulknight.forgotten.tharoghud.plates=Placas: %d
soulknight.kraken.kraken.banner_grab_solo=¡El tentáculo te ha atrapado! ¡Golpéalo para soltarte!
soulknight.kraken.krakenhold.overboard_solo=¡Has caído al mar!
soulknight.kraken.krakenhold.freed_solo=¡Te has liberado del tentáculo!
soulknight.kraken.krakenhold.back_solo=Vuelves a subir por la escalerilla de popa, empapado.
soulknight.kraken.harpooncannon.hit_tentacle_solo=¡Clavas un arpón en el tentáculo!
soulknight.forgotten.forgottenfloor.break_solo=¡El hielo se rompe bajo tus pies! El agua helada te corta la respiración.
soulknight.forgotten.forgottenfloor$forgottencold.frozen_solo=¡Te has quedado congelado!
soulknight.forgotten.tharog.prey_solo=¡Tharog te ha elegido como presa!

# the throne hall of the dark grand knight
soulknight.kingdom.darkgrandknight.statue_name=armadura en el trono
soulknight.kingdom.darkgrandknight.desc_statue=Una armadura enorme, sentada inmóvil en el trono negro, con su escudo y el estandarte del reino a la espalda. Parece una estatua más del salón... pero algo brilla, muy débil, tras la rendija del yelmo.
soulknight.kingdom.darkgrandknight.desc_act1=_Acto I: el guardián._ Pelea a pie: abanicos y anillos de hojas, orbes que estallan, una _estocada_ en línea y el _salto del juicio_, que cae sobre las casillas marcadas.
soulknight.kingdom.darkgrandknight.desc_act2=_Acto II: la carga._ A lomos de su caballo de guerra es más rápido y _carga_ por líneas marcadas un turno antes.
soulknight.kingdom.darkgrandknight.desc_act3=_Acto III: el estandarte._ Ha clavado el estandarte del reino: mientras siga en pie recibe un _30 % menos de daño_ y nunca se aleja más de tres casillas de él. ¡Derríbalo!
soulknight.kingdom.darkgrandknight.desc_act4=_Acto IV: la sombra._ Su escudo está roto y la sombra le sale por las grietas. Lo acompañan _caballeros de sombra_ que no se pueden herir: dale tres golpes al verdadero y se desvanecen.
soulknight.kingdom.darkgrandknight.freed=La sombra abandona la armadura entre lamentos. El caballero, libre al fin, se arrodilla ante el trono vacío.
soulknight.kingdom.darkgrandknight.title_name=GRAN CABALLERO OSCURO
soulknight.kingdom.darkgrandknight.title_sub=Campeón del Trono Caído
soulknight.kingdom.darkgrandknight.thrust=¡El gran caballero se prepara para una estocada!
soulknight.kingdom.darkgrandknight.leap=¡El gran caballero salta sobre %s!
soulknight.kingdom.darkgrandknight.leap_solo=¡El gran caballero salta hacia ti!
soulknight.kingdom.darkgrandknight.mount=¡A mí, corcel de guerra!
soulknight.kingdom.darkgrandknight.hint_2=Su caballo entra al galope en el salón. Usa las columnas: si carga contra una, se estrellará.
soulknight.kingdom.darkgrandknight.hint_3=Ha clavado el estandarte del reino: mientras siga en pie, recibe menos daño. ¡Derríbalo!
soulknight.kingdom.darkgrandknight.hint_4=Su escudo se rompe y las antorchas se apagan. La sombra sale de su armadura.
soulknight.kingdom.darkgrandknight.banner_fell=¡No! ¡El estandarte del reino...!
soulknight.kingdom.darkgrandknight.banner_down=¡El estandarte cae! El gran caballero vuelve a ser vulnerable.
soulknight.kingdom.darkgrandknight.shadow=Rey mío... perdóname... ¡La sombra es mía!
soulknight.kingdom.darkgrandknight.stunned=¡El gran caballero queda aturdido!
soulknight.kingdom.darkgrandknight.stunned_short=aturdido
soulknight.kingdom.darkgrandknight.blocked=bloqueado
soulknight.kingdom.throneprops$column.name=columna
soulknight.kingdom.throneprops$column.desc=Una columna de piedra del salón del trono. Para las balas, y si el gran caballero carga o se lanza contra ella, se estrella y queda aturdido.
soulknight.kingdom.throneprops$column.desc_cracked=Una columna agrietada: aguantará un choque más antes de venirse abajo.
soulknight.kingdom.throneprops$shieldwall.name=muro de escudos
soulknight.kingdom.throneprops$shieldwall.desc=Escudos clavados en el suelo, uno junto a otro. Paran las balas hasta que se rompen.
soulknight.kingdom.throneprops$ropecleat.name=cuerda de la lámpara
soulknight.kingdom.throneprops$ropecleat.desc=La cuerda que sostiene una lámpara de araña sobre la alfombra. Córtala cuando el gran caballero esté debajo y la lámpara caerá sobre él.
soulknight.kingdom.throneprops$ropecleat.desc_cut=La cuerda cortada cuelga de la argolla.
soulknight.kingdom.throneprops$brazier.name=brasero
soulknight.kingdom.throneprops$brazier.desc=Un brasero de hierro del salón del trono.
soulknight.kingdom.throneprops$banner.name=estandarte del reino
soulknight.kingdom.throneprops$banner.desc=El estandarte del reino, clavado en el suelo por el gran caballero. Mientras siga en pie, él recibe un 30 % menos de daño y no se aleja de él.
soulknight.kingdom.knighthud.act_1=Acto I: el guardián
soulknight.kingdom.knighthud.act_2=Acto II: la carga
soulknight.kingdom.knighthud.act_3=Acto III: el estandarte
soulknight.kingdom.knighthud.act_4=Acto IV: la sombra
soulknight.kingdom.knighthud.stunned=¡ATURDIDO!
soulknight.kingdom.knighthud.banner=Estandarte en pie: -30 % de daño
soulknight.kingdom.oathshield.name=escudo del juramento
soulknight.kingdom.oathshield.desc=El escudo del gran caballero oscuro, que dejó a su lado al arrodillarse. Todavía guarda el juramento de proteger.\n\nSe carga mientras luchas. Al _levantarlo_ mira al enemigo más cercano y durante unos turnos para parte de cada golpe y de cada bala que te llegue _de ese lado_.
soulknight.kingdom.oathshield.desc_ready=Está cargado: levántalo para parar el %1$d %% del daño de frente durante %2$d turnos.
soulknight.kingdom.oathshield.desc_charging=Se está cargando. Cuando esté listo parará el %1$d %% del daño de frente durante %2$d turnos.
soulknight.kingdom.oathshield.no_charge=El escudo todavía no está cargado.
soulknight.kingdom.oathshield.no_enemy=No ves a ningún enemigo hacia el que levantarlo.
soulknight.kingdom.oathshield.raised=¡En guardia!
soulknight.kingdom.oathshield.levelup=El escudo del juramento se vuelve más resistente.
soulknight.kingdom.oathshield.ready=El escudo del juramento está listo.
soulknight.kingdom.oathshield.ac_raise=LEVANTAR
soulknight.kingdom.oathshield$guard.name=En guardia
soulknight.kingdom.oathshield$guard.desc=Tienes el escudo del juramento levantado: paras el %1$d %% del daño que te llega de frente.\n\nTurnos restantes: %2$s.

# the clearing of the goblin high priest
soulknight.forest.goblinpriest.name=sumo sacerdote trasgo
soulknight.forest.goblinpriest.name_brute=sumo sacerdote colosal
soulknight.forest.goblinpriest.desc=El sumo sacerdote de los trasgos de la selva, con un gran tocado de plumas y un bastón coronado por una estrella. Lee el destino en el cielo y guarda el claro sagrado del Bosque.\n\nGuarda las distancias y lanza conjuros: _estrellas_ que estallan en balas, _semillas_ que dejan torretas, _orbes_ que giran a su alrededor y _meteoros_ sobre casillas marcadas. Cada pocos turnos llama a su _guardia de honor_.
soulknight.forest.goblinpriest.desc_brute=El sumo sacerdote, hinchado con el poder de los tótems del ritual que quedaron en pie. Tiene el doble de vida y ya no guarda las distancias: _embiste_ en línea recta, _golpea el suelo_ con el bastón y _agarra y lanza_ a quien tenga al lado. Todavía lanza alguna estrella, pero menos.
soulknight.forest.goblinpriest.desc_rite=El sumo sacerdote dirige un ritual junto a la gran hoguera, de espaldas a ti, mientras sus trasgos bailan y tocan los tambores. Todavía no te ha visto.
soulknight.forest.goblinpriest.desc_act1=_Acto I · El sermón._ Cuando le quede un tercio menos de vida empezará el ritual.
soulknight.forest.goblinpriest.desc_act2=_Acto II · El ritual._ Mientras quede algún tótem en pie no le hace nada ningún golpe. Al caer el último queda aturdido y _expuesto_: recibe más daño unos turnos.
soulknight.forest.goblinpriest.desc_act3=_Acto III · Lluvia de estrellas._ Los meteoros caen sin parar sobre casillas marcadas. Cuando invoca la _estrella gigante_ levita y no se mueve: hacedle bastante daño antes de que acabe la cuenta, o poneos _junto a una piedra sagrada_.
soulknight.forest.goblinpriest.notice=¡Intrusos en el claro sagrado! ¡Las estrellas os juzgarán!
soulknight.forest.goblinpriest.notice_brute=¡Los tótems me han dado su fuerza! ¡Os aplastaré con mis propias manos!
soulknight.forest.goblinpriest.title_name=SUMO SACERDOTE TRASGO
soulknight.forest.goblinpriest.title_sub=Voz de las estrellas
soulknight.forest.goblinpriest.title_brute=SUMO SACERDOTE COLOSAL
soulknight.forest.goblinpriest.title_sub_brute=Henchido con el poder de los tótems
soulknight.forest.goblinpriest.roots=¡Las raíces cierran el claro!
soulknight.forest.goblinpriest.absorb=¡El sacerdote bebe el poder de los tótems del ritual que siguen en pie (%d)!
soulknight.forest.goblinpriest.enraged=¡Basta! ¡Que caiga el cielo entero!
soulknight.forest.goblinpriest.defeated=Las estrellas... me abandonan...
soulknight.forest.goblinpriest.defeated_brute=Mi fuerza... era... prestada...
soulknight.forest.goblinpriest.freed=La gran hoguera se apaga y el claro queda en silencio.
soulknight.forest.goblinpriest.stars=¡El sumo sacerdote lanza una ola de estrellas!
soulknight.forest.goblinpriest.seeds=¡El sumo sacerdote siembra una semilla de torretas!
soulknight.forest.goblinpriest.orbs=¡Unos orbes empiezan a girar alrededor del sumo sacerdote!
soulknight.forest.goblinpriest.meteors=¡El sumo sacerdote invoca meteoros!
soulknight.forest.goblinpriest.charge=¡El sumo sacerdote va a embestir!
soulknight.forest.goblinpriest.slam=¡El sumo sacerdote alza el bastón para golpear el suelo!
soulknight.forest.goblinpriest.grab=¡El sumo sacerdote va a agarrar a %s!
soulknight.forest.goblinpriest.grab_solo=¡El sumo sacerdote va a agarrarte! ¡Apártate!
soulknight.forest.goblinpriest.crashed=¡Se estrella contra la piedra y queda aturdido!
soulknight.forest.goblinpriest.guards=El sumo sacerdote llama a su guardia de honor.
soulknight.forest.goblinpriest.ritual=¡Espíritus de la selva, protegedme!
soulknight.forest.goblinpriest.ritual_broken=¡No! ¡Mis tótems!
soulknight.forest.goblinpriest.exposed=¡El ritual se rompe! El sacerdote queda aturdido y expuesto.
soulknight.forest.goblinpriest.banner_ritual=ACTO II · EL RITUAL
soulknight.forest.goblinpriest.banner_exposed=¡RITUAL ROTO! ¡AHORA!
soulknight.forest.goblinpriest.banner_night=ACTO III · LLUVIA DE ESTRELLAS
soulknight.forest.goblinpriest.banner_star_broken=¡CONJURO ROTO!
soulknight.forest.goblinpriest.hint_2=Tres tótems lo protegen: fuego, hiedra y espíritu. Mientras el de espíritu siga en pie, los otros dos aguantan el doble.
soulknight.forest.goblinpriest.hint_3=Cae la noche. Los meteoros caen sobre las casillas marcadas.
soulknight.forest.goblinpriest.stunned_short=¡aturdido!
soulknight.forest.goblinpriest.star_call=¡Estrella de los antiguos, desciende!
soulknight.forest.goblinpriest.star_hint=¡Viene una ESTRELLA GIGANTE! Quitadle %d de vida antes de que acabe la cuenta para romper el conjuro, o poneos junto a una piedra sagrada.
soulknight.forest.goblinpriest.star_broken=¡Nooo! ¡Mi estrella!
soulknight.forest.goblinpriest.star_broken_hint=¡El conjuro se rompe y el sacerdote cae aturdido!
soulknight.forest.goblinpriest.star_fell=¡Arrodillaos ante el cielo!
soulknight.forest.goblinpriest.spirit_guard=protegido
soulknight.forest.goblinpriest.totem_name_0=tótem de fuego
soulknight.forest.goblinpriest.totem_name_1=tótem de hiedra
soulknight.forest.goblinpriest.totem_name_2=tótem de espíritu
soulknight.forest.goblinpriest.totem_desc_0=Un tótem del ritual coronado por una llama. Cada pocos turnos marca las casillas alrededor de un héroe y las llena de fuego.\n\nMientras quede algún tótem en pie, _al sacerdote no le hace nada ningún golpe_.
soulknight.forest.goblinpriest.totem_desc_1=Un tótem del ritual cubierto de hojas y raíces. Cada pocos turnos marca la casilla de un héroe: si sigue ahí, las raíces lo atrapan.\n\nMientras quede algún tótem en pie, _al sacerdote no le hace nada ningún golpe_.
soulknight.forest.goblinpriest.totem_desc_2=Un tótem del ritual con una máscara de espíritu. No ataca, pero mientras siga en pie _los otros tótems solo reciben la mitad del daño_: rómpelo primero.\n\nMientras quede algún tótem en pie, _al sacerdote no le hace nada ningún golpe_.
soulknight.forest.goblinpriest.totem_fell_0=¡Cae el tótem de fuego!
soulknight.forest.goblinpriest.totem_fell_1=¡Cae el tótem de hiedra!
soulknight.forest.goblinpriest.totem_fell_2=¡Cae el tótem de espíritu! Los demás ya no están protegidos.
soulknight.forest.ritualtotems.name=tótem del ritual
soulknight.forest.ritualtotems.desc=Un poste de madera tallado que late con una luz roja. Lleva el poder de este piso al sumo sacerdote del Bosque: si queda algún tótem del ritual en pie cuando llegues a su claro, _se lo beberá y será mucho más fuerte_.\n\nNo ataca, pero los trasgos cercanos acuden en cuanto lo golpeas.
soulknight.forest.ritualtotems.sensed=Sientes un latido bajo tus pies: hay un tótem del ritual en este piso.
soulknight.forest.ritualtotems.struck=¡El golpe al tótem resuena por la selva! Los trasgos cercanos acuden.
soulknight.forest.ritualtotems.broken=¡Tótem del ritual destruido! (%1$d/%2$d)
soulknight.forest.ritualtotems.all_broken=Has roto todos los tótems del ritual: el sumo sacerdote no tendrá su poder.
soulknight.forest.priestprops$bonfire.name=gran hoguera del ritual
soulknight.forest.priestprops$bonfire.desc=Una hoguera enorme rodeada de piedras en el centro del claro. Las llamas suben muy alto y sueltan chispas como estrellas. No se puede atravesar.
soulknight.forest.priestprops$bonfire.desc_out=Las brasas de la gran hoguera. El ritual ha terminado.
soulknight.forest.priestprops$sacredstone.name=piedra sagrada
soulknight.forest.priestprops$sacredstone.desc=Un menhir antiguo cubierto de runas. Para las balas, y cuando cae la estrella gigante quien esté _junto a una piedra sagrada_ queda a salvo.
soulknight.forest.priesthud.act_1=Acto I · El sermón
soulknight.forest.priesthud.act_2=Acto II · El ritual
soulknight.forest.priesthud.act_3=Acto III · Lluvia de estrellas
