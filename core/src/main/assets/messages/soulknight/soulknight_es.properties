#Mundos nuevos (es)

###balas
soulknight.skbulletfield.name=balas
soulknight.skbulletfield.rankings_desc=Acribillado
soulknight.skbulletfield.kill=Te han acribillado...
soulknight.skbulletfield.kill_by=Las balas de %s te han matado...

###Bosque
soulknight.skworlds.intro_forest=Bajo las primeras salas de la mazmorra no hay cloacas, sino una selva. La magia oscura que sube de las profundidades ha hecho crecer árboles entre las piedras, y en su sombra viven los trasgos: una tribu de cazadores con lanzas y armas de fuego robadas, que adoran a las estrellas y obedecen a su sumo sacerdote.

Sus balas se ven venir. Muévete, y que no te pillen quieto.
soulknight.forest.forestlevel.water_name=Charca de la selva
soulknight.forest.forestlevel.region_deco_name=Tocón
soulknight.forest.forestlevel.region_deco_desc=Lo que queda de un árbol talado por los trasgos. Arde con facilidad.
soulknight.forest.forestlevel.statue_name=Tótem
soulknight.forest.forestlevel.statue_desc=Un tótem de madera tallado por los trasgos, con caras pintadas que parecen seguirte con la mirada.
soulknight.forest.forestlevel.empty_deco_desc=Hojas secas y raíces cubren el suelo.
soulknight.forest.forestlevel.wall_deco_desc=Las enredaderas trepan por la piedra musgosa.
soulknight.forest.forestlevel.bookshelf_desc=Una estantería de madera húmeda, llena de pergaminos que los trasgos no saben leer.

soulknight.forest.boar.name=jabalí salvaje
soulknight.forest.boar.desc=Un jabalí de la selva, de colmillos largos y muy mal genio.\n\nCuando tiene a su presa en línea recta a unas casillas, _baja la cabeza un turno_ y luego _embiste_ por esa línea con fuerza. Apártate de las casillas marcadas.\n\nSuelen ir _en pareja_: cuando uno embiste, el otro también lo hace desde su lado si puede.
soulknight.forest.boar.charge=¡embiste!

soulknight.forest.goblinspearman.name=trasgo lancero
soulknight.forest.goblinspearman.desc=Un guardia trasgo de piel verde y orejas puntiagudas, armado con una lanza larga.\n\nSu lanza _alcanza a dos casillas_ si tiene el camino despejado. Desde 3 a 5 casillas _lanza la lanza_ por una línea marcada un turno antes; después pelea a puñetazos hasta recogerla. Si la coges tú antes, se queda sin ella.

soulknight.forest.goblingunner.name=trasgo pistolero
soulknight.forest.goblingunner.desc=Un guardia trasgo con una pistola tosca.\n\n_Dispara desde lejos_ si te tiene a tiro, como un arquero. A veces deja caer su pistola.\n\nLa primera vez que te ve _da la alarma_: los trasgos y jabalíes que estén a 6 casillas acuden.

soulknight.forest.goblinelite.name=trasgo de élite
soulknight.forest.goblinelite.desc=Un trasgo veterano con casco y armadura roja, armado con una escopeta corta.\n\nSus perdigones se abren: cuando dispara de lejos, _también hiere, más flojo, a quien esté al lado de su objetivo_. A veces suelta un _cono de cinco perdigones_ que se ven venir. A veces deja caer su escopeta.\n\nLleva una _chapa de metal_: lo que le da de lejos y de frente hace la mitad. Rodéalo, o pégale de cerca.

soulknight.forest.goblinshaman.name=hechicero trasgo
soulknight.forest.goblinshaman.desc=Un trasgo con máscara de calavera y tocado de plumas.\n\nLanza una _estrella mágica que estalla_ donde cae y salpica a quien esté alrededor de su objetivo.\n\nCada pocos turnos de pelea _da un escudo_ a los trasgos que tiene cerca. Acaba con él primero.

soulknight.forest.trumpetflower.name=flor trompeta
soulknight.forest.trumpetflower.desc=Una planta carnívora con forma de trompeta que nunca se mueve.\n\nCuando alguien se acerca _se hincha un turno_ y luego _suelta burbujas a su alrededor_, hasta dos casillas. Después _se cierra dos turnos_ y no le hace nada ningún golpe: pégale mientras se hincha.\n\nSi la dejas viva mucho rato, _siembra_ otra flor cerca.

soulknight.forest.goblingiant.name=trasgo gigante
soulknight.forest.goblingiant.desc=Un trasgo enorme y lento, con una máscara de calavera de carnero, que carga con un mazo de piedra. Es raro verlo.\n\nCada pocos turnos _alza el mazo_ y luego _golpea el suelo_: hiere y frena a todo lo que esté a dos casillas.\n\nSe enfurece: _cada tres golpes que recibe_ responde con un golpe al suelo más pequeño, _sin avisar_.
soulknight.forest.goblingiant.raise=¡alza el mazo!


###Armas de fuego
soulknight.guns.skgun.ac_zap=DISPARAR
soulknight.guns.skgun.fizzles=El arma está descargada: espera a que se recargue.
soulknight.guns.skgun.no_magic=No puedes usarla mientras te dure la inmunidad a la magia.
soulknight.guns.skgun.bmage_desc=Las armas de fuego no se pueden meter en el bastón de un mago de batalla.
soulknight.guns.skgun.upgrade_stat_name_1=Daño

soulknight.guns.goblinpistol.name=pistola trasga
soulknight.guns.goblinpistol.desc=Una pistola tosca con culata de madera, de las que llevan los guardias trasgos.\n\nFunciona como una varita: tiene cargas que se recuperan con el tiempo y se dispara desde la barra rápida. Sus balas son físicas: la armadura del objetivo para una parte del daño.
soulknight.guns.goblinpistol.stats_desc=Dispara una bala que hace _%1$d-%2$d de daño_ al primero que encuentra. Tiene muchas cargas.

soulknight.guns.goblinshotgun.name=escopeta trasga
soulknight.guns.goblinshotgun.desc=Una escopeta corta de dos cañones, el arma de los trasgos de élite.\n\nFunciona como una varita: tiene cargas que se recuperan con el tiempo y se dispara desde la barra rápida. Sus perdigones son físicos: la armadura del objetivo para una parte del daño.
soulknight.guns.goblinshotgun.stats_desc=Suelta una ráfaga de perdigones en un cono corto: cada enemigo dentro recibe _%1$d-%2$d de daño_.

soulknight.guns.meteorstaff.name=cayado de meteoros
soulknight.guns.meteorstaff.desc=El bastón del sumo sacerdote trasgo, coronado por una estrella que nunca se apaga.\n\nFunciona como una varita: tiene cargas que se recuperan con el tiempo y se usa desde la barra rápida. Los meteoros caen del cielo, así que pasan por encima de las criaturas, pero no atraviesan paredes.
soulknight.guns.meteorstaff.stats_desc=Hace caer _tres meteoros_ en el punto elegido y cerca de él. Cada uno estalla y hace _%1$d-%2$d de daño_ a los enemigos que estén a una casilla.

###cooperativo: AFK y recompensas para todos
coop.coophud.afk=AFK
coop.coophud.afk_on=se ausenta (AFK): su héroe descansará sin parar.
coop.coophud.afk_off=vuelve a estar aquí.
items.tengusmask.already=Ya elegiste tu especialización: esta máscara es para otro compañero.
items.kingscrown.already=Ya tienes una habilidad de armadura: esta corona es para otro compañero.

###introducciones de los mundos
soulknight.skworlds.intro_kingdom=Las celdas de la prisión han desaparecido: en su lugar se alza un castillo de piedra violácea. Lo guardan los caballeros del reino, sus limos domesticados y los magos de la corte, al servicio de un gran caballero que hace tiempo que perdió la luz.\n\nLos caballeros disparan en ráfagas y cargan en línea recta. Fíjate en las casillas marcadas.
soulknight.skworlds.intro_starship=Entre las cuevas asoma el casco de una nave que cayó del cielo hace siglos. Los varkolyns la han convertido en su nido: pasillos de metal, luces frías y tentáculos que brotan del suelo.\n\nSus láseres atraviesan todo lo que encuentran en su línea. Ponte de lado.
soulknight.skworlds.intro_undersea=La ciudad de los enanos se hundió hace mucho, y el abismo la reclamó. Ahora es una base submarina donde una tripulación infectada vigila experimentos que flotan en burbujas, a las órdenes de un submarino que no debería estar vivo.\n\nSus balas rebotan en las paredes. Ningún rincón es del todo seguro.

###Reino Caballero
soulknight.kingdom.kingdomlevel.water_name=Foso del castillo
soulknight.kingdom.kingdomlevel.region_deco_name=Barril de armas
soulknight.kingdom.kingdomlevel.region_deco_desc=Un barril lleno de lanzas y escudos viejos.
soulknight.kingdom.kingdomlevel.statue_name=Armadura
soulknight.kingdom.kingdomlevel.statue_desc=Una armadura de caballero vacía, de pie como si aún hiciera guardia.
soulknight.kingdom.kingdomlevel.empty_deco_desc=Una alfombra roja gastada cubre las losas.
soulknight.kingdom.kingdomlevel.wall_deco_desc=Un estandarte del reino cuelga de la pared.
soulknight.kingdom.kingdomlevel.bookshelf_desc=Crónicas de batallas antiguas, en una estantería polvorienta.
soulknight.kingdom.kingdommobs$soldier.name=soldado del reino
soulknight.kingdom.kingdommobs$soldier.desc=Un soldado de armadura ligera con una pistola.\n\n_Dispara desde lejos_ si te tiene a tiro. Cuando le quitas la mitad de la vida _pide refuerzos_ con un silbato: llega otro soldado.
soulknight.kingdom.kingdommobs$swordsman.name=caballero espadachín
soulknight.kingdom.kingdommobs$swordsman.desc=Un caballero con espada y armadura completa.\n\nAguanta mucho y pega fuerte de cerca. A veces _alza el escudo_: el siguiente golpe que le des desde su lado _lo para_ y te devuelve un contraataque. Espera a que lo baje o pégale de lejos.
soulknight.kingdom.kingdommobs$gunner.name=arcabucero real
soulknight.kingdom.kingdommobs$gunner.desc=Un tirador con un arma larga.\n\nDe vez en cuando se planta y suelta _una ráfaga larga_: tres andanadas de balas en tres turnos, cada una hacia donde estés en ese momento. Mientras dispara no se mueve.
soulknight.kingdom.kingdommobs$rifleman.name=tirador de élite
soulknight.kingdom.kingdommobs$rifleman.desc=Un caballero de élite con un rifle.\n\nTe sigue con una _mira láser_ durante dos turnos (las casillas marcadas se mueven contigo) y luego dispara un tiro que _atraviesa a todos_ los que estén en la última línea marcada. Si te pierde de vista, falla el tiro.
soulknight.kingdom.kingdommobs$royalslime.name=limo real
soulknight.kingdom.kingdommobs$royalslime.desc=Un limo azul con una coronita, mascota de la corte.\n\nCuando muere _revienta en un anillo de burbujas_ que salen hacia todos lados y _se parte en dos limos pequeños_.
soulknight.kingdom.kingdommobs$wizard.name=mago de la corte
soulknight.kingdom.kingdommobs$wizard.desc=Un mago de túnica azul.\n\nAlterna _anillos de orbes_ con _cuatro balas que te persiguen_ despacio. Si lo arrinconas _se teletransporta_ unas casillas más allá y deja una _ilusión_ suya donde estaba.
soulknight.kingdom.kingdommobs$darkknight.name=caballero oscuro
soulknight.kingdom.kingdommobs$darkknight.desc=Un caballero de armadura negra a lomos de un caballo negro de crines moradas, muy duro. Es raro verlo.\n\nBaja la lanza un turno y luego _carga en línea recta_. Cuando le quitas la mitad de la vida _cae del caballo_: el caballo sigue embistiendo solo y el caballero pelea a pie.
soulknight.kingdom.darkgrandknight.name=gran caballero oscuro
soulknight.kingdom.darkgrandknight.desc=El campeón que juró guardar el trono del reino. Cuando el rey cayó, la sombra llenó su armadura, y desde entonces no deja que nadie se acerque.\n\nSu _escudo_ para buena parte de los golpes que le llegan _de frente_ (donde acaba de moverse o atacar): pégale por la espalda después de una estocada, una carga o un salto, o mientras está _aturdido_. Si carga o se lanza contra una _columna_ o un _barril de pólvora_, queda aturdido. Cortar la cuerda de una _lámpara_ cuando él está debajo lo aplasta.
soulknight.kingdom.darkgrandknight.notice=¡Nadie se acerca a este trono! Lo juré... ¡y lo cumpliré!
soulknight.kingdom.darkgrandknight.enraged=¡Mi corcel...! ¡Que el estandarte del reino me sostenga!
soulknight.kingdom.darkgrandknight.defeated=Por fin... puedo... descansar...
soulknight.kingdom.darkgrandknight.fan=¡El gran caballero lanza un abanico de hojas!
soulknight.kingdom.darkgrandknight.ring=¡Un anillo de balas sale del gran caballero!
soulknight.kingdom.darkgrandknight.trail=¡Las hojas del gran caballero dejan un rastro!
soulknight.kingdom.darkgrandknight.orbs=¡Orbes enormes ruedan por la sala!
soulknight.kingdom.darkgrandknight.charge=¡El gran caballero espolea a su caballo!
soulknight.kingdom.shadowblade.name=hoja de las sombras
soulknight.kingdom.shadowblade.desc=La espada del gran caballero oscuro, con el filo morado.
soulknight.kingdom.shadowblade.blades=Uno de cada tres golpes suelta un _abanico de tres hojas de sombra_ que siguen volando y hieren a los enemigos de detrás.

###Nave espacial
soulknight.starship.starshiplevel.water_name=Refrigerante
soulknight.starship.starshiplevel.region_deco_name=Cápsula
soulknight.starship.starshiplevel.region_deco_desc=Una cápsula de carga sellada.
soulknight.starship.starshiplevel.statue_name=Cápsula de estasis
soulknight.starship.starshiplevel.statue_desc=Algo duerme dentro, flotando en un líquido turbio.
soulknight.starship.starshiplevel.empty_deco_desc=Cables sueltos y placas abolladas.
soulknight.starship.starshiplevel.wall_deco_desc=Un panel con luces que parpadean.
soulknight.starship.starshiplevel.bookshelf_desc=Bancos de memoria llenos de símbolos alienígenas.
soulknight.starship.starshipmobs$varkolyn.name=varkolyn
soulknight.starship.starshipmobs$varkolyn.desc=Un alienígena pequeño y morado con cuernos, todo boca y ojos verdes.\n\nMuerde con saña y, cuando muere, _deja un charco de veneno_ y _un huevo_: si no lo rompes en 10 turnos, sale otro varkolyn.
soulknight.starship.starshipmobs$alienlaser.name=alien láser
soulknight.starship.starshipmobs$alienlaser.desc=Un alienígena con una pistola láser.\n\n_Apunta un turno_ y luego dispara un láser que _atraviesa la línea entera_. Justo después apunta otra vez hacia donde te hayas movido y _dispara un segundo láser_.
soulknight.starship.starshipmobs$aliensword.name=alien espadachín
soulknight.starship.starshipmobs$aliensword.desc=Un alienígena con una espada de energía.\n\nResistente y muy peligroso de cerca. Va _camuflado_: no se le ve hasta que ataca o recibe un golpe, y a los pocos turnos vuelve a desaparecer.
soulknight.starship.starshipmobs$ufo.name=platillo
soulknight.starship.starshipmobs$ufo.desc=Un platillo volante pequeño y rápido.\n\nEs difícil de golpear, dispara de lejos y a veces suelta _un abanico de láseres_. Vuela sobre el agua y los abismos y _se aleja_ si te acercas.
soulknight.starship.starshipmobs$tentacle.name=tentáculo
soulknight.starship.starshipmobs$tentacle.desc=Un tentáculo morado que brota del suelo de la nave.\n\nNo anda, pero a veces _se hunde y brota cerca de ti_ (se marca la grieta un turno antes). Lanza _púas en todas direcciones_ y deja veneno al morir.
soulknight.starship.starshipmobs$battery.name=batería alienígena
soulknight.starship.starshipmobs$battery.desc=Una torreta alienígena fija.\n\nLanza un _orbe que estalla en muchas púas_ o un _láser_ marcado un turno antes. Al destruirla _revienta en un anillo de púas_.

Llena la sala de _veneno en línea_, hace brotar _tentáculos_, lanza _anillos de púas_, barre la sala con _láseres_ sobre casillas marcadas y suelta un _núcleo que gira_ escupiendo púas. Su propio veneno no le hace nada: _metido en su charco no se le puede herir_ unos turnos, y después queda _expuesto_. De los charcos salen crías.

A media vida _huye_: en unos turnos se va volviendo invisible (cuanto más cerca estéis, mejor lo veis) y, mientras huye, es _invulnerable y muy rápido_. Deja _un nido por cada héroe_ repartido por el piso. Cuando caen todos, os lleva a su guarida con todas sus crías para acabar la pelea.
soulknight.starship.voidrifle.name=fusil del vacío
soulknight.starship.voidrifle.desc=El fusil de la reina varkolyn, de metal morado y tibio al tacto.\n\nFunciona como una varita: tiene cargas que se recuperan con el tiempo y se dispara desde la barra rápida. Sus balas son físicas: la armadura del objetivo para una parte del daño.
soulknight.starship.voidrifle.stats_desc=Dispara una _ráfaga de 3 balas_ al primero que encuentra; cada una hace _%1$d-%2$d de daño_.

###Fondo marino
soulknight.undersea.undersealevel.water_name=Agua del abismo
soulknight.undersea.undersealevel.region_deco_name=Coral
soulknight.undersea.undersealevel.region_deco_desc=Un coral que ha crecido sobre los restos de la ciudad.
soulknight.undersea.undersealevel.statue_name=Estatua cubierta de coral
soulknight.undersea.undersealevel.statue_desc=Una estatua enana medio tragada por el coral.
soulknight.undersea.undersealevel.empty_deco_desc=Algas y arena mojada.
soulknight.undersea.undersealevel.wall_deco_desc=Un ojo de buey por el que se ve el abismo.
soulknight.undersea.undersealevel.bookshelf_desc=Libros hinchados por el agua; ya no se pueden leer.
soulknight.undersea.underseamobs$infectedcrew.name=tripulante infectado
soulknight.undersea.underseamobs$infectedcrew.desc=Un buzo de la tripulación con escafandra de latón: tras el ojo de buey brilla un ojo rojo y por fuera le asoman tentáculos.\n\nDispara una _hoja rápida que rebota_ una vez y deja un _rastro de burbujas_. Cuando muere, _le brota un tentáculo del kraken_ que se queda unos turnos.
soulknight.undersea.underseamobs$krakenminion.name=siervo del kraken
soulknight.undersea.underseamobs$krakenminion.desc=Un ser de túnica oscura y cabeza de pulpo, con un báculo coronado por un ojo.\n\nLanza _tres burbujas que rebotan_ en las paredes o _llama a un tentáculo del kraken_ junto a ti (sale del agua si la hay). Cuando le quitas la mitad de la vida _controla la mente_ del héroe más cercano unos turnos: en el cooperativo lo hace pelear con sus compañeros; solo, lo lleva hacia los monstruos.
soulknight.undersea.underseamobs$subject001.name=sujeto 001
soulknight.undersea.underseamobs$subject001.desc=Un experimento escapado, un pez globo rosa lleno de púas que flota dentro de una burbuja.\n\nDentro de la burbuja lanza balas alrededor; _el primer golpe solo revienta la burbuja_. Luego desaparece, _sale detrás de ti_ y saca sus púas un turno después. Si no acabas con él en 4 turnos, _se mete en otra burbuja_.
soulknight.undersea.underseamobs$subject001.pop=¡pop!
soulknight.undersea.underseamobs$subject002.name=sujeto 002
soulknight.undersea.underseamobs$subject002.desc=Un experimento enorme y lento, una medusa de caparazón azul dentro de una burbuja.\n\nCuando le quitas la mitad de la vida, la burbuja _estalla en racimos de balas_. Cada pocos turnos _electrifica el agua_ que tiene alrededor: no pelees con él metido en el agua.
soulknight.undersea.underseamobs$subject004.name=sujeto 004
soulknight.undersea.underseamobs$subject004.desc=Una langosta gigante con una pinza enorme. Es rara.\n\nGolpea muy fuerte y _escupe abanicos de balas rojas_. Su _caparazón_ para casi todo lo que le llega de frente; _por la espalda recibe el doble_. En el cooperativo, que uno la distraiga y otro la rodee.
soulknight.undersea.abyssalsubmariner.name=submarino abisal
soulknight.undersea.abyssalsubmariner.desc=Un submarino que el abismo convirtió en algo vivo, con un foco rojo que mira como un ojo y una boca llena de dientes.\n\nLanza _pulsos de sonar_ que marcan a quien tocan, _torpedos que te persiguen_, _minas_ sobre casillas marcadas (más alrededor de los marcados) y _disparos con rastro_. Enfurecido, además _suelta a su tripulación_ y _embiste_ en línea. Mientras viva la tripulación que ha soltado, _recibe la mitad de daño_.
soulknight.undersea.abyssalsubmariner.notice=*bip... bip... bip* ¡OBJETIVO DETECTADO!
soulknight.undersea.abyssalsubmariner.enraged=*BIIIIIIP* ¡ABRAN LAS COMPUERTAS!
soulknight.undersea.abyssalsubmariner.defeated=Solo... intentaba... pro-te-ger... os... Él... ya... despierta...
soulknight.undersea.abyssalsubmariner.sonar=¡El submarino lanza un pulso de sonar!
soulknight.undersea.abyssalsubmariner.torpedoes=¡Torpedos al agua!
soulknight.undersea.abyssalsubmariner.mines=¡Caen minas marinas!
soulknight.undersea.abyssalsubmariner.trail=¡El submarino dispara en todas direcciones!
soulknight.undersea.abyssalsubmariner.crew=¡Se abre la compuerta trasera!
soulknight.undersea.abyssalsubmariner.ram=¡El submarino va a embestir!
soulknight.undersea.abyssalsubmariner$sonarmark.name=marcado por el sonar
soulknight.undersea.abyssalsubmariner$sonarmark.desc=El sonar del submarino te ha marcado: sus minas caerán a tu alrededor.\n\nTurnos restantes: %s.
soulknight.undersea.abysssonar.name=sonar abisal
soulknight.undersea.abysssonar.desc=El sonar del submarino abisal, con una pantalla verde que aún parpadea.\n\nFunciona como una varita: tiene cargas que se recuperan con el tiempo y se usa desde la barra rápida.
soulknight.undersea.abysssonar.stats_desc=Lanza un pulso a un punto: hace _%1$d-%2$d de daño_ a los enemigos a 2 casillas y, durante 3 turnos, ves dónde están todos los enemigos del piso.

###arsenal
soulknight.armory.armorygun.wand_like=Funciona como una varita: tiene cargas que se recuperan con el tiempo y se dispara desde la barra rápida. Sus balas son físicas: la armadura del objetivo para una parte del daño.
soulknight.armory.armorygun.stats_single=Dispara una bala al primero que encuentra: _%1$d-%2$d de daño_.
soulknight.armory.armorygun.stats_burst=Dispara una _ráfaga de %3$d balas_ al primero que encuentra; cada una hace _%1$d-%2$d de daño_.
soulknight.armory.armorygun.stats_cone=Dispara un _abanico de perdigones_ que alcanza a todos los enemigos de un cono de %4$d casillas: _%1$d-%2$d de daño_ a cada uno.
soulknight.armory.armorygun.stats_pierce=Su disparo _atraviesa a todos los enemigos_ de la línea, hasta %4$d casillas o la primera pared: _%1$d-%2$d de daño_ a cada uno.
soulknight.armory.armorygun.stats_blast=Su proyectil _explota_ al chocar y hace _%1$d-%2$d de daño_ a los enemigos a %3$d casilla(s) o menos. No daña a los héroes.
soulknight.armory.armorygun.stats_chain=Lanza un rayo que _salta_ hasta a %3$d enemigos cercanos: _%1$d-%2$d de daño_ a cada uno.
soulknight.armory.armorygun.stats_volley=Lanza _%3$d cohetes_ repartidos entre los enemigos a la vista a %4$d casillas o menos: _%1$d-%2$d de daño_ cada uno.
soulknight.armory.armorygun.effect_burn=Además _prende fuego_ a quien alcanza.
soulknight.armory.armorygun.effect_chill=Además _congela_ y frena a quien alcanza.
soulknight.armory.armorygun.effect_poison=Además _envenena_ a quien alcanza.
soulknight.armory.armorygun.effect_stun=Cada impacto tiene _1 posibilidad entre 3_ de paralizar 1 turno.
soulknight.armory.armorygun.effect_root=Además _atrapa_ a quien alcanza 2 turnos en una burbuja (no puede moverse).
soulknight.armory.armorygun.effect_slow=Además _ralentiza_ a quien alcanza.
soulknight.armory.armoryguns$oldpistol.name=pistola vieja
soulknight.armory.armoryguns$oldpistol.desc=Una pistola gris, rayada y fiable. No pega fuerte, pero tiene muchas cargas.
soulknight.armory.armoryguns$smg.name=subfusil
soulknight.armory.armoryguns$smg.desc=Un subfusil negro y compacto.
soulknight.armory.armoryguns$bow.name=arco de caza
soulknight.armory.armoryguns$bow.desc=Un arco de madera flexible con un carcaj que nunca se vacía del todo.
soulknight.armory.armoryguns$bubblegun.name=pistola de burbujas
soulknight.armory.armoryguns$bubblegun.desc=Un juguete rosa que dispara burbujas pegajosas.
soulknight.armory.armoryguns$stunpistol.name=pistola aturdidora
soulknight.armory.armoryguns$stunpistol.desc=Una pistola amarilla y negra que dispara dardos eléctricos.
soulknight.armory.armoryguns$deserteagle.name=águila del desierto
soulknight.armory.armoryguns$deserteagle.desc=Una pistola plateada enorme. Pocas balas, pero cada una cuenta.
soulknight.armory.armoryguns$shotgun.name=escopeta
soulknight.armory.armoryguns$shotgun.desc=Una escopeta de culata de madera. De cerca no perdona.
soulknight.armory.armoryguns$crossbow.name=ballesta pesada
soulknight.armory.armoryguns$crossbow.desc=Una ballesta tan tensa que sus virotes atraviesan a varios enemigos.
soulknight.armory.armoryguns$toxicblaster.name=bláster tóxico
soulknight.armory.armoryguns$toxicblaster.desc=Un arma verde con un depósito de gas burbujeante.
soulknight.armory.armoryguns$frostgun.name=pistola de hielo
soulknight.armory.armoryguns$frostgun.desc=Una pistola azul clara cubierta de escarcha.
soulknight.armory.armoryguns$assaultrifle.name=fusil de asalto
soulknight.armory.armoryguns$assaultrifle.desc=Un fusil con el cargador curvo y la culata de madera.
soulknight.armory.armoryguns$flamethrower.name=lanzallamas
soulknight.armory.armoryguns$flamethrower.desc=Un depósito rojo y una boquilla que escupe fuego.
soulknight.armory.armoryguns$thunderstaff.name=bastón del trueno
soulknight.armory.armoryguns$thunderstaff.desc=Un bastón con la punta cargada de electricidad.
soulknight.armory.armoryguns$grenadelauncher.name=lanzagranadas
soulknight.armory.armoryguns$grenadelauncher.desc=Un cañón ancho con un tambor de granadas.
soulknight.armory.armoryguns$fireworklauncher.name=lanzador de fuegos artificiales
soulknight.armory.armoryguns$fireworklauncher.desc=Un tubo de cartón lleno de cohetes de colores.
soulknight.armory.armoryguns$sniperrifle.name=rifle de francotirador
soulknight.armory.armoryguns$sniperrifle.desc=Un rifle larguísimo con mira telescópica.
soulknight.armory.armoryguns$gatling.name=ametralladora rotativa
soulknight.armory.armoryguns$gatling.desc=Seis cañones que giran a toda velocidad.
soulknight.armory.armoryguns$bazooka.name=bazuca
soulknight.armory.armoryguns$bazooka.desc=Un tubo verde que lanza un cohete enorme. Solo una carga, pero qué carga.
soulknight.armory.armoryguns$laserrifle.name=fusil láser
soulknight.armory.armoryguns$laserrifle.desc=Un fusil blanco y azul que dispara un rayo de luz.
soulknight.armory.armoryguns$plasmacannon.name=cañón de plasma
soulknight.armory.armoryguns$plasmacannon.desc=Un cañón pesado con un núcleo morado que zumba.
soulknight.armory.skmerchant.name=mercader de armas
soulknight.armory.skmerchant.desc=Un mercader con gafas en la frente y una mochila llena de armas. Vende armas de fuego y, como cualquier tendero, compra lo que le lleves.

#campeones, cajas y barriles, emboscadas, cofres trampa y estatuas
soulknight.skchampion.name=campeón
soulknight.skchampion.desc=Un campeón de su mundo, rodeado de un aura morada. Tiene el _doble de vida_, pega más fuerte y sus ataques especiales llevan _más balas_ y llegan antes. Al caer deja _oro_ y a veces un _arma_.
soulknight.skevents.ambush=¡Las puertas se cierran! Vienen enemigos.
soulknight.skevents.ambush_done=Las puertas se abren. Ha aparecido un cofre.
soulknight.skevents.trap_chest=¡Era una trampa! Las paredes de la sala disparan.
soulknight.props.skprops$crate.name=caja de madera
soulknight.props.skprops$crate.desc=Una caja de tablas reforzadas. _Para las balas_, las de los monstruos y las tuyas, así que sirve para cubrirse. Aguanta unos golpes antes de romperse y a veces guarda algo de oro.
soulknight.props.skprops$explosivebarrel.name=barril explosivo
soulknight.props.skprops$explosivebarrel.desc=Un barril rojo con una mecha. Si recibe un golpe o una bala _explota_ y hiere a todo lo que esté a su lado, monstruos incluidos. También quema la hierba.
soulknight.props.skprops$sapbarrel.name=barril de savia
soulknight.props.skprops$sapbarrel.desc=Un barril de la selva que rebosa savia ámbar muy pegajosa. Al romperse _salpica_ y deja _pegado al suelo_ unos turnos a quien esté a su lado.
soulknight.props.skprops$icebarrel.name=barril helado
soulknight.props.skprops$icebarrel.desc=Un barril cubierto de escarcha. Al romperse suelta un frío que _congela a los monstruos_ que estén a su lado y _ralentiza a los héroes_.
soulknight.props.skprops$toxicbarrel.name=bidón tóxico
soulknight.props.skprops$toxicbarrel.desc=Un bidón de la nave con el símbolo de peligro. Al romperse suelta una _nube de gas tóxico_.
soulknight.props.skprops$inkbarrel.name=barril de tinta
soulknight.props.skprops$inkbarrel.desc=Un barril empapado de tinta de kraken. Al romperse suelta una _nube de tinta_ que no deja ver nada a través.
soulknight.props.skstatue.name=estatua del mundo
soulknight.props.skstatue.desc=Una estatua de piedra de un caballero con una gema que late. A cambio de oro _bendice a un héroe_ hasta que salga de este mundo. Cada héroe puede recibir una bendición por mundo.
soulknight.props.skstatue.offer=La gema de la estatua brilla. Por _%d de oro_ te bendecirá hasta que salgas de este mundo:\n\n- _Caballero:_ un 20 %% más de vida máxima.\n- _Sacerdotisa:_ cuando cae un monstruo a 5 casillas o menos, recuperas algo de vida.\n- _Mago:_ tus armas de fuego y varitas se recargan un 30 %% más rápido.
soulknight.props.skstatue.knight=Caballero
soulknight.props.skstatue.priestess=Sacerdotisa
soulknight.props.skstatue.wizard=Mago
soulknight.props.skstatue.leave=Ahora no
soulknight.props.skstatue.no_gold=No hay oro suficiente: hacen falta %d.
soulknight.props.skstatue.already=La estatua ya te bendijo en este mundo.
soulknight.props.skstatue.blessed_0=La estatua te bendice: te sientes más fuerte.
soulknight.props.skstatue.blessed_1=La estatua te bendice: cada monstruo que cae cerca te cura.
soulknight.props.skstatue.blessed_2=La estatua te bendice: tus armas se recargan más rápido.
soulknight.props.skstatue.blessing_0=Bendición del caballero
soulknight.props.skstatue.blessing_1=Bendición de la sacerdotisa
soulknight.props.skstatue.blessing_2=Bendición del mago
soulknight.props.skstatue.blessing_desc_0=La estatua del mundo te bendijo: tienes un 20 % más de vida máxima.\n\nDura hasta que salgas de este mundo.
soulknight.props.skstatue.blessing_desc_1=La estatua del mundo te bendijo: cuando cae un monstruo a 5 casillas o menos de ti, recuperas algo de vida.\n\nDura hasta que salgas de este mundo.
soulknight.props.skstatue.blessing_desc_2=La estatua del mundo te bendijo: tus armas de fuego y varitas se recargan un 30 % más rápido.\n\nDura hasta que salgas de este mundo.

#Bosque y Reino Caballero
soulknight.forest.goblinspearman.aim=¡apunta!
soulknight.forest.goblinspearman.unarmed=Ha lanzado su lanza: ahora pelea a puñetazos.
soulknight.forest.goblinspearman$goblinspearitem.name=lanza trasga
soulknight.forest.goblinspearman$goblinspearitem.desc=La lanza tosca de un guardia trasgo, con la punta de piedra. Se puede arrojar, aunque no pega muy fuerte. Si te la quedas, el trasgo que la lanzó tendrá que pelear con los puños.
soulknight.forest.goblingunner.alarm=¡alarma!
soulknight.forest.goblinelite.plate=¡chapa!
soulknight.forest.goblingiant.fury=¡furia!
soulknight.forest.forestfeatures$campfire.name=hoguera trasga
soulknight.forest.forestfeatures$campfire.desc=Una hoguera de troncos rodeada de piedras. Donde hay una, hay un campamento de trasgos durmiendo cerca.
soulknight.forest.forestfeatures$goblindrum.name=tambor de guerra
soulknight.forest.forestfeatures$goblindrum.desc=Un tambor de piel tensada con pinturas turquesa. Si un trasgo que pelea cerca lo toca, _todos los trasgos a 8 casillas acuden_. Rómpelo antes de que suene.
soulknight.forest.forestfeatures$goblindrum.beat=¡bum, bum!
soulknight.forest.forestfeatures$goblindrum.heard=Retumba un tambor de guerra. Los trasgos vienen.
soulknight.forest.forestfeatures$goblintotem.name=tótem trasgo
soulknight.forest.forestfeatures$goblintotem.desc=Un poste de madera tallada con la cara de un trasgo y un cristal verde. Cada pocos turnos _da un escudo a los trasgos_ que estén a 3 casillas. Rómpelo y se acabaron los escudos.
soulknight.skfloor.name=zarzas y pinchos
soulknight.skfloor.rankings_desc=Desangrado entre zarzas y pinchos
soulknight.skfloor.kill=Has muerto entre zarzas y pinchos...
soulknight.kingdom.kingdommobs$soldier.whistle=¡refuerzos!
soulknight.kingdom.kingdommobs$swordsman.guard=¡en guardia!
soulknight.kingdom.kingdommobs$swordsman.parry=¡parada!
soulknight.kingdom.kingdommobs$rifleman.aim=¡te apunta!
soulknight.kingdom.kingdommobs$smallslime.name=limo pequeño
soulknight.kingdom.kingdommobs$smallslime.desc=La mitad de un limo real, ya sin corona. Al morir suelta unas pocas burbujas. No se vuelve a partir.
soulknight.kingdom.kingdommobs$wizardillusion.name=ilusión del mago
soulknight.kingdom.kingdommobs$wizardillusion.desc=Una copia del mago de la corte, algo transparente. Lanza anillos de balas que _no hacen daño_ y se deshace con un solo golpe o a los pocos turnos.
soulknight.kingdom.kingdommobs$darkknight.dismounted=¡El caballero oscuro cae de su caballo!
soulknight.kingdom.kingdommobs$darkhorse.name=caballo oscuro
soulknight.kingdom.kingdommobs$darkhorse.desc=El caballo negro del caballero oscuro, sin jinete. Es rápido y sigue _cargando en línea recta_ después de bajar la cabeza un turno.
soulknight.kingdom.kingdommobs$darkknightfoot.name=caballero oscuro a pie
soulknight.kingdom.kingdommobs$darkknightfoot.desc=El caballero oscuro, ya sin caballo, con su espada. Sigue siendo muy duro y pega muy fuerte.
soulknight.kingdom.kingdomfeatures$bannerbearer.name=abanderado del reino
soulknight.kingdom.kingdomfeatures$bannerbearer.desc=Un soldado que lleva el estandarte rojo del reino, con su patrulla detrás. Mientras el estandarte siga en pie, los caballeros que tiene cerca _reciben un 25 % menos de daño_. Si cae, _huyen_ unos turnos.
soulknight.kingdom.kingdomfeatures$bannerbearer.fall=¡Cae el estandarte! Los caballeros huyen.
soulknight.kingdom.kingdomfeatures$rallied.name=bajo el estandarte
soulknight.kingdom.kingdomfeatures$rallied.desc=Está cerca del estandarte del reino: recibe un 25 % menos de daño.
soulknight.kingdom.kingdomfeatures$weaponrack.name=armero del castillo
soulknight.kingdom.kingdomfeatures$weaponrack.desc=Un armero de madera con espadas, una lanza y un escudo. Puedes _coger un arma_, pero _sonará la alarma_ y vendrán guardias.
soulknight.kingdom.kingdomfeatures$weaponrack.empty=El armero ya está vacío.
soulknight.kingdom.kingdomfeatures$weaponrack.alarm=¡Suena la alarma! Vienen guardias.

#Nave espacial y Fondo marino
soulknight.starship.starshipfeatures.blackout=¡Apagón! Las luces de la nave se apagan.
soulknight.starship.starshipfeatures$teleporter.name=teletransportador alienígena
soulknight.starship.starshipfeatures$teleporter.desc=Una plataforma morada con antenas y una luz verde. Mientras haya un héroe cerca _trae un alien cada 5 turnos_ (3 a la vez como mucho). Rómpelo para que pare.
soulknight.starship.starshipfeatures$varkolynnest.name=nido de varkolyns
soulknight.starship.starshipfeatures$varkolynnest.desc=Un montón de carne morada que palpita, lleno de huevos verdes. Mientras haya un héroe cerca _suelta un varkolyn cada 6 turnos_ (4 a la vez como mucho) hasta que lo destruyes.
soulknight.starship.starshipfeatures$varkolynegg.name=huevo de varkolyn
soulknight.starship.starshipfeatures$varkolynegg.desc=Un huevo translúcido con una cría dentro que se mueve. _Eclosiona en unos turnos_ si nadie lo rompe.
soulknight.starship.starshipfeatures$laserpost.name=poste láser
soulknight.starship.starshipfeatures$laserpost.desc=Uno de los dos postes de una valla láser. La valla _se enciende dos turnos y se apaga otros dos_; quemará a quien esté en ella encendida. Una _consola_ de este piso las apaga todas.
soulknight.starship.starshipfeatures$console.name=consola de la nave
soulknight.starship.starshipfeatures$console.desc=Una consola con una pantalla verde y muchos botones. Úsala para _apagar todas las vallas láser_ del piso.
soulknight.starship.starshipfeatures$console.already=Las vallas láser ya están apagadas.
soulknight.starship.starshipfeatures$console.off=Apagas todas las vallas láser del piso.
soulknight.starship.starshipfeatures$blackout.name=apagón
soulknight.starship.starshipfeatures$blackout.desc=Las luces de la nave se han apagado: solo ves a 2 casillas.\n\nTurnos restantes: %s.
soulknight.undersea.underseamobs$krakenminion.control=¡El siervo del kraken controla la mente de %s!
soulknight.undersea.underseamobs$subject001.rebubble=¡otra burbuja!
soulknight.undersea.underseamobs$subject004.shell=¡caparazón!
soulknight.undersea.underseamobs$subject004.back=¡por la espalda!
soulknight.undersea.underseafeatures$oxygen.name=oxígeno
soulknight.undersea.underseafeatures$oxygen.desc=Bajo el mar el aire se acaba poco a poco. Ponte en una _columna de burbujas_ para recuperarlo; al llegar a un piso nuevo vuelves a tenerlo lleno. Sin oxígeno pierdes vida cada turno.\n\nOxígeno: %1$d de %2$d.
soulknight.undersea.underseafeatures$oxygen.low=Te queda poco oxígeno: busca una columna de burbujas.
soulknight.undersea.underseafeatures$oxygen.out=¡Te has quedado sin oxígeno!
soulknight.undersea.underseafeatures$oxygen.drowned=Te has ahogado...
soulknight.undersea.underseafeatures$oxygen.rankings_desc=Ahogado en el fondo del mar
soulknight.undersea.underseafeatures$inkcloud.desc=Una nube de tinta de kraken: los héroes no ven a través de ella, pero los seres del mar sí.
soulknight.undersea.underseafeatures$giantclam.name=almeja gigante
soulknight.undersea.underseafeatures$giantclam.desc=Una almeja enorme que se abre de vez en cuando. Dentro guarda una _perla_: úsala mientras esté abierta para cogerla. Si estás a su lado cuando se cierra, _muerde_.
soulknight.undersea.underseafeatures$giantclam.empty=La almeja ya está vacía.
soulknight.undersea.underseafeatures$giantclam.closed=La almeja está cerrada. Espera a que se abra.
soulknight.undersea.underseafeatures$giantclam.pearl=Coges la perla de la almeja.
soulknight.undersea.underseafeatures$krakententacle.name=tentáculo del kraken
soulknight.undersea.underseafeatures$krakententacle.desc=Un tentáculo rojo y morado con ventosas que sale del suelo o del agua. No se mueve y _da latigazos_ a quien esté a su lado. Se hunde de nuevo a los pocos turnos.
soulknight.undersea.underseafeatures$mindcontrol.name=mente controlada
soulknight.undersea.underseafeatures$mindcontrol.desc=Un siervo del kraken controla tu mente: tu héroe actúa solo.\n\nTurnos restantes: %s.
soulknight.undersea.underseafeatures$mindcontrol.status=¡controlado!

#jefes
soulknight.kingdom.darkgrandknight.shadows=¡Sombras del reino, a mí!
soulknight.kingdom.darkgrandknight$shadowknight.name=caballero de sombra
soulknight.kingdom.darkgrandknight$shadowknight.desc=Un guerrero de humo negro y violeta con la forma de un caballero de la guardia. Lanza el _abanico de hojas_ de su señor y _no se le puede herir_. Dale tres golpes al gran caballero verdadero y las sombras se desvanecen.
soulknight.undersea.abyssalsubmariner.covered=¡cubierto!
soulknight.undersea.abyssalsubmariner.covered_by_crew=La tripulación protege al submarino: acaba con ella primero.

#héroes
soulknight.beastmaster.taming.button=Domar
soulknight.beastmaster.taming.info=Elige un animal (jabalí, varkolyn, rata, cangrejo, murciélago, araña, limo, sujeto 001 o sujeto 004) a %d casillas o menos que tenga _menos de un cuarto de su vida_. Se convierte en tu _mascota_: se cura hasta la mitad, te sigue, pelea a tu lado y baja de piso contigo. Solo puedes tener una; la anterior se marcha.
soulknight.beastmaster.taming.prompt=Elige el animal que quieres domar
soulknight.beastmaster.taming.no_target=Ahí no hay ningún enemigo que domar.
soulknight.beastmaster.taming.not_animal=Eso no es un animal que se pueda domar.
soulknight.beastmaster.taming.too_healthy=Todavía está demasiado fuerte: bájale la vida a menos de un cuarto.
soulknight.beastmaster.taming.too_far=Está demasiado lejos.
soulknight.beastmaster.taming.tamed=¡Has domado a %s! Ahora es tu mascota.
soulknight.beastmaster.taming$tamed.name=mascota
soulknight.beastmaster.taming$tamed.desc=El Domabestias lo ha domado: pelea a su lado y lo sigue.
soulknight.spiritist.souls.name=almas
soulknight.spiritist.souls.desc=Cada enemigo que cae cerca te da un alma.\n\nAlmas: %1$d de %2$d.\n\nCon %3$d almas, la siguiente habilidad que uses las gasta y _se recarga en la mitad de tiempo_. Con %4$d puedes enviar un _fantasma explorador_ desde el botón del kit.
soulknight.spiritist.souls.empower=Las almas refuerzan %s: se recargará en la mitad de tiempo.
soulknight.spiritist.souls.not_enough=Hacen falta %d almas.
soulknight.spiritist.souls.scouted=Tu fantasma atraviesa las paredes y te muestra lo que hay alrededor.
soulknight.spiritist.souls.scout_button=Fantasma explorador  (%1$d/%2$d almas)
soulknight.spiritist.souls.scout_info=Gasta %1$d almas: tu fantasma atraviesa las paredes y descubre el mapa a %2$d casillas a tu alrededor.\n\nLas almas las ganas cuando cae un enemigo cerca de ti. Con %3$d, la siguiente habilidad que uses se recarga en la mitad de tiempo.
soulknight.guns.skgun.ac_reload=RECARGAR
soulknight.guns.skgun.reloaded=Recargas %s a toda prisa.

#dificultad y probabilidad de los mundos
soulknight.skdifficulty.level_0=Fácil
soulknight.skdifficulty.level_1=Normal
soulknight.skdifficulty.level_2=Difícil
soulknight.skdifficulty.level_3=Muy difícil
soulknight.skdifficulty.level_4=Pesadilla
