###yogs
soulknight.continent.yog.yogeye.name=lesser eye
soulknight.continent.yog.yogeye.desc=A floating eye of yog, trailing its veins behind it. It keeps away from you and _stares a straight line to ash_: the line glows a turn before. Its touch corrupts.

soulknight.continent.yog.yoglarva.name=yog larva
soulknight.continent.yog.yoglarva.desc=A soft, blind little thing. They come _four at a time_, and if three of them stay huddled together for a few turns they _melt into a lesser eye_.
soulknight.continent.yog.yoglarva.pulse=throbbing
soulknight.continent.yog.yoglarva.fused=The larvae melt together into a lesser eye!

soulknight.continent.yog.burningfist.name=burning fist
soulknight.continent.yog.burningfist.desc=A fist of yog that never stops burning. Its blows _set you on fire_, and every few turns it hurls a _fireball_ at the marked cells. One step aside is enough to dodge it.

soulknight.continent.yog.yogtongue.name=yog tongue
soulknight.continent.yog.yogtongue.desc=A tongue waiting in a puddle of corruption. Whoever comes _within 2 cells_ gets yanked next to it and held, and the corruption rises every turn it holds on. It can't move: _cut it_ to break free. Hard to hit, easy to kill.
soulknight.continent.yog.yogtongue.grabbed=A tongue grabs you and drags you to its puddle!
soulknight.continent.yog.yogtongue$grip.name=Held by a tongue
soulknight.continent.yog.yogtongue$grip.desc=A tongue of yog holds you in place and its corruption seeps into you every turn. Kill it to break free.

###ash plains
soulknight.continent.ash.ashwalker.name=ash walker
soulknight.continent.ash.ashwalker.desc=Ash that walks. When it falls it leaves a _cloud that blinds_ whoever is next to it and a _heap of ash_ that stands up again with half its health if nobody steps on it in time.
soulknight.continent.ash.ashwalker$heap.name=heap of ash
soulknight.continent.ash.ashwalker$heap.desc=What's left of an ash walker. It's starting to move... _Step on it_ (any blow will do) before it stands up again.
soulknight.continent.ash.ashwalker$heap.stir=it stirs
soulknight.continent.ash.ashwalker$heap.reformed=The heap of ash stands up again!
soulknight.continent.ash.ashwalker$cloud.desc=A cloud of hot ash hangs here. It blinds whoever stands inside it.

soulknight.continent.ash.salamander.name=black lava salamander
soulknight.continent.ash.salamander.desc=It swims in the black lava, where _you can neither see nor hurt it_. It surfaces to _spit embers_ at the marked cells and sinks again. Out of the lava it fights like any other beast.

soulknight.continent.ash.smokevulture.name=smoke vulture
soulknight.continent.ash.smokevulture.desc=It circles overhead out of reach and _dives along a marked line_ at whoever strays furthest from the others. Its blow _snuffs out torches_. A carrion bird: it _trails the colossi_ and smells blood, so _the wounded go first_.
soulknight.continent.ash.smokevulture.dive=The smoke vulture has picked you out!
soulknight.continent.ash.smokevulture.marked=prey
soulknight.continent.ash.smokevulture.snuffed=The vulture's wings snuff out your torch!
soulknight.continent.ash.smokevulture.dark=torch out

soulknight.continent.ash.obsidiancolossus.name=obsidian colossus
soulknight.continent.ash.obsidiancolossus.desc=A slow walking hill of black glass. Its shell _cracks_ as it takes damage and loses armor each time; when it breaks, _the lava inside spills out_ and the colossus gets fast. It slams the ground around itself, marked a turn before.
soulknight.continent.ash.obsidiancolossus.crack=crack!
soulknight.continent.ash.obsidiancolossus.molten=The obsidian shell bursts and lava pours out!

###beasts of the ash plains (open world)
soulknight.continent.ash.fauna.ashcolossus.essence=A drop of sacred essence falls out of the chest of %s.

soulknight.continent.ash.fauna.scoriajackal.name=scoria jackal
soulknight.continent.ash.fauna.scoriajackal.desc=Lean dogs of ash with ribs of slag. They hunt _in packs of four to six_: the first one to see you howls and they all come. They spread out around you and, when two bite at once, _they shove you a step_, into the lava if they can. _They smell blood_ from very far.
soulknight.continent.ash.fauna.scoriajackal.shoved=shoved!

soulknight.continent.ash.fauna.emberflea.name=ember flea
soulknight.continent.ash.fauna.emberflea.desc=A parasite the size of a fingernail with a glowing belly. It lives _on the backs of the fire beasts_ (bison, the giant, the turtle, the Pyre) and _jumps on whoever comes close_. Hard to hit, dead in one blow, and its bite _sets you alight_.
soulknight.continent.ash.fauna.emberflea.leap=Ember fleas jump on you!

soulknight.continent.ash.fauna.mimicbird.name=mimic bird
soulknight.continent.ash.fauna.mimicbird.desc=It looks like a carrion bird, but it has three human eyes and lips in its throat. It keeps close to the worst beasts and, from the dark, _mimics the voices of your companions_ to lure you over. If you travel alone, it mimics other things. _Don't trust a voice you can't see._
soulknight.continent.ash.fauna.mimicbird.call_0=help, I'm over here!
soulknight.continent.ash.fauna.mimicbird.call_1=come, I found something!
soulknight.continent.ash.fauna.mimicbird.call_2=I'm hurt... over here...
soulknight.continent.ash.fauna.mimicbird.call_3=where are you? I can't see a thing
soulknight.continent.ash.fauna.mimicbird.solo_0=Someone calls your name, not far off, in the dark.
soulknight.continent.ash.fauna.mimicbird.solo_1=You hear coins jingling as they fall, over there.
soulknight.continent.ash.fauna.mimicbird.solo_2=A child cries somewhere in the ash. Then it stops.
soulknight.continent.ash.fauna.mimicbird.solo_3=You hear your own footsteps... but you're standing still.
soulknight.continent.ash.fauna.mimicbird.solo_4=A faint voice calls for help, and fades.

soulknight.continent.ash.fauna.lavasalamander.name=black lava salamander
soulknight.continent.ash.fauna.lavasalamander.desc=A salamander the size of a cart. _It swims under the lava_, where it can't be seen or hurt, and _bursts out to bite_ whoever walks the shore, without warning. Then it stays up for a moment: that's the moment to hit it.
soulknight.continent.ash.fauna.lavasalamander.ambush=ambush!

soulknight.continent.ash.fauna.smelterbeetle.name=smelter beetle
soulknight.continent.ash.fauna.smelterbeetle.desc=A beetle with a shell of slag and a molten belly. It lowers its horn, _the lane in front of it gets marked_, and it charges straight down it until it hits something, leaving _a furrow of molten slag_ that burns. If it rams into something it stands there dazed, its shell open.

soulknight.continent.ash.fauna.obsidianbrute.name=obsidian colossus
soulknight.continent.ash.fauna.obsidianbrute.desc=A hill of black glass walking on its knuckles. It is _slow and never strays far from its ground_. When it raises a fist, _the marked cells_ take a killing blow; with both fists up it smashes _all the ground around it_. Its mirror skin _throws magic back_ at whoever cast it.
soulknight.continent.ash.fauna.obsidianbrute.reflected=reflected

soulknight.continent.ash.fauna.basaltbison.name=basalt bison
soulknight.continent.ash.fauna.basaltbison.desc=Huge bison with basalt columns in their humps. They graze _in herds_ and are _peaceful_. But a noise nearby, a torch coming at them or a blow, and the herd _stampedes_: a turn of fright, the way ahead gets marked, and they flatten whatever is there, two cells a turn. Hurt one again while it's still jumpy and it fights back. Some carry _ember fleas_ in their wool.
soulknight.continent.ash.fauna.basaltbison.spooked=The bison herd takes fright!

soulknight.continent.ash.fauna.beakrex.name=beaked rex
soulknight.continent.ash.fauna.beakrex.desc=A hunter of the plains: carbon down, a bare neck and a hooked beak of bone. _It finds you by your light and your noise_ and roars when it sees you. Then it either _lowers its head and charges_ down a marked lane, or _breathes in_ (its throat glows) and spits _a cone of fire_. Both give you time to get out of the way.
soulknight.continent.ash.fauna.beakrex.roar=A roar tears through the dark!

soulknight.continent.ash.fauna.volcanoturtle.name=volcano turtle
soulknight.continent.ash.fauna.volcanoturtle.epithet=the walking mountain
soulknight.continent.ash.fauna.volcanoturtle.desc=Ancient and _peaceful_: a mountain grazing on ash, so slowly that someone built on its shell long ago. _Hurt it and the volcano wakes up_: every few turns it throws lava bombs around whoever is attacking it, each spot _marked two turns ahead_. Leave it alone and it calms down.
soulknight.continent.ash.fauna.volcanoturtle.wakes=The turtle's volcano roars and starts spitting lava!
soulknight.continent.ash.fauna.volcanoturtle.calm=The volcano turtle calms down. Its volcano goes back to smoking quietly.

soulknight.continent.ash.fauna.slaggiant.name=slag giant
soulknight.continent.ash.fauna.slaggiant.epithet=the one who sleeps under the ash
soulknight.continent.ash.fauna.slaggiant.desc=A giant of black slag that _sleeps half buried_: it looks like a mound with a spine. _Noise, a light close by, a blow or treading on it_ wake it up, and it takes two turns to get on its feet. Then _it tears basalt columns out of the ground and throws them_: where they land is marked two turns ahead. Left alone, it buries itself again.
soulknight.continent.ash.fauna.slaggiant.wakes=The mound of ash rises! It's a giant.

soulknight.continent.ash.fauna.walkingpyre.name=the Walking Pyre
soulknight.continent.ash.fauna.walkingpyre.epithet=guardian of the ash plains
soulknight.continent.ash.fauna.walkingpyre.desc=The guardian of the Ash no longer waits at the end of the plains: _it roams the surface_ on its knuckles, a hill of burning logs and slag plates with _a heart of sacred essence_ showing through a crack in its chest. _It sees a torch from very far away._ Its fist comes down on _a 5x5 patch_ marked three turns ahead, and whoever stays in it dies; whoever hugs its body gets stamped on.

soulknight.continent.ash.fauna.ashwhale.name=ash whale
soulknight.continent.ash.fauna.ashwhale.epithet=she who swims under the ash
soulknight.continent.ash.fauna.ashwhale.desc=It swims _under the deep ash_: all you see is a fin, a wake of smoke and a furrow. _It feels whoever walks on the ash_ (the road and the rock are safe) and comes. When it's under you, the ground _cracks for three turns_ over a 5x5 patch, then it comes up with its four jaws open and _swallows whatever is there_. It stays up for a few turns, the only time it can be hurt, and sinks again.
soulknight.continent.ash.fauna.ashwhale.cracks=The ground cracks and heaves under your feet!
soulknight.continent.ash.fauna.ashwhale.spat=The whale spits you out, half digested.

soulknight.continent.ash.fauna.slagtrail.desc=A furrow of molten slag. It burns whoever steps in it, but cools down in a few turns.
soulknight.continent.ash.fauna.ashcolossus.weak_hit=weak spot!
soulknight.continent.ash.fauna.ashcolossus.down=%s goes down! Its weak spot is laid bare.
soulknight.continent.ash.fauna.ashcolossus.rise=%s gets back up.
soulknight.continent.ash.fauna.ashcolossus.untamable=That beast won't be tamed.
soulknight.continent.ash.fauna.ashcolossus.tamed=%s accepts the collar of light. It belongs to the party now.
soulknight.continent.ash.fauna.ashcolossus.ride_small=%1$s is too small to get up on: only the ones of %2$dx%2$d or more can be climbed.
soulknight.continent.ash.fauna.ashcolossus.ride_full=There's no room left on the back of %s.
soulknight.continent.ash.fauna.ashtarantula.name=ash tarantula
soulknight.continent.ash.fauna.ashtarantula.desc=A spider the size of a house: black chitin, hairs tipped with embers and an egg sac glowing under its abdomen (_its weak spot_). It waits in the low ground and _throws sheets of hardened ash_ that pin you down, or rears up and _leaps on_ whoever is close. Both are marked first. It can be tamed by _paying it one essence_.
soulknight.continent.ash.fauna.ashtarantula.epithet=the one that weaves the ash
soulknight.continent.ash.fauna.ashtarantula.price=It asks for a drop of sacred essence, and the party has none.
soulknight.continent.ash.fauna.beakrex.standing=It has to be knocked down to let the collar on.
soulknight.continent.ash.fauna.basaltbison.fleas=The fleas drive it mad: free it of them first.
soulknight.continent.ash.fauna.basaltbison.wild=It's too scared.
soulknight.continent.ash.fauna.volcanoturtle.angry=It's too angry.
soulknight.continent.ash.fauna.volcanoturtle.hungry=It's hungry: you need 2 roasts of colossus for it.
