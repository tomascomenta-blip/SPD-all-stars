#Automaton (en)

###class
actors.hero.heroclass.automaton=automaton
actors.hero.heroclass.automaton_desc_short=The _Automaton_ is a heavily armored war machine: he shocks the enemies around him, launches combat drones and his electromagnetic pulse destroys enemy bullets.
actors.hero.heroclass.automaton_desc=A war machine that woke up in the starship that fell among the caves; nobody remembers who built it, but it still follows its orders. The Automaton starts with a _control core_, which grants him _Electric Overload_, _Drone Swarm_, _EMP_ and the _Omega Protocol_ (from level 6).\n\nHis passive, the _armored chassis_: he gains extra armor that grows with his level, and the bullets of the monsters of the alternate worlds only deal _half damage_ to him.\n\nHe also starts with a _wrench_, a _satellite cannon_ (a gun used like a wand), cloth armor, a waterskin and a velvet pouch.\n\nHe automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Recharging\n\nIt is a machine: _it never gets hungry_.
actors.hero.heroclass.automaton_unlock=The champions are unlocked from the start.

###subclasses
actors.hero.herosubclass.swarm_engineer=swarm engineer
actors.hero.herosubclass.swarm_engineer_short_desc=The _Swarm Engineer_ launches one more drone, and his drones are tougher and hit harder.
actors.hero.herosubclass.swarm_engineer_desc=Drone Swarm launches _3 drones_ instead of 2. His talents make the drones last longer, armor them and increase their damage.
actors.hero.herosubclass.tesla_coil=tesla coil
actors.hero.herosubclass.tesla_coil_short_desc=The _Tesla Coil_ shocks many more enemies at once.
actors.hero.herosubclass.tesla_coil_desc=Electric Overload hits _4 enemies_ instead of 2, and the Omega Protocol deals _2 more damage_. His talents chain more bolts, stun, and cut cooldowns on kills.

###Automaton talents
actors.hero.talent.aut_coolant.title=coolant
actors.hero.talent.aut_coolant.desc=_+1:_ Eating gives the satellite cannon _1 charge_ (it can go over its maximum).\n\n_+2:_ It gives _2 charges_.
actors.hero.talent.aut_diagnostics.title=diagnostics
actors.hero.talent.aut_diagnostics.desc=_+1:_ The Automaton identifies armor, wands and guns _1.75x faster_.\n\n_+2:_ He identifies them _2.5x faster_.
actors.hero.talent.aut_plating.title=reinforced plating
actors.hero.talent.aut_plating.desc=_+1:_ The armored chassis gives up to _1 more armor_.\n\n_+2:_ Up to _2 more_.
actors.hero.talent.aut_capacitor.title=capacitor
actors.hero.talent.aut_capacitor.desc=_+1:_ Electric Overload lasts _1 more turn_.\n\n_+2:_ It lasts _2 more turns_.
actors.hero.talent.aut_self_repair.title=self-repair
actors.hero.talent.aut_self_repair.desc=_+1:_ Each ability of the control core heals him _2 HP_.\n\n_+2:_ It heals _3 HP_.
actors.hero.talent.aut_scanner.title=scanner
actors.hero.talent.aut_scanner.desc=_+1:_ He senses enemies _2 cells_ away or closer, even through walls.\n\n_+2:_ _3 cells_ away or closer.
actors.hero.talent.aut_overclock.title=overclock
actors.hero.talent.aut_overclock.desc=_+1:_ The cooldowns of the control core are _10% shorter_.\n\n_+2:_ _20% shorter_.
actors.hero.talent.aut_grounding.title=grounding
actors.hero.talent.aut_grounding.desc=_+1:_ The EMP reaches _1 cell further_.\n\n_+2:_ It also stuns _1 more turn_.
actors.hero.talent.aut_salvage.title=salvage
actors.hero.talent.aut_salvage.desc=_+1:_ When a drone breaks or leaves, the satellite cannon gains _half a charge_.\n\n_+2:_ It gains _1 charge_.
actors.hero.talent.aut_high_voltage.title=high voltage
actors.hero.talent.aut_high_voltage.desc=_+1:_ The bolts of Electric Overload deal _1 more damage_.\n\n_+2:_ _2 more_.\n\n_+3:_ _3 more_.
actors.hero.talent.aut_failsafe.title=failsafe
actors.hero.talent.aut_failsafe.desc=_+1:_ When his health falls below _30%_, he releases a free EMP. At most once every _150 turns_.\n\n_+2:_ Once every _100 turns_.\n\n_+3:_ Once every _50 turns_.
actors.hero.talent.se_hive.title=hive
actors.hero.talent.se_hive.desc=_+1:_ Drones last _5 more turns_.\n\n_+2:_ _10 more_.\n\n_+3:_ _15 more_.
actors.hero.talent.se_armored_drones.title=armored drones
actors.hero.talent.se_armored_drones.desc=_+1:_ Drones have _20% more health_.\n\n_+2:_ _40% more_.\n\n_+3:_ _60% more_.
actors.hero.talent.se_focus_fire.title=focus fire
actors.hero.talent.se_focus_fire.desc=_+1:_ Drones deal _15% more damage_.\n\n_+2:_ _30% more_.\n\n_+3:_ _45% more_.
actors.hero.talent.tc_arc.title=voltaic arc
actors.hero.talent.tc_arc.desc=_+1:_ Electric Overload hits _1 more enemy_.\n\n_+2:_ _2 more_.\n\n_+3:_ _3 more_.
actors.hero.talent.tc_shock.title=stunning shock
actors.hero.talent.tc_shock.desc=_+1:_ Each bolt of the Overload has a _10%_ chance to stun for 1 turn.\n\n_+2:_ _20%_.\n\n_+3:_ _30%_.
actors.hero.talent.tc_feedback.title=feedback
actors.hero.talent.tc_feedback.desc=_+1:_ Each enemy killed by the Overload cuts the other cooldowns of the core by _1 turn_.\n\n_+2:_ _2 turns_.\n\n_+3:_ _3 turns_.

###Sentry Turret talents
actors.hero.talent.st_long_service.title=long service
actors.hero.talent.st_long_service.desc=_+1:_ The turret lasts _5 more turns_.\n\n_+2:_ _10 more_.\n\n_+3:_ _15 more_.\n\n_+4:_ _20 more_.
actors.hero.talent.st_heavy_caliber.title=heavy caliber
actors.hero.talent.st_heavy_caliber.desc=_+1:_ The turret deals _20% more damage_.\n\n_+2:_ _40% more_.\n\n_+3:_ _60% more_.\n\n_+4:_ _80% more_.
actors.hero.talent.st_twin_barrels.title=twin barrels
actors.hero.talent.st_twin_barrels.desc=_+1:_ Each shot of the turret has a _25%_ chance to be doubled.\n\n_+2:_ _50%_.\n\n_+3:_ _75%_.\n\n_+4:_ Always.

###items
soulknight.automaton.automatonkit.name=control core
soulknight.automaton.automatonkit.desc=A blue control core that never stops humming. While you carry it you can use the Automaton's systems.
soulknight.automaton.wrench.name=wrench
soulknight.automaton.wrench.desc=A huge, heavy wrench. Good for tightening bolts and, above all, for loosening skulls.
soulknight.automaton.satellitecannon.name=satellite cannon
soulknight.automaton.satellitecannon.desc=A small laser cannon that floats next to the Automaton.\n\nIt works like a wand: its charges come back over time and it is fired from the quickslot. Its laser is physical: the target's armor stops part of the damage.
soulknight.automaton.satellitecannon.stats_desc=Fires a thin laser that goes through every enemy in a line, up to 6 cells or the first wall, dealing _%1$d-%2$d damage_ to each.
soulknight.automaton.automatonarmor.name=automaton's armor
soulknight.automaton.automatonarmor.desc=While wearing this armor, the Automaton can perform a special ability.

###abilities
soulknight.automaton.overload.name=electric overload
soulknight.automaton.overload.desc=For _%1$d turns_, every turn a bolt hits the _%2$d closest enemies_ within _%3$d cells_: _%4$d damage_ that armor doesn't stop. Each enemy it kills makes it last 1 more turn (up to %5$d).
soulknight.automaton.overload.desc_short=shocks the enemies around for some turns.
soulknight.automaton.overload$charge.name=electric overload
soulknight.automaton.overload$charge.desc=The Automaton is overloaded: every turn he shocks the enemies around him.\n\nTurns left: %d.
soulknight.automaton.droneswarm.name=drone swarm
soulknight.automaton.droneswarm.desc=Launches _%1$d combat drones_ that follow him for _%2$d turns_ and shoot the enemies within _%3$d cells_ (_%4$d-%5$d damage_). Using it again sends the old drones away and brings new ones.
soulknight.automaton.droneswarm.desc_short=launches combat drones that shoot the enemies.
soulknight.automaton.droneswarm.no_space=There is no room for the drones.
soulknight.automaton.drone.name=combat drone
soulknight.automaton.drone.desc=A small drone of the Automaton. It follows him and shoots the enemies within %1$d cells (%2$d-%3$d damage).
soulknight.automaton.drone.desc_time=Turns left: %d.
soulknight.automaton.drone.fades=The drone flies back to base.
soulknight.automaton.emp.name=EMP
soulknight.automaton.emp.desc=An electromagnetic pulse around the Automaton, _%1$d cells_ wide: _%2$d damage_ and _%3$d turns_ of stun to the enemies (bosses, 1 turn). It also _destroys the enemy bullets and turrets_ in the area.
soulknight.automaton.emp.desc_short=a pulse around him that hurts, stuns and destroys enemy bullets.
soulknight.automaton.omegaprotocol.name=omega protocol
soulknight.automaton.omegaprotocol.desc=The Automaton overloads his core: a bolt strikes _every enemy in sight_ within %1$d cells (_%2$d damage_ and 1 turn of stun), and the spare current wraps him in a _%3$d-point shield_.
soulknight.automaton.omegaprotocol.desc_short=a bolt on every enemy in sight and a shield for him.
soulknight.automaton.omegaprotocol.no_target=There are no enemies in sight.
soulknight.automaton.automatonhooks.failsafe=Failsafe!
soulknight.automaton.automatonhooks$failsafecooldown.name=failsafe
soulknight.automaton.automatonhooks$failsafecooldown.desc=The failsafe system is recharging.\n\nTurns left: %s.

###armor ability
soulknight.automaton.sentryturret.name=sentry turret
soulknight.automaton.sentryturret.short_desc=Builds a fixed turret that shoots the enemies for some turns.
soulknight.automaton.sentryturret.desc=The Automaton builds a sentry turret on a free cell within %d cells. The turret doesn't move and stays on that floor.
soulknight.automaton.sentryturret.desc_numbers=It lasts _%1$d turns_ and shoots the enemies within 5 cells (_%2$d-%3$d damage_).
soulknight.automaton.sentryturret.prompt=Choose where to build the turret
soulknight.automaton.sentryturret.no_space=The turret doesn't fit there.
soulknight.automaton.sentryturret$gun.name=sentry turret
soulknight.automaton.sentryturret$gun.desc=A turret of the Automaton. It doesn't move and shoots the enemies within %1$d cells (%2$d-%3$d damage).\n\nTurns left: %4$d.
soulknight.automaton.sentryturret$gun.fades=The turret shuts down.
