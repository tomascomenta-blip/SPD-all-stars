soulknight.continent.flesh.fauna.fleshfauna.name=flesh
soulknight.continent.flesh.fauna.forestheart.name=corazón del bosque
soulknight.continent.flesh.fauna.forestheart.epithet=guardián del bosque de carne
soulknight.continent.flesh.fauna.forestheart.desc=Un corazón del tamaño de una colina que creció hasta ser árbol: ventrículos mojados bajo placas de corteza, arterias que se ramifican hacia arriba como una copa y ocho raíces retorcidas sobre las que anda. _Late_: cada latido hace temblar el suelo _cuatro casillas alrededor de su cuerpo_, marcado tres turnos antes. De su copa _caen esporas_ sobre quien oye, y _sus raíces revientan el suelo_ en una línea marcada hacia los que se quedan lejos. El nudo de venas de la base de la aorta late más fuerte que el resto: _es su punto débil_.
soulknight.continent.flesh.fauna.forestheart.beat=El suelo bajo tus pies late como un corazón.
soulknight.continent.flesh.fauna.infectedgiraffe.name=jirafa infectada
soulknight.continent.flesh.fauna.infectedgiraffe.epithet=la que guarda la copa
soulknight.continent.flesh.fauna.infectedgiraffe.desc=De lejos aún es una jirafa. De cerca, las manchas son llagas abiertas, le asoman las costillas por el flanco y a media altura _el cuello se abre en una flor de carne con dientes_. Guarda un trozo del bosque: a quien entra _lo persigue donde se esconda, hasta que sale de él_. Su cuello cae _como un látigo_ sobre una franja larga marcada, y de vez en cuando florece y las esporas caen a su alrededor. La flor del lomo es _su punto débil_.
soulknight.continent.flesh.fauna.infectedgiraffe.zone=Has entrado en el terreno de la jirafa. Ya viene.
soulknight.continent.flesh.fauna.rootelk.name=alce de raíces
soulknight.continent.flesh.fauna.rootelk.epithet=los ojos del bosque
soulknight.continent.flesh.fauna.rootelk.desc=Un alce echado a perder: pelo a calvas, carne viva y raíces por el lomo. Sus astas también son raíces, y lo que cuelga de ellas como fruta _son ojos_, cerrados mientras pasta. Cuando te ve _grita, se le abren todos los ojos y todo el bosque de alrededor sabe dónde estás_. Luego baja las astas y _carga por un carril marcado_, o cornea lo que tiene delante. Se puede _domar si nunca te vio llegar_: acércate a oscuras mientras pasta.
soulknight.continent.flesh.fauna.rootelk.scream=¡El alce grita y se le abren todos los ojos de las astas! El bosque sabe dónde estás.
soulknight.continent.flesh.fauna.rootelk.seen=Te ha visto: no te deja acercarte.
soulknight.continent.flesh.fauna.rootelk.light=Tu luz le abre los ojos. Apágala antes.
soulknight.continent.flesh.fauna.fleshchimera.name=quimera de carne
soulknight.continent.flesh.fauna.fleshchimera.desc=Varios animales cosidos con hilo negro: músculo al aire entre retales de piel que no casan, y cada pata de un animal distinto (la corta la hace _cojear_). La cabeza de perro _muerde lo que tiene delante_ y las tres cabezas _rugen a la vez_ a su alrededor, las dos cosas marcadas antes. La serpiente que tiene por cola _muerde a quien se pone detrás_ sin avisar. El retal amoratado del lomo es donde cedieron los puntos.
soulknight.continent.flesh.fauna.fleshchimera.tail=¡Muerde la cola!
soulknight.continent.flesh.fauna.hiveboar.name=jabalí-colmena
soulknight.continent.flesh.fauna.hiveboar.desc=Un jabalí de colmillos de hueso que lleva _una colmena de carne_ en el lomo. _Carga por un carril marcado_, y cuando se sacude _sale el enjambre_ y cae sobre todos los que hay cerca, cada sitio marcado antes. Las picaduras envenenan. _La colmena es su punto débil._
soulknight.continent.flesh.fauna.hollowbear.name=oso hueco
soulknight.continent.flesh.fauna.hollowbear.desc=Un oso gris de cuencas vacías y _nada por dentro_: el pecho es un hueco negro cruzado de costillas, con ojos que miran desde la oscuridad. _Da zarpazos a lo que tiene delante_ (marcados), y cuando se abre, _lo que vive ahí dentro sale arrastrándose_. El hueco es su punto débil, si te atreves.
soulknight.continent.flesh.fauna.hollowbear.open=¡El pecho del oso se abre y algo sale de dentro!
soulknight.continent.flesh.fauna.stiltstag.name=ciervo de patas largas
soulknight.continent.flesh.fauna.stiltstag.desc=Un ciervo famélico sobre patas de zancos, con el cráneo pelado y astas de hueso. _Solo se mueve si nadie lo mira_: mientras lo tienes a la vista se queda a medio paso con la cara girada hacia ti. Aparta la vista, o deja que se lo trague la oscuridad, y estará en otro sitio, más cerca. Su coz llega sin aviso, pero nunca remata a nadie.
soulknight.continent.flesh.fauna.pustuletoad.name=sapo de pústulas
soulknight.continent.flesh.fauna.pustuletoad.desc=Un sapo achaparrado, verde bilis, cubierto de pústulas amarillas. Se hincha y _escupe un salivazo de esporas_ donde estás (marcado), y si te acercas _revienta sus pústulas_ a su alrededor. Las esporas envenenan y marean.
soulknight.continent.flesh.fauna.boneraptor.name=raptor de hueso
soulknight.continent.flesh.fauna.boneraptor.desc=Músculo rojo bajo placas de hueso, un cráneo lleno de dientes y una garra en hoz. _Cazan de tres en tres_: el que te ve llama a los demás, y desde unas casillas _saltan sobre ti_. Dónde van a caer queda marcado.
soulknight.continent.flesh.fauna.watcherfawn.name=ciervillo vigía
soulknight.continent.flesh.fauna.watcherfawn.desc=Cervatillos pálidos con media docena de ojos por el cuello y el costado, entornados mientras pastan. Van en rebaño, y _cuando uno te ve, todo el rebaño se gira a la vez a mirarte_: todo lo grande del bosque lo oye. Luego huyen. Acorralados, cocean.
soulknight.continent.flesh.fauna.watcherfawn.stare=Todo el rebaño se gira a mirarte, con todos los ojos abiertos.
soulknight.continent.flesh.fauna.barklouse.name=piojo de corteza
soulknight.continent.flesh.fauna.barklouse.desc=Un bicho plano de placas de corteza, seis patas y mandíbulas de hueso que vive en los árboles de carne. _Salta desde unas casillas_ sobre quien pasa y _se le pega_: el mordisco es pequeño, pero te frena.
soulknight.continent.flesh.fauna.barklouse.stuck=pegado
soulknight.continent.flesh.fauna.flayedfox.name=zorro desollado
soulknight.continent.flesh.fauna.flayedfox.desc=Un zorro sin piel, todo músculo rojo y tendones blancos. _Cazan en jauría_: el primero que te ve aúlla y vienen los demás, cerrándote por todos los lados. Sus mordiscos _abren heridas_, y siguen la sangre desde muy lejos.
soulknight.continent.flesh.fauna.pustulemoth.name=polilla de pústula
soulknight.continent.flesh.fauna.pustulemoth.desc=Una polilla de alas amarillentas salpicadas de pústulas que brillan. Revolotea sobre quien encuentra y sacude las alas: _las esporas caen en un trozo pequeño marcado_ y envenenan.
