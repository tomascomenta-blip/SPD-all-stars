#Espiritista (es)
###clase
actors.hero.heroclass.spiritist=espiritista
actors.hero.heroclass.spiritist_desc_short=El _Espiritista_ pelea rodeado de muertos: marca a sus enemigos con pesadillas, hace caer piedras de mal agüero que dejan peste y levanta a los caídos para que luchen por él.
actors.hero.heroclass.spiritist_desc=Antiguo mago de la corte del castillo violáceo, cambió la luz por los muertos, y ahora los muertos le obedecen. El Espiritista empieza con una _linterna de calavera_, que le da _Pesadilla_, _Piedra del augurio_ (nivel 2), _Levantar a los caídos_ (nivel 4) y la _Danza macabra_ (nivel 6).\n\nSu pasiva, la _cosecha de almas_: cada enemigo que muere a 4 casillas o menos de él lo cura un poco.\n\nTambién empieza con un _cayado_, un _báculo de la peste_ (un arma que se usa como una varita y envenena), armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de curación\n_-_ Pergaminos de recarga\n\nGana _almas_ cuando caen enemigos cerca: con 5, su siguiente habilidad se recarga en la mitad de tiempo; con 3 envía un _fantasma explorador_ que descubre el mapa.
actors.hero.heroclass.spiritist_unlock=Los campeones están desbloqueados desde el principio.
###subclases
actors.hero.herosubclass.spectre_lord=señor de los espectros
actors.hero.herosubclass.spectre_lord_short_desc=El _Señor de los espectros_ llama al doble de fantasmas, y sus fantasmas aguantan y duran más.
actors.hero.herosubclass.spectre_lord_desc=La Pesadilla invoca _2 fantasmas_ en vez de 1, al marcar y cuando muere el marcado. Sus fantasmas tienen un _25% más de vida_ y duran _5 turnos más_. Sus talentos hacen que los fantasmas asusten, duren aún más y aguanten más golpes.
actors.hero.herosubclass.plague_herald=heraldo de la peste
actors.hero.herosubclass.plague_herald_short_desc=El _Heraldo de la peste_ deja una peste más grande, y lo que muere en ella se levanta como esqueleto.
actors.hero.herosubclass.plague_herald_desc=La peste de la Piedra del augurio cubre _2 casillas_ alrededor en vez de 1. Cada enemigo que muere dentro de la peste _se levanta como esqueleto_ aliado durante 10 turnos. Sus talentos hacen la peste más venenosa y duradera, y los esqueletos más fuertes.
###talentos del Espiritista
actors.hero.talent.sp_soul_feast.title=festín de almas
actors.hero.talent.sp_soul_feast.desc=_+1:_ Al comer, el báculo de la peste recupera _1 carga_ (puede pasar de su máximo).\n\n_+2:_ Recupera _2 cargas_.
actors.hero.talent.sp_death_sense.title=sentido de la muerte
actors.hero.talent.sp_death_sense.desc=_+1:_ El Espiritista identifica anillos y varitas _1,75 veces más rápido_.\n\n_+2:_ Los identifica _2,5 veces más rápido_.
actors.hero.talent.sp_grave_chill.title=frío de la tumba
actors.hero.talent.sp_grave_chill.desc=_+1:_ El veneno del báculo de la peste dura _2 turnos más_.\n\n_+2:_ Dura _4 turnos más_.
actors.hero.talent.sp_soul_harvest.title=cosecha abundante
actors.hero.talent.sp_soul_harvest.desc=_+1:_ La cosecha de almas cura _1 PS más_.\n\n_+2:_ Cura _2 PS más_.
actors.hero.talent.sp_lingering_dread.title=terror persistente
actors.hero.talent.sp_lingering_dread.desc=_+1:_ La marca de la Pesadilla dura _5 turnos más_.\n\n_+2:_ Dura _10 turnos más_.
actors.hero.talent.sp_ghostly_grasp.title=garra fantasmal
actors.hero.talent.sp_ghostly_grasp.desc=_+1:_ Los fantasmas hacen un _20% más de daño_.\n\n_+2:_ Un _40% más_.
actors.hero.talent.sp_omen_weight.title=peso del augurio
actors.hero.talent.sp_omen_weight.desc=_+1:_ La Piedra del augurio hace _2 de daño más_.\n\n_+2:_ _4 más_.
actors.hero.talent.sp_restless_dead.title=muertos inquietos
actors.hero.talent.sp_restless_dead.desc=_+1:_ Los enemigos levantados luchan _10 turnos más_.\n\n_+2:_ _20 turnos más_.
actors.hero.talent.sp_dark_pact.title=pacto oscuro
actors.hero.talent.sp_dark_pact.desc=_+1:_ Cuando cae uno de sus fantasmas, esqueletos o enemigos levantados, el Espiritista se cura _2 PS_.\n\n_+2:_ Se cura _4 PS_.
actors.hero.talent.sp_bone_legion.title=legión de huesos
actors.hero.talent.sp_bone_legion.desc=_+1:_ Los esqueletos de la Danza macabra tienen un _10% más_ de vida y daño, y duran _5 turnos más_.\n\n_+2:_ Un _20% más_ y _10 turnos más_.\n\n_+3:_ Un _30% más_ y _15 turnos más_.
actors.hero.talent.sp_dread_howl.title=aullido del terror
actors.hero.talent.sp_dread_howl.desc=_+1:_ El terror de la Danza macabra dura _1 turno más_.\n\n_+2:_ _2 turnos más_.\n\n_+3:_ _3 turnos más_.
actors.hero.talent.sl_wailing.title=lamento
actors.hero.talent.sl_wailing.desc=_+1:_ Cada golpe de un fantasma tiene un _10%_ de aterrorizar 2 turnos.\n\n_+2:_ Un _20%_.\n\n_+3:_ Un _30%_.
actors.hero.talent.sl_ethereal.title=etéreo
actors.hero.talent.sl_ethereal.desc=_+1:_ Los fantasmas duran _5 turnos más_.\n\n_+2:_ _10 más_.\n\n_+3:_ _15 más_.
actors.hero.talent.sl_spectral_hide.title=piel espectral
actors.hero.talent.sl_spectral_hide.desc=_+1:_ Los fantasmas tienen un _20% más de vida_.\n\n_+2:_ Un _40% más_.\n\n_+3:_ Un _60% más_.
actors.hero.talent.ph_virulence.title=virulencia
actors.hero.talent.ph_virulence.desc=_+1:_ El veneno de la peste es _2 puntos_ más fuerte.\n\n_+2:_ _4 puntos_ más.\n\n_+3:_ _6 puntos_ más.
actors.hero.talent.ph_spread.title=contagio
actors.hero.talent.ph_spread.desc=_+1:_ La peste dura _3 turnos más_.\n\n_+2:_ _6 más_.\n\n_+3:_ _9 más_.
actors.hero.talent.ph_bone_harvest.title=cosecha de huesos
actors.hero.talent.ph_bone_harvest.desc=_+1:_ Los esqueletos que salen de la peste tienen un _20% más_ de vida y daño.\n\n_+2:_ Un _40% más_.\n\n_+3:_ Un _60% más_.
###talentos del Velo de almas
actors.hero.talent.sv_long_veil.title=velo largo
actors.hero.talent.sv_long_veil.desc=_+1:_ La invisibilidad del Velo de almas dura _2 turnos más_.\n\n_+2:_ _4 más_.\n\n_+3:_ _6 más_.\n\n_+4:_ _8 más_.
actors.hero.talent.sv_phantoms.title=fantasmas
actors.hero.talent.sv_phantoms.desc=_+1:_ El Velo de almas llama a _1 fantasma más_.\n\n_+2:_ _1 más_.\n\n_+3:_ _2 más_.\n\n_+4:_ _2 más_.
actors.hero.talent.sv_soul_mend.title=almas reparadoras
actors.hero.talent.sv_soul_mend.desc=_+1:_ El Velo de almas cura un _5%_ de la vida máxima.\n\n_+2:_ Un _10%_.\n\n_+3:_ Un _15%_.\n\n_+4:_ Un _20%_.
###objetos
soulknight.spiritist.spiritistkit.name=linterna de calavera
soulknight.spiritist.spiritistkit.desc=Una calavera hueca con una llama verde dentro. Mientras la lleves encima podrás usar los poderes del Espiritista.
soulknight.spiritist.plaguestaff.name=báculo de la peste
soulknight.spiritist.plaguestaff.desc=Un báculo oscuro rematado por una calavera verde.\n\nFunciona como una varita: tiene cargas que se recuperan con el tiempo y se dispara desde la barra rápida.
soulknight.spiritist.plaguestaff.stats_desc=Lanza una púa verde al primero que encuentra: hace _%1$d-%2$d de daño_ y lo _envenena_ (%3$d).
soulknight.spiritist.spiritistarmor.name=armadura del espiritista
soulknight.spiritist.spiritistarmor.desc=Mientras lleve esta armadura, el Espiritista puede realizar una habilidad especial.
###habilidades
soulknight.spiritist.nightmare.name=pesadilla
soulknight.spiritist.nightmare.desc=Marca a un enemigo a la vista, a _%1$d casillas_ o menos, durante _%2$d turnos_: recibe un _%3$d%% más de daño_ de todos. Al marcarlo salen junto al Espiritista _%4$d fantasma(s)_, y cuando el marcado muere salen otros tantos. Los fantasmas luchan durante _%5$d turnos_.
soulknight.spiritist.nightmare.desc_short=marca a un enemigo y llama a fantasmas que luchan por ti.
soulknight.spiritist.nightmare.prompt=Elige a quién marcar
soulknight.spiritist.nightmare.no_target=Ahí no hay ningún enemigo a la vista.
soulknight.spiritist.nightmare$mark.name=pesadilla
soulknight.spiritist.nightmare$mark.desc=Una pesadilla persigue a esta criatura: recibe un %1$d%% más de daño, y cuando muera saldrán fantasmas.\n\nTurnos restantes: %2$s.
soulknight.spiritist.omenstone.name=piedra del augurio
soulknight.spiritist.omenstone.desc=Una piedra de mal agüero cae del cielo en un punto a _%1$d casillas_ o menos: hace _%2$d-%3$d de daño_ a los enemigos de alrededor y deja una _peste_ de _%4$d casilla(s)_ durante _%5$d turnos_, que envenena _solo a los enemigos_ (%6$d).
soulknight.spiritist.omenstone.desc_short=cae una piedra que daña y deja una peste que envenena a los enemigos.
soulknight.spiritist.omenstone.prompt=Elige dónde cae la piedra
soulknight.spiritist.plaguecloud.desc=Una peste verde flota aquí. Envenena a los enemigos, pero no a los héroes ni a sus aliados.
soulknight.spiritist.raisedead.name=levantar a los caídos
soulknight.spiritist.raisedead.desc=Levanta a los enemigos que murieron hace poco (_%2$d turnos_ o menos) a _%1$d casillas_ o menos del Espiritista: vuelven con toda su vida y luchan por él durante _%4$d turnos_. Levanta hasta _%3$d_ (2 desde el nivel 15). Los jefes y las criaturas especiales no se pueden levantar.
soulknight.spiritist.raisedead.desc_short=devuelve a la vida a los últimos enemigos caídos para que luchen por ti.
soulknight.spiritist.raisedead.no_corpse=No hay ningún caído reciente cerca.
soulknight.spiritist.raisedead$raised.name=levantado
soulknight.spiritist.raisedead$raised.desc=Esta criatura volvió de la muerte y lucha por los héroes.\n\nTurnos restantes: %d.
soulknight.spiritist.dansemacabre.name=danza macabra
soulknight.spiritist.dansemacabre.desc=Los muertos bailan para el Espiritista: _%1$d esqueletos_ salen del suelo a su alrededor y luchan por él durante _%2$d turnos_ (%5$d-%6$d de daño), y los enemigos a _%3$d casillas_ o menos huyen _aterrorizados_ durante _%4$d turnos_.
soulknight.spiritist.dansemacabre.desc_short=salen esqueletos a tu alrededor y los enemigos cercanos huyen de miedo.
soulknight.spiritist.ghost.name=fantasma
soulknight.spiritist.ghost.desc=Un espíritu del Espiritista. Lo sigue a todas partes y ataca a los enemigos (%1$d-%2$d de daño).
soulknight.spiritist.ghost.desc_time=Turnos restantes: %d.
soulknight.spiritist.ghost.fades=El fantasma se desvanece.
soulknight.spiritist.skeleton.name=esqueleto
soulknight.spiritist.skeleton.desc=Un guerrero de huesos levantado por el Espiritista. Lo sigue y ataca a los enemigos (%1$d-%2$d de daño).
soulknight.spiritist.skeleton.desc_time=Turnos restantes: %d.
soulknight.spiritist.skeleton.fades=El esqueleto se deshace en polvo.
###habilidad de armadura
soulknight.spiritist.soulveil.name=velo de almas
soulknight.spiritist.soulveil.short_desc=Se vuelve invisible unos turnos y llama a varios fantasmas.
soulknight.spiritist.soulveil.desc=El Espiritista se envuelve en un velo de almas: se vuelve invisible y unos fantasmas salen a luchar por él.
soulknight.spiritist.soulveil.desc_numbers=Es invisible _%1$d turnos_ y llama a _%2$d fantasmas_.
