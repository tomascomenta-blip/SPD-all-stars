soulknight.continent.bones.fauna.bonesfauna.name=bones

soulknight.continent.bones.fauna.charredphoenix.name=charred phoenix
soulknight.continent.bones.fauna.charredphoenix.desc=A bird of coal with cracks of ember for veins. Its peck can set you alight. The first time it dies it falls to ash and _gets up out of it at once_, whole again; the second time it stays down.
soulknight.continent.bones.fauna.charredphoenix.reborn=The phoenix crumbles into ash... and rises out of it, burning.

soulknight.continent.bones.fauna.marrowworm.name=marrow worm
soulknight.continent.bones.fauna.marrowworm.desc=A worm of red marrow rings with a round mouth full of teeth. They live in the old bones _three or four together_, half out of a cracked one while nothing passes. The bite bleeds.

soulknight.continent.bones.fauna.ossuaryhyena.name=ossuary hyena
soulknight.continent.bones.fauna.ossuaryhyena.desc=Mangy, with a sloped back, a mask of bone over the muzzle and a yellow eye of mist. They go _in packs_ and _laugh when they find you_ (the rest come running). They follow blood from far off.

soulknight.continent.bones.fauna.bonebeetle.name=bone beetle
soulknight.continent.bones.fauna.bonebeetle.desc=A domed shell of old porous bone, legs of dark tendon and a yellow eye. Badly hurt, it _pulls its legs in and shuts_ for a few turns: then almost nothing gets through the shell.

soulknight.continent.bones.fauna.marrowcentipede.name=marrow centipede
soulknight.continent.bones.fauna.marrowcentipede.desc=Eleven rings of red marrow, each with its own plate of bone, and a bone head with pincers. It _rears up_ (marked) and strikes down a narrow strip. The pincers open wounds. The head is its weak spot.

soulknight.continent.bones.fauna.ossuaryvulture.name=ossuary vulture
soulknight.continent.bones.fauna.ossuaryvulture.desc=Charred down, wings of bone feathers, a bare neck of tendon and a hooked beak of bone. It flies over everything and _smells blood from very far_: whoever is badly hurt has it overhead soon. It _drops on a marked patch_ and tears.

soulknight.continent.bones.fauna.ribdigger.name=rib digger
soulknight.continent.bones.fauna.ribdigger.desc=A huge blind mole that lives inside the skeletons and _wears an old colossus's ribcage for a shell_. It rakes with spade claws of bone (marked, in front) and _digs_: old bones fly out and come down on a few marked patches round whoever it heard. Hit it in the gap under the ribs.

soulknight.continent.bones.fauna.skinlesscolossus.name=skinless colossus
soulknight.continent.bones.fauna.skinlesscolossus.desc=A young colossus, all muscle and no hide, the spine bare, crawling on all fours with one short arm and one long. It raises the long arm (marked) and brings it down on the band in front of it. _It's always hungry: hand it raw colossus meat and it lets the collar on._
soulknight.continent.bones.fauna.skinlesscolossus.hungry=It sniffs at you and turns away. It wants raw colossus meat.

soulknight.continent.bones.fauna.bonechimera.name=bone chimera
soulknight.continent.bones.fauna.bonechimera.desc=Skeletons of different beasts bound with dry tendon: a horned skull with one light in the socket, a smaller one on a neck of vertebrae, each leg from another animal. The big skull _bites down a marked band_ in front; when _both skulls roar_ the air around it shakes (marked) and your head spins.

soulknight.continent.bones.fauna.mourner.name=the mourner
soulknight.continent.bones.fauna.mourner.epithet=the one that weeps for the dead
soulknight.continent.bones.fauna.mourner.desc=A very tall, thin thing wrapped in shrouds, a bone mask under a veil, and tears of yellow mist running out of the empty sockets. It weeps for the dead and _raises them_: whatever small thing dies near it gets up again a while later, once. Its long bone fingers rake a marked patch. Its hands are its weak spots.
soulknight.continent.bones.fauna.mourner.raises=The mourner wails. The dead around it get up again.

soulknight.continent.bones.fauna.laststanding.name=the Last One Standing
soulknight.continent.bones.fauna.laststanding.epithet=guardian of the graveyard of colossi
soulknight.continent.bones.fauna.laststanding.desc=The skeleton of the oldest colossus. It lies _as a heap of bones_ with the skull on top until someone comes close, then it gets up (nothing hurts it while it does). It _stamps a marked patch_ in front of it, _sweeps everything around it_ and calls the small bones of the graveyard up out of the dust. Its soul glows inside the ribs: climb up to it, or hit the skull.
soulknight.continent.bones.fauna.laststanding.rises=The heap of bones shifts. The skull lifts... and the oldest colossus stands up again.
soulknight.continent.bones.fauna.laststanding.calls=The dust around it stirs and small bones climb out of it.
