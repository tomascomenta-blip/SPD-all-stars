#Loot of Thal-Vekhorr

###the loot
soulknight.finale.reward.thalrewards.loot=Thal-Vekhorr leaves its loot behind: %1$d scrolls of upgrade, %2$d potions of strength, %3$d potions of healing, food for the road, the melted clock, the clockmaker's chest and the heart of Thal-Vekhorr.
soulknight.finale.reward.thalrewards.unbound=No hours are left to hold you back: your maximum level rises to %d.
ui.talentspane.unlock_tier5=Use the heart of Thal-Vekhorr to choose a path, and grow past level 30 to unlock more talents.

###melted clock
soulknight.finale.reward.meltedclock.name=melted clock
soulknight.finale.reward.meltedclock.ac_use=USE
soulknight.finale.reward.meltedclock.desc=A pocket watch that dripped from the chest of Thal-Vekhorr when its heart stopped beating out of time. The hands sag downwards, but they keep moving.\n\nIt only winds up _while you fight_: it charges as long as there are enemies in sight.\n\n_Rewind_ (%2$d %%): you go back to the spot and the health you had _%1$d turns_ ago. Your health never goes down, and if you can no longer walk to that spot you only get the health back.\n\n_Stop time_ (%3$d %%): for _%4$d turns_ only you act. Unlike the hourglass, you can attack without breaking it.
soulknight.finale.reward.meltedclock.desc_hint=The clock improves with use: one level every 3 uses. Higher levels charge faster and stop time for longer.
soulknight.finale.reward.meltedclock.desc_cursed=The cursed clock shows an hour that doesn't exist.
soulknight.finale.reward.meltedclock.prompt=The hands tremble. Which way do you turn them?
soulknight.finale.reward.meltedclock.opt_rewind=Rewind (%d %%)
soulknight.finale.reward.meltedclock.opt_halt=Stop time (%1$d %%, %2$d turns)
soulknight.finale.reward.meltedclock.no_charge=The clock isn't wound up enough.
soulknight.finale.reward.meltedclock.cursed=The cursed clock won't obey you.
soulknight.finale.reward.meltedclock.levelup=The hands of the melted clock move more freely.
soulknight.finale.reward.meltedclock.ready=The melted clock is wound up enough.
soulknight.finale.reward.meltedclock.rewound=Time rewinds around you.
soulknight.finale.reward.meltedclock.halted=Everything stands still. Except you.
soulknight.finale.reward.meltedclock$halt.name=Stopped time
soulknight.finale.reward.meltedclock$halt.desc=Time has stopped for everyone but you. You can move, attack and use items while nobody else acts.\n\nTurns left: %s.

###clockmaker's chest
soulknight.finale.reward.clockmakerchest.name=clockmaker's chest
soulknight.finale.reward.clockmakerchest.ac_open=OPEN
soulknight.finale.reward.clockmakerchest.desc=A little brass chest with a clock face for a lock. Inside are three pieces forged from the remains of Thal-Vekhorr, but the chest will only let you keep one.
soulknight.finale.reward.clockmakerchest.got=You keep: %s.
soulknight.finale.reward.wndchoosegear.message=Three _tier 6_ pieces, above anything forged in the dungeon. You can only keep one.\n\nThe piece comes with the upgrades of what you have equipped in that slot (at least _+%d_).
soulknight.finale.reward.wndchoosegear.weapon_line=+%1$d, %2$d-%3$d damage, strength %4$d
soulknight.finale.reward.wndchoosegear.armor_line=+%1$d, %2$d-%3$d armor, strength %4$d
soulknight.finale.reward.wndchoosegear.are_you_sure=Keep this piece? The other two will be lost.
soulknight.finale.reward.wndchoosegear.yes=Yes, this one
soulknight.finale.reward.wndchoosegear.no=Not yet
soulknight.finale.reward.wndchoosegear.cancel=Decide later

soulknight.finale.reward.minutehand.name=minute hand
soulknight.finale.reward.minutehand.desc=The minute hand of Thal-Vekhorr, sharpened into a sword. As heavy as a greatsword, but it cuts better.
soulknight.finale.reward.minutehand.ticks=Every _4th hit_ that lands strikes the hour and deals _+50 %%_ damage. Hits until the next hour: _%d_.
soulknight.finale.reward.minutehand.hour=the hour!
soulknight.finale.reward.minutehand.prompt=Choose who to cleave
soulknight.finale.reward.minutehand.ability_name=cleave
soulknight.finale.reward.minutehand.typical_ability_desc=The Duelist can _cleave_ an enemy with the minute hand. This would normally deal _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous, and the Duelist can cleave again within 5 turns at no cost.
soulknight.finale.reward.minutehand.ability_desc=The Duelist can _cleave_ an enemy with the minute hand. This deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous, and the Duelist can cleave again within 5 turns at no cost.

soulknight.finale.reward.pendulum.name=pendulum
soulknight.finale.reward.pendulum.desc=The pendulum of Thal-Vekhorr, hanging from a piece of its chain. Hard to get moving, but once it swings nothing stops it.
soulknight.finale.reward.pendulum.swing=One hit in three _slows_ the enemy for %d turns. It needs one more point of strength than the other tier 6 pieces.
soulknight.finale.reward.pendulum.prompt=Choose who to strike
soulknight.finale.reward.pendulum.ability_name=heavy blow
soulknight.finale.reward.pendulum.typical_ability_desc=The Duelist can perform a _heavy blow_ with the pendulum. This focused strike would normally deal _%1$d-%2$d damage_ if it surprises the enemy, and dazes it for 5 turns, which halves its evasion. Heavy blow always hits, but deals regular damage if it doesn't surprise the enemy.
soulknight.finale.reward.pendulum.ability_desc=The Duelist can perform a _heavy blow_ with the pendulum. This focused strike deals _%1$d-%2$d damage_ if it surprises the enemy, and dazes it for 5 turns, which halves its evasion. Heavy blow always hits, but deals regular damage if it doesn't surprise the enemy.

soulknight.finale.reward.gearplate.name=gearwork plate
soulknight.finale.reward.gearplate.desc=Plates and cogs torn off the chest of Thal-Vekhorr. They still turn, and with them the time of whoever wears it runs a little out of step.
soulknight.finale.reward.gearplate.phase_desc=_%d %%_ of the hits that reach you arrive a moment too late and pass right through you.
soulknight.finale.reward.gearplate.phase=out of step!

###heart and paths
soulknight.finale.reward.thalheart.name=heart of Thal-Vekhorr
soulknight.finale.reward.thalheart.ac_listen=LISTEN
soulknight.finale.reward.thalheart.desc=The clockwork heart of the colossus. It is still beating, always a little out of time.\n\nIf you listen to it, it will show you one of the three paths that go on past the end of hours. The path you choose opens a _fifth row of talents_, for levels 31 to 40.
soulknight.finale.reward.thalheart.already=You have already chosen your path. This heart is for someone else.
soulknight.finale.reward.thalheart.used=You chose the path: %s.
soulknight.finale.reward.wndchoosespecialization.message=Past the end of hours wait the yogs, the dark and hunger. How will you survive?
soulknight.finale.reward.wndchoosespecialization.are_you_sure=Are you sure you want to follow this path? You won't be able to change it.
soulknight.finale.reward.wndchoosespecialization.yes=Yes, I will
soulknight.finale.reward.wndchoosespecialization.no=Not yet
soulknight.finale.reward.wndchoosespecialization.cancel=Decide later
soulknight.finale.reward.wndchoosespecialization.talents=Talents (levels 31-40)

soulknight.finale.reward.specialization.yog_hunter=yog hunter
soulknight.finale.reward.specialization.yog_hunter_short_desc=The _Yog Hunter_ chases demons and the brood of Yog: deals them more damage and senses them through walls.
soulknight.finale.reward.specialization.yog_hunter_desc=Your prey are _demonic creatures_: the demons of the depths, Yog-Dzewa and its brood, and the yogs waiting on the other side.\n\nYou deal _+20%_ damage to prey and _sense them within 6 tiles_, even through walls.\n\nIts talents raise the damage and the range of the scent, protect you from prey, and heal you when you hunt them.
soulknight.finale.reward.specialization.lightbearer=lightbearer
soulknight.finale.reward.specialization.lightbearer_short_desc=The _Lightbearer_ carries their own light and a holy essence that keeps the afflictions of the dark away.
soulknight.finale.reward.specialization.lightbearer_desc=_You always see at least 6 tiles away_, even on a dark floor. In co-op, the whole party sees what you light up.\n\nYou carry _2 charges of holy essence_ and get one back every 40 turns. When an _affliction of the dark_ (blindness, weakness, vulnerability, hex, degradation, terror, charm, vertigo, daze or doom) would hit you, you spend a charge and it doesn't.\n\nIts talents widen your light, carry more essence, recharge it sooner and heal you when it's used.
soulknight.finale.reward.specialization.time_wanderer=time wanderer
soulknight.finale.reward.specialization.time_wanderer_short_desc=The _Time Wanderer_ gets less hungry and, when about to fall, slows time down around them.
soulknight.finale.reward.specialization.time_wanderer_desc=_Hunger_ grows _30%_ slower for you.\n\nWhen a hit leaves you _below 30%_ of your health, time slows down: the enemies you can see are _slowed for 3 turns_. It's ready again after 60 turns.\n\nIts talents take away even more hunger, lengthen the slowdown, charge the melted clock faster and make you walk faster.

soulknight.finale.reward.specpowers.warded=essence!
soulknight.finale.reward.specpowers.slip=time slows!
soulknight.finale.reward.specpowers.slip_log=Time slows down around you: %d enemies are slowed.
soulknight.finale.reward.specpowers$holyessence.name=Holy essence
soulknight.finale.reward.specpowers$holyessence.desc=You carry _%1$d of %2$d_ charges of holy essence.\n\nEach charge protects you from one affliction of the dark: blindness, weakness, vulnerability, hex, degradation, terror, charm, vertigo, daze or doom.\n\nYou get a charge back every %3$d turns.
soulknight.finale.reward.specpowers$slipcooldown.name=Time spent
soulknight.finale.reward.specpowers$slipcooldown.desc=Time can't slow down for you again just yet.\n\nTurns left: %s.

###talents of the fifth row
actors.hero.talent.yh_bane.title=bane
actors.hero.talent.yh_bane.desc=_+1:_ You deal _10%_ more damage to prey.\n\n_+2:_ _20%_ more.\n\n_+3:_ _30%_ more.
actors.hero.talent.yh_scent.title=scent
actors.hero.talent.yh_scent.desc=_+1:_ You sense prey within _8 tiles_.\n\n_+2:_ Within _10 tiles_.\n\n_+3:_ Within _12 tiles_.
actors.hero.talent.yh_hide.title=hunter's hide
actors.hero.talent.yh_hide.desc=_+1:_ Prey deal _10%_ less damage to you.\n\n_+2:_ _20%_ less.\n\n_+3:_ _30%_ less.
actors.hero.talent.yh_trophy.title=trophy
actors.hero.talent.yh_trophy.desc=_+1:_ Killing prey heals you for _4%_ of your max health.\n\n_+2:_ _8%_.\n\n_+3:_ _12%_.
actors.hero.talent.lb_beacon.title=beacon
actors.hero.talent.lb_beacon.desc=_+1:_ You see _1 tile_ further.\n\n_+2:_ _2 tiles_ further.\n\n_+3:_ _3 tiles_ further.
actors.hero.talent.lb_vessel.title=holy vessel
actors.hero.talent.lb_vessel.desc=_+1:_ You can carry _1 more_ charge of holy essence.\n\n_+2:_ _2 more_.\n\n_+3:_ _3 more_.
actors.hero.talent.lb_dawn.title=dawn
actors.hero.talent.lb_dawn.desc=_+1:_ You get a charge of essence back every _32 turns_.\n\n_+2:_ Every _26 turns_.\n\n_+3:_ Every _20 turns_.
actors.hero.talent.lb_radiance.title=radiance
actors.hero.talent.lb_radiance.desc=_+1:_ Spending essence heals you for _5%_ of your max health.\n\n_+2:_ _10%_.\n\n_+3:_ _15%_.
actors.hero.talent.tw_stomach.title=sleeping stomach
actors.hero.talent.tw_stomach.desc=_+1:_ Hunger grows _40%_ slower for you.\n\n_+2:_ _50%_ slower.\n\n_+3:_ _60%_ slower.
actors.hero.talent.tw_long_pause.title=long pause
actors.hero.talent.tw_long_pause.desc=_+1:_ The slowdown lasts _4 turns_ and is ready again after _50 turns_.\n\n_+2:_ _5 turns_, ready after _40_.\n\n_+3:_ _6 turns_, ready after _30_.
actors.hero.talent.tw_clockwork.title=clockwork
actors.hero.talent.tw_clockwork.desc=_+1:_ The melted clock charges _20%_ faster.\n\n_+2:_ _40%_ faster.\n\n_+3:_ _60%_ faster.
actors.hero.talent.tw_quickstep.title=quickstep
actors.hero.talent.tw_quickstep.desc=_+1:_ You walk _10%_ faster.\n\n_+2:_ _20%_ faster.\n\n_+3:_ _30%_ faster.
