###the dark continent: what happens to the land
soulknight.continent.events.worldevents.dir_0=north
soulknight.continent.events.worldevents.dir_1=north-east
soulknight.continent.events.worldevents.dir_2=east
soulknight.continent.events.worldevents.dir_3=south-east
soulknight.continent.events.worldevents.dir_4=south
soulknight.continent.events.worldevents.dir_5=south-west
soulknight.continent.events.worldevents.dir_6=west
soulknight.continent.events.worldevents.dir_7=north-west

soulknight.continent.events.giantsteps.name=Steps of the giant
soulknight.continent.events.giantsteps.far=The ground shudders, and again, and again: something enormous is walking this way, still a long way off.
soulknight.continent.events.giantsteps.far_under=Dust trickles from the roof with every distant thud: something enormous is walking up above.
soulknight.continent.events.giantsteps.near=Its feet are coming down right here! Get off the marked ground.
soulknight.continent.events.giantsteps.near_under=The roof is giving way under its steps! Get off the marked ground.
soulknight.continent.events.giantsteps.gone=The steps fade into the distance. Whatever it was, you never saw it.
soulknight.continent.events.giantsteps.turns=The steps turn away and fade.
soulknight.continent.events.giantsteps.card_far=Something huge is walking this way
soulknight.continent.events.giantsteps.card_near=Where its feet will fall is marked: get out of the way
soulknight.continent.events.giantsteps.card_near_under=The roof comes down where it treads: get out of the way
soulknight.continent.events.giantsteps$foot.name=the foot of something unseen
soulknight.continent.events.giantsteps$foot.rankings_desc=Trodden on by something nobody saw

soulknight.continent.events.yogtide.name=Yog tide
soulknight.continent.events.yogtide.warn_edge=A violet glow spreads along the land to the %s: the yog tide is coming in.
soulknight.continent.events.yogtide.warn_well=Something violet is welling up out of the ground to the %s: a yog tide is rising.
soulknight.continent.events.yogtide.warn_deep=Something violet is welling up out of the depths to the %s: a yog tide is rising.
soulknight.continent.events.yogtide.rise=The tide pours over the ground. Inside it the corruption climbs fast: keep out of it, or get through it quickly.
soulknight.continent.events.yogtide.brood=Things of yog come in with the tide. Out of it they don't last long.
soulknight.continent.events.yogtide.soaked=The tide soaks you: you can feel the corruption climbing with every step.
soulknight.continent.events.yogtide.ebb=The tide stops spreading and begins to ebb.
soulknight.continent.events.yogtide.gone=The tide is gone. Whatever it brought melts away out of it.
soulknight.continent.events.yogtide.card_warn=A wave of corruption is on its way
soulknight.continent.events.yogtide.card_rise=Inside it the corruption climbs fast, and yog's brood comes with it

soulknight.continent.events.storm.name_ash=Ash storm
soulknight.continent.events.storm.name_flesh=Blood rain
soulknight.continent.events.storm.name_city=Soot storm
soulknight.continent.events.storm.name_frost=Blizzard
soulknight.continent.events.storm.name_bones=Bone dust
soulknight.continent.events.storm.name_isles=Sea mist
soulknight.continent.events.storm.warn_ash=The wind rises, and a dark wall of ash comes rolling over the plain.
soulknight.continent.events.storm.warn_flesh=The air turns warm and heavy, and the first red drops start to fall.
soulknight.continent.events.storm.warn_city=The chimneys of the dead city cough black: a storm of soot is coming down the streets.
soulknight.continent.events.storm.warn_frost=The sky goes white to the north and the cold sharpens: a blizzard is coming.
soulknight.continent.events.storm.warn_bones=The wind lifts the pale dust of the graveyard into a cloud that blots out everything.
soulknight.continent.events.storm.warn_isles=A grey mist climbs out of the sea and creeps over the islands.
soulknight.continent.events.storm.start_ash=The ash storm is on you. You can barely see, but nothing sees you well either, and the wind swallows the noise.
soulknight.continent.events.storm.start_flesh=It's raining blood. You see less and are seen less, and the rain washes away any trail of blood: nothing can follow its smell now.
soulknight.continent.events.storm.start_city=The soot is everywhere. You see less and are seen less, and it hides every glow: the eyes of yog and the fires can't be told from afar.
soulknight.continent.events.storm.start_frost=The blizzard hits. You see less and are seen less, the wind covers the noise, and the cold slows you down unless you keep by a fire.
soulknight.continent.events.storm.start_bones=The bone dust is so thick you can hardly see your own hands. But nothing out there can see you either.
soulknight.continent.events.storm.start_isles=The mist closes in. You see less and are seen less, but over the water every sound carries much further: keep quiet.
soulknight.continent.events.storm.end_ash=The wind drops and the ash settles. The storm has passed.
soulknight.continent.events.storm.end_flesh=The red rain thins out and stops.
soulknight.continent.events.storm.end_city=The soot settles over everything. The air clears.
soulknight.continent.events.storm.end_frost=The blizzard blows itself out.
soulknight.continent.events.storm.end_bones=The dust falls back to the ground, and the bones come into sight again.
soulknight.continent.events.storm.end_isles=The mist lifts off the islands.
soulknight.continent.events.storm.card_warn_ash=A storm of ash is coming
soulknight.continent.events.storm.card_warn_flesh=A rain of blood is coming
soulknight.continent.events.storm.card_warn_city=A storm of soot is coming
soulknight.continent.events.storm.card_warn_frost=A blizzard is coming
soulknight.continent.events.storm.card_warn_bones=A cloud of bone dust is coming
soulknight.continent.events.storm.card_warn_isles=A sea mist is coming
soulknight.continent.events.storm.card_ash=You see less, and are seen less. The wind covers your noise
soulknight.continent.events.storm.card_flesh=You see less, and are seen less. No trail of blood to follow
soulknight.continent.events.storm.card_city=You see less, and are seen less. No glow shows from afar
soulknight.continent.events.storm.card_frost=You see less, and are seen less. Away from a fire, the cold slows you
soulknight.continent.events.storm.card_bones=You can hardly see, and you can hardly be seen
soulknight.continent.events.storm.card_isles=You see less, and are seen less. Sound carries further
soulknight.continent.events.storm.cold=The cold of the blizzard bites through you and slows you down. A fire, a tamed beast or the sacred light would keep it off.

soulknight.continent.events.migration.name=Migration
soulknight.continent.events.migration.warn=Dust is rising on the horizon to the %1$s: %2$s is coming this way.
soulknight.continent.events.migration.herd_ash=a herd of basalt bison
soulknight.continent.events.migration.herd_flesh=a herd of watcher fawns
soulknight.continent.events.migration.herd_city=a black tide of soot rats
soulknight.continent.events.migration.herd_frost=a herd of elk of the ice antlers
soulknight.continent.events.migration.herd_bones=a crawl of young skinless colossi
soulknight.continent.events.migration.herd_isles=a march of lighthouse crabs
soulknight.continent.events.migration.cross_ash=The bison are here, and they spook easily: if they bolt, don't be in front of them. They can be hunted... or tamed.
soulknight.continent.events.migration.cross_flesh=The fawns are crossing. Every eye on them will see you, and the big things of the forest listen to them.
soulknight.continent.events.migration.cross_city=The rats are pouring through. Each is nothing; dozens of them are something else.
soulknight.continent.events.migration.cross_frost=The elk are crossing. Don't walk right up to them, unless you mean to hunt them.
soulknight.continent.events.migration.cross_bones=The young colossi are crawling past, always hungry. Don't get under them. Raw meat would buy one of them.
soulknight.continent.events.migration.cross_isles=The crabs are marching past with their lamps lit. Keep out of their way... or out of their light.
soulknight.continent.events.migration.gone=The herd has passed, and the ground goes still.
