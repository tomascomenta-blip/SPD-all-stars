soulknight.finale.riftlevel.sky_name=Broken sky
soulknight.finale.riftlevel.sky_desc=Where the sky should be there are cracks, and behind the cracks, stars that don't belong to this world.
soulknight.finale.riftlevel.mouth_name=Dungeon entrance
soulknight.finale.riftlevel.mouth_desc=The mouth of the dungeon you just walked out of. There's no going back now.
soulknight.finale.riftlevel.floor_name=Meadow
soulknight.finale.riftlevel.floor_desc=The surface grass, with old flagstones. The drops of melted clock scorch it as they fall.
