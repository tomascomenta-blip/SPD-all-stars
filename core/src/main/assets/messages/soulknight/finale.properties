###Thal-Vekhorr, End of the Hours
soulknight.finale.thalcall.escaped=You escaped the dungeon with the Amulet of Yendor!
soulknight.finale.thalcall.pulled=The sky breaks. Something drags you back.
soulknight.finale.thalcall.stasis_name=Time stopped
soulknight.finale.thalcall.stasis_desc=Time has stopped around you. You can't do anything until it flows again.\n\nTurns remaining: %s.

soulknight.finale.thalvekhorr.name=Thal-Vekhorr
soulknight.finale.thalvekhorr.desc=A colossus made of melting clocks, hanging from the broken sky over the dungeon's entrance. The Amulet drew it here like everything else that slipped into this world, but it comes from a place where the hours don't go in order.\n\nIt is too far away to reach: hurt it through _its hands_ when they come down, by _closing its portals_ and, at the end, through _its core_.
soulknight.finale.thalvekhorr.notice=I already saw you come out. Saw you go in. See you die. All at once.
soulknight.finale.thalvekhorr.core=My sphere...! I'll have to come down myself.
soulknight.finale.thalvekhorr.portal_closed=A portal closes and Thal-Vekhorr shudders.
soulknight.finale.thalvekhorr.echo_broken=The echo crumbles into sand and Thal-Vekhorr feels it.
soulknight.finale.thalvekhorr.rewind=That didn't happen. Not yet.
soulknight.finale.thalvekhorr.banner_rewind=An hourglass ran out: Thal-Vekhorr rewinds its wounds!
soulknight.finale.thalvekhorr.act_1=Tall grass and roots cover the ground: the Forest leaks through the portals.
soulknight.finale.thalvekhorr.act_2=Black flagstones and banners: the Knight Kingdom leaks through the portals.
soulknight.finale.thalvekhorr.act_3=Metal plates and alarm lights: the Starship leaks through the portals.
soulknight.finale.thalvekhorr.act_4=Wet sand and coral: the Sea Floor leaks through the portals.
soulknight.finale.thalvekhorr.act_5=Ice and ferns: the Forgotten Land leaks through the portals.
soulknight.finale.thalvekhorr.act_6=Every world at once. Thal-Vekhorr's core comes down: hit it!
soulknight.finale.thalvekhorr.solo_breath=The clock stops for a breath: the hours give you back some of what they took.
soulknight.finale.thalvekhorr.echo_fades=%s fades away: an echo can't hold together that long out of its time.
soulknight.finale.thalvekhorr.spell_bubbles=The air thickens into time bubbles: inside the blue one everything is slow, inside the golden one everything is fast.
soulknight.finale.thalvekhorr.spell_puddles=Melted clock drips onto the grass. Stepping in a puddle might go well... or not.
soulknight.finale.thalvekhorr.spell_swap=Thal-Vekhorr looks at two of you at once. They're about to trade places.
soulknight.finale.thalvekhorr.spell_rewind=What if we went back a little?
soulknight.finale.thalvekhorr.banner_hourglass=Hourglasses! Break them before they run out or it will rewind its wounds.
soulknight.finale.thalvekhorr.spell_stop=Stop.
soulknight.finale.thalvekhorr.banner_stop_soon=Time is about to stop! Get off the marked tiles.
soulknight.finale.thalvekhorr.banner_stop=TIME STOPPED!
soulknight.finale.thalvekhorr.spell_echoes=What you did a moment ago is still here.
soulknight.finale.thalvekhorr.defeated=No... it can't... I had already seen this ending... and it wasn't this one...
soulknight.finale.thalvekhorr.banner_dead=Thal-Vekhorr melts and collapses into itself.
soulknight.finale.thalvekhorr.portal_open=Where its core was, a portal stays open. Something huge is breathing on the other side.
soulknight.finale.thalvekhorr.banner_portal=A portal has opened. Touch it to decide.
soulknight.finale.thalvekhorr.voted_finish=%s wants to finish here.
soulknight.finale.thalvekhorr.voted_go=%s wants to cross to the Dark Continent.
soulknight.finale.thalvekhorr.continent_soon=The portal is still unstable: nobody can cross it.
soulknight.finale.thalvekhorr.wnd_title=Thal-Vekhorr's portal
soulknight.finale.thalvekhorr.wnd_body=Beyond the portal lies the Dark Continent, the land the yogs come from. You can end your adventure here, with the Amulet, or cross.
soulknight.finale.thalvekhorr.wnd_body_coop=Beyond the portal lies the Dark Continent, the land the yogs come from. The party votes: majority wins, and the host breaks ties.
soulknight.finale.thalvekhorr.wnd_finish=End the adventure
soulknight.finale.thalvekhorr.wnd_continent=Cross to the Dark Continent
soulknight.finale.thalvekhorr.wnd_continent_soon=Dark Continent (coming soon)
soulknight.finale.thalvekhorr.world_0=every world
soulknight.finale.thalvekhorr.world_1=the Forest
soulknight.finale.thalvekhorr.world_2=the Knight Kingdom
soulknight.finale.thalvekhorr.world_3=the Starship
soulknight.finale.thalvekhorr.world_4=the Sea Floor
soulknight.finale.thalvekhorr.world_5=the Forgotten Land

soulknight.finale.thalparts$hand.name=hand of Thal-Vekhorr
soulknight.finale.thalparts$hand.desc=A huge melting brass hand with clock hands for fingers. While it rests on the ground you can hit it, and every hit reaches Thal-Vekhorr.
soulknight.finale.thalparts$portal.name=time portal
soulknight.finale.thalparts$portal.name_echo=echo portal
soulknight.finale.thalparts$portal.desc=A tear in time leading to %s. Monsters keep coming out of it. Smash it shut: Thal-Vekhorr feels every portal it loses.
soulknight.finale.thalparts$hourglass.name=hourglass
soulknight.finale.thalparts$hourglass.desc=If the sand reaches the bottom, Thal-Vekhorr goes back to how it was a few turns ago. Break it!\n\n%d turns left.
soulknight.finale.thalparts$core.name=core of Thal-Vekhorr
soulknight.finale.thalparts$core.desc=The cracked face of its clock, with the heart of time beating inside. Every bit of damage you deal to it, it feels.
soulknight.finale.thalparts$heroecho.name=echo
soulknight.finale.thalparts$heroecho.desc=A shadow of one of you from a few turns ago. It repeats what they did, swings included.
soulknight.finale.thalparts$exitportal.name=portal
soulknight.finale.thalparts$exitportal.desc=The Dark Continent lies on the other side.
soulknight.finale.thalparts$exitportal.desc_soon=The Dark Continent lies on the other side. The portal is still unstable; for now it's only good for saying goodbye.

soulknight.finale.thalhud.title=End of the Hours
soulknight.finale.thalhud.victory=You escaped with the Amulet of Yendor!
soulknight.finale.thalhud.victory_sub=Sunlight, at last...
soulknight.finale.thalhud.rewound=Time rewinds... One more chance. Just one.
