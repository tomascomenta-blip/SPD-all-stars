#Echoes of the world bosses (en)

soulknight.finale.echo.echoboss.arrives=%s steps out of a time portal!
soulknight.finale.echo.echoboss.breaks=%s crumbles into sand and light.

soulknight.finale.echo.priestecho.name=echo of the high priest
soulknight.finale.echo.priestecho.desc=The goblin high priest, torn out of his own time by Thal-Vekhorr: a see-through copy that still remembers his spells.\n\nHe keeps his distance and alternates _stars_ that burst into bullets with _meteors_ on marked cells. Every so often he floats and calls the _giant star_ over a hero: get out of the marked square, or hurt him enough before it falls and the spell breaks, leaving him _dazed_.
soulknight.finale.echo.priestecho.stars=The echo throws bursting stars!
soulknight.finale.echo.priestecho.meteors=The echo calls down meteors!
soulknight.finale.echo.priestecho.star_call=Fall, star of the ages!
soulknight.finale.echo.priestecho.star_hint=The giant star is coming! Get out of the square, or hurt the echo by %d before it falls.
soulknight.finale.echo.priestecho.star_broken=The giant star shatters! The echo is dazed.
soulknight.finale.echo.priestecho.star_fell=The giant star crashes down!
soulknight.finale.echo.priestecho.dazed=dazed!

soulknight.finale.echo.knightecho.name=echo of the dark grand knight
soulknight.finale.echo.knightecho.desc=The dark grand knight as he was in his first battle, brought back by Thal-Vekhorr as a see-through shadow.\n\nHis _shield_ stops half of every blow that comes _from the front_ (where he last moved or struck). He _thrusts_ along a marked line, falls on a hero with the _leap of judgement_ (a marked 3x3 square and a ring of blades) and throws _fans of blades_. Right after a thrust or a leap his back is open.
soulknight.finale.echo.knightecho.blocked=blocked
soulknight.finale.echo.knightecho.thrust=The echo readies a thrust!
soulknight.finale.echo.knightecho.leap=The echo is about to leap onto %s!
soulknight.finale.echo.knightecho.leap_solo=The echo is about to leap onto you!
soulknight.finale.echo.knightecho.fan=The echo throws a fan of blades!

soulknight.finale.echo.queenecho.name=echo of the varkolyn queen
soulknight.finale.echo.queenecho.desc=The varkolyn queen, or what is left of her in the folds of time: see-through, with her shell still whole.\n\nShe spits _acid_ around every hero she sees (marked cells; it keeps burning for a few turns unless you step into water), shoots a _ring of spikes_ and lays _echo whelps_. The whelps vanish with her.
soulknight.finale.echo.queenecho.acid=The echo spits acid!
soulknight.finale.echo.queenecho.spikes=The echo bristles with spikes!
soulknight.finale.echo.queenecho.brood=The echo lays her whelps!
soulknight.finale.echo.queenecho$whelp.name=echo whelp
soulknight.finale.echo.queenecho$whelp.desc=A little see-through varkolyn, hatched from the echo of the queen. It only bites. It vanishes with its mother.

soulknight.finale.echo.krakenecho.name=echo of the Kraken
soulknight.finale.echo.krakenecho.desc=Only the head of the Kraken, peeking out of a small whirlpool that has no business being here.\n\nIts _eye_ is shut most of the time and blows barely get through. Every few turns it _opens_: then the echo takes much more damage, and it glares at a hero along a marked line. Meanwhile a _giant tentacle_ rises from a puddle and slams a marked row, or it spits _ink_ that blinds. It doesn't walk: it sinks and comes up somewhere else.
soulknight.finale.echo.krakenecho.eye=The eye of the echo opens!
soulknight.finale.echo.krakenecho.shut=the eye closes
soulknight.finale.echo.krakenecho.closed=eye closed!
soulknight.finale.echo.krakenecho.dive=The echo of the Kraken sinks...
soulknight.finale.echo.krakenecho.glare=The eye glares at you!
soulknight.finale.echo.krakenecho.slam=A giant tentacle rises from a puddle!
soulknight.finale.echo.krakenecho.ink=The echo spits ink!

soulknight.finale.echo.tharogecho.name=echo of Tharog
soulknight.finale.echo.tharogecho.desc=Tharog, Heart of the Valley, as it was before the ice: a see-through copy, smaller than the real beast.\n\nIt _swings its tail_ in an arc in front of it and knocks you back, _breathes ice_ in a cone and _roars_ so that icicles fall around every hero. All of it is marked a turn before.
soulknight.finale.echo.tharogecho.sweep=The echo swings its tail!
soulknight.finale.echo.tharogecho.breath=The echo breathes ice!
soulknight.finale.echo.tharogecho.roar=GRROOOOAAARRR!
