#Beastmaster (en)

###class
actors.hero.heroclass.beastmaster=beastmaster
actors.hero.heroclass.beastmaster_desc_short=The _Beastmaster_ never fights alone: his _wolf pack_ follows him the whole run, and he calls poisonous vines and a huge bear.
actors.hero.heroclass.beastmaster_desc=A hunter from the jungle that dark magic raised beneath the dungeon; the goblins' wolves follow him instead of their priest. The Beastmaster starts with a _pack talisman_, which grants him _Frostfire Wolves_, _Venom Vines_, _Fuzzy Bear_ and the _Stampede_ (from level 6).\n\nHis passive, the _pack_: _2 wolves_ always follow him, also down the stairs. When a wolf falls, it comes back to him _20 turns_ later. The wolves grow stronger with his level.\n\nHe also starts with a _crispy bone_ (a light, accurate weapon), cloth armor, a waterskin and a velvet pouch.\n\nHe automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Lullaby\n\nFrom the kit he can _tame_ a badly hurt animal, which becomes his pet.
actors.hero.heroclass.beastmaster_unlock=The champions are unlocked from the start.

###subclasses
actors.hero.herosubclass.pack_alpha=pack alpha
actors.hero.herosubclass.pack_alpha_short_desc=The _Pack Alpha_ leads one more wolf, and his wolves are fiercer.
actors.hero.herosubclass.pack_alpha_desc=_3 wolves_ follow him instead of 2. His talents make the wolves stronger, help them hit next to him, and his Q scares the enemies.
actors.hero.herosubclass.forest_warden=forest warden
actors.hero.herosubclass.forest_warden_short_desc=The _Forest Warden_ raises more vines, and the forest and his bear protect him better.
actors.hero.herosubclass.forest_warden_desc=Venom Vines raises _4 vines_ instead of 3, and they last _25 turns_ instead of 15. His talents harden the vines, make them root, and give him more armor next to the bear.

###Beastmaster talents
actors.hero.talent.bm_shared_meal.title=shared meal
actors.hero.talent.bm_shared_meal.desc=_+1:_ Eating heals his wolves for _30%_ of their health.\n\n_+2:_ For _60%_.
actors.hero.talent.bm_tracker.title=tracker
actors.hero.talent.bm_tracker.desc=_+1:_ He senses enemies _2 cells_ away or closer, even through walls.\n\n_+2:_ _3 cells_ away or closer.
actors.hero.talent.bm_thick_fur.title=thick fur
actors.hero.talent.bm_thick_fur.desc=_+1:_ His wolves have _15% more health_.\n\n_+2:_ _30% more_.
actors.hero.talent.bm_sharp_fangs.title=sharp fangs
actors.hero.talent.bm_sharp_fangs.desc=_+1:_ His wolves deal _15% more damage_.\n\n_+2:_ _30% more_.
actors.hero.talent.bm_bone_throw.title=true bone
actors.hero.talent.bm_bone_throw.desc=_+1:_ The crispy bone deals _1 more damage_ to enemies with one of his wolves next to them.\n\n_+2:_ _2 more_.
actors.hero.talent.bm_howl.title=howl
actors.hero.talent.bm_howl.desc=_+1:_ When his wolves come back, they weaken the enemies within 2 cells for _3 turns_.\n\n_+2:_ _5 turns_.
actors.hero.talent.bm_quick_recovery.title=quick recovery
actors.hero.talent.bm_quick_recovery.desc=_+1:_ His wolves come back _5 turns sooner_ (after 15).\n\n_+2:_ _10 turns sooner_ (after 10).
actors.hero.talent.bm_thorns.title=thorns
actors.hero.talent.bm_thorns.desc=_+1:_ The vines deal _1 more damage_ and poison _1 more turn_.\n\n_+2:_ _2 more_.
actors.hero.talent.bm_natures_bond.title=nature's bond
actors.hero.talent.bm_natures_bond.desc=_+1:_ Whenever one of his beasts kills an enemy, the Beastmaster heals _2 HP_.\n\n_+2:_ He heals _4 HP_.
actors.hero.talent.bm_elemental_fangs.title=elemental fangs
actors.hero.talent.bm_elemental_fangs.desc=_+1:_ Frostfire Wolves lasts _1 more turn_ and deals _1 more damage_ per hit.\n\n_+2:_ _2 more_.\n\n_+3:_ _3 more_.
actors.hero.talent.bm_big_bear.title=big bear
actors.hero.talent.bm_big_bear.desc=_+1:_ The bear has _20% more health and damage_.\n\n_+2:_ _40% more_.\n\n_+3:_ _60% more_.
actors.hero.talent.pa_third_wolf.title=elite wolves
actors.hero.talent.pa_third_wolf.desc=_+1:_ His wolves have _10% more health and damage_.\n\n_+2:_ _20% more_.\n\n_+3:_ _30% more_.
actors.hero.talent.pa_pack_tactics.title=pack tactics
actors.hero.talent.pa_pack_tactics.desc=_+1:_ His wolves deal _1 more damage_ to the enemies next to the Beastmaster.\n\n_+2:_ _2 more_.\n\n_+3:_ _3 more_.
actors.hero.talent.pa_alpha_roar.title=alpha roar
actors.hero.talent.pa_alpha_roar.desc=_+1:_ Frostfire Wolves scares the enemies within 3 cells for _1 turn_ (not bosses).\n\n_+2:_ _2 turns_.\n\n_+3:_ _3 turns_.
actors.hero.talent.fw_ironbark.title=ironbark
actors.hero.talent.fw_ironbark.desc=_+1:_ The vines have _25% more health_.\n\n_+2:_ _50% more_.\n\n_+3:_ _75% more_.
actors.hero.talent.fw_roots.title=roots
actors.hero.talent.fw_roots.desc=_+1:_ Each hit of a vine has a _33%_ chance to root for 1 turn.\n\n_+2:_ _67%_.\n\n_+3:_ Always.
actors.hero.talent.fw_bear_hug.title=bear hug
actors.hero.talent.fw_bear_hug.desc=_+1:_ Next to the bear he gains _1 more armor_.\n\n_+2:_ _2 more_.\n\n_+3:_ _3 more_.

###Pack Roar talents
actors.hero.talent.pr_thunderous.title=thunderous
actors.hero.talent.pr_thunderous.desc=_+1:_ The roar reaches _1 cell further_.\n\n_+2:_ _2 more_.\n\n_+3:_ _3 more_.\n\n_+4:_ _4 more_.
actors.hero.talent.pr_rally.title=rally
actors.hero.talent.pr_rally.desc=_+1:_ The roar heals the allies for _30%_ of their health.\n\n_+2:_ _40%_.\n\n_+3:_ _50%_.\n\n_+4:_ _60%_.
actors.hero.talent.pr_ferocity.title=ferocity
actors.hero.talent.pr_ferocity.desc=_+1:_ The ferocity of his beasts lasts _3 more turns_.\n\n_+2:_ _6 more_.\n\n_+3:_ _9 more_.\n\n_+4:_ _12 more_.

###items
soulknight.beastmaster.beastmasterkit.name=pack talisman
soulknight.beastmaster.beastmasterkit.desc=A bone pendant with a small carved antler. While you carry it you can use the Beastmaster's gifts.
soulknight.beastmaster.crispybone.name=crispy bone
soulknight.beastmaster.crispybone.desc=A huge bone, light and hard. It is easy to hit with it.
soulknight.beastmaster.beastmasterarmor.name=beastmaster's armor
soulknight.beastmaster.beastmasterarmor.desc=While wearing this armor, the Beastmaster can perform a special ability.

###passive
soulknight.beastmaster.pack.name=pack
soulknight.beastmaster.pack.desc=A wolf of the pack has fallen. It will come back to the Beastmaster soon.\n\nTurns left: %d.
soulknight.beastmaster.wolf.name=pack wolf
soulknight.beastmaster.wolf.desc=A grey wolf of the Beastmaster's pack. It follows him everywhere and bites his enemies (%1$d-%2$d damage). If it falls, it will come back a while later.
soulknight.beastmaster.wolf.fades=The wolf leaves.

###abilities
soulknight.beastmaster.frostfirewolves.name=frostfire wolves
soulknight.beastmaster.frostfirewolves.desc=For _%1$d turns_, the Beastmaster and his wolves are filled with elemental power: every hit deals _%2$d more damage_ and alternates _fire_ (burns) and _frost_ (chills). The wolves also recover half of their health.
soulknight.beastmaster.frostfirewolves.desc_short=he and his wolves hit with fire and frost; the wolves heal.
soulknight.beastmaster.frostfirewolves$imbue.name=elemental power
soulknight.beastmaster.frostfirewolves$imbue.desc=Every hit deals %1$d more damage and alternates fire and frost.\n\nTurns left: %2$s.
soulknight.beastmaster.venomvines.name=venom vines
soulknight.beastmaster.venomvines.desc=Raises _%2$d vines_ around a spot within %1$d cells, for _%3$d turns_. They have _%4$d health_, lash at the enemies next to them (_%5$d-%6$d damage_ and _%7$d turns_ of poison) and, standing in the way, _stop the enemy bullets_.
soulknight.beastmaster.venomvines.desc_short=vines that poison the enemies and stop bullets.
soulknight.beastmaster.venomvines.prompt=Choose where to raise the vines
soulknight.beastmaster.venomvines.no_space=No vines can grow there.
soulknight.beastmaster.venomvines$vine.name=venom vine
soulknight.beastmaster.venomvines$vine.desc=A vine of the Beastmaster. It doesn't move; it lashes at the enemies next to it (%1$d-%2$d damage and %3$d turns of poison) and stops bullets.\n\nTurns left: %4$d.
soulknight.beastmaster.fuzzybear.name=fuzzy bear
soulknight.beastmaster.fuzzybear.desc=A huge bear comes to his side for _%1$d turns_: it has _%2$d health_ and its swipes deal _%3$d-%4$d damage_ to its enemy and half to the others around. The enemies within %5$d cells _turn on the bear_, and while the Beastmaster stands next to it he gains up to _%6$d armor_. Using it while the bear lives calls the bear back to him.
soulknight.beastmaster.fuzzybear.desc_short=a bear that draws the enemies, swipes around and protects him.
soulknight.beastmaster.fuzzybear.recall=The bear comes back to you.
soulknight.beastmaster.fuzzybear.no_space=There is no room for the bear.
soulknight.beastmaster.fuzzybear$bear.name=fuzzy bear
soulknight.beastmaster.fuzzybear$bear.desc=The Beastmaster's bear. Its swipes deal %1$d-%2$d damage to its enemy and half to the others around.
soulknight.beastmaster.fuzzybear$bear.desc_time=Turns left: %d.
soulknight.beastmaster.fuzzybear$bear.fades=The bear goes back to the forest.
soulknight.beastmaster.stampede.name=stampede
soulknight.beastmaster.stampede.desc=A stampede of spirit beasts tramples a _%1$d-cell_ cone in front of the Beastmaster: every enemy takes _%2$d damage per living beast of his pack, plus one_ (now %3$d beasts: _%4$d damage_) and is stunned for 1 turn. His wolves are fully healed.
soulknight.beastmaster.stampede.desc_short=a stampede in a cone, stronger the more beasts are alive.
soulknight.beastmaster.stampede.prompt=Choose where to send the stampede
soulknight.beastmaster.stampede.no_target=There are no enemies there.

###armor ability
soulknight.beastmaster.packroar.name=pack roar
soulknight.beastmaster.packroar.short_desc=A roar that stuns the enemies, heals the allies and enrages his beasts.
soulknight.beastmaster.packroar.desc=The Beastmaster roars with his whole pack: the enemies around are stunned for 2 turns (bosses are only weakened), the allies are healed and his wolves and bear grow ferocious (25% more damage).
soulknight.beastmaster.packroar.desc_numbers=Radius: _%1$d cells_. Healing: _%2$d%%_. Ferocity: _%3$d turns_.
soulknight.beastmaster.packroar$ferocity.name=ferocity
soulknight.beastmaster.packroar$ferocity.desc=This beast is furious: it deals 25%% more damage.\n\nTurns left: %s.
