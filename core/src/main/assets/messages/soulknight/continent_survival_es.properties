###el Continente oscuro: sobrevivir allí
soulknight.continent.survival.survival.first=Cada uno lleva un kit de fogata. Junto al fuego se cocina, se fabrica y se descansa; pero su luz se ve desde muy lejos.
soulknight.continent.survival.survival.first_coop=No os separéis. Aquí, quien se aleja del grupo no vuelve solo.

soulknight.continent.survival.tether.name=Solo en la oscuridad
soulknight.continent.survival.tether.desc=Estás a más de %d pasos del compañero más cercano y la oscuridad se te ha cerrado encima: casi no ves, la corrupción se te mete dentro y algo viene a por ti.\n\nVuelve con el grupo y te soltará.\n\nTurnos solo: %d.
soulknight.continent.survival.tether.alone=¡solo!
soulknight.continent.survival.tether.lost=La oscuridad te envuelve: te has alejado demasiado del grupo. Vuelve antes de que algo te encuentre.
soulknight.continent.survival.tether.friend_lost=%s se ha alejado del grupo y la oscuridad se lo ha tragado.
soulknight.continent.survival.tether.back=Vuelves con el grupo. La oscuridad te suelta.
soulknight.continent.survival.tether.banner=Estás solo en la oscuridad. ¡Vuelve con el grupo!

soulknight.continent.survival.stalker.name=acechador de la oscuridad
soulknight.continent.survival.stalker.desc=Una forma más negra que la noche que la rodea, que solo viene a por quien anda solo. Es más rápida que tú y cada mordisco deja corrupción.\n\nSe puede pelear con ella, pero lo seguro es volver con los demás: entonces, sencillamente, ya no está.
soulknight.continent.survival.stalker.comes=Algo te ha olido en la oscuridad, y viene.
soulknight.continent.survival.stalker.fades=La forma que te cazaba se deshace en la oscuridad.

soulknight.continent.survival.campfire.name=fogata
soulknight.continent.survival.campfire.desc=Un fuego pequeño en medio de la ceniza. Descansar a su lado cura y aparta la corrupción, y aquí se puede cocinar y fabricar.\n\nSu luz se ve desde muy lejos: no seréis los únicos que vengan.\n\nArderá unos %d turnos más.
soulknight.continent.survival.campfire.desc_out=Solo brasas y un hilo de humo. Con una antorcha volvería a arder.
soulknight.continent.survival.campfire.out=La fogata se apaga.

soulknight.continent.survival.campfirekit.name=kit de fogata
soulknight.continent.survival.campfirekit.desc=Tres palos atados, un pedernal y un puñado de yesca. Déjalo en el suelo y tendrás fuego para un buen rato.\n\nJunto al fuego se descansa, se cocina y se fabrica. Pero aquí la luz atrae.
soulknight.continent.survival.campfirekit.ac_place=MONTAR
soulknight.continent.survival.campfirekit.no_room=Aquí no cabe una fogata: hace falta terreno abierto alrededor.
soulknight.continent.survival.campfirekit.building=Apilas la leña y golpeas el pedernal.

soulknight.continent.survival.wndcampfire.burning=Arde con fuerza: le quedan unos %d turnos.\nDescansar a su lado cura y aparta la corrupción; su luz se ve desde lejos.
soulknight.continent.survival.wndcampfire.embers=Solo quedan brasas. Échale una antorcha y volverá a arder.
soulknight.continent.survival.wndcampfire.cook=Cocinarlo todo (%d)
soulknight.continent.survival.wndcampfire.feed=Echar una antorcha (tienes %d)
soulknight.continent.survival.wndcampfire.make=Fabricar
soulknight.continent.survival.wndcampfire.close=Cerrar

soulknight.continent.survival.firerecipes.kit=Kit de fogata: 2 antorchas
soulknight.continent.survival.firerecipes.torches=2 antorchas: 1 hueso de coloso
soulknight.continent.survival.firerecipes.bait=Cebo: 1 carne cruda (de coloso o corrupta)
soulknight.continent.survival.firerecipes.poultice=Cataplasma: 2 de comida corrupta
soulknight.continent.survival.firerecipes.sacred_torch=Antorcha de luz sagrada: 1 antorcha (encenderla cuesta esencia)
soulknight.continent.survival.firerecipes.made=Fabricas: %s.
soulknight.continent.survival.firerecipes.cooked=Cocinas %d trozos de comida al fuego. La oscuridad se les va al arder.
soulknight.continent.survival.firerecipes.fed=El fuego se traga la antorcha y crece.

soulknight.continent.survival.sacredtorch.name=antorcha de luz sagrada
soulknight.continent.survival.sacredtorch.desc=Una antorcha envuelta en tela blanca, aún sin encender. Encenderla quema una gota de la esencia sagrada del grupo: entonces brilla un buen rato, %d pasos de luz de lado a lado, los monstruos no se acercan a quien la lleva y los yogs huyen.\n\nCuando se apaga, esa esencia se ha perdido para siempre.\n\nTenéis %d de %d.
soulknight.continent.survival.sacredtorch.ac_light=ENCENDER
soulknight.continent.survival.sacredtorch.confirm=Encenderla quema UNA gota de la esencia sagrada del grupo (tenéis %d de %d). Cuando la antorcha se apague, esa gota se habrá perdido para siempre.\n\n¿La enciendes?
soulknight.continent.survival.sacredtorch.yes=Sacrificar la esencia
soulknight.continent.survival.sacredtorch.no=Ahora no
soulknight.continent.survival.sacredtorch.no_essence=No os queda esencia sagrada que quemar.
soulknight.continent.survival.sacredtorch.already=Ya llevas una luz sagrada.
soulknight.continent.survival.sacredtorch.lit=¡La luz sagrada se enciende! La oscuridad retrocede. Esencia que os queda: %d de %d.

soulknight.continent.survival.sacredlight.name=Luz sagrada
soulknight.continent.survival.sacredlight.desc=Llevas una luz sagrada: ves lejos, los monstruos no se te acercan y los yogs huyen de ella.\n\nArderá %d turnos más. Cuando se apague, su esencia se pierde.
soulknight.continent.survival.sacredlight.out=La luz sagrada se apaga. La gota de esencia que ardía en ella se ha perdido.

soulknight.continent.survival.colossusmeat$raw.name=carne cruda de coloso
soulknight.continent.survival.colossusmeat$raw.desc=Un pedazo enorme de algo que caminaba sobre la ceniza, con hueso y todo. Cruda llena, pero la oscuridad entra con ella. Asada al fuego es la mejor comida de por aquí.
soulknight.continent.survival.colossusmeat$roast.name=carne de coloso asada
soulknight.continent.survival.colossusmeat$roast.desc=Carne de coloso dorada al fuego, con toda la grasa crujiente. Las llamas le han quemado la oscuridad: una comida de verdad.

soulknight.continent.survival.colossusbone.name=hueso de coloso
soulknight.continent.survival.colossusbone.desc=Un hueso largo de uno de los grandes, lleno de un tuétano que arde despacio. Junto a una fogata salen dos antorchas de él.

soulknight.continent.survival.bait.name=cebo
soulknight.continent.survival.bait.desc=Un trozo de carne atado con un cordel y untado en sangre. Lánzalo: lo que tenga hambre cerca irá a ver qué es. Sirve para quitarle monstruos de encima a alguien, o para apartarlos de donde quieres pasar.

soulknight.continent.survival.poultice.name=cataplasma
soulknight.continent.survival.poultice.desc=Comida corrupta hervida hasta que la oscuridad se le fue. Lo que queda es una pasta caliente: en una herida la cierra en unos turnos y saca un poco de corrupción.
soulknight.continent.survival.poultice.ac_apply=APLICAR
soulknight.continent.survival.poultice.applied=La pasta escuece y luego calienta. La herida empieza a cerrarse.
soulknight.continent.hunt.climbing.name=Encaramado
soulknight.continent.hunt.climbing.desc=Estás en el lomo de un coloso. Tus golpes van a su punto débil. Cada turno pierdes algo de agarre y mucho cuando se sacude; sin agarre, te caes. Toca el suelo fuera de su cuerpo para saltar.
soulknight.continent.hunt.climbing.up=Te agarras al lomo de %s.
soulknight.continent.hunt.climbing.shaken=¡%s se sacude para tirarte!
soulknight.continent.hunt.climbing.fell=Te resbalas y caes de %s.
soulknight.continent.hunt.mutations.name=Mutaciones
soulknight.continent.hunt.mutations.desc=Lo que te han dejado las partes de coloso que has comido.
soulknight.continent.hunt.mutations.again=Ya llevas esto dentro. Solo te alimenta.
soulknight.continent.hunt.mutations.sick=Tu cuerpo lo lleva mal un rato.
soulknight.continent.hunt.mutationpart.desc=Comerla tiene casi siempre premio, pero el cuerpo a veces lo lleva mal un rato.
soulknight.continent.hunt.mutationpart.eat_msg=Te lo comes. Algo cambia dentro de ti.
soulknight.continent.hunt.bonegrapple.name=garfio de hueso
soulknight.continent.hunt.bonegrapple.desc=Un gancho de hueso atado a una cuerda. Lánzalo desde el lado de uno de los grandes (de 8×8 o más) para subir a su lomo. Desde allí tus golpes van a su punto débil. No se gasta.
soulknight.continent.hunt.bonegrapple.ac_climb=TREPAR
soulknight.continent.hunt.bonegrapple.prompt=¿A cuál trepas?
soulknight.continent.hunt.bonegrapple.already=Ya estás arriba. Toca el suelo para saltar.
soulknight.continent.hunt.bonegrapple.nothing=Ahí no hay nada lo bastante grande para trepar.
soulknight.continent.hunt.bonegrapple.far=Tienes que estar pegado a su cuerpo.
soulknight.continent.hunt.lightcollar.name=collar de luz sagrada
soulknight.continent.hunt.lightcollar.desc=Una banda de luz sagrada. Puesta a una de las bestias que se dejan domar, es del grupo para siempre (solo una a la vez). Cada una pide algo: la tortuga, comer (2 asados de coloso); el bisonte, que lo libres de sus pulgas; el rex, que lo derribes sin matarlo; la tarántula, que le pagues 1 esencia; el alce de raíces, que no te haya visto (y sin luz encima); el guardia de bronce, que le rompas la armadura (un tercio o menos); el alce de hielo, que lo derribes; el coloso sin piel, carne cruda de coloso; el cangrejo-faro, una antorcha sagrada para su linterna.
soulknight.continent.hunt.lightcollar.ac_tame=DOMAR
soulknight.continent.hunt.lightcollar.prompt=¿A cuál se lo pones?
soulknight.continent.hunt.lightcollar.wild=Esa bestia no se deja domar.
soulknight.continent.hunt.lightcollar.far=Tienes que estar pegado a ella.
soulknight.continent.hunt.lightcollar.one=El grupo ya tiene una bestia domada.
soulknight.continent.hunt.colossusforge.name=forja de coloso
soulknight.continent.hunt.colossusforge.desc=Una fragua de fuego sagrado con un yunque de vértebra de coloso. Con huesos de coloso mejora tu arma o tu armadura un nivel; cada vez que vuelve al yunque, cuesta un hueso más.
soulknight.continent.hunt.colossusforge.forged=El fuego sagrado funde el hueso en tu %s.
soulknight.continent.hunt.colossusforge$wndforge.text=Tienes %d huesos de coloso.
soulknight.continent.hunt.colossusforge$wndforge.forge=Reforjar %s (%d huesos)
soulknight.continent.hunt.colossusforge$wndforge.none=(nada equipado)
soulknight.continent.hunt.colossusforge$wndforge.close=Cerrar
soulknight.continent.survival.firerecipes.grapple=Garfio de hueso: 1 hueso de coloso
soulknight.continent.survival.firerecipes.collar=Collar de luz sagrada: 2 antorchas y 1 hueso de coloso
soulknight.continent.hunt.mutationpart.name_0=corazón de brasa
soulknight.continent.hunt.mutationpart.desc_0=El corazón de la Pira Andante, que aún arde por dentro.
soulknight.continent.hunt.mutations.gift_0=El fuego ya no te muerde, y a veces tus golpes prenden.
soulknight.continent.hunt.mutationpart.name_1=vértebra de la nuca
soulknight.continent.hunt.mutationpart.desc_1=Un trozo de la nuca del gigante de escoria, con tuétano fundido.
soulknight.continent.hunt.mutations.gift_1=Te crece la espalda: eres más fuerte (+1 de fuerza).
soulknight.continent.hunt.mutationpart.name_2=placa de chimenea
soulknight.continent.hunt.mutationpart.desc_2=Una placa del cráter de la tortuga volcán, todavía caliente.
soulknight.continent.hunt.mutations.gift_2=Te sale una costra de piedra bajo la piel: aguantas más los golpes.
soulknight.continent.hunt.mutationpart.name_3=branquia
soulknight.continent.hunt.mutationpart.desc_3=Una branquia de la ballena de ceniza, que filtra la ceniza del aire.
soulknight.continent.hunt.mutations.gift_3=Respiras la ceniza sin toser y tus ojos se acostumbran a la oscuridad: ves algo más lejos.
soulknight.continent.hunt.mutationpart.name_4=huevo de tarántula
soulknight.continent.hunt.mutationpart.desc_4=Un huevo del saco de la tarántula de ceniza. Algo se mueve dentro.
soulknight.continent.hunt.mutations.gift_4=Te sale un hilo pegajoso de las manos: a veces tus golpes dejan al enemigo enredado.
soulknight.continent.hunt.mutationpart.name_5=glándula de fuego
soulknight.continent.hunt.mutationpart.desc_5=La bolsa de la garganta del rex picudo, llena de aceite que arde.
soulknight.continent.hunt.mutations.gift_5=La sangre te arde: pegas más fuerte.
soulknight.continent.hunt.mutationpart.name_6=esquirla de obsidiana
soulknight.continent.hunt.mutationpart.desc_6=Un trozo del caparazón del coloso de obsidiana, afilado como un espejo roto.
soulknight.continent.hunt.mutations.gift_6=Tu piel se vuelve vidrio en los bordes: quien te golpea de cerca se corta.
soulknight.continent.hunt.mutationpart.name_7=cuerno de bisonte
soulknight.continent.hunt.mutationpart.desc_7=Un cuerno de basalto de un bisonte de las llanuras.
soulknight.continent.hunt.mutations.gift_7=Te endureces como la manada: tienes más vida máxima.
soulknight.continent.hunt.mutationpart.name_8=pico de escarabajo
soulknight.continent.hunt.mutationpart.desc_8=El cuerno del escarabajo fundidor, que corta metal caliente.
soulknight.continent.hunt.mutations.gift_8=Sabes dónde golpear a lo grande: los derribas antes.
soulknight.continent.hunt.mutationpart.name_9=gola de salamandra
soulknight.continent.hunt.mutationpart.desc_9=La bolsa de la garganta de una salamandra de lava negra.
soulknight.continent.hunt.mutations.gift_9=La lava negra ya no te quema.
soulknight.continent.hunt.mutationpart.name_10=cabeza de cabra cosida
soulknight.continent.hunt.mutationpart.desc_10=La cabeza de cabra de la quimera de carne, con los ojos cosidos. Nunca se puso de acuerdo con las otras dos.
soulknight.continent.hunt.mutations.gift_10=Tu cabeza deja de hacer caso al resto de ti: ya nada la marea ni la asusta.
soulknight.continent.hunt.mutations.sick_10=Los puntos tiran: los brazos se te quedan sin fuerza un rato.
soulknight.continent.hunt.mutationpart.name_11=panal de carne
soulknight.continent.hunt.mutationpart.desc_11=Un trozo de la colmena del jabalí, aún caliente. Algo zumba en las celdas.
soulknight.continent.hunt.mutations.gift_11=Avispas de carne anidan bajo tu piel: a quien te pega de cerca a veces le pican.
soulknight.continent.hunt.mutations.sick_11=Las avispas te pican al entrar.
soulknight.continent.hunt.mutationpart.name_12=costilla del hueco
soulknight.continent.hunt.mutationpart.desc_12=Una costilla del pecho vacío del oso hueco. Está fría, y algo al otro lado se agarra a ella.
soulknight.continent.hunt.mutations.gift_12=Se te abre un hueco: a veces salen de él manos pálidas y sujetan a quien te pega de cerca.
soulknight.continent.hunt.mutations.sick_12=El hueco tiene hambre, y tú también.
soulknight.continent.hunt.mutationpart.name_13=ojo del asta
soulknight.continent.hunt.mutationpart.desc_13=Uno de los ojos que cuelgan como fruta de las astas del alce de raíces. Parpadea.
soulknight.continent.hunt.mutations.gift_13=Se te abren ojos en la piel: ves mucho más lejos en la oscuridad.
soulknight.continent.hunt.mutations.sick_13=Todos los ojos de tu piel gritan a la vez. Todo lo que hay cerca lo ha oído.
soulknight.continent.hunt.mutationpart.name_14=flor dentada
soulknight.continent.hunt.mutationpart.desc_14=Un pétalo de la flor que se abre en el cuello de la jirafa infectada, con dientes y todo.
soulknight.continent.hunt.mutations.gift_14=Tus golpes dejan esporas en la herida: a menudo el enemigo se debilita.
soulknight.continent.hunt.mutations.sick_14=Las esporas van primero a por ti.
soulknight.continent.hunt.mutationpart.name_15=nudo de la aorta
soulknight.continent.hunt.mutationpart.desc_15=El nudo de venas de la base de la aorta del corazón del bosque. Aún late en tu mano.
soulknight.continent.hunt.mutations.gift_15=Te late un segundo corazón: más vida máxima, y las heridas se te cierran solas.
soulknight.continent.hunt.mutations.sick_15=Dos corazones a destiempo: la cabeza te da vueltas.
soulknight.continent.hunt.mutationpart.name_16=buche hinchado
soulknight.continent.hunt.mutationpart.desc_16=El buche del pordiosero hinchado, tirante del gas de todo lo que comió.
soulknight.continent.hunt.mutations.gift_16=Tus tripas lo aguantan todo: el veneno y los gases ya no te hacen daño.
soulknight.continent.hunt.mutations.sick_16=Te hinchas un rato y apenas puedes moverte.
soulknight.continent.hunt.mutationpart.name_17=placa de bronce
soulknight.continent.hunt.mutationpart.desc_17=Una placa de la armadura del guardia de bronce, verde de vieja.
soulknight.continent.hunt.mutations.gift_17=El bronce te crece en la piel: los golpes te duelen menos y ya no sangras.
soulknight.continent.hunt.mutations.sick_17=La placa te pilla una articulación: cojeas un rato.
soulknight.continent.hunt.mutationpart.name_18=eje vivo
soulknight.continent.hunt.mutationpart.desc_18=El eje de la carroza viva, un hueso que giró durante años.
soulknight.continent.hunt.mutations.gift_18=Nada te frena: ya no te pueden ralentizar, lisiar ni sujetar.
soulknight.continent.hunt.mutations.sick_18=Todo gira a tu alrededor un rato.
soulknight.continent.hunt.mutationpart.name_19=labio cosido
soulknight.continent.hunt.mutationpart.desc_19=El labio del encadenado, aún cosido con tripa de yog.
soulknight.continent.hunt.mutations.gift_19=Aprendes su silencio: cuesta mucho más darse cuenta de que estás.
soulknight.continent.hunt.mutations.sick_19=La boca se te cierra un rato: pasas hambre.
soulknight.continent.hunt.mutationpart.name_20=crisol
soulknight.continent.hunt.mutationpart.desc_20=La boca de la madre fundidora, un crisol de latón con metal fundido aún dentro.
soulknight.continent.hunt.mutations.gift_20=Te corre metal fundido por las venas: tus golpes queman y el fuego te muerde menos.
soulknight.continent.hunt.mutations.sick_20=El metal pesa: los brazos se te quedan sin fuerza un rato.
soulknight.continent.hunt.mutationpart.name_21=campana del horno
soulknight.continent.hunt.mutationpart.desc_21=Una campana de la torre de la catedral-horno, todavía caliente del fuego de dentro.
soulknight.continent.hunt.mutations.gift_21=El fuego ya no te muerde, y cuando estás a punto de caer suena una campana dentro de ti: quien esté cerca huye.
soulknight.continent.hunt.mutations.sick_21=La campana no para de sonar en tu cabeza.
soulknight.continent.hunt.mutationpart.name_22=corona hundida
soulknight.continent.hunt.mutationpart.desc_22=La corona del último rey, hundida en la carne de su cabeza.
soulknight.continent.hunt.mutations.gift_22=La fuerza de la ciudad pasa a ti: eres mucho más fuerte (+2 de fuerza).
soulknight.continent.hunt.mutations.sick_22=El peso de la corona: los brazos se te quedan sin fuerza un buen rato.
soulknight.continent.hunt.mutationpart.name_23=músculo helado
soulknight.continent.hunt.mutationpart.desc_23=Una tira del músculo helado del mamut desollado. No se descongela nunca.
soulknight.continent.hunt.mutations.gift_23=El frío ya no te entra: no te pueden helar ni congelar.
soulknight.continent.hunt.mutations.sick_23=Los músculos se te quedan rígidos un rato.
soulknight.continent.hunt.mutationpart.name_24=garra en hoz
soulknight.continent.hunt.mutationpart.desc_24=La garra en hoz del raptor de escarcha, tan afilada que raspa el hielo.
soulknight.continent.hunt.mutations.gift_24=Las uñas se te curvan y afilan: tus golpes dejan al enemigo sangrando a menudo.
soulknight.continent.hunt.mutations.sick_24=La garra te sale antes en el pie: cojeas un rato.
soulknight.continent.hunt.mutationpart.name_25=asta de hielo
soulknight.continent.hunt.mutationpart.desc_25=Una punta de las astas de hielo claro del alce.
soulknight.continent.hunt.mutations.gift_25=Tus golpes llevan la escarcha: a menudo dejan al enemigo helado.
soulknight.continent.hunt.mutations.sick_25=El frío te atraviesa primero a ti.
soulknight.continent.hunt.mutationpart.name_26=membrana del ala
soulknight.continent.hunt.mutationpart.desc_26=Un trozo roto del ala del wyvern corrupto, con costra de escarcha.
soulknight.continent.hunt.mutations.gift_26=Te mueves ligero como el viento: los golpes te fallan más.
soulknight.continent.hunt.mutations.sick_26=Sientes que el suelo se te va de debajo.
soulknight.continent.hunt.mutationpart.name_27=corazón de glaciar
soulknight.continent.hunt.mutationpart.desc_27=Un bloque de hielo azul de muy dentro de la montaña que camina.
soulknight.continent.hunt.mutations.gift_27=La carne se te endurece como hielo viejo: cada golpe que recibes pesa menos y no te pueden congelar.
soulknight.continent.hunt.mutations.sick_27=El hielo te vuelve lento un rato.
soulknight.continent.hunt.mutationpart.name_28=escarcha del pastor
soulknight.continent.hunt.mutationpart.desc_28=Escarcha que no se derrite, sacada del manto con capucha del pastor.
soulknight.continent.hunt.mutations.gift_28=La ventisca camina contigo: el frío no te toca, quien te pega de cerca se hiela y ves más lejos.
soulknight.continent.hunt.mutations.sick_28=El frío se come lo que tenías dentro.
soulknight.continent.hunt.mutationpart.name_29=cráneo cornudo
soulknight.continent.hunt.mutationpart.desc_29=El cráneo grande de la quimera de huesos, con una luz débil aún en la cuenca.
soulknight.continent.hunt.mutations.gift_29=La mandíbula y los brazos se te quedan con algo de su mordisco: pegas más fuerte.
soulknight.continent.hunt.mutations.sick_29=Su rugido te da vueltas en la cabeza.
soulknight.continent.hunt.mutationpart.name_30=garra de pala
soulknight.continent.hunt.mutationpart.desc_30=Una garra de pala de hueso del excavador de costillas, de las que cavan entre esqueletos.
soulknight.continent.hunt.mutations.gift_30=Sabes dónde están los buenos huesos: cada grande que cae cerca de ti deja uno más.
soulknight.continent.hunt.mutations.sick_30=Los ojos se te quedan ciegos como los de un topo un rato.
soulknight.continent.hunt.mutationpart.name_31=espinazo pelado
soulknight.continent.hunt.mutationpart.desc_31=Un trozo del espinazo pelado del coloso sin piel. Incluso así tiene hambre.
soulknight.continent.hunt.mutations.gift_31=Te quedas con su hambre: la carne de coloso ya no te trae la oscuridad y te cura las heridas.
soulknight.continent.hunt.mutations.sick_31=Su hambre te llega de golpe.
soulknight.continent.hunt.mutationpart.name_32=lágrima de niebla
soulknight.continent.hunt.mutationpart.desc_32=Una lágrima de niebla amarilla de las cuencas vacías del plañidero, que se aguanta en una piel de sí misma.
soulknight.continent.hunt.mutations.gift_32=Aprendes a llorar a los muertos: lo que mata tu golpe te devuelve algo de vida.
soulknight.continent.hunt.mutations.sick_32=Las lágrimas te ciegan un rato.
soulknight.continent.hunt.mutationpart.name_33=alma del costillar
soulknight.continent.hunt.mutationpart.desc_33=El alma que brillaba dentro de las costillas del Último en Pie. Sigue sin querer tumbarse.
soulknight.continent.hunt.mutations.gift_33=Tú tampoco caerás: de tanto en tanto, un golpe que te mataría te deja en pie.
soulknight.continent.hunt.mutations.sick_33=El alma vieja trae consigo la oscuridad del cementerio.
soulknight.continent.hunt.mutationpart.name_34=saco de tinta
soulknight.continent.hunt.mutationpart.desc_34=El saco de la anguila de tinta, negro y lleno.
soulknight.continent.hunt.mutations.gift_34=Tus ojos se acostumbran a la tinta: ya nada te puede cegar.
soulknight.continent.hunt.mutations.sick_34=La tinta quema al bajar.
soulknight.continent.hunt.mutationpart.name_35=cristal del faro
soulknight.continent.hunt.mutationpart.desc_35=Un cristal de la linterna del cangrejo-faro, aún tibio de luz.
soulknight.continent.hunt.mutations.gift_35=Tus golpes echan destellos: a veces ciegan al enemigo.
soulknight.continent.hunt.mutations.sick_35=El destello te da en tus propios ojos.
soulknight.continent.hunt.mutationpart.name_36=placa de yog
soulknight.continent.hunt.mutationpart.desc_36=Una placa brillante de carne de yog del manto del pulpo de marea.
soulknight.continent.hunt.mutations.gift_36=Tu cuerpo aprende a ser yog: la corrupción te entra la mitad de rápido.
soulknight.continent.hunt.mutations.sick_36=Antes de eso, la carne de yog te deja algo de su oscuridad.
soulknight.continent.hunt.mutationpart.name_37=piel de isla
soulknight.continent.hunt.mutationpart.desc_37=Un trozo del lomo del lagarto-isla: tierra de yog, raíces y un párpado cerrado.
soulknight.continent.hunt.mutations.gift_37=Quieto pareces terreno: es muy difícil darse cuenta de que estás.
soulknight.continent.hunt.mutations.sick_37=La piel se te vuelve tierra un rato y te pesa.
soulknight.continent.hunt.mutationpart.name_38=ojo verdadero
soulknight.continent.hunt.mutationpart.desc_38=Un trozo del gran ojo de yog en su forma verdadera. Te devuelve la mirada.
soulknight.continent.hunt.mutations.gift_38=Ves como ve yog: mucho más lejos en la oscuridad, y nada te puede cegar, marear ni asustar.
soulknight.continent.hunt.mutations.sick_38=Yog te mira desde dentro. La oscuridad crece.
soulknight.continent.hunt.mutationpart.name_39=boca de lamprea
soulknight.continent.hunt.mutationpart.desc_39=Un anillo de dientes de la boca del gusano ciego.
soulknight.continent.hunt.mutations.gift_39=Tus golpes beben: algo de la vida que quitan pasa a ti.
soulknight.continent.hunt.mutations.sick_39=Sin ojos, como el gusano, un rato.
soulknight.continent.hunt.mutations.bell=Suena una campana dentro de ti: ¡quien estaba cerca huye!
soulknight.continent.hunt.mutations.soul=¡El alma de tus costillas no te deja caer!
