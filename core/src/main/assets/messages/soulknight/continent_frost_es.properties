soulknight.continent.frost.fauna.frostfauna.name=páramo

soulknight.continent.frost.fauna.frosthare.name=liebre de escarcha
soulknight.continent.frost.fauna.frosthare.desc=Pelo gris apelmazado de escarcha, orejas largas y un ojo rojo. Inofensiva: huye. Pero la primera que te ve _se pone de pie y chilla_, y todo lo que caza por aquí la oye.
soulknight.continent.frost.fauna.frosthare.shriek=Una liebre se alza y chilla. Lo ha oído todo el páramo.

soulknight.continent.frost.fauna.icecrow.name=cuervo de hielo
soulknight.continent.frost.fauna.icecrow.desc=Plumas negras con las puntas escarchadas, pico de hielo claro y ojo rojo. Vuela por encima de todo y _grazna al que encuentra_ (el páramo escucha). El pico abre heridas.

soulknight.continent.frost.fauna.blindwolf.name=lobo ciego
soulknight.continent.frost.fauna.blindwolf.desc=Flaco, de pelo oscuro escarchado, con el espinazo marcado y _ojos lechosos que no ven nada_: una antorcha no sirve contra ellos, ni a ellos. Cazan _en jauría y solo por el oído_. Lo que oye uno va toda la jauría a verlo; quédate quieto y callado y puede que pasen de largo.

soulknight.continent.frost.fauna.icelarva.name=larva de hielo
soulknight.continent.frost.fauna.icelarva.desc=Anillos azul claro que dejan ver la tripa oscura, y pinzas negras. Espera _enterrada en la nieve_ y sale bajo el que pisa a su lado (ese primer mordisco hiela, pero nunca mata). Si la dejan tranquila un rato, se vuelve a enterrar.

soulknight.continent.frost.fauna.blackicemantis.name=mantis de hielo negro
soulknight.continent.frost.fauna.blackicemantis.desc=Facetas de hielo negro con aristas blancas, cuatro patas de cristal y dos guadañas dentadas. No vaga: _espera inmóvil con las guadañas en alto_, y al que se acerca se las baja por una franja marcada delante. Su punto débil es la cabeza.

soulknight.continent.frost.fauna.sealwolf.name=foca-lobo
soulknight.continent.frost.fauna.sealwolf.desc=Cuerpo de foca con el pelo escarchado y calvas en carne viva, y cabeza de lobo. Espera _bajo el agua negra de un agujero en el hielo_ y sale a por el que pasa por el borde: ese mordisco duele pero nunca mata. Luego pelea en tierra y, si no queda nadie, vuelve abajo.

soulknight.continent.frost.fauna.iceelk.name=alce de cuernos de hielo
soulknight.continent.frost.fauna.iceelk.desc=Pelo oscuro escarchado, astas de hielo claro y el morro manchado de sangre. Pasta y te deja en paz, hasta que le hacen daño o te le acercas demasiado: entonces _brama_ (viene la manada) y _carga por un carril marcado_, de punta a punta. Su punto débil es la cruz del lomo. _Derribado, se deja poner el collar._
soulknight.continent.frost.fauna.iceelk.standing=Tiene que estar derribado para dejarse poner el collar.

soulknight.continent.frost.fauna.flayedmammoth.name=mamut desollado
soulknight.continent.frost.fauna.flayedmammoth.desc=Sin piel: músculo congelado, colmillos de hueso, trompa pelada y un ojo ciego. Se guía por el oído. _Barre con los colmillos_ una franja marcada delante y lanza al que pilla, o alza la trompa y _barrita_: el aire helado golpea todo a su alrededor (se marca) y te deja la cabeza dando vueltas.

soulknight.continent.frost.fauna.frostraptor.name=raptor de escarcha
soulknight.continent.frost.fauna.frostraptor.desc=Un bípedo grande de plumón gris escarchado con cresta de esquirlas de hielo y garra en hoz. Cazan _en manadas de dos o tres_: cuando uno te ve vienen todos, y cada uno _salta sobre una zona marcada_ donde estás y desgarra lo que siga allí.

soulknight.continent.frost.fauna.corruptwyvern.name=wyvern corrupto
soulknight.continent.frost.fauna.corruptwyvern.epithet=la sombra sobre la nieve
soulknight.continent.frost.fauna.corruptwyvern.desc=Escamas de pizarra con costras de escarcha y heridas abiertas, alas de membrana rota. _Vuela en círculos_ sobre su presa, fuera del alcance de cualquier espada, mientras _su sombra corre por la nieve_. Luego se queda sobre un punto (el suelo se marca) y _cae en picado_. Abajo se queda unos turnos echando escarcha por la boca: es cuando se le puede herir.
soulknight.continent.frost.fauna.corruptwyvern.dives=La sombra del wyvern se para sobre ti. ¡Cae en picado!
soulknight.continent.frost.fauna.corruptwyvern.takes_off=El wyvern bate las alas rotas y vuelve a levantar el vuelo.

soulknight.continent.frost.fauna.walkingmountain.name=montaña que camina
soulknight.continent.frost.fauna.walkingmountain.epithet=el glaciar que anda
soulknight.continent.frost.fauna.walkingmountain.desc=Un glaciar con patas: tres picos nevados, lenguas de hielo azul y _una aldea congelada_ en un rellano del lomo. No hace caso a nadie _hasta que le hacen daño_. Entonces da un pisotón en una franja marcada delante o se sacude y _baja un alud_ por sus flancos alrededor. A la aldea se puede trepar: allí arriba sus golpes no te alcanzan, pero se sacude.
soulknight.continent.frost.fauna.walkingmountain.angry=La montaña se para. La nieve le cae de los picos mientras se vuelve hacia ti.

soulknight.continent.frost.fauna.frostshepherd.name=el Pastor de la Escarcha
soulknight.continent.frost.fauna.frostshepherd.epithet=guardián del páramo helado
soulknight.continent.frost.fauna.frostshepherd.desc=Un gigante alto de piel gris azulada bajo un manto de piel con capucha, con un _cayado de hueso con gancho_ y su rebaño congelado en bloques de hielo a los pies. Las bestias del páramo que andan con él _acuden cuando las llama_. Clava el cayado y _un abanico de púas de hielo_ sale del suelo, o lo alza y _trae la ventisca_: caen rachas sobre todos los que ve. Todo se marca. Pégale en la mano del cayado.
soulknight.continent.frost.fauna.frostshepherd.calls=El Pastor alza el cayado. Su rebaño se vuelve hacia ti.
soulknight.continent.frost.fauna.frostshepherd.sees=El Pastor de la Escarcha levanta la cabeza bajo la capucha.
