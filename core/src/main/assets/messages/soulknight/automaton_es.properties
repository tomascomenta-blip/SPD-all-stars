#Autómata (es)

###clase
actors.hero.heroclass.automaton=autómata
actors.hero.heroclass.automaton_desc_short=El _Autómata_ es una máquina de guerra muy blindada: electrocuta a los enemigos cercanos, suelta drones de combate y su pulso electromagnético destruye las balas enemigas.
actors.hero.heroclass.automaton_desc=Una máquina de guerra que despertó en la nave caída entre las cuevas; nadie recuerda quién la construyó, pero sigue cumpliendo sus órdenes. El Autómata empieza con un _núcleo de control_, que le da _Sobrecarga eléctrica_, _Enjambre de drones_, _PEM_ y el _Protocolo Omega_ (desde el nivel 6).\n\nSu pasiva, el _chasis blindado_: gana armadura extra que crece con su nivel, y las balas de los monstruos de los mundos alternativos solo le hacen _la mitad de daño_.\n\nTambién empieza con una _llave de tuercas_, un _cañón satélite_ (un arma de fuego que se usa como una varita), armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de curación\n_-_ Pergaminos de recarga\n\nEs una máquina: _nunca tiene hambre_.
actors.hero.heroclass.automaton_unlock=Los campeones están desbloqueados desde el principio.

###subclases
actors.hero.herosubclass.swarm_engineer=ingeniero de enjambre
actors.hero.herosubclass.swarm_engineer_short_desc=El _Ingeniero de enjambre_ lanza un dron más, y sus drones aguantan y pegan más.
actors.hero.herosubclass.swarm_engineer_desc=El Enjambre de drones suelta _3 drones_ en vez de 2. Sus talentos alargan la vida de los drones, los blindan y aumentan su daño.
actors.hero.herosubclass.tesla_coil=bobina Tesla
actors.hero.herosubclass.tesla_coil_short_desc=La _Bobina Tesla_ electrocuta a muchos más enemigos a la vez.
actors.hero.herosubclass.tesla_coil_desc=La Sobrecarga eléctrica alcanza a _4 enemigos_ en vez de 2, y el Protocolo Omega hace _2 de daño más_. Sus talentos encadenan más descargas, aturden y recortan los enfriamientos al matar.

###talentos del Autómata
actors.hero.talent.aut_coolant.title=refrigerante
actors.hero.talent.aut_coolant.desc=_+1:_ Al comer, el cañón satélite recupera _1 carga_ (puede pasar de su máximo).\n\n_+2:_ Recupera _2 cargas_.
actors.hero.talent.aut_diagnostics.title=diagnóstico
actors.hero.talent.aut_diagnostics.desc=_+1:_ El Autómata identifica armaduras, varitas y armas de fuego _1,75 veces más rápido_.\n\n_+2:_ Las identifica _2,5 veces más rápido_.
actors.hero.talent.aut_plating.title=blindaje reforzado
actors.hero.talent.aut_plating.desc=_+1:_ El chasis blindado da hasta _1 de armadura más_.\n\n_+2:_ Hasta _2 más_.
actors.hero.talent.aut_capacitor.title=condensador
actors.hero.talent.aut_capacitor.desc=_+1:_ La Sobrecarga eléctrica dura _1 turno más_.\n\n_+2:_ Dura _2 turnos más_.
actors.hero.talent.aut_self_repair.title=autorreparación
actors.hero.talent.aut_self_repair.desc=_+1:_ Cada habilidad del núcleo de control lo cura _2 PS_.\n\n_+2:_ Lo cura _3 PS_.
actors.hero.talent.aut_scanner.title=escáner
actors.hero.talent.aut_scanner.desc=_+1:_ Detecta a los enemigos a _2 casillas_ o menos, aunque haya paredes en medio.\n\n_+2:_ A _3 casillas_ o menos.
actors.hero.talent.aut_overclock.title=overclock
actors.hero.talent.aut_overclock.desc=_+1:_ Los enfriamientos del núcleo de control son un _10% más cortos_.\n\n_+2:_ Un _20% más cortos_.
actors.hero.talent.aut_grounding.title=toma de tierra
actors.hero.talent.aut_grounding.desc=_+1:_ El PEM llega _1 casilla más lejos_.\n\n_+2:_ Además aturde _1 turno más_.
actors.hero.talent.aut_salvage.title=chatarra útil
actors.hero.talent.aut_salvage.desc=_+1:_ Cuando un dron se rompe o se va, el cañón satélite recupera _media carga_.\n\n_+2:_ Recupera _1 carga_.
actors.hero.talent.aut_high_voltage.title=alto voltaje
actors.hero.talent.aut_high_voltage.desc=_+1:_ Las descargas de la Sobrecarga eléctrica hacen _1 de daño más_.\n\n_+2:_ _2 más_.\n\n_+3:_ _3 más_.
actors.hero.talent.aut_failsafe.title=a prueba de fallos
actors.hero.talent.aut_failsafe.desc=_+1:_ Cuando su vida baja del _30%_, suelta un PEM gratis. Como mucho una vez cada _150 turnos_.\n\n_+2:_ Una vez cada _100 turnos_.\n\n_+3:_ Una vez cada _50 turnos_.
actors.hero.talent.se_hive.title=colmena
actors.hero.talent.se_hive.desc=_+1:_ Los drones duran _5 turnos más_.\n\n_+2:_ _10 más_.\n\n_+3:_ _15 más_.
actors.hero.talent.se_armored_drones.title=drones blindados
actors.hero.talent.se_armored_drones.desc=_+1:_ Los drones tienen un _20% más de vida_.\n\n_+2:_ Un _40% más_.\n\n_+3:_ Un _60% más_.
actors.hero.talent.se_focus_fire.title=fuego concentrado
actors.hero.talent.se_focus_fire.desc=_+1:_ Los drones hacen un _15% más de daño_.\n\n_+2:_ Un _30% más_.\n\n_+3:_ Un _45% más_.
actors.hero.talent.tc_arc.title=arco voltaico
actors.hero.talent.tc_arc.desc=_+1:_ La Sobrecarga eléctrica alcanza a _1 enemigo más_.\n\n_+2:_ A _2 más_.\n\n_+3:_ A _3 más_.
actors.hero.talent.tc_shock.title=descarga paralizante
actors.hero.talent.tc_shock.desc=_+1:_ Cada descarga de la Sobrecarga tiene un _10%_ de aturdir 1 turno.\n\n_+2:_ Un _20%_.\n\n_+3:_ Un _30%_.
actors.hero.talent.tc_feedback.title=retroalimentación
actors.hero.talent.tc_feedback.desc=_+1:_ Cada enemigo que mata la Sobrecarga recorta _1 turno_ los demás enfriamientos del núcleo.\n\n_+2:_ _2 turnos_.\n\n_+3:_ _3 turnos_.

###talentos de la Torreta de defensa
actors.hero.talent.st_long_service.title=larga guardia
actors.hero.talent.st_long_service.desc=_+1:_ La torreta dura _5 turnos más_.\n\n_+2:_ _10 más_.\n\n_+3:_ _15 más_.\n\n_+4:_ _20 más_.
actors.hero.talent.st_heavy_caliber.title=gran calibre
actors.hero.talent.st_heavy_caliber.desc=_+1:_ La torreta hace un _20% más de daño_.\n\n_+2:_ Un _40% más_.\n\n_+3:_ Un _60% más_.\n\n_+4:_ Un _80% más_.
actors.hero.talent.st_twin_barrels.title=doble cañón
actors.hero.talent.st_twin_barrels.desc=_+1:_ Cada disparo de la torreta tiene un _25%_ de salir doble.\n\n_+2:_ Un _50%_.\n\n_+3:_ Un _75%_.\n\n_+4:_ Siempre.

###objetos
soulknight.automaton.automatonkit.name=núcleo de control
soulknight.automaton.automatonkit.desc=Un núcleo de control azul que zumba sin parar. Mientras lo lleves encima podrás usar los sistemas del Autómata.
soulknight.automaton.wrench.name=llave de tuercas
soulknight.automaton.wrench.desc=Una llave de tuercas enorme y pesada. Sirve para apretar tornillos y, sobre todo, para aflojar cráneos.
soulknight.automaton.satellitecannon.name=cañón satélite
soulknight.automaton.satellitecannon.desc=Un pequeño cañón láser que flota junto al Autómata.\n\nFunciona como una varita: tiene cargas que se recuperan con el tiempo y se dispara desde la barra rápida. Su láser es físico: la armadura del objetivo para una parte del daño.
soulknight.automaton.satellitecannon.stats_desc=Dispara un láser fino que atraviesa a todos los enemigos de una línea, hasta 6 casillas o la primera pared, y hace _%1$d-%2$d de daño_ a cada uno.
soulknight.automaton.automatonarmor.name=armadura del autómata
soulknight.automaton.automatonarmor.desc=Mientras lleve esta armadura, el Autómata puede realizar una habilidad especial.

###habilidades
soulknight.automaton.overload.name=sobrecarga eléctrica
soulknight.automaton.overload.desc=Durante _%1$d turnos_, cada turno descarga un rayo en los _%2$d enemigos_ más cercanos a _%3$d casillas_ o menos: _%4$d de daño_ que no para la armadura. Cada enemigo que mata con ella la alarga 1 turno (hasta %5$d).
soulknight.automaton.overload.desc_short=descarga rayos en los enemigos cercanos durante unos turnos.
soulknight.automaton.overload$charge.name=sobrecarga eléctrica
soulknight.automaton.overload$charge.desc=El Autómata está sobrecargado: cada turno descarga rayos en los enemigos cercanos.\n\nTurnos restantes: %d.
soulknight.automaton.droneswarm.name=enjambre de drones
soulknight.automaton.droneswarm.desc=Suelta _%1$d drones_ de combate que lo siguen durante _%2$d turnos_ y disparan a los enemigos a _%3$d casillas_ o menos (_%4$d-%5$d de daño_). Si la usas otra vez, los drones viejos se van y llegan otros nuevos.
soulknight.automaton.droneswarm.desc_short=suelta drones de combate que disparan a los enemigos.
soulknight.automaton.droneswarm.no_space=No hay sitio para los drones.
soulknight.automaton.drone.name=dron de combate
soulknight.automaton.drone.desc=Un dron pequeño del Autómata. Lo sigue y dispara a los enemigos a %1$d casillas o menos (%2$d-%3$d de daño).
soulknight.automaton.drone.desc_time=Turnos restantes: %d.
soulknight.automaton.drone.fades=El dron vuelve a su base.
soulknight.automaton.emp.name=PEM
soulknight.automaton.emp.desc=Un pulso electromagnético alrededor del Autómata, de _%1$d casillas_: _%2$d de daño_ y _%3$d turnos_ de aturdimiento a los enemigos (a los jefes, 1 turno). Además _destruye las balas y las torretas enemigas_ de la zona.
soulknight.automaton.emp.desc_short=pulso alrededor que daña, aturde y destruye las balas enemigas.
soulknight.automaton.omegaprotocol.name=protocolo omega
soulknight.automaton.omegaprotocol.desc=El Autómata sobrecarga su núcleo: un rayo cae sobre _todos los enemigos a la vista_ a %1$d casillas o menos (_%2$d de daño_ y 1 turno de aturdimiento), y la corriente que sobra lo envuelve en un _escudo de %3$d_.
soulknight.automaton.omegaprotocol.desc_short=un rayo a cada enemigo a la vista y un escudo para él.
soulknight.automaton.omegaprotocol.no_target=No hay ningún enemigo a la vista.
soulknight.automaton.automatonhooks.failsafe=¡A prueba de fallos!
soulknight.automaton.automatonhooks$failsafecooldown.name=a prueba de fallos
soulknight.automaton.automatonhooks$failsafecooldown.desc=El sistema a prueba de fallos se está recargando.\n\nTurnos restantes: %s.

###habilidad de armadura
soulknight.automaton.sentryturret.name=torreta de defensa
soulknight.automaton.sentryturret.short_desc=Monta una torreta fija que dispara a los enemigos durante unos turnos.
soulknight.automaton.sentryturret.desc=El Autómata monta una torreta de defensa en una casilla libre a %d casillas o menos. La torreta no se mueve y se queda en ese piso.
soulknight.automaton.sentryturret.desc_numbers=Dura _%1$d turnos_ y dispara a los enemigos a 5 casillas o menos (_%2$d-%3$d de daño_).
soulknight.automaton.sentryturret.prompt=Elige dónde montar la torreta
soulknight.automaton.sentryturret.no_space=Ahí no cabe la torreta.
soulknight.automaton.sentryturret$gun.name=torreta de defensa
soulknight.automaton.sentryturret$gun.desc=Una torreta del Autómata. No se mueve y dispara a los enemigos a %1$d casillas o menos (%2$d-%3$d de daño).\n\nTurnos restantes: %4$d.
soulknight.automaton.sentryturret$gun.fades=La torreta se apaga.
