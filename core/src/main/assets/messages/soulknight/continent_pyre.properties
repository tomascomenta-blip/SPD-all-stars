soulknight.continent.ash.boss.pyrehud.phase_1=Embers
soulknight.continent.ash.boss.pyrehud.phase_2=Ash storm
soulknight.continent.ash.boss.pyrehud.phase_3=Black lava
soulknight.continent.ash.boss.pyrehud.phase_4=The heart
soulknight.continent.ash.boss.pyrehud.gutter=FADING!
soulknight.continent.ash.boss.pyrehud.drinking=DRINKING A BRAZIER!
soulknight.continent.ash.boss.pyrehud.dark=DARK!
soulknight.continent.ash.boss.pyrehud.blazing=Blazing
