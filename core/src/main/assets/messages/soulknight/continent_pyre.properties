###the plain of the walking pyre
soulknight.continent.ash.boss.ashbosslevel.lava_name=black lava
soulknight.continent.ash.boss.ashbosslevel.lava_desc=A river of molten rock, black on top and red underneath. It burns anyone who steps in it and sets them on fire. The pyre walks through it as if it were water.
soulknight.continent.ash.boss.ashbosslevel.ash_name=ash
soulknight.continent.ash.boss.ashbosslevel.ash_desc=Grey ash, still warm. The whole plain is covered in it, ankle deep.
soulknight.continent.ash.boss.ashbosslevel.embers_name=embers
soulknight.continent.ash.boss.ashbosslevel.embers_desc=Embers glowing under a crust of ash. Where black lava cooled down, the ground stays like this for a long time.
soulknight.continent.ash.boss.ashbosslevel.columns_name=basalt columns
soulknight.continent.ash.boss.ashbosslevel.columns_desc=A clump of black basalt columns, the bones of an old lava flow. Something huge leaned against them to rest.
soulknight.continent.ash.boss.ashbosslevel.exit_locked_desc=The way on is choked with burning ash. Nothing will get through while the guardian of the plain still burns.
soulknight.continent.ash.boss.ashbosslevel.lava_death=You sank into the black lava...
soulknight.continent.ash.boss.ashbosslevel$lava.name=black lava
soulknight.continent.ash.boss.ashbosslevel$lava.rankings_desc=Burned in black lava

###the walking pyre
soulknight.continent.ash.boss.ashpyre.name=the Walking Pyre
soulknight.continent.ash.boss.ashpyre.desc=A giant of ash and embers, guardian of the ash plains. Deep in its chest beats a _heart of sacred essence_, the only light the yogs could not put out, and it keeps the whole pile burning.\n\nIt burns itself down as it fights. When its fire runs low it walks to a _lit brazier_ to drink it: knock the brazier over first and it goes _dark_ for a few turns, wide open.
soulknight.continent.ash.boss.ashpyre.desc_heat=Its fire: %d of 100.
soulknight.continent.ash.boss.ashpyre.notice=WHO... WALKS... ON MY ASHES.
soulknight.continent.ash.boss.ashpyre.defeated=...cold... at last...
soulknight.continent.ash.boss.ashpyre.enraged=MORE... FIRE...
soulknight.continent.ash.boss.ashpyre.wake=The ashes in the middle of the plain stir. Something is getting up.
soulknight.continent.ash.boss.ashpyre.banner_wake=THE ASHES STIR... THE PASS CAVES IN BEHIND YOU!
soulknight.continent.ash.boss.ashpyre.title_name=THE WALKING PYRE
soulknight.continent.ash.boss.ashpyre.title_sub=Guardian of the Ash Plains
soulknight.continent.ash.boss.ashpyre.hint_1=HINT: its stomps melt the ground into black lava, step off the marked cells. Watch the line of fire under its bar: when it runs out, the pyre goes for a brazier.
soulknight.continent.ash.boss.ashpyre.hint_2=HINT: in the ash storm you only see two cells around you, but the pyre glows through it. Ash walkers come out of the ground.
soulknight.continent.ash.boss.ashpyre.hint_3=HINT: embers fall on the marked cells around you, and a falling ember can light a knocked brazier again.
soulknight.continent.ash.boss.ashpyre.hint_4=HINT: the heart drinks from every lit brazier at once. Keep them on the ground!
soulknight.continent.ash.boss.ashpyre.hint_gutter=HINT: it is walking to a brazier. Knock it over before it gets there, or while it drinks, and it will go dark.
soulknight.continent.ash.boss.ashpyre.hint_storm=Ash fills the air: you can barely see past your own hands.
soulknight.continent.ash.boss.ashpyre.phase_2=THE WIND... IS MINE...
soulknight.continent.ash.boss.ashpyre.phase_3=BURN... WITH ME...
soulknight.continent.ash.boss.ashpyre.phase_4=MY HEART... STILL... BURNS!
soulknight.continent.ash.boss.ashpyre.banner_2=ASH STORM! The pyre raises the plain into the sky.
soulknight.continent.ash.boss.ashpyre.banner_3=BLACK LAVA! The ground cracks and the sky rains embers.
soulknight.continent.ash.boss.ashpyre.banner_4=THE HEART! The ash falls off its chest and every brazier feeds it.
soulknight.continent.ash.boss.ashpyre.gutter=...fire... I need... fire...
soulknight.continent.ash.boss.ashpyre.banner_gutter=ITS FIRE IS FADING! It is going for a brazier.
soulknight.continent.ash.boss.ashpyre.drinking=The pyre drinks the brazier's fire!
soulknight.continent.ash.boss.ashpyre.rekindled=AAAH... WARM...
soulknight.continent.ash.boss.ashpyre.banner_rekindled=THE PYRE BLAZES UP AGAIN!
soulknight.continent.ash.boss.ashpyre.dark=The pyre goes dark! Its heart is wide open!
soulknight.continent.ash.boss.ashpyre.banner_dark=THE PYRE GOES OUT! Hit it now!
soulknight.continent.ash.boss.ashpyre.relit=...not... yet...
soulknight.continent.ash.boss.ashpyre.crashed=The pyre crashes into its own brazier and staggers!
soulknight.continent.ash.boss.ashpyre.stomp=The pyre lifts its foot...
soulknight.continent.ash.boss.ashpyre.sweep=The pyre swings its arms around!
soulknight.continent.ash.boss.ashpyre.quake=The pyre stamps on the plain: the ground cracks around it!
soulknight.continent.ash.boss.ashpyre.charge=OUT... OF MY PLAIN!
soulknight.continent.ash.boss.ashpyre.storm=RISE... ASHES...
soulknight.continent.ash.boss.ashpyre.banner_storm=ASH STORM!
soulknight.continent.ash.boss.ashpyre.storm_end=The ash settles again.
soulknight.continent.ash.boss.ashpyre.dying=the light... the light is... going...
soulknight.continent.ash.boss.ashpyre.banner_dying=THE HEART GOES OUT...
soulknight.continent.ash.boss.ashpyre.banner_dead=The ash falls like snow. The plain is quiet at last.
soulknight.continent.ash.boss.ashpyre.loot=Among the ashes there is a drop of sacred essence, and a little something for each of you.
soulknight.continent.ash.boss.ashpyre$ashblind.name=Ash storm
soulknight.continent.ash.boss.ashpyre$ashblind.desc=The air is full of ash. You can only see two cells around you; the pyre still glows through it.\n\nTurns left: %s.
soulknight.continent.ash.boss.ashpyre$cinder.name=ash walker
soulknight.continent.ash.boss.ashpyre$cinder.desc=A heap of ash that got up and walks. Its touch burns.

###the braziers
soulknight.continent.ash.boss.pyrebrazier.name=brazier
soulknight.continent.ash.boss.pyrebrazier.name_knocked=knocked-over brazier
soulknight.continent.ash.boss.pyrebrazier.desc=A heavy iron brazier full of embers. The walking pyre drinks their fire when its own runs low.\n\nKnock it over before it gets here! (%d of %d)
soulknight.continent.ash.boss.pyrebrazier.desc_knocked=The embers smoulder on the ground. It will catch again in about %d turns, or sooner if an ember falls on it.
soulknight.continent.ash.boss.pyrebrazier.desc_out=Its embers are going out for good: it won't catch again in this fight.
soulknight.continent.ash.boss.pyrebrazier.knocked=You knock a brazier over!
soulknight.continent.ash.boss.pyrebrazier.relit=A brazier catches fire again.

