###the dark continent: the true ending
soulknight.continent.awake.awakening.woke=The Continent awakens! Everything that lives here is coming for you. Get back to the portal on the Ash Plains.
soulknight.continent.awake.awakening.still_awake=The Continent is still awake: everything here has caught your scent.
soulknight.continent.awake.awakening.held=The Continent holds you down: it won't let you leap that far.
soulknight.continent.awake.awakening.too_few=With only %1$d of the %2$d drops of essence the portal won't close. You just go through it, and the Continent stays awake on the other side.
soulknight.continent.awake.awakening.caved=The pass has caved in: the Continent shuts the straight way to the plains. Home is the long way round.
soulknight.continent.awake.awakening.sealing=The drops of sacred essence slip out of your hands...
soulknight.continent.awake.awakening.torch=Careful: the Continent is awake, and it takes %d drops to close the portal.
soulknight.continent.awake.awakening.wake_title=THE CONTINENT AWAKENS
soulknight.continent.awake.awakening.wake_sub=Everything that lives here has caught your scent. Get back to the portal before it catches you.
soulknight.continent.awake.awakening.seal_1=The drops of sacred essence slip out of your hands and fly into the portal.
soulknight.continent.awake.awakening.seal_2=The light stitches the tear shut from its edges, one stitch at a time.
soulknight.continent.awake.awakening.seal_3=On the other side the whole Continent throws itself at the threshold... and hits nothing.
soulknight.continent.awake.awakening.seal_4=The portal is closed. The dark stays there, and you stay here.
soulknight.continent.awake.awakening.map_portal=The portal is marked: walk into it with the essence to close it.
soulknight.continent.awake.awakening.map_pass=Towards the portal: the pass to %s.
soulknight.continent.awake.awakening.map_up=Towards the portal: climb back to the surface.
soulknight.continent.awake.awakening$sealed.rankings_desc=Closed the portal of the Dark Continent
soulknight.continent.awake.awakening$fallen.rankings_desc=Fell on the Dark Continent

soulknight.continent.awake.hunted.name=Hunted
soulknight.continent.awake.hunted.desc=The Dark Continent has woken up and everything that lives in it is coming for you, even what used to graze or keep to its own ground. More creatures come out, and faster, and the corruption gets in sooner. Nobody can leap far or take a shortcut home.\n\nGet back to the portal on the Ash Plains: with the drops of essence (%1$d of %2$d) it closes for good.
