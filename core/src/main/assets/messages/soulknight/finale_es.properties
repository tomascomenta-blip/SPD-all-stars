soulknight.finale.thalhud.act_title_6=VI · EL FIN DEL TIEMPO
soulknight.finale.thalhud.act_sub_1=De los portales sale el eco del sumo sacerdote
soulknight.finale.thalhud.act_sub_2=De los portales sale el eco del gran caballero
soulknight.finale.thalhud.act_sub_3=De los portales sale el eco de la reina varkolyn
soulknight.finale.thalhud.act_sub_4=De los portales sale el eco del Kraken
soulknight.finale.thalhud.act_sub_5=De los portales sale el eco de Tharog
soulknight.finale.thalhud.act_sub_6=Su núcleo baja al suelo
soulknight.finale.thalhud.act_short_1=I · el Bosque
soulknight.finale.thalhud.act_short_2=II · el Reino
soulknight.finale.thalhud.act_short_3=III · la Nave
