soulknight.finale.thalhud.act_short_5=V · la Tierra Olvidada
soulknight.finale.thalhud.act_short_6=VI · el fin del tiempo

soulknight.finale.riftlevel.sky_name=Cielo roto
soulknight.finale.riftlevel.sky_desc=Donde debería estar el cielo hay grietas, y detrás de las grietas, estrellas que no son de este mundo.
soulknight.finale.riftlevel.mouth_name=Entrada de la mazmorra
soulknight.finale.riftlevel.mouth_desc=La boca de la mazmorra por la que acabas de salir. Ahora no hay vuelta atrás.
soulknight.finale.riftlevel.floor_name=Prado
soulknight.finale.riftlevel.floor_desc=La hierba de la superficie, con losas viejas. Las gotas de reloj derretido la queman al caer.
