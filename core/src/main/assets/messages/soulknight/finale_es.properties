###Thal-Vekhorr, Fin de las Horas
soulknight.finale.thalcall.escaped=¡Has escapado de la mazmorra con el Amuleto de Yendor!
soulknight.finale.thalcall.pulled=El cielo se rompe. Algo tira de ti hacia atrás.
soulknight.finale.thalcall.stasis_name=Tiempo detenido
soulknight.finale.thalcall.stasis_desc=El tiempo se ha parado a tu alrededor. No puedes hacer nada hasta que vuelva a correr.\n\nTurnos restantes: %s.

soulknight.finale.thalvekhorr.name=Thal-Vekhorr
soulknight.finale.thalvekhorr.desc=Un coloso hecho de relojes que se derriten, colgado del cielo roto sobre la entrada de la mazmorra. Llegó atraído por el Amuleto, como todo lo demás que se coló en este mundo, pero él viene de un sitio donde las horas no van en orden.\n\nEstá demasiado lejos para alcanzarlo: hiérelo en _sus manos_ cuando bajan al suelo, _cerrando sus portales_ y, al final, en _su núcleo_.
soulknight.finale.thalvekhorr.notice=Ya os vi salir. Os vi entrar. Os veo morir. Todo a la vez.
soulknight.finale.thalvekhorr.core=¡Mi esfera...! Tendré que bajar yo mismo.
soulknight.finale.thalvekhorr.portal_closed=Un portal se cierra y Thal-Vekhorr se estremece.
soulknight.finale.thalvekhorr.echo_broken=El eco se deshace en arena y Thal-Vekhorr se resiente.
soulknight.finale.thalvekhorr.rewind=Eso no pasó. Todavía no.
soulknight.finale.thalvekhorr.banner_rewind=¡Un reloj de arena se vació: Thal-Vekhorr rebobina sus heridas!
soulknight.finale.thalvekhorr.act_1=El suelo se cubre de hierba alta y raíces: el Bosque se cuela por los portales.
soulknight.finale.thalvekhorr.act_2=Losas negras y estandartes: el Reino Caballero se cuela por los portales.
soulknight.finale.thalvekhorr.act_3=Placas de metal y luces de alarma: la Nave se cuela por los portales.
soulknight.finale.thalvekhorr.act_4=Arena mojada y corales: el Fondo marino se cuela por los portales.
soulknight.finale.thalvekhorr.act_5=Hielo y helechos: la Tierra Olvidada se cuela por los portales.
soulknight.finale.thalvekhorr.act_6=Todos los mundos a la vez. El núcleo de Thal-Vekhorr baja al suelo: ¡golpéalo!
soulknight.finale.thalvekhorr.solo_breath=El reloj se detiene un instante: las horas te devuelven parte de lo que te quitaron.
soulknight.finale.thalvekhorr.echo_fades=%s se desvanece: un eco no aguanta tanto fuera de su tiempo.
soulknight.finale.thalvekhorr.spell_bubbles=El aire se espesa en burbujas de tiempo: dentro de la azul todo va lento, dentro de la dorada todo va rápido.
soulknight.finale.thalvekhorr.spell_puddles=Gotea reloj derretido sobre la hierba. Pisar un charco puede salir bien... o no.
soulknight.finale.thalvekhorr.spell_swap=Thal-Vekhorr mira a dos a la vez. Van a cambiar de sitio.
soulknight.finale.thalvekhorr.spell_rewind=¿Y si volvemos un poco atrás?
soulknight.finale.thalvekhorr.banner_hourglass=¡Relojes de arena! Rómpelos antes de que se vacíen o rebobinará sus heridas.
soulknight.finale.thalvekhorr.spell_stop=Quietos.
soulknight.finale.thalvekhorr.banner_stop_soon=¡El tiempo va a detenerse! Sal de las casillas marcadas.
soulknight.finale.thalvekhorr.banner_stop=¡TIEMPO DETENIDO!
soulknight.finale.thalvekhorr.spell_echoes=Lo que hicisteis hace un momento sigue aquí.
soulknight.finale.thalvekhorr.defeated=No... no puede ser... ya había visto este final... y no era este...
soulknight.finale.thalvekhorr.banner_dead=Thal-Vekhorr se derrite y se desploma sobre sí mismo.
soulknight.finale.thalvekhorr.portal_open=Donde estaba su núcleo queda un portal abierto. Al otro lado se oye algo enorme respirando.
soulknight.finale.thalvekhorr.banner_portal=Un portal se ha abierto. Tocadlo para decidir.
soulknight.finale.thalvekhorr.voted_finish=%s quiere terminar aquí.
soulknight.finale.thalvekhorr.voted_go=%s quiere cruzar al Continente oscuro.
soulknight.finale.thalvekhorr.continent_soon=El portal todavía es inestable: nadie puede cruzarlo.
soulknight.finale.thalvekhorr.wnd_title=El portal de Thal-Vekhorr
soulknight.finale.thalvekhorr.wnd_body=Al otro lado del portal está el Continente oscuro, la tierra de donde salen los yogs. Puedes terminar tu aventura aquí, con el Amuleto, o cruzar.
soulknight.finale.thalvekhorr.wnd_body_coop=Al otro lado del portal está el Continente oscuro, la tierra de donde salen los yogs. El grupo vota: gana la mayoría y, si hay empate, decide el anfitrión.
soulknight.finale.thalvekhorr.wnd_finish=Terminar la aventura
soulknight.finale.thalvekhorr.wnd_continent=Cruzar al Continente oscuro
soulknight.finale.thalvekhorr.wnd_continent_soon=Continente oscuro (próximamente)
soulknight.finale.thalvekhorr.world_0=todos los mundos
soulknight.finale.thalvekhorr.world_1=el Bosque
soulknight.finale.thalvekhorr.world_2=el Reino Caballero
soulknight.finale.thalvekhorr.world_3=la Nave
soulknight.finale.thalvekhorr.world_4=el Fondo marino
soulknight.finale.thalvekhorr.world_5=la Tierra Olvidada

soulknight.finale.thalparts$hand.name=mano de Thal-Vekhorr
soulknight.finale.thalparts$hand.desc=Una mano enorme de latón que se derrite, con manecillas por dedos. Mientras está apoyada en el suelo se le puede golpear, y cada golpe le llega a Thal-Vekhorr.
soulknight.finale.thalparts$portal.name=portal temporal
soulknight.finale.thalparts$portal.name_echo=portal del eco
soulknight.finale.thalparts$portal.desc=Un desgarrón en el tiempo que da a %s. Por él salen monstruos sin parar. Ciérralo a golpes: a Thal-Vekhorr le duele cada portal que pierde.
soulknight.finale.thalparts$hourglass.name=reloj de arena
soulknight.finale.thalparts$hourglass.desc=Si la arena llega abajo, Thal-Vekhorr volverá a como estaba hace unos turnos. ¡Rómpelo!\n\nLe quedan %d turnos.
soulknight.finale.thalparts$core.name=núcleo de Thal-Vekhorr
soulknight.finale.thalparts$core.desc=La esfera agrietada de su reloj, con el corazón del tiempo latiendo dentro. Todo el daño que le hagas lo sufre él.
soulknight.finale.thalparts$heroecho.name=eco
soulknight.finale.thalparts$heroecho.desc=Una sombra de uno de vosotros hace unos turnos. Repite lo que hizo, golpes incluidos.
soulknight.finale.thalparts$exitportal.name=portal
soulknight.finale.thalparts$exitportal.desc=Al otro lado está el Continente oscuro.
soulknight.finale.thalparts$exitportal.desc_soon=Al otro lado está el Continente oscuro. El portal aún es inestable; por ahora solo sirve para despedirse.

soulknight.finale.thalhud.title=Fin de las Horas
soulknight.finale.thalhud.victory=¡Has escapado con el Amuleto de Yendor!
soulknight.finale.thalhud.victory_sub=La luz del sol, por fin...
soulknight.finale.thalhud.rewound=El tiempo se rebobina... Una oportunidad más. Solo una.
soulknight.finale.thalhud.act_title_1=I · EL BOSQUE
soulknight.finale.thalhud.act_title_2=II · EL REINO
soulknight.finale.thalhud.act_title_3=III · LA NAVE
soulknight.finale.thalhud.act_title_4=IV · EL FONDO MARINO
