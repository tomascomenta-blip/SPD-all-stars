soulknight.continent.city.cathedral.cathedral.place=inside the furnace cathedral
soulknight.continent.city.cathedral.cathedral.arrive=Inside the furnace cathedral. The pews are full and nobody stands up; at the far end, on the altar, something beats. The doors stay open behind you, for now.
soulknight.continent.city.cathedral.cathedral.open=The furnace cathedral lies on its side and its doors hang open. Whoever stands on the doorstep can walk in.
soulknight.continent.city.cathedral.cathedral.threshold=You stand on the doorstep of the open portal. Tap it again to go in, with the whole party.
soulknight.continent.city.cathedral.cathedral.shut=The doors have closed again.
soulknight.continent.city.cathedral.cathedral.shut_awake=The doors of the cathedral stay shut: with the continent awake, the furnace lets nobody in.
soulknight.continent.city.cathedral.cathedral.hotter_1=The furnace burns hotter. The floor of the nave starts to glow.
soulknight.continent.city.cathedral.cathedral.hotter_2=The furnace roars. Live embers spread across the floor and the faithful stir in their pews.
soulknight.continent.city.cathedral.cathedral.hotter_3=The air shimmers. The stained glass is melting in its frames.
soulknight.continent.city.cathedral.cathedral.hotter_4=The heat is unbearable. Whatever isn't stone is burning.
soulknight.continent.city.cathedral.cathedral.hotter_5=The whole cathedral is a furnace now. Get out or break the heart!
soulknight.continent.city.cathedral.cathedral.risen=The cathedral gets up outside! The walls shake and the vault starts coming down.
soulknight.continent.city.cathedral.cathedral.dies=The furnace cathedral falls apart, and everything it kept inside spills out of its doors.
soulknight.continent.city.cathedral.cathedral.gauge_rise=gets up in %d
soulknight.continent.city.cathedral.cathedral.gauge_up=IT'S UP!

soulknight.continent.city.cathedral.cathedrallevel.molten_name=molten metal
soulknight.continent.city.cathedral.cathedrallevel.molten_desc=Molten metal from the furnace, running down the channels of the floor. Stepping in it burns down to the bone.
soulknight.continent.city.cathedral.cathedrallevel.embers_name=live embers
soulknight.continent.city.cathedral.cathedrallevel.embers_desc=The floor has caught fire. Stepping on it burns, and the hotter the furnace, the more.
soulknight.continent.city.cathedral.cathedrallevel.pew_name=pew
soulknight.continent.city.cathedral.cathedrallevel.pew_desc=A long pew of blackened wood. Bits of the people who sat on it have melted into the grain.
soulknight.continent.city.cathedral.cathedrallevel.broken_pew_name=broken pew
soulknight.continent.city.cathedral.cathedrallevel.broken_pew_desc=Splinters and charred planks. Something tore itself loose from here.
soulknight.continent.city.cathedral.cathedrallevel.saint_name=melted saint
soulknight.continent.city.cathedral.cathedrallevel.saint_desc=A statue of a saint, slumped like a candle left too close to the fire.
soulknight.continent.city.cathedral.cathedrallevel.window_name=stained glass
soulknight.continent.city.cathedral.cathedrallevel.window_desc=A stained glass window, lit from behind by the furnace instead of the sun.
soulknight.continent.city.cathedral.cathedrallevel.portal_name=the portal
soulknight.continent.city.cathedral.cathedrallevel.portal_desc=The doors you came in by, still open onto the street. Out through here you come back next to the cathedral.
soulknight.continent.city.cathedral.cathedrallevel.runner_name=red runner
soulknight.continent.city.cathedral.cathedrallevel.runner_desc=What's left of a red carpet, glued to the flagstones by the heat. It leads straight to the altar.
soulknight.continent.city.cathedral.cathedrallevel.grate_name=furnace grate
soulknight.continent.city.cathedral.cathedrallevel.grate_desc=An iron grate over the fire under the floor. Smoke rises through it, and sometimes something climbs out.
soulknight.continent.city.cathedral.cathedrallevel.sarcophagus_name=sarcophagus
soulknight.continent.city.cathedral.cathedrallevel.sarcophagus_desc=A stone coffin with someone carved on the lid. The heat has cracked the seal.
soulknight.continent.city.cathedral.cathedrallevel.altar_name=side altar
soulknight.continent.city.cathedral.cathedrallevel.altar_desc=A small altar, its cloth burnt away. The candles on it have run all over the stone.
soulknight.continent.city.cathedral.cathedrallevel.bones_name=bones
soulknight.continent.city.cathedral.cathedrallevel.bones_desc=Old bones, stacked with care a long time ago and scattered without any since.
soulknight.continent.city.cathedral.cathedrallevel.steps_name=crypt steps
soulknight.continent.city.cathedral.cathedrallevel.steps_desc=Worn steps going down into the crypt. It's cooler down there, a little.
soulknight.continent.city.cathedral.cathedrallevel.rubble_name=rubble
soulknight.continent.city.cathedral.cathedrallevel.rubble_desc=Chunks of the vault, fallen when the cathedral last moved.

soulknight.continent.city.cathedral.furnaceheart.name=furnace heart
soulknight.continent.city.cathedral.furnaceheart.desc=A lump of iron and yog flesh on the high altar, caged in its own ribs, beating. Every beat, the whole cathedral burns. It never moves: it _throbs out a ring of fire_ round itself and _spits jets of flame_ down the nave at whoever keeps away (both marked). When its fire runs low its grates let out _stokers_ that throw themselves in to feed it: stop them. Halfway through, _its cage cracks_ and the dais catches fire. Break it and the cathedral dies.
soulknight.continent.city.cathedral.furnaceheart.untamable=That is no beast to collar.
soulknight.continent.city.cathedral.furnaceheart.wakes=On the altar, the furnace heart beats faster. The whole cathedral answers!
soulknight.continent.city.cathedral.furnaceheart.cracks=The cage of the heart cracks open: the dais catches fire!
soulknight.continent.city.cathedral.furnaceheart.fed=A stoker throws itself into the heart. The fire flares up!
soulknight.continent.city.cathedral.furnaceheart.bellows=The grates open and stokers crawl out of the fire.
soulknight.continent.city.cathedral.furnaceheart.broken=The furnace heart bursts! The cathedral shudders from end to end and spits you out...

soulknight.continent.city.cathedral.meltedfaithful.name=melted faithful
soulknight.continent.city.cathedral.meltedfaithful.desc=Someone who was at mass when the furnace was lit. They ran into the wood of their pew and the wood into them. Slow, they shamble after you dripping wax at boiling point; when they reach you they _open their arms_ (your cell is marked): whoever stays there is _stuck to them_ for a turn, burning.
soulknight.continent.city.cathedral.meltedfaithful.desc_seated=Someone melted into the pew, still sitting, dripping. They seem to be praying. Don't walk too close.
soulknight.continent.city.cathedral.meltedfaithful.stuck=The boiling wax sticks you to the faithful!

soulknight.continent.city.cathedral.deafbell.name=deaf bell
soulknight.continent.city.cathedral.deafbell.desc=A bronze bell grown round a tongue of yog flesh, hanging from the vault. It can't move and doesn't bite. When it sees you it swings and _tolls_: the toll is marked from two cells away out to six, and whoever it catches is _dazed_, hitting and dodging half as well. The faithful hear it too. Right under the bell is the only place it isn't heard.
soulknight.continent.city.cathedral.deafbell.deaf=The toll goes right through your head. You can barely hear yourself think.

soulknight.continent.city.cathedral.stoker.name=stoker
soulknight.continent.city.cathedral.stoker.desc=A soot-black little thing with a shovel full of live coals, crawled out of the grates. It _throws its coals_ at whoever is near (the cell is marked), but what it wants is the heart: once the heart is awake it runs to it and _throws itself in_, feeding the fire. Stop it on the way.
