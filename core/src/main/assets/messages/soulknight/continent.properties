###the Dark Continent
soulknight.continent.continent.essence=Sacred essence! You have %d of %d.

soulknight.continent.sacredessence.name=sacred essence
soulknight.continent.sacredessence.desc=A drop of light that won't go out. It belongs to the whole party: seven are needed to close the portal to the yogs' hell.

You have %d of %d.

soulknight.continent.darktaint.name=Corruption
soulknight.continent.darktaint.desc=The Dark Continent seeps into you: it rises slowly with time and with every yog hit. Shrines of light wash it away.

Corruption: %d of 100.
soulknight.continent.darktaint.effect_1=_25:_ your wounds close slower.
soulknight.continent.darktaint.effect_2=_50:_ you see less and get hungry sooner.
soulknight.continent.darktaint.effect_3=_75:_ your max health drops.
soulknight.continent.darktaint.effect_4=_100:_ you are prey: every yog knows where you are and the corruption eats your health until you reach a shrine.
soulknight.continent.darktaint.step_1=corruption 25
soulknight.continent.darktaint.step_2=corruption 50
soulknight.continent.darktaint.step_3=corruption 75
soulknight.continent.darktaint.step_4=prey!
soulknight.continent.darktaint.warn_1=The corruption weighs on you: your wounds close slower.
soulknight.continent.darktaint.warn_2=The corruption clouds your sight and makes you hungry.
soulknight.continent.darktaint.warn_3=The corruption steals your strength: your max health drops.
soulknight.continent.darktaint.warn_4=You are prey! Find a shrine of light before it consumes you.

soulknight.continent.continent.fell=You fell in %s, on the Dark Continent. You went further than anyone.
soulknight.continent.continent.floor=floor %d

soulknight.continent.ashlevel.lava_name=Black lava
soulknight.continent.ashlevel.lava_desc=A thick, almost black river glowing through its cracks. It burns whoever steps in and clings to their feet.
soulknight.continent.ashlevel.grass_name=Charred tufts
soulknight.continent.ashlevel.grass_desc=What used to be grass, burnt to the root. It crunches underfoot.
soulknight.continent.ashlevel.basalt_name=Basalt columns
soulknight.continent.ashlevel.basalt_desc=Black columns of stone that split as it cooled. The heat from below still breathes through the cracks.
soulknight.continent.ashlevel.high_grass_name=Ash thicket
soulknight.continent.ashlevel.floor_name=Ash
soulknight.continent.ashlevel.floor_desc=Grey ash as far as the eye can see, which isn't far. Under it, here and there, embers that never go out.

soulknight.continent.shrine.name=shrine of light
soulknight.continent.shrine.wakes=The shrine's light wakes up! Stay close and keep every yog off it until it's full.
soulknight.continent.shrine.progress=The shrine fills with light: %d of %d.
soulknight.continent.shrine.pure=The shrine shines clean. Here the corruption fades on its own.
soulknight.continent.shrine.purified=The shrine is purified! A drop of sacred essence falls at its feet.
soulknight.continent.shrine.desc_sieged=An old stone that still holds some light, choked by tendrils of corruption. The yogs swarm around it like flies.

Touch it to wake it up: you'll have to defend it while it fills.
soulknight.continent.shrine.desc_charging=The light grows: %d of %d. If a yog touches it, it fades back; if nobody stays close, it stops.
soulknight.continent.shrine.desc_pure=Clean light in the middle of the ash. Standing next to it washes the corruption away.

soulknight.continent.taintedfood$taintedration.name=tainted ration
soulknight.continent.taintedfood$taintedration.desc=Real food... or it used to be. It has purple stains that won't go away. It fills you up, but the corruption comes with it.
soulknight.continent.taintedfood$taintedmeat.name=tainted meat
soulknight.continent.taintedfood$taintedmeat.desc=A chunk of something that lived here. Better not to ask what. Barely filling, and it corrupts.

soulknight.continent.continenthud.essence=Essence
###the open world
soulknight.continent.continent.place_0=the Ash Plains
soulknight.continent.continent.place_1=the Tunnels
soulknight.continent.continent.place_2=the Abyss
soulknight.continent.continent.arrive_0=The Ash Plains. The old slab road crosses the ash to the north; away from it, the ground drops.
soulknight.continent.continent.arrive_1=The tunnels under the ash. Narrow, and they never seem to end.
soulknight.continent.continent.arrive_2=The abyss of the ash. Things of a size you'd rather not picture walk down here.

soulknight.continent.shrine.purified_dry=The shrine is purified! But its essence was taken long ago: only the light is left.
soulknight.continent.continenthud.map=Map

soulknight.continent.world.wndworldmap.title=Map
soulknight.continent.world.wndworldmap.nothing=Nothing worth a mark yet. Whatever you find will show up here.

soulknight.continent.ash.land.landmark.name_0=Colossus skull
soulknight.continent.ash.land.landmark.desc_0=The skull of a colossus, half buried in the ash. Its jaws are the mouth of a cave: steps go down between the fangs into the dark, and something glows in one of the eye sockets.
soulknight.continent.ash.land.landmark.name_1=The chasm
soulknight.continent.ash.land.landmark.desc_1=A crack in the ground so deep the bottom is only a red glow. Someone drove a stake into the edge and tied a rope to it: it goes down to the abyss.
soulknight.continent.ash.land.landmark.name_2=The chasm
soulknight.continent.ash.land.landmark.desc_2=A crack in the ground so deep the bottom is only a red glow. Someone drove a stake into the edge and tied a rope to it: it goes down to the abyss.
soulknight.continent.ash.land.landmark.name_3=Cliff
soulknight.continent.ash.land.landmark.desc_3=A wall of basalt columns that drops into the deep ash. A rope ladder hangs from two stakes: the quick way down, if you trust it.
soulknight.continent.ash.land.landmark.name_4=Colossus ribs
soulknight.continent.ash.land.landmark.desc_4=A colossus lies face down here, and its ribs make arches high enough to walk under. An expedition hung a lantern from its spine.
soulknight.continent.ash.land.landmark.name_5=Burning tower
soulknight.continent.ash.land.landmark.desc_5=A watchtower blackened by soot, with a fire on top that never goes out. You can see it from far away: good for finding your way back to the road.
soulknight.continent.ash.land.landmark.name_6=Obsidian tree
soulknight.continent.ash.land.landmark.desc_6=A twisted tree of black glass. A vein of lava climbs its trunk to a hollow where something beats like a heart.
soulknight.continent.ash.land.landmark.name_7=Abandoned camp
soulknight.continent.ash.land.landmark.desc_7=Others came this far: torn tents, a broken cart and a skeleton still sitting by the cold fire. They left a few things behind.

soulknight.continent.ash.land.ashsurface.portal_name=Thal-Vekhorr's portal
soulknight.continent.ash.land.ashsurface.portal_desc=The portal you came through, still open. It leads back to the rift.
soulknight.continent.ash.land.ashsurface.storm_name=Ash storm
soulknight.continent.ash.land.ashsurface.storm_desc=The wind drags the ash so thick you can't see your own hand. Only where the road goes into it is there a way through, to the north.
soulknight.continent.ash.land.ashsurface.fog_name=Ash fog
soulknight.continent.ash.land.ashsurface.fog_desc=Beyond this point the ash hangs in the air like a wall. Nobody who went in came back.
soulknight.continent.ash.land.ashsurface.steps_name=Carved steps
soulknight.continent.ash.land.ashsurface.steps_desc=Slab steps cut into the face of the terrace. The road goes down by them.
soulknight.continent.ash.land.ashsurface.slide_name=Ash slope
soulknight.continent.ash.land.ashsurface.slide_desc=The ash spilled over the edge and buried the face: you can get down, or back up, through here.
soulknight.continent.ash.land.ashsurface.face_name=Basalt face
soulknight.continent.ash.land.ashsurface.face_desc=The face of a terrace, basalt columns under a crust of pressed ash. Too steep: look for a slope or some steps.
soulknight.continent.ash.land.ashsurface.rim_name=Edge of the terrace
soulknight.continent.ash.land.ashsurface.rim_desc=The ground ends here and drops to a lower terrace. It crumbles if you step on it.
soulknight.continent.ash.land.ashsurface.road_name=Slab road
soulknight.continent.ash.land.ashsurface.road_desc=Old slabs half buried in the ash. Whoever laid them is long gone, but the road still goes north.
soulknight.continent.ash.land.ashsurface.high_name=Ash
soulknight.continent.ash.land.ashsurface.high_desc=Grey ash as far as the eye can see, which isn't far. The wind draws ripples on it.
soulknight.continent.ash.land.ashsurface.low_name=Dark ash
soulknight.continent.ash.land.ashsurface.low_desc=Lower down the ash is darker and full of pebbles and bones. Things wander here that don't climb to the road.
soulknight.continent.ash.land.ashsurface.deep_name=Deep ash
soulknight.continent.ash.land.ashsurface.deep_desc=Almost black, and warm: there are embers under it. Down here nobody comes to help.

soulknight.continent.ash.land.ashunder.floor_name=Rock floor
soulknight.continent.ash.land.ashunder.floor_desc=Black rock, worn smooth by things that crawl. The air smells of sulphur.
soulknight.continent.ash.land.ashunder.skull_name=Way up to the skull
soulknight.continent.ash.land.ashunder.skull_desc=The steps that go back up, between the fangs of the skull, to the surface.
soulknight.continent.ash.land.ashunder.rope_name=The rope
soulknight.continent.ash.land.ashunder.rope_desc=The rope ladder you came down by, hanging out of the dark. It goes back up to the chasm.
soulknight.continent.ash.land.ashabyss.heart=Bottom of the abyss

###the other biomes of the open world
soulknight.continent.continent.place_flesh_0=the Flesh Forest
soulknight.continent.continent.place_flesh_1=the Entrails
soulknight.continent.continent.place_flesh_2=the Beating Hollow
soulknight.continent.continent.arrive_flesh_0=The Flesh Forest. The trees bleed when the wind moves them, and the ground is warm under your boots.
soulknight.continent.continent.arrive_flesh_1=The entrails under the forest. The walls are soft, and they move when you don't look.
soulknight.continent.continent.arrive_flesh_2=The hollow that beats under the forest. Down here the whole cave breathes.
soulknight.continent.continent.place_city_0=the Devoured City
soulknight.continent.continent.place_city_1=the Catacombs
soulknight.continent.continent.place_city_2=the City Below
soulknight.continent.continent.arrive_city_0=The Devoured City. Streets of cobbles and black canals; something has been eating the houses from the inside.
soulknight.continent.continent.arrive_city_1=The catacombs under the city. Bones in the walls, bones on the floor.
soulknight.continent.continent.arrive_city_2=The city below the city. Whatever ate the one above lives here.
soulknight.continent.continent.place_frost_0=the Frost Moor
soulknight.continent.continent.place_frost_1=the Ice Caves
soulknight.continent.continent.place_frost_2=the Frozen Abyss
soulknight.continent.continent.arrive_frost_0=The Frost Moor. The snow swallows every sound, and the cold bites through any coat.
soulknight.continent.continent.arrive_frost_1=The caves under the ice. Your breath freezes before it leaves your mouth.
soulknight.continent.continent.arrive_frost_2=The frozen abyss. Things sleep in the ice down here, and not all of them are asleep.
soulknight.continent.continent.place_bones_0=the Colossi Graveyard
soulknight.continent.continent.place_bones_1=the Ossuary
soulknight.continent.continent.place_bones_2=the Common Grave
soulknight.continent.continent.arrive_bones_0=The Colossi Graveyard. The colossi come here to die, and their bones lie where they fell.
soulknight.continent.continent.arrive_bones_1=The ossuary under the graveyard. Tunnels dug through bone instead of rock.
soulknight.continent.continent.arrive_bones_2=The common grave of the colossi. Too many bones to count, and some still move.
soulknight.continent.continent.place_isles_0=the Black Isles
soulknight.continent.continent.place_isles_2=the Sunken Abyss
soulknight.continent.continent.arrive_isles_0=The Black Isles. A dark sea, rocks joined by tendons, and an eye that never closes watching from the throne.
soulknight.continent.continent.arrive_isles_2=The abyss under the sea. The water presses on the walls from every side.

soulknight.continent.ash.land.landmark.name_8=Root mouth
soulknight.continent.ash.land.landmark.desc_8=Huge roots of flesh burst out of the ground and arch over a hole. Steps of root go down to a green glow, and three eyes keep watch.
soulknight.continent.ash.land.landmark.name_9=Flesh chasm
soulknight.continent.ash.land.landmark.desc_9=A crack with walls of flesh and teeth all along its edge. Bile glows green at the bottom; a rope tied by others goes down.
soulknight.continent.ash.land.landmark.name_10=Rib tree
soulknight.continent.ash.land.landmark.desc_10=A spine for a trunk and ribs for branches, closing over your head. Fruits of bile glow at the tips.
soulknight.continent.ash.land.landmark.name_11=Nest of eyes
soulknight.continent.ash.land.landmark.desc_11=A nest of roots and bones full of egg-eyes, each one looking somewhere else.
soulknight.continent.ash.land.landmark.name_12=Dead colossus
soulknight.continent.ash.land.landmark.desc_12=A colossus lying on its side under a moss of flesh. Mushrooms of bile glow in the socket of its skull.
soulknight.continent.ash.land.landmark.name_13=Lost camp
soulknight.continent.ash.land.landmark.desc_13=An expedition that never came back. The moss of flesh covers everything, but the lantern on the mast still burns.
soulknight.continent.ash.land.landmark.name_14=Great sewer
soulknight.continent.ash.land.landmark.desc_14=The mouth of a sewer in a brick wall, its grate bent outwards. Steps go down to a canal lit violet.
soulknight.continent.ash.land.landmark.name_15=Sinkhole
soulknight.continent.ash.land.landmark.desc_15=The street fell in here. Far below there's a violet light, and a rope someone tied before you.
soulknight.continent.ash.land.landmark.name_16=Clock tower
soulknight.continent.ash.land.landmark.desc_16=The clock of the city stopped long ago. Now an eye looks out of its face, and it can be seen from everywhere.
soulknight.continent.ash.land.landmark.name_17=Throne square
soulknight.continent.ash.land.landmark.desc_17=The square of an empty throne, split by a crack that glows violet.
soulknight.continent.ash.land.landmark.name_18=City wall
soulknight.continent.ash.land.landmark.desc_18=A stretch of the old wall, still standing. It kept nothing out.
soulknight.continent.ash.land.landmark.name_19=Abandoned camp
soulknight.continent.ash.land.landmark.desc_19=Others camped in the ruins. They left in a hurry, and they left a few things behind.
soulknight.continent.ash.land.landmark.name_20=Ice cave
soulknight.continent.ash.land.landmark.desc_20=A mouth in the ice, with a cold light deep inside. The way down to the caves under the moor.
soulknight.continent.ash.land.landmark.name_21=Glacier crack
soulknight.continent.ash.land.landmark.desc_21=A crack in the glacier, blue and then black. A rope goes down into it.
soulknight.continent.ash.land.landmark.name_22=Trapped ship
soulknight.continent.ash.land.landmark.desc_22=A ship caught in the ice, far from any sea. The lantern at the stern still burns.
soulknight.continent.ash.land.landmark.name_23=Ice statues
soulknight.continent.ash.land.landmark.desc_23=People frozen where they stood. Their faces are turned to the north.
soulknight.continent.ash.land.landmark.name_24=Buried village
soulknight.continent.ash.land.landmark.desc_24=Roofs sticking out of the snow. In one window an ember is still glowing.
soulknight.continent.ash.land.landmark.name_25=Abandoned camp
soulknight.continent.ash.land.landmark.desc_25=Frozen tents and a cold fire. Whoever camped here left a few things behind.
soulknight.continent.ash.land.landmark.name_26=Skull throat
soulknight.continent.ash.land.landmark.desc_26=The skull of a colossus with its jaws open. Its throat goes down into the ossuary.
soulknight.continent.ash.land.landmark.name_27=Common grave
soulknight.continent.ash.land.landmark.desc_27=A pit full of bones that goes deeper than any grave should. A rope hangs into it.
soulknight.continent.ash.land.landmark.name_28=Great skeleton
soulknight.continent.ash.land.landmark.desc_28=The biggest of them all. You walk between its bones like through the pillars of a hall.
soulknight.continent.ash.land.landmark.name_29=Altar of teeth
soulknight.continent.ash.land.landmark.desc_29=An altar built of teeth, with candles that someone keeps lit.
soulknight.continent.ash.land.landmark.name_30=Abandoned camp
soulknight.continent.ash.land.landmark.desc_30=A camp among the bones. They left in a hurry, and they left a few things behind.
soulknight.continent.ash.land.landmark.name_31=Sea chasm
soulknight.continent.ash.land.landmark.desc_31=A crack in the rock where the sea pours in and never fills it. A rope goes down.
soulknight.continent.ash.land.landmark.name_32=Portal of Yog
soulknight.continent.ash.land.landmark.desc_32=A ring of flesh and stone around nothing at all. The nothing looks back.
soulknight.continent.ash.land.landmark.name_33=Dead lighthouse
soulknight.continent.ash.land.landmark.desc_33=A lighthouse on a rock. Its lantern gives off a violet glow that lights nothing.
soulknight.continent.ash.land.landmark.name_34=Sunken ship
soulknight.continent.ash.land.landmark.desc_34=A wreck half under the black water. Its lantern still burns.
soulknight.continent.ash.land.landmark.name_35=Throne of Yog
soulknight.continent.ash.land.landmark.desc_35=A throne of flesh with a great eye above it. It has been waiting for you.
soulknight.continent.ash.land.landmark.name_36=Flesh tree
soulknight.continent.ash.land.landmark.desc_36=A tree of skin and veins, warm to the touch. Membranes hang from its branches, and some of them have eyes.
soulknight.continent.ash.land.landmark.name_48=Ruined house
soulknight.continent.ash.land.landmark.desc_48=A house of the city, still standing. Something has eaten it from the inside; better not go in.

soulknight.continent.ash.land.ashsurface.pass_name=Way to %s
soulknight.continent.ash.land.ashsurface.pass_desc=The land goes on past the edge. Walk on and you'll be somewhere else.
soulknight.continent.ash.land.ashsurface.land_steps_name=Carved steps
soulknight.continent.ash.land.ashsurface.land_steps_desc=Steps cut into the slope. The road goes down by them.
soulknight.continent.ash.land.ashsurface.land_slide_name=Slope
soulknight.continent.ash.land.ashsurface.land_slide_desc=The ground spilled over the edge: you can get down, or back up, through here.
soulknight.continent.ash.land.ashsurface.land_face_name=Steep slope
soulknight.continent.ash.land.ashsurface.land_face_desc=Too steep to climb. Look for a slope or some steps.
soulknight.continent.ash.land.ashsurface.land_rim_name=Edge
soulknight.continent.ash.land.ashsurface.land_rim_desc=The ground ends here and drops to a lower level.
soulknight.continent.ash.land.ashsurface.flesh_high_name=Flesh moss
soulknight.continent.ash.land.ashsurface.flesh_high_desc=A carpet of warm moss that gives under your feet. Roots of flesh crawl through it.
soulknight.continent.ash.land.ashsurface.flesh_low_name=Mulch
soulknight.continent.ash.land.ashsurface.flesh_low_desc=Dark mulch full of bones and roots. Something watches from the ground.
soulknight.continent.ash.land.ashsurface.flesh_deep_name=Bile marsh
soulknight.continent.ash.land.ashsurface.flesh_deep_desc=Pools of green bile and pustules. Nobody comes down here on purpose.
soulknight.continent.ash.land.ashsurface.flesh_road_name=Trail of bone
soulknight.continent.ash.land.ashsurface.flesh_road_desc=Flat bones laid like stones. The forest hasn't swallowed them yet.
soulknight.continent.ash.land.ashsurface.flesh_fog_name=Spore cloud
soulknight.continent.ash.land.ashsurface.flesh_fog_desc=A thick cloud of spores. Whoever walks into it doesn't walk out.
soulknight.continent.ash.land.ashsurface.city_high_name=Paving
soulknight.continent.ash.land.ashsurface.city_high_desc=The paving of the old city, cracked and covered in rubble.
soulknight.continent.ash.land.ashsurface.city_low_name=Low street
soulknight.continent.ash.land.ashsurface.city_low_desc=A lower street, where the flesh of yog has started to grow between the stones.
soulknight.continent.ash.land.ashsurface.city_deep_name=Black canal
soulknight.continent.ash.land.ashsurface.city_deep_desc=Black water that doesn't reflect anything. Better not touch it.
soulknight.continent.ash.land.ashsurface.city_road_name=Main street
soulknight.continent.ash.land.ashsurface.city_road_desc=The cobbles of the main street. It still leads somewhere.
soulknight.continent.ash.land.ashsurface.city_fog_name=Ruins
soulknight.continent.ash.land.ashsurface.city_fog_desc=Collapsed houses as far as you can see. There's no way through.
soulknight.continent.ash.land.ashsurface.frost_high_name=Snow
soulknight.continent.ash.land.ashsurface.frost_high_desc=Hard snow, swept by the wind into long ripples.
soulknight.continent.ash.land.ashsurface.frost_low_name=Frozen ground
soulknight.continent.ash.land.ashsurface.frost_low_desc=Lower down the snow is grey and full of stones.
soulknight.continent.ash.land.ashsurface.frost_deep_name=Black ice
soulknight.continent.ash.land.ashsurface.frost_deep_desc=Ice so clear it looks black. Things are trapped in it.
soulknight.continent.ash.land.ashsurface.frost_road_name=Old track
soulknight.continent.ash.land.ashsurface.frost_road_desc=Stones laid across the snow. Somebody kept this track open once.
soulknight.continent.ash.land.ashsurface.frost_fog_name=Blizzard
soulknight.continent.ash.land.ashsurface.frost_fog_desc=The snow falls so thick it's a wall. Nobody who went in came back.
soulknight.continent.ash.land.ashsurface.bones_high_name=Grey earth
soulknight.continent.ash.land.ashsurface.bones_high_desc=Dry earth covered in splinters of bone.
soulknight.continent.ash.land.ashsurface.bones_low_name=Bone field
soulknight.continent.ash.land.ashsurface.bones_low_desc=More bone than earth. It cracks with every step.
soulknight.continent.ash.land.ashsurface.bones_deep_name=Bone pit
soulknight.continent.ash.land.ashsurface.bones_deep_desc=The lowest ground, where the oldest bones ended up.
soulknight.continent.ash.land.ashsurface.bones_road_name=Path of vertebrae
soulknight.continent.ash.land.ashsurface.bones_road_desc=A path paved with the vertebrae of colossi.
soulknight.continent.ash.land.ashsurface.bones_fog_name=Dust
soulknight.continent.ash.land.ashsurface.bones_fog_desc=A cloud of bone dust. Nobody who went in came back.
soulknight.continent.ash.land.ashsurface.isles_high_name=Black rock
soulknight.continent.ash.land.ashsurface.isles_high_desc=Wet black rock, slippery with seaweed.
soulknight.continent.ash.land.ashsurface.isles_low_name=Shore
soulknight.continent.ash.land.ashsurface.isles_low_desc=Shingle and dead things the sea threw up.
soulknight.continent.ash.land.ashsurface.isles_deep_name=Black sea
soulknight.continent.ash.land.ashsurface.isles_deep_desc=Dark water. Something big moves under it.
soulknight.continent.ash.land.ashsurface.isles_road_name=Causeway
soulknight.continent.ash.land.ashsurface.isles_road_desc=A path of stones and tendons joining the rocks.
soulknight.continent.ash.land.ashsurface.isles_fog_name=Sea mist
soulknight.continent.ash.land.ashsurface.isles_fog_desc=Mist over the water, thick as a wall. Nobody who went in came back.

soulknight.continent.ash.land.ashunder.cave_name=Way up
soulknight.continent.ash.land.ashunder.cave_desc=The way back up to the surface.
soulknight.continent.world.wndworldmap.lands=The lands you've walked
