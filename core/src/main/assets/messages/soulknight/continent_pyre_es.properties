###la llanura de la pira andante
soulknight.continent.ash.boss.ashbosslevel.lava_name=lava negra
soulknight.continent.ash.boss.ashbosslevel.lava_desc=Un río de roca fundida, negra por encima y roja por debajo. Quema a quien la pisa y le prende fuego. La pira la cruza como si fuera agua.
soulknight.continent.ash.boss.ashbosslevel.ash_name=ceniza
soulknight.continent.ash.boss.ashbosslevel.ash_desc=Ceniza gris, todavía tibia. Cubre toda la llanura y te llega a los tobillos.
soulknight.continent.ash.boss.ashbosslevel.embers_name=brasas
soulknight.continent.ash.boss.ashbosslevel.embers_desc=Brasas que brillan bajo una costra de ceniza. Donde se enfría la lava negra, el suelo se queda así mucho tiempo.
soulknight.continent.ash.boss.ashbosslevel.columns_name=columnas de basalto
soulknight.continent.ash.boss.ashbosslevel.columns_desc=Un haz de columnas de basalto negro, los huesos de una vieja colada de lava. Algo enorme se apoyó aquí a descansar.
soulknight.continent.ash.boss.ashbosslevel.exit_locked_desc=El camino sigue tapado de ceniza ardiente. No se pasa mientras arda el guardián de la llanura.
soulknight.continent.ash.boss.ashbosslevel.lava_death=Te has hundido en la lava negra...
soulknight.continent.ash.boss.ashbosslevel$lava.name=lava negra
soulknight.continent.ash.boss.ashbosslevel$lava.rankings_desc=Abrasado en lava negra

###la pira andante
soulknight.continent.ash.boss.ashpyre.name=la Pira Andante
soulknight.continent.ash.boss.ashpyre.desc=Un gigante de ceniza y brasas, guardián de las Llanuras de ceniza. En lo hondo del pecho le late un _corazón de esencia sagrada_, la única luz que los yogs no pudieron apagar, y es lo que mantiene ardiendo todo el montón.\n\nSe consume mientras pelea. Cuando se le acaba el fuego va a _beberse un brasero encendido_: tumba ese brasero antes y se quedará _apagada_ unos turnos, sin defensa.
soulknight.continent.ash.boss.ashpyre.desc_heat=Su fuego: %d de 100.
soulknight.continent.ash.boss.ashpyre.notice=¿QUIÉN... PISA... MIS CENIZAS?
soulknight.continent.ash.boss.ashpyre.defeated=...frío... por fin...
soulknight.continent.ash.boss.ashpyre.enraged=MÁS... FUEGO...
soulknight.continent.ash.boss.ashpyre.wake=Las cenizas del centro de la llanura se agitan. Algo se está levantando.
soulknight.continent.ash.boss.ashpyre.banner_wake=LAS CENIZAS SE AGITAN... ¡EL PASO SE DERRUMBA A VUESTRA ESPALDA!
soulknight.continent.ash.boss.ashpyre.title_name=LA PIRA ANDANTE
soulknight.continent.ash.boss.ashpyre.title_sub=Guardiana de las Llanuras de ceniza
soulknight.continent.ash.boss.ashpyre.hint_1=PISTA: sus pisotones funden el suelo en lava negra; sal de las casillas marcadas. Mira la línea de fuego bajo su barra: cuando se acaba, la pira va a por un brasero.
soulknight.continent.ash.boss.ashpyre.hint_2=PISTA: en la tormenta de ceniza solo ves dos casillas a tu alrededor, pero la pira brilla a través de ella. Del suelo salen caminantes de ceniza.
soulknight.continent.ash.boss.ashpyre.hint_3=PISTA: caen brasas en las casillas marcadas a vuestro alrededor, y una brasa puede volver a encender un brasero tumbado.
soulknight.continent.ash.boss.ashpyre.hint_4=PISTA: el corazón bebe de todos los braseros encendidos a la vez. ¡Mantenedlos en el suelo!
soulknight.continent.ash.boss.ashpyre.hint_gutter=PISTA: va hacia un brasero. Tumbadlo antes de que llegue, o mientras bebe, y se quedará apagada.
soulknight.continent.ash.boss.ashpyre.hint_storm=La ceniza llena el aire: apenas ves más allá de tus manos.
soulknight.continent.ash.boss.ashpyre.phase_2=EL VIENTO... ES MÍO...
soulknight.continent.ash.boss.ashpyre.phase_3=ARDED... CONMIGO...
soulknight.continent.ash.boss.ashpyre.phase_4=¡MI CORAZÓN... AÚN... ARDE!
soulknight.continent.ash.boss.ashpyre.banner_2=¡TORMENTA DE CENIZA! La pira levanta la llanura hacia el cielo.
soulknight.continent.ash.boss.ashpyre.banner_3=¡LAVA NEGRA! El suelo se agrieta y el cielo llueve brasas.
soulknight.continent.ash.boss.ashpyre.banner_4=¡EL CORAZÓN! Se le cae la ceniza del pecho y todos los braseros lo alimentan.
soulknight.continent.ash.boss.ashpyre.gutter=...fuego... necesito... fuego...
soulknight.continent.ash.boss.ashpyre.banner_gutter=¡SE LE APAGA EL FUEGO! Va a por un brasero.
soulknight.continent.ash.boss.ashpyre.drinking=¡La pira se bebe el fuego del brasero!
soulknight.continent.ash.boss.ashpyre.rekindled=AAAH... CALOR...
soulknight.continent.ash.boss.ashpyre.banner_rekindled=¡LA PIRA SE REAVIVA!
soulknight.continent.ash.boss.ashpyre.dark=¡La pira se apaga! ¡Tiene el corazón al descubierto!
soulknight.continent.ash.boss.ashpyre.banner_dark=¡LA PIRA SE APAGA! ¡Ahora!
soulknight.continent.ash.boss.ashpyre.relit=...todavía... no...
soulknight.continent.ash.boss.ashpyre.crashed=¡La pira se estrella contra su propio brasero y se tambalea!
soulknight.continent.ash.boss.ashpyre.stomp=La pira levanta el pie...
soulknight.continent.ash.boss.ashpyre.sweep=¡La pira barre a su alrededor con los brazos!
soulknight.continent.ash.boss.ashpyre.quake=La pira golpea la llanura: ¡el suelo se agrieta a su alrededor!
soulknight.continent.ash.boss.ashpyre.charge=¡FUERA... DE MI LLANURA!
soulknight.continent.ash.boss.ashpyre.storm=ALZAOS... CENIZAS...
soulknight.continent.ash.boss.ashpyre.banner_storm=¡TORMENTA DE CENIZA!
soulknight.continent.ash.boss.ashpyre.storm_end=La ceniza vuelve a posarse.
soulknight.continent.ash.boss.ashpyre.dying=la luz... la luz se... va...
soulknight.continent.ash.boss.ashpyre.banner_dying=EL CORAZÓN SE APAGA...
soulknight.continent.ash.boss.ashpyre.banner_dead=La ceniza cae como nieve. Por fin hay silencio en la llanura.
soulknight.continent.ash.boss.ashpyre.loot=Entre las cenizas queda una gota de esencia sagrada, y algo para cada uno de vosotros.
soulknight.continent.ash.boss.ashpyre$ashblind.name=Tormenta de ceniza
soulknight.continent.ash.boss.ashpyre$ashblind.desc=El aire está lleno de ceniza. Solo ves dos casillas a tu alrededor; la pira sigue brillando a través de ella.\n\nTurnos restantes: %s.
soulknight.continent.ash.boss.ashpyre$cinder.name=caminante de ceniza
soulknight.continent.ash.boss.ashpyre$cinder.desc=Un montón de ceniza que se ha levantado y camina. Su contacto quema.

###los braseros
soulknight.continent.ash.boss.pyrebrazier.name=brasero
soulknight.continent.ash.boss.pyrebrazier.name_knocked=brasero tumbado
soulknight.continent.ash.boss.pyrebrazier.desc=Un brasero de hierro macizo lleno de brasas. La pira andante se bebe su fuego cuando se le acaba el suyo.\n\n¡Tumbadlo antes de que llegue! (%d de %d)
soulknight.continent.ash.boss.pyrebrazier.desc_knocked=Las brasas humean en el suelo. Volverá a prender dentro de unos %d turnos, o antes si le cae una brasa encima.
soulknight.continent.ash.boss.pyrebrazier.desc_out=Sus brasas se apagan del todo. Ya no volverá a prender en esta pelea.
soulknight.continent.ash.boss.pyrebrazier.knocked=¡Tumbas un brasero!
soulknight.continent.ash.boss.pyrebrazier.relit=Un brasero vuelve a prender.

