#Domabestias (es)

###clase
actors.hero.heroclass.beastmaster=domabestias
actors.hero.heroclass.beastmaster_desc_short=El _Domabestias_ nunca lucha solo: su _manada de lobos_ lo acompaña toda la partida, y llama enredaderas venenosas y un oso enorme.
actors.hero.heroclass.beastmaster_desc=Un cazador de la selva que la magia oscura hizo crecer bajo la mazmorra; los lobos de los trasgos le siguen a él y no a su sacerdote. El Domabestias empieza con un _talismán de la manada_, que le da _Lobos elementales_, _Enredaderas venenosas_, _Oso peludo_ y la _Estampida_ (desde el nivel 6).\n\nSu pasiva, la _manada_: _2 lobos_ lo siguen siempre, también al bajar de piso. Si un lobo cae, vuelve a su lado _20 turnos_ después. Los lobos se hacen más fuertes con su nivel.\n\nTambién empieza con un _hueso crujiente_ (un arma ligera y certera), armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de curación\n_-_ Pergaminos de canción de cuna\n\nDesde el kit puede _domar_ un animal muy herido, que se convierte en su mascota.
actors.hero.heroclass.beastmaster_unlock=Los campeones están desbloqueados desde el principio.

###subclases
actors.hero.herosubclass.pack_alpha=alfa de la manada
actors.hero.herosubclass.pack_alpha_short_desc=El _Alfa de la manada_ guía a un lobo más, y sus lobos son más fieros.
actors.hero.herosubclass.pack_alpha_desc=Lo siguen _3 lobos_ en vez de 2. Sus talentos hacen a los lobos más fuertes, les ayudan a pegar junto a él y su Q asusta a los enemigos.
actors.hero.herosubclass.forest_warden=guardián del bosque
actors.hero.herosubclass.forest_warden_short_desc=El _Guardián del bosque_ levanta más enredaderas, y le protegen mejor el bosque y su oso.
actors.hero.herosubclass.forest_warden_desc=Las Enredaderas venenosas salen _4_ en vez de 3 y duran _25 turnos_ en vez de 15. Sus talentos endurecen las enredaderas, hacen que enraícen y le dan más armadura junto al oso.

###talentos del Domabestias
actors.hero.talent.bm_shared_meal.title=comida compartida
actors.hero.talent.bm_shared_meal.desc=_+1:_ Al comer, sus lobos se curan el _30%_ de su vida.\n\n_+2:_ El _60%_.
actors.hero.talent.bm_tracker.title=rastreador
actors.hero.talent.bm_tracker.desc=_+1:_ Detecta a los enemigos a _2 casillas_ o menos, aunque haya paredes en medio.\n\n_+2:_ A _3 casillas_ o menos.
actors.hero.talent.bm_thick_fur.title=pelaje grueso
actors.hero.talent.bm_thick_fur.desc=_+1:_ Sus lobos tienen un _15% más de vida_.\n\n_+2:_ Un _30% más_.
actors.hero.talent.bm_sharp_fangs.title=colmillos afilados
actors.hero.talent.bm_sharp_fangs.desc=_+1:_ Sus lobos hacen un _15% más de daño_.\n\n_+2:_ Un _30% más_.
actors.hero.talent.bm_bone_throw.title=hueso certero
actors.hero.talent.bm_bone_throw.desc=_+1:_ Con el hueso crujiente hace _1 de daño más_ a los enemigos que tienen al lado a uno de sus lobos.\n\n_+2:_ _2 más_.
actors.hero.talent.bm_howl.title=aullido
actors.hero.talent.bm_howl.desc=_+1:_ Cuando sus lobos vuelven, debilitan _3 turnos_ a los enemigos a 2 casillas o menos.\n\n_+2:_ _5 turnos_.
actors.hero.talent.bm_quick_recovery.title=recuperación rápida
actors.hero.talent.bm_quick_recovery.desc=_+1:_ Sus lobos vuelven _5 turnos antes_ (a los 15).\n\n_+2:_ _10 turnos antes_ (a los 10).
actors.hero.talent.bm_thorns.title=espinas
actors.hero.talent.bm_thorns.desc=_+1:_ Las enredaderas hacen _1 de daño más_ y envenenan _1 turno más_.\n\n_+2:_ _2 más_.
actors.hero.talent.bm_natures_bond.title=vínculo natural
actors.hero.talent.bm_natures_bond.desc=_+1:_ Cada vez que uno de sus animales mata a un enemigo, el Domabestias se cura _2 PS_.\n\n_+2:_ Se cura _4 PS_.
actors.hero.talent.bm_elemental_fangs.title=colmillos elementales
actors.hero.talent.bm_elemental_fangs.desc=_+1:_ Lobos elementales dura _1 turno más_ y hace _1 de daño más_ por golpe.\n\n_+2:_ _2 más_.\n\n_+3:_ _3 más_.
actors.hero.talent.bm_big_bear.title=oso enorme
actors.hero.talent.bm_big_bear.desc=_+1:_ El oso tiene un _20% más de vida y de daño_.\n\n_+2:_ Un _40% más_.\n\n_+3:_ Un _60% más_.
actors.hero.talent.pa_third_wolf.title=lobos de élite
actors.hero.talent.pa_third_wolf.desc=_+1:_ Sus lobos tienen un _10% más de vida y de daño_.\n\n_+2:_ Un _20% más_.\n\n_+3:_ Un _30% más_.
actors.hero.talent.pa_pack_tactics.title=tácticas de manada
actors.hero.talent.pa_pack_tactics.desc=_+1:_ Sus lobos hacen _1 de daño más_ a los enemigos que tiene al lado el Domabestias.\n\n_+2:_ _2 más_.\n\n_+3:_ _3 más_.
actors.hero.talent.pa_alpha_roar.title=rugido del alfa
actors.hero.talent.pa_alpha_roar.desc=_+1:_ Lobos elementales asusta _1 turno_ a los enemigos a 3 casillas o menos (no a los jefes).\n\n_+2:_ _2 turnos_.\n\n_+3:_ _3 turnos_.
actors.hero.talent.fw_ironbark.title=corteza de hierro
actors.hero.talent.fw_ironbark.desc=_+1:_ Las enredaderas tienen un _25% más de vida_.\n\n_+2:_ Un _50% más_.\n\n_+3:_ Un _75% más_.
actors.hero.talent.fw_roots.title=raíces
actors.hero.talent.fw_roots.desc=_+1:_ Cada golpe de una enredadera tiene un _33%_ de enraizar 1 turno.\n\n_+2:_ Un _67%_.\n\n_+3:_ Siempre.
actors.hero.talent.fw_bear_hug.title=abrazo de oso
actors.hero.talent.fw_bear_hug.desc=_+1:_ Junto al oso gana _1 de armadura más_.\n\n_+2:_ _2 más_.\n\n_+3:_ _3 más_.

###talentos del Rugido de la manada
actors.hero.talent.pr_thunderous.title=atronador
actors.hero.talent.pr_thunderous.desc=_+1:_ El rugido llega _1 casilla más lejos_.\n\n_+2:_ _2 más_.\n\n_+3:_ _3 más_.\n\n_+4:_ _4 más_.
actors.hero.talent.pr_rally.title=reagrupar
actors.hero.talent.pr_rally.desc=_+1:_ El rugido cura a los aliados el _30%_ de su vida.\n\n_+2:_ El _40%_.\n\n_+3:_ El _50%_.\n\n_+4:_ El _60%_.
actors.hero.talent.pr_ferocity.title=ferocidad
actors.hero.talent.pr_ferocity.desc=_+1:_ La ferocidad de sus animales dura _3 turnos más_.\n\n_+2:_ _6 más_.\n\n_+3:_ _9 más_.\n\n_+4:_ _12 más_.

###objetos
soulknight.beastmaster.beastmasterkit.name=talismán de la manada
soulknight.beastmaster.beastmasterkit.desc=Un colgante de hueso con una pequeña cornamenta tallada. Mientras lo lleves encima podrás usar los dones del Domabestias.
soulknight.beastmaster.crispybone.name=hueso crujiente
soulknight.beastmaster.crispybone.desc=Un hueso enorme, ligero y duro. Es fácil acertar con él.
soulknight.beastmaster.beastmasterarmor.name=armadura del domabestias
soulknight.beastmaster.beastmasterarmor.desc=Mientras lleve esta armadura, el Domabestias puede realizar una habilidad especial.

###pasiva
soulknight.beastmaster.pack.name=manada
soulknight.beastmaster.pack.desc=Un lobo de la manada ha caído. Volverá junto al Domabestias dentro de poco.\n\nTurnos restantes: %d.
soulknight.beastmaster.wolf.name=lobo de la manada
soulknight.beastmaster.wolf.desc=Un lobo gris de la manada del Domabestias. Lo sigue a todas partes y muerde a sus enemigos (%1$d-%2$d de daño). Si cae, volverá un tiempo después.
soulknight.beastmaster.wolf.fades=El lobo se marcha.

###habilidades
soulknight.beastmaster.frostfirewolves.name=lobos elementales
soulknight.beastmaster.frostfirewolves.desc=Durante _%1$d turnos_, el Domabestias y sus lobos se llenan de poder elemental: cada golpe hace _%2$d de daño más_ y alterna _fuego_ (quema) y _escarcha_ (enfría). Además, los lobos recuperan la mitad de su vida.
soulknight.beastmaster.frostfirewolves.desc_short=él y sus lobos golpean con fuego y escarcha; los lobos se curan.
soulknight.beastmaster.frostfirewolves$imbue.name=poder elemental
soulknight.beastmaster.frostfirewolves$imbue.desc=Cada golpe hace %1$d de daño más y alterna fuego y escarcha.\n\nTurnos restantes: %2$s.
soulknight.beastmaster.venomvines.name=enredaderas venenosas
soulknight.beastmaster.venomvines.desc=Hace brotar _%2$d enredaderas_ alrededor de un punto a %1$d casillas o menos, durante _%3$d turnos_. Tienen _%4$d de vida_, azotan a los enemigos pegados a ellas (_%5$d-%6$d de daño_ y _%7$d turnos_ de veneno) y, como estorban, _paran las balas enemigas_.
soulknight.beastmaster.venomvines.desc_short=enredaderas que envenenan a los enemigos y paran las balas.
soulknight.beastmaster.venomvines.prompt=Elige dónde hacer brotar las enredaderas
soulknight.beastmaster.venomvines.no_space=Ahí no pueden brotar enredaderas.
soulknight.beastmaster.venomvines$vine.name=enredadera venenosa
soulknight.beastmaster.venomvines$vine.desc=Una enredadera del Domabestias. No se mueve; azota a los enemigos pegados a ella (%1$d-%2$d de daño y %3$d turnos de veneno) y para las balas.\n\nTurnos restantes: %4$d.
soulknight.beastmaster.fuzzybear.name=oso peludo
soulknight.beastmaster.fuzzybear.desc=Un oso enorme llega a su lado durante _%1$d turnos_: tiene _%2$d de vida_ y sus zarpazos hacen _%3$d-%4$d de daño_ al enemigo y la mitad a los demás de alrededor. Los enemigos a %5$d casillas o menos _se lanzan contra el oso_, y mientras el Domabestias esté junto a él gana hasta _%6$d de armadura_. Si lo usas con el oso vivo, el oso vuelve a su lado.
soulknight.beastmaster.fuzzybear.desc_short=un oso que atrae a los enemigos, pega en área y lo protege.
soulknight.beastmaster.fuzzybear.recall=El oso vuelve a tu lado.
soulknight.beastmaster.fuzzybear.no_space=No hay sitio para el oso.
soulknight.beastmaster.fuzzybear$bear.name=oso peludo
soulknight.beastmaster.fuzzybear$bear.desc=El oso del Domabestias. Sus zarpazos hacen %1$d-%2$d de daño al enemigo y la mitad a los demás de alrededor.
soulknight.beastmaster.fuzzybear$bear.desc_time=Turnos restantes: %d.
soulknight.beastmaster.fuzzybear$bear.fades=El oso vuelve al bosque.
soulknight.beastmaster.stampede.name=estampida
soulknight.beastmaster.stampede.desc=Una estampida de bestias espirituales arrasa un cono de _%1$d casillas_ delante del Domabestias: cada enemigo recibe _%2$d de daño por cada animal de su manada vivo, más uno_ (ahora %3$d animales: _%4$d de daño_) y queda aturdido 1 turno. Sus lobos se curan del todo.
soulknight.beastmaster.stampede.desc_short=una estampida en cono, más fuerte cuantos más animales vivos.
soulknight.beastmaster.stampede.prompt=Elige hacia dónde lanzar la estampida
soulknight.beastmaster.stampede.no_target=No hay ningún enemigo ahí.

###habilidad de armadura
soulknight.beastmaster.packroar.name=rugido de la manada
soulknight.beastmaster.packroar.short_desc=Un rugido que aturde a los enemigos, cura a los aliados y enfurece a sus animales.
soulknight.beastmaster.packroar.desc=El Domabestias ruge con toda su manada: los enemigos de alrededor quedan aturdidos 2 turnos (a los jefes solo los debilita), los aliados se curan y sus lobos y su oso se vuelven feroces (25% más de daño).
soulknight.beastmaster.packroar.desc_numbers=Radio: _%1$d casillas_. Cura: _%2$d%%_. Ferocidad: _%3$d turnos_.
soulknight.beastmaster.packroar$ferocity.name=ferocidad
soulknight.beastmaster.packroar$ferocity.desc=Este animal está furioso: hace un 25%% más de daño.\n\nTurnos restantes: %s.
