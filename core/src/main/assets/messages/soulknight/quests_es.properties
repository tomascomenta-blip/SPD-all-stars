soulknight.quests.tourneyquest.knight_knows=Tú... te vi en la liza. Por fin un rival digno.
soulknight.quests.tourneyquest.knight_skip=¡No necesito montura contra un campeón del torneo! ¡En pie, como en la liza!
soulknight.quests.tourneyquest.guards=¡Los campeones que os vencieron en el torneo forman la guardia del caballero!
soulknight.quests.tourneyquest$herald.name=heraldo del torneo
soulknight.quests.tourneyquest$herald.desc=Un heraldo con tabardo a cuadros, trompeta dorada y voz de trueno. Anuncia los combates del coliseo para su señor, que mira desde el palco.
soulknight.quests.tourneyquest$herald.intro=¡Bienvenidos al coliseo del Reino! Mi señor, el gran caballero, contempla desde su palco cada combate de esta liza.\n\nTres rondas. En cada una os ofreceré dos rivales: uno asequible y un campeón de verdad. Cuanto más duro el rival, mejor el premio. ¡Que todos vean de qué estáis hechos!\n\nSi estáis a punto de caer, detendré el combate... pero ese campeón no olvidará vuestra derrota.
soulknight.quests.tourneyquest$herald.intro_hint=MISIÓN: gana las 3 rondas del torneo del heraldo. En cada ronda eliges rival: FÁCIL (premio menor) o un CAMPEÓN (premio mayor). Si pierdes, ese campeón se unirá a la guardia del gran caballero. Gana las 3 contra campeones para el mejor premio final.
soulknight.quests.tourneyquest$herald.round_title=Ronda %d de 3
soulknight.quests.tourneyquest$herald.round_text=Escoged a vuestro rival:\n\n_Fácil_: %s. Premio: %s.\n_Campeón_: %s. Premio: %s.\n\nLa puerta se cerrará hasta que termine el combate.
soulknight.quests.tourneyquest$herald.pick_easy=Fácil: %s
soulknight.quests.tourneyquest$herald.pick_hard=Campeón: %s
soulknight.quests.tourneyquest$herald.pick_later=Todavía no
soulknight.quests.tourneyquest$herald.subtitle_easy=Ronda %d · rival fácil
soulknight.quests.tourneyquest$herald.fight_0=¡Primera ronda! ¡Que se abra la liza!
soulknight.quests.tourneyquest$herald.fight_1=¡Segunda ronda! ¡El público quiere sangre!
soulknight.quests.tourneyquest$herald.fight_2=¡Ronda final! ¡Mi señor se ha puesto en pie!
soulknight.quests.tourneyquest$herald.fighting=¡Luchad! ¡Todos os miran!
soulknight.quests.tourneyquest$herald.win=¡Victoria! ¡El público os aclama!
soulknight.quests.tourneyquest$herald.win_hard=¡Increíble! ¡Han vencido a un campeón! ¡Hasta mi señor golpea su escudo!
soulknight.quests.tourneyquest$herald.stop=¡BASTA! ¡El combate ha terminado! Llevaos vuestra derrota... y no olvidéis esa cara.
soulknight.quests.tourneyquest$herald.banner_win=¡Ronda %d ganada!
soulknight.quests.tourneyquest$herald.banner_last=¡Torneo completado! Hablad con el heraldo
soulknight.quests.tourneyquest$herald.banner_lost=Ronda %d perdida
soulknight.quests.tourneyquest$herald.after=Mi señor os recordará. Y eso, creedme, no siempre es bueno.
soulknight.quests.tourneyquest$herald.reward=¡El torneo ha terminado! Escoged vuestro trofeo:\n\n_Lanza de justa_: lanza pesada (alcance 2) que a veces derriba al rival.\n_Armadura de campeón_: cota de malla que pesa menos de lo que parece (necesita 1 de fuerza menos).\n_Estandarte del heraldo_: artefacto; plantado, los aliados cercanos pegan más fuerte y reciben menos daño durante unos turnos.
soulknight.quests.tourneyquest$herald.reward_best=¡Tres campeones vencidos! ¡Nadie lo había logrado! Vuestro trofeo vale más (+1):\n\n_Lanza de justa_: lanza pesada (alcance 2) que a veces derriba al rival.\n_Armadura de campeón_: cota de malla que pesa menos de lo que parece (necesita 1 de fuerza menos).\n_Estandarte del heraldo_: artefacto; plantado, los aliados cercanos pegan más fuerte y reciben menos daño durante unos turnos.
soulknight.quests.tourneyquest$herald.got=Recibes: %s.

soulknight.quests.tourneyfoes$sirbastion.name=Sir Bastión
soulknight.quests.tourneyfoes$sirbastion.desc=Un caballero enorme tras un pavés que le tapa de los pies a la cabeza. De frente apenas se le puede herir: hay que rodearlo.
soulknight.quests.tourneyfoes$sirbastion.subtitle=el muro de la liza
soulknight.quests.tourneyfoes$sirbastion.defeated=¡Sir Bastión ha caído!
soulknight.quests.tourneyfoes$sirbastion.status_1=Fase I · El pavés
soulknight.quests.tourneyfoes$sirbastion.status_2=Fase II · El muro
soulknight.quests.tourneyfoes$sirbastion.status_3=Fase III · Sin escudo
soulknight.quests.tourneyfoes$sirbastion.status_wall=Tras el muro de escudos: invulnerable
soulknight.quests.tourneyfoes$sirbastion.notice=¡Nadie ha pasado nunca este escudo!
soulknight.quests.tourneyfoes$sirbastion.phase_2=Sir Bastión levanta el muro de escudos
soulknight.quests.tourneyfoes$sirbastion.phase_3=¡El pavés de Sir Bastión se parte!
soulknight.quests.tourneyfoes$sirbastion.broken=¡Mi escudo! ¡Pagaréis por esto!
soulknight.quests.tourneyfoes$sirbastion.blocked=¡Bloqueado!
soulknight.quests.tourneyfoes$sirbastion.wall=¡Muro!
soulknight.quests.tourneyfoes$slimeking.name=el Rey Limo
soulknight.quests.tourneyfoes$slimeking.desc=Un limo gigantesco con una corona hundida en la gelatina. Salta sobre sus rivales y se va partiendo en limos reales.
soulknight.quests.tourneyfoes$slimeking.subtitle=el soberano del foso
soulknight.quests.tourneyfoes$slimeking.defeated=¡El Rey Limo se deshace!
soulknight.quests.tourneyfoes$slimeking.status_1=Fase I · Saltos
