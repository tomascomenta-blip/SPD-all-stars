###el gran gólem (Ciudad)
soulknight.quests.golemquest.rune_out=¡Apagas una runa! Quedan %d encendidas.
soulknight.quests.golemquest.core_ready=El núcleo del gólem vibra en vuestras manos: está listo para el rey.
soulknight.quests.golemquest.core_stuns=¡El núcleo del gólem estalla en luz y aturde al Rey enano!
soulknight.quests.golemquest.guards=¡El gran gólem ha venido a defender el trono!
soulknight.quests.golemquest$treasurer.name=viejo tesorero enano
soulknight.quests.golemquest$treasurer.desc=Un enano diminuto con monóculo, un libro de cuentas enorme y un manojo de llaves. El único que no se ha vuelto loco en esta ciudad.
soulknight.quests.golemquest$treasurer.intro=Psst. ¡Aquí! Soy el último tesorero de la cámara real. Dentro está el tesoro del reino, y lo guarda un gólem que nunca duerme.\n\nCuatro runas del suelo le dan fuerza: mientras brillen, se cura y apenas siente los golpes. Pisad una y se apagará.\n\nTraedme su núcleo y el tesoro es vuestro. Bueno, una parte. Si las apagáis todas, la mejor parte.
soulknight.quests.golemquest$treasurer.intro_hint=MISIÓN: derrota al GRAN GÓLEM de la cámara real y lleva su núcleo al tesorero. Cada RUNA encendida le cura y le protege: písala para apagarla. Si muere con las 4 runas apagadas, el premio será mejor.
soulknight.quests.golemquest$treasurer.hint_0=Las runas están en las cuatro esquinas de la cámara.
soulknight.quests.golemquest$treasurer.hint_1=Cuando se enfade, volverá a encender alguna. ¡Vigiladlas!
soulknight.quests.golemquest$treasurer.hint_2=No os pongáis en línea con una runa encendida: dispara desde ellas.
soulknight.quests.golemquest$treasurer.bring=¿Ya? ¡Traedme el núcleo, que lo apunte en el libro!
soulknight.quests.golemquest$treasurer.thanks=¡Magnífico! El tesoro vuelve a ser del reino. Escoged.
soulknight.quests.golemquest$treasurer.thanks_bonus=¡Y con todas las runas apagadas! Esto merece lo mejor de la cámara.
soulknight.quests.golemquest$treasurer.after=Guardad bien ese núcleo. Al rey no le va a hacer ninguna gracia.
soulknight.quests.golemquest$treasurer.reward=Elige tu parte del tesoro:\n\n_Martillo rúnico_: martillo de guerra; uno de cada cinco golpes aturde.\n_Coraza de gólem_: armadura de placas; resta algo de daño a cada golpe.\n_Piedra rúnica_: artefacto; golpeada, aturde a los enemigos de alrededor.
soulknight.quests.golemquest$treasurer.reward_bonus=¡Todas las runas apagadas! La mejor parte del tesoro (+1):\n\n_Martillo rúnico_: martillo de guerra; uno de cada cinco golpes aturde.\n_Coraza de gólem_: armadura de placas; resta algo de daño a cada golpe.\n_Piedra rúnica_: artefacto; golpeada, aturde a los enemigos de alrededor.
soulknight.quests.golemquest$treasurer.got=Recibes: %s.
soulknight.quests.golemquest$golemcore.name=núcleo del gran gólem
soulknight.quests.golemquest$golemcore.desc=Una piedra rúnica que aún late. El tesorero enano la está esperando.
soulknight.quests.golemquest$golemcore.desc_done=Una piedra rúnica que aún late. El tesorero la apuntó en su libro y te la dejó: delante del Rey enano estallará en luz.
soulknight.quests.golemquest$runehammer.name=martillo rúnico
soulknight.quests.golemquest$runehammer.desc=Un martillo de guerra tallado con runas enanas. Uno de cada cinco golpes deja aturdido al enemigo.
soulknight.quests.golemquest$golemplate.name=coraza de gólem
soulknight.quests.golemquest$golemplate.desc=Placas de piedra del gran gólem montadas como una armadura de placas. Restan un poco más de daño a cada golpe.
soulknight.quests.golemquest$runestone.name=piedra rúnica
soulknight.quests.golemquest$runestone.desc=Una piedra con una runa enana. Se carga mientras luchas; golpeada, aturde a los enemigos a %d casilla(s).
soulknight.quests.golemquest$runestone.desc_ready=La piedra brilla.
soulknight.quests.golemquest$runestone.desc_charging=La piedra se está cargando.
soulknight.quests.golemquest$runestone.ac_set=GOLPEAR
soulknight.quests.golemquest$runestone.no_charge=La piedra todavía no brilla.
soulknight.quests.golemquest$runestone.pulse=¡Una onda rúnica aturde a los enemigos!
soulknight.quests.golemquest$runestone.ready=Tu piedra rúnica brilla.
soulknight.quests.golemquest$runestone.levelup=Tu piedra rúnica es más fuerte.
soulknight.quests.greatgolem.name=gran gólem
soulknight.quests.greatgolem.desc=El guardián de piedra de la cámara real. Cada runa encendida le cura y le protege.
soulknight.quests.greatgolem.subtitle=el guardián de la cámara real
soulknight.quests.greatgolem.subtitle_guard=el guardián del trono
soulknight.quests.greatgolem.defeated=¡El gran gólem se desmorona!
soulknight.quests.greatgolem.status_1=Fase I
soulknight.quests.greatgolem.status_2=Fase II · Rayos rúnicos
soulknight.quests.greatgolem.status_3=Fase III · Furia
soulknight.quests.greatgolem.status_runes=Runas encendidas: %d
soulknight.quests.greatgolem.notice=INTRUSOS. LA CÁMARA ESTÁ CERRADA.
soulknight.quests.greatgolem.notice_guard=NADIE LLEGA HASTA EL REY.
soulknight.quests.greatgolem.phase_2=Las runas disparan rayos
soulknight.quests.greatgolem.phase_3=¡El gran gólem se enfurece!
soulknight.quests.greatgolem.rekindle=¡El gólem vuelve a encender una runa!
soulknight.quests.greatgolem.slain=El gran gólem ha caído. Lleva su núcleo al tesorero.
soulknight.quests.greatgolem.slain_bonus=¡El gran gólem ha caído con todas las runas apagadas! Lleva su núcleo al tesorero.

###el rey yeti (Tierra Olvidada)
soulknight.quests.yetiquest.followed=¡El rey yeti baja rugiendo a la glaciación de Tharog!
soulknight.quests.yetiquest.cracks=El hijo del chamán os dijo dónde se agrietan las placas de Tharog: le protegen menos y con suficientes golpes se rompen.
soulknight.quests.yetiquest$huntress.name=cazadora de la tribu
soulknight.quests.yetiquest$huntress.desc=Una cazadora de la tribu, con pinturas de guerra y una lanza de sílex. Tiene los ojos rojos de llorar.
soulknight.quests.yetiquest$huntress.intro=¡Extranjeros! El rey yeti ha bajado de la montaña y se ha llevado al hijo del chamán a su cueva de hielo, en este mismo piso.\n\nYo sola no puedo con él. Su rugido hace caer los carámbanos del techo... a veces le caen encima a él mismo. Usadlo.\n\nMatadlo, liberad al chico y traedlo de vuelta. La tribu os lo pagará.
soulknight.quests.yetiquest$huntress.intro_hint=MISIÓN: mata al REY YETI en su cueva de hielo, LIBERA al hijo del chamán y vuelve con la cazadora. Sus carámbanos también le hacen daño a él: si le caen 2 encima, el premio será mejor.
soulknight.quests.yetiquest$huntress.hint_0=Su cueva está al fondo del piso. Seguid el frío.
soulknight.quests.yetiquest$huntress.hint_1=Cuando ruge, el techo cae. Haced que se ponga debajo.
soulknight.quests.yetiquest$huntress.hint_2=En la ventisca solo le veréis de cerca. No os separéis.
soulknight.quests.yetiquest$huntress.free_him=¡Lo habéis matado! ¿Y el chico? ¡Desatadlo, por favor!
soulknight.quests.yetiquest$huntress.thanks=¡Está vivo! La tribu nunca lo olvidará. Escoged.
soulknight.quests.yetiquest$huntress.thanks_bonus=¡Y aplastado por su propio hielo! Los ancianos contarán esta historia. Lo mejor para vosotros.
soulknight.quests.yetiquest$huntress.after=El chico vio las grietas de las placas de Tharog en las pinturas de la cueva. Os dirá dónde golpear.
soulknight.quests.yetiquest$huntress.reward=Elige tu recompensa:\n\n_Garras del rey yeti_: guantelete rápido que a veces congela un poco al enemigo.\n_Manto de yeti_: armadura de placas de pelo blanco; el frío de esta tierra no te muerde.\n_Colmillo de hielo_: artefacto; golpeado, suelta una onda de frío que daña y frena a los enemigos cercanos.
soulknight.quests.yetiquest$huntress.reward_bonus=¡Aplastado por su propio hielo! Lo mejor de la tribu (+1):\n\n_Garras del rey yeti_: guantelete rápido que a veces congela un poco al enemigo.\n_Manto de yeti_: armadura de placas de pelo blanco; el frío de esta tierra no te muerde.\n_Colmillo de hielo_: artefacto; golpeado, suelta una onda de frío que daña y frena a los enemigos cercanos.
soulknight.quests.yetiquest$huntress.got=Recibes: %s.
soulknight.quests.yetiquest$captive.name=hijo del chamán
soulknight.quests.yetiquest$captive.desc=Un niño de la tribu atado con cuerdas de cuero. Tiene frío, pero no ha soltado ni una lágrima.
soulknight.quests.yetiquest$captive.king_alive=No hay tiempo: el rey yeti sigue vivo.
soulknight.quests.yetiquest$captive.freed=¡Gracias! ¡Sabía que vendría alguien!
soulknight.quests.yetiquest$captive.freed_hint=El chico corre de vuelta con la cazadora. Ve a hablar con ella.
soulknight.quests.yetiquest$yeticlaws.name=garras del rey yeti
soulknight.quests.yetiquest$yeticlaws.desc=Las garras del rey yeti montadas en un guantelete. Golpes rápidos; uno de cada cuatro deja helado al enemigo un momento.
soulknight.quests.yetiquest$yetimantle.name=manto de yeti
soulknight.quests.yetiquest$yetimantle.desc=La piel blanca del rey yeti sobre una armadura de placas. El frío de la Tierra Olvidada no te muerde.
soulknight.quests.yetiquest$frostfang.name=colmillo de hielo
soulknight.quests.yetiquest$frostfang.desc=Un colmillo de hielo que nunca se derrite. Se carga mientras luchas; golpeado, daña y congela un poco a los enemigos a %d casillas.
soulknight.quests.yetiquest$frostfang.desc_ready=El colmillo está listo.
soulknight.quests.yetiquest$frostfang.desc_charging=El colmillo se está cargando.
soulknight.quests.yetiquest$frostfang.ac_freeze=GOLPEAR
soulknight.quests.yetiquest$frostfang.no_charge=El colmillo todavía no está listo.
soulknight.quests.yetiquest$frostfang.freeze=¡Una onda de frío barre a los enemigos!
soulknight.quests.yetiquest$frostfang.ready=Tu colmillo de hielo está listo.
soulknight.quests.yetiquest$frostfang.levelup=Tu colmillo de hielo es más frío.
soulknight.quests.yetiking.name=rey yeti
soulknight.quests.yetiking.desc=El yeti más grande de la montaña, con una corona de hielo y hueso. Su rugido hace caer los carámbanos... también sobre él.
soulknight.quests.yetiking.subtitle=el señor de la montaña helada
soulknight.quests.yetiking.defeated=¡El rey yeti ha caído!
soulknight.quests.yetiking.status_1=Fase I
soulknight.quests.yetiking.status_2=Fase II · Aludes
soulknight.quests.yetiking.status_3=Fase III · Furia
soulknight.quests.yetiking.status_blizzard=Ventisca: solo se le ve de cerca
soulknight.quests.yetiking.notice=¡GRRAAAAOOOH!
soulknight.quests.yetiking.roar=¡GRAAAH!
soulknight.quests.yetiking.avalanche=¡Un alud se viene encima!
soulknight.quests.yetiking.icicles=¡Crujen los carámbanos del techo! Atráelo debajo de ellos.
soulknight.quests.yetiking.phase_2=El rey yeti llama a la ventisca
soulknight.quests.yetiking.phase_3=¡El rey yeti se enfurece!
soulknight.quests.yetiking.hit=¡Aplastado!
soulknight.quests.yetiking.hit_log=¡Los carámbanos caen sobre el rey yeti! (%d)
soulknight.quests.yetiking.slain=El rey yeti ha caído. Libera al hijo del chamán.
soulknight.quests.yetiking.slain_bonus=¡El rey yeti ha caído bajo su propio hielo! Libera al hijo del chamán.

###los sellos demoníacos (Salas)
soulknight.quests.sealsquest.broken=¡Has roto un sello demoníaco! (%d/3)
soulknight.quests.sealsquest.banner=Sello %d de 3 roto
soulknight.quests.sealsquest.hud=Sellos demoníacos rotos: %d/3
soulknight.quests.sealsquest.fist_less=Sin sus sellos, Yog-Dzewa tendrá un puño menos.
soulknight.quests.sealsquest.fist_more=Los sellos que quedan dan fuerza a Yog-Dzewa: tendrá un puño más.
soulknight.quests.sealsquest$lostsoul.name=alma de un paladín
soulknight.quests.sealsquest$lostsoul.desc=El alma de un paladín que bajó hasta aquí antes que vosotros. Su armadura aún brilla un poco.
soulknight.quests.sealsquest$lostsoul.intro=No os asustéis. Yo también bajé a por el Amuleto... y no volví a subir.\n\nYog-Dzewa saca su fuerza de tres sellos demoníacos: uno en este piso y otro en cada uno de los dos siguientes. Mientras sigan en pie, sus puños serán más numerosos.\n\nRompedlos. Cada sello roto dejará salir a sus guardianes, así que estad preparados. Si lo hacéis deprisa, os daré mis armas.
soulknight.quests.sealsquest$lostsoul.intro_hint=MISIÓN: rompe los 3 SELLOS DEMONÍACOS (uno en cada uno de los pisos 21, 22 y 23, en la sala más lejana). Cada sello roto suelta una oleada de demonios. Con los 3 rotos, Yog-Dzewa tendrá un puño menos; si no, uno más. Si rompes cada uno en menos de 150 turnos, el premio será mejor.
soulknight.quests.sealsquest$lostsoul.hint=Quedan %d sellos. Están en la sala más alejada de cada piso.
soulknight.quests.sealsquest$lostsoul.came=¡Lo habéis conseguido! Habladme, tengo algo para vosotros.
soulknight.quests.sealsquest$lostsoul.after=Ahora puedo descansar. Acabad lo que yo empecé.
soulknight.quests.sealsquest$lostsoul.reward=Elige lo que fue mío:\n\n_Espada del paladín_: mandoble que hace la mitad más de daño a demonios y no muertos.\n_Armadura bendita_: armadura de placas; los demonios te hacen un 20 % menos.\n_Reliquia del paladín_: artefacto; alzada, te cura y quema a los demonios que veas.
soulknight.quests.sealsquest$lostsoul.reward_bonus=¡Qué rapidez! Mis armas son vuestras (+1):\n\n_Espada del paladín_: mandoble que hace la mitad más de daño a demonios y no muertos.\n_Armadura bendita_: armadura de placas; los demonios te hacen un 20 % menos.\n_Reliquia del paladín_: artefacto; alzada, te cura y quema a los demonios que veas.
soulknight.quests.sealsquest$lostsoul.got=Recibes: %s.
soulknight.quests.sealsquest$demonseal.name=sello demoníaco
soulknight.quests.sealsquest$demonseal.desc=Un obelisco negro con un glifo que late. Alimenta los puños de Yog-Dzewa. Si lo rompes, saldrán sus guardianes.
soulknight.quests.sealsquest$demonseal.desc_unknown=Un obelisco negro con un glifo que late. Algo lo protege: tus golpes no le hacen nada.
soulknight.quests.sealsquest$demonseal.unbroken=Sin efecto
soulknight.quests.sealsquest$paladinblade.name=espada del paladín
soulknight.quests.sealsquest$paladinblade.desc=Un mandoble bendito. Hace la mitad más de daño a los demonios y a los no muertos.
soulknight.quests.sealsquest$blessedplate.name=armadura bendita
soulknight.quests.sealsquest$blessedplate.desc=La armadura de placas del paladín, bendecida. Los demonios te hacen un 20 % menos de daño.
soulknight.quests.sealsquest$paladinrelic.name=reliquia del paladín
soulknight.quests.sealsquest$paladinrelic.desc=Un relicario de plata con una luz dentro. Se carga mientras luchas; alzado, te cura y quema a los demonios y no muertos que veas.
soulknight.quests.sealsquest$paladinrelic.desc_ready=La reliquia brilla.
soulknight.quests.sealsquest$paladinrelic.desc_charging=La reliquia se está cargando.
soulknight.quests.sealsquest$paladinrelic.ac_raise=ALZAR
soulknight.quests.sealsquest$paladinrelic.no_charge=La reliquia todavía no brilla.
soulknight.quests.sealsquest$paladinrelic.raised=¡La luz de la reliquia te cura y quema a los demonios!
soulknight.quests.sealsquest$paladinrelic.ready=Tu reliquia brilla.
soulknight.quests.sealsquest$paladinrelic.levelup=Tu reliquia brilla más.
