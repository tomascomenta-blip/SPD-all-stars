###el gusano de roca (Cuevas)
soulknight.quests.wormquest.cover=Los viejos túneles del gusano dan cobertura: quien esté en uno recibe la mitad de daño.
soulknight.quests.wormquest.followed=¡El gusano de roca ha cavado hasta la sala de DM-300!
soulknight.quests.wormquest$dwarfminer.name=viejo minero enano
soulknight.quests.wormquest$dwarfminer.desc=Un enano de barba blanca con un casco de latón y una vela encima. Huele a polvo de roca y a cerveza negra.
soulknight.quests.wormquest$dwarfminer.intro=¡Alto ahí! Esta mina se viene abajo. Hay un gusano de roca del tamaño de un túnel cavando bajo nuestros pies, y cada vez que asoma la cabeza se derrumba media galería.\n\nNo se le puede tocar bajo tierra. Esperad a que salga, que el suelo tiembla antes, y entonces dadle con todo.\n\nSi lo matáis antes de que asome demasiadas veces, la mina se salva... y os daré lo mejor de mi taller.
soulknight.quests.wormquest$dwarfminer.intro_hint=MISIÓN: mata al GUSANO DE ROCA y lleva su diente al minero enano. Bajo tierra no se le puede herir; sale bajo tus pies (el suelo marcado tiembla). Si lo matas antes de que salga 7 veces, el premio será mejor.
soulknight.quests.wormquest$dwarfminer.hint_0=Cuando tiemble el suelo, apártate de las casillas marcadas.
soulknight.quests.wormquest$dwarfminer.hint_1=Cuando sale, se queda fuera unos turnos. ¡Ese es el momento!
soulknight.quests.wormquest$dwarfminer.hint_2=El techo cae donde él asoma. No te quedes debajo.
soulknight.quests.wormquest$dwarfminer.bring=¡Lo habéis matado! Traedme ese diente, que lo cuelgo en la puerta.
soulknight.quests.wormquest$dwarfminer.thanks=¡Por las barbas de mis abuelos! La mina está a salvo. Escoged.
soulknight.quests.wormquest$dwarfminer.thanks_bonus=¡Y casi sin derrumbes! Os habéis ganado lo mejor del taller.
soulknight.quests.wormquest$dwarfminer.after=Sus túneles siguen ahí abajo. Quizá os sirvan algún día.
soulknight.quests.wormquest$dwarfminer.reward=Elige tu recompensa:\n\n_Taladro de diente de gusano_: maza pesada; uno de cada cinco golpes atraviesa la armadura.\n_Cota de escamas pétreas_: cota de malla; los golpes que no vienen de cerca (rocas, balas, explosiones) hacen un 20 % menos.\n_Saco de pólvora enana_: artefacto que de vez en cuando se llena lo bastante para hacer una bomba.
soulknight.quests.wormquest$dwarfminer.reward_bonus=¡La mina se ha salvado! Tu recompensa vale más (+1):\n\n_Taladro de diente de gusano_: maza pesada; uno de cada cinco golpes atraviesa la armadura.\n_Cota de escamas pétreas_: cota de malla; los golpes que no vienen de cerca (rocas, balas, explosiones) hacen un 20 % menos.\n_Saco de pólvora enana_: artefacto que de vez en cuando se llena lo bastante para hacer una bomba.
soulknight.quests.wormquest$dwarfminer.got=Recibes: %s.
soulknight.quests.wormquest$wormtooth.name=diente del gusano de roca
soulknight.quests.wormquest$wormtooth.desc=Un diente curvo y duro como el granito. El minero enano lo está esperando.
soulknight.quests.wormquest$wormdrill.name=taladro de diente de gusano
soulknight.quests.wormquest$wormdrill.desc=Una maza enana con un diente del gusano de roca por punta. Uno de cada cinco golpes encuentra una grieta y atraviesa la armadura.
soulknight.quests.wormquest$stonescalemail.name=cota de escamas pétreas
soulknight.quests.wormquest$stonescalemail.desc=Cota de malla cubierta con placas de la piel del gusano. Los golpes que no vienen de cerca (rocas, balas, explosiones) hacen un 20 % menos.
soulknight.quests.wormquest$powdersack.name=saco de pólvora enana
soulknight.quests.wormquest$powdersack.desc=Un saco de cuero que va juntando pólvora sola. Cuando se llena, puedes sacar una bomba.
soulknight.quests.wormquest$powdersack.desc_ready=El saco está lleno.
soulknight.quests.wormquest$powdersack.desc_charging=El saco se está llenando.
soulknight.quests.wormquest$powdersack.ac_make=SACAR BOMBA
soulknight.quests.wormquest$powdersack.no_charge=Al saco todavía le falta pólvora.
soulknight.quests.wormquest$powdersack.made=Sacas una bomba del saco.
soulknight.quests.wormquest$powdersack.ready=Tu saco de pólvora está lleno.
soulknight.quests.wormquest$powdersack.levelup=Tu saco de pólvora se llena antes.
soulknight.quests.wormquest$wormtunnels.desc=Un viejo túnel del gusano de roca. Quien está dentro recibe la mitad de daño.
soulknight.quests.rockworm.name=gusano de roca
soulknight.quests.rockworm.desc=Un gusano enorme de piedra que excava bajo el suelo. Bajo tierra no se le puede herir; cuando sale, la cueva se derrumba a su alrededor.
soulknight.quests.rockworm.subtitle=el devorador de la mina
soulknight.quests.rockworm.defeated=¡El gusano de roca ha caído!
soulknight.quests.rockworm.status_1=Fase I
soulknight.quests.rockworm.status_2=Fase II · Larvas
soulknight.quests.rockworm.status_3=Fase III · Furia
soulknight.quests.rockworm.status_under=Bajo tierra: no se le puede herir
soulknight.quests.rockworm.status_up=¡Fuera! ¡Atácale ahora!
soulknight.quests.rockworm.notice=*la roca cruje y el suelo tiembla*
soulknight.quests.rockworm.rumble=¡El suelo tiembla bajo tus pies!
soulknight.quests.rockworm.phase_2=El gusano de roca trae a sus larvas
soulknight.quests.rockworm.phase_3=¡El gusano de roca se enfurece!
soulknight.quests.rockworm.slain=El gusano de roca ha caído. Lleva su diente al minero enano.
soulknight.quests.rockworm.slain_bonus=¡El gusano ha caído antes de hundir la mina! Lleva su diente al minero enano.
soulknight.quests.rockworm$larva.name=larva de gusano
soulknight.quests.rockworm$larva.desc=Una larva pálida del gusano de roca. Muerde con ganas.

###el androide de mantenimiento (Nave)
soulknight.quests.androidquest.shutdown=¡El núcleo de M-4 se apaga! La nave os muestra dónde está cada criatura del piso.
soulknight.quests.androidquest.banner_shutdown=M-4 desconectado
soulknight.quests.androidquest.awake=¡M-4 se ha encendido! Las escaleras se bloquean: buscad la escotilla de emergencia.
soulknight.quests.androidquest.banner_awake=¡M-4 EN LÍNEA! ¡HUID!
soulknight.quests.androidquest.boot_start=¡Las criaturas inician el arranque de M-4! Cuantas más queden en pie, más rápido irá.
soulknight.quests.androidquest.boot_sub=secuencia de arranque en curso
soulknight.quests.androidquest.hatch_found=El radar marca la escotilla de emergencia.
soulknight.quests.androidquest.ship_helps=La nave sigue a la reina con su radar: la veréis sin ruido y la esclusa se recargará antes.
soulknight.quests.androidquest.hive_grown=La colmena ha crecido con la energía de M-4: empieza más grande.
soulknight.quests.androidquest$terminal.name=terminal de la nave
soulknight.quests.androidquest$terminal.desc=Una consola que aún funciona. La voz de la nave suena entrecortada por el altavoz.
soulknight.quests.androidquest$terminal.desc_boot=Arranque de M-4: %d %%.
soulknight.quests.androidquest$terminal.intro=*bzzt* ...ALERTA. Las criaturas intentan reactivar a la unidad de mantenimiento M-4 con fines hostiles. M-4 es indestructible una vez en línea.\n\nProtocolo recomendado: entrar en la bahía de mantenimiento, eliminar a los intrusos y destruir el núcleo de energía antes de que termine la secuencia de arranque.\n\nCuantos más intrusos sigan activos, más rápido avanzará. *bzzt*
soulknight.quests.androidquest$terminal.intro_hint=MISIÓN: rompe el NÚCLEO de M-4 antes de que las criaturas lo enciendan (empieza al entrar en su bahía; cuantas más vivan, más rápido). Si se enciende: no se le puede herir y hay que huir por la escotilla de emergencia. Si lo apagas antes del 50 %, el premio será mejor.
soulknight.quests.androidquest$terminal.hint=*bzzt* La bahía de mantenimiento está cerca. Prepárense antes de entrar.
soulknight.quests.androidquest$terminal.hurry=*bzzt* ¡El arranque avanza! ¡El núcleo, rápido!
soulknight.quests.androidquest$terminal.run=*BZZT* ¡CORRAN! ¡Busquen la escotilla de emergencia!
soulknight.quests.androidquest$terminal.after=*bzzt* Gracias por su colaboración. La nave les acompañará.
soulknight.quests.androidquest$terminal.reward=*bzzt* Como agradecimiento, la nave les ofrece material de M-4:\n\n_Puño hidráulico_: arma pesada que a veces lanza al enemigo hacia atrás.\n_Célula de repuesto_: artefacto; conectada, recarga tus varitas y armas de fuego.\n_Proyector de plasma_: artefacto; te envuelve en un escudo de plasma.
soulknight.quests.androidquest$terminal.reward_bonus=*bzzt* Desconexión limpia. La nave les ofrece su mejor material (+1):\n\n_Puño hidráulico_: arma pesada que a veces lanza al enemigo hacia atrás.\n_Célula de repuesto_: artefacto; conectada, recarga tus varitas y armas de fuego.\n_Proyector de plasma_: artefacto; te envuelve en un escudo de plasma.
soulknight.quests.androidquest$terminal.got=Recibes: %s.
soulknight.quests.androidquest$core.name=núcleo de M-4
soulknight.quests.androidquest$core.desc=El núcleo de energía del androide. Si se rompe, M-4 no volverá a encenderse.
soulknight.quests.androidquest$androidm4.name=M-4
soulknight.quests.androidquest$androidm4.desc=Una unidad de mantenimiento enorme, apagada en su dique de carga.
soulknight.quests.androidquest$androidm4.desc_awake=M-4 está en línea y es indestructible. Cada golpe suyo quita una cuarta parte de la vida. ¡Huye!
soulknight.quests.androidquest$androidm4.subtitle=unidad de mantenimiento
soulknight.quests.androidquest$androidm4.defeated=M-4 se apaga.
soulknight.quests.androidquest$androidm4.status_boot=Arranque: %d %%
soulknight.quests.androidquest$androidm4.status_awake=INDESTRUCTIBLE · huye a la escotilla
soulknight.quests.androidquest$androidm4.notice=OBJETIVOS LOCALIZADOS. INICIANDO MANTENIMIENTO.
soulknight.quests.androidquest$androidm4.immune=¡Sin efecto!
soulknight.quests.androidquest$hydraulicfist.name=puño hidráulico
soulknight.quests.androidquest$hydraulicfist.desc=El brazo hidráulico de M-4, adaptado para una mano. Tres de cada diez golpes lanzan al enemigo dos casillas hacia atrás.
soulknight.quests.androidquest$sparecell.name=célula de repuesto
soulknight.quests.androidquest$sparecell.desc=La célula de energía de repuesto de M-4. Se carga sola; conectada, da %d carga(s) a cada varita y arma de fuego que lleves.
