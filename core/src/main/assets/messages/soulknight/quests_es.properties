soulknight.quests.androidquest$sparecell.levelup=Tu célula de repuesto guarda más energía.
soulknight.quests.androidquest$plasmashield.name=proyector de plasma
soulknight.quests.androidquest$plasmashield.desc=Un proyector de escudo de la nave. Se carga mientras luchas; activado, te da %d de escudo de plasma.
