###el laboratorio inundado (Fondo marino)
soulknight.quests.labquest.sealed=Compuerta sellada (%d/3).
soulknight.quests.labquest.all_sealed=¡Las tres compuertas están selladas! Vuelve con el científico.
soulknight.quests.labquest.banner_done=Laboratorio sellado
soulknight.quests.labquest.burst=¡Las compuertas revientan! Algo enorme sale del laboratorio...
soulknight.quests.labquest.banner_burst=¡Las compuertas han reventado!
soulknight.quests.labquest.hurry=¡La presión sube! Quedan %d turnos.
soulknight.quests.labquest.hud=Compuertas %d/3 · presión: %d
soulknight.quests.labquest.bolt=¡Un rayo cae sobre el tentáculo del Kraken!
soulknight.quests.labquest$scientist.name=científico arrepentido
soulknight.quests.labquest$scientist.desc=Un científico con la bata manchada de algas y las gafas empañadas. Parece no haber dormido en semanas.
soulknight.quests.labquest$scientist.intro=¡Por fin alguien vivo! Yo... yo ayudé a crear a los sujetos 001, 002 y 004. Escaparon del laboratorio y ahora la presión del mar está reventando las compuertas.\n\nSi revientan, saldrá lo que guardábamos en el tanque grande: una cría del Kraken. Por favor, sellad las tres compuertas antes de que sea tarde. Una está aquí; las otras dos, en las salas más alejadas del piso. Os las he marcado en el mapa.\n\nCada una necesita tres vueltas de volante. ¡Rápido!
soulknight.quests.labquest$scientist.intro_hint=MISIÓN: sella las 3 COMPUERTAS antes de %d turnos (una en el laboratorio y dos lejos de él, en las salas marcadas en tu mapa; 3 turnos en cada volante). Si lo logras, los rayos del Kraken caerán sobre sus tentáculos. Si no, sale un amonite. Con la mitad del tiempo de sobra, el premio será mejor.
soulknight.quests.labquest$scientist.hint_0=¡Quedan %d compuertas! ¡No os paréis!
soulknight.quests.labquest$scientist.hint_1=Las otras compuertas están lejos de aquí. ¡Quedan %d!
soulknight.quests.labquest$scientist.hint_2=Tres vueltas a cada volante. ¡Quedan %d!
soulknight.quests.labquest$scientist.failed=Lo siento... lo siento tanto...
soulknight.quests.labquest$scientist.thanks=¡Lo habéis conseguido! El mar ya no entrará. Llevaos algo del laboratorio, por favor.
soulknight.quests.labquest$scientist.thanks_bonus=¡Y con tiempo de sobra! Os habéis ganado lo mejor que tengo.
soulknight.quests.labquest$scientist.after=He cambiado los cálculos del pararrayos de la superficie. Cuando llegue la tormenta, caerá sobre el Kraken... más o menos.
soulknight.quests.labquest$scientist.reward=Elige lo que quieras del laboratorio:\n\n_Traje de buzo_: armadura de escamas; bajo el mar gastas la mitad de aire.\n_Guja arpón_: guja larga (alcance 2) que a veces desgarra y hace sangrar.\n_Muestra estabilizada_: artefacto; bebida, cura y limpia venenos y males, y el vial se vuelve a llenar.
soulknight.quests.labquest$scientist.reward_bonus=¡Con tiempo de sobra! Lo mejor del laboratorio (+1):\n\n_Traje de buzo_: armadura de escamas; bajo el mar gastas la mitad de aire.\n_Guja arpón_: guja larga (alcance 2) que a veces desgarra y hace sangrar.\n_Muestra estabilizada_: artefacto; bebida, cura y limpia venenos y males, y el vial se vuelve a llenar.
soulknight.quests.labquest$scientist.got=Recibes: %s.
soulknight.quests.labquest$bulkhead.name=compuerta del laboratorio
soulknight.quests.labquest$bulkhead.desc=Una compuerta estanca que gotea. Tres vueltas de volante la sellarán.
soulknight.quests.labquest$bulkhead.desc_sealed=Sellada.
soulknight.quests.labquest$bulkhead.turning=Giras el volante (%d/3).
soulknight.quests.labquest$bulkhead.stuck=El volante está atascado. Quizá alguien del laboratorio sepa cómo moverlo.
soulknight.quests.labquest$bulkhead.too_late=Demasiado tarde: la compuerta ya ha reventado.
soulknight.quests.labquest$divesuit.name=traje de buzo
soulknight.quests.labquest$divesuit.desc=El traje de buzo reforzado del laboratorio. Protege como una armadura de escamas y, bajo el mar, gastas la mitad de aire.
soulknight.quests.labquest$harpoonglaive.name=guja arpón
soulknight.quests.labquest$harpoonglaive.desc=Una guja con una punta de arpón dentada. Llega a dos casillas y uno de cada cuatro golpes desgarra y hace sangrar.
soulknight.quests.labquest$stablesample.name=muestra estabilizada
soulknight.quests.labquest$stablesample.desc=Un vial del suero estabilizado del laboratorio. Bebido, cura %d de vida y limpia venenos y males; luego se vuelve a llenar poco a poco.
