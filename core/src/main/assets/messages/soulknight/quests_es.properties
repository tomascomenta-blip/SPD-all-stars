###misiones secundarias: minijefes
soulknight.quests.miniboss.phase=Fase %d

###la cacería de Colmillo Gris (Bosque)
soulknight.quests.huntquest.followed=¡Colmillo Gris ha seguido vuestro rastro hasta el claro!
soulknight.quests.huntquest$hunter.name=viejo cazador
soulknight.quests.huntquest$hunter.desc=Un cazador curtido, de barba gris y capucha de piel, con un arco largo que ha visto muchos inviernos. Lleva días acampado junto a la escalera, esperando a alguien con agallas.
soulknight.quests.huntquest$hunter.desc_helper=El viejo cazador ha venido con vosotros. Tiene una flecha preparada para la estrella del sacerdote.
soulknight.quests.huntquest$hunter.intro=¿Oís eso? Es Colmillo Gris, el jabalí más viejo de este bosque. Ha arrasado los campamentos trasgos de todo el piso y ahora es el amo de estos túneles.\n\nLlevo media vida detrás de su colmillo. Yo ya no tengo piernas para seguirle, pero vosotros sí. Cuidado: cuando le duela, huirá derribando paredes. Seguid sus huellas y aprovechad lo que vaya dejando por el camino.\n\nSi le hacéis caer en mis cepos, la cacería será limpia... y sabré recompensarlo.
soulknight.quests.huntquest$hunter.intro_hint=MISIÓN: caza a COLMILLO GRIS y lleva su colmillo al viejo cazador. Huye tres veces derribando muros: sigue sus HUELLAS. Si le haces caer en dos CEPOS, el premio será mejor.
soulknight.quests.huntquest$hunter.hint_0=Busca las huellas grandes. Donde acaban, está él.
soulknight.quests.huntquest$hunter.hint_1=Deja un cepo en su camino y apártate. Embiste sin mirar.
soulknight.quests.huntquest$hunter.hint_2=Cuando corra, no podréis herirle. Esperad a que se pare a lamerse las heridas.
soulknight.quests.huntquest$hunter.bring=¡Lo habéis cazado! Traedme el colmillo.
soulknight.quests.huntquest$hunter.thanks=¡Por fin! Este colmillo vale una vida entera. Escoged vuestra parte.
soulknight.quests.huntquest$hunter.thanks_bonus=¡Y cayó en mis cepos! Una cacería como las de antes. Os daré lo mejor que tengo.
soulknight.quests.huntquest$hunter.after=Que el bosque os sea leve. Nos veremos abajo.
soulknight.quests.huntquest$hunter.reward=Elige tu parte de la cacería:\n\n_Lanza de colmillo_: lanza larga (alcance 2) que a veces hace sangrar.\n_Capa de piel de jabalí_: armadura ligera; a veces derriba y aturde a quien te golpea de cerca.\n_Cuerno de caza_: artefacto que se carga luchando; al tocarlo, un jabato lucha a tu lado un rato.
soulknight.quests.huntquest$hunter.reward_bonus=¡Cacería limpia! Tu parte vale más (+1):\n\n_Lanza de colmillo_: lanza larga (alcance 2) que a veces hace sangrar.\n_Capa de piel de jabalí_: armadura ligera; a veces derriba y aturde a quien te golpea de cerca.\n_Cuerno de caza_: artefacto que se carga luchando; al tocarlo, un jabato lucha a tu lado un rato.
soulknight.quests.huntquest$hunter.got=Recibes: %s.
soulknight.quests.huntquest$hunter.helper_start=¡Yo os cubro! Cuando ese brujo llame a su estrella, tendré una flecha para ella.
soulknight.quests.huntquest$hunter.helper_star=¡Ahora! ¡Mis flechas ya la están agrietando! ¡Rematadla!
soulknight.quests.huntquest$hunter.helper_talk=Concentraos en el sacerdote. Yo vigilo el cielo.
soulknight.quests.huntquest$huntercamp.name=campamento del cazador
soulknight.quests.huntquest$huntercamp.desc=Una lona remendada, pieles secándose y una hoguera pequeña. Huele a humo y a resina.
soulknight.quests.huntquest$den.name=madriguera de Colmillo Gris
soulknight.quests.huntquest$den.desc=Un montículo de tierra y raíces lleno de huesos roídos. Aquí duerme el amo del bosque.
soulknight.quests.huntquest$wreckedcamp.name=campamento arrasado
soulknight.quests.huntquest$wreckedcamp.desc=Lo que queda de un campamento trasgo después de que pasara Colmillo Gris: astillas, un tambor reventado y alguna cosa de valor tirada por ahí.
soulknight.quests.huntquest$berrybush.name=arbusto de bayas
soulknight.quests.huntquest$berrybush.desc=Un arbusto cargado de bayas rojas. Comerlas te sentará bien.
soulknight.quests.huntquest$berrybush.desc_eaten=Ya no le quedan bayas.
soulknight.quests.huntquest$berrybush.eat=Las bayas están dulces y te dan fuerzas.
soulknight.quests.huntquest$huntertrap.name=cepo de cazador
soulknight.quests.huntquest$huntertrap.desc=Un cepo de hierro con dientes. Ponlo en el suelo y el primer jabalí que lo pise quedará atrapado: no podrá moverse y recibirá más daño durante unos turnos.
soulknight.quests.huntquest$huntertrap.ac_set=PONER
soulknight.quests.huntquest$huntertrap.set=Dejas el cepo abierto en el suelo.
soulknight.quests.huntquest$huntertrap.no_room=No puedes poner el cepo aquí.
soulknight.quests.huntquest$greytuskfang.name=colmillo de Colmillo Gris
soulknight.quests.huntquest$greytuskfang.desc=Un colmillo enorme y curvo, amarillo de años. El viejo cazador lo está esperando.
soulknight.quests.huntquest$tuskspear.name=lanza de colmillo
soulknight.quests.huntquest$tuskspear.desc=Una lanza larga de fresno con el colmillo de Colmillo Gris atado en la punta. Llega a dos casillas y uno de cada cuatro golpes hace sangrar.
soulknight.quests.huntquest$boarcloak.name=capa de piel de jabalí
soulknight.quests.huntquest$boarcloak.desc=La piel gris y dura del jabalí alfa, curtida como una armadura ligera. Uno de cada cinco golpes que recibes de cerca hace que el atacante salga despedido y aturdido.
soulknight.quests.huntquest$huntinghorn.name=cuerno de caza
soulknight.quests.huntquest$huntinghorn.desc=Un cuerno de jabalí con boquilla de hueso. Se carga mientras luchas; al tocarlo, %d jabato(s) del bosque acuden a luchar a tu lado durante un rato.
soulknight.quests.huntquest$huntinghorn.desc_ready=El cuerno está listo.
soulknight.quests.huntquest$huntinghorn.desc_charging=El cuerno aún no está listo.
soulknight.quests.huntquest$huntinghorn.ac_blow=TOCAR
soulknight.quests.huntquest$huntinghorn.no_charge=El cuerno todavía no está listo.
soulknight.quests.huntquest$huntinghorn.no_room=No hay sitio para que acudan.
soulknight.quests.huntquest$huntinghorn.blown=¡Tocas el cuerno y los jabatos acuden!
soulknight.quests.huntquest$huntinghorn.ready=Tu cuerno de caza está listo.
soulknight.quests.huntquest$huntinghorn.levelup=Tu cuerno de caza suena más fuerte.

soulknight.quests.greytusk.name=Colmillo Gris
soulknight.quests.greytusk.desc=El jabalí alfa del bosque: viejo, enorme, con el lomo lleno de cicatrices y unos colmillos que han partido árboles. Cuando le duele, huye derribando paredes.
soulknight.quests.greytusk.subtitle=el jabalí alfa del bosque
soulknight.quests.greytusk.defeated=¡Colmillo Gris ha caído!
soulknight.quests.greytusk.status_1=Fase I · Embiste
soulknight.quests.greytusk.status_2=Fase II · Pisotones y paredes
soulknight.quests.greytusk.status_3=Fase III · Furia
soulknight.quests.greytusk.status_4=Fase IV · La madriguera
soulknight.quests.greytusk.status_flee=¡Huye! Sigue sus huellas
soulknight.quests.greytusk.status_wait=Se lame las heridas...
soulknight.quests.greytusk.status_snared=¡Atrapado en el cepo!
soulknight.quests.greytusk.status_dazed=Aturdido
soulknight.quests.greytusk.notice=¡GRRRUOOOH!
soulknight.quests.greytusk.notice_2=*resopla y escarba el suelo*
soulknight.quests.greytusk.notice_3=¡GRRRAAAH!
soulknight.quests.greytusk.notice_4=*chilla, acorralado en su madriguera*
soulknight.quests.greytusk.back=¡Colmillo Gris vuelve a la carga!
soulknight.quests.greytusk.flee=*chilla y sale corriendo*
soulknight.quests.greytusk.den=Colmillo Gris se refugia en su madriguera
soulknight.quests.greytusk.phase_2=Colmillo Gris huye derribando muros
soulknight.quests.greytusk.phase_3=¡Colmillo Gris se enfurece y huye otra vez!
soulknight.quests.greytusk.phase_4=¡Colmillo Gris corre hacia su madriguera!
soulknight.quests.greytusk.snared=¡Atrapado!
soulknight.quests.greytusk.snared_log=¡Colmillo Gris cae en el cepo! (%d)
soulknight.quests.greytusk.call=*llama a sus jabatos*
soulknight.quests.greytusk.charge=¡Embiste!
soulknight.quests.greytusk.dazed=¡Aturdido!
soulknight.quests.greytusk.slain=Colmillo Gris ha caído. Lleva su colmillo al viejo cazador.
soulknight.quests.greytusk.slain_bonus=¡Colmillo Gris ha caído en una cacería limpia! Lleva su colmillo al viejo cazador.
soulknight.quests.greytusk$boarlet.name=jabato
soulknight.quests.greytusk$boarlet.desc=Una cría rayada de jabalí. Pequeña, pero muerde con ganas.

###el caimán de la cloaca (Alcantarillas)
soulknight.quests.caimanquest.dry=El alcantarillero ha cerrado los desagües: la sala de Goo está seca y no podrá curarse en el agua.
soulknight.quests.caimanquest.followed=¡El caimán de la cloaca ha llegado hasta la sala de Goo!
soulknight.quests.caimanquest$sewerman.name=viejo alcantarillero
soulknight.quests.caimanquest$sewerman.desc=Un alcantarillero de los de antes, con mono azul, botas de goma, farol y una pértiga con gancho. Conoce cada tubería de estas cloacas.
soulknight.quests.caimanquest$sewerman.intro=Los jóvenes dicen que es una leyenda. ¡Ja! Yo lo he visto con estos ojos: un caimán como una barca, viviendo en el canal grande de este piso.\n\nSe esconde bajo el agua y no hay quien le haga un rasguño ahí dentro. Pero en seco es lento y blando. Sacadlo del agua y acabad con él.\n\nSi lo matáis en tierra firme, sin una gota de agua de por medio, os daré lo mejor que tengo. Y cerraré los desagües de abajo, que algo grande y viscoso anda chapoteando por allí.
soulknight.quests.caimanquest$sewerman.intro_hint=MISIÓN: mata al CAIMÁN DE LA CLOACA del canal de este piso y lleva su diente al viejo alcantarillero. Bajo el agua casi no le haces daño; en SECO recibe más. Si lo rematas en tierra firme, el premio será mejor.
soulknight.quests.caimanquest$sewerman.hint_0=En el canal grande. Si veis dos ojos sobre el agua, no os acerquéis a la orilla.
soulknight.quests.caimanquest$sewerman.hint_1=Retroceded hasta lo seco: saldrá a por vosotros y ahí es vulnerable.
soulknight.quests.caimanquest$sewerman.hint_2=Si os agarra, os arrastrará al agua. No os quedéis a su lado demasiado tiempo.
soulknight.quests.caimanquest$sewerman.bring=¡Lo habéis matado! Traedme el diente, que no me lo creo.
soulknight.quests.caimanquest$sewerman.thanks=¡Es verdad! ¡El caimán de la cloaca! Escoged lo que queráis.
soulknight.quests.caimanquest$sewerman.thanks_bonus=¡Y en seco, como os dije! Os habéis ganado lo mejor.
soulknight.quests.caimanquest$sewerman.after=Ya he cerrado los desagües de abajo. Suerte con lo que vive allí.
soulknight.quests.caimanquest$sewerman.reward=Elige tu recompensa:\n\n_Piel de caimán_: armadura ligera; mientras pisas agua recibes un 25 % menos de daño.\n_Garfio del alcantarillero_: pértiga larga (alcance 2) que a veces acerca al enemigo.\n_Farol del alcantarillero_: artefacto; encendido, ilumina y descubre los alrededores, sus trampas y sus puertas secretas.
soulknight.quests.caimanquest$sewerman.reward_bonus=¡Bien hecho en seco! Tu recompensa vale más (+1):\n\n_Piel de caimán_: armadura ligera; mientras pisas agua recibes un 25 % menos de daño.\n_Garfio del alcantarillero_: pértiga larga (alcance 2) que a veces acerca al enemigo.\n_Farol del alcantarillero_: artefacto; encendido, ilumina y descubre los alrededores, sus trampas y sus puertas secretas.
soulknight.quests.caimanquest$sewerman.got=Recibes: %s.
soulknight.quests.caimanquest$caimantooth.name=diente de caimán
soulknight.quests.caimanquest$caimantooth.desc=Un diente cónico tan largo como tu dedo. El viejo alcantarillero querrá verlo.
soulknight.quests.caimanquest$caimanhide.name=piel de caimán
soulknight.quests.caimanquest$caimanhide.desc=Escamas verdes curtidas como una armadura ligera. Mientras pisas agua, recibes un 25 % menos de daño.
soulknight.quests.caimanquest$sewerhook.name=garfio del alcantarillero
soulknight.quests.caimanquest$sewerhook.desc=La vieja pértiga del alcantarillero, con un gancho de hierro en la punta. Llega a dos casillas y, a veces, engancha al enemigo y lo acerca.
soulknight.quests.caimanquest$sewerlantern.name=farol del alcantarillero
soulknight.quests.caimanquest$sewerlantern.desc=Un farol de hierro con el cristal amarillo. Encendido, te da luz e ilumina el mapa a %d casillas, mostrando trampas y puertas secretas. Se vuelve a llenar poco a poco.
soulknight.quests.caimanquest$sewerlantern.desc_ready=El farol está listo.
soulknight.quests.caimanquest$sewerlantern.desc_charging=El farol se está llenando.
soulknight.quests.caimanquest$sewerlantern.ac_light=ENCENDER
soulknight.quests.caimanquest$sewerlantern.no_charge=Al farol le falta aceite todavía.
soulknight.quests.caimanquest$sewerlantern.lit=El farol ilumina los alrededores.
soulknight.quests.caimanquest$sewerlantern.lit_found=¡El farol descubre algo escondido!
soulknight.quests.caimanquest$sewerlantern.ready=Tu farol vuelve a estar listo.
soulknight.quests.caimanquest$sewerlantern.levelup=Tu farol brilla más.

soulknight.quests.caiman.name=caimán de la cloaca
soulknight.quests.caiman.desc=Un caimán enorme que vive en los canales de las alcantarillas. Bajo el agua casi no se le puede herir; fuera de ella es lento y vulnerable.
soulknight.quests.caiman.subtitle=la leyenda del canal
soulknight.quests.caiman.defeated=¡El caimán de la cloaca ha caído!
soulknight.quests.caiman.status_1=Fase I
soulknight.quests.caiman.status_2=Fase II · El giro mortal
soulknight.quests.caiman.status_3=Fase III · Furia
soulknight.quests.caiman.status_under=Bajo el agua: apenas recibe daño
soulknight.quests.caiman.status_land=¡En seco! Recibe más daño
soulknight.quests.caiman.notice=*dos ojos amarillos asoman sobre el agua*
soulknight.quests.caiman.phase_2=El caimán agarra y arrastra al agua
soulknight.quests.caiman.phase_3=¡El caimán se enfurece!
soulknight.quests.caiman.rats=*las ratas del canal acuden al olor de la sangre*
soulknight.quests.caiman.roll=¡Te agarra!
soulknight.quests.caiman.dragged=¡El caimán te arrastra al agua!
soulknight.quests.caiman.slain=El caimán ha caído. Lleva su diente al viejo alcantarillero.
soulknight.quests.caiman.slain_dry=¡Rematado en seco! Lleva su diente al viejo alcantarillero.

###el torneo del heraldo (Reino, piso 8)
soulknight.quests.tourneyquest.easy_0=soldado veterano
soulknight.quests.tourneyquest.easy_1=espadachín campeón
soulknight.quests.tourneyquest.easy_2=caballero negro de la liza
