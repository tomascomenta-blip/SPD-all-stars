###the dark continent: surviving out there
soulknight.continent.survival.survival.first=Each of you carries a campfire kit. By a fire you can cook, make things and rest; but its light is seen from very far away.
soulknight.continent.survival.survival.first_coop=Stay together. Out here, whoever strays from the group doesn't come back alone.

soulknight.continent.survival.tether.name=Alone in the dark
soulknight.continent.survival.tether.desc=You're more than %d steps from the nearest friend and the dark has closed in around you: you can barely see, the corruption creeps in, and something is coming.\n\nGo back to the group and it lets you go.\n\nTurns alone: %d.
soulknight.continent.survival.tether.alone=alone!
soulknight.continent.survival.tether.lost=The dark swallows you: you've strayed too far from the group. Go back before something finds you.
soulknight.continent.survival.tether.friend_lost=%s has strayed from the group and the dark has swallowed them.
soulknight.continent.survival.tether.back=You're back with the group. The dark lets you go.
soulknight.continent.survival.tether.banner=You're alone in the dark. Go back to the group!

soulknight.continent.survival.stalker.name=stalker of the dark
soulknight.continent.survival.stalker.desc=A shape blacker than the night around it, which only comes for those who walk alone. It's faster than you, and every bite leaves corruption behind.\n\nIt can be fought, but the sure way to be rid of it is to go back to your friends: then it simply isn't there.
soulknight.continent.survival.stalker.comes=Something has caught your scent in the dark, and it's coming.
soulknight.continent.survival.stalker.fades=The shape that hunted you comes apart in the dark.

soulknight.continent.survival.campfire.name=campfire
soulknight.continent.survival.campfire.desc=A small fire in the middle of the ash. Resting beside it heals and keeps the corruption back, and you can cook and make things here.\n\nIts light can be seen from very far away: you won't be the only ones coming to it.\n\nIt will burn for about %d more turns.
soulknight.continent.survival.campfire.desc_out=Just embers and a thread of smoke. A torch would get it going again.
soulknight.continent.survival.campfire.out=The campfire goes out.

soulknight.continent.survival.campfirekit.name=campfire kit
soulknight.continent.survival.campfirekit.desc=Three sticks tied together, a flint and a handful of tinder. Set it down and you'll have a fire for a good while.\n\nBy the fire you can rest, cook and make things. But over here light draws things in.
soulknight.continent.survival.campfirekit.ac_place=SET DOWN
soulknight.continent.survival.campfirekit.no_room=There's no room for a fire here: it needs open ground around it.
soulknight.continent.survival.campfirekit.building=You stack the wood and strike the flint.

soulknight.continent.survival.wndcampfire.burning=It burns steadily: about %d turns left.\nResting beside it heals and keeps the corruption back; its light is seen from far away.
soulknight.continent.survival.wndcampfire.embers=Only embers are left. Feed it a torch and it will burn again.
soulknight.continent.survival.wndcampfire.cook=Cook everything (%d)
soulknight.continent.survival.wndcampfire.feed=Feed it a torch (you have %d)
soulknight.continent.survival.wndcampfire.make=Make
soulknight.continent.survival.wndcampfire.close=Close

soulknight.continent.survival.firerecipes.kit=Campfire kit: 2 torches
soulknight.continent.survival.firerecipes.torches=2 torches: 1 colossus bone
soulknight.continent.survival.firerecipes.bait=Bait: 1 raw meat (colossus or corrupt)
soulknight.continent.survival.firerecipes.poultice=Poultice: 2 corrupt food
soulknight.continent.survival.firerecipes.sacred_torch=Sacred light torch: 1 torch (lighting it costs essence)
soulknight.continent.survival.firerecipes.made=You make: %s.
soulknight.continent.survival.firerecipes.cooked=You cook %d pieces of food over the fire. The dark burns out of them.
soulknight.continent.survival.firerecipes.fed=The fire takes the torch and burns higher.

soulknight.continent.survival.sacredtorch.name=sacred light torch
soulknight.continent.survival.sacredtorch.desc=A torch wrapped in white cloth, still unlit. Lighting it burns a drop of the party's sacred essence: then it shines for a long while, %d steps of light across, the monsters keep away from whoever carries it and the yogs flee.\n\nWhen it goes out, that essence is gone for good.\n\nYou have %d of %d.
soulknight.continent.survival.sacredtorch.ac_light=LIGHT
soulknight.continent.survival.sacredtorch.confirm=Lighting it burns ONE drop of the party's sacred essence (you have %d of %d). When the torch goes out, that drop will be lost forever.\n\nLight it?
soulknight.continent.survival.sacredtorch.yes=Sacrifice the essence
soulknight.continent.survival.sacredtorch.no=Not now
soulknight.continent.survival.sacredtorch.no_essence=You have no sacred essence left to burn.
soulknight.continent.survival.sacredtorch.already=You already carry a sacred light.
soulknight.continent.survival.sacredtorch.lit=The sacred light flares up! The dark draws back. Essence left: %d of %d.

soulknight.continent.survival.sacredlight.name=Sacred light
soulknight.continent.survival.sacredlight.desc=You carry a sacred light: you see far, the monsters won't come close and the yogs flee from it.\n\nIt will burn for %d more turns. When it goes out, its essence is lost.
soulknight.continent.survival.sacredlight.out=The sacred light goes out. The drop of essence that burned in it is lost.

soulknight.continent.survival.colossusmeat$raw.name=raw colossus meat
soulknight.continent.survival.colossusmeat$raw.desc=A huge chunk of something that walked over the ash, bone and all. It fills you up raw, but the dark comes with it. Cooked over a fire it's the best meal over here.
soulknight.continent.survival.colossusmeat$roast.name=roast colossus meat
soulknight.continent.survival.colossusmeat$roast.desc=Colossus meat browned over the fire, with all its fat crackling. The flames have burned the dark out of it: a real meal.

soulknight.continent.survival.colossusbone.name=colossus bone
soulknight.continent.survival.colossusbone.desc=A long bone from one of the big ones, full of marrow that burns slowly. By a fire you can make two torches out of it.

soulknight.continent.survival.bait.name=bait
soulknight.continent.survival.bait.desc=A lump of meat tied with string and smeared in blood. Throw it: whatever is hungry nearby goes to see what it is. Useful to pull them off someone, or away from where you want to go.

soulknight.continent.survival.poultice.name=poultice
soulknight.continent.survival.poultice.desc=Corrupt food boiled until the dark came out of it. What's left is a warm paste: on a wound it closes it over a few turns and draws out a little of the corruption.
soulknight.continent.survival.poultice.ac_apply=APPLY
soulknight.continent.survival.poultice.applied=The paste stings, then warms. The wound starts to close.
soulknight.continent.hunt.climbing.name=Climbing
soulknight.continent.hunt.climbing.desc=You are on a colossus's back. Your blows land on its weak spot. Every turn you lose some grip, and a lot when it shakes; with no grip left you fall. Tap the ground off its body to jump down.
soulknight.continent.hunt.climbing.up=You grab onto the back of %s.
soulknight.continent.hunt.climbing.shaken=%s shakes itself to throw you off!
soulknight.continent.hunt.climbing.fell=You slip and fall off %s.
soulknight.continent.hunt.mutations.name=Mutations
soulknight.continent.hunt.mutations.desc=What the colossus parts you ate have left in you.
soulknight.continent.hunt.mutations.again=You already carry this inside. It only feeds you.
soulknight.continent.hunt.mutations.sick=Your body takes it badly for a while.
soulknight.continent.hunt.mutationpart.desc=Eating it nearly always pays off, but sometimes the body takes it badly for a while.
soulknight.continent.hunt.mutationpart.eat_msg=You eat it. Something changes inside you.
soulknight.continent.hunt.bonegrapple.name=bone grapple
soulknight.continent.hunt.bonegrapple.desc=A bone hook on a cord. Throw it from right beside one of the big ones (8x8 or more) to get up on its back. From there your blows land on its weak spot. It isn't used up.
soulknight.continent.hunt.bonegrapple.ac_climb=CLIMB
soulknight.continent.hunt.bonegrapple.prompt=Which one do you climb?
soulknight.continent.hunt.bonegrapple.already=You're already up there. Tap the ground to jump down.
soulknight.continent.hunt.bonegrapple.nothing=There's nothing big enough to climb there.
soulknight.continent.hunt.bonegrapple.far=You have to be right against its body.
soulknight.continent.hunt.lightcollar.name=collar of sacred light
soulknight.continent.hunt.lightcollar.desc=A band of sacred light. Put on one of the beasts that can be tamed, it belongs to the party for good (only one at a time). Each asks for something: the turtle, food (2 roasts of colossus); the bison, freeing it of its fleas; the rex, being knocked down and spared; the tarantula, 1 essence; the root elk, never having seen you (and no light on you); the bronze guard, its armour broken (a third of it or less); the ice elk, being knocked down; the skinless colossus, raw colossus meat; the lighthouse crab, a sacred torch for its lamp.
soulknight.continent.hunt.lightcollar.ac_tame=TAME
soulknight.continent.hunt.lightcollar.prompt=Which one do you put it on?
soulknight.continent.hunt.lightcollar.wild=That beast won't be tamed.
soulknight.continent.hunt.lightcollar.far=You have to be right against it.
soulknight.continent.hunt.lightcollar.one=The party already has a tamed beast.
soulknight.continent.hunt.colossusforge.name=colossus forge
soulknight.continent.hunt.colossusforge.desc=A forge of sacred fire with an anvil made of a colossus vertebra. Colossus bones upgrade your weapon or armor one level; each time a piece goes back on the anvil it costs one more bone.
soulknight.continent.hunt.colossusforge.forged=The sacred fire melts the bone into your %s.
soulknight.continent.hunt.colossusforge$wndforge.text=You have %d colossus bones.
soulknight.continent.hunt.colossusforge$wndforge.forge=Reforge %s (%d bones)
soulknight.continent.hunt.colossusforge$wndforge.none=(nothing equipped)
soulknight.continent.hunt.colossusforge$wndforge.close=Close
soulknight.continent.survival.firerecipes.grapple=Bone grapple: 1 colossus bone
soulknight.continent.survival.firerecipes.collar=Collar of sacred light: 2 torches and 1 colossus bone
soulknight.continent.hunt.mutationpart.name_0=ember heart
soulknight.continent.hunt.mutationpart.desc_0=The Walking Pyre's heart, still burning inside.
soulknight.continent.hunt.mutations.gift_0=Fire no longer bites you, and sometimes your blows set things alight.
soulknight.continent.hunt.mutationpart.name_1=nape vertebra
soulknight.continent.hunt.mutationpart.desc_1=A piece of the slag giant's nape, full of molten marrow.
soulknight.continent.hunt.mutations.gift_1=Your back grows: you are stronger (+1 strength).
soulknight.continent.hunt.mutationpart.name_2=chimney plate
soulknight.continent.hunt.mutationpart.desc_2=A plate off the volcano turtle's crater, still warm.
soulknight.continent.hunt.mutations.gift_2=A crust of stone grows under your skin: blows hurt you less.
soulknight.continent.hunt.mutationpart.name_3=gill
soulknight.continent.hunt.mutationpart.desc_3=A gill of the ash whale, which strains the ash out of the air.
soulknight.continent.hunt.mutations.gift_3=You breathe the ash without coughing and your eyes get used to the dark: you see a bit further.
soulknight.continent.hunt.mutationpart.name_4=tarantula egg
soulknight.continent.hunt.mutationpart.desc_4=An egg from the ash tarantula's sac. Something moves inside.
soulknight.continent.hunt.mutations.gift_4=A sticky thread comes out of your hands: sometimes your blows leave the enemy tangled.
soulknight.continent.hunt.mutationpart.name_5=fire gland
soulknight.continent.hunt.mutationpart.desc_5=The beak rex's throat sac, full of burning oil.
soulknight.continent.hunt.mutations.gift_5=Your blood burns: you hit harder.
soulknight.continent.hunt.mutationpart.name_6=obsidian shard
soulknight.continent.hunt.mutationpart.desc_6=A piece of the obsidian colossus's shell, sharp as a broken mirror.
soulknight.continent.hunt.mutations.gift_6=Your skin turns to glass at the edges: whoever hits you up close gets cut.
soulknight.continent.hunt.mutationpart.name_7=bison horn
soulknight.continent.hunt.mutationpart.desc_7=A basalt horn from a bison of the plains.
soulknight.continent.hunt.mutations.gift_7=You toughen like the herd: more maximum health.
soulknight.continent.hunt.mutationpart.name_8=beetle beak
soulknight.continent.hunt.mutationpart.desc_8=The smelter beetle's horn, which cuts hot metal.
soulknight.continent.hunt.mutations.gift_8=You know where to strike the big ones: you knock them down sooner.
soulknight.continent.hunt.mutationpart.name_9=salamander throat
soulknight.continent.hunt.mutationpart.desc_9=The throat sac of a black lava salamander.
soulknight.continent.hunt.mutations.gift_9=Black lava no longer burns you.
soulknight.continent.hunt.mutationpart.name_10=stitched goat head
soulknight.continent.hunt.mutationpart.desc_10=The goat head of the flesh chimera, its eyes sewn shut. It never agreed with the other two.
soulknight.continent.hunt.mutations.gift_10=Your head stops listening to the rest of you: nothing makes it spin and nothing scares it.
soulknight.continent.hunt.mutations.sick_10=The stitches pull: your arms go weak for a while.
soulknight.continent.hunt.mutationpart.name_11=flesh comb
soulknight.continent.hunt.mutationpart.desc_11=A piece of the hive boar's hive, still warm. Something buzzes in the cells.
soulknight.continent.hunt.mutations.gift_11=Wasps of flesh nest under your skin: whoever hits you up close gets stung now and then.
soulknight.continent.hunt.mutations.sick_11=The wasps sting you on their way in.
soulknight.continent.hunt.mutationpart.name_12=rib of the hollow
soulknight.continent.hunt.mutationpart.desc_12=A rib from the hollow bear's empty chest. It's cold, and something on the other side holds on to it.
soulknight.continent.hunt.mutations.gift_12=A hollow opens in you: now and then pale hands come out of it and hold whoever hits you up close.
soulknight.continent.hunt.mutations.sick_12=The hollow is hungry, and so are you.
soulknight.continent.hunt.mutationpart.name_13=antler eye
soulknight.continent.hunt.mutationpart.desc_13=One of the eyes that hang like fruit from the root elk's antlers. It blinks.
soulknight.continent.hunt.mutations.gift_13=Eyes open on your skin: you see much further in the dark.
soulknight.continent.hunt.mutations.sick_13=Every eye on your skin screams at once. Everything around heard it.
soulknight.continent.hunt.mutationpart.name_14=toothed flower
soulknight.continent.hunt.mutationpart.desc_14=A petal of the flower that opens in the infected giraffe's neck, teeth and all.
soulknight.continent.hunt.mutations.gift_14=Your blows leave spores in the wound: often the enemy grows weak.
soulknight.continent.hunt.mutations.sick_14=The spores go for you first.
soulknight.continent.hunt.mutationpart.name_15=knot of the aorta
soulknight.continent.hunt.mutationpart.desc_15=The knot of veins at the base of the forest heart's aorta. It still beats in your hand.
soulknight.continent.hunt.mutations.gift_15=A second heart beats in you: more maximum health, and your wounds close by themselves.
soulknight.continent.hunt.mutations.sick_15=Two hearts out of time: your head spins.
soulknight.continent.hunt.mutationpart.name_16=swollen crop
soulknight.continent.hunt.mutationpart.desc_16=The bloated beggar's crop, tight with the gas of everything he ate.
soulknight.continent.hunt.mutations.gift_16=Your guts take anything: poison and foul gas no longer harm you.
soulknight.continent.hunt.mutations.sick_16=You swell up for a while and can hardly move.
soulknight.continent.hunt.mutationpart.name_17=bronze plate
soulknight.continent.hunt.mutationpart.desc_17=A plate off the bronze guard's armour, green with age.
soulknight.continent.hunt.mutations.gift_17=Bronze grows into your skin: blows hurt you less and you no longer bleed.
soulknight.continent.hunt.mutations.sick_17=The plate pinches a joint: you limp for a while.
soulknight.continent.hunt.mutationpart.name_18=living axle
soulknight.continent.hunt.mutationpart.desc_18=The axle of the living carriage, a bone that turned for years.
soulknight.continent.hunt.mutations.gift_18=Nothing stops you: you can't be slowed, crippled or held down.
soulknight.continent.hunt.mutations.sick_18=Everything turns around you for a while.
soulknight.continent.hunt.mutationpart.name_19=sewn lip
soulknight.continent.hunt.mutationpart.desc_19=The chained one's lip, still sewn with yog gut.
soulknight.continent.hunt.mutations.gift_19=You learn his silence: you are much harder to notice.
soulknight.continent.hunt.mutations.sick_19=Your mouth shuts tight for a while: you go hungry.
soulknight.continent.hunt.mutationpart.name_20=crucible
soulknight.continent.hunt.mutationpart.desc_20=The smelter mother's mouth, a crucible of brass with molten metal still in it.
soulknight.continent.hunt.mutations.gift_20=Molten metal runs in your veins: your blows burn and fire bites you less.
soulknight.continent.hunt.mutations.sick_20=The metal weighs: your arms go weak for a while.
soulknight.continent.hunt.mutationpart.name_21=furnace bell
soulknight.continent.hunt.mutationpart.desc_21=A bell off the furnace cathedral's tower, still hot from the fire inside.
soulknight.continent.hunt.mutations.gift_21=Fire no longer bites you, and when you are about to fall a bell rings in you: whoever is close runs.
soulknight.continent.hunt.mutations.sick_21=The bell won't stop ringing in your head.
soulknight.continent.hunt.mutationpart.name_22=sunken crown
soulknight.continent.hunt.mutationpart.desc_22=The last king's crown, sunk into the flesh of his head.
soulknight.continent.hunt.mutations.gift_22=The strength of the city passes to you: you are much stronger (+2 strength).
soulknight.continent.hunt.mutations.sick_22=The weight of the crown: your arms go weak for a long while.
soulknight.continent.hunt.mutationpart.name_23=frozen muscle
soulknight.continent.hunt.mutationpart.desc_23=A strip of the flayed mammoth's frozen muscle. It never thaws.
soulknight.continent.hunt.mutations.gift_23=The cold no longer gets into you: you can't be chilled or frozen.
soulknight.continent.hunt.mutations.sick_23=Your muscles go stiff for a while.
soulknight.continent.hunt.mutationpart.name_24=sickle claw
soulknight.continent.hunt.mutationpart.desc_24=The frost raptor's sickle claw, sharp enough to shave ice.
soulknight.continent.hunt.mutations.gift_24=Your nails curve and sharpen: your blows often leave the enemy bleeding.
soulknight.continent.hunt.mutations.sick_24=The claw grows into your foot first: you limp for a while.
soulknight.continent.hunt.mutationpart.name_25=ice antler
soulknight.continent.hunt.mutationpart.desc_25=A tine of the ice elk's antlers of clear ice.
soulknight.continent.hunt.mutations.gift_25=Your blows carry the frost: often they leave the enemy chilled.
soulknight.continent.hunt.mutations.sick_25=The cold goes through you first.
soulknight.continent.hunt.mutationpart.name_26=wing membrane
soulknight.continent.hunt.mutationpart.desc_26=A torn piece of the corrupt wyvern's wing, crusted with frost.
soulknight.continent.hunt.mutations.gift_26=You move light as the wind: blows miss you more often.
soulknight.continent.hunt.mutations.sick_26=You feel the ground falling away under you.
soulknight.continent.hunt.mutationpart.name_27=glacier heart
soulknight.continent.hunt.mutationpart.desc_27=A lump of blue ice from deep inside the walking mountain.
soulknight.continent.hunt.mutations.gift_27=Your flesh hardens like old ice: every blow you take is lighter, and you can't be frozen.
soulknight.continent.hunt.mutations.sick_27=The ice slows you down for a while.
soulknight.continent.hunt.mutationpart.name_28=shepherd's frost
soulknight.continent.hunt.mutationpart.desc_28=Frost that never melts, taken from the shepherd's hooded cloak.
soulknight.continent.hunt.mutations.gift_28=The blizzard walks with you: the cold can't touch you, whoever hits you up close freezes, and you see further.
soulknight.continent.hunt.mutations.sick_28=The cold eats what you had in you.
soulknight.continent.hunt.mutationpart.name_29=horned skull
soulknight.continent.hunt.mutationpart.desc_29=The bone chimera's big skull, a dim light still in the socket.
soulknight.continent.hunt.mutations.gift_29=Your jaw and your arms keep something of its bite: you hit harder.
soulknight.continent.hunt.mutations.sick_29=Its roar goes round and round in your head.
soulknight.continent.hunt.mutationpart.name_30=spade claw
soulknight.continent.hunt.mutationpart.desc_30=A spade claw of bone from the rib digger, the kind that digs through skeletons.
soulknight.continent.hunt.mutations.gift_30=You know where the good bones are: every big one that falls near you leaves one more.
soulknight.continent.hunt.mutations.sick_30=Your eyes go as blind as a mole's for a while.
soulknight.continent.hunt.mutationpart.name_31=bare spine
soulknight.continent.hunt.mutationpart.desc_31=A piece of the skinless colossus's bare spine. Even like this it's hungry.
soulknight.continent.hunt.mutations.gift_31=You take its hunger: colossus meat no longer brings the dark and it heals your wounds.
soulknight.continent.hunt.mutations.sick_31=Its hunger comes to you all at once.
soulknight.continent.hunt.mutationpart.name_32=mist tear
soulknight.continent.hunt.mutationpart.desc_32=A tear of yellow mist from the mourner's empty sockets, held in a skin of itself.
soulknight.continent.hunt.mutations.gift_32=You learn to mourn: whatever your blow kills gives you back some life.
soulknight.continent.hunt.mutations.sick_32=The tears blind you for a while.
soulknight.continent.hunt.mutationpart.name_33=soul of the ribs
soulknight.continent.hunt.mutationpart.desc_33=The soul that glowed inside the ribs of the last one standing. It still won't lie down.
soulknight.continent.hunt.mutations.gift_33=You won't fall either: once in a long while, a blow that would kill you leaves you standing.
soulknight.continent.hunt.mutations.sick_33=The old soul brings the dark of the graveyard with it.
soulknight.continent.hunt.mutationpart.name_34=ink sac
soulknight.continent.hunt.mutationpart.desc_34=The ink eel's sac, black and full.
soulknight.continent.hunt.mutations.gift_34=Your eyes get used to the ink: nothing can blind you.
soulknight.continent.hunt.mutations.sick_34=The ink burns on the way down.
soulknight.continent.hunt.mutationpart.name_35=lamp glass
soulknight.continent.hunt.mutationpart.desc_35=A pane of the lighthouse crab's lamp, still warm with light.
soulknight.continent.hunt.mutations.gift_35=Light flashes from your blows: now and then they blind the enemy.
soulknight.continent.hunt.mutations.sick_35=The flash goes off in your own eyes.
soulknight.continent.hunt.mutationpart.name_36=yog plate
soulknight.continent.hunt.mutationpart.desc_36=A glowing plate of yog flesh off the tide octopus's mantle.
soulknight.continent.hunt.mutations.gift_36=Your body learns the yog: the corruption gets into you half as fast.
soulknight.continent.hunt.mutations.sick_36=Before that, the yog flesh leaves some of its dark in you.
soulknight.continent.hunt.mutationpart.name_37=island hide
soulknight.continent.hunt.mutationpart.desc_37=A piece of the island lizard's back: yog earth, roots and a shut eyelid.
soulknight.continent.hunt.mutations.gift_37=Standing still you look like ground: you are very hard to notice.
soulknight.continent.hunt.mutations.sick_37=Your skin turns to earth for a while and weighs you down.
soulknight.continent.hunt.mutationpart.name_38=true eye
soulknight.continent.hunt.mutationpart.desc_38=A piece of the great eye of yog in its true form. It looks back.
soulknight.continent.hunt.mutations.gift_38=You see as yog sees: much further in the dark, and nothing can blind, daze or scare you.
soulknight.continent.hunt.mutations.sick_38=Yog looks at you from inside. The dark grows.
soulknight.continent.hunt.mutationpart.name_39=lamprey mouth
soulknight.continent.hunt.mutationpart.desc_39=A ring of teeth from the blind worm's mouth.
soulknight.continent.hunt.mutations.gift_39=Your blows drink: some of the life they take goes into you.
soulknight.continent.hunt.mutations.sick_39=Eyeless, like the worm, for a while.
soulknight.continent.hunt.mutations.bell=A bell rings inside you: whoever was close runs!
soulknight.continent.hunt.mutations.soul=The soul in your ribs won't let you fall!
