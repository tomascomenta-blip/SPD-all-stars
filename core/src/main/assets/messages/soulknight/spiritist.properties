#Spiritist
###class
actors.hero.heroclass.spiritist=spiritist
actors.hero.heroclass.spiritist_desc_short=The _Spiritist_ fights surrounded by the dead: he marks his enemies with nightmares, drops ill-omened stones that leave a plague and raises the fallen to fight for him.
actors.hero.heroclass.spiritist_desc=Once a court wizard of the violet castle, he traded the light for the dead, and now the dead obey him. The Spiritist starts with a _skull lantern_, which grants him _Nightmare_, _Omen Stone_ (level 2), _Raise the Fallen_ (level 4) and the _Danse Macabre_ (level 6).\n\nHis passive, _soul harvest_: every enemy that dies within 4 cells of him heals him a little.\n\nHe also starts with a _cudgel_, a _plague staff_ (a weapon used like a wand that poisons), cloth armor, a waterskin and a velvet pouch.\n\nAutomatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Recharging\n\nHe gets _souls_ when enemies fall nearby: with 5, his next ability recharges in half the time; with 3 he sends a _ghost scout_ that reveals the map.
actors.hero.heroclass.spiritist_unlock=The champions are unlocked from the start.
###subclasses
actors.hero.herosubclass.spectre_lord=spectre lord
actors.hero.herosubclass.spectre_lord_short_desc=The _Spectre Lord_ calls twice as many ghosts, and his ghosts last longer and are tougher.
actors.hero.herosubclass.spectre_lord_desc=Nightmare summons _2 ghosts_ instead of 1, both when marking and when the marked enemy dies. His ghosts have _25% more health_ and last _5 more turns_. His talents make the ghosts frighten, last even longer and take more hits.
actors.hero.herosubclass.plague_herald=plague herald
actors.hero.herosubclass.plague_herald_short_desc=The _Plague Herald_ leaves a larger plague, and what dies in it rises as a skeleton.
actors.hero.herosubclass.plague_herald_desc=The plague of the Omen Stone covers _2 cells_ around instead of 1. Every enemy that dies inside the plague _rises as an allied skeleton_ for 10 turns. His talents make the plague more poisonous and lasting, and the skeletons stronger.
###Spiritist talents
actors.hero.talent.sp_soul_feast.title=soul feast
actors.hero.talent.sp_soul_feast.desc=_+1:_ Eating food gives the plague staff _1 charge_ (it may go over its maximum).\n\n_+2:_ It gives _2 charges_.
actors.hero.talent.sp_death_sense.title=death sense
actors.hero.talent.sp_death_sense.desc=_+1:_ The Spiritist identifies rings and wands _1.75x faster_.\n\n_+2:_ He identifies them _2.5x faster_.
actors.hero.talent.sp_grave_chill.title=grave chill
actors.hero.talent.sp_grave_chill.desc=_+1:_ The poison of the plague staff lasts _2 more turns_.\n\n_+2:_ It lasts _4 more turns_.
actors.hero.talent.sp_soul_harvest.title=bountiful harvest
actors.hero.talent.sp_soul_harvest.desc=_+1:_ Soul harvest heals _1 more HP_.\n\n_+2:_ It heals _2 more HP_.
actors.hero.talent.sp_lingering_dread.title=lingering dread
actors.hero.talent.sp_lingering_dread.desc=_+1:_ The Nightmare mark lasts _5 more turns_.\n\n_+2:_ It lasts _10 more turns_.
actors.hero.talent.sp_ghostly_grasp.title=ghostly grasp
actors.hero.talent.sp_ghostly_grasp.desc=_+1:_ Ghosts deal _20% more damage_.\n\n_+2:_ _40% more_.
actors.hero.talent.sp_omen_weight.title=weight of the omen
actors.hero.talent.sp_omen_weight.desc=_+1:_ The Omen Stone deals _2 more damage_.\n\n_+2:_ _4 more_.
actors.hero.talent.sp_restless_dead.title=restless dead
actors.hero.talent.sp_restless_dead.desc=_+1:_ Raised enemies fight for _10 more turns_.\n\n_+2:_ _20 more turns_.
actors.hero.talent.sp_dark_pact.title=dark pact
actors.hero.talent.sp_dark_pact.desc=_+1:_ When one of his ghosts, skeletons or raised enemies falls, the Spiritist heals _2 HP_.\n\n_+2:_ He heals _4 HP_.
actors.hero.talent.sp_bone_legion.title=bone legion
actors.hero.talent.sp_bone_legion.desc=_+1:_ The skeletons of the Danse Macabre have _10% more_ health and damage, and last _5 more turns_.\n\n_+2:_ _20% more_ and _10 more turns_.\n\n_+3:_ _30% more_ and _15 more turns_.
actors.hero.talent.sp_dread_howl.title=dread howl
actors.hero.talent.sp_dread_howl.desc=_+1:_ The terror of the Danse Macabre lasts _1 more turn_.\n\n_+2:_ _2 more turns_.\n\n_+3:_ _3 more turns_.
actors.hero.talent.sl_wailing.title=wailing
actors.hero.talent.sl_wailing.desc=_+1:_ Each ghost hit has a _10%_ chance to terrify for 2 turns.\n\n_+2:_ _20%_.\n\n_+3:_ _30%_.
actors.hero.talent.sl_ethereal.title=ethereal
actors.hero.talent.sl_ethereal.desc=_+1:_ Ghosts last _5 more turns_.\n\n_+2:_ _10 more_.\n\n_+3:_ _15 more_.
actors.hero.talent.sl_spectral_hide.title=spectral hide
actors.hero.talent.sl_spectral_hide.desc=_+1:_ Ghosts have _20% more health_.\n\n_+2:_ _40% more_.\n\n_+3:_ _60% more_.
actors.hero.talent.ph_virulence.title=virulence
actors.hero.talent.ph_virulence.desc=_+1:_ The poison of the plague is _2 points_ stronger.\n\n_+2:_ _4 points_ stronger.\n\n_+3:_ _6 points_ stronger.
actors.hero.talent.ph_spread.title=contagion
actors.hero.talent.ph_spread.desc=_+1:_ The plague lasts _3 more turns_.\n\n_+2:_ _6 more_.\n\n_+3:_ _9 more_.
actors.hero.talent.ph_bone_harvest.title=bone harvest
actors.hero.talent.ph_bone_harvest.desc=_+1:_ Skeletons rising from the plague have _20% more_ health and damage.\n\n_+2:_ _40% more_.\n\n_+3:_ _60% more_.
###Soul Veil talents
actors.hero.talent.sv_long_veil.title=long veil
actors.hero.talent.sv_long_veil.desc=_+1:_ The invisibility of the Soul Veil lasts _2 more turns_.\n\n_+2:_ _4 more_.\n\n_+3:_ _6 more_.\n\n_+4:_ _8 more_.
actors.hero.talent.sv_phantoms.title=phantoms
actors.hero.talent.sv_phantoms.desc=_+1:_ The Soul Veil calls _1 more ghost_.\n\n_+2:_ _1 more_.\n\n_+3:_ _2 more_.\n\n_+4:_ _2 more_.
actors.hero.talent.sv_soul_mend.title=soul mend
actors.hero.talent.sv_soul_mend.desc=_+1:_ The Soul Veil heals _5%_ of max health.\n\n_+2:_ _10%_.\n\n_+3:_ _15%_.\n\n_+4:_ _20%_.
###items
soulknight.spiritist.spiritistkit.name=skull lantern
soulknight.spiritist.spiritistkit.desc=A hollow skull with a green flame inside. While you carry it you can use the powers of the Spiritist.
soulknight.spiritist.plaguestaff.name=plague staff
soulknight.spiritist.plaguestaff.desc=A dark staff topped by a green skull.\n\nIt works like a wand: its charges come back over time and it is fired from the quickslot.
soulknight.spiritist.plaguestaff.stats_desc=Throws a green spike at the first creature in its way: it deals _%1$d-%2$d damage_ and _poisons_ it (%3$d).
soulknight.spiritist.spiritistarmor.name=spiritist armor
soulknight.spiritist.spiritistarmor.desc=While wearing this armor, the Spiritist can perform a special ability.
###abilities
soulknight.spiritist.nightmare.name=nightmare
soulknight.spiritist.nightmare.desc=Marks an enemy in sight within _%1$d cells_ for _%2$d turns_: it takes _%3$d%% more damage_ from everyone. When marked, _%4$d ghost(s)_ appear next to the Spiritist, and as many come out when the marked enemy dies. Ghosts fight for _%5$d turns_.
soulknight.spiritist.nightmare.desc_short=marks an enemy and calls ghosts that fight for you.
soulknight.spiritist.nightmare.prompt=Choose whom to mark
soulknight.spiritist.nightmare.no_target=There is no enemy in sight there.
soulknight.spiritist.nightmare$mark.name=nightmare
soulknight.spiritist.nightmare$mark.desc=A nightmare haunts this creature: it takes %1$d%% more damage, and ghosts will come out when it dies.\n\nTurns left: %2$s.
soulknight.spiritist.omenstone.name=omen stone
soulknight.spiritist.omenstone.desc=An ill-omened stone falls from the sky on a spot within _%1$d cells_: it deals _%2$d-%3$d damage_ to the enemies around and leaves a _plague_ of _%4$d cell(s)_ for _%5$d turns_ that poisons _only enemies_ (%6$d).
soulknight.spiritist.omenstone.desc_short=a stone falls, hurts and leaves a plague that poisons enemies.
soulknight.spiritist.omenstone.prompt=Choose where the stone falls
soulknight.spiritist.plaguecloud.desc=A green plague floats here. It poisons enemies, but not the heroes nor their allies.
soulknight.spiritist.raisedead.name=raise the fallen
soulknight.spiritist.raisedead.desc=Raises the enemies that died recently (_%2$d turns_ or less) within _%1$d cells_ of the Spiritist: they come back at full health and fight for him for _%4$d turns_. Raises up to _%3$d_ (2 from level 15). Bosses and special creatures can't be raised.
soulknight.spiritist.raisedead.desc_short=brings the last fallen enemies back to life to fight for you.
soulknight.spiritist.raisedead.no_corpse=There is no recently fallen enemy nearby.
soulknight.spiritist.raisedead$raised.name=raised
soulknight.spiritist.raisedead$raised.desc=This creature came back from death and fights for the heroes.\n\nTurns left: %d.
soulknight.spiritist.dansemacabre.name=danse macabre
soulknight.spiritist.dansemacabre.desc=The dead dance for the Spiritist: _%1$d skeletons_ climb out of the ground around him and fight for him for _%2$d turns_ (%5$d-%6$d damage), and the enemies within _%3$d cells_ flee _in terror_ for _%4$d turns_.
soulknight.spiritist.dansemacabre.desc_short=skeletons rise around you and the nearby enemies flee in fear.
soulknight.spiritist.ghost.name=ghost
soulknight.spiritist.ghost.desc=A spirit of the Spiritist. It follows him everywhere and attacks enemies (%1$d-%2$d damage).
soulknight.spiritist.ghost.desc_time=Turns left: %d.
soulknight.spiritist.ghost.fades=The ghost fades away.
soulknight.spiritist.skeleton.name=skeleton
soulknight.spiritist.skeleton.desc=A bony warrior raised by the Spiritist. It follows him and attacks enemies (%1$d-%2$d damage).
soulknight.spiritist.skeleton.desc_time=Turns left: %d.
soulknight.spiritist.skeleton.fades=The skeleton crumbles to dust.
###armor ability
soulknight.spiritist.soulveil.name=soul veil
soulknight.spiritist.soulveil.short_desc=Becomes invisible for a few turns and calls several ghosts.
soulknight.spiritist.soulveil.desc=The Spiritist wraps himself in a veil of souls: he becomes invisible and some ghosts come out to fight for him.
soulknight.spiritist.soulveil.desc_numbers=He is invisible for _%1$d turns_ and calls _%2$d ghosts_.
