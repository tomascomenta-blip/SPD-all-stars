#Gravedigger

###class
actors.hero.heroclass.gravedigger=gravedigger
actors.hero.heroclass.gravedigger_desc_short=The _Gravedigger_ digs a _grave_ for every enemy that falls near him and awakens it as a _mist walker_. He locks his prey behind gravestones and calls the _Maiden of the Mist_.
actors.hero.heroclass.gravedigger_desc=He dug the graves of the city's cemetery for forty years; now he follows the dead below, with the Maiden of the Mist at his side. The Gravedigger starts with a _funeral bell_, which grants _Last Rites_, _Dark Procession_, _Mourning Mist_ and _Eulogy of the Isles_ (from level 6).\n\nHis passive, _Shepherd of Souls_, makes enemies dying near him leave a _grave_ (up to 3). With 3 graves, Last Rites _awakens_ them as mist walkers that fight by his side.\n\nHe also starts with a _gravedigger's shovel_, cloth armor, a waterskin and a velvet pouch.\n\nAutomatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Mind Vision\n_-_ Scrolls of Terror
actors.hero.heroclass.gravedigger_unlock=The champions are unlocked from the start.

###subclasses
actors.hero.herosubclass.mistlord=mistlord
actors.hero.herosubclass.mistlord_short_desc=The _Mistlord_ raises stronger, longer-lived walkers, and his Maiden stays until she is defeated.
actors.hero.herosubclass.mistlord_desc=His mist walkers have _50% more health_, deal _25% more damage_ and last _35 turns_ instead of 25.\n\nThe Maiden of the Mist has _25% more health_, deals _20% more damage_ and stays with him _until she is defeated_.
actors.hero.herosubclass.exhumer=exhumer
actors.hero.herosubclass.exhumer_short_desc=The _Exhumer_ fights on the front line: every grave he keeps gives him more damage, and his Last Rites recharges sooner and heals more.
actors.hero.herosubclass.exhumer_desc=His melee hits deal _3% more damage for every grave_ he keeps.\n\nLast Rites recharges _25% faster_ and heals _40%_ of the damage instead of 25%. In exchange, it only awakens the graves when he has _all of them_.

###talents
actors.hero.talent.gra_meal.title=gravedigger's supper
actors.hero.talent.gra_meal.desc=_+1:_ Eating gives the Gravedigger _1 grave_.\n\n_+2:_ Eating gives him _2 graves_.
actors.hero.talent.gra_intuition.title=undertaker's eye
actors.hero.talent.gra_intuition.desc=_+1:_ The Gravedigger identifies armor _1.75x faster_.\n\n_+2:_ He identifies armor _2.5x faster_.
actors.hero.talent.gra_heavy_shovel.title=heavy shovel
actors.hero.talent.gra_heavy_shovel.desc=_+1:_ The extra damage of Last Rites is increased by _20%_.\n\n_+2:_ It is increased by _40%_.
actors.hero.talent.gra_deep_graves.title=deep graves
actors.hero.talent.gra_deep_graves.desc=_+1:_ The Gravedigger can keep _4 graves_ instead of 3.\n\n_+2:_ He can keep _5 graves_.
actors.hero.talent.gra_bottled_mist.title=bottled mist
actors.hero.talent.gra_bottled_mist.desc=_+1:_ When drinking or throwing a potion, _1 mist walker_ rises next to the Gravedigger.\n\n_+2:_ _2 mist walkers_ rise.
actors.hero.talent.gra_long_procession.title=long procession
actors.hero.talent.gra_long_procession.desc=_+1:_ The gravestones of Dark Procession last _1 more turn_.\n\n_+2:_ They last _2 more turns_.
actors.hero.talent.gra_clinging_mist.title=clinging mist
actors.hero.talent.gra_clinging_mist.desc=_+1:_ The mark of Mourning Mist lasts _3 more turns_ and also _slows for 2 turns_.\n\n_+2:_ It lasts _6 more turns_ and _slows for 3 turns_.
actors.hero.talent.gra_hard_bones.title=hard bones
actors.hero.talent.gra_hard_bones.desc=_+1:_ Mist walkers have _25% more health_.\n\n_+2:_ They have _50% more health_.
actors.hero.talent.gra_grim_harvest.title=grim harvest
actors.hero.talent.gra_grim_harvest.desc=_+1:_ When an enemy marked by Mourning Mist dies, the cooldown of Last Rites is reduced by _2 turns_.\n\n_+2:_ It is reduced by _4 turns_.
actors.hero.talent.gra_maidens_wrath.title=maiden's wrath
actors.hero.talent.gra_maidens_wrath.desc=_+1:_ The Maiden of the Mist deals _15% more damage_.\n\n_+2:_ _30% more_.\n\n_+3:_ _45% more_.
actors.hero.talent.gra_flock.title=flock
actors.hero.talent.gra_flock.desc=_+1:_ Awakening the graves raises _1 more walker_.\n\n_+2:_ It raises _2 more walkers_.\n\n_+3:_ It raises _3 more walkers_.
actors.hero.talent.ml_mist_burst.title=mist burst
actors.hero.talent.ml_mist_burst.desc=_+1:_ When they die, walkers burst into mist: they deal _1 damage, +1 every 4 levels_, to the enemies around them and _mark them for 4 turns_.\n\n_+2:_ They deal _double damage_.\n\n_+3:_ They deal _triple damage_.
actors.hero.talent.ml_endless_night.title=endless night
actors.hero.talent.ml_endless_night.desc=_+1:_ The Maiden raises a walker every _4 turns_ instead of 5.\n\n_+2:_ Every _3 turns_.\n\n_+3:_ Every _2 turns_.
actors.hero.talent.ml_dark_communion.title=dark communion
actors.hero.talent.ml_dark_communion.desc=_+1:_ The hits of the walkers and of the Maiden heal the Mistlord for _10%_ of their damage.\n\n_+2:_ _20%_.\n\n_+3:_ _30%_.
actors.hero.talent.ex_grave_strength.title=grave strength
actors.hero.talent.ex_grave_strength.desc=_+1:_ Every grave kept gives _2% more_ melee damage (5% in total).\n\n_+2:_ _4% more_ (7% in total).\n\n_+3:_ _6% more_ (9% in total).
actors.hero.talent.ex_dig_deep.title=dig deep
actors.hero.talent.ex_dig_deep.desc=_+1:_ Last Rites recharges _15% faster_.\n\n_+2:_ _30% faster_.\n\n_+3:_ _45% faster_.
actors.hero.talent.ex_soul_shovel.title=soul shovel
actors.hero.talent.ex_soul_shovel.desc=_+1:_ Last Rites heals _10% more_ of the damage (50% in total).\n\n_+2:_ _20% more_ (60% in total).\n\n_+3:_ _30% more_ (70% in total).

###items
champions.gravedigger.gravediggerkit.name=funeral bell
champions.gravedigger.gravediggerkit.desc=A small bell of greenish bronze, cold to the touch. When it rings, something under the earth answers.
champions.gravedigger.shovel.name=gravedigger's shovel
champions.gravedigger.shovel.desc=A heavy, long-handled shovel, its edge notched from years of digging. It hits a bit softer than a shortsword, but it is just as good at opening graves as at filling them.
items.armor.gravediggerarmor.name=gravedigger's shroud
items.armor.gravediggerarmor.desc=While wearing this shroud, the Gravedigger can perform a special ability.

###abilities
champions.gravedigger.lastrites.name=last rites
champions.gravedigger.lastrites.desc=Grips the shovel (takes no time). His next melee hit within 5 turns deals _%1$d-%2$d extra damage_ and heals him for _%3$d%%_ of the damage. If it kills, he digs _one more grave_.\n\nWith _%4$d graves_ or more, he also _awakens_ them: each grave rises around him as a _mist walker_ (%5$d HP) that fights by his side for %6$d turns.
champions.gravedigger.lastrites.desc_short=the next hit deals more and heals; with 3 graves, awakens them.
champions.gravedigger.lastrites.graves=Graves: _%1$d_ of %2$d.
champions.gravedigger.lastrites.awaken=Awaken! %d mist walkers rise.
champions.gravedigger.lastrites.no_space=There is no room to awaken the graves.
champions.gravedigger.lastrites$primed.name=last rites
champions.gravedigger.lastrites$primed.desc=The shovel is ready: the next melee hit will deal extra damage and heal the Gravedigger.\n\nTurns remaining: %s.
champions.gravedigger.lastrites$reaped.name=last rites
champions.gravedigger.lastrites$reaped.desc=If it dies now, it will leave one more grave.\n\nTurns remaining: %s.
champions.gravedigger.darkprocession.name=dark procession
champions.gravedigger.darkprocession.desc=Choose a cell up to _%1$d tiles_ away: a ring of _gravestones_ rises around it, 2 tiles away, for _%2$d turns_. Nobody can cross it, so the enemies inside are _locked in_. Occupied cells are left open, and the gravestones sink as soon as no enemy is left inside.
champions.gravedigger.darkprocession.desc_short=locks enemies inside a ring of gravestones.
champions.gravedigger.darkprocession.prompt=Choose the center of the procession
champions.gravedigger.darkprocession.no_space=There is no room for the gravestones there.
champions.gravedigger.darkprocession.no_target=There is no enemy to lock in there.
champions.gravedigger.darkprocession$gravewall.desc=An old gravestone wrapped in mist. Nobody can pass here until it sinks back into the earth.
champions.gravedigger.mourningmist.name=mourning mist
champions.gravedigger.mourningmist.desc=Throws a ball of black mist at a cell up to _%1$d tiles_ away. It bursts in a 3x3 square: enemies take _%2$d-%3$d damage_ and are _marked for %4$d turns_. The Gravedigger's allies deal _25%% more damage_ to marked enemies and go for them first.
champions.gravedigger.mourningmist.desc_slow=They are also _slowed for %d turns_.
champions.gravedigger.mourningmist.desc_short=hurts and marks enemies for his allies.
champions.gravedigger.mourningmist.prompt=Choose where to throw the mist
champions.gravedigger.eulogy.name=eulogy of the isles
champions.gravedigger.eulogy.desc=Calls the _Maiden of the Mist_ up to _%1$d tiles_ away. The Maiden (_%2$d HP_) fights by his side and, while fighting, raises a _mist walker_ every _%3$d turns_ (at most 2 at once). The Gravedigger's hits on the enemy she just struck deal _%4$d%% of its current health_ as extra damage (at most %5$d against bosses). While she lives, using this ability tells her where to go or whom to attack.
champions.gravedigger.eulogy.desc_time=She stays for _40 turns_.
champions.gravedigger.eulogy.desc_mistlord=The Mistlord keeps her _until she is defeated_.
champions.gravedigger.eulogy.desc_short=calls the Maiden of the Mist.
champions.gravedigger.eulogy.prompt=Choose where (or, if she is here, where the Maiden goes)
champions.gravedigger.eulogy.no_space=There is no room for the Maiden there.
champions.gravedigger.eulogy.summoned=The Maiden of the Mist answers the eulogy!

###buffs
champions.gravedigger.shepherdofsouls.name=shepherd of souls
champions.gravedigger.shepherdofsouls.grave=Grave! (%d)
champions.gravedigger.shepherdofsouls.desc=Enemies that die up to _%1$d tiles_ from the Gravedigger, in sight, leave him a _grave_. Last Rites awakens them as mist walkers.\n\nGraves: _%2$d_ of %3$d.\nNeeded to awaken them: _%4$d_.
champions.gravedigger.shepherdofsouls.desc_exhumer=Extra melee damage from the graves kept: _+%d%%_.
champions.gravedigger.mistmark.name=mist mark
champions.gravedigger.mistmark.desc=The mourning mist clings to this enemy. The Gravedigger's allies deal 25%% more damage to it and go for it first.\n\nTurns remaining: %s.
champions.gravedigger.maidenmark.name=maiden's prey
champions.gravedigger.maidenmark.desc=The Maiden of the Mist just struck this enemy. The hits of her Gravedigger will deal extra damage to it.\n\nTurns remaining: %s.

###allies
champions.gravedigger.mistwalker.name=mist walker
champions.gravedigger.mistwalker.desc=A small, quick spirit the Gravedigger pulled out of a grave. It fights for him and for his partner: _%1$d-%2$d damage_.
champions.gravedigger.mistwalker.desc_time=It will return to the earth in %1$d turns, or sooner if it spends %2$d turns with no enemy to attack.
champions.gravedigger.mistmaiden.name=Maiden of the Mist
champions.gravedigger.mistmaiden.desc=A tall, calm specter wrapped in the mist of the Isles. She strikes for _%1$d-%2$d damage_ and, while fighting, raises a mist walker every _%3$d turns_.
champions.gravedigger.mistmaiden.desc_time=She will fade in %d turns.
champions.gravedigger.mistmaiden.desc_forever=She will stay until she is defeated.
champions.gravedigger.mistmaiden.fades=The Maiden of the Mist dissolves into the haze.
champions.gravedigger.mistmaiden.direct_defend=The Maiden heads there.
champions.gravedigger.mistmaiden.direct_follow=The Maiden will follow you.
champions.gravedigger.mistmaiden.direct_attack=The Maiden goes after it.
