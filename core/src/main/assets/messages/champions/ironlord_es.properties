#Señor de Hierro y habilidades de armadura propias (es)

###clase
actors.hero.heroclass.ironlord=señor de hierro
actors.hero.heroclass.ironlord_desc_short=El _Señor de Hierro_ machaca con su maza, levanta un aura de _oscuridad creciente_ tras cada racha de golpes y arrastra a un enemigo a un _reino aparte_ para un duelo a muerte.
actors.hero.heroclass.ironlord_desc=Un antiguo rey de armadura de hierro al que la mazmorra no deja morir; arrastra a sus enemigos a un reino propio para no compartir la pelea. El Señor de Hierro empieza con una _corona de hierro_, que le da _Aniquilación_, _Indestructible_, _Garra de la muerte_ y el _Reino de la muerte_ (desde el nivel 6).\n\nSu pasiva, la _oscuridad creciente_: tras _3 golpes seguidos_ (con pocos turnos entre uno y otro) se levanta un aura oscura que daña durante unos turnos a los enemigos pegados a él.\n\nTambién empieza con una _maza de hierro_ pesada, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de curación\n_-_ Pergaminos de terror
actors.hero.heroclass.ironlord_unlock=Los campeones están desbloqueados desde el principio.

###subclases
actors.hero.herosubclass.tyrant=tirano
actors.hero.herosubclass.tyrant_short_desc=El _Tirano_ levanta un aura más grande y pega más fuerte con ella.
actors.hero.herosubclass.tyrant_desc=El aura de la oscuridad creciente llega _1 casilla más lejos_ (radio 2). Sus talentos aumentan el daño del aura y de sus habilidades.
actors.hero.herosubclass.revenant=aparecido
actors.hero.herosubclass.revenant_short_desc=El _Aparecido_ se protege y se cura mejor con Indestructible.
actors.hero.herosubclass.revenant_desc=El escudo de Indestructible es un _25% mayor_ y su enfriamiento, un _25% más corto_. Sus talentos aumentan el escudo y la curación.

###talentos del Señor de Hierro
actors.hero.talent.irl_meal.title=ración de hierro
actors.hero.talent.irl_meal.desc=_+1:_ Comer reinicia el enfriamiento de _Aniquilación_.\n\n_+2:_ Además, comer levanta el aura de oscuridad _4 turnos_.
actors.hero.talent.irl_intuition.title=ojo del herrero
actors.hero.talent.irl_intuition.desc=_+1:_ El Señor de Hierro identifica armas cuerpo a cuerpo _1,75 veces más rápido_.\n\n_+2:_ Las identifica _2,5 veces más rápido_.
actors.hero.talent.irl_heavy_mace.title=maza pesada
actors.hero.talent.irl_heavy_mace.desc=_+1:_ Aniquilación hace un _15% más de daño_.\n\n_+2:_ Hace un _30% más de daño_.
actors.hero.talent.irl_dark_hide.title=piel oscura
actors.hero.talent.irl_dark_hide.desc=_+1:_ Mientras el aura de oscuridad está activa, gana _1-2 de armadura_.\n\n_+2:_ Gana _2-4 de armadura_.
actors.hero.talent.irl_liquid_iron.title=hierro líquido
actors.hero.talent.irl_liquid_iron.desc=_+1:_ Al beber o lanzar una poción, los enfriamientos del Señor de Hierro se reducen _3 turnos_.\n\n_+2:_ Se reducen _5 turnos_.
actors.hero.talent.irl_long_reach.title=garra larga
actors.hero.talent.irl_long_reach.desc=_+1:_ Garra de la muerte alcanza _1 casilla más_.\n\n_+2:_ Alcanza _2 casillas más_.
actors.hero.talent.irl_brute_force.title=fuerza bruta
actors.hero.talent.irl_brute_force.desc=_+1:_ Aniquilación alcanza _1 casilla más_.\n\n_+2:_ Alcanza _2 casillas más_.
actors.hero.talent.irl_grave_ward.title=guardia sepulcral
actors.hero.talent.irl_grave_ward.desc=_+1:_ El escudo de Indestructible es un _15% mayor_.\n\n_+2:_ Es un _30% mayor_.
actors.hero.talent.irl_resonance.title=resonancia
actors.hero.talent.irl_resonance.desc=_+1:_ Usar Aniquilación o Garra de la muerte cuenta como _un golpe seguido_ para la oscuridad creciente.\n\n_+2:_ Indestructible también cuenta.
actors.hero.talent.irl_deepening_dark.title=oscuridad profunda
actors.hero.talent.irl_deepening_dark.desc=_+1:_ El aura de la oscuridad creciente dura _1 turno más_.\n\n_+2:_ Dura _2 turnos más_.\n\n_+3:_ Dura _3 turnos más_.
actors.hero.talent.irl_undying_will.title=voluntad inmortal
actors.hero.talent.irl_undying_will.desc=_+1:_ El Reino de la muerte dura _1 turno más_, roba un _5% más_ de vida máxima y un _5% más_ de daño.\n\n_+2:_ _2 turnos más_ y un _10% más_ de cada.\n\n_+3:_ _3 turnos más_ y un _15% más_ de cada.
actors.hero.talent.ty_crushing_aura.title=aura aplastante
actors.hero.talent.ty_crushing_aura.desc=_+1:_ El aura de oscuridad hace un _20% más de daño_.\n\n_+2:_ Un _40% más_.\n\n_+3:_ Un _60% más_.
actors.hero.talent.ty_overlord.title=señor supremo
actors.hero.talent.ty_overlord.desc=_+1:_ Aniquilación y Garra de la muerte hacen un _10% más de daño_.\n\n_+2:_ Un _20% más_.\n\n_+3:_ Un _30% más_.
actors.hero.talent.ty_iron_fist.title=puño de hierro
actors.hero.talent.ty_iron_fist.desc=_+1:_ Mientras el aura está activa, sus golpes cuerpo a cuerpo hacen _+1 de daño_.\n\n_+2:_ _+2 de daño_.\n\n_+3:_ _+3 de daño_.
actors.hero.talent.rv_bulwark.title=baluarte
actors.hero.talent.rv_bulwark.desc=_+1:_ El escudo de Indestructible es un _20% mayor_.\n\n_+2:_ Un _40% mayor_.\n\n_+3:_ Un _60% mayor_.
actors.hero.talent.rv_soul_feast.title=banquete de almas
actors.hero.talent.rv_soul_feast.desc=_+1:_ Al convertir el escudo en curación, cura un _20% más_.\n\n_+2:_ Un _40% más_.\n\n_+3:_ Un _60% más_.
actors.hero.talent.rv_endless_night.title=noche sin fin
actors.hero.talent.rv_endless_night.desc=_+1:_ Cada turno que el aura daña a algún enemigo, el Señor de Hierro se cura _1 PS_.\n\n_+2:_ Se cura _2 PS_.\n\n_+3:_ Se cura _3 PS_.

###talentos del Eclipse de hierro
actors.hero.talent.ie_long_night.title=noche larga
actors.hero.talent.ie_long_night.desc=_+1:_ El Eclipse de hierro dura _2 turnos más_.\n\n_+2:_ _4 turnos más_.\n\n_+3:_ _6 turnos más_.\n\n_+4:_ _8 turnos más_.
actors.hero.talent.ie_smothering_dark.title=oscuridad asfixiante
actors.hero.talent.ie_smothering_dark.desc=_+1:_ El aura del Eclipse hace _x1,75_ de daño en vez de x1,5.\n\n_+2:_ _x2_.\n\n_+3:_ _x2,25_.\n\n_+4:_ _x2,5_.
actors.hero.talent.ie_iron_hunger.title=hambre de hierro
actors.hero.talent.ie_iron_hunger.desc=_+1:_ El aura del Eclipse cura al Señor de Hierro el _25%_ del daño que hace.\n\n_+2:_ El _50%_.\n\n_+3:_ El _75%_.\n\n_+4:_ El _100%_.

###talentos de la Cosecha de sangre
actors.hero.talent.hv_deep_cut.title=corte profundo
actors.hero.talent.hv_deep_cut.desc=_+1:_ La Cosecha de sangre hace un _25% más de daño_.\n\n_+2:_ Un _50% más_.\n\n_+3:_ Un _75% más_.\n\n_+4:_ Un _100% más_.
actors.hero.talent.hv_crimson_feast.title=festín carmesí
actors.hero.talent.hv_crimson_feast.desc=_+1:_ El Verdugo se cura el _10%_ del daño total de la Cosecha.\n\n_+2:_ El _20%_.\n\n_+3:_ El _30%_.\n\n_+4:_ El _40%_.
actors.hero.talent.hv_red_mark.title=marca roja
actors.hero.talent.hv_red_mark.desc=_+1:_ Los enemigos que sobreviven a la Cosecha reciben _1 acumulación_ de hemorragia.\n\n_+2:_ _2 acumulaciones_.\n\n_+3:_ _3 acumulaciones_.\n\n_+4:_ _4 acumulaciones_.

###talentos de los Grilletes espectrales
actors.hero.talent.sh_long_chains.title=cadenas largas
actors.hero.talent.sh_long_chains.desc=_+1:_ Los Grilletes espectrales alcanzan _1 casilla más_.\n\n_+2:_ _2 casillas más_.\n\n_+3:_ _3 casillas más_.\n\n_+4:_ _4 casillas más_.
actors.hero.talent.sh_heavy_links.title=eslabones pesados
actors.hero.talent.sh_heavy_links.desc=_+1:_ Los enemigos quedan sujetos _1 turno más_.\n\n_+2:_ _2 turnos más_.\n\n_+3:_ _3 turnos más_.\n\n_+4:_ _4 turnos más_.
actors.hero.talent.sh_captive_souls.title=almas cautivas
actors.hero.talent.sh_captive_souls.desc=_+1:_ Gana _1 alma_ si encadena a algún enemigo.\n\n_+2:_ Gana _1 alma por enemigo_, hasta 2.\n\n_+3:_ Hasta 3 almas.\n\n_+4:_ Hasta 4 almas.

###talentos de la Ovación
actors.hero.talent.ov_roar.title=rugido del público
actors.hero.talent.ov_roar.desc=_+1:_ La Ovación dura _2 turnos más_.\n\n_+2:_ _4 turnos más_.\n\n_+3:_ _6 turnos más_.\n\n_+4:_ _8 turnos más_.
actors.hero.talent.ov_iron_grit.title=agallas de hierro
actors.hero.talent.ov_iron_grit.desc=_+1:_ Al empezar la Ovación gana un escudo del _20%_ de sus agallas máximas.\n\n_+2:_ Del _40%_.\n\n_+3:_ Del _60%_.\n\n_+4:_ Del _80%_.
actors.hero.talent.ov_blood_sand.title=sangre en la arena
actors.hero.talent.ov_blood_sand.desc=_+1:_ Durante la Ovación, sus puñetazos lo curan el _20%_ del daño en vez del 15%.\n\n_+2:_ El _25%_.\n\n_+3:_ El _30%_.\n\n_+4:_ El _35%_.

###objetos
champions.ironlord.ironlordkit.name=corona de hierro
champions.ironlord.ironlordkit.desc=Una corona de hierro negro, fría y pesada, con una sola púa rota. Mientras la lleves encima podrás usar las técnicas del Señor de Hierro.
champions.ironlord.ironlordmace.name=maza de hierro
champions.ironlord.ironlordmace.desc=Una maza enorme de hierro oscuro, con la cabeza erizada de púas. Pega muy fuerte, aunque es algo lenta de manejar.
items.armor.ironlordarmor.name=armadura del señor de hierro
items.armor.ironlordarmor.desc=Mientras lleve esta armadura, el Señor de Hierro puede realizar una habilidad especial.

###pasiva
champions.ironlord.risingdarkness.name=oscuridad creciente
champions.ironlord.risingdarkness.aura=¡Oscuridad!
champions.ironlord.risingdarkness.desc=Tras _3 golpes cuerpo a cuerpo seguidos_ (con pocos turnos entre uno y otro) se levanta un aura oscura que daña a los enemigos pegados al Señor de Hierro.\n\nGolpes seguidos: _%1$d_ de %2$d.
champions.ironlord.risingdarkness$darkaura.name=aura de oscuridad
champions.ironlord.risingdarkness$darkaura.desc=Una oscuridad helada rodea al Señor de Hierro. Cada turno daña _%2$d_ a los enemigos a _%1$d casillas_ o menos.\n\nTurnos restantes: %3$d.

###habilidades
champions.ironlord.obliterate.name=aniquilación
champions.ironlord.obliterate.desc=Un mazazo en un cono de _%1$d casillas_ delante de él: cada enemigo recibe el _%2$d%%_ del daño de su arma. El enemigo más cercano recibe el _%3$d%%_ si está _aislado_ (ningún otro enemigo a 2 casillas o menos de él).
champions.ironlord.obliterate.desc_short=un mazazo en cono; pega más al objetivo aislado.
champions.ironlord.obliterate.prompt=Elige hacia dónde golpear
champions.ironlord.obliterate.no_target=No hay ningún enemigo ahí.
champions.ironlord.indestructible.name=indestructible
champions.ironlord.indestructible.desc=Gana un escudo de _%1$d_ puntos, que crece con el daño que ha hecho en los últimos 8 turnos. Durante _%2$d turnos_ puede volver a usarla: convierte lo que quede del escudo en _curación_ (al _%3$d%%_). El enfriamiento empieza cuando termina ese plazo.
champions.ironlord.indestructible.desc_short=gana un escudo según el daño hecho; al repetirla, lo convierte en curación.
champions.ironlord.indestructible$armed.name=indestructible
champions.ironlord.indestructible$armed.desc=Puedes volver a usar Indestructible para convertir el escudo restante en curación.\n\nTurnos restantes: %s.
champions.ironlord.deathsgrasp.name=garra de la muerte
champions.ironlord.deathsgrasp.desc=Lanza una garra de hierro en línea recta hasta _%1$d casillas_: arrastra junto a él a todos los enemigos que alcance y les hace _%2$d-%3$d de daño_.
champions.ironlord.deathsgrasp.desc_short=arrastra a los enemigos de una línea y los daña.
champions.ironlord.deathsgrasp.prompt=Elige la dirección de la garra
champions.ironlord.deathsgrasp.no_target=No hay ningún enemigo en esa línea.
champions.ironlord.realmofdeath.name=reino de la muerte
champions.ironlord.realmofdeath.desc=Se lleva a un enemigo a _6 casillas_ o menos a un _reino aparte_ de ladrillos azules, inalcanzable para los demás, para un duelo de _%1$d turnos_. Mientras dura le roba el _%2$d%%_ de su vida máxima y gana un _%3$d%%_ más de daño contra él. Si lo mata allí, _conserva el robo hasta bajar de piso_. Volver a usarla dentro, sale del reino. Contra jefes y enemigos que no se pueden mover no hay traslado: solo el robo.
champions.ironlord.realmofdeath.desc_short=un duelo en un reino aparte; roba vida máxima y daño.
champions.ironlord.realmofdeath.prompt=Elige a quién retar
champions.ironlord.realmofdeath.no_target=No hay ningún enemigo ahí.
champions.ironlord.realmofdeath.spoils=¡Botín!
champions.ironlord.realmofdeath$duel.name=reino de la muerte
champions.ironlord.realmofdeath$duel.desc=Duelo a muerte. Ha robado _%1$d_ de vida máxima y hace un _%2$d%%_ más de daño a su rival. Usa de nuevo el Reino de la muerte para salir antes.\n\nTurnos restantes: %3$d.
champions.ironlord.realmofdeath$spoils.name=botín del duelo
champions.ironlord.realmofdeath$spoils.desc=Mató a su rival en el Reino de la muerte y conserva el robo hasta bajar de piso: _+%1$d_ de vida máxima y un _%2$d%%_ más de daño.

###habilidades de armadura propias
champions.ironlord.ironeclipse.name=eclipse de hierro
champions.ironlord.ironeclipse.short_desc=La oscuridad creciente se levanta al instante, más grande, más fuerte y ralentizando.
champions.ironlord.ironeclipse.desc=El Señor de Hierro levanta al instante el aura de oscuridad durante _8 turnos_, con _1 casilla más_ de radio y _1,5 veces_ más daño. Los enemigos dentro quedan _ralentizados_.
champions.executioner.bloodharvest.name=cosecha de sangre
champions.executioner.bloodharvest.short_desc=Cada enemigo que sangra a la vista pierde de golpe toda la sangre que le quedaba por perder.
champions.executioner.bloodharvest.desc=Todos los enemigos que sangran a la vista (a 8 casillas o menos) reciben de golpe _todo el daño que les quedaba por sangrar_, y la hemorragia termina. Hace falta al menos un enemigo sangrando.
champions.executioner.bloodharvest.no_target=No hay ningún enemigo sangrando a la vista.
champions.jailer.spectralshackles.name=grilletes espectrales
champions.jailer.spectralshackles.short_desc=Unos grilletes de almas sujetan a todos los enemigos a la vista y protegen al Carcelero.
champions.jailer.spectralshackles.desc=Unos grilletes espectrales sujetan a todos los enemigos a la vista (a 6 casillas o menos) durante _3 turnos_ (a los jefes solo los lisian) y dan al Carcelero un escudo por cada uno de los tres primeros.
champions.jailer.spectralshackles.no_target=No hay ningún enemigo a la vista.
champions.brawler.ovation.name=ovación
champions.brawler.ovation.short_desc=El público enloquece: agallas al máximo y puñetazos más fuertes que curan.
champions.brawler.ovation.desc=Las agallas del Púgil se llenan al máximo y no se apagan durante _8 turnos_. Mientras dura, sus puñetazos hacen un _25% más de daño_ y lo curan el _15%_ del daño que hacen.
champions.brawler.ovation$roar.name=ovación
champions.brawler.ovation$roar.desc=El público ruge: los puñetazos hacen un _%1$d%%_ más de daño y curan el _%2$d%%_ del daño.\n\nTurnos restantes: %3$s.
