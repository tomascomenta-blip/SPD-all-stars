#Ironlord and own armor abilities

###class
actors.hero.heroclass.ironlord=ironlord
actors.hero.heroclass.ironlord_desc_short=The _Ironlord_ crushes with his mace, raises an aura of _rising darkness_ after every streak of hits and drags an enemy into a _realm of its own_ for a duel to the death.
actors.hero.heroclass.ironlord_desc=An ancient king in iron armor whom the dungeon will not let die; he drags his foes into a realm of his own so he never has to share a fight. The Ironlord starts with an _iron crown_, which grants _Obliterate_, _Indestructible_, _Death's Grasp_ and the _Realm of Death_ (from level 6).\n\nHis passive, _Rising Darkness_: after _3 melee hits in a row_ (with only a few turns between them) a dark aura rises and hurts the enemies next to him for a few turns.\n\nHe also starts with a heavy _iron mace_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Ironlord automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Terror
actors.hero.heroclass.ironlord_unlock=The champions are unlocked from the start.

###subclasses
actors.hero.herosubclass.tyrant=tyrant
actors.hero.herosubclass.tyrant_short_desc=The _Tyrant_ raises a bigger aura and hits harder with it.
actors.hero.herosubclass.tyrant_desc=The aura of Rising Darkness reaches _1 tile further_ (radius 2). His talents increase the damage of the aura and of his abilities.
actors.hero.herosubclass.revenant=revenant
actors.hero.herosubclass.revenant_short_desc=The _Revenant_ shields and heals himself better with Indestructible.
actors.hero.herosubclass.revenant_desc=The shield of Indestructible is _25% bigger_ and its cooldown is _25% shorter_. His talents increase the shield and the healing.

###Ironlord talents
actors.hero.talent.irl_meal.title=iron ration
actors.hero.talent.irl_meal.desc=_+1:_ Eating resets the cooldown of _Obliterate_.\n\n_+2:_ Eating also raises the dark aura for _4 turns_.
actors.hero.talent.irl_intuition.title=smith's eye
actors.hero.talent.irl_intuition.desc=_+1:_ The Ironlord identifies melee weapons _1.75 times faster_.\n\n_+2:_ He identifies them _2.5 times faster_.
actors.hero.talent.irl_heavy_mace.title=heavy mace
actors.hero.talent.irl_heavy_mace.desc=_+1:_ Obliterate deals _15% more damage_.\n\n_+2:_ It deals _30% more damage_.
actors.hero.talent.irl_dark_hide.title=dark hide
actors.hero.talent.irl_dark_hide.desc=_+1:_ While the dark aura is active, he gains _1-2 armor_.\n\n_+2:_ He gains _2-4 armor_.
actors.hero.talent.irl_liquid_iron.title=liquid iron
actors.hero.talent.irl_liquid_iron.desc=_+1:_ When drinking or throwing a potion, the Ironlord's cooldowns are reduced by _3 turns_.\n\n_+2:_ They are reduced by _5 turns_.
actors.hero.talent.irl_long_reach.title=long claw
actors.hero.talent.irl_long_reach.desc=_+1:_ Death's Grasp reaches _1 tile further_.\n\n_+2:_ It reaches _2 tiles further_.
actors.hero.talent.irl_brute_force.title=brute force
actors.hero.talent.irl_brute_force.desc=_+1:_ Obliterate reaches _1 tile further_.\n\n_+2:_ It reaches _2 tiles further_.
actors.hero.talent.irl_grave_ward.title=grave ward
actors.hero.talent.irl_grave_ward.desc=_+1:_ The shield of Indestructible is _15% bigger_.\n\n_+2:_ It is _30% bigger_.
actors.hero.talent.irl_resonance.title=resonance
actors.hero.talent.irl_resonance.desc=_+1:_ Using Obliterate or Death's Grasp counts as _one hit in a row_ for Rising Darkness.\n\n_+2:_ Indestructible counts too.
actors.hero.talent.irl_deepening_dark.title=deepening dark
actors.hero.talent.irl_deepening_dark.desc=_+1:_ The aura of Rising Darkness lasts _1 turn longer_.\n\n_+2:_ It lasts _2 turns longer_.\n\n_+3:_ It lasts _3 turns longer_.
actors.hero.talent.irl_undying_will.title=undying will
actors.hero.talent.irl_undying_will.desc=_+1:_ The Realm of Death lasts _1 turn longer_, steals _5% more_ maximum health and _5% more_ damage.\n\n_+2:_ _2 turns longer_ and _10% more_ of each.\n\n_+3:_ _3 turns longer_ and _15% more_ of each.
actors.hero.talent.ty_crushing_aura.title=crushing aura
actors.hero.talent.ty_crushing_aura.desc=_+1:_ The dark aura deals _20% more damage_.\n\n_+2:_ _40% more_.\n\n_+3:_ _60% more_.
actors.hero.talent.ty_overlord.title=overlord
actors.hero.talent.ty_overlord.desc=_+1:_ Obliterate and Death's Grasp deal _10% more damage_.\n\n_+2:_ _20% more_.\n\n_+3:_ _30% more_.
actors.hero.talent.ty_iron_fist.title=iron fist
actors.hero.talent.ty_iron_fist.desc=_+1:_ While the aura is active, his melee hits deal _+1 damage_.\n\n_+2:_ _+2 damage_.\n\n_+3:_ _+3 damage_.
actors.hero.talent.rv_bulwark.title=bulwark
actors.hero.talent.rv_bulwark.desc=_+1:_ The shield of Indestructible is _20% bigger_.\n\n_+2:_ _40% bigger_.\n\n_+3:_ _60% bigger_.
actors.hero.talent.rv_soul_feast.title=soul feast
actors.hero.talent.rv_soul_feast.desc=_+1:_ Turning the shield into healing heals _20% more_.\n\n_+2:_ _40% more_.\n\n_+3:_ _60% more_.
actors.hero.talent.rv_endless_night.title=endless night
actors.hero.talent.rv_endless_night.desc=_+1:_ Every turn the aura hurts an enemy, the Ironlord heals _1 HP_.\n\n_+2:_ He heals _2 HP_.\n\n_+3:_ He heals _3 HP_.

###Iron Eclipse talents
actors.hero.talent.ie_long_night.title=long night
actors.hero.talent.ie_long_night.desc=_+1:_ Iron Eclipse lasts _2 turns longer_.\n\n_+2:_ _4 turns longer_.\n\n_+3:_ _6 turns longer_.\n\n_+4:_ _8 turns longer_.
actors.hero.talent.ie_smothering_dark.title=smothering dark
actors.hero.talent.ie_smothering_dark.desc=_+1:_ The aura of the Eclipse deals _x1.75_ damage instead of x1.5.\n\n_+2:_ _x2_.\n\n_+3:_ _x2.25_.\n\n_+4:_ _x2.5_.
actors.hero.talent.ie_iron_hunger.title=iron hunger
actors.hero.talent.ie_iron_hunger.desc=_+1:_ The aura of the Eclipse heals the Ironlord for _25%_ of the damage it deals.\n\n_+2:_ _50%_.\n\n_+3:_ _75%_.\n\n_+4:_ _100%_.

###Blood Harvest talents
actors.hero.talent.hv_deep_cut.title=deep cut
actors.hero.talent.hv_deep_cut.desc=_+1:_ Blood Harvest deals _25% more damage_.\n\n_+2:_ _50% more_.\n\n_+3:_ _75% more_.\n\n_+4:_ _100% more_.
actors.hero.talent.hv_crimson_feast.title=crimson feast
actors.hero.talent.hv_crimson_feast.desc=_+1:_ The Executioner heals for _10%_ of the total damage of the Harvest.\n\n_+2:_ _20%_.\n\n_+3:_ _30%_.\n\n_+4:_ _40%_.
actors.hero.talent.hv_red_mark.title=red mark
actors.hero.talent.hv_red_mark.desc=_+1:_ Enemies that survive the Harvest get _1 stack_ of hemorrhage.\n\n_+2:_ _2 stacks_.\n\n_+3:_ _3 stacks_.\n\n_+4:_ _4 stacks_.

###Spectral Shackles talents
actors.hero.talent.sh_long_chains.title=long chains
actors.hero.talent.sh_long_chains.desc=_+1:_ Spectral Shackles reach _1 tile further_.\n\n_+2:_ _2 tiles further_.\n\n_+3:_ _3 tiles further_.\n\n_+4:_ _4 tiles further_.
actors.hero.talent.sh_heavy_links.title=heavy links
actors.hero.talent.sh_heavy_links.desc=_+1:_ Enemies stay held _1 turn longer_.\n\n_+2:_ _2 turns longer_.\n\n_+3:_ _3 turns longer_.\n\n_+4:_ _4 turns longer_.
actors.hero.talent.sh_captive_souls.title=captive souls
actors.hero.talent.sh_captive_souls.desc=_+1:_ Gains _1 soul_ if it shackles any enemy.\n\n_+2:_ Gains _1 soul per enemy_, up to 2.\n\n_+3:_ Up to 3 souls.\n\n_+4:_ Up to 4 souls.

###Ovation talents
actors.hero.talent.ov_roar.title=roar of the crowd
actors.hero.talent.ov_roar.desc=_+1:_ Ovation lasts _2 turns longer_.\n\n_+2:_ _4 turns longer_.\n\n_+3:_ _6 turns longer_.\n\n_+4:_ _8 turns longer_.
actors.hero.talent.ov_iron_grit.title=iron grit
actors.hero.talent.ov_iron_grit.desc=_+1:_ When Ovation starts he gains a shield of _20%_ of his maximum grit.\n\n_+2:_ _40%_.\n\n_+3:_ _60%_.\n\n_+4:_ _80%_.
actors.hero.talent.ov_blood_sand.title=blood in the sand
actors.hero.talent.ov_blood_sand.desc=_+1:_ During Ovation, his punches heal him for _20%_ of the damage instead of 15%.\n\n_+2:_ _25%_.\n\n_+3:_ _30%_.\n\n_+4:_ _35%_.

###items
champions.ironlord.ironlordkit.name=iron crown
champions.ironlord.ironlordkit.desc=A cold, heavy crown of black iron with one broken spike. While you carry it you can use the techniques of the Ironlord.
champions.ironlord.ironlordmace.name=iron mace
champions.ironlord.ironlordmace.desc=An enormous mace of dark iron with a spiked head. It hits very hard, though it is a bit slow to swing.
items.armor.ironlordarmor.name=ironlord's armor
items.armor.ironlordarmor.desc=While wearing this armor, the Ironlord can perform a special ability.

###passive
champions.ironlord.risingdarkness.name=rising darkness
champions.ironlord.risingdarkness.aura=Darkness!
champions.ironlord.risingdarkness.desc=After _3 melee hits in a row_ (with only a few turns between them) a dark aura rises and hurts the enemies next to the Ironlord.\n\nHits in a row: _%1$d_ of %2$d.
champions.ironlord.risingdarkness$darkaura.name=dark aura
champions.ironlord.risingdarkness$darkaura.desc=A freezing darkness surrounds the Ironlord. Every turn it deals _%2$d_ damage to enemies within _%1$d tiles_.\n\nTurns left: %3$d.

###abilities
champions.ironlord.obliterate.name=obliterate
champions.ironlord.obliterate.desc=A mace blow over a cone of _%1$d tiles_ in front of him: every enemy takes _%2$d%%_ of his weapon's damage. The closest enemy takes _%3$d%%_ if it is _isolated_ (no other enemy within 2 tiles of it).
champions.ironlord.obliterate.desc_short=a cone-shaped mace blow; hits an isolated target harder.
champions.ironlord.obliterate.prompt=Choose where to strike
champions.ironlord.obliterate.no_target=There is no enemy there.
champions.ironlord.indestructible.name=indestructible
champions.ironlord.indestructible.desc=Gains a shield of _%1$d_ points, which grows with the damage he has dealt in the last 8 turns. For _%2$d turns_ he can use it again: it turns what is left of the shield into _healing_ (at _%3$d%%_). The cooldown starts when that window ends.
champions.ironlord.indestructible.desc_short=gains a shield based on the damage dealt; using it again turns it into healing.
champions.ironlord.indestructible$armed.name=indestructible
champions.ironlord.indestructible$armed.desc=You can use Indestructible again to turn the remaining shield into healing.\n\nTurns left: %s.
champions.ironlord.deathsgrasp.name=death's grasp
champions.ironlord.deathsgrasp.desc=Throws an iron claw in a straight line up to _%1$d tiles_: it drags every enemy it reaches next to him and deals them _%2$d-%3$d damage_.
champions.ironlord.deathsgrasp.desc_short=drags the enemies of a line next to him and hurts them.
champions.ironlord.deathsgrasp.prompt=Choose the direction of the claw
champions.ironlord.deathsgrasp.no_target=There is no enemy on that line.
champions.ironlord.realmofdeath.name=realm of death
champions.ironlord.realmofdeath.desc=Takes an enemy within _6 tiles_ to a _realm of its own_ of blue bricks, unreachable for anyone else, for a duel of _%1$d turns_. While it lasts he steals _%2$d%%_ of its maximum health and deals _%3$d%%_ more damage to it. If he kills it there, _he keeps the theft until he changes floor_. Using it again inside leaves the realm. Bosses and things that cannot be moved are not taken anywhere: only the theft happens.
champions.ironlord.realmofdeath.desc_short=a duel in a realm of its own; steals maximum health and damage.
champions.ironlord.realmofdeath.prompt=Choose who to challenge
champions.ironlord.realmofdeath.no_target=There is no enemy there.
champions.ironlord.realmofdeath.spoils=Spoils!
champions.ironlord.realmofdeath$duel.name=realm of death
champions.ironlord.realmofdeath$duel.desc=A duel to the death. He has stolen _%1$d_ maximum health and deals _%2$d%%_ more damage to his rival. Use the Realm of Death again to leave early.\n\nTurns left: %3$d.
champions.ironlord.realmofdeath$spoils.name=spoils of the duel
champions.ironlord.realmofdeath$spoils.desc=He killed his rival in the Realm of Death and keeps the theft until he changes floor: _+%1$d_ maximum health and _%2$d%%_ more damage.

###own armor abilities
champions.ironlord.ironeclipse.name=iron eclipse
champions.ironlord.ironeclipse.short_desc=Rising Darkness rises at once, bigger, stronger and slowing.
champions.ironlord.ironeclipse.desc=The Ironlord raises the dark aura at once for _8 turns_, with a radius _1 tile bigger_ and _1.5 times_ the damage. Enemies inside are _slowed_.
champions.executioner.bloodharvest.name=blood harvest
champions.executioner.bloodharvest.short_desc=Every bleeding enemy in sight loses all the blood it still had to bleed at once.
champions.executioner.bloodharvest.desc=All bleeding enemies in sight (within 8 tiles) take _all the damage they had left to bleed_ at once, and the hemorrhage ends. At least one enemy must be bleeding.
champions.executioner.bloodharvest.no_target=There is no bleeding enemy in sight.
champions.jailer.spectralshackles.name=spectral shackles
champions.jailer.spectralshackles.short_desc=Shackles of souls hold every enemy in sight and protect the Jailer.
champions.jailer.spectralshackles.desc=Spectral shackles hold every enemy in sight (within 6 tiles) for _3 turns_ (bosses are only crippled) and give the Jailer a shield for each of the first three.
champions.jailer.spectralshackles.no_target=There is no enemy in sight.
champions.brawler.ovation.name=ovation
champions.brawler.ovation.short_desc=The crowd goes wild: full grit and stronger punches that heal.
champions.brawler.ovation.desc=The Brawler's grit fills up to the maximum and does not fade for _8 turns_. While it lasts, his punches deal _25% more damage_ and heal him for _15%_ of the damage they deal.
champions.brawler.ovation$roar.name=ovation
champions.brawler.ovation$roar.desc=The crowd roars: punches deal _%1$d%%_ more damage and heal for _%2$d%%_ of the damage.\n\nTurns left: %3$s.
