#Gravedigger (es)

###clase
actors.hero.heroclass.gravedigger=sepulturero
actors.hero.heroclass.gravedigger_desc_short=El _Sepulturero_ cava una _tumba_ por cada enemigo que cae a su lado y la despierta como _caminante de la niebla_. Encierra a sus presas entre lápidas e invoca a la _Doncella de la Niebla_.
actors.hero.heroclass.gravedigger_desc=Cavó las tumbas del cementerio de la ciudad durante cuarenta años; ahora sigue a los muertos hacia abajo, con la Doncella de la Niebla a su lado. El Sepulturero empieza con una _campana fúnebre_, que le da _Últimos ritos_, _Procesión oscura_, _Niebla lúgubre_ y _Elegía de las Islas_ (desde el nivel 6).\n\nSu pasiva, el _Pastor de almas_, hace que los enemigos que mueren cerca de él le dejen una _tumba_ (hasta 3). Con 3 tumbas, Últimos ritos las _despierta_ como caminantes de la niebla que luchan a su lado.\n\nTambién empieza con una _pala de sepulturero_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de visión mental\n_-_ Pergaminos de terror
actors.hero.heroclass.gravedigger_unlock=Los campeones están desbloqueados desde el principio.

###subclases
actors.hero.herosubclass.mistlord=señor de la niebla
actors.hero.herosubclass.mistlord_short_desc=El _Señor de la niebla_ levanta caminantes más fuertes y duraderos, y su Doncella se queda hasta que la derroten.
actors.hero.herosubclass.mistlord_desc=Sus caminantes de la niebla tienen un _50% más de vida_, hacen un _25% más de daño_ y duran _35 turnos_ en vez de 25.\n\nLa Doncella de la Niebla tiene un _25% más de vida_, hace un _20% más de daño_ y se queda con él _hasta que la derroten_.
actors.hero.herosubclass.exhumer=exhumador
actors.hero.herosubclass.exhumer_short_desc=El _Exhumador_ pelea en primera línea: cada tumba que guarda le da más daño, y sus Últimos ritos se recargan antes y curan más.
actors.hero.herosubclass.exhumer_desc=Sus golpes cuerpo a cuerpo hacen un _3% más de daño por cada tumba_ que guarda.\n\nÚltimos ritos se recarga un _25% más rápido_ y cura el _40%_ del daño en vez del 25%. A cambio, solo despierta las tumbas cuando las tiene _todas_.

###talentos
actors.hero.talent.gra_meal.title=cena del sepulturero
actors.hero.talent.gra_meal.desc=_+1:_ Comer le da al Sepulturero _1 tumba_.\n\n_+2:_ Comer le da _2 tumbas_.
actors.hero.talent.gra_intuition.title=ojo de enterrador
actors.hero.talent.gra_intuition.desc=_+1:_ El Sepulturero identifica armaduras _1,75 veces más rápido_.\n\n_+2:_ Las identifica _2,5 veces más rápido_.
actors.hero.talent.gra_heavy_shovel.title=pala pesada
actors.hero.talent.gra_heavy_shovel.desc=_+1:_ El daño extra de Últimos ritos aumenta un _20%_.\n\n_+2:_ Aumenta un _40%_.
actors.hero.talent.gra_deep_graves.title=fosas hondas
actors.hero.talent.gra_deep_graves.desc=_+1:_ El Sepulturero puede guardar _4 tumbas_ en vez de 3.\n\n_+2:_ Puede guardar _5 tumbas_.
actors.hero.talent.gra_bottled_mist.title=niebla embotellada
actors.hero.talent.gra_bottled_mist.desc=_+1:_ Al beber o lanzar una poción, se levanta _1 caminante de la niebla_ junto al Sepulturero.\n\n_+2:_ Se levantan _2 caminantes_.
actors.hero.talent.gra_long_procession.title=procesión larga
actors.hero.talent.gra_long_procession.desc=_+1:_ Las lápidas de Procesión oscura duran _1 turno más_.\n\n_+2:_ Duran _2 turnos más_.
actors.hero.talent.gra_clinging_mist.title=niebla pegajosa
actors.hero.talent.gra_clinging_mist.desc=_+1:_ La marca de Niebla lúgubre dura _3 turnos más_ y además _ralentiza 2 turnos_.\n\n_+2:_ Dura _6 turnos más_ y _ralentiza 3 turnos_.
actors.hero.talent.gra_hard_bones.title=huesos duros
actors.hero.talent.gra_hard_bones.desc=_+1:_ Los caminantes de la niebla tienen un _25% más de vida_.\n\n_+2:_ Tienen un _50% más de vida_.
actors.hero.talent.gra_grim_harvest.title=cosecha macabra
actors.hero.talent.gra_grim_harvest.desc=_+1:_ Cuando muere un enemigo marcado por Niebla lúgubre, el enfriamiento de Últimos ritos se reduce _2 turnos_.\n\n_+2:_ Se reduce _4 turnos_.
actors.hero.talent.gra_maidens_wrath.title=ira de la Doncella
actors.hero.talent.gra_maidens_wrath.desc=_+1:_ La Doncella de la Niebla hace un _15% más de daño_.\n\n_+2:_ Un _30% más_.\n\n_+3:_ Un _45% más_.
actors.hero.talent.gra_flock.title=rebaño
actors.hero.talent.gra_flock.desc=_+1:_ Al despertar las tumbas se levanta _1 caminante más_.\n\n_+2:_ Se levantan _2 caminantes más_.\n\n_+3:_ Se levantan _3 caminantes más_.
actors.hero.talent.ml_mist_burst.title=estallido de niebla
actors.hero.talent.ml_mist_burst.desc=_+1:_ Al morir, los caminantes estallan en niebla: hacen _1 de daño, +1 cada 4 niveles_, a los enemigos de alrededor y los _marcan 4 turnos_.\n\n_+2:_ Hacen el _doble de daño_.\n\n_+3:_ Hacen el _triple de daño_.
actors.hero.talent.ml_endless_night.title=noche eterna
actors.hero.talent.ml_endless_night.desc=_+1:_ La Doncella levanta un caminante cada _4 turnos_ en vez de 5.\n\n_+2:_ Cada _3 turnos_.\n\n_+3:_ Cada _2 turnos_.
actors.hero.talent.ml_dark_communion.title=comunión oscura
actors.hero.talent.ml_dark_communion.desc=_+1:_ Los golpes de los caminantes y de la Doncella curan al Señor de la niebla el _10%_ del daño que hacen.\n\n_+2:_ El _20%_.\n\n_+3:_ El _30%_.
actors.hero.talent.ex_grave_strength.title=fuerza de ultratumba
actors.hero.talent.ex_grave_strength.desc=_+1:_ Cada tumba guardada da un _2% más_ de daño cuerpo a cuerpo (5% en total).\n\n_+2:_ Un _4% más_ (7% en total).\n\n_+3:_ Un _6% más_ (9% en total).
actors.hero.talent.ex_dig_deep.title=cavar hondo
actors.hero.talent.ex_dig_deep.desc=_+1:_ Últimos ritos se recarga un _15% más rápido_.\n\n_+2:_ Un _30% más rápido_.\n\n_+3:_ Un _45% más rápido_.
actors.hero.talent.ex_soul_shovel.title=pala de almas
actors.hero.talent.ex_soul_shovel.desc=_+1:_ Últimos ritos cura un _10% más_ del daño (50% en total).\n\n_+2:_ Un _20% más_ (60% en total).\n\n_+3:_ Un _30% más_ (70% en total).

###objetos
champions.gravedigger.gravediggerkit.name=campana fúnebre
champions.gravedigger.gravediggerkit.desc=Una campanilla de bronce verdoso, fría al tacto. Cuando suena, algo bajo la tierra contesta.
champions.gravedigger.shovel.name=pala de sepulturero
champions.gravedigger.shovel.desc=Una pala pesada de mango largo, con el filo mellado de tanto cavar. Pega algo menos que una espada corta, pero sirve igual para abrir tumbas que para llenarlas.
items.armor.gravediggerarmor.name=sudario del sepulturero
items.armor.gravediggerarmor.desc=Mientras lleve este sudario, el Sepulturero puede realizar una habilidad especial.

###habilidades
champions.gravedigger.lastrites.name=últimos ritos
champions.gravedigger.lastrites.desc=Agarra la pala (no gasta turno). Su siguiente golpe cuerpo a cuerpo en los próximos 5 turnos hace _%1$d-%2$d de daño extra_ y lo cura el _%3$d%%_ del daño. Si mata, cava _una tumba más_.\n\nSi tiene _%4$d tumbas_ o más, además las _despierta_: cada tumba se levanta a su alrededor como un _caminante de la niebla_ (%5$d PS) que lucha a su lado %6$d turnos.
champions.gravedigger.lastrites.desc_short=el siguiente golpe pega más y cura; con 3 tumbas, las despierta.
champions.gravedigger.lastrites.graves=Tumbas: _%1$d_ de %2$d.
champions.gravedigger.lastrites.awaken=¡Despertar! Se levantan %d caminantes de la niebla.
champions.gravedigger.lastrites.no_space=No hay sitio para despertar las tumbas.
champions.gravedigger.lastrites$primed.name=últimos ritos
champions.gravedigger.lastrites$primed.desc=La pala está lista: el siguiente golpe cuerpo a cuerpo hará daño extra y curará al Sepulturero.\n\nTurnos restantes: %s.
champions.gravedigger.lastrites$reaped.name=últimos ritos
champions.gravedigger.lastrites$reaped.desc=Si muere ahora, dejará una tumba más.\n\nTurnos restantes: %s.
champions.gravedigger.darkprocession.name=procesión oscura
champions.gravedigger.darkprocession.desc=Elige una casilla a _%1$d casillas_ o menos: a su alrededor, a 2 casillas, se levanta un anillo de _lápidas_ que dura _%2$d turnos_. Nadie puede cruzarlo, así que los enemigos de dentro quedan _encerrados_. Las casillas ocupadas quedan libres, y las lápidas se hunden en cuanto no queda ningún enemigo dentro.
champions.gravedigger.darkprocession.desc_short=encierra a los enemigos en un anillo de lápidas.
champions.gravedigger.darkprocession.prompt=Elige el centro de la procesión
champions.gravedigger.darkprocession.no_space=No hay sitio para las lápidas ahí.
champions.gravedigger.darkprocession.no_target=No hay ningún enemigo que encerrar ahí.
champions.gravedigger.darkprocession$gravewall.desc=Una lápida vieja envuelta en niebla. Nadie puede pasar por aquí hasta que vuelva a hundirse en la tierra.
champions.gravedigger.mourningmist.name=niebla lúgubre
champions.gravedigger.mourningmist.desc=Lanza una bola de niebla negra a una casilla a _%1$d casillas_ o menos. Estalla en un cuadrado de 3x3: los enemigos reciben _%2$d-%3$d de daño_ y quedan _marcados %4$d turnos_. Los aliados del Sepulturero hacen un _25%% más de daño_ a los marcados y van a por ellos primero.
champions.gravedigger.mourningmist.desc_slow=Además quedan _ralentizados %d turnos_.
champions.gravedigger.mourningmist.desc_short=daña y marca a los enemigos para sus aliados.
champions.gravedigger.mourningmist.prompt=Elige dónde lanzar la niebla
champions.gravedigger.eulogy.name=elegía de las Islas
champions.gravedigger.eulogy.desc=Invoca a la _Doncella de la Niebla_ a _%1$d casillas_ o menos. La Doncella (_%2$d PS_) lucha a su lado y, mientras pelea, levanta un _caminante de la niebla_ cada _%3$d turnos_ (2 a la vez como mucho). Los golpes del Sepulturero contra el enemigo que ella acaba de golpear hacen _el %4$d%% de su vida actual_ como daño extra (%5$d como mucho contra jefes). Mientras viva, usar esta habilidad le indica a dónde ir o a quién atacar.
champions.gravedigger.eulogy.desc_time=Se queda _40 turnos_.
champions.gravedigger.eulogy.desc_mistlord=El Señor de la niebla la mantiene _hasta que la derroten_.
champions.gravedigger.eulogy.desc_short=invoca a la Doncella de la Niebla.
champions.gravedigger.eulogy.prompt=Elige dónde (o, si ya está, a dónde va la Doncella)
champions.gravedigger.eulogy.no_space=No hay sitio para la Doncella ahí.
champions.gravedigger.eulogy.summoned=¡La Doncella de la Niebla responde a la elegía!

###estados
champions.gravedigger.shepherdofsouls.name=pastor de almas
champions.gravedigger.shepherdofsouls.grave=¡Tumba! (%d)
champions.gravedigger.shepherdofsouls.desc=Los enemigos que mueren a _%1$d casillas_ o menos del Sepulturero, y a la vista, le dejan una _tumba_. Últimos ritos las despierta como caminantes de la niebla.\n\nTumbas: _%2$d_ de %3$d.\nNecesarias para despertarlas: _%4$d_.
champions.gravedigger.shepherdofsouls.desc_exhumer=Daño extra cuerpo a cuerpo por las tumbas guardadas: _+%d%%_.
champions.gravedigger.mistmark.name=marca de niebla
champions.gravedigger.mistmark.desc=La niebla lúgubre se pega a este enemigo. Los aliados del Sepulturero le hacen un 25%% más de daño y van a por él primero.\n\nTurnos restantes: %s.
champions.gravedigger.maidenmark.name=presa de la Doncella
champions.gravedigger.maidenmark.desc=La Doncella de la Niebla acaba de golpear a este enemigo. Los golpes de su Sepulturero le harán daño extra.\n\nTurnos restantes: %s.

###aliados
champions.gravedigger.mistwalker.name=caminante de la niebla
champions.gravedigger.mistwalker.desc=Un espíritu menudo y rápido que el Sepulturero ha sacado de una tumba. Lucha por él y por su compañero: _%1$d-%2$d de daño_.
champions.gravedigger.mistwalker.desc_time=Volverá a la tierra en %1$d turnos, o antes si pasa %2$d turnos sin enemigos a los que atacar.
champions.gravedigger.mistmaiden.name=Doncella de la Niebla
champions.gravedigger.mistmaiden.desc=Un espectro alto y sereno, envuelto en la bruma de las Islas. Golpea con _%1$d-%2$d de daño_ y, mientras pelea, levanta un caminante de la niebla cada _%3$d turnos_.
champions.gravedigger.mistmaiden.desc_time=Se desvanecerá en %d turnos.
champions.gravedigger.mistmaiden.desc_forever=Se quedará hasta que la derroten.
champions.gravedigger.mistmaiden.fades=La Doncella de la Niebla se deshace en la bruma.
champions.gravedigger.mistmaiden.direct_defend=La Doncella va hacia allí.
champions.gravedigger.mistmaiden.direct_follow=La Doncella te seguirá.
champions.gravedigger.mistmaiden.direct_attack=La Doncella va a por él.
