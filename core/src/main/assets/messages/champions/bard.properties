#Bard

###class
actors.hero.heroclass.bard=bard
actors.hero.heroclass.bard_desc_short=The _Bard_ fights with songs: he fills his allies with _valor_, sings enemies to sleep, heals the whole party and, with his _Grand Finale_, gives every hero an extra turn.
actors.hero.heroclass.bard_desc=A wandering musician who sang in the city's taverns about those who went down into the dungeon, until he decided to go down with them. The Bard starts with a _lute_, which grants four songs: _Ballad of Valor_, _Lullaby_, _Healing Hymn_ and the _Grand Finale_ (from level 6). His songs also reach his partner and his allies: he is the support of the party.\n\nHis passive, the _refrain_, adds a note with every song. With 3 notes, the next song is sung in _Fortissimo_ and is much stronger.\n\nHe also starts with a _dagger_, cloth armor, a waterskin and a velvet pouch.\n\nAutomatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Lullaby
actors.hero.heroclass.bard_unlock=The champions are unlocked from the start.

###subclasses
actors.hero.herosubclass.troubadour=troubadour
actors.hero.herosubclass.troubadour_short_desc=The _Troubadour_ sings to protect: his Hymn recharges sooner and heals more, and his Ballad reaches farther.
actors.hero.herosubclass.troubadour_desc=Healing Hymn recharges _30% faster_ and heals _20% more_.\n\nBallad of Valor reaches _2 more tiles_.
actors.hero.herosubclass.minstrel=minstrel
actors.hero.herosubclass.minstrel_short_desc=The _Minstrel_ sings to fight: he puts enemies to sleep more often and hits the helpless harder.
actors.hero.herosubclass.minstrel_desc=Lullaby recharges _30% faster_.\n\nHis attacks deal _20% more damage_ to enemies that are asleep, paralysed or slowed.

###talents
actors.hero.talent.bar_meal.title=bard's snack
actors.hero.talent.bar_meal.desc=_+1:_ Eating adds _1 note_ to the Bard's refrain.\n\n_+2:_ Eating adds _2 notes_.
actors.hero.talent.bar_intuition.title=keen ear
actors.hero.talent.bar_intuition.desc=_+1:_ The Bard identifies rings _1.75x faster_.\n\n_+2:_ He identifies them _2.5x faster_.
actors.hero.talent.bar_loud_voice.title=loud voice
actors.hero.talent.bar_loud_voice.desc=_+1:_ Ballad of Valor reaches _1 more tile_ and Lullaby can be sung _1 tile farther_.\n\n_+2:_ _2 more tiles_ and _2 tiles farther_.
actors.hero.talent.bar_applause.title=applause
actors.hero.talent.bar_applause.desc=_+1:_ For every hero or ally a song reaches (himself included), the Bard heals _1 HP_.\n\n_+2:_ He heals _2 HP_ for each.
actors.hero.talent.bar_liquid_music.title=liquid music
actors.hero.talent.bar_liquid_music.desc=_+1:_ Drinking or throwing a potion takes _3 turns_ off the Bard's cooldowns.\n\n_+2:_ It takes _5 turns_ off.
actors.hero.talent.bar_deep_sleep.title=deep sleep
actors.hero.talent.bar_deep_sleep.desc=_+1:_ Lullaby makes enemies sleep _2 more turns_.\n\n_+2:_ _4 more turns_.
actors.hero.talent.bar_soothing.title=soothing voice
actors.hero.talent.bar_soothing.desc=_+1:_ Healing Hymn heals _25% more_.\n\n_+2:_ It heals _50% more_.
actors.hero.talent.bar_rally.title=rally
actors.hero.talent.bar_rally.desc=_+1:_ Ballad of Valor also grants _1 shielding_ (plus 1 every 4 levels of the Bard) to everyone it reaches.\n\n_+2:_ Twice as much shielding.
actors.hero.talent.bar_tempo.title=tempo
actors.hero.talent.bar_tempo.desc=_+1:_ Grand Finale also grants _3 turns of haste_ to the heroes.\n\n_+2:_ _5 turns of haste_.
actors.hero.talent.bar_virtuoso.title=virtuoso
actors.hero.talent.bar_virtuoso.desc=_+1:_ Songs in Fortissimo are _75% stronger_ instead of 50%.\n\n_+2:_ They are _100% stronger_.\n\n_+3:_ They are 100% stronger and only need _2 notes_.
actors.hero.talent.bar_duet.title=duet
actors.hero.talent.bar_duet.desc=_+1:_ A song that reaches another hero or an ally is _15% stronger_.\n\n_+2:_ _30% stronger_.\n\n_+3:_ _45% stronger_.
actors.hero.talent.tb_anthem.title=battle anthem
actors.hero.talent.tb_anthem.desc=_+1:_ Ballad of Valor lasts _3 more turns_.\n\n_+2:_ _6 more turns_.\n\n_+3:_ _9 more turns_.
actors.hero.talent.tb_life_song.title=song of life
actors.hero.talent.tb_life_song.desc=_+1:_ Healing Hymn also heals over the next 10 turns _1 HP_ (plus 1 every 3 levels of the Troubadour).\n\n_+2:_ Twice as much.\n\n_+3:_ Three times as much.
actors.hero.talent.tb_harmony.title=harmony
actors.hero.talent.tb_harmony.desc=_+1:_ Every song removes _1 negative effect_ from each hero or ally it reaches (Healing Hymn, one more).\n\n_+2:_ _2 negative effects_.\n\n_+3:_ _All_ negative effects.
actors.hero.talent.mi_dissonance.title=dissonance
actors.hero.talent.mi_dissonance.desc=_+1:_ Songs deal _1 damage_ (plus 1 every 4 levels of the Minstrel) to the enemies in their area: within reach of Ballad of Valor, the ones Lullaby puts to sleep (before they fall asleep) and the ones up to 3 tiles away for Healing Hymn.\n\n_+2:_ Twice the damage.\n\n_+3:_ Three times the damage.
actors.hero.talent.mi_rude_awakening.title=rude awakening
actors.hero.talent.mi_rude_awakening.desc=_+1:_ Enemies put to sleep by Lullaby take _2 damage_ (plus 1 every 3 levels of the Minstrel) when something wakes them up.\n\n_+2:_ Twice the damage.\n\n_+3:_ Three times the damage.
actors.hero.talent.mi_crescendo.title=crescendo
actors.hero.talent.mi_crescendo.desc=_+1:_ Grand Finale deals _2 damage_ (plus 1 every 2 levels of the Minstrel) to the enemies in sight and slows them _1 more turn_.\n\n_+2:_ Twice the damage and _2 more turns_.\n\n_+3:_ Three times the damage and _3 more turns_.

###lute and songs
champions.bard.bardkit.name=bard's lute
champions.bard.bardkit.desc=A well-worn lute with a few patched strings. In the right hands, every chord gives courage to friends and sleep to foes.
champions.bard.bardsong.desc_dissonance=Dissonance deals _%d damage_ to the enemies in its area.
champions.bard.bardsong.forte_ready=_Fortissimo is ready!_

champions.bard.ballad.name=ballad of valor
champions.bard.ballad.desc=Sings to the heroes and allies up to _%1$d tiles_ away (the Bard included): they are _blessed_ for _%2$d turns_, and the heroes also get _Valor_ (_+%3$d%% damage_) for as long.
champions.bard.ballad.desc_rally=They also gain _%d shielding_.
champions.bard.ballad.desc_short=blesses the party and grants more damage.
champions.bard.ballad.desc_forte=_Fortissimo:_ everything lasts _%1$d%%_ longer.
champions.bard.ballad$valor.name=valor
champions.bard.ballad$valor.desc=A heroic song still rings in this character's ears.\n\nAttacks deal _%1$d%% more damage_.\n\nTurns of valor remaining: %2$d.

champions.bard.lullaby.name=lullaby
champions.bard.lullaby.desc=Sings towards a spot up to _%1$d tiles_ away: the enemies on it and around it fall into a _magical sleep_ for _%2$d turns_ (any damage wakes them up). Bosses, and enemies that can't sleep, are _slowed for %3$d turns_ instead.
champions.bard.lullaby.desc_rude=When something wakes them up, they take _%d damage_ (Rude Awakening).
champions.bard.lullaby.desc_short=puts the enemies of an area to sleep.
champions.bard.lullaby.desc_forte=_Fortissimo:_ the area grows to 2 tiles around the spot and everything lasts _%1$d%%_ longer.
champions.bard.lullaby.prompt=Choose where to sing the lullaby
champions.bard.lullaby.slept=The lullaby puts %d enemies to sleep.
champions.bard.lullaby.slept_one=The lullaby puts an enemy to sleep.
champions.bard.lullaby$drowse.name=lullaby
champions.bard.lullaby$drowse.desc=This character sleeps to the sound of a lullaby.
champions.bard.lullaby$drowse.rude=Rude awakening!

champions.bard.hymn.name=healing hymn
champions.bard.hymn.desc=Heals the Bard and every hero and ally in sight for _%2$d%% of their max health + %3$d_ (the Bard: _%1$d HP_), and removes _one negative effect_ from each.
champions.bard.hymn.desc_life=It also heals _%1$d HP_ over the next %2$d turns (Song of Life).
champions.bard.hymn.desc_dissonance=Dissonance deals _%1$d damage_ to the enemies up to %2$d tiles away.
champions.bard.hymn.desc_short=heals the whole party and cleanses an ailment.
champions.bard.hymn.desc_forte=_Fortissimo:_ heals _%1$d%%_ more.

champions.bard.finale.name=grand finale
champions.bard.finale.desc=Every hero of the party gets _an extra turn_: they act again before the enemies (the Bard, right after singing). Allies in sight move faster for 2 turns, and enemies in sight are _slowed for %1$d turns_.
champions.bard.finale.desc_crescendo=Crescendo deals _%d damage_ to the enemies in sight.
champions.bard.finale.desc_tempo=The heroes also gain _%d turns of haste_.
champions.bard.finale.desc_short=gives the whole party an extra turn and slows the enemies.
champions.bard.finale.desc_forte=_Fortissimo:_ _two extra turns_, and everything else is _%1$d%%_ stronger.
champions.bard.finale$encore.name=encore
champions.bard.finale$encore.desc=The grand finale is still playing! The next actions of this hero, up to %s turns, take no time: nobody else moves meanwhile.

champions.bard.refrain.name=refrain
champions.bard.refrain.desc=Every song adds a note. With _%1$d notes_, the next song is sung in _Fortissimo_: it is _%2$d%%_ stronger (each song tells how) and spends the notes.\n\nNotes: _%3$d/%4$d_.
champions.bard.refrain.desc_charged=The next song will be sung in _Fortissimo_!
champions.bard.refrain.charged=Fortissimo ready!
champions.bard.refrain.forte=Fortissimo!

###class armor
items.armor.bardarmor.name=bard's doublet
items.armor.bardarmor.desc=While wearing this doublet, the Bard can perform a special ability.

###armor ability
champions.bard.grandoverture.name=grand overture
champions.bard.grandoverture.short_desc=The whole dungeon listens: enemies in sight are _charmed_ and allies get _faster_.
champions.bard.grandoverture.desc=The Bard plays an overture that the whole dungeon hears. Enemies within 8 tiles and in sight are _charmed for 3 turns_ (bosses, half as long) and can't attack him. Heroes and allies in sight gain _3 turns of haste_.
