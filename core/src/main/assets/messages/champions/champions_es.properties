###héroes nuevos

###clases
actors.hero.heroclass.executioner=verdugo
actors.hero.heroclass.executioner_desc_short=El _Verdugo_ desangra a sus enemigos con cada hachazo. Con cinco heridas se desata su _poder_ y su _Guillotina_ remata a quien sangra.
actors.hero.heroclass.executioner_desc=Fue el verdugo de la prisión hasta que los presos se adueñaron de sus pasillos; ahora baja con su hacha a terminar el trabajo. El Verdugo empieza con un _emblema del verdugo_, que le da cuatro habilidades: _Diezmar_, _Golpe mutilador_, _Aprehender_ y la _Guillotina_ (desde el nivel 6).\n\nSus golpes cuerpo a cuerpo causan _hemorragia_ acumulable (hasta 5). Al llegar a 5 en un enemigo gana el _poder del verdugo_: más daño y cada golpe aplica la hemorragia máxima.\n\nTambién empieza con un _hacha de verdugo_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de curación\n_-_ Pergaminos de terror
actors.hero.heroclass.executioner_unlock=Los campeones están desbloqueados desde el principio.

actors.hero.heroclass.scout=explorador
actors.hero.heroclass.scout_desc_short=El _Explorador_ envenena con cada golpe, se _camufla_ si se queda quieto y llena la mazmorra de _setas venenosas_.
actors.hero.heroclass.scout_desc=Batidor de la guardia de la ciudad, pequeño y escurridizo, lleva años trazando mapas de las alcantarillas y conoce cada seta de la mazmorra. El Explorador empieza con un _gorro de explorador_, que le da _Dardo cegador_, _Paso ligero_ y las _setas venenosas_ (desde el nivel 6).\n\nTodos sus golpes _envenenan_ (Disparo tóxico). Si se queda quieto unos turnos, se _camufla_ y se vuelve invisible hasta que se mueva o ataque.\n\nTambién empieza con una _cerbatana_ de dardos infinitos, una _daga_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de gas tóxico\n_-_ Pergaminos de teletransporte
actors.hero.heroclass.scout_unlock=Los campeones están desbloqueados desde el principio.

actors.hero.heroclass.pyromancer=piromante
actors.hero.heroclass.pyromancer_desc_short=La _Piromante_ lanza bolas y conos de fuego, protege con un _escudo fundido_ e invoca a _Brasas_, su oso de fuego. Cada pocos hechizos, el siguiente _aturde_.
actors.hero.heroclass.pyromancer_desc=Una niña criada entre los magos de fuego de la ciudad; nadie sabe de dónde salió Brasas, pero el oso nunca se separa de ella. La Piromante empieza con el _peluche de Brasas_, que le da _Desintegrar_, _Incinerar_, _Escudo fundido_ e invocar a _Brasas_ (desde el nivel 6).\n\nSu pasiva, la _piromanía_, hace que tras 4 habilidades la siguiente que haga daño _aturda_ a sus objetivos. Además resiste el fuego.\n\nTambién empieza con unos _guantes_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de llama líquida\n_-_ Pergaminos de recarga
actors.hero.heroclass.pyromancer_unlock=Los campeones están desbloqueados desde el principio.

actors.hero.heroclass.jailer=carcelero
actors.hero.heroclass.jailer_desc_short=El _Carcelero_ arrastra enemigos con su cadena, rescata a sus aliados con el _farol_ y se hace más duro con cada _alma_ que recoge.
actors.hero.heroclass.jailer_desc=El viejo carcelero de la prisión sigue haciendo su ronda con el farol, y en él guarda las almas de quienes caen en la mazmorra. El Carcelero empieza con un _farol_, que le da _Sentencia_, _Pasaje oscuro_, _Desollar_ y _La caja_ (desde el nivel 6).\n\nLos enemigos que mueren cerca pueden dejar un _alma_. Solo él puede recogerlas, pisándolas: cada alma le da _armadura permanente_ y fortalece sus habilidades.\n\nTambién empieza con una _hoz con cadena_ que alcanza a 2 casillas, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de gas paralizante\n_-_ Pergaminos de retribución
actors.hero.heroclass.jailer_unlock=Los campeones están desbloqueados desde el principio.

actors.hero.heroclass.brawler=púgil
actors.hero.heroclass.brawler_desc_short=El _Púgil_ convierte el daño que recibe en _agallas_ y las suelta en un puñetazo devastador que también lo protege. Pega con los puños, alternando golpes.
actors.hero.heroclass.brawler_desc=Campeón invicto de los fosos de pelea de la ciudad, baja a la mazmorra buscando rivales que aguanten más de un asalto. El Púgil empieza con un _cinturón de campeón_, que le da _Nudillos_, _Golpe demoledor_, _Rompecaras_ y _Fin del espectáculo_ (desde el nivel 6).\n\nEl daño que recibe se convierte en _agallas_, que su Golpe demoledor transforma en daño y escudo. Cada segundo puñetazo pega más fuerte, y se cura más rápido cuanto más herido está.\n\nTambién empieza con unas _nudilleras de latón_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de curación\n_-_ Pergaminos de furia
actors.hero.heroclass.brawler_unlock=Los campeones están desbloqueados desde el principio.

###subclases
actors.hero.herosubclass.conqueror=conquistador
actors.hero.herosubclass.conqueror_short_desc=El _Conquistador_ alcanza más enemigos con Diezmar y se cura mientras dura el poder del verdugo.
actors.hero.herosubclass.conqueror_desc=Diezmar alcanza a los enemigos a _2 casillas_.\n\nAl activar el poder del verdugo se cura el _15% de la vida que le falta_, y mientras dura se cura el _20% del daño_ que hace cuerpo a cuerpo.
actors.hero.herosubclass.headsman=decapitador
actors.hero.herosubclass.headsman_short_desc=El _Decapitador_ remata a los enemigos debilitados y usa la Guillotina más a menudo.
actors.hero.herosubclass.headsman_desc=Sus golpes cuerpo a cuerpo _ejecutan_ a los enemigos que quedan por debajo del _10% de vida_ (no funciona con jefes).\n\nLa Guillotina se recarga un _25% más rápido_.
actors.hero.herosubclass.trapper=trampero
actors.hero.herosubclass.trapper_short_desc=El _Trampero_ lleva más setas, las recarga el doble de rápido y explotan en un área mayor.
actors.hero.herosubclass.trapper_desc=Puede llevar _2 setas más_, recupera una cada _12 turnos_ en vez de 25, y sus setas explotan en un área de _5x5_.
actors.hero.herosubclass.skirmisher=hostigador
actors.hero.herosubclass.skirmisher_short_desc=El _Hostigador_ dispara la cerbatana el doble de rápido y su Dardo cegador rebota.
actors.hero.herosubclass.skirmisher_desc=Su cerbatana dispara en _medio turno_.\n\nEl Dardo cegador _rebota_ a otro enemigo cercano.
actors.hero.herosubclass.tamer=domadora
actors.hero.herosubclass.tamer_short_desc=La _Domadora_ invoca un Brasas más fuerte que no desaparece con el tiempo.
actors.hero.herosubclass.tamer_desc=Brasas tiene un _50% más de vida y de daño_ y se queda con ella _hasta que lo derroten_.\n\nCada vez que la piromanía aturde, Brasas se enfurece y gana _3 turnos de velocidad_.
actors.hero.herosubclass.infernalist=incendiaria
actors.hero.herosubclass.infernalist_short_desc=La _Incendiaria_ es inmune al fuego y quema mejor a quien ya arde.
actors.hero.herosubclass.infernalist_desc=Es _inmune al fuego_.\n\nDesintegrar e Incinerar hacen un _20% más de daño_ a los enemigos que ya arden, e Incinerar abarca un cono más ancho (_90°_).
actors.hero.herosubclass.soulreaper=segador de almas
actors.hero.herosubclass.soulreaper_short_desc=El _Segador de almas_ consigue el doble de almas y se cura con cada una.
actors.hero.herosubclass.soulreaper_desc=La probabilidad de que un enemigo deje un alma se _duplica_, y cada alma que recoge lo _cura 1 PS_.
actors.hero.herosubclass.lanternkeeper=guardián del farol
actors.hero.herosubclass.lanternkeeper_short_desc=El _Guardián del farol_ rescata más lejos, más a menudo y con el doble de escudo.
actors.hero.herosubclass.lanternkeeper_desc=Pasaje oscuro se recarga un _40% más rápido_, llega _3 casillas más lejos_, da el _doble de escudo_ y _limpia los efectos negativos_ del aliado rescatado.
actors.hero.herosubclass.pitboss=jefe del foso
actors.hero.herosubclass.pitboss_short_desc=El _Jefe del foso_ acumula más agallas y saca más escudo de ellas.
actors.hero.herosubclass.pitboss_desc=Puede acumular un _50% más de agallas_, el escudo del Golpe demoledor es un _50% mayor_, y con las agallas a la mitad o más sus puñetazos hacen _+2 de daño_.
actors.hero.herosubclass.showman=estrella del ring
actors.hero.herosubclass.showman_short_desc=La _Estrella del ring_ usa más a menudo su remate y se cura al rematar con habilidades.
actors.hero.herosubclass.showman_desc=Fin del espectáculo se recarga un _30% más rápido_ y Rompecaras siempre aturde al menos _1 turno_.\n\nCuando mata a un enemigo con Golpe demoledor, Rompecaras o Fin del espectáculo, se cura el _10% de su vida máxima_.

###talentos del Verdugo
actors.hero.talent.exe_meal.title=ración de guerra
actors.hero.talent.exe_meal.desc=_+1:_ Comer reduce _3 turnos_ los enfriamientos de las habilidades del Verdugo.\n\n_+2:_ Comer reduce _5 turnos_ los enfriamientos de las habilidades del Verdugo.
actors.hero.talent.exe_intuition.title=ojo de verdugo
actors.hero.talent.exe_intuition.desc=_+1:_ El Verdugo identifica armas cuerpo a cuerpo _1,75 veces más rápido_.\n\n_+2:_ El Verdugo identifica armas cuerpo a cuerpo _2,5 veces más rápido_.
actors.hero.talent.exe_deep_wounds.title=heridas profundas
actors.hero.talent.exe_deep_wounds.desc=_+1:_ La hemorragia dura _2 turnos más_ sin necesidad de volver a golpear.\n\n_+2:_ La hemorragia dura _4 turnos más_ sin necesidad de volver a golpear.
actors.hero.talent.exe_thick_skin.title=piel curtida
actors.hero.talent.exe_thick_skin.desc=_+1:_ Diezmar le da al Verdugo _2 de escudo_ por cada enemigo golpeado.\n\n_+2:_ Diezmar le da al Verdugo _3 de escudo_ por cada enemigo golpeado.
actors.hero.talent.exe_iron_resolve.title=determinación
actors.hero.talent.exe_iron_resolve.desc=_+1:_ Al beber o lanzar una poción, el Verdugo gana un escudo del _5% de su vida máxima_.\n\n_+2:_ Al beber o lanzar una poción, el Verdugo gana un escudo del _8% de su vida máxima_.
actors.hero.talent.exe_long_reach.title=brazo largo
actors.hero.talent.exe_long_reach.desc=_+1:_ Aprehender llega _1 casilla más lejos_ y lisia _1 turno más_.\n\n_+2:_ Aprehender llega _2 casillas más lejos_ y lisia _2 turnos más_.
actors.hero.talent.exe_cruel_blow.title=golpe cruel
actors.hero.talent.exe_cruel_blow.desc=_+1:_ Golpe mutilador aplica _2 acumulaciones_ de hemorragia en vez de 1.\n\n_+2:_ Golpe mutilador aplica _3 acumulaciones_ de hemorragia en vez de 1.
actors.hero.talent.exe_bloodlust.title=sed de sangre
actors.hero.talent.exe_bloodlust.desc=_+1:_ Cuando muere un enemigo que sangraba, los enfriamientos del Verdugo se reducen _2 turnos_.\n\n_+2:_ Cuando muere un enemigo que sangraba, los enfriamientos del Verdugo se reducen _3 turnos_.
actors.hero.talent.exe_intimidate.title=presencia aterradora
actors.hero.talent.exe_intimidate.desc=_+1:_ Al activarse el poder del verdugo, los enemigos adyacentes quedan _debilitados 3 turnos_.\n\n_+2:_ Al activarse el poder del verdugo, los enemigos adyacentes quedan _debilitados 5 turnos_.
actors.hero.talent.exe_sharp_guillotine.title=hoja afilada
actors.hero.talent.exe_sharp_guillotine.desc=_+1:_ La Guillotina hace un _10% más de daño_.\n\n_+2:_ La Guillotina hace un _20% más de daño_.\n\n_+3:_ La Guillotina hace un _30% más de daño_.
actors.hero.talent.exe_relentless.title=implacable
actors.hero.talent.exe_relentless.desc=_+1:_ El poder del verdugo dura _2 turnos más_.\n\n_+2:_ El poder del verdugo dura _4 turnos más_.\n\n_+3:_ El poder del verdugo dura _6 turnos más_.
actors.hero.talent.cq_warlord.title=señor de la guerra
actors.hero.talent.cq_warlord.desc=_+1:_ Mientras dura el poder del verdugo, el Conquistador gana _0-2 de armadura_.\n\n_+2:_ Mientras dura el poder del verdugo, el Conquistador gana _0-4 de armadura_.\n\n_+3:_ Mientras dura el poder del verdugo, el Conquistador gana _0-6 de armadura_.
actors.hero.talent.cq_spin.title=torbellino
actors.hero.talent.cq_spin.desc=_+1:_ Diezmar aplica _1 acumulación extra_ de hemorragia a cada enemigo golpeado.\n\n_+2:_ Diezmar aplica _2 acumulaciones extra_.\n\n_+3:_ Diezmar aplica _3 acumulaciones extra_.
actors.hero.talent.cq_bloodfeast.title=festín sangriento
actors.hero.talent.cq_bloodfeast.desc=_+1:_ Diezmar cura un _4% más_ de la vida que falta por cada enemigo golpeado.\n\n_+2:_ Diezmar cura un _8% más_.\n\n_+3:_ Diezmar cura un _12% más_.
actors.hero.talent.hs_sentence.title=sentencia firme
actors.hero.talent.hs_sentence.desc=_+1:_ El Decapitador ejecuta a los enemigos por debajo del _13%_ de vida.\n\n_+2:_ Ejecuta por debajo del _16%_ de vida.\n\n_+3:_ Ejecuta por debajo del _19%_ de vida.
actors.hero.talent.hs_repeat.title=reincidente
actors.hero.talent.hs_repeat.desc=_+1:_ Cuando la Guillotina mata y se reinicia, el Decapitador gana _1 turno de velocidad_.\n\n_+2:_ Gana _2 turnos de velocidad_.\n\n_+3:_ Gana _3 turnos de velocidad_.
actors.hero.talent.hs_bloody_axe.title=hacha ensangrentada
actors.hero.talent.hs_bloody_axe.desc=_+1:_ La hemorragia hace _1 de daño extra_ por turno a los enemigos por debajo de la mitad de su vida.\n\n_+2:_ Hace _2 de daño extra_ por turno.\n\n_+3:_ Hace _3 de daño extra_ por turno.

###talentos del Explorador
actors.hero.talent.sco_meal.title=merienda de explorador
actors.hero.talent.sco_meal.desc=_+1:_ Comer _camufla_ al Explorador al instante.\n\n_+2:_ Comer lo camufla al instante y le da _2 turnos de velocidad_.
actors.hero.talent.sco_intuition.title=ojo avizor
actors.hero.talent.sco_intuition.desc=_+1:_ El Explorador identifica armas arrojadizas y anillos _el doble de rápido_.\n\n_+2:_ Los identifica _el triple de rápido_.
actors.hero.talent.sco_potent_venom.title=veneno potente
actors.hero.talent.sco_potent_venom.desc=_+1:_ El Disparo tóxico envenena _1 turno más_.\n\n_+2:_ El Disparo tóxico envenena _2 turnos más_.
actors.hero.talent.sco_blinding_eye.title=destello
actors.hero.talent.sco_blinding_eye.desc=_+1:_ El Dardo cegador hace _+1 de daño_ y ciega _1 turno más_.\n\n_+2:_ El Dardo cegador hace _+2 de daño_ y ciega _2 turnos más_.
actors.hero.talent.sco_fleet_foot.title=pies ligeros
actors.hero.talent.sco_fleet_foot.desc=_+1:_ Paso ligero dura _1 turno más_.\n\n_+2:_ Paso ligero dura _2 turnos más_.
actors.hero.talent.sco_quick_camo.title=camuflaje rápido
actors.hero.talent.sco_quick_camo.desc=_+1:_ El Explorador se camufla tras _2 turnos_ quieto en vez de 3.\n\n_+2:_ Se camufla tras _1 turno_ quieto.
actors.hero.talent.sco_more_shrooms.title=bolsa de setas
actors.hero.talent.sco_more_shrooms.desc=_+1:_ El Explorador puede llevar _1 seta más_.\n\n_+2:_ Puede llevar _2 setas más_.
actors.hero.talent.sco_liquid_camo.title=pócima de camuflaje
actors.hero.talent.sco_liquid_camo.desc=_+1:_ Al beber o lanzar una poción, el Explorador se camufla y gana _2 turnos de velocidad_.\n\n_+2:_ Se camufla y gana _3 turnos de velocidad_.
actors.hero.talent.sco_keen_senses.title=sentidos agudos
actors.hero.talent.sco_keen_senses.desc=_+1:_ El Explorador percibe a los personajes a _2 casillas_ aunque no los vea.\n\n_+2:_ Los percibe a _3 casillas_.
actors.hero.talent.sco_big_shroom.title=setas gigantes
actors.hero.talent.sco_big_shroom.desc=_+1:_ Las setas hacen un _15% más_ de daño y de veneno.\n\n_+2:_ Hacen un _30% más_.\n\n_+3:_ Hacen un _45% más_.
actors.hero.talent.sco_ambush.title=emboscada
actors.hero.talent.sco_ambush.desc=_+1:_ El primer golpe desde el camuflaje (o hasta 2 turnos después de perderlo) hace un _20% más de daño_.\n\n_+2:_ Hace un _40% más de daño_.\n\n_+3:_ Hace un _60% más de daño_.
actors.hero.talent.tr_bounce.title=setas saltarinas
actors.hero.talent.tr_bounce.desc=_+1:_ Al explotar, una seta tiene un _25%_ de probabilidad de hacer brotar otra cerca (con la mitad de probabilidad de volver a brotar).\n\n_+2:_ Probabilidad del _50%_.\n\n_+3:_ Probabilidad del _75%_.
actors.hero.talent.tr_paralytic.title=esporas paralizantes
actors.hero.talent.tr_paralytic.desc=_+1:_ Las setas enraízan a los enemigos _1 turno_.\n\n_+2:_ Los enraízan _2 turnos_.\n\n_+3:_ Los enraízan _3 turnos_.
actors.hero.talent.tr_long_throw.title=lanzamiento largo
actors.hero.talent.tr_long_throw.desc=_+1:_ El Trampero planta setas _1 casilla más lejos_.\n\n_+2:_ _2 casillas más lejos_.\n\n_+3:_ _3 casillas más lejos_.
actors.hero.talent.sk_corrosive.title=veneno corrosivo
actors.hero.talent.sk_corrosive.desc=_+1:_ Los golpes del Hostigador hacen un _10% más de daño_ a los enemigos envenenados.\n\n_+2:_ Un _20% más_.\n\n_+3:_ Un _30% más_.
actors.hero.talent.sk_shadow_step.title=paso sombrío
actors.hero.talent.sk_shadow_step.desc=_+1:_ El Hostigador puede dar _1 paso_ sin perder el camuflaje.\n\n_+2:_ Puede dar _2 pasos_.\n\n_+3:_ Puede dar _3 pasos_.
actors.hero.talent.sk_ricochet.title=rebote
actors.hero.talent.sk_ricochet.desc=_+1:_ El Dardo cegador rebota _1 vez más_.\n\n_+2:_ Rebota _2 veces más_.\n\n_+3:_ Rebota _3 veces más_.

###talentos de la Piromante
actors.hero.talent.pyr_meal.title=merienda ardiente
actors.hero.talent.pyr_meal.desc=_+1:_ Comer le da a la Piromante _1 acumulación_ de piromanía.\n\n_+2:_ Comer le da _2 acumulaciones_ de piromanía.
actors.hero.talent.pyr_intuition.title=intuición arcana
actors.hero.talent.pyr_intuition.desc=_+1:_ La Piromante identifica varitas _el doble de rápido_.\n\n_+2:_ Las identifica _el triple de rápido_.
actors.hero.talent.pyr_spark.title=chispa
actors.hero.talent.pyr_spark.desc=_+1:_ Desintegrar hace _+1 de daño_.\n\n_+2:_ Desintegrar hace _+2 de daño_.
actors.hero.talent.pyr_warmth.title=calidez
actors.hero.talent.pyr_warmth.desc=_+1:_ El Escudo fundido da _+2 de escudo_.\n\n_+2:_ El Escudo fundido da _+4 de escudo_.
actors.hero.talent.pyr_fire_drinker.title=bebedora de fuego
actors.hero.talent.pyr_fire_drinker.desc=_+1:_ Al beber o lanzar una poción, los enfriamientos de la Piromante se reducen _3 turnos_.\n\n_+2:_ Se reducen _5 turnos_.
actors.hero.talent.pyr_wide_flames.title=llamas amplias
actors.hero.talent.pyr_wide_flames.desc=_+1:_ Incinerar llega _1 casilla más lejos_.\n\n_+2:_ Llega _2 casillas más lejos_.
actors.hero.talent.pyr_bear_hug.title=abrazo de oso
actors.hero.talent.pyr_bear_hug.desc=_+1:_ Brasas tiene un _20% más de vida_.\n\n_+2:_ Brasas tiene un _40% más de vida_.
actors.hero.talent.pyr_early_spark.title=pirómana precoz
actors.hero.talent.pyr_early_spark.desc=_+1:_ La piromanía se carga con _3 habilidades_ en vez de 4.\n\n_+2:_ Además, su aturdimiento dura _1 turno más_.
actors.hero.talent.pyr_ember_step.title=paso de brasas
actors.hero.talent.pyr_ember_step.desc=_+1:_ El Escudo fundido da _1 turno de velocidad_ a quien lo recibe.\n\n_+2:_ Da _2 turnos de velocidad_.
actors.hero.talent.pyr_combustion.title=combustión
actors.hero.talent.pyr_combustion.desc=_+1:_ Desintegrar hace un _10% más de daño_, y si mata reduce _1 turno_ los demás enfriamientos.\n\n_+2:_ Un _20% más_ y reduce _2 turnos_.\n\n_+3:_ Un _30% más_ y reduce _3 turnos_.
actors.hero.talent.pyr_scorched.title=tierra calcinada
actors.hero.talent.pyr_scorched.desc=_+1:_ El aura ardiente de Brasas hace _+1 de daño_.\n\n_+2:_ Hace _+2 de daño_.\n\n_+3:_ Hace _+3 de daño_.
actors.hero.talent.tm_big_bear.title=oso gigante
actors.hero.talent.tm_big_bear.desc=_+1:_ Brasas hace un _10% más de daño_.\n\n_+2:_ Un _20% más_.\n\n_+3:_ Un _30% más_.
actors.hero.talent.tm_bond.title=vínculo
actors.hero.talent.tm_bond.desc=_+1:_ La Domadora se cura el _10%_ del daño que hace Brasas.\n\n_+2:_ El _20%_.\n\n_+3:_ El _30%_.
actors.hero.talent.tm_resummon.title=siempre juntos
actors.hero.talent.tm_resummon.desc=_+1:_ Invocar a Brasas se recarga un _15% más rápido_.\n\n_+2:_ Un _30% más rápido_.\n\n_+3:_ Un _45% más rápido_.
actors.hero.talent.in_pyroclasm.title=piroclasto
actors.hero.talent.in_pyroclasm.desc=_+1:_ Desintegrar salpica el _33%_ de su daño a los enemigos adyacentes al objetivo y los quema.\n\n_+2:_ Salpica el _67%_.\n\n_+3:_ Salpica el _100%_.
actors.hero.talent.in_flashfire.title=llamarada
actors.hero.talent.in_flashfire.desc=_+1:_ Incinerar se recarga _2 turnos_ antes.\n\n_+2:_ _4 turnos_ antes.\n\n_+3:_ _6 turnos_ antes.
actors.hero.talent.in_heartfire.title=corazón de fuego
actors.hero.talent.in_heartfire.desc=_+1:_ Cada enemigo que muere ardiendo a la vista cura _2 PS_ a la Incendiaria.\n\n_+2:_ La cura _4 PS_.\n\n_+3:_ La cura _6 PS_.

###talentos del Carcelero
actors.hero.talent.jai_meal.title=ración del alcaide
actors.hero.talent.jai_meal.desc=_+1:_ Comer le da al Carcelero _3 de escudo_.\n\n_+2:_ Comer le da _5 de escudo_.
actors.hero.talent.jai_intuition.title=mirada de carcelero
actors.hero.talent.jai_intuition.desc=_+1:_ El Carcelero identifica armaduras _1,75 veces más rápido_.\n\n_+2:_ Las identifica _2,5 veces más rápido_.
actors.hero.talent.jai_long_chain.title=cadena larga
actors.hero.talent.jai_long_chain.desc=_+1:_ Sentencia llega _1 casilla más lejos_.\n\n_+2:_ Llega _2 casillas más lejos_.
actors.hero.talent.jai_hungry_souls.title=almas hambrientas
actors.hero.talent.jai_hungry_souls.desc=_+1:_ La probabilidad de que un enemigo deje un alma sube un _10%_.\n\n_+2:_ Sube un _20%_.
actors.hero.talent.jai_soul_mend.title=alma reparadora
actors.hero.talent.jai_soul_mend.desc=_+1:_ Cada alma recogida cura _1 PS_ al Carcelero.\n\n_+2:_ Cada alma cura _2 PS_.
actors.hero.talent.jai_heavy_lantern.title=farol pesado
actors.hero.talent.jai_heavy_lantern.desc=_+1:_ El escudo de Pasaje oscuro es un _25% mayor_.\n\n_+2:_ Es un _50% mayor_.
actors.hero.talent.jai_flay_force.title=desuello brutal
actors.hero.talent.jai_flay_force.desc=_+1:_ Desollar empuja _1 casilla más_.\n\n_+2:_ Empuja _2 casillas más_.
actors.hero.talent.jai_liquid_souls.title=elixir de almas
actors.hero.talent.jai_liquid_souls.desc=_+1:_ Al beber o lanzar una poción, el Carcelero tiene un _50%_ de probabilidad de ganar un alma.\n\n_+2:_ Siempre gana un alma.
actors.hero.talent.jai_wardens_gaze.title=mirada del alcaide
actors.hero.talent.jai_wardens_gaze.desc=_+1:_ El enemigo atrapado por Sentencia queda _vulnerable 2 turnos_.\n\n_+2:_ Queda _vulnerable 3 turnos_.
actors.hero.talent.jai_deaths_grip.title=agarre mortal
actors.hero.talent.jai_deaths_grip.desc=_+1:_ Sentencia hace un _15% más de daño_.\n\n_+2:_ Un _30% más_.\n\n_+3:_ Un _45% más_.
actors.hero.talent.jai_prison.title=prisión
actors.hero.talent.jai_prison.desc=_+1:_ La caja dura _3 turnos más_ y sus muros hacen un _20% más de daño_.\n\n_+2:_ _6 turnos más_ y un _40% más_.\n\n_+3:_ _9 turnos más_ y un _60% más_.
actors.hero.talent.sr_soul_armor.title=coraza de almas
actors.hero.talent.sr_soul_armor.desc=_+1:_ La armadura que dan las almas aumenta un _10%_.\n\n_+2:_ Aumenta un _20%_.\n\n_+3:_ Aumenta un _30%_.
actors.hero.talent.sr_reap.title=siega
actors.hero.talent.sr_reap.desc=_+1:_ Desollar cura al Segador _1 PS_ por cada enemigo golpeado.\n\n_+2:_ _2 PS_ por enemigo.\n\n_+3:_ _3 PS_ por enemigo.
actors.hero.talent.sr_soul_flame.title=llama de almas
actors.hero.talent.sr_soul_flame.desc=_+1:_ Sentencia hace _+1 de daño_ extra por cada 10 almas.\n\n_+2:_ _+2 de daño_ por cada 10 almas.\n\n_+3:_ _+3 de daño_ por cada 10 almas.
actors.hero.talent.lk_light_ward.title=luz protectora
actors.hero.talent.lk_light_ward.desc=_+1:_ Pasaje oscuro también cura _3 PS_ al Guardián y al aliado rescatado.\n\n_+2:_ Cura _6 PS_.\n\n_+3:_ Cura _9 PS_.
actors.hero.talent.lk_escape.title=escapatoria
actors.hero.talent.lk_escape.desc=_+1:_ Si no hay ningún aliado junto al farol, el Guardián se teletransporta hasta él si está a _3 casillas_ o menos.\n\n_+2:_ A _4 casillas_ o menos.\n\n_+3:_ A _5 casillas_ o menos.
actors.hero.talent.lk_box_lantern.title=caja reforzada
actors.hero.talent.lk_box_lantern.desc=_+1:_ Los muros de La caja ralentizan _1 turno más_.\n\n_+2:_ _2 turnos más_.\n\n_+3:_ _3 turnos más_.

###talentos del Púgil
actors.hero.talent.bra_meal.title=comida de campeón
actors.hero.talent.bra_meal.desc=_+1:_ Comer llena un _25%_ de las agallas del Púgil.\n\n_+2:_ Comer llena un _50%_ de sus agallas.
actors.hero.talent.bra_intuition.title=ojo de luchador
actors.hero.talent.bra_intuition.desc=_+1:_ El Púgil identifica armas cuerpo a cuerpo y armaduras _1,5 veces más rápido_.\n\n_+2:_ Las identifica _el doble de rápido_.
actors.hero.talent.bra_heavy_hands.title=manos pesadas
actors.hero.talent.bra_heavy_hands.desc=_+1:_ Nudillos hace un _1% más_ de la vida máxima del objetivo.\n\n_+2:_ Un _2% más_.
actors.hero.talent.bra_second_wind.title=segundo aire
actors.hero.talent.bra_second_wind.desc=_+1:_ La regeneración extra del Púgil al estar herido aumenta un _50%_.\n\n_+2:_ Aumenta un _100%_.
actors.hero.talent.bra_liquid_grit.title=agallas líquidas
actors.hero.talent.bra_liquid_grit.desc=_+1:_ Al beber o lanzar una poción, el Púgil llena un _20%_ de sus agallas.\n\n_+2:_ Llena un _30%_.
actors.hero.talent.bra_one_two.title=uno-dos
actors.hero.talent.bra_one_two.desc=_+1:_ El segundo puñetazo de cada par hace un _35%_ más de daño en vez de un 25%.\n\n_+2:_ Hace un _45%_ más.
actors.hero.talent.bra_stubborn.title=testarudo
actors.hero.talent.bra_stubborn.desc=_+1:_ Las agallas tardan _2 turnos más_ en empezar a desvanecerse.\n\n_+2:_ Tardan _4 turnos más_.
actors.hero.talent.bra_footwork.title=juego de piernas
actors.hero.talent.bra_footwork.desc=_+1:_ Nudillos da _1 turno de velocidad_.\n\n_+2:_ Da _2 turnos de velocidad_.
actors.hero.talent.bra_taunt.title=provocación
actors.hero.talent.bra_taunt.desc=_+1:_ Los enemigos golpeados por Rompecaras quedan _vulnerables 2 turnos_.\n\n_+2:_ Quedan _vulnerables 3 turnos_.
actors.hero.talent.bra_big_show.title=gran espectáculo
actors.hero.talent.bra_big_show.desc=_+1:_ Fin del espectáculo hace un _10% más de daño_.\n\n_+2:_ Un _20% más_.\n\n_+3:_ Un _30% más_.
actors.hero.talent.bra_grit_shield.title=coraza de agallas
actors.hero.talent.bra_grit_shield.desc=_+1:_ El escudo del Golpe demoledor es un _15% mayor_.\n\n_+2:_ Un _30% mayor_.\n\n_+3:_ Un _45% mayor_.
actors.hero.talent.pb_thick_hide.title=piel de cuero
actors.hero.talent.pb_thick_hide.desc=_+1:_ El Jefe del foso gana un _10% más_ de agallas con cada golpe recibido.\n\n_+2:_ Un _20% más_.\n\n_+3:_ Un _30% más_.
actors.hero.talent.pb_iron_jaw.title=mandíbula de hierro
actors.hero.talent.pb_iron_jaw.desc=_+1:_ Con las agallas a la mitad o más, el Jefe del foso gana _0-2 de armadura_.\n\n_+2:_ Gana _0-4 de armadura_.\n\n_+3:_ Gana _0-6 de armadura_.
actors.hero.talent.pb_haymaker.title=golpe de gracia
actors.hero.talent.pb_haymaker.desc=_+1:_ El Golpe demoledor hace un _10% más de daño_.\n\n_+2:_ Un _20% más_.\n\n_+3:_ Un _30% más_.
actors.hero.talent.sm_crowd.title=el público ruge
actors.hero.talent.sm_crowd.desc=_+1:_ El impacto de Fin del espectáculo hace el _65%_ de su daño a los enemigos de alrededor en vez del 50%.\n\n_+2:_ El _80%_.\n\n_+3:_ El _95%_.
actors.hero.talent.sm_encore.title=¡otra, otra!
actors.hero.talent.sm_encore.desc=_+1:_ Si Fin del espectáculo mata a su objetivo, su enfriamiento se reduce un _25%_.\n\n_+2:_ Se reduce un _50%_.\n\n_+3:_ Se reduce un _75%_.
actors.hero.talent.sm_flashy.title=llamativo
actors.hero.talent.sm_flashy.desc=_+1:_ Rompecaras se recarga _2 turnos_ antes.\n\n_+2:_ _4 turnos_ antes.\n\n_+3:_ _6 turnos_ antes.

