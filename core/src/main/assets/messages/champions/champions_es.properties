champions.championhooks.beheaded=¡Decapitado!

###Verdugo
champions.executioner.executionerkit.name=emblema del verdugo
champions.executioner.executionerkit.desc=Un emblema de hierro negro y tela roja, marcado por mil batallas. Mientras lo lleves encima podrás usar las técnicas del Verdugo.
champions.executioner.executioneraxe.name=hacha de verdugo
champions.executioner.executioneraxe.desc=Un hacha de una mano, pesada y algo mellada. Sus golpes dejan heridas que no paran de sangrar.
champions.executioner.decimate.name=diezmar
champions.executioner.decimate.desc=Gira el hacha y golpea a todos los enemigos %1$s. Se cura el _%2$d%%_ de la vida que le falta por cada enemigo golpeado (máximo 3).
champions.executioner.decimate.desc_short=golpea a todos los enemigos de alrededor y se cura por cada uno.
champions.executioner.decimate.radius1=adyacentes
champions.executioner.decimate.radius2=a 2 casillas o menos
champions.executioner.decimate.no_target=No hay enemigos a tu alrededor.
champions.executioner.cripplingstrike.name=golpe mutilador
champions.executioner.cripplingstrike.desc=Prepara el hacha (no gasta turno). Su siguiente golpe cuerpo a cuerpo hace un _50%% más de daño_, _lisia_ 3 turnos y añade _%d_ acumulaciones de hemorragia.
champions.executioner.cripplingstrike.desc_short=el siguiente golpe pega más, lisia y desangra.
champions.executioner.cripplingstrike$primed.name=golpe mutilador preparado
champions.executioner.cripplingstrike$primed.desc=Tu siguiente golpe cuerpo a cuerpo hará más daño, lisiará y desangrará.\n\nTurnos restantes: %s.
champions.executioner.apprehend.name=aprehender
champions.executioner.apprehend.desc=Engancha con el hacha al primer enemigo en línea, a _%1$d casillas_ o menos, y lo arrastra a su lado. Queda _lisiado %2$d turnos_.
champions.executioner.apprehend.desc_short=arrastra a un enemigo hasta el Verdugo.
champions.executioner.apprehend.prompt=Elige a quién atrapar
champions.executioner.apprehend.no_target=No hay ningún enemigo en esa línea.
champions.executioner.guillotine.name=guillotina
champions.executioner.guillotine.desc=Salta sobre un enemigo a _%1$d casillas_ o menos y le asesta un golpe que ignora la armadura: _%2$d de daño_, que sube un 20%% por cada acumulación de hemorragia (hasta _%3$d_). _Si lo mata, la Guillotina se reinicia._
champions.executioner.guillotine.desc_short=salta y remata; si mata, se reinicia.
champions.executioner.guillotine.prompt=Elige a quién ejecutar
champions.executioner.guillotine.no_target=No hay ningún enemigo ahí.
champions.executioner.guillotine.no_space=No hay sitio para saltar junto a ese enemigo.
champions.executioner.guillotine.executed=¡Ejecutado!
champions.executioner.hemorrhage.name=hemorragia
champions.executioner.hemorrhage.desc=Este personaje sangra por las heridas del Verdugo.\n\nAcumulaciones: _%1$d_ de 5\nDaño por turno: _%2$d_\nSe cura en _%3$d turnos_ si no recibe más heridas.
champions.executioner.hemorrhage$executionermight.name=¡poder del verdugo!
champions.executioner.hemorrhage$executionermight.desc=El Verdugo está desatado: sus golpes cuerpo a cuerpo hacen un 15%% más de daño y aplican la hemorragia máxima.\n\nTurnos restantes: %s.

###Explorador
champions.scout.scoutkit.name=gorro de explorador
champions.scout.scoutkit.desc=Un gorro verde de explorador con una cinta marrón. Dicen que nunca hay que subestimar el poder del código de los exploradores.
champions.scout.blowgun.name=cerbatana
champions.scout.blowgun.ac_shoot=DISPARAR
champions.scout.blowgun.prompt=Elige un objetivo
champions.scout.blowgun.desc=Una cerbatana de caña ligera. Nunca se le acaban los dardos, y todos van untados de veneno.
champions.scout.blowgun.stats=La cerbatana no se mejora directamente: se vuelve más fuerte a medida que subes de nivel. Ahora sus dardos hacen _%1$d-%2$d de daño_ (más el veneno) y requieren _%3$d de fuerza_.
champions.scout.blowgun$blowdart.name=dardo venenoso
champions.scout.blowgun$blowdart.desc=Un dardo diminuto con la punta morada.
champions.scout.blindingdart.name=dardo cegador
champions.scout.blindingdart.desc=Dispara un dardo a un enemigo a 6 casillas o menos: hace _%1$d-%2$d de daño_ y lo _ciega %3$d turnos_.
champions.scout.blindingdart.desc_bounce=Rebota a _%d_ enemigo(s) más cercano(s).
champions.scout.blindingdart.desc_short=daña y ciega a un enemigo a distancia.
champions.scout.blindingdart.prompt=Elige un objetivo
champions.scout.blindingdart.no_target=No hay ningún enemigo en esa línea.
champions.scout.movequick.name=paso ligero
champions.scout.movequick.desc=Echa a correr: gana _%d turnos de velocidad_. No gasta turno ni rompe el camuflaje.
champions.scout.movequick.desc_short=gana velocidad sin gastar turno.
champions.scout.toxicshot.name=disparo tóxico
champions.scout.toxicshot.desc=_Pasiva._ Cada golpe del Explorador, cuerpo a cuerpo o a distancia, _envenena %d turnos_ al enemigo.
champions.scout.toxicshot.desc_short=sus golpes envenenan.
champions.scout.noxioustrap.name=trampa nociva
champions.scout.noxioustrap.desc=Planta una seta venenosa a _%1$d casillas_ o menos. Los aliados pueden pisarla sin peligro; cuando la pisa un enemigo explota, dañando, envenenando y lisiando a los enemigos cercanos.\n\nSetas: _%2$d de %3$d_. Recupera una cada _%4$d turnos_.
champions.scout.noxioustrap.desc_short=planta setas que explotan con los enemigos.
champions.scout.noxioustrap.prompt=Elige dónde plantar la seta
champions.scout.noxioustrap.no_charges=sin setas
champions.scout.noxioustrap.bad_cell=No se puede plantar una seta ahí.
champions.scout.noxioustrap$charges.name=setas
champions.scout.noxioustrap$charges.desc=Setas venenosas listas para plantar: _%1$d de %2$d_.
champions.scout.noxiousshroom.name=seta venenosa
champions.scout.noxiousshroom.desc=Una seta morada con motas, plantada por el Explorador. Explotará en una nube de veneno cuando la pise un enemigo; los aliados pueden pisarla sin problema.
champions.scout.camouflage.name=camuflaje
champions.scout.camouflage.desc=El Explorador se ha quedado tan quieto que nadie lo ve.\n\nLos enemigos no pueden verlo mientras no se mueva ni ataque.
champions.scout.camouflage$ambush.name=emboscada
champions.scout.camouflage$ambush.desc=El siguiente golpe del Explorador hará daño extra.\n\nTurnos restantes: %s.

###Piromante
champions.pyromancer.pyromancerkit.name=peluche de Brasas
champions.pyromancer.pyromancerkit.desc=Un osito de peluche remendado, con un botón por ojo. Está calentito... demasiado calentito.
champions.pyromancer.disintegrate.name=desintegrar
champions.pyromancer.disintegrate.desc=Lanza una bola de fuego a un enemigo a 6 casillas o menos: _%1$d-%2$d de daño_. _Si lo mata, no gasta el enfriamiento._
champions.pyromancer.disintegrate.desc_short=bola de fuego; si mata, se recupera al instante.
champions.pyromancer.disintegrate.prompt=Elige un objetivo
champions.pyromancer.disintegrate.no_target=No hay ningún enemigo en esa línea.
champions.pyromancer.disintegrate.refund=¡Recargado!
champions.pyromancer.incinerate.name=incinerar
champions.pyromancer.incinerate.desc=Lanza un cono de fuego de _%1$d casillas_ y _%2$d°_ que hace _%3$d-%4$d de daño_ e incendia a los enemigos. No daña a los aliados.
champions.pyromancer.incinerate.desc_short=cono de fuego que quema a los enemigos.
champions.pyromancer.incinerate.prompt=Elige la dirección del fuego
champions.pyromancer.moltenshield.name=escudo fundido
champions.pyromancer.moltenshield.desc=Envuelve en llamas a la Piromante o a un aliado a 4 casillas o menos: gana _%1$d de escudo_ y, durante 6 turnos, quien lo golpee cuerpo a cuerpo recibe _%2$d de daño_ y arde.
champions.pyromancer.moltenshield.desc_short=escudo de fuego para ella o un aliado.
champions.pyromancer.moltenshield.prompt=Elige a quién proteger (o a ti misma)
champions.pyromancer.moltenshield$burnback.name=escudo fundido
champions.pyromancer.moltenshield$burnback.desc=Un escudo de llamas rodea a este personaje. Quien lo golpee cuerpo a cuerpo recibirá %1$d de daño y arderá.\n\nTurnos restantes: %2$s.
champions.pyromancer.summonbear.name=¡Brasas!
champions.pyromancer.summonbear.desc=Hace caer a Brasas a _%1$d casillas_ o menos: el impacto hace _%2$d-%3$d de daño_ e incendia a los enemigos alrededor. Brasas (_%4$d PS_) lucha a su lado 30 turnos y quema a los enemigos que tiene al lado. Mientras viva, usar esta habilidad le indica a dónde ir o a quién atacar.
champions.pyromancer.summonbear.desc_tamer=La Domadora lo mantiene hasta que lo derroten.
champions.pyromancer.summonbear.desc_short=invoca a un oso de fuego que lucha con ella.
champions.pyromancer.summonbear.prompt=Elige dónde (o, si ya está, a dónde va Brasas)
champions.pyromancer.summonbear.no_space=No hay sitio para Brasas ahí.
champions.pyromancer.emberbear.name=Brasas
champions.pyromancer.emberbear.desc=Un oso enorme hecho de peluche, remiendos y fuego vivo. Quema a todos los enemigos que tiene al lado: _%d de daño_ por turno.
champions.pyromancer.emberbear.desc_time=Se desvanecerá en %d turnos.
champions.pyromancer.emberbear.desc_forever=Se quedará hasta que lo derroten.
champions.pyromancer.emberbear.fades=Brasas se apaga y vuelve a ser un peluche.
champions.pyromancer.emberbear.direct_defend=Brasas va hacia allí.
champions.pyromancer.emberbear.direct_follow=Brasas te seguirá.
champions.pyromancer.emberbear.direct_attack=¡Brasas atacará!
champions.pyromancer.pyromania.name=piromanía
champions.pyromancer.pyromania.charged=¡Piromanía!
champions.pyromancer.pyromania.desc=Después de usar %1$d habilidades, la siguiente habilidad que haga daño aturde a sus objetivos.\n\nAcumulaciones: _%2$d de %3$d_.\n\nLa Piromante además resiste el fuego.
champions.pyromancer.pyromania.desc_charged=_¡Lista!_ Tu siguiente habilidad que haga daño aturdirá.

###Carcelero
champions.jailer.jailerkit.name=farol del carcelero
champions.jailer.jailerkit.desc=Un farol de hierro oscuro. Dentro, una luz verde se agita como si estuviera llena de algo vivo.
champions.jailer.chainsickle.name=hoz con cadena
champions.jailer.chainsickle.desc=Una hoz unida a una cadena larga. Alcanza a enemigos a 2 casillas, aunque pega un poco menos que una espada.
champions.jailer.soul.name=alma
champions.jailer.soul.desc=Un alma en pena que flota, esperando a que el Carcelero la recoja en su farol.
champions.jailer.soul.not_jailer=Solo el Carcelero puede recoger las almas.
champions.jailer.deathsentence.name=sentencia
champions.jailer.deathsentence.desc=Lanza la hoz encadenada: el primer enemigo en línea a _%1$d casillas_ o menos recibe _%2$d-%3$d de daño_, es arrastrado a su lado y queda lisiado 2 turnos.
champions.jailer.deathsentence.desc_short=engancha a un enemigo y lo arrastra.
champions.jailer.deathsentence.prompt=Elige a quién sentenciar
champions.jailer.deathsentence.no_target=No hay ningún enemigo en esa línea.
champions.jailer.darkpassage.name=pasaje oscuro
champions.jailer.darkpassage.desc=Lanza el farol a una casilla a _%1$d casillas_ o menos. Si hay un aliado ahí o al lado (¡como tu compañero!), es arrastrado junto al Carcelero. Los dos ganan _%2$d de escudo_.
champions.jailer.darkpassage.desc_short=trae a un aliado a tu lado y os protege.
champions.jailer.darkpassage.prompt=Elige dónde lanzar el farol
champions.jailer.darkpassage.rescued=¡El farol rescata a %s!
champions.jailer.flay.name=desollar
champions.jailer.flay.desc=Barre a su alrededor con la cadena: los enemigos adyacentes reciben _%1$d-%2$d de daño_, salen despedidos _%3$d casillas_ y quedan lisiados 2 turnos.
champions.jailer.flay.desc_short=golpea y aparta a los enemigos de alrededor.
champions.jailer.flay.no_target=No hay enemigos a tu alrededor.
champions.jailer.thebox.name=la caja
champions.jailer.thebox.desc=Levanta un cuadrado de muros espectrales a 2 casillas que dura _%1$d turnos_. Cada enemigo que pise un muro lo rompe, recibe _%2$d de daño_ y queda _ralentizado %3$d turnos_.
champions.jailer.thebox.desc_short=encierra a los enemigos con muros que dañan y ralentizan.
champions.jailer.thebox$soulwall.desc=Un muro de almas en pena. Los enemigos que lo crucen lo romperán, pero sufrirán por ello.
champions.jailer.damnation.name=condenación
champions.jailer.damnation.soul=¡Alma! (%d)
champions.jailer.damnation.desc=Almas recogidas: _%1$d_.\n\nArmadura extra: _0-%2$d_ (1 por cada 4 almas).\nDaño extra de las habilidades: _+%3$d_ (1 por cada 10 almas).

###Púgil
champions.brawler.brawlerkit.name=cinturón de campeón
champions.brawler.brawlerkit.desc=Un cinturón dorado, ganado a puñetazos en el foso. Pesa más de lo que parece.
champions.brawler.brassknuckles.name=nudilleras de latón
champions.brawler.brassknuckles.desc=Unas nudilleras doradas, gastadas de tanto usarlas. Convierten cada puñetazo en un golpe serio.
champions.brawler.knuckledown.name=nudillos
champions.brawler.knuckledown.desc=Se prepara (no gasta turno): sus dos siguientes puñetazos hacen daño extra igual a _1 + %1$d%%_ de la vida máxima del objetivo (la mitad contra jefes).
champions.brawler.knuckledown.desc_short=dos puñetazos con daño según la vida del enemigo.
champions.brawler.knuckledown$knuckles.name=nudillos
champions.brawler.knuckledown$knuckles.desc=Los próximos %1$d puñetazos harán daño extra.\n\nTurnos restantes: %2$s.
champions.brawler.haymaker.name=golpe demoledor
champions.brawler.haymaker.desc=Suelta todas sus agallas en un puñetazo enorme: los enemigos en un cono de _%1$d casillas_ reciben _%2$d-%3$d de daño_ más la mitad de las agallas (_%4$d_ ahora), un 50%% más en la línea central. Luego gana un escudo del _%5$d%%_ de las agallas gastadas.
champions.brawler.haymaker.desc_short=convierte las agallas en daño y escudo.
champions.brawler.haymaker.prompt=Elige la dirección del golpe
champions.brawler.facebreaker.name=rompecaras
champions.brawler.facebreaker.desc=Agarra a todos los enemigos a _%1$d casillas_ o menos y los estrella entre sí: _%2$d-%3$d de daño_. Si había enemigos _a ambos lados_, todos quedan _aturdidos 2 turnos_; si no, lisiados.
champions.brawler.facebreaker.desc_short=junta a los enemigos; aturde si están a ambos lados.
champions.brawler.facebreaker.no_target=No hay enemigos cerca.
champions.brawler.showstopper.name=fin del espectáculo
champions.brawler.showstopper.desc=Salta sobre un enemigo a _%1$d casillas_ o menos, lo agarra y lo estrella contra el suelo: _%2$d de daño_ más el 15%% de su vida máxima (5%% contra jefes), y queda aturdido 1 turno. Los enemigos de alrededor reciben el _%3$d%%_ del daño base.
champions.brawler.showstopper.desc_short=agarra a un enemigo y lo estrella contra el suelo.
champions.brawler.showstopper.prompt=Elige a quién estrellar
champions.brawler.showstopper.no_target=No hay ningún enemigo ahí.
champions.brawler.showstopper.no_space=No hay sitio para saltar junto a ese enemigo.
champions.brawler.pitgrit.name=agallas
champions.brawler.pitgrit.desc=El Púgil convierte el daño que recibe en agallas, que su Golpe demoledor transforma en daño y escudo. Se desvanecen poco a poco tras unos turnos sin recibir golpes.\n\nAgallas: _%1$d de %2$d_.\n\nCada segundo puñetazo pega más fuerte, y cuanto más herido está, más rápido se cura.

###armaduras de clase
items.armor.executionerarmor.name=armadura del verdugo
items.armor.executionerarmor.desc=Mientras lleve esta armadura, el Verdugo puede realizar una habilidad especial.
items.armor.scoutarmor.name=armadura del explorador
items.armor.scoutarmor.desc=Mientras lleve esta armadura, el Explorador puede realizar una habilidad especial.
items.armor.pyromancerarmor.name=túnica de la piromante
items.armor.pyromancerarmor.desc=Mientras lleve esta túnica, la Piromante puede realizar una habilidad especial.
items.armor.jailerarmor.name=armadura del carcelero
items.armor.jailerarmor.desc=Mientras lleve esta armadura, el Carcelero puede realizar una habilidad especial.
items.armor.brawlerarmor.name=chaleco del púgil
items.armor.brawlerarmor.desc=Mientras lleve este chaleco, el Púgil puede realizar una habilidad especial.
