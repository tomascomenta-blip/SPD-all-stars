#Forjador (es)

###clase
actors.hero.heroclass.forger=forjador
actors.hero.heroclass.forger_desc_short=El _Forjador_ es un tanque que aguanta en primera línea, abre grietas de magma y embiste. Deja a los enemigos _quebradizos_ y, además, _forja_ el equipo de sus aliados.
actors.hero.heroclass.forger_desc=Un herrero enano que no abandonó su fragua cuando cayó la Metrópolis; sus martillazos aún resuenan bajo las cuevas. El Forjador empieza con un _medallón del yunque_, que le da _Grieta volcánica_, _Aliento de fuelle_, _Embestida_ y la _Llamada del dios de la forja_ (desde el nivel 6).\n\nSu pasiva, la _fragua viviente_, le da algo más de armadura natural y le permite _forjar_ una vez por piso el arma o la armadura de un aliado adyacente (o la suya): gana _+1 de mejora_ hasta que el grupo baje de piso. Se usa desde la ventana de habilidades.\n\nTambién empieza con un _martillo de forja_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de velocidad\n_-_ Pergaminos de furia
actors.hero.heroclass.forger_unlock=Los campeones están desbloqueados desde el principio.

###subclases
actors.hero.herosubclass.mastersmith=maestro herrero
actors.hero.herosubclass.mastersmith_short_desc=El _Maestro herrero_ forja dos veces por piso, y sus talentos hacen que cada forja valga más.
actors.hero.herosubclass.mastersmith_desc=Puede _forjar dos veces_ por piso (la misma pieza o dos distintas), y cada forja suma _+1 nivel_ a lo forjado hasta que el grupo baje de piso.
actors.hero.herosubclass.livingmountain=montaña viva
actors.hero.herosubclass.livingmountain_short_desc=La _Montaña viva_ tiene más vida y se protege cada vez que rompe a un enemigo quebradizo.
actors.hero.herosubclass.livingmountain_desc=Gana un _15% más de vida máxima_. Cuando su golpe rompe a un enemigo _quebradizo_, gana un _escudo_ de 2 puntos más 1 por cada 3 niveles.

###talentos del Forjador
actors.hero.talent.for_meal.title=ración de fragua
actors.hero.talent.for_meal.desc=_+1:_ Comer reinicia el enfriamiento de _Grieta volcánica_.\n\n_+2:_ Además, comer le da al Forjador un _escudo_ de 3 puntos más la mitad de su nivel.
actors.hero.talent.for_intuition.title=ojo de herrero
actors.hero.talent.for_intuition.desc=_+1:_ El Forjador identifica armas cuerpo a cuerpo y armaduras _1,75 veces más rápido_.\n\n_+2:_ Las identifica _2,5 veces más rápido_.
actors.hero.talent.for_thick_plates.title=piel de yunque
actors.hero.talent.for_thick_plates.desc=_+1:_ El Forjador gana _1-2 de armadura_ extra.\n\n_+2:_ Gana _2-4 de armadura_ extra.
actors.hero.talent.for_heavy_hammer.title=martillazo
actors.hero.talent.for_heavy_hammer.desc=_+1:_ Sus golpes cuerpo a cuerpo hacen un _10% más de daño_.\n\n_+2:_ Hacen un _20% más de daño_.
actors.hero.talent.for_liquid_forge.title=fragua líquida
actors.hero.talent.for_liquid_forge.desc=_+1:_ Al beber o lanzar una poción, los enfriamientos del Forjador se reducen _3 turnos_.\n\n_+2:_ Se reducen _5 turnos_.
actors.hero.talent.for_long_rift.title=grieta larga
actors.hero.talent.for_long_rift.desc=_+1:_ La _Grieta volcánica_ es _1 casilla_ más larga.\n\n_+2:_ Es _2 casillas_ más larga.
actors.hero.talent.for_wide_bellows.title=fuelle ancho
actors.hero.talent.for_wide_bellows.desc=_+1:_ El _Aliento de fuelle_ llega _1 casilla_ más lejos y abre el cono _15 grados_.\n\n_+2:_ Llega _2 casillas_ más lejos y abre el cono _30 grados_.
actors.hero.talent.for_long_charge.title=carga larga
actors.hero.talent.for_long_charge.desc=_+1:_ La _Embestida_ recorre _1 casilla_ más.\n\n_+2:_ Recorre _2 casillas_ más.
actors.hero.talent.for_temper.title=temple
actors.hero.talent.for_temper.desc=_+1:_ Cuando el Forjador forja, quien recibe la forja gana un _escudo_ de 4 puntos más 1 por cada 3 niveles.\n\n_+2:_ El escudo es de 8 puntos más 1 por cada 3 niveles.
actors.hero.talent.for_ram_horns.title=cuernos de carnero
actors.hero.talent.for_ram_horns.desc=_+1:_ El carnero de la _Llamada del dios de la forja_ hace un _20% más de daño_ y ralentiza _1 turno_ más.\n\n_+2:_ _40% más_ de daño y _2 turnos_ más.\n\n_+3:_ _60% más_ de daño y _3 turnos_ más.
actors.hero.talent.for_fire_pillars.title=pilares ardientes
actors.hero.talent.for_fire_pillars.desc=_+1:_ Los pilares de magma de la Grieta duran _2 turnos_ más, y la onda de la Embestida hace un _20% más de daño_ si rompe un pilar.\n\n_+2:_ _4 turnos_ más y _40% más_ de daño.\n\n_+3:_ _6 turnos_ más y _60% más_ de daño.
actors.hero.talent.ms_fine_temper.title=temple fino
actors.hero.talent.ms_fine_temper.desc=_+1:_ Cada vez que forja, todos los enfriamientos del Forjador se reducen _3 turnos_.\n\n_+2:_ Se reducen _6 turnos_.\n\n_+3:_ Se reducen _9 turnos_.
actors.hero.talent.ms_quick_anvil.title=yunque veloz
actors.hero.talent.ms_quick_anvil.desc=_+1:_ Forjar gasta un _40% menos_ de tiempo.\n\n_+2:_ Un _80% menos_.\n\n_+3:_ Un _90% menos_: casi no gasta turno.
actors.hero.talent.ms_molten_gift.title=don fundido
actors.hero.talent.ms_molten_gift.desc=_+1:_ Un arma forjada hace un _10% más de daño_ hasta que el grupo baje de piso.\n\n_+2:_ Hace un _20% más_.\n\n_+3:_ Hace un _30% más_.
actors.hero.talent.lm_stone_skin.title=piel de roca
actors.hero.talent.lm_stone_skin.desc=_+1:_ El escudo que gana al romper a un enemigo quebradizo es _2 puntos_ mayor.\n\n_+2:_ _4 puntos_ mayor.\n\n_+3:_ _6 puntos_ mayor.
actors.hero.talent.lm_quake.title=temblor
actors.hero.talent.lm_quake.desc=_+1:_ La onda de la _Embestida_ deja _quebradizos_ a los enemigos durante _6 turnos_.\n\n_+2:_ Durante _9 turnos_.\n\n_+3:_ Durante _12 turnos_.
actors.hero.talent.lm_granite_heart.title=corazón de granito
actors.hero.talent.lm_granite_heart.desc=_+1:_ Mientras tiene un escudo, gana _1-2 de armadura_ extra.\n\n_+2:_ Gana _2-4 de armadura_ extra.\n\n_+3:_ Gana _3-6 de armadura_ extra.
actors.hero.talent.fer_wide_crater.title=cráter ancho
actors.hero.talent.fer_wide_crater.desc=La onda de la _Erupción de la forja_ hace un _15% más de daño_ por cada punto.
actors.hero.talent.fer_dense_magma.title=magma denso
actors.hero.talent.fer_dense_magma.desc=Los pilares de magma del Forjador (los de la Erupción y los de la Grieta volcánica) duran _2 turnos más_ por cada punto.
actors.hero.talent.fer_seismic.title=onda sísmica
actors.hero.talent.fer_seismic.desc=Los enemigos alcanzados por la onda de la Erupción quedan _quebradizos_ _3 turnos_ por cada punto.
actors.hero.talent.gua_deep_sands.title=arenas profundas
actors.hero.talent.gua_deep_sands.desc=La _Tumba de arena_ inmoviliza _1 turno_ más y debilita _2 turnos_ más por cada punto.
actors.hero.talent.gua_thirsty_tomb.title=tumba sedienta
actors.hero.talent.gua_thirsty_tomb.desc=El Guardián se cura un _3% de su vida máxima_ por cada punto y por cada enemigo enterrado (hasta 3 enemigos).
actors.hero.talent.gua_ages.title=siglos de arena
actors.hero.talent.gua_ages.desc=La _Tumba de arena_ hace un _20% más de daño_ por cada punto.
actors.hero.talent.bar_encore.title=bis
actors.hero.talent.bar_encore.desc=La _Gran obertura_ encanta a los enemigos _1 turno más_ por cada punto.
actors.hero.talent.bar_echo.title=eco
actors.hero.talent.bar_echo.desc=La _Gran obertura_ da a cada aliado un _escudo_ de 2 puntos más 1 por cada 3 niveles, multiplicado por los puntos.
actors.hero.talent.bar_ovation.title=ovación
actors.hero.talent.bar_ovation.desc=La _Gran obertura_ da _2 turnos_ más de velocidad y reduce _4 turnos_ los enfriamientos de las habilidades de cada aliado, por cada punto.

###objetos
champions.forger.forgerkit.name=medallón del yunque
champions.forger.forgerkit.desc=Un medallón de hierro con un yunque grabado y dos cuernos de carnero a los lados. Aún está tibio, como si lo acabaran de sacar de la fragua. Mientras lo lleves encima podrás usar las técnicas del Forjador.
champions.forger.forgehammer.name=martillo de forja
champions.forger.forgehammer.desc=Un martillo de herrero de cabeza cuadrada y mango corto, ennegrecido por el hollín. No es un arma fina, pero aplasta.
items.armor.forgerarmor.name=armadura del forjador
items.armor.forgerarmor.desc=Mientras lleve esta armadura, el Forjador puede realizar una habilidad especial.

###pasiva
champions.forger.livingforge.name=fragua viviente
champions.forger.livingforge.desc=Forjas por piso: _%d_. Elige a tu héroe o a un aliado adyacente y el arma o la armadura que prefieras gana _+1 nivel_ hasta que el grupo baje de piso.
champions.forger.livingforge.prompt=Elige a quién forjar (tú o un aliado adyacente)
champions.forger.livingforge.choose=¿Qué quieres forjar?
champions.forger.livingforge.none=(nada equipado)
champions.forger.livingforge.no_uses=Ya has forjado todo lo que podías en este piso.
champions.forger.livingforge.no_target=Ahí no hay nadie a quien forjar.
champions.forger.livingforge.nothing=No tiene nada equipado que forjar.
champions.forger.livingforge.forged=¡Forjado!
champions.forger.livingforge.forged_weapon=El Forjador forja el arma de %s: +1 nivel hasta que bajéis de piso.
champions.forger.livingforge.forged_armor=El Forjador forja la armadura de %s: +1 nivel hasta que bajéis de piso.
champions.forger.livingforge$boost.name=equipo forjado
champions.forger.livingforge$boost.desc=Tu arma sube _%1$d_ niveles y tu armadura _%2$d_ hasta que el grupo baje de piso.
champions.forger.brittle.name=quebradizo
champions.forger.brittle.desc=El siguiente golpe que reciba de _cualquier héroe_ lo _aturde_ y le hace _%1$d de daño extra_.\n\nTurnos restantes: %2$s.
champions.forger.brittle.shattered=¡Quebrado!
champions.forger.magmapillar.desc=Un pilar de magma tapa el paso. Se desmorona solo con el tiempo, o se rompe de un buen golpe.

###habilidades
champions.forger.magmarift.name=grieta volcánica
champions.forger.magmarift.desc=Abre una grieta en línea de _%1$d casillas_ que quema a los enemigos que cruza (_%2$d-%3$d de daño_). Al final deja un _pilar de magma_ que tapa esa casilla durante _%4$d turnos_.
champions.forger.magmarift.desc_short=una grieta de magma en línea que deja un pilar al final.
champions.forger.magmarift.prompt=Elige hacia dónde abrir la grieta
champions.forger.magmarift.bad_cell=No hay sitio para la grieta.
champions.forger.bellowsbreath.name=aliento de fuelle
champions.forger.bellowsbreath.desc=Sopla fuego en un cono de _%1$d casillas_ y _%2$d grados_ (_%3$d-%4$d de daño_). Los enemigos alcanzados quedan _quebradizos_ durante _%6$d turnos_: el siguiente golpe que reciban de _cualquier héroe_ los _aturde_ y les hace _%5$d de daño extra_.
champions.forger.bellowsbreath.desc_short=fuego en cono que deja a los enemigos quebradizos.
champions.forger.bellowsbreath.prompt=Elige hacia dónde soplar
champions.forger.onslaught.name=embestida
champions.forger.onslaught.desc=Carga hasta _%1$d casillas_ en línea recta: los enemigos que cruza reciben _%2$d-%3$d de daño_ y son empujados por delante. Si choca con una pared, un pilar o algo que no puede empujar, una _onda_ de _%4$d casillas_ hace _%5$d-%6$d de daño_ y _derriba_ (aturde) todo lo de alrededor, y rompe los pilares junto al impacto. Cada embestida da un _escudo de %7$d_.
champions.forger.onslaught.desc_short=carga que empuja enemigos; si choca, una onda los derriba.
champions.forger.onslaught.prompt=Elige hacia dónde embestir
champions.forger.onslaught.no_room=No hay sitio para embestir.
champions.forger.godscall.name=llamada de la forja
champions.forger.godscall.desc=Un _carnero de fuego_ aparece a unas _%1$d casillas_, junto al enemigo más cercano que veas, y corre en línea hacia el Forjador: cada enemigo que roza recibe _%2$d-%3$d de daño_ y queda _ralentizado %4$d turnos_.\n\nSi vuelves a usar la R mientras pasa a _%5$d casillas_ o menos, lo devuelves de un _cabezazo_: todo lo que hay en la línea recibe daño, queda _aturdido %6$d turnos_ y _quebradizo_.
champions.forger.godscall.desc_short=un carnero de fuego embiste en línea; puedes devolverlo de un cabezazo.
champions.forger.godscall.far=el carnero está lejos
champions.forger.godscall.no_target=No hay ningún enemigo a la vista.
champions.forger.godscall.no_room=No hay sitio para llamar al carnero.
champions.forger.godscall.summoned=¡Un carnero de fuego embiste hacia el Forjador!
champions.forger.godscall.headbutt=¡El Forjador devuelve el carnero de un cabezazo!
champions.forger.godscall$ramrun.name=carnero de fuego
champions.forger.godscall$ramrun.desc=Un carnero de fuego corre hacia el Forjador. Le quedan _%d pasos_. Si pasa cerca, usa la R para devolverlo de un cabezazo.

###habilidad de armadura
champions.forger.forgeeruption.name=erupción de la forja
champions.forger.forgeeruption.short_desc=La forja entra en erupción alrededor del Forjador: una _onda_ que daña y derriba, y un anillo de _pilares de magma_.
champions.forger.forgeeruption.desc=La forja entra en erupción: una onda de choque de 2 casillas hace _5-10 de daño_ (más según la fuerza) y _derriba_ (aturde 3 turnos) a los enemigos de alrededor. Luego se levanta un anillo de _pilares de magma_ a 3 casillas, con cuatro huecos para salir, que dura 12 turnos. Los pilares se rompen con la Embestida.
