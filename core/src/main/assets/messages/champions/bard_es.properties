#Bard (es)

###clase
actors.hero.heroclass.bard=bardo
actors.hero.heroclass.bard_desc_short=El _Bardo_ pelea cantando: llena de _valor_ a sus aliados, duerme a los enemigos, cura a todo el grupo y, con su _Gran final_, regala un turno extra a cada héroe.
actors.hero.heroclass.bard_desc=Un músico ambulante que cantaba en las tabernas de la ciudad las hazañas de quienes bajaban a la mazmorra, hasta que decidió bajar con ellos. El Bardo empieza con un _laúd_, que le da cuatro canciones: _Balada de valor_, _Canción de cuna_, _Himno sanador_ y el _Gran final_ (desde el nivel 6). Sus canciones también alcanzan a su compañero y a sus aliados: es el apoyo del grupo.\n\nSu pasiva, el _estribillo_, suma una nota con cada canción. Con 3 notas, la siguiente canción sale en _Fortissimo_ y es mucho más fuerte.\n\nTambién empieza con una _daga_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de curación\n_-_ Pergaminos de canción de cuna
actors.hero.heroclass.bard_unlock=Los campeones están desbloqueados desde el principio.

###subclases
actors.hero.herosubclass.troubadour=trovador
actors.hero.herosubclass.troubadour_short_desc=El _Trovador_ canta para proteger: su Himno se recarga antes y cura más, y su Balada llega más lejos.
actors.hero.herosubclass.troubadour_desc=Himno sanador se recarga un _30% más rápido_ y cura un _20% más_.\n\nBalada de valor alcanza _2 casillas más_.
actors.hero.herosubclass.minstrel=juglar
actors.hero.herosubclass.minstrel_short_desc=El _Juglar_ canta para pelear: duerme a los enemigos más a menudo y pega más fuerte a los indefensos.
actors.hero.herosubclass.minstrel_desc=Canción de cuna se recarga un _30% más rápido_.\n\nSus golpes hacen un _20% más de daño_ a los enemigos dormidos, paralizados o ralentizados.

###talentos
actors.hero.talent.bar_meal.title=merienda del bardo
actors.hero.talent.bar_meal.desc=_+1:_ Comer suma _1 nota_ al estribillo del Bardo.\n\n_+2:_ Comer suma _2 notas_.
actors.hero.talent.bar_intuition.title=oído fino
actors.hero.talent.bar_intuition.desc=_+1:_ El Bardo identifica anillos _1,75 veces más rápido_.\n\n_+2:_ Los identifica _2,5 veces más rápido_.
actors.hero.talent.bar_loud_voice.title=vozarrón
actors.hero.talent.bar_loud_voice.desc=_+1:_ Balada de valor alcanza _1 casilla más_ y Canción de cuna se puede cantar _1 casilla más lejos_.\n\n_+2:_ _2 casillas más_ y _2 casillas más lejos_.
actors.hero.talent.bar_applause.title=aplausos
actors.hero.talent.bar_applause.desc=_+1:_ Por cada héroe o aliado al que llega una canción (él incluido), el Bardo se cura _1 PS_.\n\n_+2:_ Se cura _2 PS_ por cada uno.
actors.hero.talent.bar_liquid_music.title=música líquida
actors.hero.talent.bar_liquid_music.desc=_+1:_ Beber o lanzar una poción reduce _3 turnos_ los enfriamientos del Bardo.\n\n_+2:_ Los reduce _5 turnos_.
actors.hero.talent.bar_deep_sleep.title=sueño profundo
actors.hero.talent.bar_deep_sleep.desc=_+1:_ Canción de cuna duerme a los enemigos _2 turnos más_.\n\n_+2:_ _4 turnos más_.
actors.hero.talent.bar_soothing.title=voz sanadora
actors.hero.talent.bar_soothing.desc=_+1:_ Himno sanador cura un _25% más_.\n\n_+2:_ Cura un _50% más_.
actors.hero.talent.bar_rally.title=arenga
actors.hero.talent.bar_rally.desc=_+1:_ Balada de valor también da _1 de escudo_ (más 1 por cada 4 niveles del Bardo) a todos los que alcanza.\n\n_+2:_ El doble de escudo.
actors.hero.talent.bar_tempo.title=tempo
actors.hero.talent.bar_tempo.desc=_+1:_ Gran final también da _3 turnos de velocidad_ a los héroes.\n\n_+2:_ _5 turnos de velocidad_.
actors.hero.talent.bar_virtuoso.title=virtuoso
actors.hero.talent.bar_virtuoso.desc=_+1:_ Las canciones en Fortissimo son un _75% más fuertes_ en vez de un 50%.\n\n_+2:_ Son un _100% más fuertes_.\n\n_+3:_ Son un 100% más fuertes y solo necesitan _2 notas_.
actors.hero.talent.bar_duet.title=dúo
actors.hero.talent.bar_duet.desc=_+1:_ Una canción que alcanza a otro héroe o a un aliado es un _15% más fuerte_.\n\n_+2:_ Un _30% más fuerte_.\n\n_+3:_ Un _45% más fuerte_.
actors.hero.talent.tb_anthem.title=himno de batalla
actors.hero.talent.tb_anthem.desc=_+1:_ Balada de valor dura _3 turnos más_.\n\n_+2:_ _6 turnos más_.\n\n_+3:_ _9 turnos más_.
actors.hero.talent.tb_life_song.title=canción de vida
actors.hero.talent.tb_life_song.desc=_+1:_ Himno sanador también cura, a lo largo de los 10 turnos siguientes, _1 PS_ (más 1 por cada 3 niveles del Trovador).\n\n_+2:_ El doble.\n\n_+3:_ El triple.
actors.hero.talent.tb_harmony.title=armonía
actors.hero.talent.tb_harmony.desc=_+1:_ Cada canción quita _1 efecto negativo_ a cada héroe o aliado que alcanza (Himno sanador, uno más).\n\n_+2:_ _2 efectos negativos_.\n\n_+3:_ _Todos_ los efectos negativos.
actors.hero.talent.mi_dissonance.title=disonancia
actors.hero.talent.mi_dissonance.desc=_+1:_ Las canciones hacen _1 de daño_ (más 1 por cada 4 niveles del Juglar) a los enemigos de su zona: los que están al alcance de Balada de valor, los que duerme Canción de cuna (antes de que se duerman) y los que están a 3 casillas o menos en Himno sanador.\n\n_+2:_ El doble de daño.\n\n_+3:_ El triple de daño.
actors.hero.talent.mi_rude_awakening.title=despertar brusco
actors.hero.talent.mi_rude_awakening.desc=_+1:_ Los enemigos dormidos por Canción de cuna reciben _2 de daño_ (más 1 por cada 3 niveles del Juglar) cuando algo los despierta.\n\n_+2:_ El doble de daño.\n\n_+3:_ El triple de daño.
actors.hero.talent.mi_crescendo.title=crescendo
actors.hero.talent.mi_crescendo.desc=_+1:_ Gran final hace _2 de daño_ (más 1 por cada 2 niveles del Juglar) a los enemigos a la vista y los ralentiza _1 turno más_.\n\n_+2:_ El doble de daño y _2 turnos más_.\n\n_+3:_ El triple de daño y _3 turnos más_.

###laúd y canciones
champions.bard.bardkit.name=laúd del bardo
champions.bard.bardkit.desc=Un laúd muy gastado, con alguna cuerda remendada. En buenas manos, cada acorde da valor a los amigos y sueño a los enemigos.
champions.bard.bardsong.desc_dissonance=La disonancia hace _%d de daño_ a los enemigos de su zona.
champions.bard.bardsong.forte_ready=_¡El Fortissimo está listo!_

champions.bard.ballad.name=balada de valor
champions.bard.ballad.desc=Canta para los héroes y aliados a _%1$d casillas_ o menos (el Bardo incluido): quedan _bendecidos_ durante _%2$d turnos_, y los héroes ganan además _Valor_ (_+%3$d%% de daño_) el mismo tiempo.
champions.bard.ballad.desc_rally=También ganan _%d de escudo_.
champions.bard.ballad.desc_short=bendice al grupo y le da más daño.
champions.bard.ballad.desc_forte=_Fortissimo:_ todo dura un _%1$d%%_ más.
champions.bard.ballad$valor.name=valor
champions.bard.ballad$valor.desc=Una canción heroica todavía resuena en los oídos de este personaje.\n\nSus ataques hacen un _%1$d%% más de daño_.\n\nTurnos de valor restantes: %2$d.

champions.bard.lullaby.name=canción de cuna
champions.bard.lullaby.desc=Canta hacia una casilla a _%1$d casillas_ o menos: los enemigos que están en ella y a su alrededor caen en un _sueño mágico_ durante _%2$d turnos_ (cualquier daño los despierta). Los jefes, y los enemigos que no pueden dormir, quedan _ralentizados %3$d turnos_.
champions.bard.lullaby.desc_rude=Cuando algo los despierta, reciben _%d de daño_ (despertar brusco).
champions.bard.lullaby.desc_short=duerme a los enemigos de una zona.
champions.bard.lullaby.desc_forte=_Fortissimo:_ la zona crece a 2 casillas alrededor y todo dura un _%1$d%%_ más.
champions.bard.lullaby.prompt=Elige dónde cantar la nana
champions.bard.lullaby.slept=La canción de cuna duerme a %d enemigos.
champions.bard.lullaby.slept_one=La canción de cuna duerme a un enemigo.
champions.bard.lullaby$drowse.name=canción de cuna
champions.bard.lullaby$drowse.desc=Este personaje duerme al son de una canción de cuna.
champions.bard.lullaby$drowse.rude=¡Despertar brusco!

champions.bard.hymn.name=himno sanador
champions.bard.hymn.desc=Cura al Bardo y a cada héroe y aliado a la vista el _%2$d%% de su vida máxima + %3$d_ (al Bardo, _%1$d PS_), y les quita _un efecto negativo_ a cada uno.
champions.bard.hymn.desc_life=Además cura _%1$d PS_ a lo largo de los %2$d turnos siguientes (canción de vida).
champions.bard.hymn.desc_dissonance=La disonancia hace _%1$d de daño_ a los enemigos a %2$d casillas o menos.
champions.bard.hymn.desc_short=cura a todo el grupo y le quita un mal.
champions.bard.hymn.desc_forte=_Fortissimo:_ cura un _%1$d%%_ más.

champions.bard.finale.name=gran final
champions.bard.finale.desc=Cada héroe del grupo gana _un turno extra_: vuelve a actuar antes que los enemigos (el Bardo, justo después de cantar). Los aliados a la vista se mueven más rápido 2 turnos, y los enemigos a la vista quedan _ralentizados %1$d turnos_.
champions.bard.finale.desc_crescendo=El crescendo hace _%d de daño_ a los enemigos a la vista.
champions.bard.finale.desc_tempo=Los héroes también ganan _%d turnos de velocidad_.
champions.bard.finale.desc_short=da un turno extra a todo el grupo y ralentiza a los enemigos.
champions.bard.finale.desc_forte=_Fortissimo:_ _dos turnos extra_, y todo lo demás es un _%1$d%%_ más fuerte.
champions.bard.finale$encore.name=bis
champions.bard.finale$encore.desc=¡El gran final todavía suena! Las próximas acciones de este héroe, hasta %s turnos, no gastan tiempo: nadie más se mueve mientras tanto.

champions.bard.refrain.name=estribillo
champions.bard.refrain.desc=Cada canción suma una nota. Con _%1$d notas_, la siguiente canción sale en _Fortissimo_: es un _%2$d%%_ más fuerte (cada canción dice cómo) y gasta las notas.\n\nNotas: _%3$d/%4$d_.
champions.bard.refrain.desc_charged=¡La siguiente canción saldrá en _Fortissimo_!
champions.bard.refrain.charged=¡Fortissimo listo!
champions.bard.refrain.forte=¡Fortissimo!

###armadura de clase
items.armor.bardarmor.name=jubón del bardo
items.armor.bardarmor.desc=Mientras lleve este jubón, el Bardo puede realizar una habilidad especial.

###habilidad de armadura
champions.bard.grandoverture.name=gran obertura
champions.bard.grandoverture.short_desc=Todo el calabozo escucha: los enemigos a la vista quedan _encantados_ y los aliados, más _rápidos_.
champions.bard.grandoverture.desc=El Bardo toca una obertura que oye todo el calabozo. Los enemigos a 8 casillas o menos y a la vista quedan _encantados 3 turnos_ (los jefes, la mitad) y no pueden atacarlo. Los héroes y aliados a la vista ganan _3 turnos de velocidad_.
