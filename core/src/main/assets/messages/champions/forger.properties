#Forger

###class
actors.hero.heroclass.forger=forger
actors.hero.heroclass.forger_desc_short=The _Forger_ is a tank who holds the front line, opens fissures of magma and charges. He leaves enemies _brittle_ and also _forges_ the gear of his allies.
actors.hero.heroclass.forger_desc=A dwarven smith who did not abandon his forge when the Metropolis fell; his hammer still rings beneath the caves. The Forger starts with an _anvil medallion_, which grants _Magma Rift_, _Bellows Breath_, _Onslaught_ and the _Call of the Forge God_ (from level 6).\n\nHis passive, the _living forge_, gives him a little more natural armor and lets him _forge_ once per floor the weapon or the armor of an adjacent ally (or his own): it gains _+1 upgrade_ until the party goes down a floor. It is used from the ability window.\n\nHe also starts with a _forge hammer_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Forger automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Haste\n_-_ Scrolls of Rage
actors.hero.heroclass.forger_unlock=The champions are unlocked from the start.

###subclasses
actors.hero.herosubclass.mastersmith=master smith
actors.hero.herosubclass.mastersmith_short_desc=The _Master Smith_ forges twice per floor, and his talents make every forging worth more.
actors.hero.herosubclass.mastersmith_desc=He can _forge twice_ per floor (the same piece or two different ones), and each forging adds _+1 level_ to the forged piece until the party goes down a floor.
actors.hero.herosubclass.livingmountain=living mountain
actors.hero.herosubclass.livingmountain_short_desc=The _Living Mountain_ has more health and shields himself whenever he breaks a brittle enemy.
actors.hero.herosubclass.livingmountain_desc=He gains _15% more max health_. When his blow breaks a _brittle_ enemy, he gains a _shield_ of 2 points plus 1 per 3 levels.

###Forger talents
actors.hero.talent.for_meal.title=forge ration
actors.hero.talent.for_meal.desc=_+1:_ Eating resets the cooldown of _Magma Rift_.\n\n_+2:_ Eating also gives the Forger a _shield_ of 3 points plus half his level.
actors.hero.talent.for_intuition.title=smith's eye
actors.hero.talent.for_intuition.desc=_+1:_ The Forger identifies melee weapons and armor _1.75x faster_.\n\n_+2:_ _2.5x faster_.
actors.hero.talent.for_thick_plates.title=anvil skin
actors.hero.talent.for_thick_plates.desc=_+1:_ The Forger gains _1-2 extra armor_.\n\n_+2:_ _2-4 extra armor_.
actors.hero.talent.for_heavy_hammer.title=hammer blow
actors.hero.talent.for_heavy_hammer.desc=_+1:_ His melee blows deal _10% more damage_.\n\n_+2:_ _20% more damage_.
actors.hero.talent.for_liquid_forge.title=liquid forge
actors.hero.talent.for_liquid_forge.desc=_+1:_ Drinking or throwing a potion reduces the Forger's cooldowns by _3 turns_.\n\n_+2:_ By _5 turns_.
actors.hero.talent.for_long_rift.title=long rift
actors.hero.talent.for_long_rift.desc=_+1:_ _Magma Rift_ is _1 tile_ longer.\n\n_+2:_ _2 tiles_ longer.
actors.hero.talent.for_wide_bellows.title=wide bellows
actors.hero.talent.for_wide_bellows.desc=_+1:_ _Bellows Breath_ reaches _1 tile_ further and opens the cone _15 degrees_.\n\n_+2:_ _2 tiles_ further and _30 degrees_ wider.
actors.hero.talent.for_long_charge.title=long charge
actors.hero.talent.for_long_charge.desc=_+1:_ _Onslaught_ travels _1 tile_ further.\n\n_+2:_ _2 tiles_ further.
actors.hero.talent.for_temper.title=tempering
actors.hero.talent.for_temper.desc=_+1:_ When the Forger forges, whoever receives the forging gains a _shield_ of 4 points plus 1 per 3 levels.\n\n_+2:_ The shield is 8 points plus 1 per 3 levels.
actors.hero.talent.for_ram_horns.title=ram horns
actors.hero.talent.for_ram_horns.desc=_+1:_ The ram of the _Call of the Forge God_ deals _20% more damage_ and slows for _1 more turn_.\n\n_+2:_ _40% more_ damage and _2 more turns_.\n\n_+3:_ _60% more_ damage and _3 more turns_.
actors.hero.talent.for_fire_pillars.title=burning pillars
actors.hero.talent.for_fire_pillars.desc=_+1:_ The magma pillars of the Rift last _2 more turns_, and the wave of Onslaught deals _20% more damage_ if it breaks a pillar.\n\n_+2:_ _4 more turns_ and _40% more_ damage.\n\n_+3:_ _6 more turns_ and _60% more_ damage.
actors.hero.talent.ms_fine_temper.title=fine tempering
actors.hero.talent.ms_fine_temper.desc=_+1:_ Every time he forges, all the Forger's cooldowns are reduced by _3 turns_.\n\n_+2:_ _6 turns_.\n\n_+3:_ _9 turns_.
actors.hero.talent.ms_quick_anvil.title=quick anvil
actors.hero.talent.ms_quick_anvil.desc=_+1:_ Forging takes _40% less_ time.\n\n_+2:_ _80% less_.\n\n_+3:_ _90% less_: it hardly takes a turn.
actors.hero.talent.ms_molten_gift.title=molten gift
actors.hero.talent.ms_molten_gift.desc=_+1:_ A forged weapon deals _10% more damage_ until the party goes down a floor.\n\n_+2:_ _20% more_.\n\n_+3:_ _30% more_.
actors.hero.talent.lm_stone_skin.title=stone skin
actors.hero.talent.lm_stone_skin.desc=_+1:_ The shield he gains from breaking a brittle enemy is _2 points_ bigger.\n\n_+2:_ _4 points_ bigger.\n\n_+3:_ _6 points_ bigger.
actors.hero.talent.lm_quake.title=tremor
actors.hero.talent.lm_quake.desc=_+1:_ The wave of _Onslaught_ leaves enemies _brittle_ for _6 turns_.\n\n_+2:_ For _9 turns_.\n\n_+3:_ For _12 turns_.
actors.hero.talent.lm_granite_heart.title=granite heart
actors.hero.talent.lm_granite_heart.desc=_+1:_ While he has a shield, he gains _1-2 extra armor_.\n\n_+2:_ _2-4 extra armor_.\n\n_+3:_ _3-6 extra armor_.
actors.hero.talent.fer_wide_crater.title=wide crater
actors.hero.talent.fer_wide_crater.desc=The wave of the _Eruption of the Forge_ deals _15% more damage_ for each point.
actors.hero.talent.fer_dense_magma.title=dense magma
actors.hero.talent.fer_dense_magma.desc=The Forger's magma pillars (those of the Eruption and those of Magma Rift) last _2 more turns_ for each point.
actors.hero.talent.fer_seismic.title=seismic wave
actors.hero.talent.fer_seismic.desc=Enemies caught by the wave of the Eruption become _brittle_ for _3 turns_ for each point.
actors.hero.talent.gua_deep_sands.title=deep sands
actors.hero.talent.gua_deep_sands.desc=The _Sand Tomb_ roots for _1 more turn_ and weakens for _2 more turns_ for each point.
actors.hero.talent.gua_thirsty_tomb.title=thirsty tomb
actors.hero.talent.gua_thirsty_tomb.desc=The Guardian heals _3% of his max health_ for each point and for each enemy buried (up to 3 enemies).
actors.hero.talent.gua_ages.title=ages of sand
actors.hero.talent.gua_ages.desc=The _Sand Tomb_ deals _20% more damage_ for each point.
actors.hero.talent.bar_encore.title=encore
actors.hero.talent.bar_encore.desc=The _Grand Overture_ charms enemies for _1 more turn_ for each point.
actors.hero.talent.bar_echo.title=echo
actors.hero.talent.bar_echo.desc=The _Grand Overture_ gives every ally a _shield_ of 2 points plus 1 per 3 levels, multiplied by the points.
actors.hero.talent.bar_ovation.title=ovation
actors.hero.talent.bar_ovation.desc=The _Grand Overture_ gives _2 more turns_ of haste and reduces the cooldowns of every ally's abilities by _4 turns_, for each point.

###items
champions.forger.forgerkit.name=anvil medallion
champions.forger.forgerkit.desc=An iron medallion with an anvil engraved on it and two ram horns at its sides. It is still warm, as if it had just left the forge. While you carry it you can use the Forger's techniques.
champions.forger.forgehammer.name=forge hammer
champions.forger.forgehammer.desc=A smith's hammer with a square head and a short haft, blackened with soot. It is no fine weapon, but it crushes.
items.armor.forgerarmor.name=forger's armor
items.armor.forgerarmor.desc=While wearing this armor, the Forger can perform a special ability.

###passive
champions.forger.livingforge.name=living forge
champions.forger.livingforge.desc=Forgings per floor: _%d_. Choose your hero or an adjacent ally and the weapon or the armor you prefer gains _+1 level_ until the party goes down a floor.
champions.forger.livingforge.prompt=Choose who to forge (you or an adjacent ally)
champions.forger.livingforge.choose=What do you want to forge?
champions.forger.livingforge.none=(nothing equipped)
champions.forger.livingforge.no_uses=You have already forged all you could on this floor.
champions.forger.livingforge.no_target=There is nobody to forge there.
champions.forger.livingforge.nothing=They have nothing equipped to forge.
champions.forger.livingforge.forged=Forged!
champions.forger.livingforge.forged_weapon=The Forger forges the weapon of %s: +1 level until you go down a floor.
champions.forger.livingforge.forged_armor=The Forger forges the armor of %s: +1 level until you go down a floor.
champions.forger.livingforge$boost.name=forged gear
champions.forger.livingforge$boost.desc=Your weapon gains _%1$d_ levels and your armor _%2$d_ until the party goes down a floor.
champions.forger.brittle.name=brittle
champions.forger.brittle.desc=The next blow it takes from _any hero_ stuns it and deals _%1$d extra damage_.\n\nTurns remaining: %2$s.
champions.forger.brittle.shattered=Shattered!
champions.forger.magmapillar.desc=A pillar of magma blocks the way. It crumbles by itself in time, or breaks with a good blow.

###abilities
champions.forger.magmarift.name=magma rift
champions.forger.magmarift.desc=Opens a fissure in a line of _%1$d tiles_ that burns the enemies it crosses (_%2$d-%3$d damage_). At its end it leaves a _pillar of magma_ that blocks that tile for _%4$d turns_.
champions.forger.magmarift.desc_short=a line of magma that leaves a pillar at its end.
champions.forger.magmarift.prompt=Choose where to open the rift
champions.forger.magmarift.bad_cell=There is no room for the rift.
champions.forger.bellowsbreath.name=bellows breath
champions.forger.bellowsbreath.desc=Blows fire in a cone of _%1$d tiles_ and _%2$d degrees_ (_%3$d-%4$d damage_). Enemies caught become _brittle_ for _%6$d turns_: the next blow they take from _any hero_ stuns them and deals _%5$d extra damage_.
champions.forger.bellowsbreath.desc_short=a cone of fire that leaves enemies brittle.
champions.forger.bellowsbreath.prompt=Choose where to blow
champions.forger.onslaught.name=onslaught
champions.forger.onslaught.desc=Charges up to _%1$d tiles_ in a straight line: enemies it crosses take _%2$d-%3$d damage_ and are pushed ahead. If it hits a wall, a pillar or something it can't push, a _wave_ of _%4$d tiles_ deals _%5$d-%6$d damage_ and _knocks down_ (stuns) everything around, and breaks the pillars next to the impact. Every charge gives a _%7$d shield_.
champions.forger.onslaught.desc_short=a charge that pushes enemies; if it crashes, a wave knocks them down.
champions.forger.onslaught.prompt=Choose where to charge
champions.forger.onslaught.no_room=There is no room to charge.
champions.forger.godscall.name=call of the forge
champions.forger.godscall.desc=A _ram of fire_ appears about _%1$d tiles_ away, next to the nearest enemy in sight, and runs in a line toward the Forger: every enemy it brushes takes _%2$d-%3$d damage_ and is _slowed for %4$d turns_.\n\nIf you use R again while it passes within _%5$d tiles_, you send it back with a _headbutt_: everything in the line takes damage, is _stunned for %6$d turns_ and left _brittle_.
champions.forger.godscall.desc_short=a ram of fire charges in a line; you can headbutt it back.
champions.forger.godscall.far=the ram is far away
champions.forger.godscall.no_target=There is no enemy in sight.
champions.forger.godscall.no_room=There is no room to call the ram.
champions.forger.godscall.summoned=A ram of fire charges toward the Forger!
champions.forger.godscall.headbutt=The Forger headbutts the ram back!
champions.forger.godscall$ramrun.name=ram of fire
champions.forger.godscall$ramrun.desc=A ram of fire runs toward the Forger. It has _%d steps_ left. If it passes close, use R to headbutt it back.

###armor ability
champions.forger.forgeeruption.name=eruption of the forge
champions.forger.forgeeruption.short_desc=The forge erupts around the Forger: a _wave_ that hurts and knocks down, and a ring of _magma pillars_.
champions.forger.forgeeruption.desc=The forge erupts: a shock wave of 2 tiles deals _5-10 damage_ (more with strength) and _knocks down_ (stuns for 3 turns) the enemies around. Then a ring of _magma pillars_ rises 3 tiles away, with four gaps to get out, for 12 turns. Onslaught breaks the pillars.
