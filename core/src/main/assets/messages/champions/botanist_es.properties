#Botanist (es)

###clase
actors.hero.heroclass.botanist=botánico
actors.hero.heroclass.botanist_desc_short=El _Botánico_ pelea con plantas: planta brotes que disparan espinas, levanta muros de tierra, cura al grupo con una pradera y, con su _Árbol ancestral_, atrapa a todos los enemigos.
actors.hero.heroclass.botanist_desc=Jardinero de los invernaderos de la ciudad, sabe que hasta en la mazmorra crecen plantas, y que las raíces de allí abajo le obedecen. El Botánico empieza con un _herbario_, que le da cuatro habilidades: _Brote tirador_, _Muro de tierra_, _Pradera curativa_ y el _Árbol ancestral_ (desde el nivel 6).\n\nSu pasiva, la _mano verde_: las semillas que planta tienen un efecto reforzado y nunca le perjudican a él (ni a su grupo); encuentra semillas más a menudo y pisar hierba alta le cura un poco.\n\nTambién empieza con un _bastón de madera_ (flojo, pero suyo), tres semillas al azar, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pociones de curación\n_-_ Pergaminos de quitar maldición
actors.hero.heroclass.botanist_unlock=Los campeones están desbloqueados desde el principio.

###subclases
actors.hero.herosubclass.wargardener=jardinero de guerra
actors.hero.herosubclass.wargardener_short_desc=El _Jardinero de guerra_ cultiva defensas: sus plantas tienen más vida, daño y duración, y planta dos brotes a la vez.
actors.hero.herosubclass.wargardener_desc=Los brotes y el Árbol ancestral tienen un _25% más de vida_ y de _daño_, y duran un _30% más_.\n\nBrote tirador planta _dos brotes_ (el segundo, más débil).
actors.hero.herosubclass.druid=druida
actors.hero.herosubclass.druid_short_desc=El _Druida_ cuida al grupo: la Pradera cura más y, además, quita todos los estados negativos.
actors.hero.herosubclass.druid_desc=Pradera curativa cura un _40% más_ y quita _todos los estados negativos_ a los aliados que están dentro.

###talentos
actors.hero.talent.bot_meal.title=merienda campestre
actors.hero.talent.bot_meal.desc=_+1:_ Comer tiene un _50%_ de dar una semilla al azar.\n\n_+2:_ Comer da _siempre_ una semilla al azar.
actors.hero.talent.bot_intuition.title=ojo de herbolario
actors.hero.talent.bot_intuition.desc=_+1:_ El Botánico identifica pociones y semillas _1,75 veces más rápido_.\n\n_+2:_ _2,5 veces más rápido_.
actors.hero.talent.bot_thorny_sprout.title=brote espinoso
actors.hero.talent.bot_thorny_sprout.desc=_+1:_ Las espinas de los brotes y el drenaje del Árbol ancestral hacen un _25% más de daño_.\n\n_+2:_ _50% más_.
actors.hero.talent.bot_fresh_air.title=aire fresco
actors.hero.talent.bot_fresh_air.desc=_+1:_ Pisar hierba alta cura _2 PS más_.\n\n_+2:_ _4 PS más_.
actors.hero.talent.bot_liquid_sap.title=savia líquida
actors.hero.talent.bot_liquid_sap.desc=_+1:_ Beber o lanzar una poción reduce _3 turnos_ los enfriamientos del Botánico.\n\n_+2:_ Los reduce _5 turnos_.
actors.hero.talent.bot_strong_roots.title=raíces fuertes
actors.hero.talent.bot_strong_roots.desc=_+1:_ El Árbol ancestral tiene un _25% más de vida_.\n\n_+2:_ _50% más_.
actors.hero.talent.bot_deep_roots.title=tierra firme
actors.hero.talent.bot_deep_roots.desc=_+1:_ Muro de tierra se recarga _2 turnos_ antes.\n\n_+2:_ _4 turnos_ antes.
actors.hero.talent.bot_pruning.title=poda
actors.hero.talent.bot_pruning.desc=_+1:_ Los brotes duran _3 turnos más_.\n\n_+2:_ _6 turnos más_.
actors.hero.talent.bot_seed_bag.title=bolsa de semillas
actors.hero.talent.bot_seed_bag.desc=_+1:_ Una planta del Botánico tiene un _25%_ de dejar su semilla al marchitarse.\n\n_+2:_ _50%_.
actors.hero.talent.bot_overgrowth.title=crecida
actors.hero.talent.bot_overgrowth.desc=_+1:_ Pradera curativa dura _1 turno más_.\n\n_+2:_ _2 turnos más_.\n\n_+3:_ _3 turnos más_.
actors.hero.talent.bot_ancient_bark.title=corteza ancestral
actors.hero.talent.bot_ancient_bark.desc=_+1:_ Al usar cualquier habilidad, el Botánico gana _corteza_ (más protección cuanto más nivel) durante 4 turnos.\n\n_+2:_ Más corteza.\n\n_+3:_ Todavía más corteza.
actors.hero.talent.wg_hard_wood.title=madera dura
actors.hero.talent.wg_hard_wood.desc=_+1:_ Los brotes y el Árbol ancestral tienen un _33% más de vida_.\n\n_+2:_ _66% más_.\n\n_+3:_ _100% más_.
actors.hero.talent.wg_twin_sprouts.title=brotes gemelos
actors.hero.talent.wg_twin_sprouts.desc=_+1:_ El segundo brote de Brote tirador tiene _80%_ de la fuerza del primero (en vez de 60%).\n\n_+2:_ _100%_.\n\n_+3:_ _120%_.
actors.hero.talent.wg_thorn_barrage.title=ráfaga de espinas
actors.hero.talent.wg_thorn_barrage.desc=_+1:_ Los brotes tienen un _33%_ de lanzar una segunda espina.\n\n_+2:_ _66%_.\n\n_+3:_ _99%_.
actors.hero.talent.dr_life_bloom.title=flor de vida
actors.hero.talent.dr_life_bloom.desc=_+1:_ Pradera curativa cura _20% más_.\n\n_+2:_ _40% más_.\n\n_+3:_ _60% más_.
actors.hero.talent.dr_purifying_sap.title=savia purificadora
actors.hero.talent.dr_purifying_sap.desc=_+1:_ Los aliados dentro de la Pradera ganan _2 de corteza_.\n\n_+2:_ _4 de corteza_.\n\n_+3:_ _6 de corteza_.
actors.hero.talent.dr_spring_rain.title=lluvia de primavera
actors.hero.talent.dr_spring_rain.desc=_+1:_ El Árbol ancestral cura _1 PS_ (más 1 por cada 6 niveles) por turno a los aliados a 3 casillas o menos.\n\n_+2:_ _2 PS_ por turno.\n\n_+3:_ _3 PS_ por turno.
actors.hero.talent.bot_deep_bloom.title=floración honda
actors.hero.talent.bot_deep_bloom.desc=_+2:_ El jardín de Floración es _1 casilla más ancho_.\n\n_+4:_ _2 casillas más ancho_.
actors.hero.talent.bot_lush_garden.title=jardín frondoso
actors.hero.talent.bot_lush_garden.desc=_+1:_ Floración planta _1 planta más_ (por punto).
actors.hero.talent.bot_healing_pollen.title=polen curativo
actors.hero.talent.bot_healing_pollen.desc=_+1:_ Floración cura _3 PS más_ (por punto) a cada aliado del área.
actors.hero.talent.sco_deep_venom.title=veneno hondo
actors.hero.talent.sco_deep_venom.desc=_+1:_ Lluvia de dardos envenena _2 turnos más_ (por punto).
actors.hero.talent.sco_blind_storm.title=tormenta cegadora
actors.hero.talent.sco_blind_storm.desc=_+1:_ Lluvia de dardos ciega _1 turno más_ (por punto).
actors.hero.talent.sco_endless_quiver.title=carcaj sin fondo
actors.hero.talent.sco_endless_quiver.desc=_+1:_ Lluvia de dardos hace un _20% más de daño_ (por punto).
actors.hero.talent.pyr_blazing_core.title=núcleo ardiente
actors.hero.talent.pyr_blazing_core.desc=_+1:_ Nova ígnea hace un _20% más de daño_ (por punto).
actors.hero.talent.pyr_afterglow.title=resplandor
actors.hero.talent.pyr_afterglow.desc=_+1:_ Tras la Nova ígnea, la Piromante gana un escudo de _2 PS_ (más 1 por cada 3 niveles) por punto.
actors.hero.talent.pyr_blast_wave.title=onda expansiva
actors.hero.talent.pyr_blast_wave.desc=_+1:_ Nova ígnea lisia a los enemigos _2 turnos_ por punto.
actors.hero.talent.gra_heavy_stone.title=piedra pesada
actors.hero.talent.gra_heavy_stone.desc=_+1:_ Lápida hace un _20% más de daño_ (por punto).
actors.hero.talent.gra_long_mourning.title=duelo largo
actors.hero.talent.gra_long_mourning.desc=_+1:_ Los enemigos aplastados por la Lápida quedan aturdidos _1 turno más_ (por punto).
actors.hero.talent.gra_fresh_graves.title=tumbas frescas
actors.hero.talent.gra_fresh_graves.desc=_+1:_ Cada enemigo aplastado por la Lápida tiene un _25%_ (por punto) de dejar una tumba al Sepulturero.

###herbario, bastón y plantas
champions.botanist.botanistkit.name=herbario del botánico
champions.botanist.botanistkit.desc=Un cuaderno hinchado de hojas prensadas y semillas pegadas con savia. Cada página guarda un truco para que la tierra trabaje a tu favor.
champions.botanist.woodenstaff.name=bastón de madera
champions.botanist.woodenstaff.desc=Una vara de avellano pulida por el uso. Ayuda a caminar; para pelear, mejor que trabajen las plantas.

champions.botanist.thornshooter.name=brote tirador
champions.botanist.thornshooter.desc=Planta un brote en una casilla a la vista, a %1$d casillas o menos. Durante _%4$d turnos_ dispara espinas (_%2$d-%3$d de daño_, según tu nivel) al enemigo más cercano. No se mueve y se le puede matar.
champions.botanist.thornshooter.desc_gardener=Como Jardinero de guerra plantas _dos brotes_ a la vez.
champions.botanist.thornshooter.desc_short=planta un brote que dispara espinas.
champions.botanist.thornshooter.prompt=Elige dónde plantar el brote
champions.botanist.thornshooter.no_space=Ahí no se puede plantar.
champions.botanist.sprout.name=brote tirador
champions.botanist.sprout.desc=Un brote espinoso que dispara espinas al enemigo más cercano (_%1$d-%2$d de daño_). Le quedan unos _%3$d turnos_.

champions.botanist.earthwall.name=muro de tierra
champions.botanist.earthwall.desc=Levanta un bloque de tierra en una casilla a la vista, a %1$d casillas o menos. Es _permanente_ (se guarda con el piso) y bloquea el paso como una pared. Solo el Botánico puede quitarlo (usando de nuevo esta habilidad sobre el bloque) o los enemigos capaces de romper paredes.\n\nNo se puede poner sobre personajes, objetos, plantas ni escaleras, ni dejar a un héroe sin camino a la salida.
champions.botanist.earthwall.desc_short=levanta un muro de tierra permanente.
champions.botanist.earthwall.prompt=Elige dónde alzar (o quitar) el muro
champions.botanist.earthwall.no_space=Ahí no se puede alzar un muro.
champions.botanist.earthwall.blocks_path=Ese muro dejaría a alguien sin camino a la salida.

champions.botanist.healingmeadow.name=pradera curativa
champions.botanist.healingmeadow.desc=Hace crecer hierba en un área de %1$dx%1$d a %4$d casillas o menos. Durante _%2$d turnos_ cura a _todos_ los aliados que estén dentro (_%3$d PS_ por turno para el Botánico) y apaga el fuego.
champions.botanist.healingmeadow.desc_druid=Como Druida cura más y quita _todos los estados negativos_ a los aliados de dentro.
champions.botanist.healingmeadow.desc_short=cura al grupo durante unos turnos.
champions.botanist.healingmeadow.prompt=Elige dónde crece la pradera
champions.botanist.healingmeadow$meadow.desc=Una pradera mágica: cura a los aliados que pisan su hierba.

champions.botanist.ancienttree.name=árbol ancestral
champions.botanist.ancienttree.desc=Hace brotar un árbol embrujado en una casilla libre a la vista, a %1$d casillas o menos. Tiene _%2$d PS_ y dura _%3$d turnos_. Al aparecer _llama a todos los enemigos del piso_, y mientras viva solo lo atacan a él.\n\nUna raíz agarra a los enemigos que estén a 2 casillas o menos (hasta %4$d a la vez): quedan _paralizados_ y pierden _%5$d PS_ por turno. Los jefes se sueltan a ratos. Cuando el árbol cae o se seca, los enemigos quedan libres.
champions.botanist.ancienttree.desc_druid=Como Druida, el árbol cura _%d PS_ por turno a los aliados cercanos.
champions.botanist.ancienttree.desc_gardener=Como Jardinero de guerra, el árbol es más grande, más duro y dura más.
champions.botanist.ancienttree.desc_short=un árbol que llama y atrapa a los enemigos.
champions.botanist.ancienttree.prompt=Elige dónde brota el árbol
champions.botanist.ancienttree.no_space=Ahí no cabe un árbol.
champions.botanist.treeguardian.name=árbol ancestral
champions.botanist.treeguardian.desc=Un árbol viejísimo con una cara tallada en el tronco, y unos ojos que siguen todo lo que se mueve. Sus raíces drenan _%1$d PS_ por turno a los enemigos cercanos (hasta %2$d a la vez) y los paralizan. Le quedan unos _%3$d turnos_.

champions.botanist.bloom.name=floración
champions.botanist.bloom.short_desc=El Botánico convierte un área en un _jardín_: hierba alta, plantas útiles al azar y curación para el grupo.
champions.botanist.bloom.desc=El Botánico hace florecer el suelo en una zona a %1$d casillas o menos: crece hierba alta, brotan al azar plantas útiles (hierbasol, raíz de tierra, hierbarreal, cardo veloz o flor de estrella) y cura a los aliados de dentro.
champions.botanist.bloom.desc_numbers=Área de %1$dx%1$d, %2$d plantas, %3$d PS de curación.
champions.botanist.bloom.cost=Coste de carga: _%d_
champions.botanist.bloom.prompt=Elige dónde florece el jardín

###habilidades de armadura de los otros campeones
champions.scout.rainofdarts.name=lluvia de dardos
champions.scout.rainofdarts.short_desc=El Explorador lanza una _lluvia de dardos_ envenenados sobre un área: daña, envenena y ciega.
champions.scout.rainofdarts.desc=Una lluvia de dardos cae sobre un área de %1$dx%1$d, a %2$d casillas o menos. Los enemigos de dentro reciben daño, quedan _envenenados_ y _cegados_.
champions.scout.rainofdarts.desc_numbers=Daño %1$d-%2$d, veneno %3$d turnos, ceguera %4$d turnos.
champions.scout.rainofdarts.cost=Coste de carga: _%d_
champions.scout.rainofdarts.prompt=Elige dónde cae la lluvia

champions.pyromancer.supernova.name=nova ígnea
champions.pyromancer.supernova.short_desc=La Piromante estalla en una _nova_ de llamas que quema a los enemigos cercanos.
champions.pyromancer.supernova.desc=La Piromante estalla en llamas a su alrededor (%1$d casillas): los enemigos reciben daño y _arden_. No daña a los aliados. Cuenta como habilidad de daño para la Piromanía.
champions.pyromancer.supernova.desc_numbers=Daño %1$d-%2$d.
champions.pyromancer.supernova.cost=Coste de carga: _%d_

champions.gravedigger.headstone.name=lápida
champions.gravedigger.headstone.short_desc=Una _lápida_ enorme cae sobre un punto y aplasta y aturde a los enemigos.
champions.gravedigger.headstone.desc=Una lápida pesada cae sobre un punto a %2$d casillas o menos. Los enemigos de un área de %1$dx%1$d reciben daño y quedan _aturdidos_.
champions.gravedigger.headstone.desc_numbers=Daño %1$d-%2$d, aturdidos %3$d turnos.
champions.gravedigger.headstone.cost=Coste de carga: _%d_
champions.gravedigger.headstone.prompt=Elige dónde cae la lápida
