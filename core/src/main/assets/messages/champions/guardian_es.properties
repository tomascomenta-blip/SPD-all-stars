#Guardian (es)

###clase
actors.hero.heroclass.guardian=guardián
actors.hero.heroclass.guardian_desc_short=El _Guardián_, custodio de las arenas, se cura con cada golpe y remata con su _Golpe sifón_, que se hace más fuerte con cada enemigo que mata: acumula poder durante toda la partida.
actors.hero.heroclass.guardian_desc=Custodio de las arenas, dormido durante siglos en una cripta bajo la ciudad, despertó cuando el mal de la mazmorra empezó a crecer. El Guardián empieza con un _reloj de arena_, que le da _Golpe sifón_, _Marchitar_, _Fuego espiritual_ y la _Furia de las arenas_ (desde el nivel 6).\n\nSu pasiva, el _Devorador de almas_, le cura el _8%_ del daño que hace cuerpo a cuerpo. Cada enemigo que remata con Golpe sifón le da _acumulaciones permanentes_ (más con campeones, minijefes y jefes), y cada 4 acumulaciones su Golpe sifón hace 1 de daño más durante el resto de la partida.\n\nTambién empieza con un _báculo de las arenas_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nIdentifica automáticamente:\n_-_ Pergaminos de identificación\n_-_ Pociones de velocidad\n_-_ Pergaminos de furia
actors.hero.heroclass.guardian_unlock=Los campeones están desbloqueados desde el principio.

###subclases
actors.hero.herosubclass.curator=custodio
actors.hero.herosubclass.curator_short_desc=El _Custodio_ saca más daño de sus acumulaciones y se cura cada vez que gana una.
actors.hero.herosubclass.curator_desc=Golpe sifón hace 1 de daño extra por cada _3 acumulaciones_ en vez de por cada 4, y cada acumulación que gana lo _cura 2 PS_.
actors.hero.herosubclass.colossus=coloso
actors.hero.herosubclass.colossus_short_desc=El _Coloso_ desata la Furia de las arenas más a menudo, durante más tiempo y todavía más grande.
actors.hero.herosubclass.colossus_desc=La Furia de las arenas se recarga un _25% más rápido_ y dura _5 turnos más_. Durante la Furia, el Coloso es aún más grande.

###talentos del Guardián
actors.hero.talent.gua_meal.title=ración del desierto
actors.hero.talent.gua_meal.desc=_+1:_ Comer reinicia el enfriamiento de _Golpe sifón_.\n\n_+2:_ Además, comer le da al Guardián _1 acumulación_.
actors.hero.talent.gua_intuition.title=ojo del custodio
actors.hero.talent.gua_intuition.desc=_+1:_ El Guardián identifica armas cuerpo a cuerpo _1,75 veces más rápido_.\n\n_+2:_ Las identifica _2,5 veces más rápido_.
actors.hero.talent.gua_sand_skin.title=piel de arena
actors.hero.talent.gua_sand_skin.desc=_+1:_ Por debajo de la mitad de su vida, el Guardián gana _1-2 de armadura_.\n\n_+2:_ Gana _2-4 de armadura_.
actors.hero.talent.gua_hungry_staff.title=báculo hambriento
actors.hero.talent.gua_hungry_staff.desc=_+1:_ Golpe sifón hace _+2 de daño_.\n\n_+2:_ Golpe sifón hace _+4 de daño_.
actors.hero.talent.gua_liquid_sand.title=arena líquida
actors.hero.talent.gua_liquid_sand.desc=_+1:_ Al beber o lanzar una poción, los enfriamientos del Guardián se reducen _3 turnos_.\n\n_+2:_ Se reducen _5 turnos_.
actors.hero.talent.gua_long_wither.title=siglos de polvo
actors.hero.talent.gua_long_wither.desc=_+1:_ Marchitar dura _2 turnos más_.\n\n_+2:_ Dura _4 turnos más_ y además deja al enemigo _hechizado_: acierta y esquiva un 20% menos.
actors.hero.talent.gua_hot_spirit.title=espíritu ardiente
actors.hero.talent.gua_hot_spirit.desc=_+1:_ El Fuego espiritual hace un _20% más de daño_.\n\n_+2:_ Hace un _40% más de daño_ y ocupa una zona de _5x5_.
actors.hero.talent.gua_life_drain.title=sed de almas
actors.hero.talent.gua_life_drain.desc=_+1:_ El Devorador de almas cura el _11%_ del daño cuerpo a cuerpo en vez del 8%.\n\n_+2:_ Cura el _14%_.
actors.hero.talent.gua_collector.title=coleccionista
actors.hero.talent.gua_collector.desc=_+1:_ Rematar con Golpe sifón a un enemigo que vale _10 o más de experiencia_, a un campeón o a un minijefe da _1 acumulación extra_; a un jefe, _2 más_.\n\n_+2:_ Da _2 acumulaciones extra_; a un jefe, _4 más_.
actors.hero.talent.gua_eternal.title=arena eterna
actors.hero.talent.gua_eternal.desc=_+1:_ La Furia de las arenas dura _3 turnos más_.\n\n_+2:_ Dura _6 turnos más_.\n\n_+3:_ Dura _9 turnos más_.
actors.hero.talent.gua_duststorm.title=tormenta de polvo
actors.hero.talent.gua_duststorm.desc=_+1:_ La tormenta de la Furia quita cada turno un _1% más_ de la vida máxima de los enemigos adyacentes (3% en total), y su tope contra jefes sube 1.\n\n_+2:_ Un _2% más_ (4%) y el tope sube 2.\n\n_+3:_ Un _3% más_ (5%) y el tope sube 3.
actors.hero.talent.cu_archive.title=archivo infinito
actors.hero.talent.cu_archive.desc=_+1:_ Cada enemigo rematado con Golpe sifón tiene un _20%_ de probabilidad de dar _1 acumulación extra_.\n\n_+2:_ Un _40%_.\n\n_+3:_ Un _60%_.
actors.hero.talent.cu_quick_siphon.title=sifón veloz
actors.hero.talent.cu_quick_siphon.desc=_+1:_ Golpe sifón se recarga _1 turno_ antes.\n\n_+2:_ Se recarga _2 turnos_ antes.\n\n_+3:_ Se recarga _3 turnos_ antes.
actors.hero.talent.cu_spirit_tax.title=tributo espiritual
actors.hero.talent.cu_spirit_tax.desc=_+1:_ Los enemigos que arden en el Fuego espiritual quedan _debilitados_ (hacen un 33% menos de daño) mientras siguen dentro y _1 turno_ después.\n\n_+2:_ Hasta _3 turnos_ después.\n\n_+3:_ Hasta _5 turnos_ después.
actors.hero.talent.co_giant.title=gigante del desierto
actors.hero.talent.co_giant.desc=_+1:_ La Furia de las arenas le da al Coloso un _10% más_ de vida máxima (50% en total) y lo hace aún más grande.\n\n_+2:_ Un _20% más_ (60%).\n\n_+3:_ Un _30% más_ (70%).
actors.hero.talent.co_unbroken.title=inquebrantable
actors.hero.talent.co_unbroken.desc=_+1:_ Durante la Furia, el Coloso reduce el daño de cada golpe que recibe en _1_, más 1 por cada 12 niveles.\n\n_+2:_ Lo reduce en _2_, más 2 por cada 12 niveles.\n\n_+3:_ Lo reduce en _3_, más 3 por cada 12 niveles.
actors.hero.talent.co_withering_steps.title=pasos marchitos
actors.hero.talent.co_withering_steps.desc=_+1:_ Durante la Furia, los golpes cuerpo a cuerpo del Coloso _marchitan_ al enemigo (ralentizado y debilitado) _2 turnos_.\n\n_+2:_ Lo marchitan _3 turnos_.\n\n_+3:_ Lo marchitan _4 turnos_.

###objetos
champions.guardian.guardiankit.name=reloj de arena
champions.guardian.guardiankit.desc=Un reloj de arena de bronce con la cabeza de un chacal grabada. La arena cae despacio, grano a grano, como las almas que custodia. Mientras lo lleves encima podrás usar las técnicas del Guardián.
champions.guardian.sandstaff.name=báculo de las arenas
champions.guardian.sandstaff.desc=Un báculo largo de madera oscura coronado por una media luna de bronce. Pega con contundencia, aunque algo menos que una espada.
items.armor.guardianarmor.name=armadura del guardián
items.armor.guardianarmor.desc=Mientras lleve esta armadura, el Guardián puede realizar una habilidad especial.

###pasiva
champions.guardian.souleater.name=devorador de almas
champions.guardian.souleater.stack=+%1$d (%2$d)
champions.guardian.souleater.desc=Los golpes cuerpo a cuerpo del Guardián le curan el _%1$d%%_ del daño que hacen.\n\nAcumulaciones: _%2$d_. Las gana rematando enemigos con Golpe sifón y no se pierden nunca.\nDaño extra de Golpe sifón por acumulaciones: _+%3$d_.

###habilidades
champions.guardian.siphoningstrike.name=golpe sifón
champions.guardian.siphoningstrike.desc=Prepara el báculo (no gasta turno): su siguiente golpe cuerpo a cuerpo hace _%1$d de daño extra_ (2 + la mitad de su nivel + 1 por cada %3$d acumulaciones). _Si ese golpe mata_, gana acumulaciones permanentes: _1_ por un enemigo normal, _%4$d_ por un campeón o minijefe y _%5$d_ por un jefe. Los enemigos que no dan experiencia no cuentan.\n\nAcumulaciones: _%2$d_.
champions.guardian.siphoningstrike.desc_short=el siguiente golpe pega más; si mata, gana acumulaciones para siempre.
champions.guardian.siphoningstrike$primed.name=golpe sifón preparado
champions.guardian.siphoningstrike$primed.desc=El siguiente golpe cuerpo a cuerpo del Guardián hará _%1$d de daño extra_ y, si mata, le dará acumulaciones.\n\nTurnos restantes: %2$s.
champions.guardian.wither.name=marchitar
champions.guardian.wither.desc=Envejece a un enemigo a _%1$d casillas_ o menos: queda _ralentizado_ (todo lo hace, también atacar, a la mitad de velocidad) y _debilitado_ (hace un 33%% menos de daño) durante _%2$d turnos_. Contra jefes dura la mitad.
champions.guardian.wither.desc_hex=Además queda _hechizado_: acierta y esquiva un 20% menos.
champions.guardian.wither.desc_short=ralentiza y debilita a un enemigo.
champions.guardian.wither.prompt=Elige a quién marchitar
champions.guardian.wither.no_target=No hay ningún enemigo ahí.
champions.guardian.wither.withered=¡Marchito!
champions.guardian.spiritfire.name=fuego espiritual
champions.guardian.spiritfire.desc=Prende fuego espiritual a _%1$d casillas_ o menos: una zona de _%2$dx%3$d_ que arde _%4$d turnos_. Cada turno, los enemigos que están dentro reciben _%5$d-%6$d de daño_ y se les quema la armadura: mientras sigan calcinados, los golpes cuerpo a cuerpo del Guardián les hacen _+%7$d de daño_. No daña a los aliados.
champions.guardian.spiritfire.desc_tax=Además quedan _debilitados_ mientras arden y hasta _%d turnos_ después.
champions.guardian.spiritfire.desc_short=una zona de fuego que daña y quema la armadura.
champions.guardian.spiritfire.prompt=Elige dónde prender el fuego
champions.guardian.spiritfire.bad_cell=No se puede prender fuego ahí.
champions.guardian.spiritfire$flames.desc=Aquí arden unas llamas violetas que no consumen nada. Queman a los enemigos del Guardián.
champions.guardian.spiritfire$scorched.name=calcinado
champions.guardian.spiritfire$scorched.desc=El fuego espiritual ha quemado la armadura de este personaje: los golpes cuerpo a cuerpo del Guardián le hacen _%1$d de daño extra_.\n\nTurnos restantes: %2$s.
champions.guardian.furyofsands.name=furia de las arenas
champions.guardian.furyofsands.desc=El Guardián se convierte en un gigante del desierto durante _%1$d turnos_: gana un _%2$d%%_ de vida máxima (y se cura esa diferencia), _0-%6$d de armadura_, y su Golpe sifón se recarga _el doble de rápido_. Una tormenta de arena quita cada turno a los enemigos adyacentes _%3$d + el %4$d%%_ de su vida máxima (a jefes y minijefes, la mitad del porcentaje y como mucho _%5$d_). Al terminar, su vida máxima vuelve a la normalidad sin matarlo.
champions.guardian.furyofsands.desc_short=se hace gigante: más vida, armadura y una tormenta de arena.
champions.guardian.furyofsands$fury.name=furia de las arenas
champions.guardian.furyofsands$fury.desc=El Guardián es un gigante del desierto.\n\nVida máxima extra: _%1$d_\nTormenta: _%2$d + el %3$d%%_ de la vida máxima de cada enemigo adyacente por turno.\nArmadura extra: _0-%4$d_\nGolpe sifón se recarga el doble de rápido.\n\nTurnos restantes: %5$d.

###habilidad de armadura
champions.guardian.sandtomb.name=tumba de arena
champions.guardian.sandtomb.short_desc=Las arenas se abren bajo una zona de _5x5_ y entierran a los enemigos: daño, _inmovilizados_ y _debilitados_.
champions.guardian.sandtomb.desc=Elige una casilla a 7 casillas o menos: las arenas se abren bajo una zona de _5x5_. Los enemigos que hay dentro reciben _4 + la mitad del nivel_ a _9 + el nivel_ de daño, quedan _inmovilizados 3 turnos_ y _debilitados 6 turnos_ (hacen un 33% menos de daño).
champions.guardian.sandtomb.prompt=Elige dónde enterrar a los enemigos
champions.guardian.sandtomb.too_far=Está demasiado lejos o fuera de la vista.
champions.guardian.sandtomb.bad_cell=No se puede abrir la tumba ahí.
