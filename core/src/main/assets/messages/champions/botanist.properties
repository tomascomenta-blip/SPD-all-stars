#Botanist (en)

###class
actors.hero.heroclass.botanist=botanist
actors.hero.heroclass.botanist_desc_short=The _Botanist_ fights with plants: he sows sprouts that shoot thorns, raises walls of earth, heals the party with a meadow and, with his _Ancient Tree_, traps every enemy.
actors.hero.heroclass.botanist_desc=A gardener from the city's greenhouses, he knows that plants grow even in the dungeon, and that the roots down there obey him. The Botanist starts with a _herbarium_, which grants four abilities: _Thorn Sprout_, _Earth Wall_, _Healing Meadow_ and the _Ancient Tree_ (from level 6).\n\nHis passive, the _green thumb_: the seeds he plants have a reinforced effect and never harm him (nor his party); he finds seeds more often and trampling tall grass heals him a little.\n\nHe also starts with a _wooden staff_ (weak, but his), three random seeds, cloth armor, a waterskin and a velvet pouch.\n\nIdentifies automatically:\n_-_ Potions of Healing\n_-_ Scrolls of Remove Curse
actors.hero.heroclass.botanist_unlock=The champions are unlocked from the start.

###subclasses
actors.hero.herosubclass.wargardener=gardener of war
actors.hero.herosubclass.wargardener_short_desc=The _Gardener of war_ grows defenses: his plants have more health, damage and duration, and he sows two sprouts at once.
actors.hero.herosubclass.wargardener_desc=Sprouts and the Ancient Tree have _25% more health_ and _damage_, and last _30% longer_.\n\nThorn Sprout plants _two sprouts_ (the second one is weaker).
actors.hero.herosubclass.druid=druid
actors.hero.herosubclass.druid_short_desc=The _Druid_ looks after the party: the Meadow heals more and also removes every negative effect.
actors.hero.herosubclass.druid_desc=Healing Meadow heals _40% more_ and removes _all negative effects_ from the allies inside.

###talents
actors.hero.talent.bot_meal.title=countryside snack
actors.hero.talent.bot_meal.desc=_+1:_ Eating has a _50%_ chance to give a random seed.\n\n_+2:_ Eating _always_ gives a random seed.
actors.hero.talent.bot_intuition.title=herbalist's eye
actors.hero.talent.bot_intuition.desc=_+1:_ The Botanist identifies potions and seeds _1.75 times faster_.\n\n_+2:_ _2.5 times faster_.
actors.hero.talent.bot_thorny_sprout.title=thorny sprout
actors.hero.talent.bot_thorny_sprout.desc=_+1:_ Sprout thorns and the Ancient Tree's drain deal _25% more damage_.\n\n_+2:_ _50% more_.
actors.hero.talent.bot_fresh_air.title=fresh air
actors.hero.talent.bot_fresh_air.desc=_+1:_ Trampling tall grass heals _2 more HP_.\n\n_+2:_ _4 more HP_.
actors.hero.talent.bot_liquid_sap.title=liquid sap
actors.hero.talent.bot_liquid_sap.desc=_+1:_ Drinking or throwing a potion shortens the Botanist's cooldowns by _3 turns_.\n\n_+2:_ By _5 turns_.
actors.hero.talent.bot_strong_roots.title=strong roots
actors.hero.talent.bot_strong_roots.desc=_+1:_ The Ancient Tree has _25% more health_.\n\n_+2:_ _50% more_.
actors.hero.talent.bot_deep_roots.title=firm ground
actors.hero.talent.bot_deep_roots.desc=_+1:_ Earth Wall recharges _2 turns_ sooner.\n\n_+2:_ _4 turns_ sooner.
actors.hero.talent.bot_pruning.title=pruning
actors.hero.talent.bot_pruning.desc=_+1:_ Sprouts last _3 more turns_.\n\n_+2:_ _6 more turns_.
actors.hero.talent.bot_seed_bag.title=seed bag
actors.hero.talent.bot_seed_bag.desc=_+1:_ A plant of the Botanist has a _25%_ chance to leave its seed when it withers.\n\n_+2:_ _50%_.
actors.hero.talent.bot_overgrowth.title=overgrowth
actors.hero.talent.bot_overgrowth.desc=_+1:_ Healing Meadow lasts _1 more turn_.\n\n_+2:_ _2 more turns_.\n\n_+3:_ _3 more turns_.
actors.hero.talent.bot_ancient_bark.title=ancient bark
actors.hero.talent.bot_ancient_bark.desc=_+1:_ Using any ability wraps the Botanist in _bark_ (more protection at higher levels) for 4 turns.\n\n_+2:_ More bark.\n\n_+3:_ Even more bark.
actors.hero.talent.wg_hard_wood.title=hardwood
actors.hero.talent.wg_hard_wood.desc=_+1:_ Sprouts and the Ancient Tree have _33% more health_.\n\n_+2:_ _66% more_.\n\n_+3:_ _100% more_.
actors.hero.talent.wg_twin_sprouts.title=twin sprouts
actors.hero.talent.wg_twin_sprouts.desc=_+1:_ The second sprout of Thorn Sprout has _80%_ of the strength of the first (instead of 60%).\n\n_+2:_ _100%_.\n\n_+3:_ _120%_.
actors.hero.talent.wg_thorn_barrage.title=thorn barrage
actors.hero.talent.wg_thorn_barrage.desc=_+1:_ Sprouts have a _33%_ chance to fire a second thorn.\n\n_+2:_ _66%_.\n\n_+3:_ _99%_.
actors.hero.talent.dr_life_bloom.title=life bloom
actors.hero.talent.dr_life_bloom.desc=_+1:_ Healing Meadow heals _20% more_.\n\n_+2:_ _40% more_.\n\n_+3:_ _60% more_.
actors.hero.talent.dr_purifying_sap.title=purifying sap
actors.hero.talent.dr_purifying_sap.desc=_+1:_ Allies inside the Meadow gain _2 bark_.\n\n_+2:_ _4 bark_.\n\n_+3:_ _6 bark_.
actors.hero.talent.dr_spring_rain.title=spring rain
actors.hero.talent.dr_spring_rain.desc=_+1:_ The Ancient Tree heals _1 HP_ (plus 1 every 6 levels) per turn to allies within 3 tiles.\n\n_+2:_ _2 HP_ per turn.\n\n_+3:_ _3 HP_ per turn.
actors.hero.talent.bot_deep_bloom.title=deep bloom
actors.hero.talent.bot_deep_bloom.desc=_+2:_ The garden of Bloom is _1 tile wider_.\n\n_+4:_ _2 tiles wider_.
actors.hero.talent.bot_lush_garden.title=lush garden
actors.hero.talent.bot_lush_garden.desc=_+1:_ Bloom plants _1 more plant_ (per point).
actors.hero.talent.bot_healing_pollen.title=healing pollen
actors.hero.talent.bot_healing_pollen.desc=_+1:_ Bloom heals _3 more HP_ (per point) to every ally in the area.
actors.hero.talent.sco_deep_venom.title=deep venom
actors.hero.talent.sco_deep_venom.desc=_+1:_ Rain of Darts poisons for _2 more turns_ (per point).
actors.hero.talent.sco_blind_storm.title=blinding storm
actors.hero.talent.sco_blind_storm.desc=_+1:_ Rain of Darts blinds for _1 more turn_ (per point).
actors.hero.talent.sco_endless_quiver.title=endless quiver
actors.hero.talent.sco_endless_quiver.desc=_+1:_ Rain of Darts deals _20% more damage_ (per point).
actors.hero.talent.pyr_blazing_core.title=blazing core
actors.hero.talent.pyr_blazing_core.desc=_+1:_ Supernova deals _20% more damage_ (per point).
actors.hero.talent.pyr_afterglow.title=afterglow
actors.hero.talent.pyr_afterglow.desc=_+1:_ After the Supernova, the Pyromancer gains a shield of _2 HP_ (plus 1 every 3 levels) per point.
actors.hero.talent.pyr_blast_wave.title=blast wave
actors.hero.talent.pyr_blast_wave.desc=_+1:_ Supernova cripples enemies for _2 turns_ per point.
actors.hero.talent.gra_heavy_stone.title=heavy stone
actors.hero.talent.gra_heavy_stone.desc=_+1:_ Headstone deals _20% more damage_ (per point).
actors.hero.talent.gra_long_mourning.title=long mourning
actors.hero.talent.gra_long_mourning.desc=_+1:_ Enemies crushed by the Headstone stay stunned _1 more turn_ (per point).
actors.hero.talent.gra_fresh_graves.title=fresh graves
actors.hero.talent.gra_fresh_graves.desc=_+1:_ Each enemy crushed by the Headstone has a _25%_ chance (per point) to leave a grave to the Gravedigger.

###herbarium, staff and plants
champions.botanist.botanistkit.name=botanist's herbarium
champions.botanist.botanistkit.desc=A notebook swollen with pressed leaves and seeds glued with sap. Every page holds a trick to make the earth work in your favor.
champions.botanist.woodenstaff.name=wooden staff
champions.botanist.woodenstaff.desc=A hazel stick polished by use. It helps with walking; for fighting, better let the plants work.

champions.botanist.thornshooter.name=thorn sprout
champions.botanist.thornshooter.desc=Plants a sprout on a visible tile up to %1$d tiles away. For _%4$d turns_ it shoots thorns (_%2$d-%3$d damage_, by your level) at the closest enemy. It doesn't move and can be killed.
champions.botanist.thornshooter.desc_gardener=As a Gardener of war you plant _two sprouts_ at once.
champions.botanist.thornshooter.desc_short=plants a sprout that shoots thorns.
champions.botanist.thornshooter.prompt=Choose where to plant the sprout
champions.botanist.thornshooter.no_space=You can't plant there.
champions.botanist.sprout.name=thorn sprout
champions.botanist.sprout.desc=A thorny sprout that shoots thorns at the closest enemy (_%1$d-%2$d damage_). About _%3$d turns_ left.

champions.botanist.earthwall.name=earth wall
champions.botanist.earthwall.desc=Raises a block of earth on a visible tile up to %1$d tiles away. It is _permanent_ (saved with the floor) and blocks the way like a wall. Only the Botanist can remove it (using this ability again on the block) or enemies able to break walls.\n\nIt can't be placed over characters, items, plants or stairs, nor leave a hero without a path to the exit.
champions.botanist.earthwall.desc_short=raises a permanent wall of earth.
champions.botanist.earthwall.prompt=Choose where to raise (or remove) the wall
champions.botanist.earthwall.no_space=A wall can't be raised there.
champions.botanist.earthwall.blocks_path=That wall would leave someone without a path to the exit.

champions.botanist.healingmeadow.name=healing meadow
champions.botanist.healingmeadow.desc=Grows grass over a %1$dx%1$d area up to %4$d tiles away. For _%2$d turns_ it heals _every_ ally inside (_%3$d HP_ per turn for the Botanist) and puts out fires.
champions.botanist.healingmeadow.desc_druid=As a Druid it heals more and removes _all negative effects_ from the allies inside.
champions.botanist.healingmeadow.desc_short=heals the party for a few turns.
champions.botanist.healingmeadow.prompt=Choose where the meadow grows
champions.botanist.healingmeadow$meadow.desc=A magic meadow: it heals the allies who stand on its grass.

champions.botanist.ancienttree.name=ancient tree
champions.botanist.ancienttree.desc=Makes a haunted tree sprout on a free visible tile up to %1$d tiles away. It has _%2$d HP_ and lasts _%3$d turns_. When it appears it _calls every enemy of the floor_, and while it lives they only attack it.\n\nA root grabs the enemies within 2 tiles (up to %4$d at a time): they are _paralysed_ and lose _%5$d HP_ per turn. Bosses break loose now and then. When the tree falls or withers, the enemies are free.
champions.botanist.ancienttree.desc_druid=As a Druid, the tree heals _%d HP_ per turn to nearby allies.
champions.botanist.ancienttree.desc_gardener=As a Gardener of war, the tree is bigger, tougher and lasts longer.
champions.botanist.ancienttree.desc_short=a tree that calls and traps the enemies.
champions.botanist.ancienttree.prompt=Choose where the tree sprouts
champions.botanist.ancienttree.no_space=A tree doesn't fit there.
champions.botanist.treeguardian.name=ancient tree
champions.botanist.treeguardian.desc=A very old tree with a face carved in its trunk, and eyes that follow everything that moves. Its roots drain _%1$d HP_ per turn from nearby enemies (up to %2$d at a time) and paralyse them. About _%3$d turns_ left.

champions.botanist.bloom.name=bloom
champions.botanist.bloom.short_desc=The Botanist turns an area into a _garden_: tall grass, random useful plants and healing for the party.
champions.botanist.bloom.desc=The Botanist makes the ground bloom in an area up to %1$d tiles away: tall grass grows, useful plants sprout at random (sungrass, earthroot, mageroyal, swiftthistle or starflower) and the allies inside are healed.
champions.botanist.bloom.desc_numbers=%1$dx%1$d area, %2$d plants, %3$d HP of healing.
champions.botanist.bloom.cost=Charge cost: _%d_
champions.botanist.bloom.prompt=Choose where the garden blooms

###armor abilities of the other champions
champions.scout.rainofdarts.name=rain of darts
champions.scout.rainofdarts.short_desc=The Scout throws a _rain of poisoned darts_ over an area: it hurts, poisons and blinds.
champions.scout.rainofdarts.desc=A rain of darts falls over a %1$dx%1$d area up to %2$d tiles away. The enemies inside take damage and are _poisoned_ and _blinded_.
champions.scout.rainofdarts.desc_numbers=Damage %1$d-%2$d, poison %3$d turns, blindness %4$d turns.
champions.scout.rainofdarts.cost=Charge cost: _%d_
champions.scout.rainofdarts.prompt=Choose where the rain falls

champions.pyromancer.supernova.name=supernova
champions.pyromancer.supernova.short_desc=The Pyromancer bursts into a _nova_ of flames that burns the enemies around her.
champions.pyromancer.supernova.desc=The Pyromancer bursts into flames around her (%1$d tiles): the enemies take damage and _catch fire_. Allies are not hurt. It counts as a damaging ability for Pyromania.
champions.pyromancer.supernova.desc_numbers=Damage %1$d-%2$d.
champions.pyromancer.supernova.cost=Charge cost: _%d_

champions.gravedigger.headstone.name=headstone
champions.gravedigger.headstone.short_desc=A huge _headstone_ falls on a spot, crushing and stunning the enemies.
champions.gravedigger.headstone.desc=A heavy headstone falls on a spot up to %2$d tiles away. The enemies in a %1$dx%1$d area take damage and are _stunned_.
champions.gravedigger.headstone.desc_numbers=Damage %1$d-%2$d, stunned %3$d turns.
champions.gravedigger.headstone.cost=Charge cost: _%d_
champions.gravedigger.headstone.prompt=Choose where the headstone falls
