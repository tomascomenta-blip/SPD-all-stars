items.armor.executionerarmor.name=executioner's armor
items.armor.executionerarmor.desc=While wearing this armor, the Executioner can perform a special ability.
items.armor.scoutarmor.name=scout's armor
items.armor.scoutarmor.desc=While wearing this armor, the Scout can perform a special ability.
items.armor.pyromancerarmor.name=pyromancer's robe
items.armor.pyromancerarmor.desc=While wearing this robe, the Pyromancer can perform a special ability.
items.armor.jailerarmor.name=jailer's armor
items.armor.jailerarmor.desc=While wearing this armor, the Jailer can perform a special ability.
items.armor.brawlerarmor.name=brawler's vest
items.armor.brawlerarmor.desc=While wearing this vest, the Brawler can perform a special ability.
