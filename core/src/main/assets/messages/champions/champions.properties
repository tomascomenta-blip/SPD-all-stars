###Executioner
champions.executioner.executionerkit.name=executioner's emblem
champions.executioner.executionerkit.desc=An emblem of black iron and red cloth, marked by a thousand battles. While you carry it you can use the Executioner's techniques.
champions.executioner.executioneraxe.name=executioner's axe
champions.executioner.executioneraxe.desc=A heavy one-handed axe, somewhat chipped. Its blows leave wounds that won't stop bleeding.
champions.executioner.decimate.name=decimate
champions.executioner.decimate.desc=Spins the axe and hits every enemy %1$s. Heals _%2$d%%_ of his missing health for every enemy hit (up to 3).
champions.executioner.decimate.desc_short=hits every enemy around and heals for each one.
champions.executioner.decimate.radius1=next to him
champions.executioner.decimate.radius2=within 2 tiles
champions.executioner.decimate.no_target=There are no enemies around you.
champions.executioner.cripplingstrike.name=crippling strike
champions.executioner.cripplingstrike.desc=Readies the axe (takes no time). His next melee hit deals _50%% more damage_, _cripples_ for 3 turns and adds _%d_ stacks of hemorrhage.
champions.executioner.cripplingstrike.desc_short=the next hit deals more damage, cripples and bleeds.
champions.executioner.cripplingstrike$primed.name=crippling strike ready
champions.executioner.cripplingstrike$primed.desc=Your next melee hit will deal more damage, cripple and bleed.\n\nTurns remaining: %s.
champions.executioner.apprehend.name=apprehend
champions.executioner.apprehend.desc=Hooks the first enemy in line, up to _%1$d tiles_ away, with the axe and drags it next to him. It is _crippled for %2$d turns_.
champions.executioner.apprehend.desc_short=drags an enemy to the Executioner.
champions.executioner.apprehend.prompt=Choose whom to catch
champions.executioner.apprehend.no_target=There is no enemy in that line.
champions.executioner.guillotine.name=guillotine
champions.executioner.guillotine.desc=Leaps on an enemy up to _%1$d tiles_ away and strikes a blow that ignores armor: _%2$d damage_, increased by 20%% for every stack of hemorrhage (up to _%3$d_). _If it kills, the Guillotine resets._
champions.executioner.guillotine.desc_short=leaps and finishes off; a kill resets it.
champions.executioner.guillotine.prompt=Choose whom to execute
champions.executioner.guillotine.no_target=There is no enemy there.
champions.executioner.guillotine.no_space=There is no room to land next to that enemy.
champions.executioner.guillotine.executed=Executed!
champions.executioner.hemorrhage.name=hemorrhage
champions.executioner.hemorrhage.desc=This character is bleeding from the Executioner's wounds.\n\nStacks: _%1$d_ of 5\nDamage per turn: _%2$d_\nIt heals in _%3$d turns_ if it isn't wounded again.
champions.executioner.hemorrhage$executionermight.name=executioner's might!
champions.executioner.hemorrhage$executionermight.desc=The Executioner is unleashed: his melee hits deal 15%% more damage and apply maximum hemorrhage.\n\nTurns remaining: %s.

###Scout
champions.scout.scoutkit.name=scout's hat
champions.scout.scoutkit.desc=A green scout's hat with a brown band. Never underestimate the power of the scout's code.
champions.scout.blowgun.name=blowgun
champions.scout.blowgun.ac_shoot=SHOOT
champions.scout.blowgun.prompt=Choose a target
champions.scout.blowgun.desc=A light reed blowgun. It never runs out of darts, and all of them are coated in poison.
champions.scout.blowgun.stats=The blowgun can't be upgraded directly: it grows stronger as you level up. Right now its darts deal _%1$d-%2$d damage_ (plus the poison) and require _%3$d strength_.
champions.scout.blowgun$blowdart.name=poison dart
champions.scout.blowgun$blowdart.desc=A tiny dart with a purple tip.
champions.scout.blindingdart.name=blinding dart
champions.scout.blindingdart.desc=Shoots a dart at an enemy up to 6 tiles away: it deals _%1$d-%2$d damage_ and _blinds it for %3$d turns_.
champions.scout.blindingdart.desc_bounce=It bounces to _%d_ more nearby enemy(ies).
champions.scout.blindingdart.desc_short=damages and blinds an enemy from afar.
champions.scout.blindingdart.prompt=Choose a target
champions.scout.blindingdart.no_target=There is no enemy in that line.
champions.scout.movequick.name=move quick
champions.scout.movequick.desc=Breaks into a run: gains _%d turns of haste_. It takes no time and doesn't break camouflage.
champions.scout.movequick.desc_short=gains haste without spending a turn.
champions.scout.toxicshot.name=toxic shot
champions.scout.toxicshot.desc=_Passive._ Every hit of the Scout, melee or ranged, _poisons_ the enemy for _%d turns_.
champions.scout.toxicshot.desc_short=his hits poison.
champions.scout.noxioustrap.name=noxious trap
champions.scout.noxioustrap.desc=Plants a poisonous mushroom up to _%1$d tiles_ away. Allies can step on it safely; when an enemy steps on it, it explodes, damaging, poisoning and crippling nearby enemies.\n\nMushrooms: _%2$d of %3$d_. He gets one back every _%4$d turns_.
champions.scout.noxioustrap.desc_short=plants mushrooms that explode on enemies.
champions.scout.noxioustrap.prompt=Choose where to plant the mushroom
champions.scout.noxioustrap.no_charges=no mushrooms
champions.scout.noxioustrap.bad_cell=A mushroom can't be planted there.
champions.scout.noxioustrap$charges.name=mushrooms
champions.scout.noxioustrap$charges.desc=Poisonous mushrooms ready to plant: _%1$d of %2$d_.
champions.scout.noxiousshroom.name=poisonous mushroom
champions.scout.noxiousshroom.desc=A spotted purple mushroom planted by the Scout. It will burst into a cloud of poison when an enemy steps on it; allies can step on it safely.
champions.scout.camouflage.name=camouflage
champions.scout.camouflage.desc=The Scout has stood so still that nobody sees him.\n\nEnemies can't see him as long as he doesn't move or attack.
champions.scout.camouflage$ambush.name=ambush
champions.scout.camouflage$ambush.desc=The Scout's next hit will deal extra damage.\n\nTurns remaining: %s.

###Pyromancer
champions.pyromancer.pyromancerkit.name=Ember's plush
champions.pyromancer.pyromancerkit.desc=A patched teddy bear with a button for an eye. It's warm... a little too warm.
champions.pyromancer.disintegrate.name=disintegrate
champions.pyromancer.disintegrate.desc=Throws a fireball at an enemy up to 6 tiles away: _%1$d-%2$d damage_. _If it kills, the cooldown is refunded._
champions.pyromancer.disintegrate.desc_short=a fireball; refunded on a kill.
champions.pyromancer.disintegrate.prompt=Choose a target
champions.pyromancer.disintegrate.no_target=There is no enemy in that line.
champions.pyromancer.disintegrate.refund=Recharged!
champions.pyromancer.incinerate.name=incinerate
champions.pyromancer.incinerate.desc=Casts a cone of fire _%1$d tiles_ long and _%2$d°_ wide that deals _%3$d-%4$d damage_ and sets enemies on fire. It doesn't hurt allies.
champions.pyromancer.incinerate.desc_short=a cone of fire that burns enemies.
champions.pyromancer.incinerate.prompt=Choose the direction of the fire
champions.pyromancer.moltenshield.name=molten shield
champions.pyromancer.moltenshield.desc=Wraps the Pyromancer or an ally up to 4 tiles away in flames: they gain _%1$d shielding_ and, for 6 turns, whoever hits them in melee takes _%2$d damage_ and catches fire.
champions.pyromancer.moltenshield.desc_short=a fire shield for herself or an ally.
champions.pyromancer.moltenshield.prompt=Choose whom to protect (or yourself)
champions.pyromancer.moltenshield$burnback.name=molten shield
champions.pyromancer.moltenshield$burnback.desc=A shield of flames surrounds this character. Whoever hits it in melee takes %1$d damage and catches fire.\n\nTurns remaining: %2$s.
champions.pyromancer.summonbear.name=Ember!
champions.pyromancer.summonbear.desc=Drops Ember up to _%1$d tiles_ away: the impact deals _%2$d-%3$d damage_ and sets nearby enemies on fire. Ember (_%4$d HP_) fights by her side for 30 turns and burns the enemies next to it. While it lives, using this ability tells it where to go or whom to attack.
champions.pyromancer.summonbear.desc_tamer=The Tamer keeps it until it is defeated.
champions.pyromancer.summonbear.desc_short=summons a fire bear that fights with her.
champions.pyromancer.summonbear.prompt=Choose where (or, if it is out, where Ember goes)
champions.pyromancer.summonbear.no_space=There is no room for Ember there.
champions.pyromancer.emberbear.name=Ember
champions.pyromancer.emberbear.desc=A huge bear made of plush, patches and living fire. It burns every enemy next to it: _%d damage_ per turn.
champions.pyromancer.emberbear.desc_time=It will fade in %d turns.
champions.pyromancer.emberbear.desc_forever=It will stay until it is defeated.
champions.pyromancer.emberbear.fades=Ember goes out and turns back into a plush.
champions.pyromancer.emberbear.direct_defend=Ember heads there.
champions.pyromancer.emberbear.direct_follow=Ember will follow you.
champions.pyromancer.emberbear.direct_attack=Ember will attack!
champions.pyromancer.pyromania.name=pyromania
champions.pyromancer.pyromania.charged=Pyromania!
champions.pyromancer.pyromania.desc=After using %1$d abilities, the next damaging ability stuns its targets.\n\nStacks: _%2$d of %3$d_.\n\nThe Pyromancer also resists fire.
champions.pyromancer.pyromania.desc_charged=_Ready!_ Your next damaging ability will stun.

###Jailer
champions.jailer.jailerkit.name=jailer's lantern
champions.jailer.jailerkit.desc=A dark iron lantern. Inside, a green light stirs as if it were full of something alive.
champions.jailer.chainsickle.name=chained sickle
champions.jailer.chainsickle.desc=A sickle tied to a long chain. It reaches enemies 2 tiles away, although it hits a bit softer than a sword.
champions.jailer.soul.name=soul
champions.jailer.soul.desc=A floating lost soul, waiting for the Jailer to gather it into his lantern.
champions.jailer.soul.not_jailer=Only the Jailer can gather souls.
champions.jailer.deathsentence.name=death sentence
champions.jailer.deathsentence.desc=Throws the chained sickle: the first enemy in line up to _%1$d tiles_ away takes _%2$d-%3$d damage_, is dragged next to him and is crippled for 2 turns.
champions.jailer.deathsentence.desc_short=hooks an enemy and drags it in.
champions.jailer.deathsentence.prompt=Choose whom to sentence
champions.jailer.deathsentence.no_target=There is no enemy in that line.
champions.jailer.darkpassage.name=dark passage
champions.jailer.darkpassage.desc=Throws the lantern to a cell up to _%1$d tiles_ away. If an ally is there or next to it (like your partner!), it is pulled next to the Jailer. Both gain _%2$d shielding_.
champions.jailer.darkpassage.desc_short=brings an ally to your side and shields you both.
champions.jailer.darkpassage.prompt=Choose where to throw the lantern
champions.jailer.darkpassage.rescued=The lantern rescues %s!
champions.jailer.flay.name=flay
champions.jailer.flay.desc=Sweeps the chain around: adjacent enemies take _%1$d-%2$d damage_, are knocked back _%3$d tiles_ and are crippled for 2 turns.
champions.jailer.flay.desc_short=hits and pushes away enemies around.
champions.jailer.flay.no_target=There are no enemies around you.
champions.jailer.thebox.name=the box
champions.jailer.thebox.desc=Raises a square of spectral walls 2 tiles away that lasts _%1$d turns_. Every enemy stepping on a wall breaks it, takes _%2$d damage_ and is _slowed for %3$d turns_.
champions.jailer.thebox.desc_short=traps enemies inside walls that hurt and slow.
champions.jailer.thebox$soulwall.desc=A wall of lost souls. Enemies crossing it will break it, but they will suffer for it.
champions.jailer.damnation.name=damnation
champions.jailer.damnation.soul=Soul! (%d)
champions.jailer.damnation.desc=Souls gathered: _%1$d_.\n\nExtra armor: _0-%2$d_ (1 for every 4 souls).\nExtra ability damage: _+%3$d_ (1 for every 10 souls).

###Brawler
champions.brawler.brawlerkit.name=champion's belt
champions.brawler.brawlerkit.desc=A golden belt, won with fists in the pit. It weighs more than it looks.
champions.brawler.brassknuckles.name=brass knuckles
champions.brawler.brassknuckles.desc=Golden knuckle dusters, worn from use. They turn every punch into a serious blow.
champions.brawler.knuckledown.name=knuckle down
champions.brawler.knuckledown.desc=Gets ready (takes no time): his next two punches deal extra damage equal to _1 + %1$d%%_ of the target's max health (half against bosses).
champions.brawler.knuckledown.desc_short=two punches that hurt based on the enemy's health.
champions.brawler.knuckledown$knuckles.name=knuckle down
champions.brawler.knuckledown$knuckles.desc=The next %1$d punches will deal extra damage.\n\nTurns remaining: %2$s.
champions.brawler.haymaker.name=haymaker
champions.brawler.haymaker.desc=Releases all his grit in a huge punch: enemies in a _%1$d tile_ cone take _%2$d-%3$d damage_ plus half the grit (_%4$d_ now), 50%% more in the middle line. Then he gains shielding equal to _%5$d%%_ of the spent grit.
champions.brawler.haymaker.desc_short=turns grit into damage and shielding.
champions.brawler.haymaker.prompt=Choose the direction of the punch
champions.brawler.facebreaker.name=facebreaker
champions.brawler.facebreaker.desc=Grabs every enemy up to _%1$d tiles_ away and smashes them together: _%2$d-%3$d damage_. If there were enemies _on both sides_, all of them are _stunned for 2 turns_; otherwise they are crippled.
champions.brawler.facebreaker.desc_short=pulls enemies in; stuns if they were on both sides.
champions.brawler.facebreaker.no_target=There are no enemies nearby.
champions.brawler.showstopper.name=the show stopper
champions.brawler.showstopper.desc=Leaps on an enemy up to _%1$d tiles_ away, grabs it and slams it into the ground: _%2$d damage_ plus 15%% of its max health (5%% against bosses), and it is stunned for 1 turn. Nearby enemies take _%3$d%%_ of the base damage.
champions.brawler.showstopper.desc_short=grabs an enemy and slams it into the ground.
champions.brawler.showstopper.prompt=Choose whom to slam
champions.brawler.showstopper.no_target=There is no enemy there.
champions.brawler.showstopper.no_space=There is no room to land next to that enemy.
champions.brawler.pitgrit.name=grit
champions.brawler.pitgrit.desc=The Brawler turns the damage he takes into grit, which his Haymaker turns into damage and shielding. It slowly fades after a few turns without being hit.\n\nGrit: _%1$d of %2$d_.\n\nEvery second punch hits harder, and the more hurt he is, the faster he heals.

