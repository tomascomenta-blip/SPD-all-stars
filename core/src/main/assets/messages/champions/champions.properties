###new heroes

###classes
actors.hero.heroclass.executioner=executioner
actors.hero.heroclass.executioner_desc_short=The _Executioner_ makes his enemies bleed with every swing. At five wounds his _might_ is unleashed, and his _Guillotine_ finishes off whoever bleeds.
actors.hero.heroclass.executioner_desc=He was the prison's headsman until the prisoners took over its halls; now he goes down with his axe to finish the job. The Executioner starts with an _executioner's emblem_, which grants four abilities: _Decimate_, _Crippling Strike_, _Apprehend_ and the _Guillotine_ (from level 6).\n\nHis melee hits cause stacking _hemorrhage_ (up to 5). At 5 stacks on an enemy he gains the _executioner's might_: more damage, and every hit applies maximum hemorrhage.\n\nHe also starts with an _executioner's axe_, cloth armor, a waterskin and a velvet pouch.\n\nAutomatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Terror
actors.hero.heroclass.executioner_unlock=The champions are unlocked from the start.

actors.hero.heroclass.scout=scout
actors.hero.heroclass.scout_desc_short=The _Scout_ poisons with every hit, _camouflages_ himself when standing still and fills the dungeon with _poisonous mushrooms_.
actors.hero.heroclass.scout_desc=A scout of the city watch, small and slippery, who has spent years mapping the sewers and knows every mushroom in the dungeon. The Scout starts with a _scout's hat_, which grants _Blinding Dart_, _Move Quick_ and _poisonous mushrooms_ (from level 6).\n\nAll his hits _poison_ (Toxic Shot). If he stays still for a few turns, he _blends in_ and becomes invisible until he moves or attacks.\n\nHe also starts with a _blowgun_ with endless darts, a _dagger_, cloth armor, a waterskin and a velvet pouch.\n\nAutomatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Toxic Gas\n_-_ Scrolls of Teleportation
actors.hero.heroclass.scout_unlock=The champions are unlocked from the start.

actors.hero.heroclass.pyromancer=pyromancer
actors.hero.heroclass.pyromancer_desc_short=The _Pyromancer_ throws fireballs and cones of fire, protects with a _molten shield_ and summons _Ember_, her fire bear. Every few spells, the next one _stuns_.
actors.hero.heroclass.pyromancer_desc=A girl raised among the city's fire mages; nobody knows where Ember came from, but the bear never leaves her side. The Pyromancer starts with _Ember's plush_, which grants _Disintegrate_, _Incinerate_, _Molten Shield_ and summoning _Ember_ (from level 6).\n\nHer passive, _pyromania_, makes the next damaging ability _stun_ its targets after 4 abilities. She also resists fire.\n\nShe also starts with _gloves_, cloth armor, a waterskin and a velvet pouch.\n\nAutomatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Liquid Flame\n_-_ Scrolls of Recharging
actors.hero.heroclass.pyromancer_unlock=The champions are unlocked from the start.

actors.hero.heroclass.jailer=jailer
actors.hero.heroclass.jailer_desc_short=The _Jailer_ drags enemies with his chain, rescues allies with his _lantern_ and grows tougher with every _soul_ he gathers.
actors.hero.heroclass.jailer_desc=The old jailer of the prison still walks his rounds with his lantern, and in it he keeps the souls of those who fall in the dungeon. The Jailer starts with a _lantern_, which grants _Death Sentence_, _Dark Passage_, _Flay_ and _The Box_ (from level 6).\n\nEnemies dying near him may leave a _soul_. Only he can gather them, by stepping on them: every soul grants _permanent armor_ and strengthens his abilities.\n\nHe also starts with a _chained sickle_ that reaches 2 tiles, cloth armor, a waterskin and a velvet pouch.\n\nAutomatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Paralytic Gas\n_-_ Scrolls of Retribution
actors.hero.heroclass.jailer_unlock=The champions are unlocked from the start.

actors.hero.heroclass.brawler=brawler
actors.hero.heroclass.brawler_desc_short=The _Brawler_ turns the damage he takes into _grit_ and releases it in a devastating punch that also shields him. He fights with his fists, alternating blows.
actors.hero.heroclass.brawler_desc=Unbeaten champion of the city's fighting pits, he goes down into the dungeon looking for opponents who can last more than one round. The Brawler starts with a _champion's belt_, which grants _Knuckle Down_, _Haymaker_, _Facebreaker_ and _The Show Stopper_ (from level 6).\n\nThe damage he takes becomes _grit_, which his Haymaker turns into damage and shielding. Every second punch hits harder, and he heals faster the more hurt he is.\n\nHe also starts with _brass knuckles_, cloth armor, a waterskin and a velvet pouch.\n\nAutomatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Healing\n_-_ Scrolls of Rage
actors.hero.heroclass.brawler_unlock=The champions are unlocked from the start.

###subclasses
actors.hero.herosubclass.conqueror=conqueror
actors.hero.herosubclass.conqueror_short_desc=The _Conqueror_ reaches more enemies with Decimate and heals while the executioner's might lasts.
actors.hero.herosubclass.conqueror_desc=Decimate reaches enemies _2 tiles_ away.\n\nWhen the executioner's might activates he heals _15% of his missing health_, and while it lasts he heals _20% of the melee damage_ he deals.
actors.hero.herosubclass.headsman=headsman
actors.hero.herosubclass.headsman_short_desc=The _Headsman_ finishes off weakened enemies and uses the Guillotine more often.
actors.hero.herosubclass.headsman_desc=His melee hits _execute_ enemies left below _10% health_ (not bosses).\n\nThe Guillotine recharges _25% faster_.
actors.hero.herosubclass.trapper=trapper
actors.hero.herosubclass.trapper_short_desc=The _Trapper_ carries more mushrooms, recharges them twice as fast and they explode in a bigger area.
actors.hero.herosubclass.trapper_desc=He can carry _2 more mushrooms_, gets one back every _12 turns_ instead of 25, and his mushrooms explode in a _5x5_ area.
actors.hero.herosubclass.skirmisher=skirmisher
actors.hero.herosubclass.skirmisher_short_desc=The _Skirmisher_ shoots his blowgun twice as fast and his Blinding Dart bounces.
actors.hero.herosubclass.skirmisher_desc=His blowgun shoots in _half a turn_.\n\nBlinding Dart _bounces_ to another nearby enemy.
actors.hero.herosubclass.tamer=tamer
actors.hero.herosubclass.tamer_short_desc=The _Tamer_ summons a stronger Ember that doesn't fade with time.
actors.hero.herosubclass.tamer_desc=Ember has _50% more health and damage_ and stays with her _until defeated_.\n\nWhenever pyromania stuns, Ember gets angry and gains _3 turns of haste_.
actors.hero.herosubclass.infernalist=infernalist
actors.hero.herosubclass.infernalist_short_desc=The _Infernalist_ is immune to fire and burns those already on fire even more.
actors.hero.herosubclass.infernalist_desc=She is _immune to fire_.\n\nDisintegrate and Incinerate deal _20% more damage_ to burning enemies, and Incinerate has a wider cone (_90°_).
actors.hero.herosubclass.soulreaper=soul reaper
actors.hero.herosubclass.soulreaper_short_desc=The _Soul Reaper_ gets twice as many souls and heals with each one.
actors.hero.herosubclass.soulreaper_desc=The chance of an enemy leaving a soul is _doubled_, and every soul he gathers _heals 1 HP_.
actors.hero.herosubclass.lanternkeeper=lantern keeper
actors.hero.herosubclass.lanternkeeper_short_desc=The _Lantern Keeper_ rescues from farther away, more often and with twice the shield.
actors.hero.herosubclass.lanternkeeper_desc=Dark Passage recharges _40% faster_, reaches _3 tiles farther_, grants _twice the shield_ and _cleanses negative effects_ from the rescued ally.
actors.hero.herosubclass.pitboss=pit boss
actors.hero.herosubclass.pitboss_short_desc=The _Pit Boss_ stores more grit and gets more shield out of it.
actors.hero.herosubclass.pitboss_desc=He can store _50% more grit_, Haymaker's shield is _50% bigger_, and with his grit at half or more his punches deal _+2 damage_.
actors.hero.herosubclass.showman=showman
actors.hero.herosubclass.showman_short_desc=The _Showman_ uses his finisher more often and heals when finishing enemies with abilities.
actors.hero.herosubclass.showman_desc=The Show Stopper recharges _30% faster_ and Facebreaker always stuns for at least _1 turn_.\n\nWhen he kills an enemy with Haymaker, Facebreaker or The Show Stopper, he heals _10% of his max health_.

###Executioner talents
actors.hero.talent.exe_meal.title=war ration
actors.hero.talent.exe_meal.desc=_+1:_ Eating reduces the cooldowns of the Executioner's abilities by _3 turns_.\n\n_+2:_ Eating reduces them by _5 turns_.
actors.hero.talent.exe_intuition.title=executioner's eye
actors.hero.talent.exe_intuition.desc=_+1:_ The Executioner identifies melee weapons _1.75x faster_.\n\n_+2:_ He identifies them _2.5x faster_.
actors.hero.talent.exe_deep_wounds.title=deep wounds
actors.hero.talent.exe_deep_wounds.desc=_+1:_ Hemorrhage lasts _2 more turns_ without being refreshed.\n\n_+2:_ It lasts _4 more turns_.
actors.hero.talent.exe_thick_skin.title=thick skin
actors.hero.talent.exe_thick_skin.desc=_+1:_ Decimate grants the Executioner _2 shielding_ for each enemy hit.\n\n_+2:_ It grants _3 shielding_ for each enemy hit.
actors.hero.talent.exe_iron_resolve.title=iron resolve
actors.hero.talent.exe_iron_resolve.desc=_+1:_ When drinking or throwing a potion, the Executioner gains shielding equal to _5% of his max health_.\n\n_+2:_ He gains _8% of his max health_.
actors.hero.talent.exe_long_reach.title=long reach
actors.hero.talent.exe_long_reach.desc=_+1:_ Apprehend reaches _1 tile farther_ and cripples for _1 more turn_.\n\n_+2:_ _2 tiles farther_ and _2 more turns_.
actors.hero.talent.exe_cruel_blow.title=cruel blow
actors.hero.talent.exe_cruel_blow.desc=_+1:_ Crippling Strike applies _2 stacks_ of hemorrhage instead of 1.\n\n_+2:_ It applies _3 stacks_.
actors.hero.talent.exe_bloodlust.title=bloodlust
actors.hero.talent.exe_bloodlust.desc=_+1:_ When a bleeding enemy dies, the Executioner's cooldowns are reduced by _2 turns_.\n\n_+2:_ They are reduced by _3 turns_.
actors.hero.talent.exe_intimidate.title=terrifying presence
actors.hero.talent.exe_intimidate.desc=_+1:_ When the executioner's might activates, adjacent enemies are _weakened for 3 turns_.\n\n_+2:_ They are _weakened for 5 turns_.
actors.hero.talent.exe_sharp_guillotine.title=sharp blade
actors.hero.talent.exe_sharp_guillotine.desc=_+1:_ The Guillotine deals _10% more damage_.\n\n_+2:_ _20% more damage_.\n\n_+3:_ _30% more damage_.
actors.hero.talent.exe_relentless.title=relentless
actors.hero.talent.exe_relentless.desc=_+1:_ The executioner's might lasts _2 more turns_.\n\n_+2:_ _4 more turns_.\n\n_+3:_ _6 more turns_.
actors.hero.talent.cq_warlord.title=warlord
actors.hero.talent.cq_warlord.desc=_+1:_ While the executioner's might lasts, the Conqueror gains _0-2 armor_.\n\n_+2:_ _0-4 armor_.\n\n_+3:_ _0-6 armor_.
actors.hero.talent.cq_spin.title=whirlwind
actors.hero.talent.cq_spin.desc=_+1:_ Decimate applies _1 extra stack_ of hemorrhage to each enemy hit.\n\n_+2:_ _2 extra stacks_.\n\n_+3:_ _3 extra stacks_.
actors.hero.talent.cq_bloodfeast.title=blood feast
actors.hero.talent.cq_bloodfeast.desc=_+1:_ Decimate heals _4% more_ missing health for each enemy hit.\n\n_+2:_ _8% more_.\n\n_+3:_ _12% more_.
actors.hero.talent.hs_sentence.title=firm sentence
actors.hero.talent.hs_sentence.desc=_+1:_ The Headsman executes enemies below _13%_ health.\n\n_+2:_ Below _16%_.\n\n_+3:_ Below _19%_.
actors.hero.talent.hs_repeat.title=repeat offender
actors.hero.talent.hs_repeat.desc=_+1:_ When the Guillotine kills and resets, the Headsman gains _1 turn of haste_.\n\n_+2:_ _2 turns of haste_.\n\n_+3:_ _3 turns of haste_.
actors.hero.talent.hs_bloody_axe.title=bloody axe
actors.hero.talent.hs_bloody_axe.desc=_+1:_ Hemorrhage deals _1 extra damage_ per turn to enemies below half health.\n\n_+2:_ _2 extra damage_.\n\n_+3:_ _3 extra damage_.

###Scout talents
actors.hero.talent.sco_meal.title=scout's snack
actors.hero.talent.sco_meal.desc=_+1:_ Eating instantly _camouflages_ the Scout.\n\n_+2:_ Eating camouflages him and grants _2 turns of haste_.
actors.hero.talent.sco_intuition.title=sharp eye
actors.hero.talent.sco_intuition.desc=_+1:_ The Scout identifies thrown weapons and rings _2x faster_.\n\n_+2:_ He identifies them _3x faster_.
actors.hero.talent.sco_potent_venom.title=potent venom
actors.hero.talent.sco_potent_venom.desc=_+1:_ Toxic Shot poisons for _1 more turn_.\n\n_+2:_ For _2 more turns_.
actors.hero.talent.sco_blinding_eye.title=flash
actors.hero.talent.sco_blinding_eye.desc=_+1:_ Blinding Dart deals _+1 damage_ and blinds for _1 more turn_.\n\n_+2:_ _+2 damage_ and _2 more turns_.
actors.hero.talent.sco_fleet_foot.title=fleet foot
actors.hero.talent.sco_fleet_foot.desc=_+1:_ Move Quick lasts _1 more turn_.\n\n_+2:_ It lasts _2 more turns_.
actors.hero.talent.sco_quick_camo.title=quick camouflage
actors.hero.talent.sco_quick_camo.desc=_+1:_ The Scout blends in after standing still for _2 turns_ instead of 3.\n\n_+2:_ After _1 turn_.
actors.hero.talent.sco_more_shrooms.title=mushroom pouch
actors.hero.talent.sco_more_shrooms.desc=_+1:_ The Scout can carry _1 more mushroom_.\n\n_+2:_ _2 more mushrooms_.
actors.hero.talent.sco_liquid_camo.title=camouflage brew
actors.hero.talent.sco_liquid_camo.desc=_+1:_ When drinking or throwing a potion, the Scout blends in and gains _2 turns of haste_.\n\n_+2:_ He gains _3 turns of haste_.
actors.hero.talent.sco_keen_senses.title=keen senses
actors.hero.talent.sco_keen_senses.desc=_+1:_ The Scout senses characters within _2 tiles_ even if he can't see them.\n\n_+2:_ Within _3 tiles_.
actors.hero.talent.sco_big_shroom.title=giant mushrooms
actors.hero.talent.sco_big_shroom.desc=_+1:_ Mushrooms deal _15% more_ damage and poison.\n\n_+2:_ _30% more_.\n\n_+3:_ _45% more_.
actors.hero.talent.sco_ambush.title=ambush
actors.hero.talent.sco_ambush.desc=_+1:_ The first hit from camouflage (or up to 2 turns after leaving it) deals _20% more damage_.\n\n_+2:_ _40% more damage_.\n\n_+3:_ _60% more damage_.
actors.hero.talent.tr_bounce.title=bouncing mushrooms
actors.hero.talent.tr_bounce.desc=_+1:_ When it explodes, a mushroom has a _25%_ chance to sprout another one nearby (with half the chance to sprout again).\n\n_+2:_ _50%_ chance.\n\n_+3:_ _75%_ chance.
actors.hero.talent.tr_paralytic.title=paralytic spores
actors.hero.talent.tr_paralytic.desc=_+1:_ Mushrooms root enemies for _1 turn_.\n\n_+2:_ For _2 turns_.\n\n_+3:_ For _3 turns_.
actors.hero.talent.tr_long_throw.title=long throw
actors.hero.talent.tr_long_throw.desc=_+1:_ The Trapper plants mushrooms _1 tile farther_.\n\n_+2:_ _2 tiles farther_.\n\n_+3:_ _3 tiles farther_.
actors.hero.talent.sk_corrosive.title=corrosive venom
actors.hero.talent.sk_corrosive.desc=_+1:_ The Skirmisher's hits deal _10% more damage_ to poisoned enemies.\n\n_+2:_ _20% more_.\n\n_+3:_ _30% more_.
actors.hero.talent.sk_shadow_step.title=shadow step
actors.hero.talent.sk_shadow_step.desc=_+1:_ The Skirmisher can take _1 step_ without losing his camouflage.\n\n_+2:_ _2 steps_.\n\n_+3:_ _3 steps_.
actors.hero.talent.sk_ricochet.title=ricochet
actors.hero.talent.sk_ricochet.desc=_+1:_ Blinding Dart bounces _1 more time_.\n\n_+2:_ _2 more times_.\n\n_+3:_ _3 more times_.

###Pyromancer talents
actors.hero.talent.pyr_meal.title=fiery snack
actors.hero.talent.pyr_meal.desc=_+1:_ Eating grants the Pyromancer _1 stack_ of pyromania.\n\n_+2:_ _2 stacks_.
actors.hero.talent.pyr_intuition.title=arcane intuition
actors.hero.talent.pyr_intuition.desc=_+1:_ The Pyromancer identifies wands _2x faster_.\n\n_+2:_ _3x faster_.
actors.hero.talent.pyr_spark.title=spark
actors.hero.talent.pyr_spark.desc=_+1:_ Disintegrate deals _+1 damage_.\n\n_+2:_ _+2 damage_.
actors.hero.talent.pyr_warmth.title=warmth
actors.hero.talent.pyr_warmth.desc=_+1:_ Molten Shield grants _+2 shielding_.\n\n_+2:_ _+4 shielding_.
actors.hero.talent.pyr_fire_drinker.title=fire drinker
actors.hero.talent.pyr_fire_drinker.desc=_+1:_ When drinking or throwing a potion, the Pyromancer's cooldowns are reduced by _3 turns_.\n\n_+2:_ By _5 turns_.
actors.hero.talent.pyr_wide_flames.title=wide flames
actors.hero.talent.pyr_wide_flames.desc=_+1:_ Incinerate reaches _1 tile farther_.\n\n_+2:_ _2 tiles farther_.
actors.hero.talent.pyr_bear_hug.title=bear hug
actors.hero.talent.pyr_bear_hug.desc=_+1:_ Ember has _20% more health_.\n\n_+2:_ _40% more health_.
actors.hero.talent.pyr_early_spark.title=early spark
actors.hero.talent.pyr_early_spark.desc=_+1:_ Pyromania charges after _3 abilities_ instead of 4.\n\n_+2:_ Its stun also lasts _1 more turn_.
actors.hero.talent.pyr_ember_step.title=ember step
actors.hero.talent.pyr_ember_step.desc=_+1:_ Molten Shield grants _1 turn of haste_ to its target.\n\n_+2:_ _2 turns of haste_.
actors.hero.talent.pyr_combustion.title=combustion
actors.hero.talent.pyr_combustion.desc=_+1:_ Disintegrate deals _10% more damage_, and a kill reduces the other cooldowns by _1 turn_.\n\n_+2:_ _20% more_ and _2 turns_.\n\n_+3:_ _30% more_ and _3 turns_.
actors.hero.talent.pyr_scorched.title=scorched earth
actors.hero.talent.pyr_scorched.desc=_+1:_ Ember's burning aura deals _+1 damage_.\n\n_+2:_ _+2 damage_.\n\n_+3:_ _+3 damage_.
actors.hero.talent.tm_big_bear.title=big bear
actors.hero.talent.tm_big_bear.desc=_+1:_ Ember deals _10% more damage_.\n\n_+2:_ _20% more_.\n\n_+3:_ _30% more_.
actors.hero.talent.tm_bond.title=bond
actors.hero.talent.tm_bond.desc=_+1:_ The Tamer heals _10%_ of the damage Ember deals.\n\n_+2:_ _20%_.\n\n_+3:_ _30%_.
actors.hero.talent.tm_resummon.title=always together
actors.hero.talent.tm_resummon.desc=_+1:_ Summoning Ember recharges _15% faster_.\n\n_+2:_ _30% faster_.\n\n_+3:_ _45% faster_.
actors.hero.talent.in_pyroclasm.title=pyroclasm
actors.hero.talent.in_pyroclasm.desc=_+1:_ Disintegrate splashes _33%_ of its damage onto enemies adjacent to the target and sets them on fire.\n\n_+2:_ _67%_.\n\n_+3:_ _100%_.
actors.hero.talent.in_flashfire.title=flashfire
actors.hero.talent.in_flashfire.desc=_+1:_ Incinerate recharges _2 turns_ sooner.\n\n_+2:_ _4 turns_ sooner.\n\n_+3:_ _6 turns_ sooner.
actors.hero.talent.in_heartfire.title=heart of fire
actors.hero.talent.in_heartfire.desc=_+1:_ Every enemy that dies burning in sight heals the Infernalist for _2 HP_.\n\n_+2:_ _4 HP_.\n\n_+3:_ _6 HP_.

###Jailer talents
actors.hero.talent.jai_meal.title=warden's ration
actors.hero.talent.jai_meal.desc=_+1:_ Eating grants the Jailer _3 shielding_.\n\n_+2:_ _5 shielding_.
actors.hero.talent.jai_intuition.title=jailer's gaze
actors.hero.talent.jai_intuition.desc=_+1:_ The Jailer identifies armor _1.75x faster_.\n\n_+2:_ _2.5x faster_.
actors.hero.talent.jai_long_chain.title=long chain
actors.hero.talent.jai_long_chain.desc=_+1:_ Death Sentence reaches _1 tile farther_.\n\n_+2:_ _2 tiles farther_.
actors.hero.talent.jai_hungry_souls.title=hungry souls
actors.hero.talent.jai_hungry_souls.desc=_+1:_ The chance of an enemy leaving a soul rises by _10%_.\n\n_+2:_ By _20%_.
actors.hero.talent.jai_soul_mend.title=mending souls
actors.hero.talent.jai_soul_mend.desc=_+1:_ Every soul gathered heals the Jailer for _1 HP_.\n\n_+2:_ For _2 HP_.
actors.hero.talent.jai_heavy_lantern.title=heavy lantern
actors.hero.talent.jai_heavy_lantern.desc=_+1:_ Dark Passage's shield is _25% bigger_.\n\n_+2:_ _50% bigger_.
actors.hero.talent.jai_flay_force.title=brutal flay
actors.hero.talent.jai_flay_force.desc=_+1:_ Flay knocks enemies _1 tile farther_.\n\n_+2:_ _2 tiles farther_.
actors.hero.talent.jai_liquid_souls.title=soul elixir
actors.hero.talent.jai_liquid_souls.desc=_+1:_ When drinking or throwing a potion, the Jailer has a _50%_ chance to gain a soul.\n\n_+2:_ He always gains a soul.
actors.hero.talent.jai_wardens_gaze.title=warden's gaze
actors.hero.talent.jai_wardens_gaze.desc=_+1:_ The enemy caught by Death Sentence becomes _vulnerable for 2 turns_.\n\n_+2:_ For _3 turns_.
actors.hero.talent.jai_deaths_grip.title=death's grip
actors.hero.talent.jai_deaths_grip.desc=_+1:_ Death Sentence deals _15% more damage_.\n\n_+2:_ _30% more_.\n\n_+3:_ _45% more_.
actors.hero.talent.jai_prison.title=prison
actors.hero.talent.jai_prison.desc=_+1:_ The Box lasts _3 more turns_ and its walls deal _20% more damage_.\n\n_+2:_ _6 more turns_ and _40% more_.\n\n_+3:_ _9 more turns_ and _60% more_.
actors.hero.talent.sr_soul_armor.title=soul armor
actors.hero.talent.sr_soul_armor.desc=_+1:_ The armor granted by souls increases by _10%_.\n\n_+2:_ By _20%_.\n\n_+3:_ By _30%_.
actors.hero.talent.sr_reap.title=reap
actors.hero.talent.sr_reap.desc=_+1:_ Flay heals the Soul Reaper for _1 HP_ per enemy hit.\n\n_+2:_ _2 HP_ per enemy.\n\n_+3:_ _3 HP_ per enemy.
actors.hero.talent.sr_soul_flame.title=soul flame
actors.hero.talent.sr_soul_flame.desc=_+1:_ Death Sentence deals _+1 extra damage_ for every 10 souls.\n\n_+2:_ _+2 damage_ for every 10 souls.\n\n_+3:_ _+3 damage_ for every 10 souls.
actors.hero.talent.lk_light_ward.title=warding light
actors.hero.talent.lk_light_ward.desc=_+1:_ Dark Passage also heals the Lantern Keeper and the rescued ally for _3 HP_.\n\n_+2:_ _6 HP_.\n\n_+3:_ _9 HP_.
actors.hero.talent.lk_escape.title=escape route
actors.hero.talent.lk_escape.desc=_+1:_ If there is no ally next to the lantern, the Lantern Keeper teleports to it if it is _3 tiles_ away or less.\n\n_+2:_ _4 tiles_ or less.\n\n_+3:_ _5 tiles_ or less.
actors.hero.talent.lk_box_lantern.title=reinforced box
actors.hero.talent.lk_box_lantern.desc=_+1:_ The walls of The Box slow for _1 more turn_.\n\n_+2:_ _2 more turns_.\n\n_+3:_ _3 more turns_.

###Brawler talents
actors.hero.talent.bra_meal.title=champion's meal
actors.hero.talent.bra_meal.desc=_+1:_ Eating fills _25%_ of the Brawler's grit.\n\n_+2:_ It fills _50%_ of his grit.
actors.hero.talent.bra_intuition.title=fighter's eye
actors.hero.talent.bra_intuition.desc=_+1:_ The Brawler identifies melee weapons and armor _1.5x faster_.\n\n_+2:_ _2x faster_.
actors.hero.talent.bra_heavy_hands.title=heavy hands
actors.hero.talent.bra_heavy_hands.desc=_+1:_ Knuckle Down deals _1% more_ of the target's max health.\n\n_+2:_ _2% more_.
actors.hero.talent.bra_second_wind.title=second wind
actors.hero.talent.bra_second_wind.desc=_+1:_ The Brawler's extra regeneration when hurt increases by _50%_.\n\n_+2:_ By _100%_.
actors.hero.talent.bra_liquid_grit.title=liquid grit
actors.hero.talent.bra_liquid_grit.desc=_+1:_ When drinking or throwing a potion, the Brawler fills _20%_ of his grit.\n\n_+2:_ _30%_.
actors.hero.talent.bra_one_two.title=one-two
actors.hero.talent.bra_one_two.desc=_+1:_ The second punch of each pair deals _35%_ more damage instead of 25%.\n\n_+2:_ _45%_ more.
actors.hero.talent.bra_stubborn.title=stubborn
actors.hero.talent.bra_stubborn.desc=_+1:_ Grit takes _2 more turns_ to start fading.\n\n_+2:_ _4 more turns_.
actors.hero.talent.bra_footwork.title=footwork
actors.hero.talent.bra_footwork.desc=_+1:_ Knuckle Down grants _1 turn of haste_.\n\n_+2:_ _2 turns of haste_.
actors.hero.talent.bra_taunt.title=taunt
actors.hero.talent.bra_taunt.desc=_+1:_ Enemies hit by Facebreaker become _vulnerable for 2 turns_.\n\n_+2:_ For _3 turns_.
actors.hero.talent.bra_big_show.title=big show
actors.hero.talent.bra_big_show.desc=_+1:_ The Show Stopper deals _10% more damage_.\n\n_+2:_ _20% more_.\n\n_+3:_ _30% more_.
actors.hero.talent.bra_grit_shield.title=grit armor
actors.hero.talent.bra_grit_shield.desc=_+1:_ Haymaker's shield is _15% bigger_.\n\n_+2:_ _30% bigger_.\n\n_+3:_ _45% bigger_.
actors.hero.talent.pb_thick_hide.title=thick hide
actors.hero.talent.pb_thick_hide.desc=_+1:_ The Pit Boss gains _10% more_ grit from every hit taken.\n\n_+2:_ _20% more_.\n\n_+3:_ _30% more_.
actors.hero.talent.pb_iron_jaw.title=iron jaw
actors.hero.talent.pb_iron_jaw.desc=_+1:_ With his grit at half or more, the Pit Boss gains _0-2 armor_.\n\n_+2:_ _0-4 armor_.\n\n_+3:_ _0-6 armor_.
actors.hero.talent.pb_haymaker.title=coup de grace
actors.hero.talent.pb_haymaker.desc=_+1:_ Haymaker deals _10% more damage_.\n\n_+2:_ _20% more_.\n\n_+3:_ _30% more_.
actors.hero.talent.sm_crowd.title=the crowd roars
actors.hero.talent.sm_crowd.desc=_+1:_ The Show Stopper's impact deals _65%_ of its damage to surrounding enemies instead of 50%.\n\n_+2:_ _80%_.\n\n_+3:_ _95%_.
actors.hero.talent.sm_encore.title=encore!
actors.hero.talent.sm_encore.desc=_+1:_ If The Show Stopper kills its target, its cooldown is reduced by _25%_.\n\n_+2:_ By _50%_.\n\n_+3:_ By _75%_.
actors.hero.talent.sm_flashy.title=flashy
actors.hero.talent.sm_flashy.desc=_+1:_ Facebreaker recharges _2 turns_ sooner.\n\n_+2:_ _4 turns_ sooner.\n\n_+3:_ _6 turns_ sooner.

