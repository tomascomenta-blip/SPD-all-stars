#Guardian

###class
actors.hero.heroclass.guardian=guardian
actors.hero.heroclass.guardian_desc_short=The _Guardian_, curator of the sands, heals with every blow and finishes enemies off with his _Siphoning Strike_, which grows stronger with every kill: he gathers power for the whole run.
actors.hero.heroclass.guardian_desc=A curator of the sands, asleep for centuries in a crypt beneath the city, he awoke when the evil of the dungeon began to grow. The Guardian starts with a _sand hourglass_, which grants _Siphoning Strike_, _Wither_, _Spirit Fire_ and _Fury of the Sands_ (from level 6).\n\nHis passive, _Soul Eater_, heals him for _8%_ of the melee damage he deals. Every enemy he finishes off with Siphoning Strike grants _permanent stacks_ (more for champions, minibosses and bosses), and every 4 stacks make his Siphoning Strike deal 1 more damage for the rest of the run.\n\nHe also starts with a _staff of the sands_, cloth armor, a waterskin, and a velvet pouch.\n\nThe Guardian automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Haste\n_-_ Scrolls of Rage
actors.hero.heroclass.guardian_unlock=The champions are unlocked from the start.

###subclasses
actors.hero.herosubclass.curator=curator
actors.hero.herosubclass.curator_short_desc=The _Curator_ gets more damage out of his stacks and heals whenever he gains one.
actors.hero.herosubclass.curator_desc=Siphoning Strike deals 1 extra damage for every _3 stacks_ instead of every 4, and every stack he gains _heals 2 HP_.
actors.hero.herosubclass.colossus=colossus
actors.hero.herosubclass.colossus_short_desc=The _Colossus_ unleashes the Fury of the Sands more often, for longer, and grows even bigger.
actors.hero.herosubclass.colossus_desc=Fury of the Sands recharges _25% faster_ and lasts _5 more turns_. During the Fury, the Colossus is even bigger.

###Guardian talents
actors.hero.talent.gua_meal.title=desert ration
actors.hero.talent.gua_meal.desc=_+1:_ Eating resets the cooldown of _Siphoning Strike_.\n\n_+2:_ Eating also grants the Guardian _1 stack_.
actors.hero.talent.gua_intuition.title=curator's eye
actors.hero.talent.gua_intuition.desc=_+1:_ The Guardian identifies melee weapons _1.75x faster_.\n\n_+2:_ _2.5x faster_.
actors.hero.talent.gua_sand_skin.title=sand skin
actors.hero.talent.gua_sand_skin.desc=_+1:_ Below half health, the Guardian gains _1-2 armor_.\n\n_+2:_ _2-4 armor_.
actors.hero.talent.gua_hungry_staff.title=hungry staff
actors.hero.talent.gua_hungry_staff.desc=_+1:_ Siphoning Strike deals _+2 damage_.\n\n_+2:_ _+4 damage_.
actors.hero.talent.gua_liquid_sand.title=liquid sand
actors.hero.talent.gua_liquid_sand.desc=_+1:_ Drinking or throwing a potion reduces the Guardian's cooldowns by _3 turns_.\n\n_+2:_ By _5 turns_.
actors.hero.talent.gua_long_wither.title=centuries of dust
actors.hero.talent.gua_long_wither.desc=_+1:_ Wither lasts _2 more turns_.\n\n_+2:_ _4 more turns_, and it also leaves the enemy _hexed_: it hits and dodges 20% less.
actors.hero.talent.gua_hot_spirit.title=burning spirit
actors.hero.talent.gua_hot_spirit.desc=_+1:_ Spirit Fire deals _20% more damage_.\n\n_+2:_ _40% more damage_, and it covers a _5x5_ area.
actors.hero.talent.gua_life_drain.title=thirst for souls
actors.hero.talent.gua_life_drain.desc=_+1:_ Soul Eater heals _11%_ of melee damage instead of 8%.\n\n_+2:_ _14%_.
actors.hero.talent.gua_collector.title=collector
actors.hero.talent.gua_collector.desc=_+1:_ Finishing off with Siphoning Strike an enemy worth _10 or more experience_, a champion or a miniboss grants _1 extra stack_; a boss, _2 more_.\n\n_+2:_ _2 extra stacks_; a boss, _4 more_.
actors.hero.talent.gua_eternal.title=eternal sands
actors.hero.talent.gua_eternal.desc=_+1:_ Fury of the Sands lasts _3 more turns_.\n\n_+2:_ _6 more turns_.\n\n_+3:_ _9 more turns_.
actors.hero.talent.gua_duststorm.title=dust storm
actors.hero.talent.gua_duststorm.desc=_+1:_ The storm of the Fury takes _1% more_ of the max health of adjacent enemies every turn (3% in total), and its cap against bosses rises by 1.\n\n_+2:_ _2% more_ (4%), and the cap rises by 2.\n\n_+3:_ _3% more_ (5%), and the cap rises by 3.
actors.hero.talent.cu_archive.title=endless archive
actors.hero.talent.cu_archive.desc=_+1:_ Every enemy finished off with Siphoning Strike has a _20%_ chance to grant _1 extra stack_.\n\n_+2:_ _40%_.\n\n_+3:_ _60%_.
actors.hero.talent.cu_quick_siphon.title=quick siphon
actors.hero.talent.cu_quick_siphon.desc=_+1:_ Siphoning Strike recharges _1 turn_ sooner.\n\n_+2:_ _2 turns_ sooner.\n\n_+3:_ _3 turns_ sooner.
actors.hero.talent.cu_spirit_tax.title=spirit tax
actors.hero.talent.cu_spirit_tax.desc=_+1:_ Enemies burning in Spirit Fire are _weakened_ (they deal 33% less damage) while they stay inside and for _1 turn_ after.\n\n_+2:_ For up to _3 turns_ after.\n\n_+3:_ For up to _5 turns_ after.
actors.hero.talent.co_giant.title=desert giant
actors.hero.talent.co_giant.desc=_+1:_ Fury of the Sands grants the Colossus _10% more_ max health (50% in total) and makes him even bigger.\n\n_+2:_ _20% more_ (60%).\n\n_+3:_ _30% more_ (70%).
actors.hero.talent.co_unbroken.title=unbroken
actors.hero.talent.co_unbroken.desc=_+1:_ During the Fury, the Colossus reduces the damage of every hit he takes by _1_, plus 1 for every 12 levels.\n\n_+2:_ By _2_, plus 2 for every 12 levels.\n\n_+3:_ By _3_, plus 3 for every 12 levels.
actors.hero.talent.co_withering_steps.title=withering steps
actors.hero.talent.co_withering_steps.desc=_+1:_ During the Fury, the Colossus' melee hits _wither_ the enemy (slowed and weakened) for _2 turns_.\n\n_+2:_ For _3 turns_.\n\n_+3:_ For _4 turns_.

###items
champions.guardian.guardiankit.name=sand hourglass
champions.guardian.guardiankit.desc=A bronze hourglass engraved with the head of a jackal. The sand falls slowly, grain by grain, like the souls it keeps. While you carry it, you can use the techniques of the Guardian.
champions.guardian.sandstaff.name=staff of the sands
champions.guardian.sandstaff.desc=A long staff of dark wood crowned with a bronze crescent. It hits solidly, if a bit softer than a sword.
items.armor.guardianarmor.name=guardian's armor
items.armor.guardianarmor.desc=While wearing this armor, the Guardian can perform a special ability.

###passive
champions.guardian.souleater.name=soul eater
champions.guardian.souleater.stack=+%1$d (%2$d)
champions.guardian.souleater.desc=The Guardian's melee hits heal him for _%1$d%%_ of the damage they deal.\n\nStacks: _%2$d_. He gains them by finishing enemies off with Siphoning Strike, and never loses them.\nExtra damage of Siphoning Strike from stacks: _+%3$d_.

###abilities
champions.guardian.siphoningstrike.name=siphoning strike
champions.guardian.siphoningstrike.desc=Readies the staff (takes no time): his next melee hit deals _%1$d extra damage_ (2 + half his level + 1 for every %3$d stacks). _If that hit kills_, he gains permanent stacks: _1_ for a normal enemy, _%4$d_ for a champion or miniboss and _%5$d_ for a boss. Enemies that give no experience don't count.\n\nStacks: _%2$d_.
champions.guardian.siphoningstrike.desc_short=the next hit deals more damage; if it kills, gain stacks forever.
champions.guardian.siphoningstrike$primed.name=siphoning strike ready
champions.guardian.siphoningstrike$primed.desc=The Guardian's next melee hit will deal _%1$d extra damage_ and, if it kills, grant him stacks.\n\nTurns remaining: %2$s.
champions.guardian.wither.name=wither
champions.guardian.wither.desc=Ages an enemy up to _%1$d tiles_ away: it is _slowed_ (it does everything, attacking included, at half speed) and _weakened_ (it deals 33%% less damage) for _%2$d turns_. Against bosses it lasts half as long.
champions.guardian.wither.desc_hex=It is also _hexed_: it hits and dodges 20% less.
champions.guardian.wither.desc_short=slows and weakens an enemy.
champions.guardian.wither.prompt=Choose whom to wither
champions.guardian.wither.no_target=There is no enemy there.
champions.guardian.wither.withered=Withered!
champions.guardian.spiritfire.name=spirit fire
champions.guardian.spiritfire.desc=Lights spirit fire up to _%1$d tiles_ away: a _%2$dx%3$d_ area that burns for _%4$d turns_. Every turn, enemies inside take _%5$d-%6$d damage_ and get their armor burned: while they stay scorched, the Guardian's melee hits deal _+%7$d damage_ to them. It doesn't hurt allies.
champions.guardian.spiritfire.desc_tax=They are also _weakened_ while they burn and for up to _%d turns_ after.
champions.guardian.spiritfire.desc_short=an area of fire that hurts and burns armor away.
champions.guardian.spiritfire.prompt=Choose where to light the fire
champions.guardian.spiritfire.bad_cell=You can't light a fire there.
champions.guardian.spiritfire$flames.desc=Violet flames burn here without consuming anything. They burn the Guardian's enemies.
champions.guardian.spiritfire$scorched.name=scorched
champions.guardian.spiritfire$scorched.desc=Spirit fire has burned this character's armor away: the Guardian's melee hits deal _%1$d extra damage_ to it.\n\nTurns remaining: %2$s.
champions.guardian.furyofsands.name=fury of the sands
champions.guardian.furyofsands.desc=The Guardian becomes a giant of the desert for _%1$d turns_: he gains _%2$d%%_ max health (and heals that difference), _0-%6$d armor_, and his Siphoning Strike recharges _twice as fast_. A sandstorm takes _%3$d + %4$d%%_ of their max health from adjacent enemies every turn (against bosses and minibosses, half the percentage and at most _%5$d_). When it ends, his max health returns to normal without killing him.
champions.guardian.furyofsands.desc_short=grows into a giant: more health, armor and a sandstorm.
champions.guardian.furyofsands$fury.name=fury of the sands
champions.guardian.furyofsands$fury.desc=The Guardian is a giant of the desert.\n\nExtra max health: _%1$d_\nStorm: _%2$d + %3$d%%_ of the max health of every adjacent enemy per turn.\nExtra armor: _0-%4$d_\nSiphoning Strike recharges twice as fast.\n\nTurns remaining: %5$d.

###armor ability
champions.guardian.sandtomb.name=sand tomb
champions.guardian.sandtomb.short_desc=The sands open under a _5x5_ area and bury the enemies: damage, _rooted_ and _weakened_.
champions.guardian.sandtomb.desc=Choose a tile within 7 tiles: the sands open under a _5x5_ area. Enemies inside take _4 + half the level_ to _9 + the level_ damage, are _rooted for 3 turns_ and _weakened for 6 turns_ (they deal 33% less damage).
champions.guardian.sandtomb.prompt=Choose where to bury the enemies
champions.guardian.sandtomb.too_far=That is too far or out of sight.
champions.guardian.sandtomb.bad_cell=The tomb can't open there.
