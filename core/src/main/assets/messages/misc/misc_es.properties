challenges.no_food=A dieta
challenges.no_food_desc=¡La comida ya es escasa, pero también tendrás que controlar tus porciones!\n\n- La comida y el cuerno de saciedad son un tercio de efectivos en satisfacer el hambre.\n- Otras fuentes de saciedad no son afectadas.
challenges.no_armor=La fe es mi armadura
challenges.no_armor_desc=¡Vas a necesitar fe en ti mismo, ya que tu armadura no hará mucho!\n\n- La capacidad de bloqueo base de todas las armaduras es reducida, excepto por la armadura de tela.\n- Todas las armaduras ahora obtienen muy poco bloqueo cuando las mejoras.\n- La defensa del guardián de tierra también es reducida significativamente.
challenges.no_healing=Farmacofobia
challenges.no_healing_desc=Las pociones curativas sí que son útiles, lamentablemente, ¡eres alérgico!\n\n- Las pociones de curación, ítems que usan pociones de curación en su receta y la bayasol envenenarán al héroe en lugar de curarlo.\n- Las infusiones inestables no podrán curar o envenenar al héroe de forma aleatoria.\n- Estos ítems aún funcionarán normalmente para otros personajes.
challenges.no_herbalism=Tierra estéril
challenges.no_herbalism_desc=Parece que no queda agua limpia en esta mazmorra maldita...\n\n- Gotas de rocío son eliminadas.\n- Plantas son eliminadas.\n- Semillas seguirán apareciendo, pero no crecerán.
challenges.swarm_intelligence=Enjambre
challenges.swarm_intelligence_desc=¡Ten cuidado, los monstruos se vuelven mas listos!\n\n- Mientras un enemigo te mira a ti o a tus aliados, empezaran a atraerse entre hasta tu posición.\n- El rango empieza siendo 2 casillas, pero aumenta en 2 cada turno que el enemigo te este viendo, hasta 12 casillas.\n- Romper su visión contigo resetea el rango, incluso algo tan pequeño como una puerta.
challenges.darkness=En la oscuridad
challenges.darkness_desc=¡Es una mazmorra después de todo!\n\n- Distancia de visión regular reducida dramáticamente.\n- Una antorcha aparece en cada piso.\n- Otras fuentes de luz son 1/5 de eficaces.
challenges.no_scrolls=Runas prohibidas
challenges.no_scrolls_desc=Una cierta runa es más difícil de encontrar. Desafortunadamente, siempre es la más útil.\n\n- La mitad de los pergaminos de mejora son eliminados.
challenges.champion_enemies=Campeones hostiles
challenges.champion_enemies_desc=¡No eres el único que puede subir de nivel!\n\nLos enemigos regulares tienen 1/8 posibilidades de aparecer con un efecto especial de campeón en el piso 1, escalando hasta 1/6 en el piso 21.\n-Los campeones se despertarán si aparecen dormidos.\n-El héroe sabe cuando un campeón aparece.\n-Los campeones no pueden ser convertidos en aliados.\n\nHay seis tipos de campeones enemigos:\n_Flameante (Naranja):_ +25% de daño cuerpo a cuerpo, enciende fuego al golpear, esparce flamas al morir, no puede incendiar casillas con agua.\n_Proyectivo (Purpura):_ +25% de daño cuerpo a cuerpo, +3 rango cuerpo a cuerpo.\n_Anti Mágico (Verde):_ -50% daño recibido, inmune a los efectos mágicos.\n_Gigante (Azul):_ -80% daño recibido, +1 rango cuerpo a cuerpo, no puede moverse por túneles.\n_Bendecido (Amarillo):_ x4 de precisión y evasión.\n_Creciente (Rojo):_ +20% de precisión, evasión, daño y PS efectivos. Aumenta en 1% cada 4 turnos.
challenges.stronger_bosses=Jefes más malotes
challenges.stronger_bosses_desc=Los jefes son mucho más difíciles con este desafío!\n\n_Goo:_ +20% de salud.\n_-_ Su curación sobre el agua incrementa hasta 3/turno.\n_-_ Se bombea en 1 turno en lugar de 2.\n_Tengu:_ +25% de salud.\n_-_ Fase 1: las trampas son más letales.\n_-_ Fase 2: sus habilidades son más frecuentes.\n_DM-300:_ +33% de salud.\n_-_ Las torres de energía son más resistentes y se activan 3.\n_-_ Sus habilidades son más poderosas y frecuentes.\n_-_ El DM-300 es más rápido cuando esta supercargado.\n_-_ Los cables expuestos son dos veces más comunes.\n_Rey Enano:_ +50% de salud.\n_-_ Los súbditos son más fuertes en todas las fases.\n_-_ Fase 1: habilidades e invocaciones más rápidas.\n_-_ Fase 2: 2 súbditos más por ronda.\n_-_ Fase 3: 2x de salud, invocaciones más rápidas.\n_Yog-Dzewa:_\n_-_ ¡Dos puños invocados al mismo tiempo!\n_-_ Su laser inflige +60% de daño.\n_-_ Súbditos más fuertes.

