#Rift: Rift Crawler and Crimson Ancestor (es)

###Reptante de la Grieta (piso 10, con Tengu)
rift.riftherald.name=Reptante de la Grieta
rift.riftherald.desc=Una criatura de la Grieta, mitad escarabajo y mitad cangrejo, con un ojo violeta en la espalda. Sus golpes quitan además un _%1$d %%_ de la vida actual del objetivo (hasta %2$d).\n\nCada pocos turnos se abre el _Ojo del Pozo_ de su espalda: el siguiente golpe de un héroe hace _%3$d de daño verdadero_ y lo cierra.\n\nAntes de una _Embestida_ marca una línea durante dos turnos; luego salta por ella, golpea con el doble de fuerza a quien esté en medio y lo aparta a un lado. Al bajar de dos tercios y de un tercio de su vida, lanza un _Zarpazo_ en cono que avisa un turno antes.
rift.riftherald.eye_open=¡Ojo abierto!
rift.riftherald.eye_hit=¡Ojo del Pozo!
rift.riftherald.charge_warn=¡El Reptante de la Grieta agacha la cabeza y se prepara para embestir!
rift.riftherald.swipe_warn=¡El Reptante de la Grieta alza las garras!
rift.riftherald.swipe_status=¡Zarpazo!
rift.riftherald.leaves=Tengu ha caído: el Reptante de la Grieta vuelve a la Grieta y deja atrás sus ojos.
rift.riftherald$baroneye.name=Ojo del Pozo
rift.riftherald$baroneye.desc=El ojo de la espalda del Reptante está abierto. El siguiente golpe de un héroe hace _%1$d de daño verdadero_ y lo cierra durante %2$d turnos.

###Ojo del Reptante (recompensa)
rift.heraldeye.name=ojo del Reptante
rift.heraldeye.ac_summon=INVOCAR
rift.heraldeye.desc=El ojo violeta del Reptante de la Grieta todavía late. Si lo rompes, el Reptante vuelve como aliado durante _%1$d turnos_.\n\nAquí tendría _%2$d PS_ y haría _%3$d-%4$d de daño_ por golpe. Cada pocos turnos embiste en línea contra los enemigos (_%5$d-%6$d de daño_ a cada uno), pero cada embestida le quita un _%7$d %%_ de su vida actual.\n\nSu vida y su daño dependen de la profundidad a la que lo invoques.
rift.heraldeye.no_space=Aquí no hay sitio para el Reptante.
rift.heraldeye.summoned=¡El Reptante de la Grieta responde a la llamada!

###Reptante aliado
rift.heraldally.name=Reptante aliado
rift.heraldally.desc=El Reptante de la Grieta lucha de tu lado. Cada pocos turnos embiste en línea y hace _%1$d-%2$d de daño_ a cada enemigo del camino, pero cada embestida le quita un _%3$d %%_ de su vida actual.
rift.heraldally.desc_time=Volverá a la Grieta dentro de %d turnos.
rift.heraldally.charge=¡Embestida!
rift.heraldally.fades=El Reptante aliado vuelve a la Grieta.

###Ancestro Carmesí (piso 15, con DM-300)
rift.atakhan.name=Ancestro Carmesí
rift.atakhan.desc=El ancestro ígneo: un demonio antiguo nacido de la sangre derramada en la Grieta. Sus golpes quitan además un _%1$d %%_ de la vida actual del objetivo.\n\n_Ráfaga de sangre:_ dispara %2$d proyectiles de sangre en dos turnos a los héroes que estén a %3$d casillas o menos (_%4$d-%5$d de daño_ cada uno).\n\n_Anillos de ruina:_ de él brotan anillos que crecen hasta %6$d casillas, uno por turno; las casillas del siguiente anillo se marcan antes. Quien esté en el anillo cuando estalla recibe _%7$d-%8$d de daño_ más un _%9$d %%_ de su vida actual.\n\n_Frágil e indigno:_ sus golpes y sus proyectiles dejan acumulaciones (hasta %10$d) que debilitan tu armadura contra él.
rift.atakhan.burst_warn=¡El Ancestro Carmesí reúne sangre para una ráfaga!
rift.atakhan.burst_status=¡Ráfaga de sangre!
rift.atakhan.rings_warn=¡Anillos de ruina brotan del Ancestro Carmesí!
rift.atakhan$fragile.name=frágil e indigno
rift.atakhan$fragile.desc=El Ancestro Carmesí te ha marcado: cada acumulación te quita 1 punto de armadura contra cualquier golpe.\n\nAcumulaciones: _%1$d de %2$d_.\nTurnos restantes: %3$s.
rift.atakhan$ruinrings.name=anillos de ruina

###Lirio de sangre (recompensa)
rift.bloodrose.name=lirio de sangre
rift.bloodrose.ac_absorb=ABSORBER
rift.bloodrose.desc=Un lirio que brotó de la sangre del Ancestro Carmesí. Si lo absorbes, obtienes la _Purificación espiritual_ para el resto de la partida: cuando matas a un enemigo, estalla una bendición a %1$d casillas a su alrededor que quita un _%2$d %%_ de la vida actual a los enemigos cercanos y los ralentiza durante %3$d turnos.\n\nAdemás, tu vida máxima sube un _%4$d %%_ (una sola vez).
rift.bloodrose.absorbed=El lirio se deshace en tus manos y su sangre te purifica.
rift.bloodrose$purification.name=purificación espiritual
rift.bloodrose$purification.desc=Cuando matas a un enemigo en tu turno (golpes, armas arrojadizas, varitas, habilidades...), estalla una bendición a %1$d casillas a su alrededor: quita a los enemigos cercanos un _%2$d %%_ de su vida actual (hasta %3$d; la mitad a los jefes) y los ralentiza durante %4$d turnos. Nunca los mata.
rift.bloodrose$mark.name=marca de purificación
