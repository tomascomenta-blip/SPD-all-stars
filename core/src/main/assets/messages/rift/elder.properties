#Rift: Primeval Dragon and Pit Worm

###Primeval Dragon (depth 20)
rift.elderdragon.name=Primeval Dragon
rift.elderdragon.desc=The oldest of the dragons of the Rift, wrapped in purple flames that burn even what fire can't touch.\n\nEvery few turns it draws breath and _marks a cone_ in front of it: whoever is still there on its next turn gets burned by the _ancestral breath_.\n\nIts bites and its breath leave the _ancestral mark_. When the mark runs out, whoever carries it _below 20% health is executed_. Heal up before that happens!
rift.elderdragon.flight=The Primeval Dragon takes flight and the gust throws you back!
rift.elderdragon.breath_warn=The Primeval Dragon draws in a deep breath...
rift.elderdragon.breath_kill=The ancestral breath burned you to ash...

rift.elderburn.name=Ancestral burn
rift.elderburn.desc=Purple flames of the Primeval Dragon. Water doesn't put them out, and they burn even those who are immune to fire.\n\nDamage per turn: %1$d.\nTurns left: %2$s.
rift.elderburn.ondeath=The ancestral flames consumed you...
rift.elderburn.rankings_desc=Consumed by ancestral flames

rift.eldermark.name=Ancestral mark
rift.eldermark.desc=The Primeval Dragon has marked this character for execution.\n\nWhen the mark runs out, if it has less than _%1$d health_ (%2$d%% of its maximum), it will be executed. New hits don't extend the mark: heal up in time!\n\nTurns left: %3$s.
rift.eldermark.executed=Executed!
rift.eldermark.executed_log=The Primeval Dragon executes %s!

rift.elderblade.name=blade of the Primeval Dragon
rift.elderblade.desc=A long blade made from a fang of the Primeval Dragon, still warm with its purple fire.\n\nEvery hit sets the enemy on _ancestral fire_ (%3$d damage per turn for %4$d turns). Enemies left below _%1$d%% of their health_ after a hit are _executed_ (bosses, below %2$d%%). The execution threshold grows with every upgrade, up to 30%%.
rift.elderblade.executed=Executed!
rift.elderblade.ability_name=ancestral cleave
rift.elderblade.typical_ability_desc=The Duelist can _cleave_ an enemy with the blade of the Primeval Dragon. This typically deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Duelist can use cleave again within 5 turns for free.
rift.elderblade.ability_desc=The Duelist can _cleave_ an enemy with the blade of the Primeval Dragon. This deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Duelist can use cleave again within 5 turns for free.

###Pit Worm (depth 25)
rift.baronnashor.name=Pit Worm
rift.baronnashor.desc=A colossal void worm that never leaves its pit. It bites whoever comes close and spits at anything up to 4 cells away.\n\nWith every attack it also spits a glob of _void corruption_ at the hero with the fewest stacks: each stack takes away armor.\n\nIt marks the ground before its strongest blows: _three pools of acid_ in a cone, which hurt and slow down, and a _tentacle_ that rises under a hero, hurting and stunning everything around.\n\nWhoever defeats it gets the _Boon of the Pit_: allies of the party grow bigger and stronger for the rest of the adventure.
rift.baronnashor.recoil=The Pit Worm rises from its pit and the shockwave throws you back!
rift.baronnashor.tentacle_warn=The ground trembles: a tentacle is about to burst out!
rift.baronnashor.tentacle_kill=The tentacle of the Pit Worm crushed you...
rift.baronnashor.acid_warn=The Pit Worm gathers acid in its maw...
rift.baronnashor.acid_kill=The acid of the Pit Worm dissolved you...
rift.baronnashor.spit_kill=The void corruption swallowed you...
rift.baronnashor.reward=The Pit Worm falls! The Boon of the Pit rests on the party: your allies grow bigger and stronger.

rift.baroncorruption.name=Void corruption
rift.baroncorruption.desc=The spit of the Pit Worm eats away at the armor.\n\nEach stack takes away 1 point of armor against every attack (never more than the armor usually blocks).\n\nStacks: %1$d of %2$d.\nTurns left: %3$s (each new stack refreshes them).

rift.baronacid.desc=A pool of acid left by the Pit Worm is bubbling here. Whoever stands in it is slowed down.

rift.baronempowered.name=Boon of the Pit
rift.baronempowered.desc=Empowered by the Boon of the Pit: _%1$d%% bigger_, with %1$d%% more max health and damage, and %2$d%% more accuracy and evasion.
rift.baronempowered.empowered=Boon of the Pit!

rift.handofbaron.name=Boon of the Pit
rift.handofbaron.desc=You have defeated the Pit Worm, and its power is now on your side for the rest of the adventure.\n\nEvery ally of the party on the floor (summons, pets, clones, the ghost, corrupted enemies...) becomes _%1$d%% bigger_, with %1$d%% more max health and damage, and %2$d%% more accuracy and evasion.
