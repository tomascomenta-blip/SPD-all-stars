#Rift: elemental drakes and their armors (es)

rift.drake.name=dragón elemental
rift.drake.name_0=Dragón de brasas
rift.drake.name_1=Dragón de las mareas
rift.drake.name_2=Dragón del vendaval
rift.drake.name_3=Dragón de piedra
rift.drake.name_4=Dragón arcano
rift.drake.name_5=Dragón alquímico
rift.drake.desc_0=Un dragón de fuego de la Grieta. Sus escamas brillan como brasas y lanza bolas de fuego que estallan en un área amplia y prenden fuego a todo lo que alcanzan.
rift.drake.desc_1=Un dragón de agua de la Grieta. Lanza proyectiles de marea que ralentizan a quien golpean, y el agua vuelve a él para cerrarle las heridas. Además, se regenera poco a poco.
rift.drake.desc_2=Un dragón de viento de la Grieta. Es muy rápido y difícil de golpear, y sus ráfagas empujan lejos todo lo que tiene delante.
rift.drake.desc_3=Un dragón de piedra de la Grieta. Su piel rocosa detiene casi todos los golpes, y cuando da un pisotón aturde a todo lo que lo rodea.
rift.drake.desc_4=Un dragón de energía arcana de la Grieta. Sus rayos saltan de una criatura a otra y las ralentizan.
rift.drake.desc_5=Un dragón mutado por sustancias químicas de la Grieta. Arroja frascos que dejan una nube tóxica y, cuando está a punto de caer, se niega a morir durante unos turnos.
rift.drake.desc_common=Cada pocos turnos prepara un ataque especial: las casillas marcadas recibirán el golpe en su siguiente turno, así que sal de ellas. Sus ataques dañan a todo lo que haya dentro, también a Gú, y un jefe herido por el otro puede volverse contra él durante un rato.
rift.drake.warn_0=¡%s prepara una bola de fuego!
rift.drake.warn_1=¡%s prepara un proyectil de marea!
rift.drake.warn_2=¡%s bate las alas!
rift.drake.warn_3=¡%s se alza para dar un pisotón!
rift.drake.warn_4=¡%s chisporrotea de energía!
rift.drake.warn_5=¡%s prepara un frasco tóxico!
rift.drake.zombie=¡%s se niega a morir!
rift.drake.zombie_status=zombi
rift.drake.kill=%s te ha matado...
rift.drake.defeated=¡%s cae derrotado!

rift.drakearmor.effect_0=_Alma de brasas:_ mientras la llevas eres _inmune a las quemaduras_, y los enemigos que te golpean cuerpo a cuerpo tienen un _%d%%_ de probabilidad de prenderse fuego.
rift.drakearmor.effect_1=_Alma de las mareas:_ mientras la llevas regeneras _1 punto de vida extra cada %s turnos_, además de tu regeneración normal.
rift.drakearmor.effect_2=_Alma del vendaval:_ mientras la llevas te mueves un _%1$d%% más rápido_ y tu evasión es un _%2$d%% mayor_.
rift.drakearmor.effect_3=_Alma de piedra:_ esta armadura bloquea hasta _%1$d puntos de daño más_. Un golpe de al menos una quinta parte de tu vida máxima te da un _escudo_ de una décima parte de tu vida máxima _+ %2$d_, como mucho una vez cada %3$d turnos.
rift.drakearmor.effect_4=_Alma arcana:_ los enemigos que te golpean tienen 1 posibilidad entre 3 de recibir una descarga de _%1$d-%2$d de daño_.
rift.drakearmor.effect_5=_Alma alquímica:_ los estados negativos (ceguera, lentitud, debilidad, parálisis, congelación...) _te duran la mitad_, y el veneno, el ácido y las hemorragias te hacen la mitad de daño. Por debajo de la mitad de tu vida recibes un _%d%% más de curación_.

rift.drakearmor$infernal.name=armadura del dragón de brasas
rift.drakearmor$infernal.desc=Armadura forjada con las escamas de un dragón de brasas. Es pesada y aún está tibia al tacto.
rift.drakearmor$ocean.name=armadura del dragón de las mareas
rift.drakearmor$ocean.desc=Armadura forjada con las escamas de un dragón de las mareas. El agua se perla sobre ella y nunca parece secarse.
rift.drakearmor$cloud.name=armadura del dragón del vendaval
rift.drakearmor$cloud.desc=Armadura hecha con las escamas de un dragón del vendaval. Es sorprendentemente ligera para lo resistente que es, y el viento parece empujarte.
rift.drakearmor$mountain.name=armadura del dragón de piedra
rift.drakearmor$mountain.desc=Armadura hecha con las placas rocosas de un dragón de piedra. Pesa tanto como aparenta.
rift.drakearmor$hextech.name=armadura del dragón arcano
rift.drakearmor$hextech.desc=Armadura hecha con las escamas de un dragón arcano. Por su superficie corren chispas arcanas.
rift.drakearmor$chemtech.name=armadura del dragón alquímico
rift.drakearmor$chemtech.desc=Armadura hecha con las escamas de un dragón alquímico. De sus juntas se escapa un tenue brillo verde.

rift.drakearmor$soul.name_0=Alma de brasas
rift.drakearmor$soul.name_1=Alma de las mareas
rift.drakearmor$soul.name_2=Alma del vendaval
rift.drakearmor$soul.name_3=Alma de piedra
rift.drakearmor$soul.name_4=Alma arcana
rift.drakearmor$soul.name_5=Alma alquímica
rift.drakearmor$soul.desc_none=El poder de una armadura de dragón.
rift.drakearmor$soul.shield_cd=El escudo volverá a estar listo dentro de %s turnos.
