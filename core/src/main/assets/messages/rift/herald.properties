#Rift: Rift Crawler and Crimson Ancestor

###Rift Crawler (depth 10, with Tengu)
rift.riftherald.name=Rift Crawler
rift.riftherald.desc=A creature of the Rift, half beetle and half crab, with a violet eye on its back. Its hits also take _%1$d%%_ of the target's current health (up to %2$d).\n\nEvery few turns the _Eye of the Pit_ on its back opens: the next hit of a hero deals _%3$d true damage_ and closes it.\n\nBefore a _Charge_ it marks a line for two turns; then it leaps along it, hits whoever stands in the way twice as hard and shoves them aside. When it drops below two thirds and one third of its health, it lashes out with a _Swipe_ in a cone, announced one turn before.
rift.riftherald.eye_open=Eye open!
rift.riftherald.eye_hit=Eye of the Pit!
rift.riftherald.charge_warn=The Rift Crawler lowers its head and gets ready to charge!
rift.riftherald.swipe_warn=The Rift Crawler raises its claws!
rift.riftherald.swipe_status=Swipe!
rift.riftherald.leaves=Tengu has fallen: the Rift Crawler goes back into the Rift and leaves its eyes behind.
rift.riftherald$baroneye.name=Eye of the Pit
rift.riftherald$baroneye.desc=The eye on the Crawler's back is open. The next hit of a hero deals _%1$d true damage_ and closes it for %2$d turns.

###Eye of the Crawler (reward)
rift.heraldeye.name=Eye of the Crawler
rift.heraldeye.ac_summon=SUMMON
rift.heraldeye.desc=The violet eye of the Rift Crawler still throbs. Break it and the Crawler comes back as your ally for _%1$d turns_.\n\nHere she would have _%2$d HP_ and deal _%3$d-%4$d damage_ per hit. Every few turns she charges along a line through the enemies (_%5$d-%6$d damage_ to each one), but every charge costs her _%7$d%%_ of her current health.\n\nHer health and damage depend on the depth where you summon her.
rift.heraldeye.no_space=There is no room for the Crawler here.
rift.heraldeye.summoned=The Rift Crawler answers the call!

###allied Crawler
rift.heraldally.name=allied Crawler
rift.heraldally.desc=The Rift Crawler fights on your side. Every few turns she charges along a line and deals _%1$d-%2$d damage_ to every enemy in the way, but every charge costs her _%3$d%%_ of her current health.
rift.heraldally.desc_time=She will go back into the Rift in %d turns.
rift.heraldally.charge=Charge!
rift.heraldally.fades=The allied Crawler goes back into the Rift.

###Crimson Ancestor (depth 15, with DM-300)
rift.atakhan.name=Crimson Ancestor
rift.atakhan.desc=The fiery ancestor: an ancient demon born from the blood spilled on the Rift. His hits also take _%1$d%%_ of the target's current health.\n\n_Blood burst:_ he fires %2$d bolts of blood in two turns at the heroes up to %3$d cells away (_%4$d-%5$d damage_ each).\n\n_Rings of ruin:_ rings grow from him up to %6$d cells, one per turn; the cells of the next ring are marked first. Whoever stands on a ring when it bursts takes _%7$d-%8$d damage_ plus _%9$d%%_ of their current health.\n\n_Fragile and unworthy:_ his hits and bolts leave stacks (up to %10$d) that weaken your armor against him.
rift.atakhan.burst_warn=The Crimson Ancestor gathers blood for a burst!
rift.atakhan.burst_status=Blood burst!
rift.atakhan.rings_warn=Rings of ruin spread from the Crimson Ancestor!
rift.atakhan$fragile.name=fragile and unworthy
rift.atakhan$fragile.desc=The Crimson Ancestor has marked you: each stack takes 1 point of your armor away against any hit.\n\nStacks: _%1$d of %2$d_.\nTurns left: %3$s.
rift.atakhan$ruinrings.name=rings of ruin

###Blood lily (reward)
rift.bloodrose.name=blood lily
rift.bloodrose.ac_absorb=ABSORB
rift.bloodrose.desc=A lily that sprouted from the Crimson Ancestor's blood. Absorb it and you get _Spiritual purification_ for the rest of the run: when you kill an enemy, a blessing bursts %1$d cells around it that takes _%2$d%%_ of the current health of the enemies nearby and slows them for %3$d turns.\n\nIt also raises your maximum health by _%4$d%%_ (once).
rift.bloodrose.absorbed=The lily crumbles in your hands and its blood purifies you.
rift.bloodrose$purification.name=spiritual purification
rift.bloodrose$purification.desc=When you kill an enemy on your turn (hits, thrown weapons, wands, abilities...), a blessing bursts %1$d cells around it: it takes _%2$d%%_ of the current health of the enemies nearby (up to %3$d, half against bosses) and slows them for %4$d turns. It never kills them.
rift.bloodrose$mark.name=mark of purification
