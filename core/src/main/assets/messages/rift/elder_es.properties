#Rift: Primeval Dragon and Pit Worm (es)

###Primeval Dragon (depth 20)
rift.elderdragon.name=Dragón primigenio
rift.elderdragon.desc=El más antiguo de los dragones de la Grieta, envuelto en llamas moradas que queman hasta lo que el fuego no puede tocar.\n\nCada pocos turnos toma aire y _marca un cono_ delante de él: quien siga allí en su siguiente turno arderá con el _aliento ancestral_.\n\nSus mordiscos y su aliento dejan la _marca ancestral_. Cuando la marca se acaba, quien la lleve _por debajo del 20% de vida es ejecutado_. ¡Cúrate antes de que pase!
rift.elderdragon.flight=¡El Dragón primigenio alza el vuelo y la ráfaga te echa hacia atrás!
rift.elderdragon.breath_warn=El Dragón primigenio toma aire...
rift.elderdragon.breath_kill=El aliento ancestral te ha reducido a cenizas...

rift.elderburn.name=Quemadura ancestral
rift.elderburn.desc=Llamas moradas del Dragón primigenio. El agua no las apaga y queman incluso a quien es inmune al fuego.\n\nDaño por turno: %1$d.\nTurnos restantes: %2$s.
rift.elderburn.ondeath=Las llamas ancestrales te han consumido...
rift.elderburn.rankings_desc=Consumido por las llamas ancestrales

rift.eldermark.name=Marca ancestral
rift.eldermark.desc=El Dragón primigenio ha marcado a este personaje para ejecutarlo.\n\nCuando la marca se acabe, si tiene menos de _%1$d de vida_ (el %2$d%% de su máximo), será ejecutado. Los golpes nuevos no alargan la marca: ¡cúrate a tiempo!\n\nTurnos restantes: %3$s.
rift.eldermark.executed=¡Ejecutado!
rift.eldermark.executed_log=¡El Dragón primigenio ejecuta a %s!

rift.elderblade.name=hoja del Dragón primigenio
rift.elderblade.desc=Una hoja larga hecha con un colmillo del Dragón primigenio, todavía caliente por su fuego morado.\n\nCada golpe prende al enemigo con _fuego ancestral_ (%3$d de daño por turno durante %4$d turnos). Los enemigos que queden por debajo del _%1$d%% de su vida_ tras un golpe son _ejecutados_ (los jefes, por debajo del %2$d%%). El umbral de ejecución sube con cada mejora, hasta el 30%%.
rift.elderblade.executed=¡Ejecutado!
rift.elderblade.ability_name=tajo ancestral
rift.elderblade.typical_ability_desc=La Duelista puede dar un _tajo_ a un enemigo con la hoja del Dragón primigenio. Esto normalmente causaría _%1$d-%2$d de daño_ y está garantizado a golpear. Si el tajo mata a un enemigo, la acción es instantánea y la Duelista puede volver a usarlo en los próximos 5 turnos sin ningún coste.
rift.elderblade.ability_desc=La Duelista puede dar un _tajo_ a un enemigo con la hoja del Dragón primigenio. Esto causa _%1$d-%2$d de daño_ y está garantizado a golpear. Si el tajo mata a un enemigo, la acción es instantánea y la Duelista puede volver a usarlo en los próximos 5 turnos sin ningún coste.

###Pit Worm (depth 25)
rift.baronnashor.name=Gusano del Pozo
rift.baronnashor.desc=Un gusano colosal del Vacío que nunca sale de su foso. Muerde a quien se acerca y escupe a todo lo que esté a 4 casillas o menos.\n\nCon cada ataque escupe además un pegote de _corrupción del Vacío_ al héroe que tenga menos acumulaciones: cada una le quita armadura.\n\nMarca el suelo antes de sus golpes más fuertes: _tres charcos de ácido_ en cono, que hieren y ralentizan, y un _tentáculo_ que surge bajo un héroe, hiere y aturde todo lo que hay alrededor.\n\nQuien lo derrote recibe la _Favor del Pozo_: los aliados del grupo se vuelven más grandes y más fuertes durante el resto de la aventura.
rift.baronnashor.recoil=¡El Gusano del Pozo surge de su foso y la onda te echa hacia atrás!
rift.baronnashor.tentacle_warn=El suelo tiembla: ¡está a punto de salir un tentáculo!
rift.baronnashor.tentacle_kill=El tentáculo del Gusano del Pozo te ha aplastado...
rift.baronnashor.acid_warn=El Gusano del Pozo acumula ácido en las fauces...
rift.baronnashor.acid_kill=El ácido del Gusano del Pozo te ha disuelto...
rift.baronnashor.spit_kill=La corrupción del Vacío te ha engullido...
rift.baronnashor.reward=¡Cae el Gusano del Pozo! El Favor del Pozo se posa sobre el grupo: vuestros aliados se vuelven más grandes y más fuertes.

rift.baroncorruption.name=Corrupción del Vacío
rift.baroncorruption.desc=El escupitajo del Gusano del Pozo corroe la armadura.\n\nCada acumulación quita 1 punto de armadura contra cualquier ataque (nunca más de lo que la armadura suele parar).\n\nAcumulaciones: %1$d de %2$d.\nTurnos restantes: %3$s (cada acumulación nueva los renueva).

rift.baronacid.desc=Aquí burbujea un charco de ácido del Gusano del Pozo. Quien se meta en él irá más lento.

rift.baronempowered.name=Favor del Pozo
rift.baronempowered.desc=Potenciado por el Favor del Pozo: un _%1$d%% más grande_, con un %1$d%% más de vida máxima y de daño, y un %2$d%% más de precisión y de evasión.
rift.baronempowered.empowered=¡Favor del Pozo!

rift.handofbaron.name=Favor del Pozo
rift.handofbaron.desc=Habéis derrotado al Gusano del Pozo, y su poder está ahora de vuestro lado durante el resto de la aventura.\n\nCada aliado del grupo que haya en el piso (invocaciones, mascotas, clones, el fantasma, enemigos corrompidos...) se vuelve un _%1$d%% más grande_, con un %1$d%% más de vida máxima y de daño, y un %2$d%% más de precisión y de evasión.
