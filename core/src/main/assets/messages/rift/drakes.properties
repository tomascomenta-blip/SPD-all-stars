#Rift: elemental drakes and their armors

rift.drake.name=elemental drake
rift.drake.name_0=Ember Drake
rift.drake.name_1=Tide Drake
rift.drake.name_2=Gale Drake
rift.drake.name_3=Stone Drake
rift.drake.name_4=Arcane Drake
rift.drake.name_5=Alchemical Drake
rift.drake.desc_0=A drake of fire from the Rift. Its scales glow like embers, and it hurls fireballs that burst over a wide area and set everything they reach ablaze.
rift.drake.desc_1=A drake of water from the Rift. It hurls tidal bolts that slow whoever they hit, and the water flows back to it to close its wounds. It also regenerates little by little.
rift.drake.desc_2=A drake of wind from the Rift. It is very fast and hard to hit, and its gusts blow away everything in front of it.
rift.drake.desc_3=A drake of stone from the Rift. Its rocky hide stops most blows, and when it stomps on the ground it stuns everything around it.
rift.drake.desc_4=A drake of arcane energy from the Rift. Its lightning bolts jump from one creature to the next and slow them down.
rift.drake.desc_5=A drake mutated by chemicals from the Rift. It throws flasks that leave a toxic cloud behind, and when it is about to fall it refuses to die for a few turns.
rift.drake.desc_common=Every few turns it prepares a special attack: the marked cells will be hit on its next turn, so step out of them. Its attacks hurt everything inside, Goo included, and a boss hurt by the other one may turn on it for a while.
rift.drake.warn_0=%s is gathering a fireball!
rift.drake.warn_1=%s is drawing in a tidal bolt!
rift.drake.warn_2=%s beats its wings!
rift.drake.warn_3=%s rears up to stomp on the ground!
rift.drake.warn_4=%s crackles with energy!
rift.drake.warn_5=%s readies a toxic flask!
rift.drake.zombie=%s refuses to die!
rift.drake.zombie_status=undying
rift.drake.kill=%s killed you...
rift.drake.defeated=%s falls!

rift.drakearmor.effect_0=_Ember soul:_ while you wear it you are _immune to burning_, and enemies that hit you in melee have a _%d%%_ chance to catch fire.
rift.drakearmor.effect_1=_Tide soul:_ while you wear it you regenerate _1 extra health every %s turns_, on top of your normal regeneration.
rift.drakearmor.effect_2=_Gale soul:_ while you wear it you move _%1$d%% faster_ and your evasion is _%2$d%% higher_.
rift.drakearmor.effect_3=_Stone soul:_ this armor blocks up to _%1$d more damage_. A hit of at least a fifth of your max health gives you a _shield_ of a tenth of your max health _+ %2$d_, at most once every %3$d turns.
rift.drakearmor.effect_4=_Arcane soul:_ enemies that hit you have a 1 in 3 chance to be struck by lightning for _%1$d-%2$d damage_.
rift.drakearmor.effect_5=_Alchemical soul:_ negative effects (blindness, slowness, weakness, paralysis, frost...) _last half as long_ on you, and poison, acid and bleeding hurt you half as much. Below half health you receive _%d%% more healing_.

rift.drakearmor$infernal.name=ember drake armor
rift.drakearmor$infernal.desc=Armor forged from the scales of an ember drake. It is heavy and still warm to the touch.
rift.drakearmor$ocean.name=tide drake armor
rift.drakearmor$ocean.desc=Armor forged from the scales of an tide drake. Water beads on it and it never seems to dry.
rift.drakearmor$cloud.name=gale drake armor
rift.drakearmor$cloud.desc=Armor made from the scales of a gale drake. It is surprisingly light for how tough it is, and the wind seems to push you along.
rift.drakearmor$mountain.name=stone drake armor
rift.drakearmor$mountain.desc=Armor made from the rocky plates of a stone drake. It is as heavy as it looks.
rift.drakearmor$hextech.name=arcane drake armor
rift.drakearmor$hextech.desc=Armor made from the scales of a arcane drake. Arcane sparks run across its surface.
rift.drakearmor$chemtech.name=alchemical drake armor
rift.drakearmor$chemtech.desc=Armor made from the scales of a alchemical drake. A faint green glow seeps from its joints.

rift.drakearmor$soul.name_0=Ember soul
